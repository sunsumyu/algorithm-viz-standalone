  <script>
    // 演化阶段配置定义
    // 演化阶段配置定义 (包含 顺推正序 与 逆推倒序 双向算法实现)
    const STAGE_CONFIGS = {
      forward: {
        'stage-1': {
          name: '阶段 1: 朴素递归 (顺推分治)',
          desc: '从终点 (m-1, n-1) 逆推回起点 (0, 0)，展示分治展开与指数级重叠子问题递归树。',
          timeBadge: 'O(2^(m+n))',
          badgeBg: 'bg-slate-100 text-slate-700',
          codeTitle: 'NaiveRecursive.java',
          codeHtml: `<span class="code-line" data-line="1"><span class="text-purple-400">class</span> <span class="text-yellow-300">Solution</span> {</span><span class="code-line" data-line="2">    <span class="text-purple-400">public int</span> <span class="text-blue-400">uniquePaths</span>(<span class="text-purple-400">int</span> m, <span class="text-purple-400">int</span> n) {</span><span class="code-line" data-line="3">        <span class="text-purple-400">return</span> <span class="text-blue-400">dfs</span>(m - <span class="text-amber-300">1</span>, n - <span class="text-amber-300">1</span>);</span><span class="code-line" data-line="4">    }</span><span class="code-line" data-line="5">    <span class="text-purple-400">private int</span> <span class="text-blue-400">dfs</span>(<span class="text-purple-400">int</span> i, <span class="text-purple-400">int</span> j) {</span><span class="code-line" data-line="6">        <span class="text-purple-400">if</span> (i == <span class="text-amber-300">0</span> || j == <span class="text-amber-300">0</span>) {</span><span class="code-line" data-line="7">            <span class="text-purple-400">return</span> <span class="text-amber-300">1</span>;</span><span class="code-line" data-line="8">        }</span><span class="code-line" data-line="9">        <span class="text-purple-400">int</span> left = <span class="text-blue-400">dfs</span>(i, j - <span class="text-amber-300">1</span>);</span><span class="code-line" data-line="10">        <span class="text-purple-400">int</span> up = <span class="text-blue-400">dfs</span>(i - <span class="text-amber-300">1</span>, j);</span><span class="code-line" data-line="11">        <span class="text-purple-400">return</span> left + up;</span><span class="code-line" data-line="12">    }</span><span class="code-line" data-line="13">}</span>`,
          card2Title: '顺推递归调用树 (Recursive Call Tree)',
          card2Desc: '朴素递归无状态缓存，同一子问题分支被反复进入与计算。'
        },
        'stage-2': {
          name: '阶段 2: 记忆化搜索 (顺推 Top-Down)',
          desc: '引入 memo[m][n] 缓存已计算结果，命中缓存直接 O(1) 剪枝返回。',
          timeBadge: 'O(m×n) 剪枝',

    function generateForwardStage3Steps(mVal, nVal) {

        topI: -1, topJ: -1, leftI: -1, leftJ: -1
      });

      // 初始化第一列
      for (let r = 0; r < mVal; r++) {
        dp[r][0] = 1;
        generated.push({
          type: 'boundary',
          i: r, j: 0,
          grid: JSON.parse(JSON.stringify(dp)),
          line: 4,
          log: `| 边界第一列初始化: dp[${r}][0] = 1 (只有 1 条直达路径)`,
          topI: -1, topJ: -1, leftI: -1, leftJ: -1
        });
      }

      // 初始化第一行
      for (let c = 1; c < nVal; c++) {
        dp[0][c] = 1;
        generated.push({
          type: 'boundary',
          i: 0, j: c,
          grid: JSON.parse(JSON.stringify(dp)),

          topI: -1, topJ: -1, leftI: -1, leftJ: -1
        });
      }

      // 递推状态转移
      for (let r = 1; r < mVal; r++) {
        for (let c = 1; c < nVal; c++) {
          const topVal = dp[r - 1][c];
          const leftVal = dp[r][c - 1];
          const sumVal = topVal + leftVal;
          dp[r][c] = sumVal;

          generated.push({
            type: 'update',
            i: r, j: c,
            grid: JSON.parse(JSON.stringify(dp)),
            line: 8,
            log: `| ⚡ 状态转移: dp[${r}][${c}] = dp[${r-1}][${c}](${topVal}) + dp[${r}][${c-1}](${leftVal}) = ${sumVal}`,
            topI: r - 1, topJ: c,
            leftI: r, leftJ: c - 1,
            sumVal, topVal, leftVal
          });
        }
      }

      generated.push({
        type: 'return',
        i: mVal - 1, j: nVal - 1,
        grid: JSON.parse(JSON.stringify(dp)),
        line: 11,

          const rightVal = dp[r][c + 1];
          const sumVal = downVal + rightVal;
          dp[r][c] = sumVal;

          generated.push({
            type: 'update',
            i: r, j: c,
            grid: JSON.parse(JSON.stringify(dp)),
            line: 8,
            log: `| ⚡ 逆推状态转移: dp[${r}][${c}] = 下方(${downVal}) + 右方(${rightVal}) = ${sumVal}`,
            topI: r + 1, topJ: c,
            leftI: r, leftJ: c + 1,
            sumVal, topVal: downVal, leftVal: rightVal
          });
        }
      }

      generated.push({
        type: 'return',
        i: 0, j: 0,
        grid: JSON.parse(JSON.stringify(dp)),
        line: 11,
        log: `| 🏁 逆推填表完成，返回 dp[0][0] = ${dp[0][0]}`,
        topI: -1, topJ: -1, leftI: -1, leftJ: -1
      });

      return generated;
    }

    // ==========================================
    // 阶段 1 & 2：生成递归树与单步快照 (顺推正序)
    // ==========================================
    function generateForwardStage1or2Steps(mVal, nVal, isMemo) {
      const generated = [];
      const memoCache = {};
      const gridState = Array.from({ length: mVal }, () => new Array(nVal).fill(null));
      let callCount = 0;
      let nodeIdCounter = 0;

      function cloneTree(node) {
        if (!node) return null;
        return {
          id: node.id,
          r: node.r,
          c: node.c,
          val: node.val,
          status: node.status,
          tag: node.tag,
          children: node.children ? node.children.map(cloneTree) : []
        };
      }

      const rootNode = {
        id: `node-${++nodeIdCounter}`,
        r: mVal - 1,
        c: nVal - 1,
        val: `dfs(${mVal - 1},${nVal - 1})`,
        status: 'current',
        children: []
      };

      function dfs(r, c, currentTreeNode) {
        callCount++;
        const key = `${r},${c}`;
        const isRepeated = !isMemo && memoCache[key] !== undefined;

        currentTreeNode.status = 'current';
        if (isRepeated) {
          currentTreeNode.tag = '⚠️重复';
        }

        generated.push({
          type: 'dfs-call',
          i: r, j: c,
          grid: JSON.parse(JSON.stringify(gridState)),
          line: isMemo ? 7 : 5,
          log: `| 📥 进入 dfs(i=${r}, j=${c}) [调用 #${callCount}]`,
          topI: -1, topJ: -1, leftI: -1, leftJ: -1,
          activeNodeId: currentTreeNode.id,
          treeRoot: cloneTree(rootNode)
        });

        if (r === 0 || c === 0) {
          gridState[r][c] = 1;
          currentTreeNode.status = 'base';
          currentTreeNode.tag = '= 1';

          generated.push({
            type: 'boundary',
            i: r, j: c,
            grid: JSON.parse(JSON.stringify(gridState)),
            line: isMemo ? 8 : 6,
            log: `| 🎬 边界 Base Case: (i=${r} 或 j=${c})，直达路径 1 条，return 1`,
            topI: -1, topJ: -1, leftI: -1, leftJ: -1,
            activeNodeId: currentTreeNode.id,
            treeRoot: cloneTree(rootNode)
          });
          return 1;
        }

        if (isMemo && memoCache[key] !== undefined) {
          currentTreeNode.status = 'pruned';
          currentTreeNode.tag = `⚡=${memoCache[key]}`;

          generated.push({
            type: 'cache-hit',
            i: r, j: c,
            grid: JSON.parse(JSON.stringify(gridState)),
            line: 9,
            log: `| ⚡ 【备忘录命中剪枝】memo[${r}][${c}] 已有缓存 ${memoCache[key]}！直接 O(1) 返回，跳过子树展开`,
            topI: -1, topJ: -1, leftI: -1, leftJ: -1,
            activeNodeId: currentTreeNode.id,
            treeRoot: cloneTree(rootNode)
          });
          return memoCache[key];
        }

        memoCache[key] = (memoCache[key] || 0) + 1;

        // 向左逆推 dfs(r, c - 1)
        const leftChildNode = {
          id: `node-${++nodeIdCounter}`,
          r: r,
          c: c - 1,
          val: `dfs(${r},${c - 1})`,
          status: 'normal',
          children: []
        };
        currentTreeNode.children.push(leftChildNode);
        const left = dfs(r, c - 1, leftChildNode);

        // 向上逆推 dfs(r - 1, c)
        const upChildNode = {
          id: `node-${++nodeIdCounter}`,
          r: r - 1,
          c: c,
          val: `dfs(${r - 1},${c})`,
          status: 'normal',
          children: []
        };
        currentTreeNode.children.push(upChildNode);
        const up = dfs(r - 1, c, upChildNode);

        const res = left + up;
        if (isMemo) memoCache[key] = res;
        gridState[r][c] = res;

        currentTreeNode.status = 'visited';
        currentTreeNode.tag = `= ${res}`;

        generated.push({
          type: 'update',
          i: r, j: c,
          grid: JSON.parse(JSON.stringify(gridState)),
          line: isMemo ? 12 : 11,
          log: `| ✨ 子问题合并: (${r}, ${c}) = 左(${left}) + 上(${up}) = ${res}${isMemo ? ' [存入备忘录]' : ''}`,
          topI: r - 1, topJ: c,
          leftI: r, leftJ: c - 1,
          activeNodeId: currentTreeNode.id,
          treeRoot: cloneTree(rootNode)
        });

        return res;
      }

      const total = dfs(mVal - 1, nVal - 1, rootNode);

      generated.push({
        type: 'return',
        i: mVal - 1, j: nVal - 1,
        grid: JSON.parse(JSON.stringify(gridState)),
        line: isMemo ? 5 : 3,
        log: `| 🏆 最终答案: uniquePaths(${mVal}, ${nVal}) = ${total}`,
        topI: -1, topJ: -1, leftI: -1, leftJ: -1,
        activeNodeId: rootNode.id,
        treeRoot: cloneTree(rootNode)
      });

      return generated;
    }

    // ==========================================
    // 阶段 1 & 2：生成递归树与单步快照 (逆推倒序)
    // ==========================================
    function generateReverseStage1or2Steps(mVal, nVal, isMemo) {
      const generated = [];
      const memoCache = {};
      const gridState = Array.from({ length: mVal }, () => new Array(nVal).fill(null));
      let callCount = 0;
      let nodeIdCounter = 0;

      function cloneTree(node) {
        if (!node) return null;
        return {
          id: node.id,
          r: node.r,
          c: node.c,
          val: node.val,
          status: node.status,
          tag: node.tag,
          children: node.children ? node.children.map(cloneTree) : []
        };
      }

      const rootNode = {
        id: `node-${++nodeIdCounter}`,
        r: 0,
        c: 0,
        val: `dfs(0,0)`,
        status: 'current',
        children: []
      };

      function dfs(r, c, currentTreeNode) {
        callCount++;
        const key = `${r},${c}`;
        const isRepeated = !isMemo && memoCache[key] !== undefined;

        currentTreeNode.status = 'current';
        if (isRepeated) {
          currentTreeNode.tag = '⚠️重复';
        }

        generated.push({
          type: 'dfs-call',
          i: r, j: c,
          grid: JSON.parse(JSON.stringify(gridState)),
          line: isMemo ? 7 : 5,
          log: `| 📥 进入 dfs(i=${r}, j=${c}) [调用 #${callCount}]`,
          topI: -1, topJ: -1, leftI: -1, leftJ: -1,
          activeNodeId: currentTreeNode.id,
          treeRoot: cloneTree(rootNode)
        });

        if (r === mVal - 1 || c === nVal - 1) {
          gridState[r][c] = 1;
          currentTreeNode.status = 'base';
          currentTreeNode.tag = '= 1';

          generated.push({
            type: 'boundary',
            i: r, j: c,
            grid: JSON.parse(JSON.stringify(gridState)),
            line: isMemo ? 8 : 6,
            log: `| 🎬 边界 Base Case: (i=${r} 或 j=${c}) 到达终点边界，直达路径 1 条，return 1`,
            topI: -1, topJ: -1, leftI: -1, leftJ: -1,
            activeNodeId: currentTreeNode.id,
            treeRoot: cloneTree(rootNode)
          });
          return 1;
        }

        if (isMemo && memoCache[key] !== undefined) {
          currentTreeNode.status = 'pruned';
          currentTreeNode.tag = `⚡=${memoCache[key]}`;

          generated.push({
            type: 'cache-hit',
            i: r, j: c,
            grid: JSON.parse(JSON.stringify(gridState)),
            line: 9,
            log: `| ⚡ 【备忘录命中剪枝】从 (${r}, ${c}) 到终点已有缓存 ${memoCache[key]}！直接 O(1) 返回，跳过子树展开`,
            topI: -1, topJ: -1, leftI: -1, leftJ: -1,
            activeNodeId: currentTreeNode.id,
            treeRoot: cloneTree(rootNode)
          });
          return memoCache[key];
        }

        memoCache[key] = (memoCache[key] || 0) + 1;

        // 向下探索 dfs(r + 1, c)
        const downChildNode = {
          id: `node-${++nodeIdCounter}`,
          r: r + 1,
          c: c,
          val: `dfs(${r + 1},${c})`,
          status: 'normal',
          children: []
        };
        currentTreeNode.children.push(downChildNode);
        const down = dfs(r + 1, c, downChildNode);

        // 向右探索 dfs(r, c + 1)
        const rightChildNode = {
          id: `node-${++nodeIdCounter}`,
          r: r,
          c: c + 1,
          val: `dfs(${r},${c + 1})`,
          status: 'normal',
          children: []
        };
        currentTreeNode.children.push(rightChildNode);
        const right = dfs(r, c + 1, rightChildNode);

        const res = down + right;
        if (isMemo) memoCache[key] = res;
        gridState[r][c] = res;

        currentTreeNode.status = 'visited';
        currentTreeNode.tag = `= ${res}`;

        generated.push({
          type: 'update',
          i: r, j: c,
          grid: JSON.parse(JSON.stringify(gridState)),
          line: isMemo ? 12 : 9,
          log: `| ✨ 逆推合并: (${r}, ${c}) = 下(${down}) + 右(${right}) = ${res}${isMemo ? ' [存入备忘录]' : ''}`,
          topI: r + 1, topJ: c,
          leftI: r, leftJ: c + 1,
          activeNodeId: currentTreeNode.id,
          treeRoot: cloneTree(rootNode)
        });

        return res;
      }

      const total = dfs(0, 0, rootNode);

      generated.push({
        type: 'return',
        i: 0, j: 0,
        grid: JSON.parse(JSON.stringify(gridState)),
        line: isMemo ? 5 : 3,
        log: `| 🏆 最终答案: uniquePaths(${mVal}, ${nVal}) = ${total}`,
        topI: -1, topJ: -1, leftI: -1, leftJ: -1,
        activeNodeId: rootNode.id,
        treeRoot: cloneTree(rootNode)
      });

      return generated;
    }

    // ==========================================
    // 递归调用树 SVG 渲染器 (根据节点量自适应动态缩放)
    // ==========================================
    function renderRecursionTree(container, root, activeNodeId, isMemo) {
      if (!root) {
        container.innerHTML = '<div class="text-xs text-slate-400 py-6">（暂无递归调用树）</div>';
        return;
      }

      function countLeaves(n) {
        if (!n.children || n.children.length === 0) return 1;
        return n.children.reduce((acc, c) => acc + countLeaves(c), 0);
      }

      function getDepth(n) {
        if (!n.children || n.children.length === 0) return 0;
        return 1 + Math.max(...n.children.map(getDepth));
      }

      const leafCount = countLeaves(root);
      const maxDepth = getDepth(root);

      // 根据树的规模自适应尺寸
      let nodeW = 66;
      let nodeH = 25;
      let minGap = 12;
      let levelH = 50;
      let fontSize = 10.5;
      let tagFontSize = 8;
      const topPad = 26;

      if (leafCount >= 10 || maxDepth >= 4) {
        nodeW = 44;
        nodeH = 19;
        minGap = 6;
        levelH = 38;
        fontSize = 8.5;
        tagFontSize = 7;
      } else if (leafCount >= 6 || maxDepth >= 3) {
        nodeW = 54;
        nodeH = 22;
        minGap = 9;
        levelH = 44;
        fontSize = 9.5;
        tagFontSize = 7.5;
      }

      function measure(n) {
        const ch = n.children || [];
        if (ch.length === 0) {
          return { node: n, width: nodeW + minGap, children: [] };
        }
        const measuredCh = ch.map(measure);
        const sumW = measuredCh.reduce((acc, c) => acc + c.width, 0);
        return { node: n, width: Math.max(nodeW + minGap, sumW), children: measuredCh };
      }

      function assign(mNode, depth, leftX) {
        const x = leftX + mNode.width / 2;
        const y = topPad + depth * levelH;
        let curL = leftX;
        const placedCh = [];
        for (const c of mNode.children) {
          placedCh.push(assign(c, depth + 1, curL));
          curL += c.width;
        }
        return {
          id: mNode.node.id,
          val: mNode.node.val,
          status: mNode.node.status,
          tag: mNode.node.tag,
          x, y,
          width: mNode.width,
          children: placedCh
        };
      }

      const measured = measure(root);
      const totalW = Math.max(340, measured.width + 24);
      const rootPos = assign(measured, 0, (totalW - measured.width) / 2);
      const totalH = Math.max(160, topPad + maxDepth * levelH + 34);

      const lines = [];
      const nodes = [];
      let activeX = null;

      function draw(n) {
        for (const c of n.children) {
          const startX = n.x;
          const startY = n.y + nodeH / 2;
          const endX = c.x;
          const endY = c.y - nodeH / 2;
          const midY = (startY + endY) / 2;

          const isCurrentBranch = (n.id === activeNodeId) || (c.id === activeNodeId);
          const stroke = isCurrentBranch ? '#3b82f6' : '#cbd5e1';
          const strokeW = isCurrentBranch ? '2' : '1.3';
          const strokeDash = c.status === 'pruned' ? '3,3' : 'none';

          lines.push(
            `<path d="M ${startX} ${startY} C ${startX} ${midY}, ${endX} ${midY}, ${endX} ${endY}" fill="none" stroke="${stroke}" stroke-width="${strokeW}" stroke-dasharray="${strokeDash}" />`
          );
          draw(c);
        }

        const isCurrent = n.id === activeNodeId;
        if (isCurrent) activeX = n.x;

        const isBase = n.status === 'base';
        const isPruned = n.status === 'pruned';
        const isRepeated = n.tag && n.tag.includes('重复');
        const isVisited = n.status === 'visited';

        let stroke = '#cbd5e1';
        let strokeW = '1.2';
        let fill = '#ffffff';
        let textColor = '#334155';
        let filterGlow = '';

        if (isCurrent) {
          stroke = '#2563eb';
          strokeW = '2.5';
          fill = '#eff6ff';
          textColor = '#1d4ed8';
          filterGlow = 'filter="drop-shadow(0 0 6px rgba(59, 130, 246, 0.45))"';
        } else if (isPruned) {
          stroke = '#9333ea';
          fill = '#faf5ff';
          textColor = '#7e22ce';
        } else if (isRepeated) {
          stroke = '#d97706';
          fill = '#fffbeb';
          textColor = '#b45309';
        } else if (isBase) {
          stroke = '#16a34a';
          fill = '#f0fdf4';
          textColor = '#15803d';
        } else if (isVisited) {
          stroke = '#10b981';
          fill = '#ffffff';
          textColor = '#047857';
        }

        let badgeHtml = '';
        if (n.tag) {
          const tagBg = isPruned ? '#9333ea' : isRepeated ? '#d97706' : '#10b981';
          const badgeW = Math.min(nodeW - 2, Math.max(26, n.tag.length * 6.5 + 4));
          badgeHtml = `
            <g transform="translate(0, ${nodeH / 2 + 7})">
              <rect x="${-badgeW / 2}" y="-5.5" width="${badgeW}" height="11" rx="3" fill="${tagBg}" />
              <text x="0" y="2.5" text-anchor="middle" fill="#ffffff" font-size="${tagFontSize}" font-weight="700" font-family="JetBrains Mono, monospace">${n.tag}</text>
            </g>
          `;
        }

        // 🐸 青蛙悬浮在节点正上方，绝不遮挡节点文本
        let animalHtml = '';
        if (isCurrent) {
          animalHtml = `
            <g transform="translate(0, ${-nodeH / 2 - 5})">
              <text x="0" y="0" text-anchor="middle" font-size="${Math.max(12, fontSize + 3)}" class="animal-frog select-none">🐸</text>
            </g>
          `;
        }

        nodes.push(`
          <g transform="translate(${n.x}, ${n.y})" ${filterGlow}>
            <rect x="${-nodeW / 2}" y="${-nodeH / 2}" width="${nodeW}" height="${nodeH}" rx="5" fill="${fill}" stroke="${stroke}" stroke-width="${strokeW}" />
            <text x="0" y="3.5" text-anchor="middle" fill="${textColor}" font-size="${fontSize}" font-weight="700" font-family="JetBrains Mono, monospace">${n.val}</text>
            ${badgeHtml}
            ${animalHtml}
          </g>
        `);
      }

      draw(rootPos);

      container.innerHTML = `
        <div id="tree-scroll-box" class="w-full h-full flex items-center justify-start overflow-auto p-1 scroll-smooth">
          <svg width="${totalW}" height="${totalH}" viewBox="0 0 ${totalW} ${totalH}" style="min-width: ${totalW}px; min-height: ${totalH}px; display: block; margin: auto;">
            ${lines.join('')}
            ${nodes.join('')}
          </svg>
        </div>
      `;

      // 自动平滑滚动对齐当前活动节点
      if (activeX !== null) {
        const scrollBox = document.getElementById('tree-scroll-box');
        if (scrollBox && scrollBox.scrollWidth > scrollBox.clientWidth) {
          const targetScrollLeft = activeX - scrollBox.clientWidth / 2;
          scrollBox.scrollTo({ left: Math.max(0, targetScrollLeft), behavior: 'smooth' });
        }
      }
    }

    // 渲染当前步骤
    function renderStep(index) {
      if (index < 0 || index >= steps.length) return;
      const step = steps[index];
      const isReverse = currentDirection === 'reverse';

      // 1. 步数与滑块更新
      document.getElementById('step-cur').textContent = index + 1;
      document.getElementById('step-total').textContent = steps.length;
      const slider = document.getElementById('slider-progress');
      if (slider) {
        slider.max = steps.length - 1;
        slider.value = index;
      }

      // 图例同步
      const legendRefEl = document.getElementById('legend-ref');
      if (legendRefEl) {
        legendRefEl.innerHTML = isReverse ? '🐱 参考下方/右方' : '🐱 参考上方/左方';
      }

      // 2. 渲染二维网格 (虚拟地图 / 2D DP 表)
      const gridContainer = document.getElementById('grid-container');
      if (gridContainer) {
        gridContainer.style.gridTemplateColumns = `repeat(${n}, minmax(0, 1fr))`;
        gridContainer.innerHTML = '';

        for (let r = 0; r < m; r++) {
          for (let c = 0; c < n; c++) {
            const cellVal = step.grid[r][c];
            const isCur = step.i === r && step.j === c;
            const isTop = step.topI === r && step.topJ === c;
            const isLeft = step.leftI === r && step.leftJ === c;
            const isFinish = isReverse ? (r === 0 && c === 0) : (r === m - 1 && c === n - 1);

            const cellEl = document.createElement('div');
            cellEl.className = 'w-11 h-11 md:w-12 md:h-12 rounded-lg flex flex-col items-center justify-center relative font-mono-code text-xs transition-all border';

            if (isCur) {
              cellEl.className += ' bg-blue-100 border-blue-500 text-blue-800 font-bold shadow-md scale-105 z-10';
              cellEl.innerHTML = `
                <span class="absolute -top-3 -right-1 text-base select-none"><span class="animal-frog">🐸</span></span>
                <span class="text-[9px] text-blue-500 font-bold absolute top-0.5 left-1">${r},${c}</span>
                <span class="text-sm font-extrabold mt-2">${cellVal !== null ? cellVal : ''}</span>
              `;
            } else if (isTop) {
              cellEl.className += ' bg-purple-100 border-purple-400 text-purple-800 font-bold shadow-sm';
              cellEl.innerHTML = `
                <span class="absolute -top-3 -right-1 text-base select-none"><span class="animal-cat">🐱</span></span>
                <span class="text-[9px] text-purple-500 font-bold absolute top-0.5 left-1">${r},${c}</span>
                <span class="text-sm font-extrabold mt-2">${cellVal !== null ? cellVal : ''}</span>
              `;
            } else if (isLeft) {
              cellEl.className += ' bg-amber-100 border-amber-400 text-amber-800 font-bold shadow-sm';
              cellEl.innerHTML = `
                <span class="absolute -top-3 -right-1 text-base select-none"><span class="animal-cat">🐱</span></span>
                <span class="text-[9px] text-amber-600 font-bold absolute top-0.5 left-1">${r},${c}</span>
                <span class="text-sm font-extrabold mt-2">${cellVal !== null ? cellVal : ''}</span>
              `;
            } else if (cellVal !== null) {
              cellEl.className += ' bg-emerald-50 border-emerald-300 text-emerald-700 font-bold';
              cellEl.innerHTML = `
                <span class="text-[9px] text-emerald-500 absolute top-0.5 left-1">${r},${c}</span>
                <span class="text-sm font-bold mt-2">${cellVal}</span>
              `;
            } else {
              cellEl.className += ' bg-slate-50 border-slate-200 text-slate-400';
              cellEl.innerHTML = `
                <span class="text-[9px] text-slate-300 absolute top-0.5 left-1">${r},${c}</span>
                ${isFinish ? '<span class="text-xs font-bold text-red-400 mt-2">🏁</span>' : '<span class="text-slate-300 mt-2">-</span>'}
              `;
            }

            gridContainer.appendChild(cellEl);
          }
        }
      }

      // 3. 渲染状态区 (Card 2: 阶段 1/2 渲染递归树 SVG，阶段 3 渲染求和卡片，阶段 4 渲染 1D memo)
      const memoContainer = document.getElementById('memo-slots-container');
      if (memoContainer) {
        memoContainer.innerHTML = '';

        if (currentStage === 'stage-4' && step.memo) {
          for (let j = 0; j < n; j++) {
            const val = step.memo[j];
            const isCurCol = step.j === j;
            const isTopCol = step.topJ === j;
            const isLeftCol = step.leftJ === j;

            const slotBox = document.createElement('div');
            slotBox.className = 'flex flex-col items-center gap-1';

            let slotClass = 'w-12 h-12 md:w-14 md:h-14 rounded-xl border flex items-center justify-center font-mono-code text-base font-extrabold transition-all relative';
            let iconBadge = '';

            if (isCurCol && (step.type === 'boundary' || step.type === 'update' || step.type === 'enter-cell')) {
              slotClass += ' bg-blue-100 border-blue-500 text-blue-800 shadow-md scale-105 animate-active-slot';
              iconBadge = '<span class="absolute -top-3 -right-1 text-base"><span class="animal-frog">🐸</span></span>';
            } else if (isTopCol && (step.type === 'read-down' || step.type === 'read-right' || step.type === 'update')) {
              slotClass += ' bg-purple-100 border-purple-400 text-purple-800 shadow-sm';
              iconBadge = '<span class="absolute -top-3 -right-1 text-base"><span class="animal-cat">🐱</span></span>';
            } else if (isLeftCol && (step.type === 'read-right' || step.type === 'update')) {
              slotClass += ' bg-amber-100 border-amber-400 text-amber-800 shadow-sm';
              iconBadge = '<span class="absolute -top-3 -right-1 text-base"><span class="animal-cat">🐱</span></span>';
            } else if (val > 0) {
              slotClass += ' bg-emerald-50 border-emerald-300 text-emerald-700';
            } else {
              slotClass += ' bg-slate-50 border-slate-200 text-slate-400';
            }

            slotBox.innerHTML = `
              <span class="text-[10px] font-mono-code text-slate-400">j=${j}</span>
              <div class="${slotClass}">
                ${iconBadge}
                <span>${val}</span>
              </div>
            `;
            memoContainer.appendChild(slotBox);
          }
        } else if (currentStage === 'stage-3') {
          // 二维 DP 状态转移看板
          const topTxt = step.topVal !== undefined ? step.topVal : '-';
          const leftTxt = step.leftVal !== undefined ? step.leftVal : '-';
          const sumTxt = step.sumVal !== undefined ? step.sumVal : '-';
          const topLabel = isReverse ? '下方' : '上方';
          const leftLabel = isReverse ? '右方' : '左方';

          memoContainer.innerHTML = `
            <div class="flex items-center gap-3 p-2 bg-white rounded-xl border border-slate-200 shadow-sm text-xs font-mono-code">
              <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-purple-50 text-purple-700 font-bold border border-purple-200">
                <span class="animal-cat">🐱</span> ${topLabel}: ${topTxt}
              </div>
              <span class="text-slate-400 font-bold text-base">+</span>
              <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-amber-50 text-amber-700 font-bold border border-amber-200">
                <span class="animal-cat">🐱</span> ${leftLabel}: ${leftTxt}
              </div>
              <span class="text-slate-400 font-bold text-base">=</span>
              <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-blue-50 text-blue-700 font-extrabold border border-blue-200">
                <span class="animal-frog">🐸</span> 当前单元: ${sumTxt}
              </div>
            </div>
          `;
        } else if (currentStage === 'stage-1' || currentStage === 'stage-2') {
          // 渲染递归树 SVG
          renderRecursionTree(memoContainer, step.treeRoot, step.activeNodeId, currentStage === 'stage-2');
        }
      }

      // 4. 代码高亮并自动调整代码框的可视区域 (智能视口平滑联动)
      document.querySelectorAll('.code-line').forEach(el => el.classList.remove('active-line'));
      const activeLineEl = document.querySelector(`.code-line[data-line="${step.line}"]`);
      if (activeLineEl) {
        activeLineEl.classList.add('active-line');

        const codeBox = document.getElementById('code-container-box');
        if (codeBox) {
          if (step.line <= 6) {
            codeBox.scrollTo({ top: 0, behavior: 'smooth' });
          } else {
            const lineOffsetTop = activeLineEl.offsetTop;
            const lineOffsetHeight = activeLineEl.offsetHeight;
            const boxHeight = codeBox.clientHeight;
            const currentScroll = codeBox.scrollTop;

            if (lineOffsetTop < currentScroll + 32) {
              codeBox.scrollTo({ top: Math.max(0, lineOffsetTop - 40), behavior: 'smooth' });
            } else if (lineOffsetTop + lineOffsetHeight > currentScroll + boxHeight - 32) {
              codeBox.scrollTo({ top: lineOffsetTop + lineOffsetHeight - boxHeight + 40, behavior: 'smooth' });
            }
          }
        }
      }

      // 5. 渲染执行日志
      const logContainer = document.getElementById('log-container');
      if (logContainer) {
        logContainer.innerHTML = '';
        for (let k = 0; k <= index; k++) {
          const logStep = steps[k];
          const isLatest = k === index;
          const lineEl = document.createElement('div');
          lineEl.className = isLatest 
            ? 'text-blue-700 font-bold bg-blue-50/80 px-2 py-1 rounded border-l-2 border-blue-500' 
            : 'text-slate-600 px-2 py-0.5';
          lineEl.textContent = logStep.log;
          logContainer.appendChild(lineEl);
        }
        logContainer.scrollTop = logContainer.scrollHeight;
        document.getElementById('log-count').textContent = `${index + 1} / ${steps.length} 记录`;
      }
    }

    // 控制器交互逻辑与步骤装载
    function loadAndInit() {
      const inputM = document.getElementById('input-m');
      const inputN = document.getElementById('input-n');
      m = parseInt(inputM?.value || '3');
      n = parseInt(inputN?.value || '4');
      if (isNaN(m) || m < 1) m = 3;
      if (isNaN(n) || n < 1) n = 4;
      if (m > 8) m = 8;
      if (n > 8) n = 8;

      const dirConfigs = STAGE_CONFIGS[currentDirection] || STAGE_CONFIGS.forward;
      const stageConfig = dirConfigs[currentStage];
      
      // 更新标题、复杂度徽章、卡片 2 标题
      const titleEl = document.getElementById('header-algo-title');
      if (titleEl) {
        titleEl.textContent = stageConfig.name;
        titleEl.title = stageConfig.desc;
      }
      const descEl = document.getElementById('header-algo-desc');
      if (descEl) descEl.textContent = stageConfig.desc;
      const complexityBadge = document.getElementById('header-complexity-badge');
      if (complexityBadge) {
        complexityBadge.textContent = stageConfig.timeBadge;
        complexityBadge.className = `px-2 py-0.5 rounded-md text-[10px] font-bold font-mono ${stageConfig.badgeBg}`;
      }

      document.getElementById('card2-title').innerHTML = `<i class="fa-solid fa-bars-staggered text-slate-500"></i> ${stageConfig.card2Title}`;
      document.getElementById('card2-desc').textContent = stageConfig.card2Desc;

      const variantBar = document.getElementById('code-variant-bar');
      if (currentStage === 'stage-4' && stageConfig.variants) {
        if (variantBar) variantBar.classList.remove('hidden');
        const variantConfig = stageConfig.variants[currentStageVariant] || stageConfig.variants['if'];
        document.getElementById('code-file-title').textContent = variantConfig.title;
        document.getElementById('code-content').innerHTML = variantConfig.html;
      } else {
        if (variantBar) variantBar.classList.add('hidden');
        document.getElementById('code-file-title').textContent = stageConfig.codeTitle;
        document.getElementById('code-content').innerHTML = stageConfig.codeHtml;
      }

      document.getElementById('badge-memo-len').textContent = currentStage === 'stage-4' ? `长度: ${n}` : `${m} × ${n}`;

      // 重置代码框滚动条至顶部
      const codeBox = document.getElementById('code-container-box');
      if (codeBox) codeBox.scrollTop = 0;

      // 生成对应演化阶段的步骤 (根据正序 / 倒序 方向切换 与 阶段 4 变体选择)
      if (currentDirection === 'reverse') {
        if (currentStage === 'stage-4') {
          steps = currentStageVariant === 'for' ? generateReverseStage4ForSteps(m, n) : generateReverseStage4Steps(m, n);
        } else if (currentStage === 'stage-3') {
          steps = generateReverseStage3Steps(m, n);
        } else if (currentStage === 'stage-2') {
          steps = generateReverseStage1or2Steps(m, n, true);
        } else {
          steps = generateReverseStage1or2Steps(m, n, false);
        }
      } else {
        if (currentStage === 'stage-4') {
          steps = currentStageVariant === 'for' ? generateForwardStage4ForSteps(m, n) : generateForwardStage4Steps(m, n);
        } else if (currentStage === 'stage-3') {
          steps = generateForwardStage3Steps(m, n);
        } else if (currentStage === 'stage-2') {
          steps = generateForwardStage1or2Steps(m, n, true);
        } else {
          steps = generateForwardStage1or2Steps(m, n, false);
        }
      }

      currentStepIndex = 0;
      pausePlayback();
      renderStep(0);
    }

    function stepForward() {
      if (currentStepIndex < steps.length - 1) {
        currentStepIndex++;
        renderStep(currentStepIndex);
      } else {
        pausePlayback();
      }
    }

    function stepBackward() {
      if (currentStepIndex > 0) {
        currentStepIndex--;
        renderStep(currentStepIndex);
      }
    }

    function startPlayback() {
      isPlaying = true;
      const playIcon = document.getElementById('play-icon');
      if (playIcon) playIcon.className = 'fa-solid fa-pause';

      if (playTimer) clearInterval(playTimer);
      playTimer = setInterval(() => {
        if (currentStepIndex < steps.length - 1) {
          stepForward();
        } else {
          pausePlayback();
        }
      }, playSpeed);
    }

    function pausePlayback() {
      isPlaying = false;
      const playIcon = document.getElementById('play-icon');
      if (playIcon) playIcon.className = 'fa-solid fa-play';
      if (playTimer) {
        clearInterval(playTimer);
        playTimer = null;
      }
    }

    function togglePlayPause() {
      if (isPlaying) {
        pausePlayback();
      } else {
        if (currentStepIndex >= steps.length - 1) {
          currentStepIndex = 0;
          renderStep(0);
        }
        startPlayback();
      }
    }

    // 初始化事件绑定
    function initLiteApp() {
      // 1. 演化阶段选项卡点击切换
      const stageButtons = document.querySelectorAll('#stage-tabs-container .stage-tab-btn');
      stageButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          stageButtons.forEach(b => {
            b.className = 'stage-tab-btn px-2.5 py-1 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 text-slate-600 hover:text-slate-900 hover:bg-white border border-transparent';
            const s1 = b.querySelector('span:first-child');
            if (s1) s1.className = 'w-4 h-4 rounded-full bg-slate-200 text-slate-600 text-[10px] flex items-center justify-center font-bold';
          });
          btn.className = 'stage-tab-btn active px-3 py-1 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 bg-amber-500 text-white shadow-sm shadow-amber-500/20 border border-amber-500';
          const s2 = btn.querySelector('span:first-child');
          if (s2) s2.className = 'w-4 h-4 rounded-full bg-white/20 text-white text-[10px] flex items-center justify-center font-bold';

          currentStage = btn.getAttribute('data-stage') || 'stage-4';
          loadAndInit();
        });
      });

      // 2. 顺推正序 / 逆推倒序 切换
      const dirButtons = document.querySelectorAll('#dir-tabs-container .dir-tab-btn');
      dirButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          dirButtons.forEach(b => {
            b.className = 'dir-tab-btn px-2.5 py-1 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 text-slate-600 hover:text-slate-900 hover:bg-white border border-transparent';
          });
          btn.className = 'dir-tab-btn active px-2.5 py-1 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 bg-blue-600 text-white shadow-sm';
          currentDirection = btn.getAttribute('data-dir') || 'forward';
          loadAndInit();
        });
      });

      // 3. 阶段 4 变体切换 (内嵌 if / 外层 for)
      const variantButtons = document.querySelectorAll('#code-variant-bar .variant-btn');
      variantButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          variantButtons.forEach(b => {
            b.className = 'variant-btn px-2 py-0.5 rounded text-[10px] font-medium transition text-slate-400 hover:text-slate-200 hover:bg-slate-800';
          });
          btn.className = 'variant-btn active px-2 py-0.5 rounded text-[10px] font-bold transition bg-blue-600 text-white shadow-2xs';
          currentStageVariant = btn.getAttribute('data-variant') || 'if';
          loadAndInit();
        });
      });

      // 3. 基础控制事件
      document.getElementById('btn-generate')?.addEventListener('click', loadAndInit);
      document.getElementById('btn-reset')?.addEventListener('click', () => {
        pausePlayback();
        currentStepIndex = 0;
        renderStep(0);
      });

      document.getElementById('btn-play-pause')?.addEventListener('click', togglePlayPause);
      document.getElementById('btn-step-next')?.addEventListener('click', () => { pausePlayback(); stepForward(); });
      document.getElementById('btn-step-prev')?.addEventListener('click', () => { pausePlayback(); stepBackward(); });

      const slider = document.getElementById('slider-progress');
      slider?.addEventListener('input', (e) => {
        pausePlayback();
        currentStepIndex = parseInt(e.target.value);
        renderStep(currentStepIndex);
      });

      // 4. 切换到完整精讲版
      document.getElementById('btn-switch-full')?.addEventListener('click', () => {
        if (window.parent && window.parent.__toggleUniquePathsVersion) {
          window.parent.__toggleUniquePathsVersion('full');
        } else {
          window.location.href = 'unique-paths.html';
        }
      });

      loadAndInit();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initLiteApp);
    } else {
      initLiteApp();
    }
  </script>
</body>
</html>
