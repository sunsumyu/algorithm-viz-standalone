# ==============================================================================
# 🏆 [TOP-LEVEL ALGORITHM MODEL] 顶层抽象模型规范
# 购买足量干草的最小花费 (洛谷 P2918 [USACO08NOV] Buying Hay S) - 左程云 Class 074 Code06
# 核心：完全背包 · 允许超额，容量上界安全扩充至 H + max(val)，求极小值并在 [H, m] 内检索最优
# 四阶段全演化标准参考模型 (Stage 1-4, forward/reverse 双向支持)
# ==============================================================================

id: buying-hay-min-cost
name: "购买足量干草的最小花费"
nameEn: "Buying Hay Minimum Cost"
defaultStage: "stage-4"
category: "dynamic-programming"
icon: "🌾"
difficulty: 2
levelOrder: 89
learningGoal: "掌握允许超额时的容量上界安全扩充证明（H + maxVal）与求最小花费完全背包的状态转移"
description: "左程云算法通关课 Class 074 Code06：洛谷 P2918 购买干草，至少 H 磅允许超额，容量上界扩充至 H + maxVal 的完全背包求极小值"
defaultParams:
  h: 15
  cost: [10, 12]
  val: [8, 16]

problem:
  leetcodeId: 2918
  title: "购买足量干草的最小花费 (洛谷 P2918 [USACO08NOV] Buying Hay S)"
  difficulty: "普及+/提高"
  tags: ["动态规划", "背包问题", "完全背包"]
  description: "约翰的干草库存已经空了，他需要立刻购买不少于 <code>H</code> 磅的干草来喂饱奶牛。有 <code>N</code> 家供货公司，第 <code>i</code> 家供货公司出售每包 <code>val[i]</code> 磅的干草，售价 <code>cost[i]</code> 元。每家公司的干草包数都是无限的。请问约翰买到<strong>至少 <code>H</code> 磅干草</strong>所需的<strong>最少花费</strong>是多少？"
  examples:
    - input: "H = 60, cost = [5, 100], val = [10, 100]"
      output: "30"
      explanation: "购买 6 包公司 1 的干草（60 磅），花费 6 * 5 = 30 元。"
    - input: "H = 15, cost = [10, 12], val = [8, 16]"
      output: "12"
      explanation: "如果买 2 包 8 磅的（16 磅），花费 20 元；如果直接买 1 包 16 磅的（超额达标 16 >= 15 磅），仅花费 12 元！因此最优花费为 12 元。"
  constraints:
    - "1 <= N <= 100"
    - "1 <= H <= 50000"
    - "1 <= cost[i], val[i] <= 5000"
  leetcodeUrl: "https://www.luogu.com.cn/problem/P2918"

directions:
  forward:
    label: "自底向上正序填表 (外层供货商，内层重量)"
    branches:
      - name: "not_take"
        label: "不选当前供货商"
        formula: "dp[i - 1][j]"
      - name: "take_v"
        label: "采购一包当前干草"
        formula: "dp[i][j - val[i]] + cost[i]"
    combineFormula: "min(dp[i - 1][j], dp[i][j - val[i]] + cost[i])"
  reverse:
    label: "逆推倒序寻源 (终点逆向推导)"
    description: "从达标重量向零基底反推"
    startFormula: "min_{j >= H} dp[n][j]"
    target: "dp[0][0]"
    branches:
      - name: "trace_back"
        label: "向上一状态溯源"
        formula: "dp[i][j - val[i]]"
    combineFormula: "逆向聚合"

stages:
  stage-1:
    shortName: "递归"
    type: "recursion"
    timeBadge: "O(2^(H / minVal))"
    badgeBg: "bg-slate-100 text-slate-700"
    name:
      forward: "阶段 1: 暴力递归分支展开 (无限选购二叉决策树)"
      reverse: "阶段 1: 暴力递归逆推寻源 (状态空间倒序展开)"
    desc:
      forward: "对于第 i 家供货商，分支 0 表示不再采购该商家的干草，深入 i + 1；分支 1 表示采购一包（扣减剩余需求），保留在 i 处以便无限次挑选，取分支极小值。"
      reverse: "从目标需求量逆向分解子问题，展示指数级爆炸的递归分支与重复求解。"
    variants:
      standard:
        variantLabel: "标准完全背包递归"
        title:
          forward: "BuyingHay_Recursive.java"
          reverse: "BuyingHay_Recursive_Reverse.java"
    states:
      - id: "remH"
        label: "剩余干草需求"
        type: "number"
      - id: "curCost"
        label: "累计采购花费"
        type: "number"

  stage-2:
    shortName: "记忆化"
    type: "memoization"
    timeBadge: "O(N · H)"
    badgeBg: "bg-blue-100 text-blue-700"
    name:
      forward: "阶段 2: 记忆化搜索剪枝 (二维备忘录缓存)"
      reverse: "阶段 2: 逆向记忆化状态空间探查"
    desc:
      forward: "建立 memo[N][H + 1] 缓存矩阵，当探索到相同 (i, remH) 子问题时直接 O(1) 查表返回，剪去海量重叠计算。"
      reverse: "逆向记忆化探查，展示带备忘录的自顶向下搜索剪枝。"
    variants:
      standard:
        variantLabel: "二维矩阵记忆化"
        title:
          forward: "BuyingHay_Memoization.java"
          reverse: "BuyingHay_Memoization_Reverse.java"
    states:
      - id: "memoGrid"
        label: "备忘录矩阵"
        type: "matrix"

  stage-3:
    shortName: "严格二维DP"
    type: "matrix"
    timeBadge: "O(N · (H + maxV))"
    badgeBg: "bg-emerald-100 text-emerald-700"
    name:
      forward: "阶段 3: 严格二维动态规划 (扩充容量全表填表)"
      reverse: "阶段 3: 逆向二维动态规划填表"
    desc:
      forward: "将状态定义为 dp[i][j]：前 i 家供货商恰好凑齐 j 磅干草的最小花费。容量上限扩充至 m = H + maxVal。最后在 [H, m] 区间内扫描全局极小值。"
      reverse: "从终点达标区间向原点逆向推导状态依赖。"
    variants:
      standard:
        variantLabel: "二维完全背包"
        title:
          forward: "BuyingHay_DP2D.java"
          reverse: "BuyingHay_DP2D_Reverse.java"
    states:
      - id: "dp2d"
        label: "二维 DP 状态表"
        type: "matrix"

  stage-4:
    shortName: "空间压缩"
    type: "roll"
    timeBadge: "O(N · (H + maxV))"
    badgeBg: "bg-purple-100 text-purple-700"
    name:
      forward: "阶段 4: 一维空间压缩完全背包 (正序滚动求最优)"
      reverse: "阶段 4: 空间压缩逆推寻源"
    desc:
      forward: "外层遍历供货商，内层容量从 val[i] 正序递增至 m = H + maxVal，利用本轮已更新的状态实现完全背包连续选购。最终在 [H, m] 磅中求最小值。"
      reverse: "一维滚动向量下的逆向状态流转。"
    variants:
      standard:
        variantLabel: "一维空间压缩"
        title:
          forward: "BuyingHay_DP1D.java"
          reverse: "BuyingHay_DP1D_Reverse.java"
    states:
      - id: "dp1d"
        label: "一维滚动向量"
        type: "array"
