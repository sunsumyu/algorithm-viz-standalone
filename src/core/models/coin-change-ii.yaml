# ==============================================================================
# 🏆 [GOLDEN BASELINE MODEL] 黄金基准模型规范
# 零钱兑换 II (Coin Change II) - LeetCode 518 四阶段全演化模型
# 包含：硬币组合递归树展开、二维记忆化剪枝、自底向上完全背包与空间压缩优化
# ==============================================================================

id: coin-change-ii
name: "零钱兑换 II"
nameEn: "Coin Change II"
defaultStage: "stage-1"
category: "dynamic-programming"
icon: "🪙"
difficulty: 2
levelOrder: 12
learningGoal: "掌握完全背包组合计数动态规划：dp[i] = dp[i] + dp[i - c] (外层硬币，内层金额)"
description: "给你一个整数数组 coins 表示不同面额的硬币，另给一个整数 amount 表示总金额。请你计算并返回可以凑成总金额的硬币组合数。"
defaultParams:
  n: 5
  coins: [1, 2, 5]

problem:
  leetcodeId: 518
  title: "零钱兑换 II"
  difficulty: "中等"
  tags: ["数组", "动态规划", "完全背包"]
  description: "给你一个整数数组 <code>coins</code> 表示不同面额的硬币，另给一个整数 <code>amount</code> 表示总金额。<br/><br/>请你计算并返回可以凑成总金额的硬币组合数。如果任何硬币组合都都不能凑成总金额，返回 <code>0</code> 。<br/>假设每一种面额的硬币有无限个。<br/>题目数据保证结果符合 32 位带符号整数。"
  examples:
    - input: "amount = 5, coins = [1, 2, 5]"
      output: "4"
      explanation: "有四种方式可以凑成总金额：5=5, 5=2+2+1, 5=2+1+1+1, 5=1+1+1+1+1。"
    - input: "amount = 3, coins = [2]"
      output: "0"
      explanation: "只用面额 2 的硬币不能凑成总金额 3。"
    - input: "amount = 10, coins = [10]"
      output: "1"
      explanation: "只有一种方式：10=10。"
  constraints:
    - "1 <= coins.length <= 300"
    - "1 <= coins[i] <= 5000"
    - "coins 中的所有值 互不相同"
    - "0 <= amount <= 5000"
  leetcodeUrl: "https://leetcode.cn/problems/coin-change-ii/"

directions:
  forward:
    label: "自底向上 (外层硬币，内层金额)"
    branches:
      - name: "pick_coin"
        label: "选用硬币面额 c 的新方案"
        formula: "dp[i - c]"
    combineFormula: "dp[i] + dp[i - c]"

stages:
  stage-1:
    shortName: "递归"
    type: "recursion"
    timeBadge: "O(2ⁿ)"
    badgeBg: "bg-slate-100 text-slate-700"
    name:
      forward: "阶段 1: 组合切分递归 (硬币选取决策树)"
    desc:
      forward: "对于硬币下标 idx 与剩余金额 rem，分别分支：不选当前硬币（转向 idx+1）或选一枚当前硬币（金额减去 coins[idx]），将方案数相加。"
    variants:
      standard:
        variantLabel: "标准组合递归"
        title:
          forward: "Change_Recursive.java"
        code:
          forward:
            title: "Change_Recursive.java"
            source: |
              class Solution {
                  public int change(int amount, int[] coins) {
                      return dfs(coins, 0, amount); // @step:entry
                  }
                  private int dfs(int[] coins, int idx, int rem) {
                      if (rem == 0) return 1; // @step:boundary
                      if (rem < 0 || idx == coins.length) return 0; // @step:boundary_prune
                      // 分支1：不选当前硬币；分支2：选用当前硬币
                      int notPick = dfs(coins, idx + 1, rem); // @step:branch_not_pick
                      int pick = dfs(coins, idx, rem - coins[idx]); // @step:branch_pick
                      return notPick + pick; // @step:combine
                  }
              }

  stage-2:
    shortName: "记忆化"
    type: "memoization"
    timeBadge: "O(N × amount)"
    badgeBg: "bg-purple-100 text-purple-700"
    name:
      forward: "阶段 2: 记忆化搜索 (消除重叠子问题)"
    desc:
      forward: "使用二维备忘录 memo[idx][rem] 记录在当前硬币索引与剩余金额下的有效组合数，避免重复计算。"
    variants:
      array_memo:
        variantLabel: "二维备忘录版"
        title:
          forward: "Change_Memo.java"
        code:
          forward:
            title: "Change_Memo.java"
            source: |
              class Solution {
                  private Integer[][] memo;
                  public int change(int amount, int[] coins) {
                      memo = new Integer[coins.length][amount + 1]; // @step:init_memo
                      return dfs(coins, 0, amount); // @step:entry
                  }
                  private int dfs(int[] coins, int idx, int rem) {
                      if (rem == 0) return 1;
                      if (rem < 0 || idx == coins.length) return 0;
                      if (memo[idx][rem] != null) return memo[idx][rem]; // @step:cache_hit
                      int ways = dfs(coins, idx + 1, rem) + dfs(coins, idx, rem - coins[idx]); // @step:combine
                      memo[idx][rem] = ways; // @step:save_memo
                      return ways; // @step:return
                  }
              }

  stage-3:
    shortName: "递推DP"
    type: "tabulation-1d"
    timeBadge: "O(N × amount)"
    badgeBg: "bg-blue-100 text-blue-700"
    name:
      forward: "阶段 3: 一维完全背包递推 (组合数累加天平)"
    desc:
      forward: "外层遍历硬币面额，内层遍历金额 i 从 c 到 amount。dp[i] = dp[i] + dp[i - c]，天平对比展示历史方案数与新增方案数的汇聚。"
    variants:
      for:
        variantLabel: "双层循环标准版"
        title:
          forward: "Change_DP.java"
        code:
          forward:
            title: "Change_DP.java"
            source: |
              class Solution {
                  public int change(int amount, int[] coins) {
                      int[] dp = new int[amount + 1]; // @step:init
                      dp[0] = 1;                      // @step:base
                      for (int c : coins) {           // @step:loop-outer
                          for (int i = c; i <= amount; i++) { // @step:loop-inner
                              // 核心决策：历史组合数 dp[i] 加上使用硬币 c 的新组合数 dp[i - c]
                              dp[i] += dp[i - c];     // @step:transfer
                          }
                      }
                      return dp[amount];              // @step:return
                  }
              }

  stage-4:
    shortName: "空间压缩"
    type: "space-optimized"
    timeBadge: "O(amount)"
    badgeBg: "bg-emerald-100 text-emerald-700"
    name:
      forward: "阶段 4: 空间极度压缩与循环顺序解析"
    desc:
      forward: "对比排列数（爬楼梯/零钱组合Ⅳ）与组合数（零钱兑换Ⅱ）。外层硬币保证硬币严格升序选择，绝不重复生成同一组合的不同排列。"
    variants:
      optimized:
        variantLabel: "完全背包权威空间压缩"
        title:
          forward: "Change_Optimized.java"
        code:
          forward:
            title: "Change_Optimized.java"
            source: |
              class Solution {
                  public int change(int amount, int[] coins) {
                      int[] dp = new int[amount + 1]; // @step:init
                      dp[0] = 1; // @step:base
                      for (int c : coins) { // @step:loop-outer
                          for (int i = c; i <= amount; i++) { // @step:loop-inner
                              dp[i] += dp[i - c]; // @step:transfer
                          }
                      }
                      return dp[amount]; // @step:return
                  }
              }
