  stage-2:
    shortName: "记忆化"
    type: "memoization"
    timeBadge: "O(n³)"
    badgeBg: "bg-blue-100 text-blue-700"
    name:
      forward: "阶段 2: 记忆化搜索剪枝 (备忘录消除重叠子区间合并)"
      reverse: "阶段 2: 记忆化逆向回溯 (带缓存的合并寻源)"
    desc:
      forward: "引入 memo[i][j] 备忘录缓存区间 [i..j] 的最低合并成本。查表若已计算则直接 O(1) 返回，消除重叠子区间的重复计算。"
      reverse: "逆向展示记忆化树的剪枝效果与缓存复用。"
    variants:
      standard:
        variantLabel: "备忘录搜索实现"
        title:
          forward: "MergeStones_Memo.java"
          reverse: "MergeStones_Memo_Reverse.java"
        code:
          forward:
            title: "MergeStones_Memo.java"
            source: |
              class Solution {
                  public int mergeStones(int[] stones) { // @step:entry
                      int n = stones.length; // @step:init_n
                      if (n <= 1) return 0; // @step:guard_less
                      int[] sum = new int[n + 1]; // @step:init_sum
                      for (int i = 0; i < n; i++) sum[i + 1] = sum[i] + stones[i]; // @step:fill_sum
                      int[][] memo = new int[n][n]; // @step:init_dp
                      return dfs(stones, sum, memo, 0, n - 1); // @step:call_dfs
                  }
                  private int dfs(int[] stones, int[] sum, int[][] memo, int i, int j) { // @step:dfs_entry
                      if (i >= j) return 0; // @step:boundary
                      if (memo[i][j] != 0) return memo[i][j]; // @step:cache_hit
                      int minCost = Integer.MAX_VALUE; // @step:init_min
                      for (int k = i; k < j; k++) { // @step:loop_k
                          int cost = dfs(stones, sum, memo, i, k) + dfs(stones, sum, memo, k + 1, j); // @step:calc_cost
                          minCost = Math.min(minCost, cost); // @step:update_min
                      }
                      memo[i][j] = minCost + (sum[j + 1] - sum[i]); // @step:transfer
                      return memo[i][j]; // @step:return
                  }
              }
