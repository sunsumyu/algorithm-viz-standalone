# ==============================================================================
# 🏆 [TOP-LEVEL ALGORITHM MODEL] 顶层抽象模型规范
# 合并石头的最低成本 (Minimum Cost to Merge Stones / LeetCode 1000 / 左程云 Class 077 Code01)
# 核心：区间 DP 经典——相邻石子合并累加区间总重量
# 转移方程：dp[i][j] = min_{k}(dp[i][k] + dp[k+1][j]) + sum[i..j]
# 四阶段全演化标准参考模型 (Stage 1-4, forward/reverse 双向支持)
# ==============================================================================

id: merge-stones
name: "合并石头的最低成本"
nameEn: "Minimum Cost to Merge Stones"
defaultStage: "stage-3"
category: "dynamic-programming"
icon: "🪨"
difficulty: 2
levelOrder: 1000
learningGoal: "深刻掌握区间 DP 的经典石子合并模型，理解区间前缀和 $O(1)$ 快速查询与枚举中间分割点 $k$ 消除子问题依赖的动态规划推导"
description: "左程云算法通关课 Class 077 Code01：LeetCode 1000 合并石头的最低成本，经典区间动态规划。每次合并相邻石子堆，合并成本为两堆重量之和，求将所有石子合并为一堆的最低总成本。"
defaultParams:
  stones: [3, 2, 4, 1]

problem:
  leetcodeId: 1000
  title: "合并石头的最低成本 (LeetCode 1000 / Class 077 Code01)"
  difficulty: "中等"
  tags: ["动态规划", "区间 DP", "前缀和", "贪心与分治"]
  description: "有 <code>n</code> 堆连续排开的石子，每堆石子的重量记录在数组 <code>stones</code> 中。<br/><br/>每次操作可以选择相邻的 <code>2</code> 堆石子合并为一堆，合并的成本为这两堆石子的重量和。求将所有石子合并成一堆的最低总成本。"
  examples:
    - input: "stones = [3, 2, 4, 1]"
      output: "20"
      explanation: "合并步骤：<br/>1. 合并 [3, 2] -> 5，成本 5，剩余 [5, 4, 1]<br/>2. 合并 [4, 1] -> 5，成本 5，剩余 [5, 5]<br/>3. 合并 [5, 5] -> 10，成本 10，总成本 = 5 + 5 + 10 = 20。"
    - input: "stones = [3, 5, 1, 2, 6]"
      output: "38"
      explanation: "最优合并策略得到最低合并总成本为 38。"
  constraints:
    - "1 <= stones.length <= 30 (演示推荐 <= 8)"
    - "1 <= stones[i] <= 100"
  leetcodeUrl: "https://leetcode.cn/problems/minimum-cost-to-merge-stones/"

directions:
  forward:
    label: "区间长度顺推 (len=2..n 上三角自底向上填表)"
    branches:
      - name: "split_merge"
        label: "分割点 k 左右子堆合并并累加区间总重量"
        formula: "min_{k}(dp[i][k] + dp[k+1][j]) + sum(stones[i..j])"
    combineFormula: "dp[i][j] = min_{k}(dp[i][k] + dp[k+1][j]) + (sum[j+1] - sum[i])"
  reverse:
    label: "全局区间逆推寻源 (从最终合并一堆逆向分解)"
    description: "从整体石子区间 [0..n-1] 逆向寻源最优切分点与子区间合并路径"
    startFormula: "dp[0][n - 1]"
    target: "dp[i][i] = 0"
    branches:
      - name: "trace_branches"
        label: "逆向最优切分决策"
        formula: "dp[i][k] + dp[k+1][j] + sum[i..j]"
    combineFormula: "逆向最优石子切分分解"

stages:
  stage-1:
    shortName: "递归"
    type: "recursion"
    timeBadge: "O(2ⁿ)"
    badgeBg: "bg-slate-100 text-slate-700"
    name:
      forward: "阶段 1: 暴力分治递归树展开 (石子切分合并)"
      reverse: "阶段 1: 暴力递归逆推寻源 (状态空间倒序展开)"
    desc:
      forward: "分治策略：任意区间 [i, j] 的最后一次合并，必然由某个分割点 k 将其分为左半段 [i, k] 与右半段 [k+1, j]，再加上合并两堆所需消耗的该区间总重量 sum[i..j]。"
      reverse: "从最终目标区间 [0..n-1] 出发，逆向展示递归切分合并决策。"
    variants:
      standard:
        variantLabel: "标准分治递归实现"
        title:
          forward: "MergeStones_Recursive.java"
          reverse: "MergeStones_Recursive_Reverse.java"
        code:
          forward:
            title: "MergeStones_Recursive.java"
            source: |
              class Solution {
                  public int mergeStones(int[] stones) { // @step:entry
                      int n = stones.length; // @step:init_n
                      if (n <= 1) return 0; // @step:guard_less
                      int[] sum = new int[n + 1]; // @step:init_sum
                      for (int i = 0; i < n; i++) sum[i + 1] = sum[i] + stones[i]; // @step:fill_sum
                      return dfs(stones, sum, 0, n - 1); // @step:return
                  }
                  private int dfs(int[] stones, int[] sum, int i, int j) { // @step:dfs_entry
                      if (i >= j) return 0; // @step:boundary
                      int minCost = Integer.MAX_VALUE; // @step:init_min
                      for (int k = i; k < j; k++) { // @step:loop_k
                          int cost = dfs(stones, sum, i, k) + dfs(stones, sum, k + 1, j); // @step:calc_cost
                          minCost = Math.min(minCost, cost); // @step:update_min
                      }
                      return minCost + (sum[j + 1] - sum[i]); // @step:transfer
                  }
              }
