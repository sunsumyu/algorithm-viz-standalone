              python: |
                class Solution:
                    def mergeStones(self, stones: List[int]) -> int: # @step:entry
                        n = len(stones) # @step:init_n
                        if n <= 1: return 0 # @step:guard_less
                        prefix = [0] * (n + 1) # @step:init_sum
                        for i in range(n): prefix[i + 1] = prefix[i] + stones[i] # @step:fill_sum
                        memo = {} # @step:init_dp
                        def dfs(i: int, j: int) -> int: # @step:dfs_entry
                            if i >= j: return 0 # @step:boundary
                            if (i, j) in memo: return memo[(i, j)] # @step:cache_hit
                            min_cost = float('inf') # @step:init_min
                            for k in range(i, j): # @step:loop_k
                                cost = dfs(i, k) + dfs(k + 1, j) # @step:calc_cost
                                min_cost = min(min_cost, cost) # @step:update_min
                            memo[(i, j)] = min_cost + (prefix[j + 1] - prefix[i]) # @step:transfer
                            return memo[(i, j)] # @step:return
                        return dfs(0, n - 1) # @step:call_dfs
