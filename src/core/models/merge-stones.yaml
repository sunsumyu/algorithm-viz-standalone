              python: |
                class Solution:
                    def mergeStones(self, stones: List[int]) -> int: # @step:entry
                        n = len(stones) # @step:init_n
                        if n <= 1: return 0 # @step:guard_less
                        prefix = [0] * (n + 1) # @step:init_sum
                        for i in range(n): prefix[i + 1] = prefix[i] + stones[i] # @step:fill_sum
                        dp = [[0] * n for _ in range(n)] # @step:init_dp
                        for i in range(n - 2, -1, -1): # @step:loop_i
                            for j in range(i + 1, n): # @step:calc_j
                                dp[i][j] = min(dp[i][k] + dp[k + 1][j] for k in range(i, j)) + (prefix[j + 1] - prefix[i]) # @step:transfer
                        return dp[0][n - 1] # @step:return
              javascript: |
                function mergeStones(stones) { // @step:entry
                    const n = stones.length; // @step:init_n
                    if (n <= 1) return 0; // @step:guard_less
                    const sum = new Array(n + 1).fill(0); // @step:init_sum
                    for (let i = 0; i < n; i++) sum[i + 1] = sum[i] + stones[i]; // @step:fill_sum
                    const dp = Array.from({ length: n }, () => new Array(n).fill(0)); // @step:init_dp
                    for (let i = n - 2; i >= 0; i--) { // @step:loop_i
                        for (let j = i + 1; j < n; j++) { // @step:calc_j
                            let minCost = Infinity; // @step:init_min
                            for (let k = i; k < j; k++) { // @step:loop_k
                                minCost = Math.min(minCost, dp[i][k] + dp[k + 1][j]); // @step:calc_cost
                            }
                            dp[i][j] = minCost + (sum[j + 1] - sum[i]); // @step:transfer
                        }
                    }
                    return dp[0][n - 1]; // @step:return
                }
