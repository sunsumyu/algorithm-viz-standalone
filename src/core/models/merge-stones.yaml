                    for (let i = 0; i < n; i++) sum[i + 1] = sum[i] + stones[i]; // @step:fill_sum
                    const memo = Array.from({ length: n }, () => new Array(n).fill(0)); // @step:init_dp
                    function dfs(i, j) { // @step:dfs_entry
                        if (i >= j) return 0; // @step:boundary
                        if (memo[i][j] !== 0) return memo[i][j]; // @step:cache_hit
