  stage-4:
    shortName: "极速贪心收敛"
    name: 优先队列堆内状态与极速收敛
    card2Title: "全局最小区间锁定 (Global Smallest Range)"
    card2Desc: "输出最终收敛的最小区间 [ansL, ansR]，所有列表均有代表元素覆盖其内。"
    description: 某个列表指针耗尽时算法收敛退出，输出最终最小区间 [ansL, ansR]
    complexity:
      time: O(N log k)
      space: O(k)
    code:
      forward:
        language: java
        source: |
