# ==============================================================================
# 🏆 [TOP-LEVEL TREE DP MODEL] 二叉树的直径 顶层领域模型
# 对应：LeetCode 543 / 左程云算法讲解 078 Code04
# 包含：自底向上最大深度汇报、拐点直径结算、状态依赖树与常数空间压缩
# ==============================================================================

id: tree-diameter
name: 二叉树的直径
category: dynamic-programming
difficulty: easy
tags:
  - 树型 DP
  - 动态规划
  - 深度优先搜索
  - 二叉树
  - 树的直径

description: |
  LeetCode 543 · 左程云算法通关课第 078 讲 树型 DP（上）Code04：二叉树的直径。
  给定一棵二叉树，计算它的直径长度。二叉树的直径是任意两个节点路径长度（边数）中的最大值。这条路径可能穿过也可能不穿过根节点。
  核心树型 DP 单边深度汇聚与拐点结算模型：
  每个节点向父节点汇报 [子树最大深度 height]：
  1. 当前子树高度 height = max(left, right) + 1
  2. 以当前节点为拐点的最长路径边数 currentDiameter = left + right
  3. 全局直径 maxDiameter = max(maxDiameter, currentDiameter)
  后序遍历自底向上单边流转，全局维护最高拐点跨度。

defaultParams:
  root: '1,2,3,4,5'

constraints:
  - 树中节点数目在范围 [1, 10^4] 内 (教学演示建议 <= 15)
  - -100 <= Node.val <= 100

directions:
  forward:
    name: 自底向上后序深度汇报 (Bottom-Up Post-Order Depth Flow)
    description: 后序遍历自底向上汇集左右子树单侧深度，以当前节点为拱顶拐点结算两点间最大距离边数
  reverse:
    name: 自顶向下先序路径对比探查 (Top-Down Pre-Order Path Exploration)
    description: 从根节点先序向下检验各子树的拐点跨度与深度，对比证明自底向上单趟 O(N) 后序汇聚的高效性

stages:
  stage-1:
    name: 后序遍历自底向上深度汇报
    description: 递归后序遍历二叉树，每个节点汇报子树最大深度，同时以当前节点为拐点更新全局直径
    complexity:
      time: O(N)
      space: O(H)
    code:
      forward:
        language: java
        source: |
          class Solution {
              private int maxDiameter = 0;
              public int diameterOfBinaryTree(TreeNode root) { // @step:entry
                  maxDepth(root); // @step:init
                  return maxDiameter; // @step:return
              }
              private int maxDepth(TreeNode node) { // @step:dfs_entry
                  if (node == null) return 0; // @step:boundary
                  int left = maxDepth(node.left); // @step:branch_left
                  int right = maxDepth(node.right); // @step:branch_right
                  maxDiameter = Math.max(maxDiameter, left + right); // @step:transfer
                  return Math.max(left, right) + 1; // @step:combine
              }
          }
      reverse:
        language: java
        source: |
          class SolutionTopDown {
              public int diameterReverse(TreeNode root) { // @step:entry
                  if (root == null) return 0; // @step:boundary
                  return explorePreOrder(root); // @step:return
              }
              private int explorePreOrder(TreeNode node) { // @step:dfs_entry
                  if (node == null) return 0; // @step:boundary
                  int lDepth = getDepth(node.left); // @step:branch_left
                  int rDepth = getDepth(node.right); // @step:branch_right
                  int cross = lDepth + rDepth; // @step:transfer
                  int lMax = explorePreOrder(node.left);
                  int rMax = explorePreOrder(node.right);
                  return Math.max(cross, Math.max(lMax, rMax)); // @step:combine
              }
              private int getDepth(TreeNode node) {
                  if (node == null) return 0;
                  return 1 + Math.max(getDepth(node.left), getDepth(node.right));
              }
          }

  stage-2:
    name: 递归调用与状态依赖树展开
    description: 显式构建后序递归的完整状态依赖树，展示每一个节点深入、子调用与拐点结算的完整路径
    complexity:
