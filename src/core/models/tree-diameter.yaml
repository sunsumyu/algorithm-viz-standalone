          // @step:branch_right 4. 深入右子树依赖节点
          // @step:transfer 5. 拐点结算：更新全局最大直径
          // @step:combine 6. 状态落盘：向父节点返回单侧深度
          // @step:return 7. 依赖树全遍历收敛
