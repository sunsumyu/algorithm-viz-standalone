# ==============================================================================
# 🏆 [TOP-LEVEL GREEDY MODEL] 摆动序列 顶层领域模型
# 对应：LeetCode 376 / 坡度极值贪心与交替状态机专题
# 包含：单调坡过滤、波峰波谷极值提取、交替动态规划双向对偶
# ==============================================================================

id: wiggle-subsequence
name: 摆动序列
category: greedy
difficulty: medium
tags:
  - 贪心算法
  - 动态规划
  - 数组
  - 状态交替

description: |
  如果连续数字之间的差严格在正数和负数之间交替，则数字序列称为摆动序列。
  第一个差（如果存在的话）可能是正数或负数。仅有一个元素或者含两个不等元素的序列也视作摆动序列。
  给你一个整数数组 nums ，返回 nums 中作为摆动序列的最长子序列的长度。
  核心策略：
  1. 贪心策略：遇到单调坡度或平坡，删除中间过渡节点，仅保留局部波峰与波谷；
  2. 动态规划策略：维护以当前元素结尾且最后差值为正的 up[i] 与为负的 down[i]。

defaultParams:
  nums: [1, 7, 4, 9, 2, 5]

constraints:
  - 1 <= nums.length <= 1000
  - 0 <= nums[i] <= 1000

directions:
  forward:
    name: 贪心单调坡过滤与峰谷提取
    description: 实时计算相邻差值，遇到正负交替反转则判定为有效波峰/波谷并更新前驱差值
  reverse:
    name: 交替状态机线性动态规划 (Dual-State DP)
    description: 维护以上升和下降结尾的两个交替状态数组 up[i] 与 down[i] 进行全状态空间推演

stages:
  stage-1:
    name: 贪心单调坡与波峰波谷模拟
    description: 正向扫描相邻差值，遇到峰值或谷值则计数加一并更新 preDiff
    complexity:
      time: O(N)
      space: O(1)
    code:
      forward:
        language: java
        source: |
          public int wiggleMaxLength(int[] nums) {
              // @step:guard 特判边界
              if (nums.length <= 1) return nums.length;
              // @step:init 状态初始化
              int curDiff = 0, preDiff = 0, count = 1;
              // @step:loop 正向遍历相邻数对
              for (int i = 1; i < nums.length; i++) {
                  curDiff = nums[i] - nums[i - 1];
                  // @step:peak_or_valley 遇到波峰或波谷
                  if ((curDiff > 0 && preDiff <= 0) || (curDiff < 0 && preDiff >= 0)) {
                      count++;
                      preDiff = curDiff;
                  }
              }
              // @step:done 返回最大摆动子序列长度
              return count;
          }
      reverse:
        language: java
        source: |
          public int wiggleMaxLengthDP(int[] nums) {
              // @step:init 初始化交替状态数组
              int n = nums.length;
              if (n <= 1) return n;
              int[] up = new int[n], down = new int[n];
              up[0] = 1; down[0] = 1;
              // @step:loop 状态转移递推
              for (int i = 1; i < n; i++) {
                  if (nums[i] > nums[i - 1]) {
                      up[i] = down[i - 1] + 1;
                      down[i] = down[i - 1];
                  } else if (nums[i] < nums[i - 1]) {
                      down[i] = up[i - 1] + 1;
                      up[i] = up[i - 1];
                  } else {
                      up[i] = up[i - 1];
                      down[i] = down[i - 1];
                  }
              }
              // @step:done 取两种状态终态最大值
              return Math.max(up[n - 1], down[n - 1]);
          }

  stage-2:
    name: 摆动状态交替决策树展开
    description: 自顶向下以 dfs(i, expectTrend) 展开保留当前节点与跳过坡度节点的决策分支
    complexity:
      time: O(2^N)
      space: O(N)
    code:
      forward:
        language: java
        source: |
          // @step:base 递归基准终止条件
          int dfs(int[] nums, int i, int expectTrend) {
              // @step:entry 探查当前位置
              if (i == nums.length) return 0;
              // @step:branch_skip 分支 1: 跳过当前坡度中间节点
              int skip = dfs(nums, i + 1, expectTrend);
              // @step:branch_pick 分支 2: 若当前满足交替方向，贪心采纳
              int pick = 0;
              if (expectTrend > 0 && nums[i] > nums[i - 1]) {
                  pick = 1 + dfs(nums, i + 1, -1);
              } else if (expectTrend < 0 && nums[i] < nums[i - 1]) {
                  pick = 1 + dfs(nums, i + 1, 1);
              }
              // @step:optimal 归约最优子树抉择
              return Math.max(skip, pick);
          }
      reverse:
        language: java
        source: |
          // 逆向自底向上状态转移推导
          int memoDfs(int[] nums, int i, int status, int[][] memo) {
              if (i == nums.length) return 0;
              if (memo[i][status] != 0) return memo[i][status];
              return memo[i][status] = Math.max(dfs(nums, i+1, status), 1 + dfs(nums, i+1, 1-status));
          }

  stage-3:
    name: 交替状态转移表格矩阵
    description: 建立二维状态表格跟踪 up[i] 与 down[i] 的同步演进轨迹
    complexity:
      time: O(N)
      space: O(N)
    code:
      forward:
        language: java
        source: |
          // @step:dp_init 初始化交替状态表格 table[n][2]
          int[][] dp = new int[n][2]; // 0: up, 1: down
          dp[0][0] = 1; dp[0][1] = 1;
          // @step:dp_loop 逐位递推演化
          for (int i = 1; i < n; i++) {
              // @step:dp_transfer 依据差值正负进行交替状态松弛
              if (nums[i] > nums[i - 1]) {
                  dp[i][0] = dp[i - 1][1] + 1;
                  dp[i][1] = dp[i - 1][1];
              } else if (nums[i] < nums[i - 1]) {
                  dp[i][1] = dp[i - 1][0] + 1;
                  dp[i][0] = dp[i - 1][0];
              } else {
                  dp[i][0] = dp[i - 1][0];
                  dp[i][1] = dp[i - 1][1];
              }
          }
          // @step:dp_done 终态最优解
          return Math.max(dp[n - 1][0], dp[n - 1][1]);
      reverse:
        language: java
        source: |
          // 逆向滚动交替更新
          for (int i = n - 2; i >= 0; i--) {
              if (nums[i] < nums[i+1]) up[i] = down[i+1] + 1;
          }

  stage-4:
    name: O(1) 空间极速双寄存器推演
    description: 极致压缩为 up 和 down 两个基础寄存器的常数空间单趟扫描
    complexity:
      time: O(N)
      space: O(1)
    code:
      forward:
        language: java
        source: |
          // @step:reg_init 寄存器初始化
          int up = 1, down = 1;
          // @step:reg_loop 单趟线性寄存器交替更新
          for (int i = 1; i < nums.length; i++) {
              if (nums[i] > nums[i - 1]) up = down + 1;
              else if (nums[i] < nums[i - 1]) down = up + 1;
          }
          // @step:reg_done 返回全局最大摆动长度
          return Math.max(up, down);
      reverse:
        language: java
        source: |
          // 差值流单寄存器
          int pre = 0, ans = 1;
          for (int i = 1; i < nums.length; i++) {
              int d = nums[i] - nums[i-1];
              if ((d > 0 && pre <= 0) || (d < 0 && pre >= 0)) { ans++; pre = d; }
          }
          return ans;
