# ==============================================================================
# 🏆 [TOP-LEVEL GREEDY MODEL] 组团买票顶层领域模型
# 对应：左程云算法讲解 091 Code02 / 美团笔试真题
# 包含：二次费用函数边际分析、Delta = B - K*(2x+1) 单调递减、大根堆离散贪心分配
# ==============================================================================

id: group-buy-tickets
name: 组团买票 (Group Buy Tickets)
category: greedy
difficulty: medium
tags:
  - 贪心算法
  - 堆（优先队列）
  - 二次函数
  - 边际效用
  - 状态树

description: |
  有 n 个人准备去景区游玩，景区有 m 个游乐项目 games[i] = [ki, bi]。
  对于项目 i，如果有 x 个人去玩，每个人的单张票价是 bi - ki * x（票价随人数增多而打折）。
  因此该项目产生的总费用为 Cost(x) = x * (bi - ki * x) = bi * x - ki * x^2。
  公司为员工保底兜底买单，希望评估在最极端情况下可能花费的最大保底总金额。
  核心贪心策略：
  1. 边际增益分析（Marginal Gain Delta）：
     - 当项目 i 的游玩人数从 x 增加到 x + 1 时，总费用新增量为：
       Delta(x + 1) = Cost(x + 1) - Cost(x) = bi - ki * (2x + 1)；
     - 由于 ki > 0，Delta(x) 随着 x 增大而严格单调递减（离散上凸函数）；
  2. 优先队列大根堆贪心（Max-Heap Greedy）：
     - 维护一个大根堆，存放各个项目当前下一位游玩者能带来的边际增量 Delta；
     - 每次贪心从堆顶弹出当前最大的 Delta，将 1 个人分配给该项目，并累加增量；
     - 计算该项目的下一个边际增量，若 > 0 则更新后压回大根堆，若 <= 0 则不再入堆；
     - 循环至多 n 次或堆为空，即可在 O(N log M) 内达成全局最优金额。
  3. Forward: 正向大根堆边际增量贪心提取。
  4. Reverse: 逆向对偶对比（倒序核验各项目人数分配的凹性收敛）。

defaultParams:
  n: 5
  games:
    - [2, 10]
    - [3, 12]
    - [1, 8]

constraints:
  - 1 <= n <= 10^5
  - 1 <= games.length <= 10^4
  - 1 <= ki, bi <= 10^6

directions:
  forward:
    name: 大根堆边际增量贪心调度 (Forward Max-Heap Marginal Gain)
    description: 大根堆动态跟踪各项目 Delta = bi - ki * (2x + 1)，贪心分配给增益最大项目
  reverse:
    name: 逆向对偶倒推与边际递减反证 (Reverse Dual Marginal Decay Contrast)
    description: 逆向对比边际收益衰减速率，反证贪心路径的全局凹性支配特征

stages:
  stage-1:
    name: 暴力人数分配枚举搜索
    description: 递归枚举将 n 个人分配到各个项目的全排列方案，展示二次费用极值
    complexity:
      time: O(m^n)
      space: O(m)
    code:
      forward:
        language: java
        content: |
          public int maxCostDFS(int n, int[][] games, int pIdx, int[] assigned) {
              if (pIdx == n) {
                  int total = 0;
                  for (int i = 0; i < games.length; i++) {
                      int x = assigned[i];
                      total += x * (games[i][1] - games[i][0] * x);
                  }
                  return total;
              }
              int maxCost = 0;
              for (int i = 0; i < games.length; i++) {
                  assigned[i]++;
                  maxCost = Math.max(maxCost, maxCostDFS(n, games, pIdx + 1, assigned));
                  assigned[i]--;
              }
              return maxCost;
          }
        anchors:
          entry: 1
          leaf: 2
          loop: 10
          pick: 11
          ret: 15
      reverse:
        language: java
        content: |
          public int maxCostDFSReverse(int n, int[][] games, int pIdx, int[] assigned) {
              return maxCostDFS(n, games, pIdx, assigned);
          }
        anchors:
          entry: 1
          leaf: 2
          loop: 10
          pick: 11
          ret: 15

  stage-2:
    name: 大根堆边际增量状态树展开
    description: 大根堆实时维护堆顶 Delta 极值，状态树完整展示每一位观众的人数分配与重新入堆
    complexity:
      time: O(N log M)
      space: O(M)
    code:
      forward:
        language: java
        content: |
          PriorityQueue<Game> pq = new PriorityQueue<>((a, b) -> b.delta - a.delta);
          for (int i = 0; i < m; i++) {
              int delta1 = games[i][1] - games[i][0];
              if (delta1 > 0) pq.offer(new Game(i, 0, delta1));
          }
          int total = 0;
          for (int step = 0; step < n && !pq.isEmpty(); step++) {
              Game cur = pq.poll();
              total += cur.delta;
              int nextX = cur.x + 1;
              int nextDelta = games[cur.id][1] - games[cur.id][0] * (2 * nextX + 1);
              if (nextDelta > 0) pq.offer(new Game(cur.id, nextX, nextDelta));
          }
          return total;
        anchors:
          heap_init: 1
          init_loop: 2
          alloc_loop: 7
          poll: 8
          update_delta: 10
          repush: 12
          done: 14
      reverse:
        language: java
        content: |
          // 逆向对偶核验
          return total;
        anchors:
          heap_init: 1
          init_loop: 2
          alloc_loop: 7
          poll: 8
          update_delta: 10
          repush: 12
          done: 14

  stage-3:
    name: 边际效益演进矩阵跟踪
    description: 矩阵动态记录 [分配步数, 选定项目, 当前边际增益, 分配后人数, 当前项目总花费, 累计保底总额]
    complexity:
      time: O(N log M)
      space: O(N)
    code:
      forward:
        language: java
        content: |
          // M[step] 记录每次分配决策
          for (int step = 0; step < n && !pq.isEmpty(); step++) {
              Game cur = pq.poll();
              totalCost += cur.delta;
              matrix[step] = new Object[]{step + 1, cur.id, cur.delta, cur.x + 1, itemCost, totalCost};
          }
        anchors:
          init: 1
          loop: 2
          update: 4
          done: 6
      reverse:
        language: java
        content: |
          for (int step = 0; step < n && !pq.isEmpty(); step++) {
              matrix[step] = new Object[]{step + 1, cur.id, cur.delta, cur.x + 1, itemCost, totalCost};
          }
        anchors:
          init: 1
          loop: 2
          update: 4
          done: 6

  stage-4:
    name: 二次函数凹性与边际递减反证
    description: 数学反证：二次曲线 Cost(x) = Bx - Kx^2 的导数 B - 2Kx 单调递减，贪心每一步均为离散导数全局极值
    complexity:
      time: O(1)
      space: O(1)
    code:
      forward:
        language: java
        content: |
          // 1. 二阶导验证：Cost''(x) = -2K < 0，函数在 (0, +∞) 为严格严格上凸（凹函数）。
          // 2. 离散导数单调性：Delta(x+1) - Delta(x) = -2K < 0，边际增量严格单调递减。
          // 3. 拟阵贪心定理 (Matroid Greedy)：在凹函数离散和约束下，每次选择局部最大增量构成的解必然是全局最优解！
          return totalCost;
        anchors:
          proof_concave: 1
          proof_marginal: 2
          proof_matroid: 3
          proof_ret: 4
      reverse:
        language: java
        content: |
          // 逆向对偶反证
          return totalCost;
        anchors:
          proof_concave: 1
          proof_marginal: 2
          proof_matroid: 3
          proof_ret: 4
