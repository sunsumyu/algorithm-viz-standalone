# ==============================================================================
# 🏆 [TOP-LEVEL TREE DP MODEL] 相邻字符不同的最长路径 顶层领域模型
# 对应：LeetCode 2246 / 左程云算法讲解 079 Code04
# 包含：树型 DP 拐点模型、贪心收集最长与次长合法子链 max1/max2、拱顶融合 1+max1+max2
# ==============================================================================

id: longest-path-different-characters
name: 相邻字符不同的最长路径 (LeetCode 2246)
category: dynamic-programming
difficulty: hard
tags:
  - 树型 DP
  - 动态规划
  - 贪心
  - 树
  - 深度优先搜索

description: |
  LeetCode 2246 · 左程云算法通关课第 079 讲 树型 DP（下）Code04：相邻字符不同的最长路径。
  给你一棵树，根节点为 0。每个节点分配一个字符 s[i]。
  求一条路径，路径上任意相邻节点字符均不相同，求满足条件的最长路径包含的节点数目。
  
  核心树型 DP 拐点模型 (Tree Longest Path with Pivot):
  1. 状态定义：以节点 u 为根的子树中，向父节点汇报【以 u 为起点的单侧合法最长单链节点数】。
  2. 字符约束校验：遍历 u 的每个子节点 v，只有当 s[u] != s[v] 时，(u, v) 这条边才合法可连通。
  3. 贪心收集最长与次长子链：
     在所有字符不同的合法子节点汇报中，贪心维护最大值 max1 与次大值 max2。
  4. 拐点路径结算 (Pivot Path Fusion)：
     穿过当前节点 u 拼接两条最长子链，形成以 u 为拱顶的折线路径：
     pathLen = 1 + max1 + max2。
     全局最大路径即为所有节点作为拐点时的最大值：maxPath = max(maxPath, pathLen)。
  5. 向直接父节点汇报单侧最长链：return 1 + max1。

defaultParams:
  n: 6
  parent: [-1, 0, 0, 1, 1, 2]
  s: "abacbe"

constraints:
  - n == parent.length == s.length
  - 1 <= n <= 10^5（教学演示推荐 5~10）
  - parent[0] == -1
  - s 仅包含小写英文字母

directions:
  forward:
    name: 自底向上多叉树拐点归约 (Bottom-Up Tree Pivot Fusion)
    description: 后序遍历自底向上汇聚单侧合法最长单链，并在每个节点贪心合并最长与次长互异分支
  reverse:
    name: 自顶向下根向单链试探对比 (Top-Down Root-Path Exploration)
    description: 从根节点 0 出发自顶向下贪心试探单向互异链，对比验证自底向上双向拐点融合的完备性

stages:
  stage-1:
    name: 后序遍历单链汇报与拐点结算
    description: 后序遍历多叉树，校验相邻字符互异约束，贪心维护最长与次长子链并刷新全局最长路径
    complexity:
      time: O(N)
      space: O(N)
    code:
      forward:
        language: java
        source: |
          class Solution {
              private int maxPath = 1; // @step:entry
              public int longestPath(int[] parent, String s) {
                  int n = parent.length; // @step:build_tree
                  List<Integer>[] tree = new ArrayList[n];
                  for (int i = 0; i < n; i++) tree[i] = new ArrayList<>();
                  for (int i = 1; i < n; i++) tree[parent[i]].add(i); // @step:init_graph
                  dfs(0, tree, s); // @step:dfs_call
                  return maxPath; // @step:return
              }
              private int dfs(int u, List<Integer>[] tree, String s) { // @step:dfs_entry
                  int max1 = 0, max2 = 0; // @step:init_chains
                  for (int v : tree[u]) { // @step:loop_child
                      int len = dfs(v, tree, s); // @step:branch_call
                      if (s.charAt(u) != s.charAt(v)) { // @step:check_char
                          if (len > max1) { max2 = max1; max1 = len; } // @step:update_max1
                          else if (len > max2) { max2 = len; } // @step:update_max2
                      }
                  }
                  maxPath = Math.max(maxPath, 1 + max1 + max2); // @step:combine_pivot
                  return 1 + max1; // @step:return_chain
              }
          }
      reverse:
        language: java
        source: |
          class SolutionTopDown {
              public int longestPathReverse(int[] parent, String s) { // @step:entry
                  int n = parent.length; // @step:build_tree
                  List<Integer>[] tree = new ArrayList[n];
                  for (int i = 0; i < n; i++) tree[i] = new ArrayList<>();
                  for (int i = 1; i < n; i++) tree[parent[i]].add(i); // @step:init_graph
                  return exploreFromRoot(0, tree, s, ' '); // @step:return
              }
              private int exploreFromRoot(int u, List<Integer>[] tree, String s, char prev) { // @step:dfs_entry
                  int len = (s.charAt(u) != prev) ? 1 : 0; // @step:init_chains
                  int maxSub = 0; // @step:loop_child
                  for (int v : tree[u]) { // @step:branch_call
                      if (s.charAt(u) != s.charAt(v)) { // @step:check_char
                          maxSub = Math.max(maxSub, exploreFromRoot(v, tree, s, s.charAt(u))); // @step:update_max1
                      }
                  }
                  return len + maxSub; // @step:return_chain
              }
          }

