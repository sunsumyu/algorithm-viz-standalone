                };
              python: |
                class Solution:
                    def maxCoins(self, nums: List[int]) -> int: # @step:entry
                        val = [1] + nums + [1] # @step:init_val
                        memo = {} # @step:init_dp
                        def dfs(i: int, j: int) -> int: # @step:dfs_entry
                            if i + 1 >= j: return 0 # @step:boundary
                            if (i, j) in memo: return memo[(i, j)] # @step:cache_hit
                            best = 0 # @step:init_best
                            for k in range(i + 1, j): # @step:loop_k
                                gain = val[i] * val[k] * val[j] # @step:calc_gain
                                coins = dfs(i, k) + dfs(k, j) + gain # @step:calc_coins
                                best = max(best, coins) # @step:update_best
                            memo[(i, j)] = best # @step:transfer
                            return best # @step:return
                        return dfs(0, len(nums) + 1) # @step:call_dfs
              javascript: |
                function maxCoins(nums) { // @step:entry
                    const val = [1, ...nums, 1]; // @step:init_val
                    const memo = Array.from({ length: val.length }, () => new Array(val.length).fill(0)); // @step:init_dp
                    function dfs(i, j) { // @step:dfs_entry
                        if (i + 1 >= j) return 0; // @step:boundary
                        if (memo[i][j] !== 0) return memo[i][j]; // @step:cache_hit
                        let best = 0; // @step:init_best
                        for (let k = i + 1; k < j; k++) { // @step:loop_k
                            const gain = val[i] * val[k] * val[j]; // @step:calc_gain
                            const coins = dfs(i, k) + dfs(k, j) + gain; // @step:calc_coins
                            best = Math.max(best, coins); // @step:update_best
                        }
                        memo[i][j] = best; // @step:transfer
                        return best; // @step:return
                    }
                    return dfs(0, nums.length + 1); // @step:call_dfs
                }

  stage-3:
    shortName: "二维DP"
    type: "tabulation"
    timeBadge: "O(n³)"
    badgeBg: "bg-emerald-100 text-emerald-700"
    name:
      forward: "阶段 3: 严格二维表递推 (按区间跨度自底向上填表)"
      reverse: "阶段 3: 逆向依赖寻源填表 (从全开区间逆向校验)"
    desc:
      forward: "严格按开区间长度 len 从 2 到 n + 1 递增循环，内层枚举左端点 i 计算右端点 j = i + len，确保枚举 k 时所依赖的 dp[i][k] 和 dp[k][j] 均已填妥。"
      reverse: "逆向展示上三角网格拓扑顺序与状态转移依赖。"
    variants:
      standard:
        variantLabel: "标准区间DP填表"
        title:
          forward: "BurstBalloons_Tabulation.java"
          reverse: "BurstBalloons_Tabulation_Reverse.java"
        code:
          forward:
            title: "BurstBalloons_Tabulation.java"
            source: |
              class Solution {
                  public int maxCoins(int[] nums) { // @step:entry
                      int n = nums.length; // @step:init_n
                      int[] val = new int[n + 2]; // @step:init_val
                      val[0] = 1; val[n + 1] = 1; // @step:set_border
                      for (int i = 0; i < n; i++) val[i + 1] = nums[i]; // @step:fill_val
                      int[][] dp = new int[n + 2][n + 2]; // @step:init_dp
                      for (int len = 2; len <= n + 1; len++) { // @step:loop_len
                          for (int i = 0; i <= n + 1 - len; i++) { // @step:loop_i
                              int j = i + len; // @step:calc_j
                              int best = 0; // @step:init_best
                              for (int k = i + 1; k < j; k++) { // @step:loop_k
                                  int gain = val[i] * val[k] * val[j]; // @step:calc_gain
                                  int coins = dp[i][k] + dp[k][j] + gain; // @step:calc_coins
                                  best = Math.max(best, coins); // @step:update_best
                              }
                              dp[i][j] = best; // @step:transfer
                          }
                      }
                      return dp[0][n + 1]; // @step:return
                  }
              }
