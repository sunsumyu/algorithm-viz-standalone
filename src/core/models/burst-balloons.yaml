# ==============================================================================
# 🏆 [TOP-LEVEL ALGORITHM MODEL] 顶层抽象模型规范
# 戳气球 (LeetCode 312 / 左程云 Class 076 Code03)
# 核心：区间 DP 经典逆向思维——枚举开区间 (i, j) 中最后一个被戳破的气球 k
# 四阶段全演化标准参考模型 (Stage 1-4, forward/reverse 双向支持)
# ==============================================================================

id: burst-balloons
name: "戳气球"
nameEn: "Burst Balloons"
defaultStage: "stage-3"
category: "dynamic-programming"
icon: "🎈"
difficulty: 3
levelOrder: 312
learningGoal: "深刻理解区间 DP 逆向思维，通过枚举最后戳破的气球消解子问题边界依赖"
description: "左程云算法通关课 Class 076 Code03：LeetCode 312 戳气球，区间 DP 逆向思维之最后戳破气球模型，dp[i][j] = max(dp[i][k] + dp[k][j] + val[i]*val[k]*val[j])"
defaultParams:
  nums: [3, 1, 5, 8]

problem:
  leetcodeId: 312
  title: "戳气球 (LeetCode 312 / Class 076 Code03)"
  difficulty: "困难"
  tags: ["动态规划", "区间 DP", "分治", "逆向思维"]
  description: "有 <code>n</code> 个气球，编号为 <code>0</code> 到 <code>n - 1</code>，每个气球上都标有一个数字，这些数字存在数组 <code>nums</code> 中。<br/><br/>现在要求你戳破所有的气球。戳破第 <code>i</code> 个气球，你可以获得 <code>nums[i - 1] * nums[i] * nums[i + 1]</code> 枚硬币。这里的 <code>i - 1</code> 和 <code>i + 1</code> 代表和 <code>i</code> 相邻的两个气球的序号。如果 <code>i - 1</code> 或 <code>i + 1</code> 超出了数组的边界，那么就当它是一个数字为 <code>1</code> 的气球。<br/><br/>求所能获得硬币的最大数量。"
  examples:
    - input: "nums = [3, 1, 5, 8]"
      output: "167"
      explanation: "nums = [3,1,5,8] --> [3,5,8] --> [3,8] --> [8] --> []<br/>coins = 3*1*5 + 3*5*8 + 1*3*8 + 1*8*1 = 15 + 120 + 24 + 8 = 167"
    - input: "nums = [1, 5]"
      output: "10"
      explanation: "1*5*1 + 1*1*1 = 5 + 5 = 10"
  constraints:
    - "n == nums.length"
    - "1 <= n <= 300 (演示推荐 <= 6)"
    - "0 <= nums[i] <= 100"
  leetcodeUrl: "https://leetcode.cn/problems/burst-balloons/"

directions:
  forward:
    label: "开区间跨度顺推 (len=2..n+1 自短到长)"
    branches:
      - name: "sub_left"
        label: "左子开区间 (i, k)"
        formula: "dp[i][k]"
      - name: "sub_right"
        label: "右子开区间 (k, j)"
        formula: "dp[k][j]"
      - name: "burst_gain"
        label: "最后戳破气球 k 获得硬币"
        formula: "val[i] * val[k] * val[j]"
    combineFormula: "max_{k}(dp[i][k] + dp[k][j] + val[i] * val[k] * val[j])"
  reverse:
    label: "全局区间逆推分解 (从 (0, n+1) 逆向寻源)"
    description: "从完整开区间 (0, n+1) 出发，逆向枚举分割点 k 递归分解子区间"
    startFormula: "dp[0][n + 1]"
    target: "dp[i][i + 1] = 0"
    branches:
      - name: "trace_k"
        label: "逆向溯源最优气球 k"
        formula: "dp[i][k] + dp[k][j] + val[i]*val[k]*val[j]"
    combineFormula: "逆向状态依赖"

stages:
  stage-1:
    shortName: "递归"
    type: "recursion"
    timeBadge: "O(n!)"
    badgeBg: "bg-slate-100 text-slate-700"
    name:
      forward: "阶段 1: 暴力递归分支展开 (开区间枚举最后戳破气球)"
      reverse: "阶段 1: 暴力递归逆推寻源 (状态空间倒序展开)"
    desc:
      forward: "首尾添加虚拟气球 1，构造开区间 (i, j)。逆向枚举区间内最后一个被戳破的气球 k，将问题分解为完全互不影响的独立子问题 (i, k) 与 (k, j)。"
      reverse: "从顶层完整区间 (0, n+1) 开始递归展开，展示指数级爆炸的子问题分支与庞大的重复计算。"
    variants:
      standard:
        variantLabel: "标准递归实现"
        title:
          forward: "BurstBalloons_Recursive.java"
          reverse: "BurstBalloons_Recursive_Reverse.java"
        code:
          forward:
            title: "BurstBalloons_Recursive.java"
            source: |
              class Solution {
                  public int maxCoins(int[] nums) { // @step:entry
                      int n = nums.length; // @step:init_n
                      int[] val = new int[n + 2]; // @step:init_val
                      val[0] = 1; val[n + 1] = 1; // @step:set_border
                      for (int i = 0; i < n; i++) val[i + 1] = nums[i]; // @step:fill_val
                      return dfs(val, 0, n + 1); // @step:init_dp
                  }
                  private int dfs(int[] val, int i, int j) { // @step:dfs_entry
                      if (i + 1 >= j) return 0; // @step:boundary
                      int best = 0; // @step:init_best
                      for (int k = i + 1; k < j; k++) { // @step:loop_k
                          int gain = val[i] * val[k] * val[j]; // @step:calc_gain
                          int coins = dfs(val, i, k) + dfs(val, k, j) + gain; // @step:calc_coins
                          best = Math.max(best, coins); // @step:transfer
                      }
                      return best; // @step:return
                  }
              }
