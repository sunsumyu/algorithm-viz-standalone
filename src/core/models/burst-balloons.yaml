                    }
                    return dfs(0, nums.length + 1); // @step:init_dp
                }

  stage-2:
    shortName: "记忆化"
    type: "memoization"
    timeBadge: "O(n³)"
    badgeBg: "bg-blue-100 text-blue-700"
    name:
      forward: "阶段 2: 记忆化搜索剪枝 (上三角备忘录缓存)"
      reverse: "阶段 2: 逆向记忆化状态空间探查"
    desc:
      forward: "引入 memo[n+2][n+2] 上三角备忘录，记录各开区间 (i, j) 戳破全部气球的最优解，重叠子问题直接 O(1) 查表返回。"
      reverse: "自顶向下记忆化搜索，命中已计算子区间时直接剪枝。"
    variants:
      standard:
        variantLabel: "标准记忆化实现"
        title:
          forward: "BurstBalloons_Memo.java"
          reverse: "BurstBalloons_Memo_Reverse.java"
        code:
          forward:
            title: "BurstBalloons_Memo.java"
            source: |
              class Solution {
                  public int maxCoins(int[] nums) { // @step:entry
                      int n = nums.length; // @step:init_n
                      int[] val = new int[n + 2]; // @step:init_val
                      val[0] = 1; val[n + 1] = 1; // @step:set_border
                      for (int i = 0; i < n; i++) val[i + 1] = nums[i]; // @step:fill_val
                      int[][] memo = new int[n + 2][n + 2]; // @step:init_dp
                      return dfs(val, memo, 0, n + 1); // @step:call_dfs
                  }
                  private int dfs(int[] val, int[][] memo, int i, int j) { // @step:dfs_entry
                      if (i + 1 >= j) return 0; // @step:boundary
                      if (memo[i][j] != 0) return memo[i][j]; // @step:cache_hit
                      int best = 0; // @step:init_best
                      for (int k = i + 1; k < j; k++) { // @step:loop_k
                          int gain = val[i] * val[k] * val[j]; // @step:calc_gain
                          int coins = dfs(val, memo, i, k) + dfs(val, memo, k, j) + gain; // @step:calc_coins
                          best = Math.max(best, coins); // @step:update_best
                      }
                      memo[i][j] = best; // @step:transfer
                      return best; // @step:return
                  }
              }
            languages:
              java: |
