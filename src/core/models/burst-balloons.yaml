              python: |
                class Solution:
                    def maxCoins(self, nums: List[int]) -> int: # @step:entry
                        n = len(nums) # @step:init_n
                        val = [1] + nums + [1] # @step:init_val
                        dp = [[0] * (n + 2) for _ in range(n + 2)] # @step:init_dp
                        for i in range(n, -1, -1): # @step:loop_i
                            for j in range(i + 2, n + 2): # @step:calc_j
                                best = 0 # @step:init_best
                                for k in range(i + 1, j): # @step:loop_k
                                    gain = val[i] * val[k] * val[j] # @step:calc_gain
                                    coins = dp[i][k] + dp[k][j] + gain # @step:calc_coins
                                    best = max(best, coins) # @step:update_best
                                dp[i][j] = best # @step:transfer
                        return dp[0][n + 1] # @step:return
              javascript: |
                function maxCoins(nums) { // @step:entry
                    const n = nums.length; // @step:init_n
                    const val = [1, ...nums, 1]; // @step:init_val
                    const dp = Array.from({ length: n + 2 }, () => new Array(n + 2).fill(0)); // @step:init_dp
                    for (let i = n; i >= 0; i--) { // @step:loop_i
                        for (let j = i + 2; j <= n + 1; j++) { // @step:calc_j
                            let best = 0; // @step:init_best
                            for (let k = i + 1; k < j; k++) { // @step:loop_k
                                const gain = val[i] * val[k] * val[j]; // @step:calc_gain
                                const coins = dp[i][k] + dp[k][j] + gain; // @step:calc_coins
                                best = Math.max(best, coins); // @step:update_best
                            }
                            dp[i][j] = best; // @step:transfer
                        }
                    }
                    return dp[0][n + 1]; // @step:return
                }
