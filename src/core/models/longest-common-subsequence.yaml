id: longest-common-subsequence
name: 最长公共子序列
category: dynamic-programming
difficulty: medium
defaultStage: stage-1
defaultDirection: forward

defaultParams:
  s1: "abcde"
  s2: "ace"
  m: 5
  n: 3

problem:
  title: "LeetCode 1143. 最长公共子序列"
  difficulty: "Medium"
  description: |
    给定两个字符串 <code>text1</code> 和 <code>text2</code>，返回这两个字符串的最长 <strong>公共子序列</strong> 的长度。如果不存在公共子序列，返回 <code>0</code>。

    一个字符串的 <strong>子序列</strong> 是指这样一个新的字符串：它是由原字符串在不改变字符的相对顺序的情况下删除某些字符（也可以不删除任何字符）后组成的新字符串。
  examples:
    - input: 'text1 = "abcde", text2 = "ace"'
      output: "3"
      explanation: '最长公共子序列是 "ace"，它的长度为 3。'
    - input: 'text1 = "abc", text2 = "abc"'
      output: "3"
      explanation: '最长公共子序列是 "abc"，它的长度为 3。'
    - input: 'text1 = "abc", text2 = "def"'
      output: "0"
      explanation: '两个字符串没有公共子序列，返回 0。'
  constraints:
    - "1 <= text1.length, text2.length <= 1000"
    - "text1 和 text2 仅由小写英文字母组成"

directions:
  forward:
    label: "顺推 (正序)"
    name: 前缀递推视角 (正向构造)
    description: 从前缀匹配出发，从空串扩展至完整字符串，目标为 dp[n][m]
    branches:
      - name: 字符匹配 (对角线)
        delta: [-1, -1]
        arrow: ↖
        description: text1[i-1] == text2[j-1]，纳入公共子序列，转移自 dp[i-1][j-1] + 1
      - name: 缩减 text1 (上方)
        delta: [-1, 0]
        arrow: ↑
        description: text1[i-1] != text2[j-1]，舍弃 text1 当前字符，继承 dp[i-1][j]
      - name: 缩减 text2 (左侧)
        delta: [0, -1]
        arrow: ←
        description: text1[i-1] != text2[j-1]，舍弃 text2 当前字符，继承 dp[i][j-1]
  reverse:
    label: "逆推 (倒序)"
    name: 后缀递推视角 (倒序回溯)
    description: 从两串末尾向前回溯，目标为 dp[0][0]

stages:
  stage-1:
    shortName: "递归"
    name: "阶段 1: 朴素递归"
    desc: 双串末尾匹配分治，字符相同沿对角线深入 (+1)，字符不同分裂为向上与向左两路子问题取最大值。
    timeComplexity: "O(2^(m+n))"
    spaceComplexity: "O(m+n)"
    variants:
      standard:
        name: 标准递归
        desc: 双串末尾匹配分治
        code: |
          public int longestCommonSubsequence(String text1, String text2) {
              return dfs(text1, text2, text1.length(), text2.length());
          }

          private int dfs(String s1, String s2, int i, int j) {
              // @step:boundary 任一字符串为空串时返回 0
              if (i == 0 || j == 0) return 0;

              // @step:match 字符匹配：纳入公共子序列 (+1)
              if (s1.charAt(i - 1) == s2.charAt(j - 1)) {
                  // @step:match_branch 深入左上对角线
                  return 1 + dfs(s1, s2, i - 1, j - 1);
              }

              // @step:diff 字符不同：向上分支
              int p1 = dfs(s1, s2, i - 1, j);
              // @step:diff_left 向左分支
              int p2 = dfs(s1, s2, i, j - 1);

              // @step:combine 取两分支最大值
              return Math.max(p1, p2);
          }

  stage-2:
    shortName: "记忆化"
    name: "阶段 2: 记忆化搜索"
    desc: 引入 memo[i][j] 备忘录缓存已计算的前缀子问题，O(1) 命中剪枝，消除重叠子问题。
    timeComplexity: "O(m * n)"
    spaceComplexity: "O(m * n)"
    variants:
      standard:
        name: 二维备忘录优化
        desc: 记忆化二维前缀状态
        code: |
          public int longestCommonSubsequence(String text1, String text2) {
              int m = text1.length(), n = text2.length();
              Integer[][] memo = new Integer[m + 1][n + 1];
              return dfs(text1, text2, m, n, memo);
          }

          private int dfs(String s1, String s2, int i, int j, Integer[][] memo) {
              // @step:boundary 任一字符串为空串时返回 0
              if (i == 0 || j == 0) return 0;

              // @step:cache_hit 备忘录命中剪枝，O(1) 立即返回
              if (memo[i][j] != null) return memo[i][j];

              // @step:match 字符匹配判断
              if (s1.charAt(i - 1) == s2.charAt(j - 1)) {
                  // @step:match_branch 深入对角线并缓存
                  return memo[i][j] = 1 + dfs(s1, s2, i - 1, j - 1, memo);
              }

              // @step:diff 字符不同：分支探索
              int p1 = dfs(s1, s2, i - 1, j, memo);
              int p2 = dfs(s1, s2, i, j - 1, memo);

              // @step:combine 缓存并返回最大值
              return memo[i][j] = Math.max(p1, p2);
          }

  stage-3:
    shortName: "二维DP"
    name: "阶段 3: 严格二维表"
    desc: 构建 (m+1)×(n+1) 的二维 DP 状态表格，自底向上顺序填表，清晰展现对角线与上下左前驱拓扑依赖。
    timeComplexity: "O(m * n)"
    spaceComplexity: "O(m * n)"
    variants:
      standard:
        name: 经典二维 DP 表格
        desc: 严格按照拓扑依赖逐行逐列填表
        code: |
          public int longestCommonSubsequence(String text1, String text2) {
              int m = text1.length(), n = text2.length();
              // @step:init 创建 (m+1)x(n+1) 二维 DP 状态表
              int[][] dp = new int[m + 1][n + 1];

              // @step:loop_i 自底向上逐行遍历
              for (int i = 1; i <= m; i++) {
                  // @step:loop_j 逐列计算状态
                  for (int j = 1; j <= n; j++) {
                      // @step:cond 字符是否匹配
                      if (text1.charAt(i - 1) == text2.charAt(j - 1)) {
                          // @step:transfer_match 字符相同：对角线加 1 转移
                          dp[i][j] = 1 + dp[i - 1][j - 1];
                      } else {
                          // @step:transfer_diff 字符不同：继承上方或左侧最大值
                          dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
                      }
                  }
              }
              // @step:return 返回右下角最终解
              return dp[m][n];
          }

  stage-4:
    shortName: "一维优化"
    name: "阶段 4: 一维滚动压缩"
    desc: 使用一维滚动数组与临时变量 leftUp 暂存左上角 dp[i-1][j-1]，将空间复杂度从 O(m*n) 极限压缩至 O(n)。
    timeComplexity: "O(m * n)"
    spaceComplexity: "O(n)"
    variants:
      rolling_1d:
        name: 一维滚动数组 (带 leftUp 对角线暂存)
        desc: leftUp 记录左上角旧值，dp[j] 代表上方，dp[j-1] 代表左侧
        code: |
          public int longestCommonSubsequence(String text1, String text2) {
              int m = text1.length(), n = text2.length();
              // @step:init 创建一维状态数组 dp[0..n]
              int[] dp = new int[n + 1];

              // @step:loop_i 外层遍历 text1 每一行
              for (int i = 1; i <= m; i++) {
                  // @step:pre_init 暂存每行首列的左上角 leftUp
                  int leftUp = 0;

                  // @step:loop_j 内层遍历 text2
                  for (int j = 1; j <= n; j++) {
                      int backup = dp[j]; // 暂存未覆盖前的上方旧值
                      // @step:cond 字符是否匹配
                      if (text1.charAt(i - 1) == text2.charAt(j - 1)) {
                          // @step:transfer_match 字符相同：对角线加 1
                          dp[j] = leftUp + 1;
                      } else {
                          // @step:transfer_diff 字符不同：max(上方旧值, 左方新值)
                          dp[j] = Math.max(dp[j], dp[j - 1]);
                      }
                      // @step:shift_pre 寄存器推移
                      leftUp = backup;
                  }
              }
              // @step:return 返回一维数组末尾最终解
              return dp[n];
          }
      rolling_1d_reverse:
        name: 逆推一维滚动数组 (带 rightDown 对角线暂存)
        desc: rightDown 记录右下角旧值，dp[j] 代表下方，dp[j+1] 代表右侧，倒序更新
        code: |
          public int longestCommonSubsequenceReverse(String text1, String text2) {
              int m = text1.length(), n = text2.length();
              // @step:init 创建逆推一维状态数组 dp[0..n]
              int[] dp = new int[n + 1];

              // @step:loop_i 外层遍历 text1 每一行 (倒序)
              for (int i = m - 1; i >= 0; i--) {
                  // @step:pre_init 暂存每行末列的右下角 rightDown
                  int rightDown = 0;

                  // @step:loop_j 内层遍历 text2 (倒序)
                  for (int j = n - 1; j >= 0; j--) {
                      int backup = dp[j]; // 暂存未覆盖前的下方旧值
                      // @step:cond 后缀字符是否匹配
                      if (text1.charAt(i) == text2.charAt(j)) {
                          // @step:transfer_match 字符相同：右下对角线加 1
                          dp[j] = rightDown + 1;
                      } else {
                          // @step:transfer_diff 字符不同：max(下方旧值, 右方新值)
                          dp[j] = Math.max(dp[j], dp[j + 1]);
                      }
                      // @step:shift_pre 寄存器推移
                      rightDown = backup;
                  }
              }
              // @step:return 返回一维数组首项最终解
              return dp[0];
          }
