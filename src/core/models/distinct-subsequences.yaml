id: distinct-subsequences
name: "不同的子序列"
nameEn: "Distinct Subsequences"
defaultStage: "stage-1"
category: "dynamic-programming"
icon: "🧮"
difficulty: 3
levelOrder: 8
learningGoal: "掌握双序列匹配决策分支、空串 Base Case 初始化与一维倒序空间压缩核心技巧"
description: "子序列方案数（LeetCode 115）：计算在字符串 s 的子序列中 t 出现的个数，状态转移 dp[i][j] = dp[i-1][j-1] + dp[i-1][j] 与一维倒序压缩。"
defaultParams:
  s: "rabbbit"
  t: "rabbit"

problem:
  leetcodeId: 115
  title: "不同的子序列"
  difficulty: "困难"
  tags: ["字符串", "动态规划"]
  description: "给你两个字符串 <code>s</code> 和 <code>t</code> ，统计并返回在 <code>s</code> 的 <strong>子序列</strong> 中 <code>t</code> 出现的个数。<br/><br/>题目数据保证答案在 32 位带符号整数范围内。"
  examples:
    - input: 's = "rabbbit", t = "rabbit"'
      output: "3"
      explanation: "如下图所示, 有 3 种可以从 s 中得到 \"rabbit\" 的方案。<br/><strong><u>rabb</u></strong>b<strong><u>it</u></strong><br/><strong><u>ra</u></strong>b<strong><u>bbit</u></strong><br/><strong><u>rab</u></strong>b<strong><u>bit</u></strong>"
    - input: 's = "babgbag", t = "bag"'
      output: "5"
      explanation: "如下图所示, 有 5 种可以从 s 中得到 \"bag\" 的方案。<br/><strong><u>ba</u></strong>b<strong><u>g</u></strong>bag<br/><strong><u>ba</u></strong>bgba<strong><u>g</u></strong><br/><strong><u>b</u></strong>abgb<strong><u>ag</u></strong><br/>ba<strong><u>b</u></strong>gb<strong><u>ag</u></strong><br/>babg<strong><u>bag</u></strong>"
  constraints:
    - "1 <= s.length, t.length <= 1000"
    - "s 和 t 由英文字母组成"
  leetcodeUrl: "https://leetcode.cn/problems/distinct-subsequences/"

directions:
  forward:
    label: "顺推 (前缀递推)"
    name: "前缀递推视角"
    description: "从 s[0..i-1] 匹配 t[0..j-1]，从左上 (0, 0) 顺推至右下 (m, n)，最终答案为 dp[m][n]"
    start: [0, 0]
    target: [7, 6]
    startFormula: "dp[i][0] = 1"
    targetFormula: "dp[m][n]"
    branches:
      - name: "match"
        delta: [1, 1]
        label: "匹配当前字符"
        codeVar: "match"
        arrow: "↘️"
      - name: "skip"
        delta: [1, 0]
        label: "跳过源串字符"
        codeVar: "skip"
        arrow: "⬇️"
    combineFormula: "match + skip"
  reverse:
    label: "逆推 (后缀递推)"
    name: "后缀递推视角"
    description: "从 s[i..m-1] 匹配 t[j..n-1]，从右下 (m, n) 逆推至左上 (0, 0)，最终答案为 dp[0][0]"
    start: [7, 6]
    target: [0, 0]
    startFormula: "dp[i][n] = 1"
    targetFormula: "dp[0][0]"
    branches:
      - name: "match"
        delta: [-1, -1]
        label: "逆向匹配字符"
        codeVar: "match"
        arrow: "↖️"
      - name: "skip"
        delta: [-1, 0]
        label: "逆向跳过字符"
        codeVar: "skip"
        arrow: "⬆️"
    combineFormula: "match + skip"

stages:
  stage-1:
    shortName: "递归"
    type: "recursion"
    timeBadge: "O(2ᵐ)"
    badgeBg: "bg-slate-100 text-slate-700"
    name:
      forward: "阶段 1: 朴素递归 (正序顺推探索)"
      reverse: "阶段 1: 朴素递归 (倒序逆推寻源)"
    desc:
      forward: "从 dfs(0, 0) 开始向后顺推展开子问题。当前字符相等时选择「匹配」或「跳过不用」；不相等时只能「跳过不用」。"
      reverse: "从 dfs(m, n) 开始向前逆向分解前缀子问题。末尾字符相等时选择「匹配」或「跳过不用」；不相等时只能「跳过不用」。"
    variants:
      standard:
        variantLabel: "标准二叉递归"
        title:
          forward: "DistinctSubsequences_Recursive_Forward.java"
          reverse: "DistinctSubsequences_Recursive_Reverse.java"
        code:
          forward:
            title: "DistinctSubsequences_Recursive_Forward.java"
            source: |
              class Solution {
                  public int numDistinct(String s, String t) {
                      return dfs(s, t, 0, 0);
                  }
                  private int dfs(String s, String t, int i, int j) { // @step:entry
                      if (j == t.length()) return 1; // @step:boundary_target // 目标串匹配完成
                      if (i == s.length()) return 0; // @step:boundary_source // 源串耗尽无法匹配
                      if (s.charAt(i) == t.charAt(j)) { // @step:match
                          int useMatch = dfs(s, t, i + 1, j + 1); // @step:branch_match // 顺推匹配分支
                          int skipChar = dfs(s, t, i + 1, j);     // @step:branch_skip // 顺推跳过分支
                          return useMatch + skipChar; // @step:combine // 汇总方案数
                      } else {
                          return dfs(s, t, i + 1, j); // @step:skip // 只能跳过
                      }
                  }
              }
          reverse:
            title: "DistinctSubsequences_Recursive_Reverse.java"
            source: |
              class Solution {
                  public int numDistinct(String s, String t) {
                      return dfs(s, t, s.length(), t.length());
                  }
                  private int dfs(String s, String t, int i, int j) { // @step:entry
                      if (j == 0) return 1; // @step:boundary_target // 逆推目标串前缀寻源完成
                      if (i == 0) return 0; // @step:boundary_source // 源串耗尽无法匹配
                      if (s.charAt(i - 1) == t.charAt(j - 1)) { // @step:match
                          int useMatch = dfs(s, t, i - 1, j - 1); // @step:branch_match // 逆向寻源匹配分支
                          int skipChar = dfs(s, t, i - 1, j);     // @step:branch_skip // 逆向寻源跳过分支
                          return useMatch + skipChar; // @step:combine // 汇总方案数
                      } else {
                          return dfs(s, t, i - 1, j); // @step:skip // 只能跳过
                      }
                  }
              }

  stage-2:
    shortName: "记忆化"
    type: "memo"
    timeBadge: "O(m×n)"
    badgeBg: "bg-amber-100 text-amber-700"
    name:
      forward: "阶段 2: 记忆化搜索 (顺推 Memo 剪枝)"
      reverse: "阶段 2: 记忆化搜索 (逆推 Memo 剪枝)"
    desc:
      forward: "引入二维数组 memo[i][j] 缓存 (i, j) 顺推探索状态，再次遇到时实现 O(1) 剪枝返回。"
      reverse: "引入二维数组 memo[i][j] 缓存 (i, j) 逆推寻源状态，再次遇到时实现 O(1) 剪枝返回。"
    variants:
      matrix_memo:
        variantLabel: "二维备忘录"
        title:
          forward: "DistinctSubsequences_Memo_Forward.java"
          reverse: "DistinctSubsequences_Memo_Reverse.java"
        code:
          forward:
            title: "DistinctSubsequences_Memo_Forward.java"
            source: |
              class Solution {
                  public int numDistinct(String s, String t) {
                      int m = s.length(), n = t.length();
                      Integer[][] memo = new Integer[m + 1][n + 1];
                      return dfs(s, t, 0, 0, memo);
                  }
                  private int dfs(String s, String t, int i, int j, Integer[][] memo) { // @step:entry
                      if (j == t.length()) return 1; // @step:boundary_target
                      if (i == s.length()) return 0; // @step:boundary_source
                      if (memo[i][j] != null) return memo[i][j]; // @step:cache_hit // 备忘录命中剪枝
                      int res = 0;
                      if (s.charAt(i) == t.charAt(j)) { // @step:match
                          int useMatch = dfs(s, t, i + 1, j + 1, memo); // @step:branch_match // 顺推匹配分支
                          int skipChar = dfs(s, t, i + 1, j, memo);     // @step:branch_skip // 顺推跳过分支
                          res = useMatch + skipChar; // @step:combine // 汇总方案数
                      } else {
                          res = dfs(s, t, i + 1, j, memo); // @step:skip // 只能跳过
                      }
                      return memo[i][j] = res; // @step:return
                  }
              }
          reverse:
            title: "DistinctSubsequences_Memo_Reverse.java"
            source: |
              class Solution {
                  public int numDistinct(String s, String t) {
                      int m = s.length(), n = t.length();
                      Integer[][] memo = new Integer[m + 1][n + 1];
                      return dfs(s, t, m, n, memo);
                  }
                  private int dfs(String s, String t, int i, int j, Integer[][] memo) { // @step:entry
                      if (j == 0) return 1; // @step:boundary_target
                      if (i == 0) return 0; // @step:boundary_source
                      if (memo[i][j] != null) return memo[i][j]; // @step:cache_hit // 备忘录命中剪枝
                      int res = 0;
                      if (s.charAt(i - 1) == t.charAt(j - 1)) { // @step:match
                          int useMatch = dfs(s, t, i - 1, j - 1, memo); // @step:branch_match // 逆向寻源匹配分支
                          int skipChar = dfs(s, t, i - 1, j, memo);     // @step:branch_skip // 逆向寻源跳过分支
                          res = useMatch + skipChar; // @step:combine // 汇总方案数
                      } else {
                          res = dfs(s, t, i - 1, j, memo); // @step:skip // 只能跳过
                      }
                      return memo[i][j] = res; // @step:return
                  }
              }

  stage-3:
    shortName: "二维DP"
    type: "tabulation"
    timeBadge: "O(m×n)"
    badgeBg: "bg-blue-100 text-blue-700"
    name:
      forward: "阶段 3: 递推填表 (正序前缀 DP)"
      reverse: "阶段 3: 递推填表 (倒序后缀 DP)"
    desc:
      forward: "自底向上构建 (m+1) × (n+1) 的二维 DP 矩阵。首列初始化为 1，逐行按字符匹配情况由左上顺推至右下。"
      reverse: "自底向上构建 (m+1) × (n+1) 的二维 DP 矩阵。尾列初始化为 1，按字符匹配情况由右下逆推至左上。"
    variants:
      if:
        variantLabel: "内嵌 if 分支"
        title:
          forward: "DistinctSubsequences_2D_If.java"
          reverse: "DistinctSubsequences_2D_Suffix_If.java"
        code:
          forward:
            title: "DistinctSubsequences_2D_If.java"
            source: |
              class Solution {
                  public int numDistinct(String s, String t) {
                      int m = s.length(), n = t.length();
                      int[][] dp = new int[m + 1][n + 1]; // @step:init // 创建 (m+1)×(n+1) 矩阵
                      for (int i = 0; i <= m; i++) {       // @step:loop_i // 双重循环遍历全矩阵
                          for (int j = 0; j <= n; j++) {   // @step:loop_j
                              if (j == 0) {                // @step:cond_base // 空目标串 Base Case
                                  dp[i][j] = 1;            // @step:init_val // 任意母串前缀可匹配空目标串1次
                              } else if (i == 0) {         // @step:cond_empty // 空母串 Base Case
                                  dp[i][j] = 0;            // @step:init_zero // 空母串无法匹配非空目标串
                              } else if (s.charAt(i - 1) == t.charAt(j - 1)) { // @step:cond // 字符匹配成功
                                  dp[i][j] = dp[i - 1][j - 1] + dp[i - 1][j]; // @step:transfer_match
                              } else {
                                  dp[i][j] = dp[i - 1][j]; // @step:transfer_skip // 字符不匹配跳过
                              }
                          }
                      }
                      return dp[m][n]; // @step:return // 最终方案数在右下角
                  }
              }
          reverse:
            title: "DistinctSubsequences_2D_Suffix_If.java"
            source: |
              class Solution {
                  public int numDistinct(String s, String t) {
                      int m = s.length(), n = t.length();
                      int[][] dp = new int[m + 1][n + 1]; // @step:init // 创建 (m+1)×(n+1) 矩阵
                      for (int i = m; i >= 0; i--) {       // @step:loop_i // 倒序双重循环
                          for (int j = n; j >= 0; j--) {   // @step:loop_j
                              if (j == n) {                // @step:cond_base // 空后缀 Base Case
                                  dp[i][j] = 1;            // @step:init_val // 空后缀匹配方案数为1
                              } else if (i == m) {         // @step:cond_empty // 空母串后缀 Base Case
                                  dp[i][j] = 0;            // @step:init_zero // 方案数为0
                              } else if (s.charAt(i) == t.charAt(j)) { // @step:cond // 字符匹配成功
                                  dp[i][j] = dp[i + 1][j + 1] + dp[i + 1][j]; // @step:transfer_match
                              } else {
                                  dp[i][j] = dp[i + 1][j]; // @step:transfer_skip // 字符不匹配跳过
                              }
                          }
                      }
                      return dp[0][0]; // @step:return // 最终方案数在左上角
                  }
              }
      for:
        variantLabel: "外层 for 循环"
        title:
          forward: "DistinctSubsequences_2D.java"
          reverse: "DistinctSubsequences_2D_Suffix.java"
        code:
          forward:
            title: "DistinctSubsequences_2D.java"
            source: |
              class Solution {
                  public int numDistinct(String s, String t) {
                      int m = s.length(), n = t.length();
                      int[][] dp = new int[m + 1][n + 1]; // @step:init // 创建 (m+1)×(n+1) 矩阵
                      for (int i = 0; i <= m; i++) {       // @step:init_loop // 循环遍历源串前缀
                          dp[i][0] = 1;                   // @step:init_val // 初始化首列：目标串为空方案数为1
                      }
                      for (int i = 1; i <= m; i++) {      // @step:loop_i
                          for (int j = 1; j <= n; j++) {  // @step:loop_j
                              if (s.charAt(i - 1) == t.charAt(j - 1)) { // @step:cond
                                  dp[i][j] = dp[i - 1][j - 1] + dp[i - 1][j]; // @step:transfer_match
                              } else {
                                  dp[i][j] = dp[i - 1][j]; // @step:transfer_skip
                              }
                          }
                      }
                      return dp[m][n]; // @step:return // 最终方案数在右下角
                  }
              }
          reverse:
            title: "DistinctSubsequences_2D_Suffix.java"
            source: |
              class Solution {
                  public int numDistinct(String s, String t) {
                      int m = s.length(), n = t.length();
                      int[][] dp = new int[m + 1][n + 1]; // @step:init // 创建 (m+1)×(n+1) 矩阵
                      for (int i = 0; i <= m; i++) {       // @step:init_loop // 循环遍历源串后缀
                          dp[i][n] = 1;                   // @step:init_val // 初始化尾列：目标串为空后缀方案数为1
                      }
                      for (int i = m - 1; i >= 0; i--) {  // @step:loop_i // 倒序遍历源串
                          for (int j = n - 1; j >= 0; j--) { // @step:loop_j // 倒序遍历目标串
                              if (s.charAt(i) == t.charAt(j)) { // @step:cond
                                  dp[i][j] = dp[i + 1][j + 1] + dp[i + 1][j]; // @step:transfer_match
                              } else {
                                  dp[i][j] = dp[i + 1][j]; // @step:transfer_skip
                              }
                          }
                      }
                      return dp[0][0]; // @step:return // 最终方案数在左上角
                  }
              }

  stage-4:
    shortName: "空间压缩"
    type: "optimized"
    timeBadge: "O(n) 空间"
    badgeBg: "bg-emerald-100 text-emerald-700"
    name:
      forward: "阶段 4: 空间压缩 (一维倒序滚动)"
      reverse: "阶段 4: 空间压缩 (一维暂存滚动)"
    desc:
      forward: "压缩至一维数组 dp[0..n]，内层循环从 n 倒序递减至 1 遍历，确保读取的 dp[j-1] 为上一轮旧值。"
      reverse: "压缩至一维数组 dp[0..n]，内层循环使用变量 pre 暂存右下角旧值，从右向左原地滚动更新。"
    variants:
      reverse_1d:
        variantLabel: "标准全量倒序"
        title:
          forward: "DistinctSubsequences_1D.java"
          reverse: "DistinctSubsequences_1D_Suffix.java"
        code:
          forward:
            title: "DistinctSubsequences_1D.java"
            source: |
              class Solution {
                  public int numDistinct(String s, String t) {
                      int m = s.length(), n = t.length();
                      int[] dp = new int[n + 1]; // @step:init // 创建长度为 n+1 的滚动数组
                      dp[0] = 1;                 // @step:init_val // 空串 Base Case
                      for (int i = 1; i <= m; i++) { // @step:loop_i
                          for (int j = n; j >= 1; j--) { // @step:loop_j_reverse // 必须倒序遍历
                              if (s.charAt(i - 1) == t.charAt(j - 1)) { // @step:cond
                                  dp[j] += dp[j - 1]; // @step:accumulate_reverse // 原地累加
                              }
                          }
                      }
                      return dp[n]; // @step:return // 最终答案在 dp[n]
                  }
              }
          reverse:
            title: "DistinctSubsequences_1D_Suffix.java"
            source: |
              class Solution {
                  public int numDistinct(String s, String t) {
                      int m = s.length(), n = t.length();
                      int[] dp = new int[n + 1]; // @step:init // 创建长度为 n+1 的滚动数组
                      dp[n] = 1;                 // @step:init_val // 空后缀 Base Case
                      for (int i = m - 1; i >= 0; i--) { // @step:loop_i // 倒序遍历源串
                          int pre = dp[n];       // @step:cache_pre // 暂存右下角旧值
                          for (int j = n - 1; j >= 0; j--) { // @step:loop_j
                              int temp = dp[j];
                              if (s.charAt(i) == t.charAt(j)) { // @step:cond
                                  dp[j] += pre;  // @step:accumulate_forward // 原地累加右下角旧值
                              }
                              pre = temp;
                          }
                      }
                      return dp[0]; // @step:return // 最终答案在 dp[0]
                  }
              }
      leftup_1d:
        variantLabel: "leftUp暂存版 (左→右)"
        title:
          forward: "DistinctSubsequences_1D_LeftUp.java"
          reverse: "DistinctSubsequences_1D_Suffix_LeftUp.java"
        code:
          forward:
            title: "DistinctSubsequences_1D_LeftUp.java"
            source: |
              class Solution {
                  public int numDistinct(String s, String t) {
                      int m = s.length(), n = t.length();
                      int[] dp = new int[n + 1]; // @step:init // 创建长度为 n+1 的滚动数组
                      dp[0] = 1;                 // @step:init_val // 空串 Base Case
                      for (int i = 1; i <= m; i++) { // @step:loop_i // 遍历源串
                          int leftUp = dp[0];        // @step:cache_leftup // 暂存左上角旧值
                          for (int j = 1; j <= n; j++) { // @step:loop_j // 🚀 从左向右正序遍历
                              int temp = dp[j];      // @step:cache_temp // 记录当前列旧值
                              if (s.charAt(i - 1) == t.charAt(j - 1)) { // @step:cond
                                  dp[j] += leftUp;   // @step:accumulate_leftup // 累加暂存的左上角
                              }
                              leftUp = temp;         // @step:update_leftup // 滚动更新 leftUp
                          }
                      }
                      return dp[n]; // @step:return // 最终答案在 dp[n]
                  }
              }
          reverse:
            title: "DistinctSubsequences_1D_Suffix_LeftUp.java"
            source: |
