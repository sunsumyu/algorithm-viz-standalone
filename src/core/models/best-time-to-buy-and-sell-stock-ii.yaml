# ==============================================================================
# 🏆 [GOLDEN BASELINE MODEL] 黄金基准模型规范
# 本规范为「买卖股票的最佳时机 II (Best Time to Buy and Sell Stock II, LeetCode 122)」四阶段全演化标准实现。
# 包含：多次交易决策树递归、记忆化剪枝、双状态机复利二维填表与 O(1) 滚动双变量空间压缩。
# ==============================================================================

id: best-time-to-buy-and-sell-stock-ii
name: "买卖股票的最佳时机 II"
nameEn: "Best Time to Buy and Sell Stock II"
defaultStage: "stage-1"
category: "dynamic-programming"
icon: "💹"
difficulty: 2
levelOrder: 14
learningGoal: "掌握多次交易状态机模型：卖出后允许再次买入，买入依赖上一轮不持股收益进行复利累加"
description: "买卖股票的最佳时机 II（LeetCode 122）：你可以尽可能地多次买卖股票。在任何时候最多只能持有一股。计算你可以获得的最大利润。"
defaultParams:
  prices: [7, 1, 5, 3, 6, 4]

problem:
  leetcodeId: 122
  title: "买卖股票的最佳时机 II"
  difficulty: "中等"
  tags: ["贪心", "数组", "动态规划"]
  description: "给你一个整数数组 <code>prices</code> ，其中 <code>prices[i]</code> 表示某支股票第 <code>i</code> 天的价格。<br/><br/>在每一天，你可以决定是否购买和/或出售股票。你在任何时候 <strong>最多</strong> 只能持有 <strong>一股</strong> 股票。你也可以先购买，然后在 <strong>同一天</strong> 出售。<br/><br/>返回你能获得的 <strong>最大</strong> 利润。"
  examples:
    - input: "prices = [7,1,5,3,6,4]"
      output: "7"
      explanation: "在第 2 天（股票价格 = 1）的时候买入，在第 3 天（股票价格 = 5）的时候卖出, 这笔交易所能获得利润 = 5 - 1 = 4 。随后，在第 4 天（股票价格 = 3）的时候买入，在第 5 天（股票价格 = 6）的时候卖出, 这笔交易所能获得利润 = 6 - 3 = 3 。总利润为 4 + 3 = 7 。"
    - input: "prices = [1,2,3,4,5]"
      output: "4"
      explanation: "在第 1 天（股票价格 = 1）的时候买入，在第 5 天 （股票价格 = 5）的时候卖出, 这笔交易所能获得利润 = 5 - 1 = 4 。总利润为 4 。"
  constraints:
    - "1 <= prices.length <= 3 * 10⁴"
    - "0 <= prices[i] <= 10⁴"
  leetcodeUrl: "https://leetcode.cn/problems/best-time-to-buy-and-sell-stock-ii/"

directions:
  forward:
    label: "自顶向下 (按天数顺序推进)"
    branches:
      - name: "keep_or_buy"
        delta: [1, 0]
        label: "保持或买入 (复利)"
        codeVar: "hold"
        arrow: "⬇️"
      - name: "keep_or_sell"
        delta: [1, 1]
        label: "保持或卖出 (累加)"
        codeVar: "notHold"
        arrow: "↘️"
    combineFormula: "max(hold, notHold)"

  reverse:
    label: "逆推 (倒序)"
    description: "从末尾目标向子问题基底反推"
    startFormula: "末尾状态"
    target: "起始状态"
    branches: []
    combineFormula: "逆向聚合"
stages:
  stage-1:
    shortName: "递归"
    type: "recursion"
    timeBadge: "O(2ⁿ)"
    badgeBg: "bg-slate-100 text-slate-700"
    name:
      forward: "阶段 1: 多次买卖决策树"
    desc:
      forward: "未持股时可选择观望或买入；持股时可选择观望或卖出，卖出后未来可继续买入。"
    variants:
      standard:
        variantLabel: "标准递归版"
        title:
          forward: "Stock2_Recursive.java"
        code:
          forward:
            title: "Stock2_Recursive.java"
            source: |
              class Solution {
                  public int maxProfit(int[] prices) { // @step:entry
                      return dfs(prices, 0, 0); // @step:init // @step:return
                  }
                  private int dfs(int[] prices, int day, int status) { // @step:recursion
                      if (day == prices.length) return 0; // @step:boundary
                      if (status == 0) {
                          int keep = dfs(prices, day + 1, 0); // @step:branch_keep
                          int buy = -prices[day] + dfs(prices, day + 1, 1); // @step:branch_buy
                          return Math.max(keep, buy); // @step:combine
                      } else {
                          int keep = dfs(prices, day + 1, 1); // @step:branch_keep
                          int sell = prices[day] + dfs(prices, day + 1, 0); // @step:branch_sell
                          return Math.max(keep, sell); // @step:combine
                      }
                  }
              }

  stage-2:
    shortName: "记忆化"
    type: "memoization"
    timeBadge: "O(n)"
    badgeBg: "bg-purple-100 text-purple-700"
    name:
      forward: "阶段 2: 二维记忆化搜索"
    desc:
      forward: "引入 memo[day][status] 记录各状态最大利润，消除跨天重复递归。"
    variants:
      array_memo:
        variantLabel: "数组备忘录版"
        title:
          forward: "Stock2_Memo.java"
        code:
          forward:
            title: "Stock2_Memo.java"
            source: |
              class Solution {
                  public int maxProfit(int[] prices) { // @step:entry
                      int[][] memo = new int[prices.length][2]; // @step:init
                      for (int[] r : memo) Arrays.fill(r, -1);
                      return dfs(prices, 0, 0, memo); // @step:return
                  }
                  private int dfs(int[] p, int d, int s, int[][] memo) { // @step:recursion
                      if (d == p.length) return 0; // @step:boundary
                      if (memo[d][s] != -1) return memo[d][s]; // @step:memo // @step:cache_hit
                      if (s == 0) {
                          memo[d][s] = Math.max(dfs(p, d + 1, 0, memo), -p[d] + dfs(p, d + 1, 1, memo)); // @step:transfer
                      } else {
                          memo[d][s] = Math.max(dfs(p, d + 1, 1, memo), p[d] + dfs(p, d + 1, 0, memo)); // @step:transfer
                      }
                      return memo[d][s]; // @step:combine
                  }
              }

  stage-3:
    shortName: "二维DP"
    type: "tabulation-2d"
    timeBadge: "O(n)"
    badgeBg: "bg-blue-100 text-blue-700"
    name:
      forward: "阶段 3: 多次交易状态机二维填表"
    desc:
      forward: "dp[i][0] 表示第 i 天持有股票的最大收益（买入时扣减上一天不持股收益）；dp[i][1] 表示第 i 天不持股的最大收益。"
    variants:
      standard:
        variantLabel: "标准填表版"
        title:
          forward: "Stock2_Table2D.java"
        code:
          forward:
            title: "Stock2_Table2D.java"
            source: |
              class Solution {
                  public int maxProfit(int[] prices) { // @step:entry
                      int n = prices.length;
                      int[][] dp = new int[n][2]; // @step:init
                      dp[0][0] = -prices[0]; // @step:init_hold
                      dp[0][1] = 0;          // @step:init_nothold
                      for (int i = 1; i < n; i++) { // @step:loop
                          dp[i][0] = Math.max(dp[i - 1][0], dp[i - 1][1] - prices[i]); // @step:transfer_hold
                          dp[i][1] = Math.max(dp[i - 1][1], dp[i - 1][0] + prices[i]); // @step:transfer_nothold
                      }
                      return dp[n - 1][1]; // @step:return
                  }
              }

  stage-4:
    shortName: "空间压缩"
    type: "space-optimization"
    timeBadge: "O(1) 空间"
    badgeBg: "bg-emerald-100 text-emerald-700"
    name:
      forward: "阶段 4: O(1) 滚动双变量"
    desc:
      forward: "每天仅依赖前一天的 hold 与 notHold，交替滚动更新，空间降至 O(1)。"
    variants:
      standard:
        variantLabel: "滚动变量版"
        title:
          forward: "Stock2_Optimized.java"
        code:
          forward:
            title: "Stock2_Optimized.java"
            source: |
              class Solution {
                  public int maxProfit(int[] prices) { // @step:entry
                      int hold = -prices[0]; // @step:init_hold // @step:init
                      int notHold = 0;       // @step:init_nothold
                      for (int i = 1; i < prices.length; i++) { // @step:loop
                          int newHold = Math.max(hold, notHold - prices[i]); // @step:transfer_hold // @step:transfer
                          int newNotHold = Math.max(notHold, hold + prices[i]); // @step:transfer_nothold
                          hold = newHold;
                          notHold = newNotHold;
                      }
                      return notHold; // @step:return
                  }
              }
