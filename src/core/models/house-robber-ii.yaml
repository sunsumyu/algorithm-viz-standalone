# ==============================================================================
# 🏆 [GOLDEN BASELINE MODEL] 黄金基准模型规范
# 本规范为「打家劫舍 II (House Robber II, LeetCode 213)」四阶段全演化标准实现。
# 包含：首尾成环约束、拆分为两个单链子问题 [0, n-2] 与 [1, n-1] 求解选优。
# ==============================================================================

id: house-robber-ii
name: "打家劫舍 II"
nameEn: "House Robber II"
defaultStage: "stage-1"
category: "dynamic-programming"
icon: "🔄"
difficulty: 2
levelOrder: 12
learningGoal: "理解环形边界约束的破环成链技巧：分类讨论首尾不可同时选的对称子问题"
description: "打家劫舍 II（LeetCode 213）：房屋围成一圈。拆解为 [0..n-2] 和 [1..n-1] 两个单链打家劫舍问题分别求解并取最大值。"
defaultParams:
  nums: [1, 2, 3, 1]

problem:
  leetcodeId: 213
  title: "打家劫舍 II"
  difficulty: "中等"
  tags: ["数组", "动态规划"]
  description: "你是一个专业的小偷，计划偷窃沿街的房屋，每间房内都藏有一定的现金。这个地方所有的房屋都 <strong>围成一圈</strong> ，这意味着第一间房屋和最后一间房屋是紧挨着的。<br/><br/>同时，相邻的房屋装有相互连通的防盗系统，<strong>如果两间相邻的房屋在同一晚上被小偷闯入，系统会自动报警</strong>。<br/><br/>给定一个代表每个房屋存放金额的非负整数数组，计算你 <strong>在不触动警报装置的情况下</strong> ，今晚能够偷窃到的最高金额。"
  examples:
    - input: "nums = [2,3,2]"
      output: "3"
      explanation: "你不能先偷窃 1 号房屋（金额 = 2），然后偷窃 3 号房屋（金额 = 2）, 因为他们是相邻的。"
    - input: "nums = [1,2,3,1]"
      output: "4"
      explanation: "你可以先偷窃 1 号房屋（金额 = 1），然后偷窃 3 号房屋（金额 = 3）。偷窃到的最高金额 = 1 + 3 = 4 。"
  constraints:
    - "1 <= nums.length <= 100"
    - "0 <= nums[i] <= 1000"
  leetcodeUrl: "https://leetcode.cn/problems/house-robber-ii/"

directions:
  forward:
    label: "破环成链 (双区间选优)"
    branches:
      - name: "range1"
        delta: [0, 0]
        label: "区间 [0, n-2] (不偷最后一间)"
        codeVar: "ans1"
        arrow: "⬅️"
      - name: "range2"
        delta: [0, 0]
        label: "区间 [1, n-1] (不偷第一间)"
        codeVar: "ans2"
        arrow: "➡️"
    combineFormula: "max(ans1, ans2)"

stages:
  stage-1:
    shortName: "递归"
    type: "recursion"
    timeBadge: "O(2ⁿ)"
    badgeBg: "bg-slate-100 text-slate-700"
    name:
      forward: "阶段 1: 环形拆分递归"
    desc:
      forward: "由于首尾相连，第一间房和最后一间房不可兼得。将其拆解为两个子问题：不偷最后一间 [0, n-2] 与不偷第一间 [1, n-1]，各自展开递归决策。"
    variants:
      standard:
        variantLabel: "标准递归版"
        title:
          forward: "HouseRobber2_Recursive.java"
        code:
          forward:
            title: "HouseRobber2_Recursive.java"
            source: |
              class Solution {
                  public int rob(int[] nums) {
                      int n = nums.length;
                      if (n == 1) return nums[0]; // @step:boundary
                      int p1 = robRange(nums, 0, n - 2); // @step:branch_left
                      int p2 = robRange(nums, 1, n - 1); // @step:branch_right
                      return Math.max(p1, p2); // @step:combine // @step:return
                  }
                  private int robRange(int[] nums, int l, int r) {
                      return dfs(nums, l, r); // @step:recursion
                  }
                  private int dfs(int[] nums, int i, int r) {
                      if (i > r) return 0;
                      return Math.max(dfs(nums, i + 1, r), nums[i] + dfs(nums, i + 2, r));
                  }
              }

  stage-2:
    shortName: "记忆化"
    type: "memoization"
    timeBadge: "O(n)"
    badgeBg: "bg-purple-100 text-purple-700"
    name:
      forward: "阶段 2: 记忆化双区间搜索"
    desc:
      forward: "在两个开区间内分别建立 memo 数组缓存中间收益，消除各区间的重复计算。"
    variants:
      array_memo:
        variantLabel: "备忘录版"
        title:
          forward: "HouseRobber2_Memo.java"
        code:
          forward:
            title: "HouseRobber2_Memo.java"
            source: |
              class Solution {
                  public int rob(int[] nums) {
                      int n = nums.length;
                      if (n == 1) return nums[0]; // @step:boundary
                      int p1 = robRange(nums, 0, n - 2); // @step:branch_left
                      int p2 = robRange(nums, 1, n - 1); // @step:branch_right
                      return Math.max(p1, p2); // @step:combine // @step:return
                  }
                  private int robRange(int[] nums, int l, int r) {
                      int[] memo = new int[nums.length];
                      Arrays.fill(memo, -1);
                      return dfs(nums, l, r, memo); // @step:recursion
                  }
                  private int dfs(int[] nums, int i, int r, int[] memo) {
                      if (i > r) return 0;
                      if (memo[i] != -1) return memo[i]; // @step:memo // @step:cache_hit
                      return memo[i] = Math.max(dfs(nums, i + 1, r, memo), nums[i] + dfs(nums, i + 2, r, memo));
                  }
              }

  stage-3:
    shortName: "递推DP"
    type: "tabulation-2d"
    timeBadge: "O(n)"
    badgeBg: "bg-emerald-100 text-emerald-700"
    name:
      forward: "阶段 3: 双区间自底向上递推填表"
    desc:
      forward: "分别在 [0, n-2] 与 [1, n-1] 两个区间内执行标准的单链 DP 填表，最终汇总二者较大值。"
    variants:
      standard:
        variantLabel: "数组填表版"
        title:
          forward: "HouseRobber2_DP.java"
        code:
          forward:
            title: "HouseRobber2_DP.java"
            source: |
              class Solution {
                  public int rob(int[] nums) {
                      int n = nums.length;
                      if (n == 1) return nums[0]; // @step:boundary
                      int ans1 = robRange(nums, 0, n - 2); // @step:init
                      int ans2 = robRange(nums, 1, n - 1); // @step:transfer
                      return Math.max(ans1, ans2); // @step:return
                  }
                  private int robRange(int[] nums, int l, int r) {
                      int len = r - l + 1;
                      if (len == 1) return nums[l];
                      int[] dp = new int[len];
                      dp[0] = nums[l];
                      dp[1] = Math.max(nums[l], nums[l + 1]);
                      for (int i = 2; i < len; i++) {
                          dp[i] = Math.max(dp[i - 1], dp[i - 2] + nums[l + i]);
                      }
                      return dp[len - 1];
                  }
              }

  stage-4:
    shortName: "空间优化"
    type: "space-optimized"
    timeBadge: "O(1) 空间"
    badgeBg: "bg-amber-100 text-amber-700"
    name:
      forward: "阶段 4: 空间压缩 (双区间 O(1) 滚动)"
    desc:
      forward: "利用 O(1) 双变量滚动分别计算两个区间的最大金额并取较大者。"
    variants:
      standard:
        variantLabel: "滚动变量版"
        title:
          forward: "HouseRobber2_Rolling.java"
        code:
          forward:
            title: "HouseRobber2_Rolling.java"
            source: |
              class Solution {
                  public int rob(int[] nums) {
                      int n = nums.length;
                      if (n == 1) return nums[0]; // @step:boundary
                      return Math.max(robRange(nums, 0, n - 2), robRange(nums, 1, n - 1)); // @step:return
                  }
                  private int robRange(int[] nums, int l, int r) {
                      int prev2 = 0, prev1 = 0; // @step:init
                      for (int i = l; i <= r; i++) { // @step:loop
                          int cur = Math.max(prev1, prev2 + nums[i]); // @step:transfer
                          prev2 = prev1;
                          prev1 = cur;
                      }
                      return prev1;
                  }
              }
