    name: 极值违规判定树与局部单调破坏
    card2Title: "单调性破坏与极值决策树 (Monotonicity Violation Tree)"
    card2Desc: "自顶向下展示各位置元素与历史极值对比以及边界更新过程。"
    description: 自顶向下构建极值决策树，展示每个元素与历史极值比较时的违规逆序判定与边界更新
    complexity:
      time: O(N)
      space: O(N)
    code:
      forward:
        language: java
        source: |
          // 决策树分支：比较 nums[i] 与 max
          for (int i = 0; i < n; i++) {
              if (nums[i] < max) {
                  // 违规逆序：更新右边界
                  right = i;
              } else {
                  // 单调递增：更新最大值
                  max = nums[i];
              }
          }
        anchors:
