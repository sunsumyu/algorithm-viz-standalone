  stage-4:
    shortName: "区间锁定收敛"
    name: 双指针向心挤压极速收敛
    card2Title: "一维子数组高亮锁定 (Unsorted Range Lock)"
    card2Desc: "空间压缩为常数级别，最终输出无序子数组长度。"
    description: 常数空间完成无序区间的高亮锁定，直接输出 [L, R] 长度
    complexity:
      time: O(N)
      space: O(1)
    code:
      forward:
        language: java
        source: |
          // 最终边界结算
          int ans = right == -1 ? 0 : (right - left + 1);
          return ans;
        anchors:
