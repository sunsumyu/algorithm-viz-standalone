          for (int i = n - 1; i >= 0; i--) {
              if (nums[i] > min) {
                  left = i;
              } else {
                  min = nums[i];
              }
          }
        anchors:
          loop: 1
          violate: 2
          update: 5
          done: 7

  stage-3:
    shortName: "边界指针矩阵"
    name: 边界指针收敛演进矩阵
    card2Title: "无序区间扫描状态矩阵 (State Space Matrix)"
    card2Desc: "二维矩阵精确跟踪每一步扫描中的索引、元素值、极值与边界变迁。"
    description: 二维矩阵动态追踪扫描中的索引、当前元素、极值与左/右边界的演变过程
    complexity:
      time: O(N)
      space: O(N)
    code:
      forward:
        language: java
        source: |
          int[][] matrix = new int[n][4]; // [i, val, extreme, boundary]
          for (int i = 0; i < n; i++) {
              boolean violated = nums[i] < max;
              if (violated) right = i;
              else max = nums[i];
          }
        anchors:
