        code:
          forward:
            title: "Main.java"
            source: |

              public class Main {
                  public static int MAXN = 1005;
                  public static int MAXM = 1005;
                  // arr[i][0] 体积, arr[i][1] 价值, arr[i][2] 组号
                  public static int[][] arr = new int[MAXN][3];
                  public static int m, n;

                  public static void main(String[] args) throws IOException {
                      BufferedReader br = new BufferedReader(new InputStreamReader(System.in));
                      StreamTokenizer in = new StreamTokenizer(br);
                      PrintWriter out = new PrintWriter(new OutputStreamWriter(System.out));
                      while (in.nextToken() != StreamTokenizer.TT_EOF) {
                          m = (int) in.nval;
                          in.nextToken();
                          n = (int) in.nval;
                          for (int i = 1; i <= n; i++) {
                              in.nextToken();
                              arr[i][0] = (int) in.nval;
                              in.nextToken();
                              arr[i][1] = (int) in.nval;
                              in.nextToken();
                              arr[i][2] = (int) in.nval;
                          }
                          Arrays.sort(arr, 1, n + 1, (a, b) -> a[2] - b[2]); // @step:sort_items
                          out.println(compute1());
                      }
                      out.flush();
                      out.close();
                      br.close();
                  }

                  // 阶段 3: 严格位置依赖的二维动态规划 (仅在此阶段展示 compute1)
                  public static int compute1() {
                      int teams = 1; // @step:count_teams
                      for (int i = 2; i <= n; i++) {
                          if (arr[i - 1][2] != arr[i][2]) {
                              teams++;
                          }
                      }
                      int[][] dp = new int[teams + 1][m + 1]; // @step:init_dp
                      for (int start = 1, end = 2, i = 1; start <= n; i++) { // @step:outer_group
                          while (end <= n && arr[end][2] == arr[start][2]) { // @step:group_end
                              end++;
                          }
                          for (int j = 0; j <= m; j++) { // @step:inner_cap
                              dp[i][j] = dp[i - 1][j]; // @step:branch_not_take
                              for (int k = start; k < end; k++) { // @step:loop_items
                                  if (j - arr[k][0] >= 0) { // @step:check_fit
                                      dp[i][j] = Math.max(dp[i][j], dp[i - 1][j - arr[k][0]] + arr[k][1]); // @step:transition
                                  }
                              }
                          }
                          start = end++; // @step:advance_group
                      }
                      return dp[teams][m]; // @step:return_ans
                  }
              }
          reverse:
            title: "Main_Reverse.java"
            source: |
              // 洛谷 P1757 通天之分组背包 - 阶段 3 逆向依赖版
              import java.io.*;
              import java.util.*;

              public class Main {
                  public static int MAXN = 1005;
                  public static int MAXM = 1005;
                  public static int[][] arr = new int[MAXN][3];
                  public static int m, n;

                  public static void main(String[] args) throws IOException {
                      BufferedReader br = new BufferedReader(new InputStreamReader(System.in));
                      StreamTokenizer in = new StreamTokenizer(br);
                      PrintWriter out = new PrintWriter(new OutputStreamWriter(System.out));
                      while (in.nextToken() != StreamTokenizer.TT_EOF) {
                          m = (int) in.nval;
                          in.nextToken();
                          n = (int) in.nval;
                          for (int i = 1; i <= n; i++) {
                              in.nextToken(); arr[i][0] = (int) in.nval;
                              in.nextToken(); arr[i][1] = (int) in.nval;
                              in.nextToken(); arr[i][2] = (int) in.nval;
                          }
                          Arrays.sort(arr, 1, n + 1, (a, b) -> a[2] - b[2]); // @step:sort_items
                          out.println(compute1Reverse());
                      }
                      out.flush();
                      out.close();
                      br.close();
                  }

                  public static int compute1Reverse() {
                      int teams = 1; // @step:count_teams
                      for (int i = 2; i <= n; i++) {
                          if (arr[i - 1][2] != arr[i][2]) teams++;
                      }
                      int[][] dp = new int[teams + 1][m + 1]; // @step:init_dp
                      for (int start = 1, end = 2, i = teams; start <= n; i--) { // @step:outer_group
                          while (end <= n && arr[end][2] == arr[start][2]) end++; // @step:group_end
                          for (int j = m; j >= 0; j--) { // @step:inner_cap
                              dp[i][j] = (i == teams) ? 0 : dp[i + 1][j]; // @step:branch_not_take
                              for (int k = start; k < end; k++) { // @step:loop_items
                                  if (j >= arr[k][0]) { // @step:check_fit
                                      dp[i][j] = Math.max(dp[i][j], dp[i + 1][j - arr[k][0]] + arr[k][1]); // @step:transition
                                  }
                              }
                          }
                          start = end++; // @step:advance_group
                      }
                      return dp[1][m]; // @step:return_ans
                  }
              }

