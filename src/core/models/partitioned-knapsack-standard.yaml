    desc:
      forward: "左程云算法通关课 Class 074 Code01 核心实现 compute1()：按组号排序后双指针划定组，开辟 dp[teams + 1][m + 1]，外层组、中层容量、内层枚举组内物品，无递归栈且零 GC。"
      reverse: "自右下角终点状态向基底反推依赖关系，高亮展示组内候选与上一组的依赖来源。"
