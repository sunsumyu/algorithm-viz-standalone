  stage-3:
    shortName: "二维DP"
    type: "tabulation-2d"
    timeBadge: "O(numGroups · M · |group|)"
    badgeBg: "bg-blue-100 text-blue-700"
    name:
      forward: "阶段 3: 严格二维位置依赖动态规划 (左神原版 compute1)"
