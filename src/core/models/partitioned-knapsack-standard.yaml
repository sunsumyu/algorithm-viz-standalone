              // 洛谷 P1757 通天之分组背包
              // 阶段 4: 空间压缩一维动态规划 (左程云算法通关课 Class 074 Code01)
              // 测试链接 : https://www.luogu.com.cn/problem/P1757
              // 提交时保持类名为 Main 即可直接在洛谷 AC 满分！
              import java.io.BufferedReader;
              import java.io.IOException;
              import java.io.InputStreamReader;
              import java.io.OutputStreamWriter;
              import java.io.PrintWriter;
              import java.io.StreamTokenizer;
              import java.util.Arrays;

              public class Main {
                  public static int MAXN = 1005;
                  public static int MAXM = 1005;
                  // arr[i][0] 体积, arr[i][1] 价值, arr[i][2] 组号
                  public static int[][] arr;
                  public static int[] dp = new int[MAXM];
                  public static int m, n;

                  public static void main(String[] args) throws IOException {
                      BufferedReader br = new BufferedReader(new InputStreamReader(System.in));
                      StreamTokenizer in = new StreamTokenizer(br);
                      PrintWriter out = new PrintWriter(new OutputStreamWriter(System.out));
                      while (in.nextToken() != StreamTokenizer.TT_EOF) {
                          m = (int) in.nval;
                          in.nextToken();
                          n = (int) in.nval;
                          for (int i = 1; i <= n; i++) {
                              in.nextToken();
                              arr[i][0] = (int) in.nval;
                              in.nextToken();
                              arr[i][1] = (int) in.nval;
                              in.nextToken();
                              arr[i][2] = (int) in.nval;
                          }
                          Arrays.sort(arr, 1, n + 1, (a, b) -> a[2] - b[2]); // @step:sort_items
                          out.println(compute2());
                      }
                      out.flush();
                      out.close();
                      br.close();
                  }

                  // 阶段 4: 空间压缩一维动态规划 (仅在此阶段展示 compute2)
                  public static int compute2() {
                      Arrays.fill(dp, 0, m + 1, 0); // @step:init_dp
                      for (int start = 1, end = 2; start <= n;) { // @step:outer_group
                          while (end <= n && arr[end][2] == arr[start][2]) { // @step:group_end
                              end++;
                          }
                          for (int j = m; j >= 0; j--) { // @step:cap_loop
                              for (int k = start; k < end; k++) { // @step:item_loop
                                  if (j >= arr[k][0]) { // @step:check_fit
                                      dp[j] = Math.max(dp[j], arr[k][1] + dp[j - arr[k][0]]); // @step:transition
                                  }
                              }
                          }
                          start = end++; // @step:advance_group
                      }
                      return dp[m]; // @step:return_ans
                  }
              }
