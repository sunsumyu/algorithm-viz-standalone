id: partitioned-knapsack-standard
name: "分组背包模版 (洛谷 P1757 通天之分组背包)"
nameEn: "Partitioned Knapsack Standard"
defaultStage: "stage-3"
category: "dynamic-programming"
icon: "🗂️"
difficulty: 2
levelOrder: 84
learningGoal: "掌握分组背包组内互斥决策建模、外层容量倒序内层枚举组内物品的核心循环顺序"
description: "左程云算法通关课 Class 074 Code01：洛谷 P1757 通天之分组背包，组内物品至多选 1 件，容量倒序外层枚举防止组内多选"
defaultParams:
  m: 45
  items: [[10, 10, 1], [10, 20, 1], [20, 20, 2]]

problem:
  title: "通天之分组背包 (洛谷 P1757)"
  difficulty: "普及+/提高"
  tags: ["动态规划", "背包问题", "分组背包"]
  description: "自 01 背包问世之后，小 A 对此深感兴趣。他发现有 <code>n</code> 个物品和一个容量为 <code>m</code> 的背包。每个物品有自己的体积 <code>c_i</code>、价值 <code>v_i</code>，并且属于某一个组 <code>g_i</code>。<br/><br/><strong>限制规则：同一个组内的物品最多只能选择一件！</strong>所有选择的物品体积之和不得超过背包总容量 <code>m</code>。求怎么挑选物品才能使得总价值最大。"
  examples:
    - input: "m = 45, items = [[10, 10, 1], [10, 20, 1], [20, 20, 2]]"
      output: "40"
      explanation: "组 1 选择物品 2 (体积 10, 价值 20)；组 2 选择物品 3 (体积 20, 20)。总占用体积 30 <= 45，最大总价值为 40。"
    - input: "m = 50, items = [[15, 25, 1], [10, 15, 1], [20, 30, 2], [15, 20, 2], [10, 20, 3]]"
      output: "75"
      explanation: "组 1 选 (15, 25)，组 2 选 (20, 30)，组 3 选 (10, 20)，总容量 45 <= 50，总价值 25 + 30 + 20 = 75。"
  constraints:
    - "1 <= m, n <= 1000"
    - "g_i <= 100"
    - "c_i, v_i 为正整数且 <= 1000"
  leetcodeUrl: "https://www.luogu.com.cn/problem/P1757"

directions:
  forward:
    label: "自底向上正序填表 (外层组号，内层容量)"
    branches:
      - name: "not_take"
        label: "本组全都不选"
        formula: "dp[g - 1][j]"
      - name: "take_k"
        label: "在第 g 组中挑选一件物品 k"
        formula: "dp[g - 1][j - cost[k]] + val[k]"
    combineFormula: "max(dp[g - 1][j], max_k(dp[g - 1][j - cost[k]] + val[k]))"
  reverse:
    label: "逆推倒序寻源 (终点逆向推导)"
    description: "从目标容量向子问题基底反推"
    startFormula: "dp[numGroups][m]"
    target: "dp[0][0]"
    branches:
      - name: "trace_back"
        label: "向上一组溯源"
        formula: "dp[g - 1][j - cost[k]]"
    combineFormula: "逆向聚合"

stages:
  stage-1:
    shortName: "递归"
    type: "recursion"
    timeBadge: "O(Π |group_i|)"
    badgeBg: "bg-slate-100 text-slate-700"
    name:
      forward: "阶段 1: 暴力递归分支展开 (组内互斥决策树)"
      reverse: "阶段 1: 暴力递归逆推寻源 (状态空间倒序展开)"
    desc:
      forward: "对于第 g 个物品组，枚举本组不选，或从本组候选物品中选且仅选 1 件，递归推进至下一组 g + 1，取各互斥分支的最大值。"
      reverse: "从终点总容量与物品组倒序向前分解子问题，展示朴素递归中出现的严重重叠子问题与指数级爆炸分支。"
    variants:
      standard:
        variantLabel: "标准多分支递归"
        title:
          forward: "Main.java (递归版)"
          reverse: "Main_Reverse.java (递归逆推版)"
        code:
          forward:
            title: "Main.java"
            source: |
              // 洛谷 P1757 通天之分组背包 - 阶段 1: 暴力递归分支展开
              import java.io.*;
              import java.util.*;

              public class Main {
                  public static int m, n;
                  public static int[][] arr = new int[1005][3];

                  public static void main(String[] args) throws IOException {
                      BufferedReader br = new BufferedReader(new InputStreamReader(System.in));
                      StreamTokenizer in = new StreamTokenizer(br);
                      PrintWriter out = new PrintWriter(new OutputStreamWriter(System.out));
                      while (in.nextToken() != StreamTokenizer.TT_EOF) {
                          m = (int) in.nval;
                          in.nextToken();
                          n = (int) in.nval;
                          for (int i = 1; i <= n; i++) {
                              in.nextToken(); arr[i][0] = (int) in.nval;
                              in.nextToken(); arr[i][1] = (int) in.nval;
                              in.nextToken(); arr[i][2] = (int) in.nval;
                          }
                          Arrays.sort(arr, 1, n + 1, (a, b) -> a[2] - b[2]);
                          List<List<int[]>> groups = new ArrayList<>();
                          for (int start = 1, end = 2; start <= n;) {
                              while (end <= n && arr[end][2] == arr[start][2]) end++;
                              List<int[]> curGroup = new ArrayList<>();
                              for (int k = start; k < end; k++) {
                                  curGroup.add(new int[]{arr[k][0], arr[k][1]});
                              }
                              groups.add(curGroup);
                              start = end++;
                          }
                          out.println(compute(m, groups.size(), groups));
                      }
                      out.flush();
                      out.close();
                  }

                  public static int compute(int m, int numGroups, List<List<int[]>> groups) {
                      return dfs(0, m, numGroups, groups); // @step:entry
                  }

                  private static int dfs(int g, int remCap, int numGroups, List<List<int[]>> groups) { // @step:dfs_entry
                      if (g >= numGroups || remCap <= 0) return 0; // @step:boundary
                      int maxVal = dfs(g + 1, remCap, numGroups, groups); // @step:branch_not_take
                      for (int[] item : groups.get(g)) { // @step:loop_items
                          int cost = item[0], val = item[1];
                          if (remCap >= cost) {
                              maxVal = Math.max(maxVal, dfs(g + 1, remCap - cost, numGroups, groups) + val); // @step:branch_take
                          }
                      }
                      return maxVal; // @step:combine
                  }
              }
          reverse:
            title: "Main_Reverse.java"
            source: |
