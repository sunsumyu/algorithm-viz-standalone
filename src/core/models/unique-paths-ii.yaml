                  } else if (i == 0 && j == 0) {
                    dp[i][j] = 1; // @step:init_val // 起点初始化
                  } else {
                    int fromTop = (i > 0) ? dp[i - 1][j] : 0; // @step:calc_top // 查找上方可达路径
                    int fromLeft = (j > 0) ? dp[i][j - 1] : 0; // @step:calc_left // 查找左方可达路径
                    dp[i][j] = fromTop + fromLeft; // @step:transfer // 状态转移求和
