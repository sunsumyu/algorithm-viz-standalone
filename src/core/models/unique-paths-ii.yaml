              class Solution {
                public int uniquePathsWithObstacles(int[][] obstacleGrid) {
                  int m = obstacleGrid.length, n = obstacleGrid[0].length;
                  int[] memo = new int[n]; // @step:init
                  memo[0] = (obstacleGrid[0][0] == 0) ? 1 : 0;
                  for (int i = 0; i < m; i++) { // @step:loop_i
                    for (int j = 0; j < n; j++) { // @step:loop_j
                      if (obstacleGrid[i][j] == 1) { // @step:cond
                        memo[j] = 0; // @step:init_val // 遇到障碍物列置 0
                      } else if (j > 0) {
                        int down = memo[j];     // @step:fetch_down // 上一行旧值
                        int right = memo[j - 1]; // @step:fetch_right // 本行左列新值
                        memo[j] += right;        // @step:accumulate // 原地累加覆盖
                      }
                    }
                  }
                  return memo[n - 1]; // @step:return
                }
              }
