  stage-3:
    shortName: "二维DP"
    type: "tabulation-2d"
    timeBadge: "O(m×n)"
    badgeBg: "bg-emerald-100 text-emerald-700"
    name:
      forward: "阶段 3: 经典顺推二维 DP 填表 (带障碍物处理)"
      reverse: "阶段 3: 逆向倒序二维 DP 填表 (带障碍物处理)"
    desc:
      forward: "dp[i][j] 表示从起点到达 (i, j) 的路径总数。遇到障碍格时 dp[i][j] = 0，否则从上方与左方累加。"
      reverse: "dp[i][j] 表示从 (i, j) 到达终点的路径总数。遇障碍格置 0，否则从下方与右方累加。"
    card2Title:
      forward: "状态转移方程 (带障碍物 2D DP)"
      reverse: "逆推状态转移方程 (带障碍物 Reverse 2D DP)"
    card2Desc:
      forward: "若 obstacleGrid[i][j] == 1 则 dp[i][j] = 0；否则 dp[i][j] = 上方 dp[i-1][j] + 左方 dp[i][j-1]。"
      reverse: "若 obstacleGrid[i][j] == 1 则 dp[i][j] = 0；否则 dp[i][j] = 下方 dp[i+1][j] + 右方 dp[i][j+1]。"
    variants:
      if:
        variantLabel: "内嵌 if 障碍判断版"
        title:
          forward: "UniquePathsII_2D_If.java (内嵌 if 版)"
          reverse: "UniquePathsII_2D_ReverseIf.java (内嵌 if 版)"
        code:
          forward:
            title: "UniquePathsII_2D_If.java (内嵌 if 版)"
            source: |
              class Solution {
                public int uniquePathsWithObstacles(int[][] obstacleGrid) {
                  int m = obstacleGrid.length, n = obstacleGrid[0].length;
                  int[][] dp = new int[m][n]; // @step:init
                  for (int i = 0; i < m; i++) { // @step:loop_i
                    for (int j = 0; j < n; j++) { // @step:loop_j
                      if (obstacleGrid[i][j] == 1) { // @step:cond
                        dp[i][j] = 0; // @step:init_val // 障碍物格点为 0
                      } else if (i == 0 && j == 0) {
                        dp[i][j] = 1; // @step:init_val // 起点初始化
                      } else {
                        int fromTop = (i > 0) ? dp[i - 1][j] : 0; // @step:calc_top 查找上方可达路径
                        int fromLeft = (j > 0) ? dp[i][j - 1] : 0; // @step:calc_left 查找左方可达路径
                        dp[i][j] = fromTop + fromLeft; // @step:transfer 状态转移求和
                      }
                    }
                  }
                  return dp[m - 1][n - 1]; // @step:return
                }
              }
          reverse:
            title: "UniquePathsII_2D_ReverseIf.java (内嵌 if 版)"
            source: |
              class Solution {
                public int uniquePathsWithObstacles(int[][] obstacleGrid) {
                  int m = obstacleGrid.length, n = obstacleGrid[0].length;
                  int[][] dp = new int[m][n]; // @step:init
                  for (int i = m - 1; i >= 0; i--) { // @step:loop_i
                    for (int j = n - 1; j >= 0; j--) { // @step:loop_j
                      if (obstacleGrid[i][j] == 1) { // @step:cond
                        dp[i][j] = 0; // @step:init_val 障碍格为 0
                      } else if (i == m - 1 && j == n - 1) {
                        dp[i][j] = 1; // @step:init_val 终点初始化
                      } else {
                        int fromDown = (i + 1 < m) ? dp[i + 1][j] : 0; // @step:calc_down 查找下方可达路径
                        int fromRight = (j + 1 < n) ? dp[i][j + 1] : 0; // @step:calc_right 查找右方可达路径
                        dp[i][j] = fromDown + fromRight; // @step:transfer 状态转移求和
                      }
                    }
                  }
                  return dp[0][0]; // @step:return
                }
              }
      for:
        variantLabel: "外层边界预处理版"
        title:
          forward: "UniquePathsII_2D_For.java (外层 for 版)"
          reverse: "UniquePathsII_2D_ReverseFor.java (外层 for 版)"
        code:
          forward:
            title: "UniquePathsII_2D_For.java (外层 for 版)"
            source: |
              class Solution {
                public int uniquePathsWithObstacles(int[][] obstacleGrid) {
                  int m = obstacleGrid.length, n = obstacleGrid[0].length;
                  int[][] dp = new int[m][n]; // @step:init
                  for (int i = 0; i < m && obstacleGrid[i][0] == 0; i++) dp[i][0] = 1; // @step:init_row
                  for (int j = 0; j < n && obstacleGrid[0][j] == 0; j++) dp[0][j] = 1; // @step:init_col
                  for (int i = 1; i < m; i++) { // @step:loop_i
                    for (int j = 1; j < n; j++) { // @step:loop_j
                      if (obstacleGrid[i][j] == 0) { // @step:cond
                        dp[i][j] = dp[i - 1][j] + dp[i][j - 1]; // @step:transfer
                      }
                    }
                  }
                  return dp[m - 1][n - 1]; // @step:return
                }
              }
