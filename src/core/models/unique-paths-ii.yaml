          }

  stage-2:
    shortName: "记忆化"
    type: "memoization"
    timeBadge: "O(m×n)"
    badgeBg: "bg-purple-100 text-purple-700"
    name:
      forward: "阶段 2: 记忆化搜索 (带障碍剪枝缓存)"
      reverse: "阶段 2: 逆推记忆化搜索 (自顶向下剪枝)"
    desc:
      forward: "引入 memo[m][n] 缓存，遇到已计算格点直接 O(1) 返回；遇障碍物阻断返回 0。"
      reverse: "倒序记忆化搜索，自顶向下剪枝，已访问状态直接查表返回。"
    card2Title:
      forward: "记忆化剪枝调用树 (带障碍剪枝)"
      reverse: "逆推记忆化调用树 (带障碍剪枝)"
    card2Desc:
      forward: "已计算状态直接 O(1) 剪枝返回，遇到障碍物直接阻断，大幅消减重复子树。"
      reverse: "已访问子问题直接查表返回，遇到障碍物直接剪枝阻断。"
    variants:
      terminal:
        variantLabel: "越界/障碍拦截剪枝版"
        title:
          forward: "UniquePathsII_MemoTerminal.java (拦截剪枝版)"
          reverse: "UniquePathsII_MemoReverseTerminal.java (拦截剪枝版)"
        code:
          forward:
            title: "UniquePathsII_MemoTerminal.java (拦截剪枝版)"
            source: |
              class Solution {
                private int[][] memo;
                public int uniquePathsWithObstacles(int[][] obstacleGrid) {
                  int m = obstacleGrid.length, n = obstacleGrid[0].length;
                  memo = new int[m][n];
                  return dfs(obstacleGrid, 0, 0, m, n);
                }
                private int dfs(int[][] grid, int i, int j, int m, int n) { // @step:entry
                  if (i >= m || j >= n || grid[i][j] == 1) return 0; // @step:out_of_bounds @step:obstacle // 遇障碍阻断
                  if (i == m - 1 && j == n - 1) return 1; // @step:boundary // 抵达终点
                  if (memo[i][j] != 0) return memo[i][j]; // @step:cache_hit // ⚡ 缓存命中
                  int down = dfs(grid, i + 1, j, m, n);  // @step:branch_down
                  int right = dfs(grid, i, j + 1, m, n); // @step:branch_right
                  return memo[i][j] = down + right; // @step:combine
                }
              }
          reverse:
            title: "UniquePathsII_MemoReverseTerminal.java (拦截剪枝版)"
            source: |
              class Solution {
