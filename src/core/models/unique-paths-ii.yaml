id: unique-paths-ii
name: "不同路径 II"
nameEn: "Unique Paths II"
defaultStage: "stage-1"
category: "dynamic-programming"
icon: "🚧"
difficulty: 2
levelOrder: 6
learningGoal: "掌握带障碍物的网格路径动态规划与状态阻断边界处理技巧"
description: "网格路径数 II（LeetCode 63）：网格中存在障碍物（值为 1），遇到障碍物时路径数为 0，空间复杂度优化至一维 O(n)。"
defaultParams:
  m: 3
  n: 3
  obstacleGrid:
    - [0, 0, 0]
    - [0, 1, 0]
    - [0, 0, 0]

problem:
  leetcodeId: 63
  title: "不同路径 II"
  difficulty: "中等"
  tags: ["数组", "动态规划", "矩阵"]
  description: "给定一个 <code>m x n</code> 的整数数组 <code>grid</code>。一个机器人初始位于 <strong>左上角</strong>（即 <code>grid[0][0]</code>）。<br/><br/>机器人尝试移动到 <strong>右下角</strong>（即 <code>grid[m - 1][n - 1]</code>）。机器人每次只能向下或者向右移动一步。<br/><br/>网格中的障碍物和空位置分别用 <code>1</code> 和 <code>0</code> 来表示。机器人的移动路径中不能包含 <strong>任何</strong> 有障碍物的方格。<br/><br/>返回机器人从左上角到右下角所有可能的 <strong>不同路径的数量</strong>。"
  examples:
    - input: "obstacleGrid = [[0,0,0],[0,1,0],[0,0,0]]"
      output: "2"
      explanation: "3x3 网格的正中间有一个障碍物。<br/>从左上角到右下角一共有 2 条不同的路径：<br/>1. 向右 -> 向右 -> 向下 -> 向下<br/>2. 向下 -> 向下 -> 向右 -> 向右"
    - input: "obstacleGrid = [[0,1],[0,0]]"
      output: "1"
  constraints:
    - "m == obstacleGrid.length"
    - "n == obstacleGrid[i].length"
    - "1 <= m, n <= 100"
    - "obstacleGrid[i][j] 为 0 或 1"
  leetcodeUrl: "https://leetcode.cn/problems/unique-paths-ii/"

directions:
  forward:
    label: "顺推 (正序)"
    start: [0, 0]
    targetFormula: "[m - 1, n - 1]"
    branches:
      - name: "down"
        delta: [1, 0]
        label: "向下探索"
        codeVar: "down"
        arrow: "⬇️"
      - name: "right"
        delta: [0, 1]
        label: "向右探索"
        codeVar: "right"
        arrow: "➡️"
    combineFormula: "down + right"
  reverse:
    label: "逆推 (倒序)"
    startFormula: "[m - 1, n - 1]"
    target: [0, 0]
    branches:
      - name: "left"
        delta: [0, -1]
        label: "向左寻源"
        codeVar: "left"
        arrow: "⬅️"
      - name: "up"
        delta: [-1, 0]
        label: "向上寻源"
        codeVar: "up"
        arrow: "⬆️"
    combineFormula: "left + up"

stages:
  stage-1:
    shortName: "递归"
    type: "recursion"
    timeBadge: "O(2ⁿ)"
    badgeBg: "bg-slate-100 text-slate-700"
    name:
      forward: "阶段 1: 朴素递归 (带障碍顺推探索)"
      reverse: "阶段 1: 朴素递归 (带障碍逆推寻源)"
    desc:
      forward: "从起点 (0, 0) 开始向右向下递归分支，遇到障碍物格点立即返回 0 阻断，到达终点返回 1。"
      reverse: "从终点 (m-1, n-1) 开始逆推寻源，遇到障碍物返回 0，到达起点返回 1。"
    card2Title:
      forward: "递归调用树 (带障碍阻断)"
      reverse: "逆推调用树 (带障碍阻断)"
    card2Desc:
      forward: "展现 DFS 全排列遍历路径，遇障碍物节点 🚧 立即阻断并标记 return 0。"
      reverse: "展现倒序逆推寻源，遇障碍节点 🚧 立即阻断并标记 return 0。"
    variants:
      terminal:
        variantLabel: "越界/障碍拦截版"
        title:
          forward: "UniquePathsII_RecursiveTerminal.java (拦截版)"
          reverse: "UniquePathsII_RecursiveReverseTerminal.java (拦截版)"
        code:
          forward:
            title: "UniquePathsII_RecursiveTerminal.java (拦截版)"
            source: |
              class Solution {
                public int uniquePathsWithObstacles(int[][] obstacleGrid) {
                  int m = obstacleGrid.length, n = obstacleGrid[0].length;
                  return dfs(obstacleGrid, 0, 0, m, n);
                }
                private int dfs(int[][] grid, int i, int j, int m, int n) { // @step:entry
                  if (i >= m || j >= n || grid[i][j] == 1) return 0; // @step:out_of_bounds @step:obstacle // 越界/障碍阻断
                  if (i == m - 1 && j == n - 1) return 1; // @step:boundary // 达到终点
                  int down = dfs(grid, i + 1, j, m, n);  // @step:branch_down // 向下探索
                  int right = dfs(grid, i, j + 1, m, n); // @step:branch_right // 向右探索
                  return down + right; // @step:combine
                }
              }
          reverse:
            title: "UniquePathsII_RecursiveReverseTerminal.java (拦截版)"
            source: |
              class Solution {
                public int uniquePathsWithObstacles(int[][] obstacleGrid) {
                  int m = obstacleGrid.length, n = obstacleGrid[0].length;
                  return dfs(obstacleGrid, m - 1, n - 1);
                }
                private int dfs(int[][] grid, int i, int j) { // @step:entry
                  if (i < 0 || j < 0 || grid[i][j] == 1) return 0; // @step:out_of_bounds @step:obstacle // 越界/障碍阻断
                  if (i == 0 && j == 0) return 1; // @step:boundary // 回到起点
                  int left = dfs(grid, i, j - 1);  // @step:branch_left // 向左寻源
                  int up = dfs(grid, i - 1, j);    // @step:branch_up // 向上寻源
                  return left + up; // @step:combine
                }
              }
      boundary:
        variantLabel: "边缘直达障碍版"
        title:
          forward: "UniquePathsII_RecursiveBoundary.java (边缘直达版)"
          reverse: "UniquePathsII_RecursiveReverseBoundary.java (边缘直达版)"
        code:
          forward:
            title: "UniquePathsII_RecursiveBoundary.java (边缘直达版)"
            source: |
              class Solution {
                public int uniquePathsWithObstacles(int[][] obstacleGrid) {
                  int m = obstacleGrid.length, n = obstacleGrid[0].length;
                  return dfs(obstacleGrid, 0, 0, m, n);
                }
                private int dfs(int[][] grid, int i, int j, int m, int n) { // @step:entry
                  if (grid[i][j] == 1) return 0; // @step:obstacle // 障碍物阻断
                  if (i == m - 1 && j == n - 1) return 1; // @step:boundary // 抵达终点
                  int down = (i < m - 1) ? dfs(grid, i + 1, j, m, n) : 0;  // @step:branch_down
                  int right = (j < n - 1) ? dfs(grid, i, j + 1, m, n) : 0; // @step:branch_right
                  return down + right; // @step:combine
                }
              }
          reverse:
            title: "UniquePathsII_RecursiveReverseBoundary.java (边缘直达版)"
            source: |
              class Solution {
                public int uniquePathsWithObstacles(int[][] obstacleGrid) {
                  int m = obstacleGrid.length, n = obstacleGrid[0].length;
                  return dfs(obstacleGrid, m - 1, n - 1);
                }
                private int dfs(int[][] grid, int i, int j) { // @step:entry
                  if (grid[i][j] == 1) return 0; // @step:obstacle // 障碍物阻断
                  if (i == 0 && j == 0) return 1; // @step:boundary // 回溯到起点
                  int left = (j > 0) ? dfs(grid, i, j - 1) : 0; // @step:branch_left
                  int up = (i > 0) ? dfs(grid, i - 1, j) : 0;   // @step:branch_up
                  return left + up; // @step:combine
                }
              }
    code:
      forward:
        title: "UniquePathsII_Recursive.java"
        source: |
          class Solution {
