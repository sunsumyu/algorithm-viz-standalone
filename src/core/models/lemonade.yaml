  stage-4:
    shortName: "空间压缩"
    type: "optimized"
    timeBadge: "O(1) 空间"
    badgeBg: "bg-amber-100 text-amber-700"
    name: "空间压缩 (双变量极速状态机)"
    desc: "将状态表压缩为两个计数寄存器 five 与 ten，O(1) 空间单趟高速线性推演"
    card2Title: "极简寄存器状态机"
    card2Desc: "零额外内存开销，以最高效的寄存器步进完成判定。"
    code:
      forward:
        title: "LemonadeChange_Optimized.java"
        source: |
          public boolean lemonadeChange(int[] bills) {
              int five = 0, ten = 0; // @step:init
              for (int bill : bills) { // @step:loop
                  if (bill == 5) { five++; } // @step:recv5
                  else if (bill == 10) { // @step:recv10
                      if (five == 0) return false; // @step:fail10
                      five--; ten++; // @step:change10
                  } else { // @step:recv20
                      if (five > 0 && ten > 0) { five--; ten--; } // @step:opt20
                      else if (five >= 3) { five -= 3; } // @step:alt20
                      else { return false; } // @step:fail20
                  }
              }
              return true; // @step:done
          }
      reverse:
        title: "LemonadeChange_Optimized_Reverse.java"
        source: |
