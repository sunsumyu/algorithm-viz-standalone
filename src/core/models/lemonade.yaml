                      }
                  }
              }
              return true; // @step:done
          }

  stage-2:
    shortName: "决策树"
    type: "memoization"
    timeBadge: "分支探索"
    badgeBg: "bg-blue-100 text-blue-700"
    name: "找零分支决策依赖树"
    desc: "将每一笔交易展开为决策状态树，直观对比贪心优先消耗 10 元分支与消耗 3 张 5 元分支的后续生存率"
    card2Title: "状态分支依赖树"
    card2Desc: "观察自顶向下各顾客账单引发的资源池转移状态。"
    code:
      forward:
        title: "LemonadeChange_Tree.java"
        source: |
          public boolean dfs(int index, int five, int ten, int[] bills) {
              if (index == bills.length) return true; // @step:base
              int bill = bills[index]; // @step:entry
              if (bill == 5) {
                  return dfs(index + 1, five + 1, ten, bills); // @step:branch5
              } else if (bill == 10) {
                  if (five == 0) return false; // @step:prune10
                  return dfs(index + 1, five - 1, ten + 1, bills); // @step:branch10
              } else {
                  if (five > 0 && ten > 0) {
                      return dfs(index + 1, five - 1, ten - 1, bills); // @step:branch20_opt
                  }
                  if (five >= 3) {
                      return dfs(index + 1, five - 3, ten, bills); // @step:branch20_alt
                  }
                  return false; // @step:prune20
              }
          }
      reverse:
        title: "LemonadeChange_Tree_Reverse.java"
        source: |
          public boolean dfs(int index, int five, int ten, int[] bills) {
              if (index == bills.length) return true; // @step:base
              int bill = bills[index]; // @step:entry
              if (bill == 5) {
                  return dfs(index + 1, five + 1, ten, bills); // @step:branch5
              } else if (bill == 10) {
                  if (five == 0) return false; // @step:prune10
                  return dfs(index + 1, five - 1, ten + 1, bills); // @step:branch10
              } else {
                  if (five > 0 && ten > 0) {
                      return dfs(index + 1, five - 1, ten - 1, bills); // @step:branch20_opt
                  }
                  if (five >= 3) {
                      return dfs(index + 1, five - 3, ten, bills); // @step:branch20_alt
                  }
                  return false; // @step:prune20
              }
          }

  stage-3:
    shortName: "状态转移"
    type: "dynamic-programming"
    timeBadge: "O(n) 状态表"
    badgeBg: "bg-purple-100 text-purple-700"
    name: "有限状态转移矩阵"
    desc: "构建状态转移跟踪表，展示每一步顾客输入带来的货币池 (five, ten) 状态转移与断言"
    card2Title: "货币池状态转移矩阵"
    card2Desc: "通过表格清晰展现每个顾客交易前后的货币向量变化。"
    code:
      forward:
        title: "LemonadeChange_DP.java"
        source: |
          public boolean checkTransfer(int[] bills) {
              int n = bills.length; // @step:entry
              int[][] state = new int[n + 1][2]; // @step:table_init
              for (int i = 0; i < n; i++) { // @step:loop
                  int bill = bills[i]; // @step:fetch
                  if (bill == 5) {
                      state[i + 1][0] = state[i][0] + 1; // @step:trans5
                      state[i + 1][1] = state[i][1];
                  } else if (bill == 10) {
                      if (state[i][0] < 1) return false; // @step:check10
                      state[i + 1][0] = state[i][0] - 1; // @step:trans10
                      state[i + 1][1] = state[i][1] + 1;
                  } else {
                      if (state[i][0] >= 1 && state[i][1] >= 1) { // @step:check20_opt
                          state[i + 1][0] = state[i][0] - 1; // @step:trans20_opt
                          state[i + 1][1] = state[i][1] - 1;
                      } else if (state[i][0] >= 3) { // @step:check20_alt
                          state[i + 1][0] = state[i][0] - 3; // @step:trans20_alt
                          state[i + 1][1] = state[i][1];
                      } else {
                          return false; // @step:fail20
                      }
                  }
              }
              return true; // @step:done
          }
      reverse:
        title: "LemonadeChange_DP_Reverse.java"
        source: |
