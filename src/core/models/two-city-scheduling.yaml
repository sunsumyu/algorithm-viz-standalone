          // @step:prune 4. 配额约束剪枝
          // @step:backtrack 5. 逆向回溯
          // @step:done 6. 逆向收敛

  stage-3:
    name: 二维状态转移矩阵 DP 填表
    description: 构建 dp[i][j] 状态矩阵，表示前 i 个人中有 j 个人飞往城市 A 的最低总开销
    complexity:
      time: O(N^2)
      space: O(N^2)
    code:
      forward:
        language: java
        source: |
          // 状态转移矩阵：dp[2N+1][N+1]
          // @step:dp_init 1. 初始化矩阵 dp，dp[0][0] = 0
          // @step:dp_loop 2. 外层遍历人员 i 从 1 到 2N
          // @step:dp_transfer 3. 状态转移：dp[i][j] = min(dp[i-1][j-1] + costA, dp[i-1][j] + costB)
          // @step:dp_done 4. 全局最优：dp[2N][N]
      reverse:
