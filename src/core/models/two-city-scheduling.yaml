# ==============================================================================
# 🏆 [TOP-LEVEL GREEDY MODEL] 两地调度 顶层领域模型
# 对应：LeetCode 1029 / 左程云算法讲解 089 Code02
# 包含：差额排序贪心、回溯决策依赖树、二维费用状态矩阵、O(1)空间原地流转
# ==============================================================================

id: two-city-scheduling
name: 两地调度 (Two City Scheduling)
category: greedy
difficulty: medium
tags:
  - 贪心算法
  - 数组
  - 排序
  - 动态规划

description: |
  公司计划面试 2N 个人。给定一个数组 costs，其中 costs[i] = [aCosti, bCosti]，
  表示第 i 个人飞往 A 市的费用为 aCosti，飞往 B 市的费用为 bCosti。
  返回将每个人都飞到某座城市的最低费用，要求每个城市都有 N 个人抵达。
  核心策略：
  1. 差额排序贪心：假设所有 2N 个人先全部飞往 B 市，总花费为 sum(costs[i][1])。
     若将第 i 个人从 B 改去 A，增量花费为 (costs[i][0] - costs[i][1])。
     贪心策略：将所有人按 (costA - costB) 升序排序，挑选差值最小的前 N 个人改去 A 市，
     剩余 N 个人维持去 B 市，总花费即可达到全局最小。
  2. Forward: 按 (costA - costB) 升序排序，优先选取去 A 市最节省的前 N 人。
  3. Reverse: 按 (costB - costA) 升序排序，优先选取去 B 市最节省的前 N 人。

defaultParams:
  costs:
    - [10, 20]
    - [30, 200]
    - [400, 50]
    - [30, 20]

constraints:
  - 2 <= costs.length <= 100
  - costs.length 为偶数
  - 1 <= aCosti, bCosti <= 1000

directions:
  forward:
    name: 差额排序优先分配 A 市 (A-Oriented Difference Greedy)
    description: 所有人预设去 B 市，按 (costA - costB) 升序挑选前 N 个改去 A 市最划算的人
  reverse:
    name: 差额排序优先分配 B 市 (B-Oriented Difference Greedy)
    description: 所有人预设去 A 市，按 (costB - costA) 升序挑选前 N 个改去 B 市最划算的人

stages:
  stage-1:
    name: 差额排序贪心调度
    description: 按两地差值升序排序，前 N 人安排至第一座城市，后 N 人安排至第二座城市
    complexity:
      time: O(N log N)
      space: O(1)
    code:
      forward:
        language: java
        source: |
          public int twoCitySchedCost(int[][] costs) {
              // @step:sort 1. 按 (costA - costB) 升序排序
              Arrays.sort(costs, (a, b) -> (a[0] - a[1]) - (b[0] - b[1]));
              int totalCost = 0;
              int n = costs.length / 2;
              // @step:assign_a 2. 前 n 个人前往城市 A
              for (int i = 0; i < n; i++) totalCost += costs[i][0];
              // @step:assign_b 3. 后 n 个人前往城市 B
              for (int i = n; i < 2 * n; i++) totalCost += costs[i][1];
              // @step:done 4. 返回最低调度总费用
              return totalCost;
          }
      reverse:
        language: java
        source: |
          public int twoCitySchedCostReverse(int[][] costs) {
              // @step:sort 1. 按 (costB - costA) 升序排序
              Arrays.sort(costs, (a, b) -> (a[1] - a[0]) - (b[1] - b[0]));
              int totalCost = 0;
              int n = costs.length / 2;
              // @step:assign_b 2. 前 n 个人前往城市 B
              for (int i = 0; i < n; i++) totalCost += costs[i][1];
              // @step:assign_a 3. 后 n 个人前往城市 A
              for (int i = n; i < 2 * n; i++) totalCost += costs[i][0];
              // @step:done 4. 返回最低调度总费用
              return totalCost;
          }

  stage-2:
    name: 递归分支与决策依赖树展开
    description: 展开每位面试者选择 A 市或 B 市的递归分支树，展示容量剪枝与最优路径回溯
    complexity:
      time: O(2^(2N))
      space: O(N)
    code:
      forward:
        language: java
        source: |
