                function strangePrinter(s) { // @step:entry
                    const n = s.length; // @step:init_n
                    if (n <= 1) return n; // @step:guard_less
                    const dp = Array.from({ length: n }, () => new Array(n).fill(0)); // @step:init_dp
                    for (let i = 0; i < n; i++) dp[i][i] = 1; // @step:init_base
                    for (let i = n - 2; i >= 0; i--) { // @step:loop_i
