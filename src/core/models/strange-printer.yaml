  stage-2:
    shortName: "记忆化"
    type: "memoization"
    timeBadge: "O(n³)"
    badgeBg: "bg-blue-100 text-blue-700"
    name:
      forward: "阶段 2: 记忆化搜索剪枝 (备忘录消除重复子串涂色)"
      reverse: "阶段 2: 记忆化逆向回溯 (带缓存的染色推演)"
    desc:
      forward: "引入 memo[i][j] 备忘录缓存子串 s[i..j] 的最少打印次数。查表若已计算则直接 O(1) 返回，消除重叠子串的重复求解。"
      reverse: "逆向展示记忆化树的剪枝效果与缓存复用。"
    variants:
      standard:
        variantLabel: "备忘录搜索实现"
        title:
          forward: "StrangePrinter_Memo.java"
          reverse: "StrangePrinter_Memo_Reverse.java"
        code:
          forward:
            title: "StrangePrinter_Memo.java"
            source: |
              class Solution {
                  public int strangePrinter(String s) { // @step:entry
                      int n = s.length(); // @step:init_n
                      if (n <= 1) return n; // @step:guard_less
                      int[][] memo = new int[n][n]; // @step:init_dp
                      return dfs(s, memo, 0, n - 1); // @step:call_dfs
                  }
                  private int dfs(String s, int[][] memo, int i, int j) { // @step:dfs_entry
                      if (i > j) return 0; // @step:guard_empty
                      if (i == j) return 1; // @step:boundary
                      if (memo[i][j] != 0) return memo[i][j]; // @step:cache_hit
                      if (s.charAt(i) == s.charAt(j)) { // @step:cond_same
                          memo[i][j] = dfs(s, memo, i, j - 1); // @step:transfer_same
                          return memo[i][j]; // @step:return_same
                      }
                      int minTurns = Integer.MAX_VALUE; // @step:init_min
                      for (int k = i; k < j; k++) { // @step:loop_k
                          int turns = dfs(s, memo, i, k) + dfs(s, memo, k + 1, j); // @step:calc_turns
                          minTurns = Math.min(minTurns, turns); // @step:update_min
                      }
                      memo[i][j] = minTurns; // @step:transfer_diff
                      return minTurns; // @step:return
                  }
              }
