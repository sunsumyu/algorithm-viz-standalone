# ==============================================================================
# 🏆 [TOP-LEVEL ALGORITHM MODEL] 顶层抽象模型规范
# 奇怪的打印机 (Strange Printer / LeetCode 664 / 左程云 Class 076 Code04)
# 核心：字符染色区间 DP——若 s[i]==s[j] 顺带覆盖 dp[i][j]=dp[i][j-1]，否则枚举分割点 k 取 min(dp[i][k]+dp[k+1][j])
# 四阶段全演化标准参考模型 (Stage 1-4, forward/reverse 双向支持)
# ==============================================================================

id: strange-printer
name: "奇怪的打印机"
nameEn: "Strange Printer"
defaultStage: "stage-3"
category: "dynamic-programming"
icon: "🖨️"
difficulty: 3
levelOrder: 664
learningGoal: "深刻掌握区间 DP 中的字符染色覆盖消除策略，理解首尾相同字符直接顺带覆盖与最优子串拼接分割的思想"
description: "左程云算法通关课 Class 076 Code04：LeetCode 664 奇怪的打印机，字符涂色刷漆贪心抵消的区间 DP。dp[i][j] 表示打印子串 s[i..j] 所需的最少操作次数。"
defaultParams:
  s: "aaabbb"

problem:
  leetcodeId: 664
  title: "奇怪的打印机 (LeetCode 664 / Class 076 Code04)"
  difficulty: "困难"
  tags: ["动态规划", "区间 DP", "字符串"]
  description: "有台奇怪的打印机，每次只能打印同一个字符构成的连续子串，且可以覆盖之前打印过的字符。<br/><br/>给你一个字符串 <code>s</code> ，请你返回打印该字符串所需的最少操作次数。"
  examples:
    - input: "s = 'aaabbb'"
      output: "2"
      explanation: "首先打印 'aaa'，然后在其后打印 'bbb'，共需 2 次。"
    - input: "s = 'aba'"
      output: "2"
      explanation: "首先打印 'aaa'，然后将中间覆盖打印为 'b'，共需 2 次。"
  constraints:
    - "1 <= s.length <= 100 (演示推荐 <= 8)"
    - "s 由小写英文字母组成"
  leetcodeUrl: "https://leetcode.cn/problems/strange-printer/"

directions:
  forward:
    label: "子串长度顺推 (len=2..n 上三角自底向上填表)"
    branches:
      - name: "same_cover"
        label: "首尾相同字符顺带覆盖"
        formula: "dp[i][j - 1]"
      - name: "split_diff"
        label: "首尾相异枚举分割点 k"
        formula: "min_{k}(dp[i][k] + dp[k + 1][j])"
    combineFormula: "s[i]==s[j] ? dp[i][j-1] : min_{k}(dp[i][k] + dp[k+1][j])"
  reverse:
    label: "全局子串逆推分解 (从全局 [0, n-1] 逆向寻源)"
    description: "从完整字符串 s[0..n-1] 出发，逆向展示打印机染色覆盖与子串分割依赖"
    startFormula: "dp[0][n - 1]"
    target: "dp[i][i] = 1"
    branches:
      - name: "trace_branches"
        label: "逆向最优打印覆盖推导"
        formula: "dp[i][k] + dp[k+1][j]"
    combineFormula: "逆向染色覆盖依赖分析"

stages:
  stage-1:
    shortName: "递归"
    type: "recursion"
    timeBadge: "O(2ⁿ)"
    badgeBg: "bg-slate-100 text-slate-700"
    name:
      forward: "阶段 1: 暴力分治递归树展开 (字符染色与分割枚举)"
      reverse: "阶段 1: 暴力递归逆推寻源 (状态空间倒序展开)"
    desc:
      forward: "分治策略：若 s[i] == s[j]，打印左端字符时可以一次性刷到右端，因此直接归约为子问题 dfs(i, j-1)；若 s[i] != s[j]，枚举切分点 k 分段独立打印。"
      reverse: "从全局字符串 [0..n-1] 逆向展示递归染色决策分支。"
    variants:
      standard:
        variantLabel: "标准分治递归实现"
        title:
          forward: "StrangePrinter_Recursive.java"
          reverse: "StrangePrinter_Recursive_Reverse.java"
        code:
          forward:
            title: "StrangePrinter_Recursive.java"
            source: |
              class Solution {
                  public int strangePrinter(String s) { // @step:entry
                      int n = s.length(); // @step:init_n
                      if (n <= 1) return n; // @step:guard_less
                      return dfs(s, 0, n - 1); // @step:return
                  }
                  private int dfs(String s, int i, int j) { // @step:dfs_entry
                      if (i > j) return 0; // @step:guard_empty
                      if (i == j) return 1; // @step:boundary
                      if (s.charAt(i) == s.charAt(j)) { // @step:cond_same
                          return dfs(s, i, j - 1); // @step:transfer_same
                      }
                      int minTurns = Integer.MAX_VALUE; // @step:init_min
                      for (int k = i; k < j; k++) { // @step:loop_k
                          int turns = dfs(s, i, k) + dfs(s, k + 1, j); // @step:calc_turns
                          minTurns = Math.min(minTurns, turns); // @step:update_min
                      }
                      return minTurns; // @step:transfer_diff
                  }
              }
