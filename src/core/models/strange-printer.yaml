                class Solution:
                    def strangePrinter(self, s: str) -> int: # @step:entry
                        n = len(s) # @step:init_n
                        if n <= 1: return n # @step:guard_less
                        dp = [[0] * n for _ in range(n)] # @step:init_dp
                        for i in range(n): dp[i][i] = 1 # @step:init_base
                        for i in range(n - 2, -1, -1): # @step:loop_i
                            for j in range(i + 1, n): # @step:calc_j
                                if s[i] == s[j]: # @step:cond_same
                                    dp[i][j] = dp[i][j - 1] # @step:transfer_same
                                else:
                                    dp[i][j] = min(dp[i][k] + dp[k + 1][j] for k in range(i, j)) # @step:transfer_diff
                        return dp[0][n - 1] # @step:return
