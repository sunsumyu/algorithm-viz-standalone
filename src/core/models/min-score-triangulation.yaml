                    }
                }
              cpp: |
                class Solution {
                public:
                    int minScoreTriangulation(vector<int>& values) { // @step:entry
                        int n = values.size(); // @step:init_n
                        if (n < 3) return 0; // @step:guard_less
                        vector<vector<int>> memo(n, vector<int>(n, 0)); // @step:init_dp
                        return dfs(values, memo, 0, n - 1); // @step:call_dfs
                    }
                    int dfs(vector<int>& values, vector<vector<int>>& memo, int i, int j) { // @step:dfs_entry
                        if (i + 1 >= j) return 0; // @step:boundary
                        if (memo[i][j] != 0) return memo[i][j]; // @step:cache_hit
                        int minScore = INT_MAX; // @step:init_min
                        for (int k = i + 1; k < j; k++) { // @step:loop_k
                            int triangle = values[i] * values[k] * values[j]; // @step:calc_tri
                            int score = dfs(values, memo, i, k) + dfs(values, memo, k, j) + triangle; // @step:calc_score
                            minScore = min(minScore, score); // @step:update_min
                        }
                        return memo[i][j] = minScore; // @step:transfer
                    }
                };
              python: |
                class Solution:
                    def minScoreTriangulation(self, values: List[int]) -> int: # @step:entry
                        n = len(values) # @step:init_n
                        if n < 3: return 0 # @step:guard_less
                        memo = {} # @step:init_dp
                        def dfs(i: int, j: int) -> int: # @step:dfs_entry
                            if i + 1 >= j: return 0 # @step:boundary
                            if (i, j) in memo: return memo[(i, j)] # @step:cache_hit
                            min_score = float('inf') # @step:init_min
                            for k in range(i + 1, j): # @step:loop_k
                                triangle = values[i] * values[k] * values[j] # @step:calc_tri
                                score = dfs(i, k) + dfs(k, j) + triangle # @step:calc_score
                                min_score = min(min_score, score) # @step:update_min
                            memo[(i, j)] = min_score # @step:transfer
                            return min_score # @step:return
                        return dfs(0, n - 1) # @step:call_dfs
              javascript: |
                function minScoreTriangulation(values) { // @step:entry
                    const n = values.length; // @step:init_n
                    if (n < 3) return 0; // @step:guard_less
                    const memo = Array.from({ length: n }, () => new Array(n).fill(0)); // @step:init_dp
                    function dfs(i, j) { // @step:dfs_entry
                        if (i + 1 >= j) return 0; // @step:boundary
                        if (memo[i][j] !== 0) return memo[i][j]; // @step:cache_hit
                        let minScore = Infinity; // @step:init_min
                        for (let k = i + 1; k < j; k++) { // @step:loop_k
                            const triangle = values[i] * values[k] * values[j]; // @step:calc_tri
                            const score = dfs(i, k) + dfs(k, j) + triangle; // @step:calc_score
                            minScore = Math.min(minScore, score); // @step:update_min
                        }
                        memo[i][j] = minScore; // @step:transfer
                        return minScore; // @step:return
                    }
                    return dfs(0, n - 1); // @step:call_dfs
                }

  stage-3:
    shortName: "二维DP"
    type: "tabulation"
    timeBadge: "O(n³)"
    badgeBg: "bg-emerald-100 text-emerald-700"
    name:
      forward: "阶段 3: 严格二维表递推 (多边形顶点跨度自底向上填表)"
      reverse: "阶段 3: 逆向依赖寻源填表 (从全多边形逆向校验剖分边界)"
    desc:
      forward: "外层按多边形顶点跨度 len 从 3 到 n 递增循环，内层枚举起点 i 计算终点 j = i + len - 1。枚举第三点 k ∈ (i, j)，dp[i][j] 严格依赖已填妥的左子多边形 dp[i][k] 与右子多边形 dp[k][j]。"
      reverse: "从最终全局多边形 dp[0][n-1] 逆向追溯上三角矩阵的依赖关系与最优三角形切分链。"
    variants:
      standard:
        variantLabel: "标准区间DP填表"
        title:
          forward: "MinScoreTriangulation_Tabulation.java"
          reverse: "MinScoreTriangulation_Tabulation_Reverse.java"
        code:
          forward:
            title: "MinScoreTriangulation_Tabulation.java"
            source: |
              class Solution {
                  public int minScoreTriangulation(int[] values) { // @step:entry
                      int n = values.length; // @step:init_n
                      if (n < 3) return 0; // @step:guard_less
                      int[][] dp = new int[n][n]; // @step:init_dp
                      for (int len = 3; len <= n; len++) { // @step:loop_len
                          for (int i = 0; i <= n - len; i++) { // @step:loop_i
                              int j = i + len - 1; // @step:calc_j
                              int minScore = Integer.MAX_VALUE; // @step:init_min
                              for (int k = i + 1; k < j; k++) { // @step:loop_k
                                  int triangle = values[i] * values[k] * values[j]; // @step:calc_tri
                                  int score = dp[i][k] + dp[k][j] + triangle; // @step:calc_score
                                  minScore = Math.min(minScore, score); // @step:update_min
                              }
                              dp[i][j] = minScore; // @step:transfer
                          }
                      }
                      return dp[0][n - 1]; // @step:return
                  }
              }
