# ==============================================================================
# 🏆 [TOP-LEVEL ALGORITHM MODEL] 顶层抽象模型规范
# 多边形三角剖分的最低得分 (LeetCode 1039 / 左程云 Class 076 Code01)
# 核心：凸多边形区间 DP——固定底边 (i, j)，枚举内部第三个顶点 k 构三角形
# dp[i][j] = min_{k}(dp[i][k] + dp[k][j] + values[i]*values[k]*values[j])
# 四阶段全演化标准参考模型 (Stage 1-4, forward/reverse 双向支持)
# ==============================================================================

id: min-score-triangulation
name: "多边形三角剖分的最低得分"
nameEn: "Minimum Score Triangulation of Polygon"
defaultStage: "stage-3"
category: "dynamic-programming"
icon: "📐"
difficulty: 2
levelOrder: 1039
learningGoal: "深刻掌握凸多边形几何划分与区间 DP 的对应关系，理解固定底边 (i, j) 枚举中间顶点 k 消除子问题依赖的建模方法"
description: "左程云算法通关课 Class 076 Code01：LeetCode 1039 多边形三角剖分的最低得分，凸多边形区间 DP 经典。dp[i][j] 表示凸子多边形 [i..j] 剖分为三角形的最低得分总和。"
defaultParams:
  values: [3, 7, 4, 5]

problem:
  leetcodeId: 1039
  title: "多边形三角剖分的最低得分 (LeetCode 1039 / Class 076 Code01)"
  difficulty: "中等"
  tags: ["动态规划", "区间 DP", "计算几何"]
  description: "你有一个凸 <code>n</code> 边形，其每个顶点都有一个权值。逆时针依次记录在数组 <code>values</code> 中。<br/><br/>假设你将多边形剖分为 <code>n - 2</code> 个三角形。每个三角形的得分是其三个顶点的权值乘积。多边形三角剖分的总得分是全部三角形得分之和。<br/><br/>返回多边形三角剖分的最低可能得分。"
  examples:
    - input: "values = [1, 2, 3]"
      output: "6"
      explanation: "已有 3 个顶点本身就是一个三角形，得分 = 1*2*3 = 6。"
    - input: "values = [3, 7, 4, 5]"
      output: "144"
      explanation: "有两种三角剖分方案：<br/>1. (3,7,5) + (7,4,5) = 105 + 140 = 245<br/>2. (3,7,4) + (3,4,5) = 84 + 60 = 144<br/>最低得分为 144。"
  constraints:
    - "n == values.length"
    - "3 <= n <= 50 (演示推荐 <= 6)"
    - "1 <= values[i] <= 100"
  leetcodeUrl: "https://leetcode.cn/problems/minimum-score-triangulation-of-polygon/"

directions:
  forward:
    label: "多边形跨度顺推 (len=3..n 上三角自底向上填表)"
    branches:
      - name: "sub_left"
        label: "左子多边形 [i..k]"
        formula: "dp[i][k]"
      - name: "sub_right"
        label: "右子多边形 [k..j]"
        formula: "dp[k][j]"
      - name: "tri_score"
        label: "三角形 (i, k, j) 得分"
        formula: "values[i] * values[k] * values[j]"
    combineFormula: "min_{k}(dp[i][k] + dp[k][j] + values[i] * values[k] * values[j])"
  reverse:
    label: "全局凸多边形逆推分解 (从全局 [0, n-1] 逆向寻源)"
    description: "从完整多边形 [0, n-1] 出发，逆向枚举分割顶点 k 分解子多边形"
    startFormula: "dp[0][n - 1]"
    target: "dp[i][i + 1] = 0"
    branches:
      - name: "trace_k"
        label: "逆向最优三角剖分顶点 k"
        formula: "dp[i][k] + dp[k][j] + values[i]*values[k]*values[j]"
    combineFormula: "逆向多边形子状态依赖"

stages:
  stage-1:
    shortName: "递归"
    type: "recursion"
    timeBadge: "O(3ⁿ)"
    badgeBg: "bg-slate-100 text-slate-700"
    name:
      forward: "阶段 1: 暴力分治递归树展开 (枚举顶点 k 构造三角形)"
      reverse: "阶段 1: 暴力递归逆推寻源 (多边形分治树逆向展开)"
    desc:
      forward: "固定底边 (i, j)，枚举内部任意第三个顶点 k ∈ (i, j)，将子多边形分割为三角形 (i, k, j)、左侧凸多边形 [i..k] 与右侧凸多边形 [k..j]。递归展示指数级多边形切分。"
      reverse: "从顶层完整多边形 [0, n-1] 开始递归展开，展示指数级爆炸的切分子问题。"
    variants:
      standard:
        variantLabel: "标准分治递归实现"
        title:
          forward: "MinScoreTriangulation_Recursive.java"
          reverse: "MinScoreTriangulation_Recursive_Reverse.java"
        code:
          forward:
            title: "MinScoreTriangulation_Recursive.java"
            source: |
              class Solution {
                  public int minScoreTriangulation(int[] values) { // @step:entry
                      int n = values.length; // @step:init_n
                      if (n < 3) return 0; // @step:guard_less
                      return dfs(values, 0, n - 1); // @step:return
                  }
                  private int dfs(int[] values, int i, int j) { // @step:dfs_entry
                      if (i + 1 >= j) return 0; // @step:boundary
                      int minScore = Integer.MAX_VALUE; // @step:init_min
                      for (int k = i + 1; k < j; k++) { // @step:loop_k
                          int triangle = values[i] * values[k] * values[j]; // @step:calc_tri
                          int score = dfs(values, i, k) + dfs(values, k, j) + triangle; // @step:calc_score
                          minScore = Math.min(minScore, score); // @step:update_min
                      }
                      return minScore; // @step:transfer
                  }
              }
