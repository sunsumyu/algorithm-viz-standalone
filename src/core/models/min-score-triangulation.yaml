                function minScoreTriangulation(values) { // @step:entry
                    const n = values.length; // @step:init_n
                    if (n < 3) return 0; // @step:guard_less
                    const dp = Array.from({ length: n }, () => new Array(n).fill(0)); // @step:init_dp
                    for (let i = n - 3; i >= 0; i--) { // @step:loop_i
                        for (let j = i + 2; j < n; j++) { // @step:calc_j
                            let minScore = Infinity; // @step:init_min
                            for (let k = i + 1; k < j; k++) { // @step:loop_k
                                const triangle = values[i] * values[k] * values[j]; // @step:calc_tri
                                const score = dp[i][k] + dp[k][j] + triangle; // @step:calc_score
                                minScore = Math.min(minScore, score); // @step:update_min
                            }
                            dp[i][j] = minScore; // @step:transfer
                        }
                    }
                    return dp[0][n - 1]; // @step:return
