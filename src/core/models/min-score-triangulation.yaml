  stage-2:
    shortName: "记忆化"
    type: "memoization"
    timeBadge: "O(n³)"
    badgeBg: "bg-blue-100 text-blue-700"
    name:
      forward: "阶段 2: 记忆化搜索剪枝 (备忘录消除重叠子多边形)"
      reverse: "阶段 2: 记忆化逆向回溯 (带缓存的寻源推演)"
    desc:
      forward: "引入 memo[i][j] 备忘录缓存子多边形 [i..j] 的最低三角剖分得分。先查表，若已计算则直接 O(1) 返回，未计算则递归求解并存入缓存，时间复杂度从指数级降至 O(n³)。"
      reverse: "逆向推演多边形三角剖分记忆化树剪枝过程与命中缓存的高效返回。"
    variants:
      standard:
        variantLabel: "备忘录搜索实现"
        title:
          forward: "MinScoreTriangulation_Memo.java"
          reverse: "MinScoreTriangulation_Memo_Reverse.java"
        code:
          forward:
            title: "MinScoreTriangulation_Memo.java"
            source: |
              class Solution {
                  public int minScoreTriangulation(int[] values) { // @step:entry
                      int n = values.length; // @step:init_n
                      if (n < 3) return 0; // @step:guard_less
                      int[][] memo = new int[n][n]; // @step:init_dp
                      return dfs(values, memo, 0, n - 1); // @step:call_dfs
                  }
                  private int dfs(int[] values, int[][] memo, int i, int j) { // @step:dfs_entry
                      if (i + 1 >= j) return 0; // @step:boundary
                      if (memo[i][j] != 0) return memo[i][j]; // @step:cache_hit
                      int minScore = Integer.MAX_VALUE; // @step:init_min
                      for (int k = i + 1; k < j; k++) { // @step:loop_k
                          int triangle = values[i] * values[k] * values[j]; // @step:calc_tri
                          int score = dfs(values, memo, i, k) + dfs(values, memo, k, j) + triangle; // @step:calc_score
                          minScore = Math.min(minScore, score); // @step:update_min
                      }
                      memo[i][j] = minScore; // @step:transfer
                      return minScore; // @step:return
                  }
              }
            languages:
              java: |
                class Solution {
                    public int minScoreTriangulation(int[] values) { // @step:entry
                        int n = values.length; // @step:init_n
                        if (n < 3) return 0; // @step:guard_less
                        int[][] memo = new int[n][n]; // @step:init_dp
                        return dfs(values, memo, 0, n - 1); // @step:call_dfs
                    }
                    private int dfs(int[] values, int[][] memo, int i, int j) { // @step:dfs_entry
                        if (i + 1 >= j) return 0; // @step:boundary
                        if (memo[i][j] != 0) return memo[i][j]; // @step:cache_hit
                        int minScore = Integer.MAX_VALUE; // @step:init_min
                        for (int k = i + 1; k < j; k++) { // @step:loop_k
                            int triangle = values[i] * values[k] * values[j]; // @step:calc_tri
                            int score = dfs(values, memo, i, k) + dfs(values, memo, k, j) + triangle; // @step:calc_score
                            minScore = Math.min(minScore, score); // @step:update_min
                        }
                        memo[i][j] = minScore; // @step:transfer
