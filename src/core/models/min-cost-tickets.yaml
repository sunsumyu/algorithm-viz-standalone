stages:
  stage-1:
    shortName: "暴力递归"
    type: "recursion"
    timeBadge: "O(3^N)"
    badgeBg: "bg-blue-100 text-blue-700"
    name:
      forward: "阶段 1: 暴力递归 (顺向深度遍历)"
      reverse: "阶段 1: 暴力递归 (指数级三分支穷举)"
    desc:
      forward: "从首个旅行日开始顺向决策，尝试买 1/7/30 天票并跨步递归。"
      reverse: "定义 f(i) 为从第 i 个旅行日开始完成后续所有旅行的最低花费，每个旅行日展开 1/7/30 天三个决策分支。"
    variants:
      standard:
        variantLabel: "标准递归版"
        title:
          forward: "MinCostTickets_Recursive_Forward.java"
          reverse: "MinCostTickets_Recursive_Reverse.java"
        code:
          forward:
            title: "MinCostTickets_Recursive_Forward.java"
            source: |
              class Solution {
                  public int mincostTickets(int[] days, int[] costs) {
                      return f(days, costs, 0);
                  }
                  private int f(int[] days, int[] costs, int i) { // @step:entry
                      if (i >= days.length) return 0; // @step:boundary // 全部计划日均已覆盖
                      int ans = Integer.MAX_VALUE;
                      int[] duration = {1, 7, 30};
                      for (int k = 0, j = i; k < 3; k++) { // @step:loop_branch // 遍历三种通行证
                          while (j < days.length && days[j] < days[i] + duration[k]) { // @step:skip_days // 跨过覆盖期
                              j++;
                          }
                          ans = Math.min(ans, costs[k] + f(days, costs, j)); // @step:recursive_call // 递归子问题
                      }
                      return ans; // @step:return
                  }
              }
          reverse:
            title: "MinCostTickets_Recursive_Reverse.java"
            source: |
              class Solution {
                  public int mincostTickets(int[] days, int[] costs) {
                      return f(days, costs, 0);
                  }
                  private int f(int[] days, int[] costs, int i) { // @step:entry
                      if (i >= days.length) return 0; // @step:boundary // 到达终点花费为0
                      int ans = Integer.MAX_VALUE;
                      int[] duration = {1, 7, 30};
                      for (int k = 0, j = i; k < 3; k++) { // @step:loop_branch // 评估1/7/30天方案
                          while (j < days.length && days[j] < days[i] + duration[k]) { // @step:skip_days // 跳过覆盖日
                              j++;
                          }
                          ans = Math.min(ans, costs[k] + f(days, costs, j)); // @step:recursive_call // 累加票价并深入递归
                      }
                      return ans; // @step:return
                  }
              }

  stage-2:
    shortName: "记忆化"
    type: "memoization"
    timeBadge: "O(N)"
    badgeBg: "bg-purple-100 text-purple-700"
    name:
      forward: "阶段 2: 记忆化搜索 (备忘录剪枝)"
      reverse: "阶段 2: 逆向记忆化 (带权后向备忘)"
    desc:
      forward: "使用 memo[i] 缓存从第 i 个旅行日起的最低花费，命中直接 O(1) 返回。"
      reverse: "通过 memo[i] 记录子问题最优解，多路跳转汇聚到同一旅行日时直接读取缓存，消除 3^N 算力爆炸。"
    variants:
      standard:
        variantLabel: "一维备忘录版"
        title:
          forward: "MinCostTickets_Memo_Forward.java"
          reverse: "MinCostTickets_Memo_Reverse.java"
        code:
          forward:
            title: "MinCostTickets_Memo_Forward.java"
            source: |
              class Solution {
                  public int mincostTickets(int[] days, int[] costs) {
                      int[] memo = new int[days.length];
                      Arrays.fill(memo, -1);
                      return f(days, costs, 0, memo);
                  }
                  private int f(int[] days, int[] costs, int i, int[] memo) { // @step:entry
                      if (i >= days.length) return 0; // @step:boundary
                      if (memo[i] != -1) return memo[i]; // @step:cache_hit // 缓存命中剪枝
                      int ans = Integer.MAX_VALUE;
                      int[] duration = {1, 7, 30};
                      for (int k = 0, j = i; k < 3; k++) { // @step:loop_branch
                          while (j < days.length && days[j] < days[i] + duration[k]) j++; // @step:skip_days
                          ans = Math.min(ans, costs[k] + f(days, costs, j, memo)); // @step:recursive_call
                      }
                      return memo[i] = ans; // @step:store_memo // 写入备忘录
                  }
              }
          reverse:
            title: "MinCostTickets_Memo_Reverse.java"
            source: |
              class Solution {
                  public int mincostTickets(int[] days, int[] costs) {
                      int[] memo = new int[days.length];
                      Arrays.fill(memo, -1);
                      return f(days, costs, 0, memo);
                  }
                  private int f(int[] days, int[] costs, int i, int[] memo) { // @step:entry
                      if (i >= days.length) return 0; // @step:boundary
                      if (memo[i] != -1) return memo[i]; // @step:cache_hit // 备忘录命中直接返回
                      int ans = Integer.MAX_VALUE;
                      int[] duration = {1, 7, 30};
                      for (int k = 0, j = i; k < 3; k++) { // @step:loop_branch
                          while (j < days.length && days[j] < days[i] + duration[k]) j++; // @step:skip_days
                          ans = Math.min(ans, costs[k] + f(days, costs, j, memo)); // @step:recursive_call
                      }
                      return memo[i] = ans; // @step:store_memo // 保存并返回最优结果
                  }
              }

  stage-3:
    shortName: "一维DP"
    type: "tabulation-1d"
    timeBadge: "O(N)"
    badgeBg: "bg-emerald-100 text-emerald-700"
    name:
      forward: "阶段 3: 一维动态规划 (正序严格表递推)"
      reverse: "阶段 3: 严格一维DP (自底向上逆向跳跃)"
    desc:
      forward: "开辟长度为 n+1 的 dp 数组，dp[i] 表示完成前 i 个旅行日的最低花费。"
      reverse: "dp[i] 表示从第 i 个旅行日开始完成所有旅行的最低费用，dp[i] = min_{k}(costs[k] + dp[j_k])，从后向前倒序填表。"
    variants:
      standard:
        variantLabel: "一维数组递推版"
        title:
          forward: "MinCostTickets_DP_Forward.java"
          reverse: "MinCostTickets_DP_Reverse.java"
        code:
          forward:
            title: "MinCostTickets_DP_Forward.java"
            source: |
              class Solution {
                  public int mincostTickets(int[] days, int[] costs) {
                      int n = days.length;
                      int[] dp = new int[n + 1]; // @step:init // 初始化一维 DP 表
                      int[] duration = {1, 7, 30};
                      for (int i = n - 1; i >= 0; i--) { // @step:loop_i // 自底向上逆推
                          int ans = Integer.MAX_VALUE;
                          for (int k = 0, j = i; k < 3; k++) { // @step:loop_k // 考察三种通行证
                              while (j < n && days[j] < days[i] + duration[k]) { // @step:skip_days // 寻找跨度落点
                                  j++;
                              }
                              ans = Math.min(ans, costs[k] + dp[j]); // @step:update_ans // 比较方案代价
                          }
                          dp[i] = ans; // @step:transfer // 状态落盘写入 dp[i]
                      }
                      return dp[0]; // @step:return // 返回从首日开始全局最优解
                  }
              }
          reverse:
            title: "MinCostTickets_DP_Reverse.java"
            source: |
              class Solution {
                  public int mincostTickets(int[] days, int[] costs) {
                      int n = days.length;
                      int[] dp = new int[n + 1]; // @step:init // dp[n]=0 作为终点基准
                      int[] duration = {1, 7, 30};
                      for (int i = n - 1; i >= 0; i--) { // @step:loop_i // 自后往前倒序推导
                          int ans = Integer.MAX_VALUE;
                          for (int k = 0, j = i; k < 3; k++) { // @step:loop_k // 1/7/30天方案
                              while (j < n && days[j] < days[i] + duration[k]) { // @step:skip_days // 线性推进找下一个旅行日
                                  j++;
                              }
                              ans = Math.min(ans, costs[k] + dp[j]); // @step:update_ans // 取各方案较小者
                          }
                          dp[i] = ans; // @step:transfer // 状态更新 dp[i] = ans
                      }
                      return dp[0]; // @step:return // dp[0] 即为完成全部行程的最低票价
                  }
              }

  stage-4:
    shortName: "二分优化"
    type: "space-optimized-1d"
    timeBadge: "O(N log N)"
    badgeBg: "bg-amber-100 text-amber-700"
    name:
      forward: "阶段 4: 二分查找跳跃优化 (对数落点加速)"
      reverse: "阶段 4: 二分跳跃加速 (lower_bound 优化)"
    desc:
      forward: "利用 days 数组的严格单调递增特性，通过二分查找将确定下一旅行日由 O(N) 降至 O(log N)。"
      reverse: "由于 days 递增有序，7 天与 30 天通行证的跳跃落点直接二分查找 lower_bound，单步状态转移效率极大提升。"
    variants:
      standard:
        variantLabel: "二分对数优化版"
        title:
          forward: "MinCostTickets_BinarySearch_Forward.java"
          reverse: "MinCostTickets_BinarySearch_Reverse.java"
        code:
          forward:
            title: "MinCostTickets_BinarySearch_Forward.java"
            source: |
              class Solution {
                  public int mincostTickets(int[] days, int[] costs) {
                      int n = days.length;
                      int[] dp = new int[n + 1]; // @step:init
                      int[] duration = {1, 7, 30};
                      for (int i = n - 1; i >= 0; i--) { // @step:loop_i
                          int ans = Integer.MAX_VALUE;
                          for (int k = 0; k < 3; k++) { // @step:loop_k
                              int target = days[i] + duration[k];
                              int j = binarySearch(days, i, n, target); // @step:binary_search // 二分查找落点下标
                              ans = Math.min(ans, costs[k] + dp[j]); // @step:update_ans
                          }
                          dp[i] = ans; // @step:transfer
                      }
                      return dp[0]; // @step:return
                  }
                  private static int binarySearch(int[] days, int l, int r, int target) {
                      int ans = r;
                      while (l < r) {
                          int m = (l + r) / 2;
                          if (days[m] >= target) { ans = m; r = m; }
                          else { l = m + 1; }
                      }
                      return ans;
                  }
              }
          reverse:
            title: "MinCostTickets_BinarySearch_Reverse.java"
            source: |
              class Solution {
                  public int mincostTickets(int[] days, int[] costs) {
                      int n = days.length;
                      int[] dp = new int[n + 1]; // @step:init
                      int[] duration = {1, 7, 30};
                      for (int i = n - 1; i >= 0; i--) { // @step:loop_i // 自底向上逆推
                          int ans = Integer.MAX_VALUE;
                          for (int k = 0; k < 3; k++) { // @step:loop_k
                              int target = days[i] + duration[k];
                              int j = binarySearch(days, i, n, target); // @step:binary_search // 二分对数快速定位 j
                              ans = Math.min(ans, costs[k] + dp[j]); // @step:update_ans
                          }
                          dp[i] = ans; // @step:transfer
                      }
                      return dp[0]; // @step:return
                  }
                  private static int binarySearch(int[] days, int l, int r, int target) {
                      int ans = r;
                      while (l < r) {
                          int m = (l + r) / 2;
                          if (days[m] >= target) { ans = m; r = m; }
                          else { l = m + 1; }
                      }
                      return ans;
                  }
              }
