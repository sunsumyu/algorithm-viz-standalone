# ==============================================================================
# 🏆 [GOLDEN BASELINE MODEL] 黄金基准模型规范
# 本规范为「买卖股票的最佳时机 (Best Time to Buy and Sell Stock, LeetCode 121)」四阶段全演化标准实现。
# 包含：单次买卖决策树递归、记忆化搜索、双状态机二维填表与 O(1) 滚动变量空间压缩。
# ==============================================================================

id: best-time-to-buy-and-sell-stock
name: "买卖股票的最佳时机"
nameEn: "Best Time to Buy and Sell Stock"
defaultStage: "stage-1"
category: "dynamic-programming"
icon: "📈"
difficulty: 1
levelOrder: 13
learningGoal: "理解买卖股票状态机模型基础：持股与未持股状态二元转移、单次买卖的历史最低成本保持"
description: "买卖股票的最佳时机（LeetCode 121）：给定每日股票价格，你只能选择某一天买入，并在未来的某一天卖出。求最大利润。"
defaultParams:
  prices: [7, 1, 5, 3, 6, 4]

problem:
  leetcodeId: 121
  title: "买卖股票的最佳时机"
  difficulty: "简单"
  tags: ["数组", "动态规划"]
  description: "给定一个数组 <code>prices</code> ，它的第 <code>i</code> 个元素 <code>prices[i]</code> 表示一支给定股票第 <code>i</code> 天的价格。<br/><br/>你只能选择 <strong>某一天</strong> 买入这只股票，并选择在 <strong>未来的某一个不同的日子</strong> 卖出该股票。设计一个算法来计算你所能获取的最大利润。<br/><br/>返回你可以从这笔交易中获取的最大利润。如果你不能获取任何利润，返回 <code>0</code> 。"
  examples:
    - input: "prices = [7,1,5,3,6,4]"
      output: "5"
      explanation: "在第 2 天（股票价格 = 1）的时候买入，在第 5 天（股票价格 = 6）的时候卖出，最大利润 = 6-1 = 5 。注意利润不能是 7-1 = 6, 因为卖出价格需要大于买入价格；同时，你不能在买入前卖出股票。"
    - input: "prices = [7,6,4,3,1]"
      output: "0"
      explanation: "在这种情况下, 没有交易完成, 所以最大利润为 0。"
  constraints:
    - "1 <= prices.length <= 10⁵"
    - "0 <= prices[i] <= 10⁴"
  leetcodeUrl: "https://leetcode.cn/problems/best-time-to-buy-and-sell-stock/"

directions:
  forward:
    label: "自顶向下 (按天数顺序推进)"
    branches:
      - name: "keep_or_buy"
        delta: [1, 0]
        label: "保持或买入 (持有)"
        codeVar: "hold"
        arrow: "⬇️"
      - name: "keep_or_sell"
        delta: [1, 1]
        label: "保持或卖出 (未持有)"
        codeVar: "notHold"
        arrow: "↘️"
    combineFormula: "max(hold, notHold)"

  reverse:
    label: "逆推 (倒序)"
    description: "从末尾目标向子问题基底反推"
    startFormula: "末尾状态"
    target: "起始状态"
    branches: []
    combineFormula: "逆向聚合"
stages:
  stage-1:
    shortName: "递归"
    type: "recursion"
    timeBadge: "O(2ⁿ)"
    badgeBg: "bg-slate-100 text-slate-700"
    name:
      forward: "阶段 1: 暴力枚举决策树"
    desc:
      forward: "每天做出买入、卖出或观望的决策。单次交易限制下，未持有股票时可买入，持有股票时可卖出。"
    variants:
      standard:
        variantLabel: "标准递归版"
        title:
          forward: "Stock1_Recursive.java"
        code:
          forward:
            title: "Stock1_Recursive.java"
            source: |
              class Solution {
                  public int maxProfit(int[] prices) { // @step:entry
                      return dfs(prices, 0, 0); // @step:init // @step:return
                  }
                  // status: 0=未持有, 1=持有
                  private int dfs(int[] prices, int day, int status) { // @step:recursion
                      if (day == prices.length) return 0; // @step:boundary
                      if (status == 0) {
                          int keep = dfs(prices, day + 1, 0); // @step:branch_keep
                          int buy = -prices[day] + dfs(prices, day + 1, 1); // @step:branch_buy
                          return Math.max(keep, buy); // @step:combine
                      } else {
                          int keep = dfs(prices, day + 1, 1); // @step:branch_keep
                          int sell = prices[day]; // 单次交易卖出后不再买入 // @step:branch_sell
                          return Math.max(keep, sell); // @step:combine
                      }
                  }
              }

  stage-2:
    shortName: "记忆化"
    type: "memoization"
    timeBadge: "O(n)"
    badgeBg: "bg-purple-100 text-purple-700"
    name:
      forward: "阶段 2: 二维记忆化搜索"
    desc:
      forward: "状态空间仅为 (day, status) 共 2n 个状态，通过 memo[day][status] 数组剪掉重复探查分支。"
    variants:
      array_memo:
        variantLabel: "数组备忘录版"
        title:
          forward: "Stock1_Memo.java"
        code:
          forward:
            title: "Stock1_Memo.java"
            source: |
              class Solution {
                  public int maxProfit(int[] prices) { // @step:entry
                      int[][] memo = new int[prices.length][2]; // @step:init
                      for (int[] row : memo) Arrays.fill(row, -1);
                      return dfs(prices, 0, 0, memo); // @step:return
                  }
                  private int dfs(int[] p, int d, int s, int[][] memo) { // @step:recursion
                      if (d == p.length) return 0; // @step:boundary
                      if (memo[d][s] != -1) return memo[d][s]; // @step:memo // @step:cache_hit
                      if (s == 0) {
                          memo[d][s] = Math.max(dfs(p, d + 1, 0, memo), -p[d] + dfs(p, d + 1, 1, memo)); // @step:transfer
                      } else {
                          memo[d][s] = Math.max(dfs(p, d + 1, 1, memo), p[d]); // @step:transfer
                      }
                      return memo[d][s]; // @step:combine
                  }
              }

  stage-3:
    shortName: "二维DP"
    type: "tabulation-2d"
    timeBadge: "O(n)"
    badgeBg: "bg-blue-100 text-blue-700"
    name:
      forward: "阶段 3: 状态机二维填表"
    desc:
      forward: "dp[i][0] 表示第 i 天持有股票的最大收益；dp[i][1] 表示第 i 天不持有股票的最大收益。"
    variants:
      standard:
        variantLabel: "标准填表版"
        title:
          forward: "Stock1_Table2D.java"
        code:
          forward:
            title: "Stock1_Table2D.java"
            source: |
              class Solution {
                  public int maxProfit(int[] prices) { // @step:entry
                      int n = prices.length;
                      int[][] dp = new int[n][2]; // @step:init
                      dp[0][0] = -prices[0]; // 第 0 天买入 // @step:init_hold
                      dp[0][1] = 0;          // 第 0 天不买 // @step:init_nothold
                      for (int i = 1; i < n; i++) { // @step:loop
                          dp[i][0] = Math.max(dp[i - 1][0], -prices[i]); // @step:transfer_hold
                          dp[i][1] = Math.max(dp[i - 1][1], dp[i - 1][0] + prices[i]); // @step:transfer_nothold
                      }
                      return dp[n - 1][1]; // @step:return
                  }
              }

  stage-4:
    shortName: "空间压缩"
    type: "space-optimization"
    timeBadge: "O(1) 空间"
    badgeBg: "bg-emerald-100 text-emerald-700"
    name:
      forward: "阶段 4: O(1) 滚动双变量"
    desc:
      forward: "每天的状态仅依赖前一天的 hold 与 notHold，直接压缩至两个标量变量，空间降至 O(1)。"
    variants:
      standard:
        variantLabel: "滚动变量版"
        title:
          forward: "Stock1_Optimized.java"
        code:
          forward:
            title: "Stock1_Optimized.java"
            source: |
              class Solution {
                  public int maxProfit(int[] prices) { // @step:entry
                      int hold = -prices[0]; // @step:init_hold // @step:init
                      int notHold = 0;       // @step:init_nothold
                      for (int i = 1; i < prices.length; i++) { // @step:loop
                          hold = Math.max(hold, -prices[i]); // @step:transfer_hold // @step:transfer
                          notHold = Math.max(notHold, hold + prices[i]); // @step:transfer_nothold
                      }
                      return notHold; // @step:return
                  }
              }
