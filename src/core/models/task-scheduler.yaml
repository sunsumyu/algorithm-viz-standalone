# ==============================================================================
# 🏆 [TOP-LEVEL GREEDY MODEL] 任务调度器 顶层领域模型
# 对应：LeetCode 621 / 资源调度与有限冷却间隔专题
# 包含：桶思想贪心排布、冷却槽位填充、最大堆与等待队列模拟对偶
# ==============================================================================

id: task-scheduler
name: 任务调度器
category: greedy
difficulty: medium
tags:
  - 贪心算法
  - 数组
  - 哈希表
  - 计数
  - 排序
  - 堆（优先队列）

description: |
  给你一个用字符数组 tasks 表示的 CPU 需要执行的任务列表。其中每个字母表示一种不同种类的任务。
  任务可以以任意顺序执行，并且每个任务都可以在 1 个单位时间内执行完。
  在任何一个单位时间，CPU 可以执行一个任务，或者处于待命状态。
  然而，两个相同种类的任务之间必须有长度为整数 n 的冷却时间，因此至少有连续 n 个单位时间内 CPU 不能执行该任务。
  你需要计算完成所有任务所需要的最少时间单位数。
  核心策略：
  1. Forward 桶思想贪心策略：统计出现频次最高任务的频次 maxFreq，构建 (maxFreq - 1) 个大小为 (n + 1) 的时间桶，
     最后一行放入所有频次等于 maxFreq 的任务（设为 maxCount 个）。
     最少所需时间为 max(tasks.length, (maxFreq - 1) * (n + 1) + maxCount)。
  2. Reverse 优先队列模拟策略：每轮维护一个大根堆，贪心选择当前剩余频次最高的任务执行，
     若当轮不足 n + 1 个任务且堆未空，则插入待命 (idle) 槽位。

defaultParams:
  tasks: ['A', 'A', 'A', 'B', 'B', 'B']
  n: 2

constraints:
  - 1 <= tasks.length <= 10^4
  - tasks[i] 是大写英文字母
  - 0 <= n <= 100

directions:
  forward:
    name: 桶思想与最高频任务槽位填补 (Bucket Greedy)
    description: 优先由频次最高任务划分框架骨架，其余低频任务填入空闲冷却槽，极值公式直接求得全局最优
  reverse:
    name: 大根堆贪心仿真调度流水线 (PriorityQueue Simulation)
    description: 贪心维护当前可用任务的大根堆，模拟每个时间周期执行最多 n+1 个不同任务的流水线

stages:
  stage-1:
    name: 频次统计与桶框架贪心构建
    description: 统计各任务频次并提取最大频次 maxFreq 与最高频任务种类数 maxCount，确定桶结构
    complexity:
      time: O(N)
      space: O(1)
    code:
      forward:
        language: java
        source: |
          public int leastInterval(char[] tasks, int n) {
              // @step:count 1. 统计各字符出现频次
              int[] counts = new int[26];
              for (char c : tasks) counts[c - 'A']++;
              // @step:max_freq 2. 找到最大频次 maxFreq
              int maxFreq = 0;
              for (int c : counts) maxFreq = Math.max(maxFreq, c);
              // @step:max_count 3. 统计具有最大频次任务的个数 maxCount
              int maxCount = 0;
              for (int c : counts) if (c == maxFreq) maxCount++;
              // @step:calc 4. 桶容量公式计算：(maxFreq - 1) * (n + 1) + maxCount
              int ans = (maxFreq - 1) * (n + 1) + maxCount;
              // @step:done 5. 与任务总长度取最大值作为最终耗时
              return Math.max(tasks.length, ans);
          }
      reverse:
        language: java
        source: |
          public int leastIntervalSim(char[] tasks, int n) {
              // @step:count 逆向模拟统计
              Map<Character, Integer> counts = new HashMap<>();
              for (char c : tasks) counts.put(c, counts.getOrDefault(c, 0) + 1);
              // @step:max_freq 构建大根堆按剩余频次降序
              PriorityQueue<Integer> maxHeap = new PriorityQueue<>(Collections.reverseOrder());
              maxHeap.addAll(counts.values());
              // @step:max_count 逐轮弹出并模拟等待冷却
              int time = 0;
              while (!maxHeap.isEmpty()) {
                  List<Integer> temp = new ArrayList<>();
                  for (int i = 0; i <= n; i++) {
                      if (!maxHeap.isEmpty()) temp.add(maxHeap.poll());
                  }
                  for (int cnt : temp) if (--cnt > 0) maxHeap.offer(cnt);
                  time += maxHeap.isEmpty() ? temp.size() : (n + 1);
              }
              // @step:done 返回模拟耗时
              return time;
          }

  stage-2:
    name: 冷却时间决策树与槽位分支展开
    description: 以时间周期自顶向下展开树形搜索，展示每个时间片选择执行任务或被迫待命的决策分支
    complexity:
      time: O(N)
      space: O(N)
    code:
      forward:
        language: java
        source: |
          // @step:base 递归终止条件
          void dfsSchedule(int round, int maxFreq, int n) {
              // @step:entry 探查第 round 轮桶槽位分配
              if (round == maxFreq) return;
              // @step:branch_task 优先填充高频任务至当前桶槽
              allocateSlot(round, "TASK");
              // @step:branch_idle 剩余空隙补充待命 IDLE
              allocateSlot(round, "IDLE");
          }
      reverse:
        language: java
        source: |
          // 逆向自底向上堆调度验证
          int simulateRounds(PriorityQueue<Integer> pq, int n) {
              if (pq.isEmpty()) return 0;
              return simulateRounds(pq, n) + (n + 1);
          }

  stage-3:
    name: 桶排布状态跟踪矩阵 (Bucket Slot Grid)
    description: 构建 (maxFreq) × (n + 1) 的二维状态矩阵，动态追踪任务如何填充各冷却槽位
    complexity:
      time: O(maxFreq * n)
      space: O(maxFreq * n)
    code:
      forward:
        language: java
        source: |
          // @step:dp_init 初始化桶网格 grid[maxFreq][n + 1]
          char[][] bucket = new char[maxFreq][n + 1];
          // @step:dp_loop 逐个任务在网格中蛇形或列优先填入
          for (int r = 0; r < maxFreq; r++) {
              for (int c = 0; c <= n; c++) {
                  // @step:dp_transfer 槽位赋值与状态落盘
                  bucket[r][c] = getNextAvailableTask();
              }
          }
          // @step:dp_done 网格构建完成，统计有效槽位数
          return countSlots(bucket);
      reverse:
        language: java
        source: |
          // 逆向时间片流水线网格跟踪
          int[][] timeline = new int[totalRounds][n + 1];
          for (int r = 0; r < totalRounds; r++) fillTimeline(timeline, r);

  stage-4:
    name: O(1) 数学空间压缩推演
    description: 仅使用 26 位频次数组与常量变量，彻底舍弃空间模拟直接极速产出结果
    complexity:
      time: O(N)
      space: O(1)
    code:
      forward:
        language: java
        source: |
          // @step:reg_init 仅需固定长度 26 数组
          int[] freq = new int[26];
          for (char c : tasks) freq[c - 'A']++;
          // @step:reg_loop 提取最大频次与计数
          int maxF = 0, count = 0;
          for (int f : freq) if (f > maxF) { maxF = f; count = 1; } else if (f == maxF) count++;
          // @step:reg_done 原地直接返回数学极值
          return Math.max(tasks.length, (maxF - 1) * (n + 1) + count);
      reverse:
        language: java
        source: |
          // 逆向空间压缩
          int[] f = new int[26];
          for (char c : tasks) f[c - 'A']++;
          Arrays.sort(f);
          int maxVal = f[25] - 1;
          int idle = maxVal * n;
          for (int i = 24; i >= 0 && f[i] > 0; i--) idle -= Math.min(f[i], maxVal);
          return idle > 0 ? idle + tasks.length : tasks.length;
