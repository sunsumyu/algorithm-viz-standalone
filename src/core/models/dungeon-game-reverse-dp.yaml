keyPoints:
  title: "🎯 地下城游戏反向 DP 5 步法系统精讲"
  summary: "LeetCode 174 经典困难题。为什么正向 DP 会失败？正向 DP 无法在局部做贪心决策，因为扣血与加血的先后顺序有强后效性。逆向定义则彻底解除后效性！"
  steps:
    - label: "一、状态定义"
      desc: "<code>dp[i][j]</code>：进入房间 <code>(i, j)</code> 时，为了能够救出公主并存活所必需的<strong>最低初始健康点数</strong>（必须 $\\ge 1$）。"
      icon: "🎯"
      badge: "逆向状态"
    - label: "二、状态转移方程"
      desc: "<code>dp[i][j] = max(1, min(dp[i+1][j], dp[i][j+1]) - dungeon[i][j])</code>。下一格所需更小者减去当前格收益，且不能低于 1。"
      icon: "🔄"
      badge: "min 下一步 - 当前格"
    - label: "三、边界与初始化"
      desc: "右下角公主房：<code>dp[m-1][n-1] = max(1, 1 - dungeon[m-1][n-1])</code>；最底行只能向右；最右列只能向下。"
      icon: "🎬"
      badge: "终点基准"
    - label: "四、遍历顺序"
      desc: "自底向上、自右向左逆推遍历（从 <code>m-1</code> 到 <code>0</code>，从 <code>n-1</code> 到 <code>0</code>）。一维压缩时倒序滚动覆盖更新。"
      icon: "🧭"
      badge: "倒序逆推"
    - label: "五、举例推导"
      desc: "以 3x3 样例 [[-2,-3,3],[-5,-10,1],[10,30,-5]] 为例，公主房 (-5) 需 6 血，沿途逆推最终在 (0, 0) 需要 7 点血，沿途血量恒 >= 1。"
      icon: "📊"
      badge: "答案验证"

faqList:
  - question: "为什么正向动态规划无法解决地下城游戏？"
    answer: "如果从起点正推，到达某个房间 (i, j) 存在两个维度的指标：'到达此处的最大剩余血量'和'沿途曾要求的最低初始血量'。两个指标常常冲突（如一条路前期扣血多但后期补血多，另一条路前期平稳但后期无补血），无法单凭一个标量值做出局部最优选择，违背无后效性。而逆向推导只关心'从此处走到终点还需要多少血'，指标单一确定！"
    tag: "后效性分析"
  - question: "为什么转移方程中需要与 1 取 Math.max？"
    answer: "骑士生命值在任何时刻都不能降为 0 或负数，即必须至少为 1。如果某个房间加血很多（如 +30），算得 minNext - 30 可能会是负数甚至 0，但这并不意味着骑士能以 0 血进入房间，进入任何房间前骑士必须活生生地活着（HP >= 1）。"
    tag: "生存约束"
