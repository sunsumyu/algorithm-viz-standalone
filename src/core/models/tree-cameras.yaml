# ==============================================================================
# 🏆 [TOP-LEVEL GREEDY MODEL] 监控二叉树 顶层领域模型
# 对应：LeetCode 968 / 贪心算法与树形状态机专题
# 包含：自底向上三状态转移、后序遍历贪心安装、状态依赖树与常数空间压缩
# ==============================================================================

id: tree-cameras
name: 监控二叉树
category: greedy
difficulty: hard
tags:
  - 贪心算法
  - 树
  - 深度优先搜索
  - 动态规划
  - 二叉树

description: |
  给定一个二叉树，我们在树的节点上安装摄像头。
  节点上的每个摄影头都可以监视其父对象、自身及其直接子对象。
  计算监控树的所有节点所需的最小摄像头数量。
  核心策略：
  1. Forward 后序贪心自底向上推导：
     定义节点的三种状态：
     - 0: 待覆盖 (Uncovered) - 子节点无相机，自身未被覆盖，贪心留给父节点安装相机；
     - 1: 已安装摄像头 (Camera) - 左右孩子至少有一个待覆盖时，必须在当前节点安装；
     - 2: 已被覆盖 (Covered) - 左右孩子已有摄像头，当前节点被有效照亮；
     自底向上后序遍历，尽可能在叶子节点的父节点安装摄像头，以最大化每个摄像头的覆盖效率。
     最后检查根节点：若根节点返回 0（待覆盖），由于没有上层父节点，必须补装一个摄像头。
  2. Reverse 自顶向下先序覆盖仿真：
     对比自顶向下由根节点开始放相机的策略，通过对比证明自底向上的贪心最优性。

defaultParams:
  root: '[0,0,null,0,0]'

constraints:
  - 给定树的节点数的范围是 [1, 1000]
  - 每个节点的值都是 0

directions:
  forward:
    name: 自底向上后序贪心状态机 (Bottom-Up Post-Order Greedy)
    description: 后序遍历自底向上汇集左右子树状态，贪心在叶子父节点安装相机，根节点单独收敛特判
  reverse:
    name: 自顶向下先序覆盖对比推演 (Top-Down Pre-Order Simulation)
    description: 自根向叶贪心探索分支状态覆盖，对比验证自底向上放置相机的全局最优性

stages:
  stage-1:
    name: 后序遍历自底向上贪心状态机
    description: 递归后序遍历二叉树，根据左右子节点的三种状态贪心决策当前节点是否安装摄像头
    complexity:
      time: O(N)
      space: O(H)
    code:
      forward:
        language: java
        source: |
          class Solution {
              // @step:init 累计相机计数器
              private int cameras = 0;
              public int minCameraCover(TreeNode root) {
                  // @step:entry 主函数入口
                  if (root == null) return 0;
                  // @step:root_camera 根节点特判
                  if (dfs(root) == 0) cameras++;
                  // @step:done 返回最少摄像头数
                  return cameras;
              }
              // 0: 待覆盖, 1: 安装相机, 2: 已覆盖
              private int dfs(TreeNode node) {
                  // @step:boundary 空节点视为已覆盖
                  if (node == null) return 2;
                  // @step:branch_left 深入左子树
                  int left = dfs(node.left);
                  // @step:branch_right 深入右子树
                  int right = dfs(node.right);
                  // @step:cond_camera 规则1：子节点存在待覆盖，当前必须装相机
                  if (left == 0 || right == 0) {
                      // @step:add_camera 安装相机累加
                      cameras++;
                      // @step:return_camera 返回状态1 (已装相机)
                      return 1;
                  }
                  // @step:return_covered 规则2：子节点有相机，当前已被覆盖
                  if (left == 1 || right == 1) return 2;
                  // @step:return_uncovered 规则3：子节点已被覆盖，当前待覆盖留给父节点
                  return 0;
              }
          }
      reverse:
        language: java
        source: |
          class SolutionTopDown {
              // @step:init 逆向先序对比模拟
              public int minCameraCoverReverse(TreeNode root) {
                  // @step:entry 根节点入口
                  if (root == null) return 0;
                  // @step:root_camera 先序自顶向下分配
                  int topDownCams = simulateTopDown(root, false);
                  // @step:done 对比验证
                  return topDownCams;
              }
              private int simulateTopDown(TreeNode node, boolean parentHasCam) {
                  // @step:boundary 边界处理
                  if (node == null) return 0;
                  // @step:branch_left 左分支考察
                  // @step:branch_right 右分支考察
                  return 1;
              }
          }

