                    const n = nums.length; // @step:init_n
                    if (n % 2 === 0) return true; // @step:guard_even
                    const memo = Array.from({ length: n }, () => new Array(n).fill(null)); // @step:init_dp
                    function dfs(i, j) { // @step:dfs_entry
                        if (i === j) return nums[i]; // @step:boundary
                        if (memo[i][j] !== null) return memo[i][j]; // @step:cache_hit
                        const chooseLeft = nums[i] - dfs(i + 1, j); // @step:branch_left
                        const chooseRight = nums[j] - dfs(i, j - 1); // @step:branch_right
                        memo[i][j] = Math.max(chooseLeft, chooseRight); // @step:transfer
                        return memo[i][j]; // @step:return
                    }
                    return dfs(0, n - 1) >= 0; // @step:call_dfs
                }

  stage-3:
    shortName: "二维DP"
    type: "tabulation"
    timeBadge: "O(n²)"
    badgeBg: "bg-emerald-100 text-emerald-700"
    name:
      forward: "阶段 3: 严格二维表递推 (上三角区间跨度自底向上填表)"
      reverse: "阶段 3: 逆向依赖寻源填表 (从全区间逆向校验博弈边界)"
    desc:
      forward: "初始化主对角线 dp[i][i] = nums[i]。外层按区间跨度 len 从 2 到 n 递增，内层枚举起点 i 计算终点 j = i + len - 1。dp[i][j] 严格依赖左方单元格 dp[i][j-1] 与下方单元格 dp[i+1][j]。"
      reverse: "从最终全局区间 dp[0][n-1] 逆向追溯上三角矩阵的依赖关系与博弈决策链。"
    variants:
      standard:
        variantLabel: "标准区间DP填表"
        title:
          forward: "PredictTheWinner_Tabulation.java"
          reverse: "PredictTheWinner_Tabulation_Reverse.java"
        code:
          forward:
            title: "PredictTheWinner_Tabulation.java"
            source: |
              class Solution {
                  public boolean predictTheWinner(int[] nums) { // @step:entry
                      int n = nums.length; // @step:init_n
                      if (n % 2 == 0) return true; // @step:guard_even
                      int[][] dp = new int[n][n]; // @step:init_dp
                      for (int i = 0; i < n; i++) dp[i][i] = nums[i]; // @step:init_base
                      for (int len = 2; len <= n; len++) { // @step:loop_len
                          for (int i = 0; i <= n - len; i++) { // @step:loop_i
                              int j = i + len - 1; // @step:calc_j
                              int chooseLeft = nums[i] - dp[i + 1][j]; // @step:branch_left
                              int chooseRight = nums[j] - dp[i][j - 1]; // @step:branch_right
                              dp[i][j] = Math.max(chooseLeft, chooseRight); // @step:transfer
                          }
                      }
                      return dp[0][n - 1] >= 0; // @step:return
                  }
              }
