                function predictTheWinner(nums) { // @step:entry
                    const n = nums.length; // @step:init_n
                    if (n % 2 === 0) return true; // @step:guard_even
                    const dp = [...nums]; // @step:init_dp
                    for (let i = n - 2; i >= 0; i--) { // @step:loop_i
                        for (let j = i + 1; j < n; j++) { // @step:calc_j
                            const chooseLeft = nums[i] - dp[j]; // @step:branch_left
                            const chooseRight = nums[j] - dp[j - 1]; // @step:branch_right
