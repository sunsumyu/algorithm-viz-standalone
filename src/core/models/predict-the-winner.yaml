                    bool predictTheWinner(vector<int>& nums) { // @step:entry
                        int n = nums.size(); // @step:init_n
                        if (n % 2 == 0) return true; // @step:guard_even
                        vector<int> dp(nums); // @step:init_dp
                        for (int i = n - 2; i >= 0; i--) { // @step:loop_i
                            for (int j = i + 1; j < n; j++) { // @step:calc_j
                                int chooseLeft = nums[i] - dp[j]; // @step:branch_left
                                int chooseRight = nums[j] - dp[j - 1]; // @step:branch_right
                                dp[j] = max(chooseLeft, chooseRight); // @step:transfer
                            }
                        }
                        return dp[n - 1] >= 0; // @step:return
                    }
                };
