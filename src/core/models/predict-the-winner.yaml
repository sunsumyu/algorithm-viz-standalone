                        int chooseLeft = nums[i] - dfs(nums, memo, i + 1, j); // @step:branch_left
                        int chooseRight = nums[j] - dfs(nums, memo, i, j - 1); // @step:branch_right
                        memo[i][j] = Math.max(chooseLeft, chooseRight); // @step:transfer
                        return memo[i][j]; // @step:return
                    }
                }
              cpp: |
                class Solution {
                public:
                    bool predictTheWinner(vector<int>& nums) { // @step:entry
                        int n = nums.size(); // @step:init_n
                        if (n % 2 == 0) return true; // @step:guard_even
                        vector<vector<int>> memo(n, vector<int>(n, -1)); // @step:init_dp
                        return dfs(nums, memo, 0, n - 1) >= 0; // @step:call_dfs
                    }
                    int dfs(vector<int>& nums, vector<vector<int>>& memo, int i, int j) { // @step:dfs_entry
                        if (i == j) return nums[i]; // @step:boundary
                        if (memo[i][j] != -1) return memo[i][j]; // @step:cache_hit
                        int chooseLeft = nums[i] - dfs(nums, memo, i + 1, j); // @step:branch_left
                        int chooseRight = nums[j] - dfs(nums, memo, i, j - 1); // @step:branch_right
                        return memo[i][j] = max(chooseLeft, chooseRight); // @step:transfer
                    }
                };
              python: |
                class Solution:
                    def predictTheWinner(self, nums: List[int]) -> bool: # @step:entry
                        n = len(nums) # @step:init_n
                        if n % 2 == 0: return True # @step:guard_even
                        memo = {} # @step:init_dp
                        def dfs(i: int, j: int) -> int: # @step:dfs_entry
                            if i == j: return nums[i] # @step:boundary
                            if (i, j) in memo: return memo[(i, j)] # @step:cache_hit
                            choose_left = nums[i] - dfs(i + 1, j) # @step:branch_left
                            choose_right = nums[j] - dfs(i, j - 1) # @step:branch_right
