  stage-2:
    shortName: "记忆化"
    type: "memoization"
    timeBadge: "O(n²)"
    badgeBg: "bg-blue-100 text-blue-700"
    name:
      forward: "阶段 2: 记忆化搜索剪枝 (备忘录消除重叠子问题)"
      reverse: "阶段 2: 记忆化逆向回溯 (带缓存的寻源推演)"
    desc:
      forward: "引入 memo[i][j] 备忘录缓存区间 [i, j] 的净胜分。先查表，若已计算则直接 O(1) 返回，未计算则递归求解并存入缓存，时间复杂度从指数级下降至 O(n²)。"
      reverse: "逆向推演记忆化树剪枝过程与命中缓存的高效返回。"
    variants:
      standard:
        variantLabel: "备忘录搜索实现"
        title:
          forward: "PredictTheWinner_Memo.java"
          reverse: "PredictTheWinner_Memo_Reverse.java"
        code:
          forward:
            title: "PredictTheWinner_Memo.java"
            source: |
              class Solution {
                  public boolean predictTheWinner(int[] nums) { // @step:entry
                      int n = nums.length; // @step:init_n
                      if (n % 2 == 0) return true; // @step:guard_even
                      Integer[][] memo = new Integer[n][n]; // @step:init_dp
                      return dfs(nums, memo, 0, n - 1) >= 0; // @step:call_dfs
                  }
                  private int dfs(int[] nums, Integer[][] memo, int i, int j) { // @step:dfs_entry
                      if (i == j) return nums[i]; // @step:boundary
                      if (memo[i][j] != null) return memo[i][j]; // @step:cache_hit
                      int chooseLeft = nums[i] - dfs(nums, memo, i + 1, j); // @step:branch_left
                      int chooseRight = nums[j] - dfs(nums, memo, i, j - 1); // @step:branch_right
                      memo[i][j] = Math.max(chooseLeft, chooseRight); // @step:transfer
                      return memo[i][j]; // @step:return
                  }
              }
            languages:
              java: |
