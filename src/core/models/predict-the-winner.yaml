  stage-4:
    shortName: "空间压缩"
    type: "optimization"
    timeBadge: "O(n)"
    badgeBg: "bg-purple-100 text-purple-700"
    name:
      forward: "阶段 4: 一维滚动数组空间压缩 (O(n) 空间复杂度极致优化)"
      reverse: "阶段 4: 空间压缩逆向推演"
    desc:
      forward: "观察状态转移方程，dp[i][j] 只依赖同一行的前一状态 dp[i][j-1] 与下一行的状态 dp[i+1][j]。外层逆序从 i = n - 2 到 0，内层正序 j 从 i + 1 到 n - 1，即可在一维数组 dp[j] 上原地更新，空间从 O(n²) 压缩至 O(n)。"
      reverse: "逆向分析一维滚动数组的覆盖时序与空间压缩等价性。"
    variants:
      standard:
        variantLabel: "一维空间压缩实现"
        title:
          forward: "PredictTheWinner_SpaceOptimized.java"
          reverse: "PredictTheWinner_SpaceOptimized_Reverse.java"
        code:
          forward:
            title: "PredictTheWinner_SpaceOptimized.java"
            source: |
              class Solution {
                  public boolean predictTheWinner(int[] nums) { // @step:entry
                      int n = nums.length; // @step:init_n
                      if (n % 2 == 0) return true; // @step:guard_even
                      int[] dp = new int[n]; // @step:init_dp
                      for (int i = 0; i < n; i++) dp[i] = nums[i]; // @step:init_base
                      for (int i = n - 2; i >= 0; i--) { // @step:loop_i
                          for (int j = i + 1; j < n; j++) { // @step:calc_j
                              int chooseLeft = nums[i] - dp[j]; // @step:branch_left
                              int chooseRight = nums[j] - dp[j - 1]; // @step:branch_right
                              dp[j] = Math.max(chooseLeft, chooseRight); // @step:transfer
                          }
                      }
                      return dp[n - 1] >= 0; // @step:return
                  }
              }
            languages:
              java: |
