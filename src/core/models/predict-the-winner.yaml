# ==============================================================================
# 🏆 [TOP-LEVEL ALGORITHM MODEL] 顶层抽象模型规范
# 预测赢家 (Predict the Winner / LeetCode 486 / 左程云 Class 076 Code02)
# 核心：博弈论零和对抗与区间 DP——相对净胜分建模 dp[i][j] = max(nums[i]-dp[i+1][j], nums[j]-dp[i][j-1])
# 四阶段全演化标准参考模型 (Stage 1-4, forward/reverse 双向支持)
# ==============================================================================

id: predict-the-winner
name: "预测赢家"
nameEn: "Predict the Winner"
defaultStage: "stage-3"
category: "dynamic-programming"
icon: "🃏"
difficulty: 2
levelOrder: 486
learningGoal: "深刻掌握极小化极大零和博弈思维，通过相对净胜分对称建模将博弈对抗转化为标准区间 DP 上三角递推"
description: "左程云算法通关课 Class 076 Code02：LeetCode 486 预测赢家，零和博弈区间 DP 经典。dp[i][j] 表示面对区间 [i, j] 纸牌时当前行动者相对于对手的最大净胜分。"
defaultParams:
  nums: [1, 5, 2]

problem:
  leetcodeId: 486
  title: "预测赢家 (LeetCode 486 / Class 076 Code02)"
  difficulty: "中等"
  tags: ["动态规划", "区间 DP", "博弈论", "极小化极大"]
  description: "给你一个整数数组 <code>nums</code> 。玩家 1 和玩家 2 基于这个数组设计了一个游戏。<br/><br/>玩家 1 和玩家 2 轮流进行，玩家 1 先手。开始时，两个玩家的得分均为 0 。每个回合，玩家只能从数组的开头或结尾拿走一个数，并将该数的值加到自己的得分中。这一过程持续到没有数字可选。<br/><br/>如果玩家 1 的最终得分大于或等于玩家 2 的总得分，则玩家 1 获胜。判断在双方均采取最优策略的情况下，玩家 1 是否能成为赢家。"
  examples:
    - input: "nums = [1, 5, 2]"
      output: "false"
      explanation: "玩家 1 只能选 1 或 2。<br/>若玩家 1 选 1，数组剩 [5, 2]，玩家 2 选 5 得 5 分，玩家 1 再选 2 得 2 分，最终玩家 1 得 3 分，玩家 2 得 5 分，玩家 1 输。<br/>若玩家 1 选 2，数组剩 [1, 5]，玩家 2 选 5 得 5 分，玩家 1 再选 1 得 1 分，最终玩家 1 得 3 分，玩家 2 得 5 分，玩家 1 输。因此返回 false。"
    - input: "nums = [1, 5, 233, 7]"
      output: "true"
      explanation: "玩家 1 一开始选择 1。玩家 2 只能从 5 和 7 中选。无论选哪个，玩家 1 随后都能拿到 233，稳操胜券。"
  constraints:
    - "1 <= nums.length <= 20"
    - "0 <= nums[i] <= 10^7"
  leetcodeUrl: "https://leetcode.cn/problems/predict-the-winner/"

directions:
  forward:
    label: "区间跨度顺推 (len=2..n 上三角自底向上递推)"
    branches:
      - name: "choose_left"
        label: "取左端牌 nums[i]"
        formula: "nums[i] - dp[i + 1][j]"
      - name: "choose_right"
        label: "取右端牌 nums[j]"
        formula: "nums[j] - dp[i][j - 1]"
    combineFormula: "max(nums[i] - dp[i + 1][j], nums[j] - dp[i][j - 1])"
  reverse:
    label: "全局区间逆推分解 (从全局 [0, n-1] 逆向寻源)"
    description: "从完整区间 [0, n-1] 出发，逆向展示双方博弈分支与子区间净胜分依赖"
    startFormula: "dp[0][n - 1]"
    target: "dp[i][i] = nums[i]"
    branches:
      - name: "trace_branches"
        label: "逆向博弈分支追溯"
        formula: "nums[i] - dp[i+1][j] vs nums[j] - dp[i][j-1]"
    combineFormula: "逆向博弈最优分支追溯"

stages:
  stage-1:
    shortName: "递归"
    type: "recursion"
    timeBadge: "O(2ⁿ)"
    badgeBg: "bg-slate-100 text-slate-700"
    name:
      forward: "阶段 1: 暴力博弈树展开 (极小化极大相对净胜分)"
      reverse: "阶段 1: 暴力递归逆推寻源 (博弈决策树逆向展开)"
    desc:
      forward: "相对净胜分建模：每次行动者选择左端或右端牌，获得当前牌面值，并减去对手在剩余区间的最优相对净胜分。递归树展示指数级分支展开与重叠子问题。"
      reverse: "从全局区间 [0, n-1] 逆向推导，展示博弈决策树的分支演变。"
    variants:
      standard:
        variantLabel: "标准递归实现"
        title:
          forward: "PredictTheWinner_Recursive.java"
          reverse: "PredictTheWinner_Recursive_Reverse.java"
        code:
          forward:
            title: "PredictTheWinner_Recursive.java"
            source: |
              class Solution {
                  public boolean predictTheWinner(int[] nums) { // @step:entry
                      int n = nums.length; // @step:init_n
                      if (n % 2 == 0) return true; // @step:guard_even
                      return dfs(nums, 0, n - 1) >= 0; // @step:return
                  }
                  private int dfs(int[] nums, int i, int j) { // @step:dfs_entry
                      if (i == j) return nums[i]; // @step:boundary
                      int chooseLeft = nums[i] - dfs(nums, i + 1, j); // @step:branch_left
                      int chooseRight = nums[j] - dfs(nums, i, j - 1); // @step:branch_right
                      return Math.max(chooseLeft, chooseRight); // @step:transfer
                  }
              }
