# ==============================================================================
# 🏆 [GOLDEN BASELINE MODEL] 黄金基准模型规范
# 本规范为「打家劫舍 (House Robber, LeetCode 198)」四阶段全演化标准实现。
# 包含：自顶向下选优递归、记忆化剪枝、自底向上 1D 填表与 O(1) 滚动双变量。
# ==============================================================================

id: house-robber
name: "打家劫舍"
nameEn: "House Robber"
defaultStage: "stage-1"
category: "dynamic-programming"
icon: "🏠"
difficulty: 2
levelOrder: 11
learningGoal: "掌握间隔互斥状态机：偷与不偷的决策分支、重叠子问题剪枝与 O(1) 滚动变量压缩"
description: "打家劫舍（LeetCode 198）：小偷不能偷窃相邻房屋。在不触动报警的前提下，计算能偷窃到的最高金额。"
defaultParams:
  nums: [2, 7, 9, 3, 1]

problem:
  leetcodeId: 198
  title: "打家劫舍"
  difficulty: "中等"
  tags: ["数组", "动态规划"]
  description: "你是一个专业的小偷，计划偷窃沿街的房屋。每间房内都藏有一定的现金，影响你偷窃的唯一制约因素就是相邻的房屋装有相互连通的防盗系统，<strong>如果两间相邻的房屋在同一晚上被小偷闯入，系统会自动报警</strong>。<br/><br/>给定一个代表每个房屋存放金额的非负整数数组，计算你 <strong>不触动警报装置的情况下</strong> ，一夜之内能够偷窃到的最高金额。"
  examples:
    - input: "nums = [1,2,3,1]"
      output: "4"
      explanation: "偷窃 1 号房屋 (金额 = 1) ，然后偷窃 3 号房屋 (金额 = 3)。最高金额 = 1 + 3 = 4 。"
    - input: "nums = [2,7,9,3,1]"
      output: "12"
      explanation: "偷窃 1 号房屋 (金额 = 2), 偷窃 3 号房屋 (金额 = 9)，接着偷窃 5 号房屋 (金额 = 1)。最高金额 = 2 + 9 + 1 = 12 。"
  constraints:
    - "1 <= nums.length <= 100"
    - "0 <= nums[i] <= 400"
  leetcodeUrl: "https://leetcode.cn/problems/house-robber/"

directions:
  forward:
    label: "自顶向下 (从左向右决策)"
    branches:
      - name: "not_rob"
        delta: [1, 0]
        label: "不偷当前房 -> rob(i+1)"
        codeVar: "not_rob"
        arrow: "⬇️"
      - name: "rob"
        delta: [2, 0]
        label: "偷当前房 -> nums[i] + rob(i+2)"
        codeVar: "do_rob"
        arrow: "↘️"
    combineFormula: "max(not_rob, do_rob)"

stages:
  stage-1:
    shortName: "递归"
    type: "recursion"
    timeBadge: "O(2ⁿ)"
    badgeBg: "bg-slate-100 text-slate-700"
    name:
      forward: "阶段 1: 朴素递归 (选与不选决策树展开)"
    desc:
      forward: "对每间房屋分化两个分支：偷当前房（跳过下间房）或不偷当前房（可探查下间房）。递归树指数级膨胀，产生大量重叠计算。"
    variants:
      standard:
        variantLabel: "标准递归版"
        title:
          forward: "HouseRobber_Recursive.java"
        code:
          forward:
            title: "HouseRobber_Recursive.java"
            source: |
              class Solution {
                  public int rob(int[] nums) {
                      return dfs(nums, 0); // @step:entry
                  }
                  private int dfs(int[] nums, int i) { // @step:recursion
                      if (i >= nums.length) return 0; // @step:boundary
                      int notRob = dfs(nums, i + 1); // @step:branch_left
                      int doRob = nums[i] + dfs(nums, i + 2); // @step:branch_right
                      return Math.max(notRob, doRob); // @step:combine // @step:return
                  }
              }

  stage-2:
    shortName: "记忆化"
    type: "memoization"
    timeBadge: "O(n)"
    badgeBg: "bg-purple-100 text-purple-700"
    name:
      forward: "阶段 2: 记忆化搜索 (消除重叠子问题)"
    desc:
      forward: "引入 memo 数组记录从第 i 间房屋开始的最大收益，已被探查过的房屋直接 O(1) 剪枝返回，将指数树剪为单链。"
    variants:
      array_memo:
        variantLabel: "一维备忘录版"
        title:
          forward: "HouseRobber_Memo.java"
        code:
          forward:
            title: "HouseRobber_Memo.java"
            source: |
              class Solution {
                  public int rob(int[] nums) {
                      int[] memo = new int[nums.length];
                      Arrays.fill(memo, -1);
                      return dfs(nums, 0, memo); // @step:entry
                  }
                  private int dfs(int[] nums, int i, int[] memo) { // @step:recursion
                      if (i >= nums.length) return 0; // @step:boundary
                      if (memo[i] != -1) return memo[i]; // @step:memo // @step:cache_hit
                      int notRob = dfs(nums, i + 1, memo); // @step:branch_left
                      int doRob = nums[i] + dfs(nums, i + 2, memo); // @step:branch_right
                      return memo[i] = Math.max(notRob, doRob); // @step:combine // @step:return
                  }
              }

  stage-3:
    shortName: "递推DP"
    type: "tabulation-2d"
    timeBadge: "O(n)"
    badgeBg: "bg-emerald-100 text-emerald-700"
    name:
      forward: "阶段 3: 自底向上递推填表 (1D Tabulation)"
    desc:
      forward: "定义 dp[i] 为前 i 间房屋能偷窃的最大金额，按状态转移 dp[i] = max(dp[i-1], dp[i-2] + nums[i]) 自左向右线性填表。"
    variants:
      standard:
        variantLabel: "数组填表版"
        title:
          forward: "HouseRobber_DP.java"
        code:
          forward:
            title: "HouseRobber_DP.java"
            source: |
              class Solution {
                  public int rob(int[] nums) {
                      int n = nums.length;
                      if (n == 1) return nums[0];
                      int[] dp = new int[n]; // @step:init
                      dp[0] = nums[0]; // @step:init_val
                      dp[1] = Math.max(nums[0], nums[1]);
                      for (int i = 2; i < n; i++) { // @step:loop
                          dp[i] = Math.max(dp[i - 1], dp[i - 2] + nums[i]); // @step:transfer
                      }
                      return dp[n - 1]; // @step:return
                  }
              }

  stage-4:
    shortName: "空间优化"
    type: "space-optimized"
    timeBadge: "O(1) 空间"
    badgeBg: "bg-amber-100 text-amber-700"
    name:
      forward: "阶段 4: 空间压缩 (O(1) 双变量滚动)"
    desc:
      forward: "发现 dp[i] 仅依赖前两项状态 dp[i-1] 与 dp[i-2]，维护 prev1 与 prev2 两个变量交替向前滚动，空间降至 O(1)。"
    variants:
      standard:
        variantLabel: "滚动变量版"
        title:
          forward: "HouseRobber_Rolling.java"
        code:
          forward:
            title: "HouseRobber_Rolling.java"
            source: |
              class Solution {
                  public int rob(int[] nums) {
                      int prev2 = 0; // @step:init
                      int prev1 = 0;
                      for (int x : nums) { // @step:loop
                          int cur = Math.max(prev1, prev2 + x); // @step:transfer
                          prev2 = prev1;
                          prev1 = cur;
                      }
                      return prev1; // @step:return
                  }
              }
