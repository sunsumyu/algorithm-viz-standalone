# ==============================================================================
# 常见面试高频问题 (FAQ List)
# ==============================================================================
faqList:
  - question: "为什么朴素递归的时间复杂度是 O(2ⁿ)？"
    answer: "每个递归节点都会分裂出 2 个子递归分支，整棵递归树的高度为 n，总节点数为 2⁰ + 2¹ + ... + 2ⁿ ≈ O(2ⁿ) 指数级爆炸。"
    tag: "复杂度分析"
  - question: "记忆化搜索与动态规划有什么本质区别与联系？"
    answer: "两者都通过消除重叠子问题将复杂度降到 O(n)。记忆化搜索是自顶向下（递归+备忘录缓存），而动态规划是自底向上（迭代填表，无递归栈开销）。"
    tag: "解法对比"
