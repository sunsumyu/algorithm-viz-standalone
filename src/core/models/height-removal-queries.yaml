# ==============================================================================
# 🏆 [TOP-LEVEL TREE DP MODEL] 移除子树后的二叉树高度 顶层领域模型
# 对应：LeetCode 2458 / 左程云算法讲解 079 Code05
# 包含：DFN 序区间打平、子树连续映射 [dfn, dfn+size-1]、前后缀极值 O(1) 查询
# ==============================================================================

id: height-removal-queries
name: 移除子树后的二叉树高度 (LeetCode 2458)
category: dynamic-programming
difficulty: hard
tags:
  - 树型 DP
  - 动态规划
  - 树
  - 深度优先搜索
  - DFN序
  - 前后缀极值

description: |
  LeetCode 2458 · 左程云算法通关课第 079 讲 树型 DP（下）Code05：移除子树后的二叉树高度。
  给你一棵包含 n 个节点的二叉树，节点编号 1..n，互不相同。
  另给你一个长度为 m 的数组 queries，每次查询独立移除以 queries[i] 为根的子树后整棵树的最大高度。
  
  核心 DFN 序打平与前后缀极值模型 (DFN Flattening with Prefix-Suffix Max):
  1. DFN 序连续性定理：以节点 u 为根的子树，在二叉树先序遍历时间戳（DFN 序）中必定占据一段连续区间：
     [dfn[u], dfn[u] + size[u] - 1]。
  2. 剔除子树后的剩余空间：剔除该区间后，整棵树剩余的所有节点恰好被分割为两段：
     左侧前缀区间 [1, dfn[u] - 1] 和 右侧后缀区间 [dfn[u] + size[u], dfnCnt]。
  3. 前后缀极值预处理：
     - maxLeft[i] = max(maxLeft[i - 1], deep[i])
     - maxRight[i] = max(maxRight[i + 1], deep[i])
  4. O(1) 极速查询响应：
     ans[k] = max(maxLeft[dfn[u] - 1], maxRight[dfn[u] + size[u]])。

defaultParams:
  n: 6
  queries: [4]
  root: [1, 3, 4, 2, null, 6, 5]

constraints:
  - 2 <= n <= 10^5（教学演示推荐 6~10）
  - 1 <= Node.val <= n
  - 1 <= queries.length <= min(n, 10^4)
  - queries[i] != root.val

directions:
  forward:
    name: DFN 序打平与前后缀极值 (DFN Flattening with Pre/Suffix Max)
    description: 先序遍历记录 DFN 序与子树大小，预处理前后缀最大深度，O(1) 回答单次子树移除询问
  reverse:
    name: 暴力排除重测对比 (Brute-Force Exclusion Verification)
    description: 每次询问临时断开子树边并重新遍历树高度，对比验证 DFN 区间打平与前后缀极值的 O(1) 优越性

stages:
  stage-1:
    name: 先序 DFN 序构建与前后缀极值预处理
    description: 先序遍历获取每个节点的 dfn、深度 deep 与子树大小 size，预处理 maxLeft 与 maxRight 极值数组
    complexity:
      time: O(N + M)
      space: O(N)
    code:
      forward:
        language: java
        source: |
          class Solution {
              private int dfnCnt = 0;
              private int[] dfn = new int[100005];
              private int[] deep = new int[100005];
              private int[] size = new int[100005];
              private int[] maxLeft = new int[100005];
              private int[] maxRight = new int[100005];
              public int[] treeQueries(TreeNode root, int[] queries) { // @step:entry
                  dfs(root, 0); // @step:call_dfs
                  maxLeft[1] = deep[1]; // @step:init_maxleft
                  for (int i = 2; i <= dfnCnt; i++) maxLeft[i] = Math.max(maxLeft[i - 1], deep[i]); // @step:calc_maxleft
                  maxRight[dfnCnt] = deep[dfnCnt]; // @step:init_maxright
                  for (int i = dfnCnt - 1; i >= 1; i--) maxRight[i] = Math.max(maxRight[i + 1], deep[i]); // @step:calc_maxright
                  int[] ans = new int[queries.length]; // @step:init_ans
                  for (int k = 0; k < queries.length; k++) { // @step:loop_queries
                      int i = dfn[queries[k]]; // @step:get_dfn
                      ans[k] = Math.max(maxLeft[i - 1], maxRight[i + size[i]]); // @step:calc_ans
                  }
                  return ans; // @step:return
              }
              private void dfs(TreeNode node, int d) { // @step:dfs_entry
                  if (node == null) return; // @step:dfs_null
                  int i = ++dfnCnt; // @step:dfn_inc
                  dfn[node.val] = i; deep[i] = d; size[i] = 1; // @step:record_dfn
                  if (node.left != null) { dfs(node.left, d + 1); size[i] += size[dfn[node.left.val]]; } // @step:dfs_left
                  if (node.right != null) { dfs(node.right, d + 1); size[i] += size[dfn[node.right.val]]; } // @step:dfs_right
              }
          }
      reverse:
        language: java
        source: |
          class SolutionTopDown {
              public int[] treeQueriesReverse(TreeNode root, int[] queries) { // @step:entry
                  int[] ans = new int[queries.length]; // @step:call_dfs
                  for (int k = 0; k < queries.length; k++) { // @step:init_ans
                      ans[k] = calcHeightExcluding(root, queries[k], 0); // @step:calc_ans
                  }
                  return ans; // @step:return
              }
              private int calcHeightExcluding(TreeNode node, int removed, int d) { // @step:dfs_entry
                  if (node == null || node.val == removed) return d - 1; // @step:dfs_null
                  return Math.max(calcHeightExcluding(node.left, removed, d + 1), // @step:dfs_left
                                  calcHeightExcluding(node.right, removed, d + 1)); // @step:dfs_right
              }
          }

