# ==============================================================================
# 🏆 [TOP-LEVEL GREEDY MODEL] 无重叠区间 顶层领域模型
# 对应：LeetCode 435 / 经典贪心算法专题
# 包含：按端点排序、贪心消除右界更大区间、记忆化搜索、区间 DP 与 O(1) 优化
# ==============================================================================

id: non-overlapping
name: "无重叠区间"
nameEn: "Non-overlapping Intervals"
category: "greedy"
icon: "✂️"
difficulty: 2
levelOrder: 16
learningGoal: "掌握区间调度经典贪心：相交时贪心移除右界较大区间，为后续留出最多相容裕度"
description: "给定一个区间的集合 intervals，其中 intervals[i] = [starti, endi]。返回需要移除区间的最小数量，使剩余区间互不重叠。"
defaultParams:
  intervals: "[[1, 2], [2, 3], [3, 4], [1, 3]]"

problem:
  title: "无重叠区间 (Non-overlapping Intervals)"
  difficulty: "中等"
  tags: ["贪心", "数组", "动态规划", "排序", "LeetCode 435"]
  description: "给定一个区间的集合 <code>intervals</code> ，其中 <code>intervals[i] = [starti, endi]</code> 。返回 <em>需要移除区间的最小数量，使剩余区间互不重叠</em> 。"
  examples:
    - input: "intervals = [[1,2],[2,3],[3,4],[1,3]]"
      output: "1"
      explanation: "移除 [1,3] 后，剩下的区间没有重叠。"
    - input: "intervals = [[1,2],[1,2],[1,2]]"
      output: "2"
      explanation: "你需要移除两个 [1,2] 来使剩下的区间没有重叠。"
    - input: "intervals = [[1,2],[2,3]]"
      output: "0"
      explanation: "你不需要移除任何区间，因为它们已经是无重叠的了。"
  constraints:
    - "1 <= intervals.length <= 10^5"
    - "intervals[i].length == 2"
    - "-5 * 10^4 <= starti < endi <= 5 * 10^4"

directions:
  forward:
    label: "左端点升序 (Forward Scan)"
    start: [0, 0]
    target: [0, 4]
    branches:
      - name: "keep"
        label: "相容保留"
      - name: "remove"
        label: "冲突剔除"

  reverse:
    label: "左端点降序 (Reverse Scan)"
    description: "逆向扫描区间端点"
    startFormula: "最右区间"
    target: "最左区间"
    branches: []

stages:
  stage-1:
    shortName: "贪心"
    type: "greedy"
    timeBadge: "O(n log n)"
    badgeBg: "bg-emerald-100 text-emerald-700"
    name: "无重叠区间 (贪心最小移除)"
    desc: "按左端点升序排序，遍历时若发生重叠则贪心移除右界较大者，累计移除数"
    card2Title: "贪心消除决策看板"
    card2Desc: "实时监控当前区间、保留边界、累计移除数以及相容状态。"
    code:
      forward:
        title: "EraseOverlapIntervals.java"
        source: |
          public int eraseOverlapIntervals(int[][] intervals) {
              if (intervals.length == 0) return 0; // @step:entry
              Arrays.sort(intervals, (a, b) -> Integer.compare(a[0], b[0])); // @step:sort
              int count = 0; // @step:init
              for (int i = 1; i < intervals.length; i++) {
                  if (intervals[i][0] < intervals[i - 1][1]) { // @step:check
                      count++; // @step:remove
                      intervals[i][1] = Math.min(intervals[i - 1][1], intervals[i][1]); // @step:overlap
                  } else {
                      // 相容保留 // @step:keep
                  }
              }
              return count; // @step:done
          }
      reverse:
        title: "EraseOverlapIntervals_Reverse.java"
        source: |
          public int eraseOverlapIntervals(int[][] intervals) {
              if (intervals.length == 0) return 0; // @step:entry
              Arrays.sort(intervals, (a, b) -> Integer.compare(b[0], a[0])); // @step:sort
              int count = 0; // @step:init
              for (int i = 1; i < intervals.length; i++) {
                  if (intervals[i][1] > intervals[i - 1][0]) {
                      count++; // @step:remove
                      intervals[i][0] = Math.max(intervals[i - 1][0], intervals[i][0]);
                  } else {
                      // 相容保留 // @step:keep
                  }
              }
              return count; // @step:done
          }

  stage-2:
    shortName: "记忆化"
    type: "memoization"
    timeBadge: "O(n²)"
    badgeBg: "bg-purple-100 text-purple-700"
    name: "无重叠区间 (搜索依赖树)"
    desc: "以 dfs(i, lastEnd) 探索选与不选，记忆化剪枝达到等价最优"
    card2Title: "搜索树展开看板"
    card2Desc: "展示分支选择与冲突剪枝。"
    code:
      forward:
        title: "EraseOverlapIntervals_Memo.java"
        source: |
          public int eraseOverlapIntervals(int[][] intervals) {
              Arrays.sort(intervals, (a, b) -> Integer.compare(a[0], b[0])); // @step:entry
              return intervals.length - dfs(intervals, 0, -1, memo); // @step:branch_choose
          }
          private int dfs(int[][] intervals, int i, int prev, Map<String, Integer> memo) {
              if (i >= intervals.length) return 0; // @step:boundary
              if (memo.containsKey(key)) return memo.get(key); // @step:memo_hit
              int taken = 0;
              if (prev == -1 || intervals[i][0] >= intervals[prev][1]) {
                  taken = 1 + dfs(intervals, i + 1, i, memo);
              }
              int notTaken = dfs(intervals, i + 1, prev, memo);
              return Math.max(taken, notTaken); // @step:done
          }

  stage-3:
    shortName: "DP 填表"
    type: "dp"
    timeBadge: "O(n²)"
    badgeBg: "bg-blue-100 text-blue-700"
    name: "无重叠区间 (区间 LIS 动态规划)"
    desc: "转化求最大互斥区间数量 dp[i]，最终移除数 = n - max(dp)"
    card2Title: "区间 DP 填表格子"
    card2Desc: "dp[i] 表示以区间 i 结尾的最长相容子序列容量。"
    code:
      forward:
        title: "EraseOverlapIntervals_DP.java"
        source: |
          public int eraseOverlapIntervals(int[][] intervals) {
              int n = intervals.length; // @step:entry
              int[] dp = new int[n];
              Arrays.fill(dp, 1);
              int max = 1;
              for (int i = 1; i < n; i++) {
                  for (int j = 0; j < i; j++) {
                      if (intervals[j][1] <= intervals[i][0]) {
                          dp[i] = Math.max(dp[i], dp[j] + 1); // @step:transfer
                      }
                  }
                  max = Math.max(max, dp[i]);
              }
              return n - max; // @step:done
          }

  stage-4:
    shortName: "空间优化"
    type: "optimized"
    timeBadge: "O(1)"
    badgeBg: "bg-amber-100 text-amber-700"
    name: "无重叠区间 (原地单变量收敛)"
    desc: "单变量追踪最近确认的相容右界，达到严格 O(1) 空间占用"
    card2Title: "极致空间看板"
    card2Desc: "原地相交消除，极致轻量运行。"
    code:
      forward:
        title: "EraseOverlapIntervals_Optimized.java"
        source: |
          public int eraseOverlapIntervals(int[][] intervals) {
              Arrays.sort(intervals, (a, b) -> Integer.compare(a[0], b[0])); // @step:entry
              int count = 0, prevEnd = intervals[0][1]; // @step:init
              for (int i = 1; i < intervals.length; i++) {
                  if (intervals[i][0] < prevEnd) {
                      count++; prevEnd = Math.min(prevEnd, intervals[i][1]); // @step:remove
                  } else {
                      prevEnd = intervals[i][1]; // @step:keep
                  }
              }
              return count; // @step:done
          }
