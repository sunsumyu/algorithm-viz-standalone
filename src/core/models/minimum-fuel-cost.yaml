# ==============================================================================
# 🏆 [TOP-LEVEL TREE DP MODEL] 到达首都的最少油耗 顶层领域模型
# 对应：LeetCode 2477 / 左程云算法讲解 079 Code03
# 包含：子树代表人数自底向上汇聚、跨边油耗 ⌈size / seats⌉ 向上取整、状态机展开
# ==============================================================================

id: minimum-fuel-cost
name: 到达首都的最少油耗 (LeetCode 2477)
category: dynamic-programming
difficulty: medium
tags:
  - 树型 DP
  - 动态规划
  - 贪心
  - 树
  - 深度优先搜索

description: |
  LeetCode 2477 · 左程云算法通关课第 079 讲 树型 DP（下）Code03：到达首都的最少油耗。
  给你一棵 n 个节点的树（城市编号 0 到 n - 1），以 0 号城市（首都）为根。
  每个城市恰有 1 名代表要前往首都。每辆车最多可坐 seats 个人。
  
  核心树型 DP 汇聚模型 (Tree People Gathering Model)：
  1. 状态定义：以节点 u 为根的子树总人数为 people(u)。每个节点自身贡献 1 人。
  2. 人数汇聚：people(u) = 1 + ∑ people(v)（v 为 u 的所有子节点）。
  3. 跨边油耗计算：除首都（根节点 0）以外，节点 u 子树中的所有人驶向 u 的父节点，
     至少需要 ⌈people(u) / seats⌉ 辆车。由于每辆车跨越一条公路消耗 1 升油，
     故该边产生的油耗等于车辆数：
     fuel(u) = ⌈people(u) / seats⌉ = (people(u) + seats - 1) / seats。
  4. 全局最少油耗等于所有非根节点跨边油耗之和：totalFuel = ∑_{u != 0} fuel(u)。

defaultParams:
  n: 7
  seats: 2
  roads:
    - [0, 1]
    - [0, 4]
    - [0, 5]
    - [1, 2]
    - [1, 3]
    - [4, 6]

constraints:
  - 1 <= n <= 10^5（教学演示推荐 5~10）
  - 1 <= seats <= 10^5
  - roads 构成一棵无向树

directions:
  forward:
    name: 自底向上子树人数汇聚 (Bottom-Up Subtree People Gathering)
    description: 后序遍历自底向上汇聚每个子树的总代表人数，精确计算每条边所需拼车数与汽油消耗
  reverse:
    name: 自顶向下发车调度对比 (Top-Down Pre-Order Vehicle Dispatching)
    description: 从首都 0 号城市出发自顶向下派送空车调度，对比验证后序子树汇聚拼车的极佳油耗优化

stages:
  stage-1:
    name: 后序子树人数汇聚与拼车推导
    description: 递归后序遍历多叉树，汇总各子树代表人数，按 ⌈size / seats⌉ 累加各公路段耗油量
    complexity:
      time: O(N)
      space: O(N)
    code:
      forward:
        language: java
        source: |
          class Solution {
              private long totalFuel = 0; // @step:entry
              public long minimumFuelCost(int[][] roads, int seats) {
                  int n = roads.length + 1; // @step:build_tree
                  List<Integer>[] tree = new ArrayList[n];
                  for (int i = 0; i < n; i++) tree[i] = new ArrayList<>();
                  for (int[] r : roads) { tree[r[0]].add(r[1]); tree[r[1]].add(r[0]); } // @step:init_graph
                  dfs(0, -1, tree, seats); // @step:dfs_call
                  return totalFuel; // @step:return
              }
              private int dfs(int u, int p, List<Integer>[] tree, int seats) { // @step:dfs_entry
                  int people = 1; // @step:init_people
                  for (int v : tree[u]) { // @step:loop_child
                      if (v != p) people += dfs(v, u, tree, seats); // @step:branch_call
                  }
                  if (u != 0) { // @step:check_root
                      totalFuel += (people + seats - 1) / seats; // @step:calc_fuel
                  }
                  return people; // @step:return_people
              }
          }
      reverse:
        language: java
        source: |
          class SolutionTopDown {
              public long minimumFuelCostReverse(int[][] roads, int seats) { // @step:entry
                  int n = roads.length + 1; // @step:build_tree
                  List<Integer>[] tree = new ArrayList[n];
                  for (int i = 0; i < n; i++) tree[i] = new ArrayList<>();
                  for (int[] r : roads) { tree[r[0]].add(r[1]); tree[r[1]].add(r[0]); } // @step:init_graph
                  return dispatchFromCapital(0, -1, tree, seats); // @step:return
              }
              private long dispatchFromCapital(int u, int p, List<Integer>[] tree, int seats) { // @step:dfs_entry
                  long fuel = 0; // @step:init_people
                  for (int v : tree[u]) { // @step:loop_child
                      if (v != p) { // @step:branch_call
                          fuel += 1 + dispatchFromCapital(v, u, tree, seats); // @step:calc_fuel
                      }
                  }
                  return fuel; // @step:return_people
              }
          }

