# ==============================================================================
# 🏆 [TOP-LEVEL ALGORITHM MODEL] 顶层抽象模型规范
# 通配符匹配 (LeetCode 44) - 左程云算法通关课 Class 074 Code05
# 通配符 '*' 匹配任意字符序列，完全背包斜率优化消除内层循环
# 四阶段全演化标准参考模型 (Stage 1-4, forward/reverse 双向支持)
# ==============================================================================

id: wildcard-matching
name: "通配符匹配"
nameEn: "Wildcard Matching"
defaultStage: "stage-3"
category: "dynamic-programming"
icon: "🃏"
difficulty: 3
levelOrder: 88
learningGoal: "掌握问号与星号通配状态转移、完全背包斜率优化消圈技巧与二维边界填表"
description: "左程云算法通关课 Class 074 Code05：LeetCode 44 通配符匹配，通配符 * 可匹配任意长度序列，完全背包斜率优化 dp[i][j] = dp[i+1][j] || dp[i][j+1]"
defaultParams:
  s: "adceb"
  p: "*a*b"

problem:
  leetcodeId: 44
  title: "通配符匹配 (LeetCode 44 / Class 074 Code05)"
  difficulty: "困难"
  tags: ["动态规划", "双序列DP", "完全背包", "斜率优化", "贪心"]
  description: "给你一个输入字符串 (<code>s</code>) 和一个字符模式 (<code>p</code>) ，请你实现一个支持 <code>'?'</code> 和 <code>'*'</code> 匹配规则的通配符匹配：<br/><ul><li><code>'?'</code> 可以匹配任何单个有效字符；</li><li><code>'*'</code> 可以匹配任意字符序列（包括空字符序列）。</li></ul>判定字符串 <code>s</code> 和字符模式 <code>p</code> 是否完全匹配。"
  examples:
    - input: 's = "cb", p = "?a"'
      output: "false"
      explanation: "'?' 可以匹配 'c', 但第二个字符 'a' 无法匹配 'b'。"
    - input: 's = "adceb", p = "*a*b"'
      output: "true"
      explanation: "第一个 '*' 匹配空串，第二个 '*' 匹配字符串 'dce'。"
    - input: 's = "acdcb", p = "a*c?b"'
      output: "false"
      explanation: "无法完全匹配。"
  constraints:
    - "0 <= s.length, p.length <= 2000"
    - "s 仅由小写英文字母组成"
    - "p 仅由小写英文字母、'?' 或 '*' 组成"
  leetcodeUrl: "https://leetcode.cn/problems/wildcard-matching/"

directions:
  forward:
    label: "后缀依赖正推 (从 (0,0) 向后匹配)"
    branches:
      - name: "star_empty"
        label: "* 匹配空字符序列"
        formula: "dp[i][j+1]"
      - name: "star_take"
        label: "* 匹配至少 1 个字符"
        formula: "dp[i+1][j]"
      - name: "single_match"
        label: "单字符精确/问号匹配"
        formula: "first && dp[i+1][j+1]"
    combineFormula: "p[j] == '*' ? (dp[i][j+1] || dp[i+1][j]) : (first && dp[i+1][j+1])"
  reverse:
    label: "逆推倒序寻源 (终点逆向推导)"
    description: "从目标匹配状态向子问题基底反推"
    startFormula: "dp[0][0]"
    target: "dp[n][m]"
    branches:
      - name: "trace_star"
        label: "* 规则逆向溯源"
        formula: "dp[i][j+1] || dp[i+1][j]"
      - name: "trace_single"
        label: "单字符逆向溯源"
        formula: "first && dp[i+1][j+1]"
    combineFormula: "逆向状态依赖"

stages:
  stage-1:
    shortName: "递归"
    type: "recursion"
    timeBadge: "O(2ⁿ⁺ᵐ)"
    badgeBg: "bg-slate-100 text-slate-700"
    name:
      forward: "阶段 1: 暴力递归分支展开 (星号完全背包决策树)"
      reverse: "阶段 1: 暴力递归逆推寻源 (状态空间倒序展开)"
    desc:
      forward: "对模式字符分类讨论：普通字符或 '?' 精准匹配后推进双指针；遇到 '*' 时产生双分支（匹配空串 dfs(i, j+1) 与消耗一字符后保留星号 dfs(i+1, j)）。"
      reverse: "从终点目标状态向前倒推，展示朴素递归中出现的严重重叠子问题与指数级爆炸分支。"
    variants:
      standard:
        variantLabel: "标准递归实现"
        title:
          forward: "WildcardMatching_Recursive.java"
          reverse: "WildcardMatching_Recursive_Reverse.java"
        code:
          forward:
            title: "WildcardMatching_Recursive.java"
            source: |
              class Solution {
                  public boolean isMatch(String s, String p) {
                      return dfs(s.toCharArray(), p.toCharArray(), 0, 0); // @step:entry
                  }
                  private boolean dfs(char[] s, char[] p, int i, int j) { // @step:dfs_entry
                      if (j == p.length) return i == s.length; // @step:boundary
                      if (p[j] != '*') { // @step:check_char
                          boolean first = i < s.length && (s[i] == p[j] || p[j] == '?'); // @step:first_match
                          return first && dfs(s, p, i + 1, j + 1); // @step:branch_single
                      }
                      return dfs(s, p, i, j + 1) // @step:branch_empty
                          || (i < s.length && dfs(s, p, i + 1, j)); // @step:branch_take
                  }
              }
          reverse:
            title: "WildcardMatching_Recursive_Reverse.java"
            source: |
              class Solution {
                  public boolean isMatch(String s, String p) {
                      return dfs(s.toCharArray(), p.toCharArray(), 0, 0); // @step:entry
                  }
                  private boolean dfs(char[] s, char[] p, int i, int j) { // @step:dfs_entry
                      if (j == p.length) return i == s.length; // @step:boundary
                      if (p[j] != '*') { // @step:check_char
                          boolean first = i < s.length && (s[i] == p[j] || p[j] == '?'); // @step:first_match
                          return first && dfs(s, p, i + 1, j + 1); // @step:branch_single
                      }
                      return dfs(s, p, i, j + 1) // @step:branch_empty
                          || (i < s.length && dfs(s, p, i + 1, j)); // @step:branch_take
                  }
              }

  stage-2:
    shortName: "记忆化"
    type: "memoization"
    timeBadge: "O(N×M)"
    badgeBg: "bg-purple-100 text-purple-700"
    name:
      forward: "阶段 2: 记忆化搜索 (二维备忘录剪枝)"
      reverse: "阶段 2: 记忆化倒序剪枝 (自顶向下按需缓存)"
    desc:
      forward: "状态仅由文本串指针 i 与模式串指针 j 唯一确定。使用 memo[i][j] 缓存已计算结果，消灭重叠子树。"
      reverse: "采用倒序递归备忘录，缓存 memo[i][j] 消除重叠搜索计算。"
    variants:
      array_memo:
        variantLabel: "二维矩阵缓存版"
        title:
          forward: "WildcardMatching_Memo.java"
          reverse: "WildcardMatching_Memo_Reverse.java"
        code:
          forward:
            title: "WildcardMatching_Memo.java"
            source: |
              class Solution {
                  public boolean isMatch(String s, String p) {
                      char[] sArr = s.toCharArray(), pArr = p.toCharArray();
                      int[][] memo = new int[sArr.length + 1][pArr.length + 1]; // @step:entry
                      return dfs(sArr, pArr, 0, 0, memo);
                  }
                  private boolean dfs(char[] s, char[] p, int i, int j, int[][] memo) { // @step:dfs_entry
                      if (memo[i][j] != 0) return memo[i][j] == 2; // @step:cache_hit
                      if (j == p.length) { // @step:boundary
                          memo[i][j] = (i == s.length) ? 2 : 1;
                          return memo[i][j] == 2;
                      }
                      boolean ans;
                      if (p[j] != '*') { // @step:check_char
                          boolean first = i < s.length && (s[i] == p[j] || p[j] == '?'); // @step:first_match
                          ans = first && dfs(s, p, i + 1, j + 1, memo); // @step:single_eval
                      } else {
                          ans = dfs(s, p, i, j + 1, memo) || (i < s.length && dfs(s, p, i + 1, j, memo)); // @step:star_eval
                      }
                      memo[i][j] = ans ? 2 : 1; // @step:memo_store
                      return ans;
                  }
              }
          reverse:
            title: "WildcardMatching_Memo_Reverse.java"
            source: |
              class Solution {
                  public boolean isMatch(String s, String p) {
                      char[] sArr = s.toCharArray(), pArr = p.toCharArray();
                      int[][] memo = new int[sArr.length + 1][pArr.length + 1]; // @step:entry
                      return dfs(sArr, pArr, 0, 0, memo);
                  }
                  private boolean dfs(char[] s, char[] p, int i, int j, int[][] memo) { // @step:dfs_entry
                      if (memo[i][j] != 0) return memo[i][j] == 2; // @step:cache_hit
                      if (j == p.length) { // @step:boundary
                          memo[i][j] = (i == s.length) ? 2 : 1;
                          return memo[i][j] == 2;
                      }
                      boolean ans;
                      if (p[j] != '*') { // @step:check_char
                          boolean first = i < s.length && (s[i] == p[j] || p[j] == '?'); // @step:first_match
                          ans = first && dfs(s, p, i + 1, j + 1, memo); // @step:single_eval
                      } else {
                          ans = dfs(s, p, i, j + 1, memo) || (i < s.length && dfs(s, p, i + 1, j, memo)); // @step:star_eval
                      }
                      memo[i][j] = ans ? 2 : 1; // @step:memo_store
                      return ans;
                  }
              }

  stage-3:
    shortName: "二维DP"
    type: "tabulation-2d"
    timeBadge: "O(N×M)"
    badgeBg: "bg-emerald-100 text-emerald-700"
    name:
      forward: "阶段 3: 严格位置依赖二维 DP (自底向上填表)"
      reverse: "阶段 3: 二维 DP 状态空间逆推填表"
    desc:
      forward: "dp[i][j] 表示 s[i...] 与 p[j...] 是否匹配。从边界 dp[n][m] 逆序自底向上推导至答案 dp[0][0]。"
      reverse: "利用二维表格明确状态依赖关系，展示从终态基底反推状态演进。"
    variants:
      standard:
        variantLabel: "二维 DP 状态表"
        title:
          forward: "WildcardMatching_2D.java"
          reverse: "WildcardMatching_2D_Reverse.java"
        code:
          forward:
            title: "WildcardMatching_2D.java"
            source: |
              class Solution {
                  public boolean isMatch(String s, String p) {
                      int n = s.length(), m = p.length();
                      boolean[][] dp = new boolean[n + 1][m + 1]; // @step:init
                      dp[n][m] = true; // @step:base
                      for (int j = m - 1; j >= 0 && p.charAt(j) == '*'; j--) { // @step:base_row
                          dp[n][j] = true;
                      }
                      for (int i = n - 1; i >= 0; i--) { // @step:loop_i
                          for (int j = m - 1; j >= 0; j--) { // @step:loop_j
                              if (p.charAt(j) != '*') { // @step:check_char
                                  dp[i][j] = (s.charAt(i) == p.charAt(j) || p.charAt(j) == '?') && dp[i + 1][j + 1]; // @step:single_match
                              } else {
                                  dp[i][j] = dp[i + 1][j] || dp[i][j + 1]; // @step:star_slope
                              }
                          }
                      }
                      return dp[0][0]; // @step:return
                  }
              }
          reverse:
            title: "WildcardMatching_2D_Reverse.java"
            source: |
              class Solution {
                  public boolean isMatch(String s, String p) {
                      int n = s.length(), m = p.length();
                      boolean[][] dp = new boolean[n + 1][m + 1]; // @step:init
                      dp[n][m] = true; // @step:base
                      for (int j = m - 1; j >= 0 && p.charAt(j) == '*'; j--) { // @step:base_row
                          dp[n][j] = true;
                      }
                      for (int i = n - 1; i >= 0; i--) { // @step:loop_i
                          for (int j = m - 1; j >= 0; j--) { // @step:loop_j
                              if (p.charAt(j) != '*') { // @step:check_char
                                  dp[i][j] = (s.charAt(i) == p.charAt(j) || p.charAt(j) == '?') && dp[i + 1][j + 1]; // @step:single_match
                              } else {
                                  dp[i][j] = dp[i + 1][j] || dp[i][j + 1]; // @step:star_slope
                              }
                          }
                      }
                      return dp[0][0]; // @step:return
                  }
              }

  stage-4:
    shortName: "滚动优化"
    type: "space-optimized-1d"
    timeBadge: "O(M) ★"
    badgeBg: "bg-amber-100 text-amber-700"
    name:
      forward: "阶段 4: 两行滚动数组空间压缩 (O(M) 空间优化)"
      reverse: "阶段 4: 两行滚动数组空间压缩"
    desc:
      forward: "dp[i][j] 仅依赖当前行 i 与下一行 i+1，使用 cur 和 next 两个一维向量滚动更新，空间从 O(NM) 骤降至 O(M)。"
      reverse: "空间压缩消除额外行维度，只维护当前行与后继行。"
    variants:
      rolling:
        variantLabel: "两行滚动优化版"
        title:
          forward: "WildcardMatching_Rolling.java"
          reverse: "WildcardMatching_Rolling_Reverse.java"
        code:
          forward:
            title: "WildcardMatching_Rolling.java"
            source: |
              class Solution {
                  public boolean isMatch(String s, String p) {
                      int n = s.length(), m = p.length();
                      boolean[] next = new boolean[m + 1]; // @step:init
                      next[m] = true; // @step:base
                      for (int j = m - 1; j >= 0 && p.charAt(j) == '*'; j--) { // @step:base_row
                          next[j] = true;
                      }
                      for (int i = n - 1; i >= 0; i--) { // @step:loop_i
                          boolean[] cur = new boolean[m + 1];
                          for (int j = m - 1; j >= 0; j--) { // @step:loop_j
                              if (p.charAt(j) != '*') { // @step:check_char
                                  cur[j] = (s.charAt(i) == p.charAt(j) || p.charAt(j) == '?') && next[j + 1]; // @step:single_match
                              } else {
                                  cur[j] = next[j] || cur[j + 1]; // @step:star_slope
                              }
                          }
                          next = cur; // @step:roll
                      }
                      return next[0]; // @step:return
                  }
              }
          reverse:
            title: "WildcardMatching_Rolling_Reverse.java"
            source: |
              class Solution {
                  public boolean isMatch(String s, String p) {
                      int n = s.length(), m = p.length();
                      boolean[] next = new boolean[m + 1]; // @step:init
                      next[m] = true; // @step:base
                      for (int j = m - 1; j >= 0 && p.charAt(j) == '*'; j--) { // @step:base_row
                          next[j] = true;
                      }
                      for (int i = n - 1; i >= 0; i--) { // @step:loop_i
                          boolean[] cur = new boolean[m + 1];
                          for (int j = m - 1; j >= 0; j--) { // @step:loop_j
                              if (p.charAt(j) != '*') { // @step:check_char
                                  cur[j] = (s.charAt(i) == p.charAt(j) || p.charAt(j) == '?') && next[j + 1]; // @step:single_match
                              } else {
                                  cur[j] = next[j] || cur[j + 1]; // @step:star_slope
                              }
                          }
                          next = cur; // @step:roll
                      }
                      return next[0]; // @step:return
                  }
              }

keyPoints:
  title: "🎯 通配符匹配 5 步法系统精讲"
  summary: "经典困难级字符串 DP。核心在于识别模式串中的星号 '*' 能够匹配任意字符序列（包括空串），并通过完全背包斜率优化将 O(N) 循环穷举化简为 O(1) 的邻近转移。"
  steps:
    - label: "一、状态定义"
      desc: "<code>dp[i][j]</code>：文本串后缀 <code>s[i...]</code> 是否能够被模式串后缀 <code>p[j...]</code> 完全匹配。"
      icon: "🎯"
      badge: "后缀匹配状态"
    - label: "二、单字符与问号匹配"
      desc: "当 <code>p[j] != '*'</code> 时，只需 <code>s[i] == p[j] || p[j] == '?'</code>，状态转移为 <code>dp[i+1][j+1]</code>。"
      icon: "🔤"
      badge: "单字符对齐"
    - label: "三、星号完全背包斜率优化"
      desc: "当 <code>p[j] == '*'</code> 时，<code>dp[i][j] = dp[i][j+1] || dp[i+1][j]</code>。第一项让 * 匹配空串，第二项让 * 匹配至少 1 个字符且保留 * 继续生效！"
      icon: "⚡"
      badge: "O(1) 转移"
    - label: "四、边界基底"
      desc: "双空串匹配成功 <code>dp[n][m] = true</code>；文本串为空时，模式串后缀若全为 <code>'*'</code> 均可匹配成功。"
      icon: "🎬"
      badge: "全星号消空"
    - label: "五、空间压缩"
      desc: "状态仅依赖当前行与下一行，可利用两个长为 <code>M+1</code> 的向量进行滚动压缩，空间复杂度从 <code>O(NM)</code> 优化为 <code>O(M)</code>。"
      icon: "💾"
      badge: "两行滚动"

faqList:
  - question: "通配符匹配与正则表达式匹配中的星号 '*' 有什么本质区别？"
    answer: "正则表达式中的 '*' 是后置修饰符，修饰其前面的一个字符（例如 'a*' 表示 0 或多个 'a'）；而通配符匹配中的 '*' 是独立字符，自身即可匹配任意长度的任意字符序列（包括空序列）。"
    tag: "正则与通配符对比"
  - question: "为什么通配符星号的转移可以化简为 dp[i][j+1] || dp[i+1][j]？"
    answer: "原本 dp[i][j] = dp[i][j+1] || dp[i+1][j+1] || dp[i+2][j+1] || ...，而同列的下方单元格 dp[i+1][j] = dp[i+1][j+1] || dp[i+2][j+1] || ...，因此除第一项 dp[i][j+1] 外，其余所有项正好等于 dp[i+1][j]，直接代换即可消除循环！"
    tag: "斜率优化代数恒等"
