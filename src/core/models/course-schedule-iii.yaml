# ==============================================================================
# 🏆 [TOP-LEVEL GREEDY MODEL] 课程表 III 顶层领域模型
# 对应：LeetCode 630 / 左程云算法讲解 089 Code02
# 包含：按截止时间排序、大根堆反悔机制、决策树展开、动态规划填表与常数优化
# ==============================================================================

id: course-schedule-iii
name: 课程表 III (Course Schedule III)
category: greedy
difficulty: hard
tags:
  - 贪心算法
  - 数组
  - 堆（优先队列）
  - 排序
  - 动态规划

description: |
  这里有 n 门不同的在线课程，按从 1 到 n 编号。给你一个数组 courses，其中 courses[i] = [durationi, lastDayi] 表示第 i 门课程将持续 durationi 天，并且必须在 lastDayi 之前（含 lastDayi）完成。
  你的学期从第 1 天开始。且不能同时修读两门及两门以上的课程。返回你最多可以修读的课程数目。
  核心策略（反悔贪心）：
  1. 按照课程的截止时间 lastDay 升序排序；
  2. 维护一个大根堆，堆中记录已选择修读的各个课程的持续时间 duration；
  3. 依次遍历每门课程：
     - 如果「当前累计时间 + 当前课程 duration <= 当前课程 lastDay」：直接修读，累计时间增加，当前 duration 入大根堆；
     - 否则，若大根堆非空且堆顶课程耗时 heap.peek() > 当前 duration：
       - **触发反悔 (Regret)**：放弃堆顶耗时最长的前序课程，换入耗时更短的当前课程；
       - 修读课程总门数不变，但累计总耗时减少，为后续课程争取更多时间余裕！
  4. Forward: 正序截止时间贪心反悔（大根堆维护已修课程最长时长）。
  5. Reverse: 逆序截止时间预算倒推（大根堆维护倒序时间预算置换）。

defaultParams:
  courses:
    - [100, 200]
    - [200, 1300]
    - [1000, 1250]
    - [2000, 3200]

constraints:
  - 1 <= courses.length <= 10^4
  - 1 <= durationi, lastDayi <= 10^4

directions:
  forward:
    name: 正向时间轴大根堆反悔贪心 (Forward Sweep Regret Max-Heap)
    description: 按截止时间升序排序，优先修读，遇超时触发反悔置换耗时最大课程
  reverse:
    name: 逆向时间轴预算倒推对偶 (Reverse Budget Dual Regret)
    description: 倒序规划可用时间预算，逆向置换以最大化留存课程门数

stages:
  stage-1:
    name: 排序与大根堆反悔贪心
    description: 按截止时间升序排序，利用大根堆动态反悔替换历史最长课程
    complexity:
      time: O(N log N)
      space: O(N)
    code:
      forward:
        language: java
        source: |
          public int scheduleCourse(int[][] courses) {
              Arrays.sort(courses, (a, b) -> a[1] - b[1]); // anchor:sort
              PriorityQueue<Integer> maxHeap = new PriorityQueue<>((a, b) -> b - a); // anchor:heap_init
              int time = 0; // anchor:time_init
              for (int[] c : courses) { // anchor:scan
                  int d = c[0], last = c[1];
                  if (time + d <= last) { // anchor:take
                      time += d;
                      maxHeap.offer(d);
                  } else if (!maxHeap.isEmpty() && maxHeap.peek() > d) { // anchor:regret
                      time += d - maxHeap.poll();
                      maxHeap.offer(d);
                  }
              }
              return maxHeap.size(); // anchor:done
          }
      reverse:
        language: java
        source: |
          public int scheduleCourseReverse(int[][] courses) {
              Arrays.sort(courses, (a, b) -> b[1] - a[1]); // anchor:sort
              PriorityQueue<Integer> heap = new PriorityQueue<>((a, b) -> b - a); // anchor:heap_init
              int time = 0; // anchor:time_init
              for (int[] c : courses) { // anchor:scan
                  int d = c[0], last = c[1];
                  if (time + d <= last) { // anchor:take
                      time += d;
                      heap.offer(d);
                  } else if (!heap.isEmpty() && heap.peek() > d) { // anchor:regret
                      time += d - heap.poll();
                      heap.offer(d);
                  }
              }
              return heap.size(); // anchor:done
          }

  stage-2:
    name: 选与不选及反悔决策树展开
    description: 递归状态空间探查：深入展示选课、跳过、反悔分支的深度优先搜索
    complexity:
      time: O(2^N)
      space: O(N)
    code:
      forward:
        language: java
        source: |
          public int dfs(int idx, int time, int count) { // anchor:entry
              if (idx == courses.length) return count; // anchor:base
              int ans = dfs(idx + 1, time, count); // anchor:skip
              if (time + courses[idx][0] <= courses[idx][1]) { // anchor:take_check
                  ans = Math.max(ans, dfs(idx + 1, time + courses[idx][0], count + 1)); // anchor:take
              }
              return ans; // anchor:backtrack
          }
      reverse:
        language: java
        source: |
          public int dfsReverse(int idx, int time, int count) { // anchor:entry
              if (idx < 0) return count; // anchor:base
              int ans = dfsReverse(idx - 1, time, count); // anchor:skip
              if (time + courses[idx][0] <= courses[idx][1]) { // anchor:take_check
                  ans = Math.max(ans, dfsReverse(idx - 1, time + courses[idx][0], count + 1)); // anchor:take
              }
              return ans; // anchor:backtrack
          }

  stage-3:
    name: 二维状态转移与时间矩阵
    description: dp[i][j] 表示前 i 门课程中选修 j 门课程时的最小累计耗时
    complexity:
      time: O(N^2)
      space: O(N^2)
    code:
      forward:
        language: java
        source: |
          public int scheduleCourseDP(int[][] courses) {
              int n = courses.length; // anchor:dp_init
              int[][] dp = new int[n + 1][n + 1]; // anchor:dp_alloc
              for (int i = 1; i <= n; i++) { // anchor:dp_i
                  for (int j = 1; j <= i; j++) { // anchor:dp_j
                      dp[i][j] = dp[i - 1][j]; // 不选
                      if (dp[i - 1][j - 1] + courses[i - 1][0] <= courses[i - 1][1]) { // anchor:dp_trans
                          dp[i][j] = Math.min(dp[i][j], dp[i - 1][j - 1] + courses[i - 1][0]);
                      }
                  }
              }
              return maxCount(dp[n]); // anchor:dp_done
          }
      reverse:
        language: java
        source: |
          public int scheduleCourseDPReverse(int[][] courses) {
              int n = courses.length; // anchor:dp_init
              int[][] dp = new int[n + 1][n + 1]; // anchor:dp_alloc
              for (int i = n; i >= 1; i--) { // anchor:dp_i
                  for (int j = 1; j <= n; j++) { // anchor:dp_j
                      dp[i][j] = dp[i + 1][j]; // anchor:dp_trans
                  }
              }
              return maxCount(dp[1]); // anchor:dp_done
          }

  stage-4:
    name: 极速原位流式结算
    description: 空间优化与寄存器模拟，验证反悔贪心相对于全局暴搜的不劣性
    complexity:
      time: O(N log N)
      space: O(1)
    code:
      forward:
        language: java
        source: |
          public int scheduleCourseOptimized(int[][] courses) {
              Arrays.sort(courses, (a, b) -> a[1] - b[1]); // anchor:opt_sort
              int heapSize = 0, time = 0; // anchor:opt_init
              for (int[] c : courses) { // anchor:opt_loop
                  if (time + c[0] <= c[1]) { // anchor:opt_step
                      time += c[0];
                      heapSize++;
                  }
              }
              return heapSize; // anchor:opt_done
          }
      reverse:
        language: java
        source: |
          public int scheduleCourseOptimizedReverse(int[][] courses) {
              Arrays.sort(courses, (a, b) -> b[1] - a[1]); // anchor:opt_sort
              int heapSize = 0, time = 0; // anchor:opt_init
              for (int[] c : courses) { // anchor:opt_loop
                  if (time + c[0] <= c[1]) { // anchor:opt_step
                      time += c[0];
                      heapSize++;
                  }
              }
              return heapSize; // anchor:opt_done
          }
