  stage-3:
    shortName: "DP 填表"
    type: "dp"
    timeBadge: "O(n²)"
    badgeBg: "bg-blue-100 text-blue-700"
    name: "引爆气球 (区间 LIS 动态规划)"
    desc: "将最少弓箭数对偶转换为最大互斥不相交区间集的 LIS 动态规划模型"
    card2Title: "区间 DP 填表格子"
    card2Desc: "dp[i] 表示以第 i 个气球结尾的最大不相交子序列长度，最终答案与 N 形成对偶。"
    code:
      forward:
        title: "FindMinArrowShots_DP.java"
        source: |
          public int findMinArrowShots(int[][] points) {
              int n = points.length; // @step:entry
              int[] dp = new int[n];
              Arrays.fill(dp, 1);
              for (int i = 1; i < n; i++) {
                  for (int j = 0; j < i; j++) {
                      if (points[j][1] < points[i][0]) {
                          dp[i] = Math.max(dp[i], dp[j] + 1); // @step:transfer
