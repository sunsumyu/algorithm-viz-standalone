          }

  stage-4:
    shortName: "空间优化"
    type: "optimized"
    timeBadge: "O(1)"
    badgeBg: "bg-amber-100 text-amber-700"
    name: "引爆气球 (原地单变量收敛)"
    desc: "仅维护当前活跃的右边界变量 prevEnd，达成严格 O(1) 辅助空间"
    card2Title: "极致优化看板"
    card2Desc: "单指针实时滑动，零额外内存分配。"
    code:
      forward:
        title: "FindMinArrowShots_Optimized.java"
        source: |
          public int findMinArrowShots(int[][] points) {
              Arrays.sort(points, (a, b) -> Integer.compare(a[0], b[0])); // @step:entry
              int count = 1, prevEnd = points[0][1]; // @step:init
              for (int i = 1; i < points.length; i++) {
                  if (points[i][0] > prevEnd) {
                      count++; prevEnd = points[i][1]; // @step:new_arrow
                  } else {
                      prevEnd = Math.min(prevEnd, points[i][1]); // @step:overlap
                  }
              }
              return count; // @step:done
          }
