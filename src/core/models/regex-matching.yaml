problem:
  leetcodeId: 10
  title: "正则表达式匹配 (LeetCode 10 / Class 074 Code04)"
  difficulty: "困难"
  tags: ["动态规划", "双序列DP", "完全背包", "斜率优化"]
  description: "给你字符串 <code>s</code> 和字符规律 <code>p</code>。请你实现一个支持 <code>'.'</code> 和 <code>'*'</code> 的正则表达式匹配：<br/><ul><li><code>'.'</code> 匹配任意单个字符；</li><li><code>'*'</code> 匹配零个或多个前面的那一个元素。</li></ul>所谓匹配，是要涵盖<strong>整个字符串 <code>s</code></strong> 的，而不是部分字符串。"
  examples:
    - input: 's = "aab", p = "c*a*b"'
      output: "true"
      explanation: "c* 可以匹配 0 次 'c'（消去），a* 匹配两次 'a'，b 匹配 'b'，最终完全匹配成功。"
    - input: 's = "ab", p = ".*"'
      output: "true"
      explanation: ".* 表示可以匹配零个或任意多个任意字符，能匹配 'ab'。"
    - input: 's = "mississippi", p = "mis*is*p*."'
      output: "false"
      explanation: "无法完全涵盖匹配所有字符。"
  constraints:
    - "1 <= s.length <= 20"
    - "1 <= p.length <= 20"
    - "s 只包含小写英文字母"
    - "p 只包含小写英文字母，以及字符 . 和 *"
    - "保证每次出现字符 * 时，前面都匹配到有效的字符"
  leetcodeUrl: "https://leetcode.cn/problems/regular-expression-matching/"

directions:
  forward:
    label: "后缀依赖正推 (从 (0,0) 向后匹配)"
    branches:
      - name: "star_zero"
        label: "* 匹配 0 次"
        formula: "dp[i][j+2]"
      - name: "star_take"
        label: "* 匹配 1 次并保留 *"
        formula: "first && dp[i+1][j]"
      - name: "single_match"
        label: "单字符精确/通配点匹配"
        formula: "first && dp[i+1][j+1]"
    combineFormula: "dp[i][j+2] || (first && dp[i+1][j])"
  reverse:
    label: "逆推倒序寻源 (终点逆向推导)"
    description: "从目标匹配状态向子问题基底反推"
    startFormula: "dp[0][0]"
    target: "dp[n][m]"
    branches:
      - name: "trace_star"
        label: "* 规则逆向溯源"
        formula: "dp[i][j+2] || (first && dp[i+1][j])"
      - name: "trace_single"
        label: "单字符逆向溯源"
        formula: "first && dp[i+1][j+1]"
    combineFormula: "逆向状态依赖"

stages:
  stage-1:
    shortName: "递归"
    type: "recursion"
    timeBadge: "O(2ⁿ⁺ᵐ)"
    badgeBg: "bg-slate-100 text-slate-700"
    name:
      forward: "阶段 1: 暴力递归分支展开 (星号完全背包决策树)"
      reverse: "阶段 1: 暴力递归逆推寻源 (状态空间倒序展开)"
    desc:
      forward: "对于模式串中的每个字符，若下一字符为 '*'，则枚举匹配 0 次或消耗首字符后继续保持星号规则，展开为深层决策树。"
      reverse: "从终点目标状态向前倒推，展示朴素递归中出现的严重重叠子问题与指数级爆炸分支。"
    variants:
      branch_opt:
        variantLabel: "完全背包分支版 (无循环二选一递归 · 推荐)"
        title:
          forward: "Code04_RegularExpressionMatching_Branch.java"
          reverse: "Code04_RegularExpressionMatching_Branch_Reverse.java"
        code:
          forward:
            title: "Code04_RegularExpressionMatching_Branch.java"
            source: |
              // LeetCode 10. 正则表达式匹配 - 阶段 1: 完全背包选择分支版 (无循环二选一)
              // 核心思想：遇到 '*'，要么匹配 0 次 (j+2)，要么首字符匹配后继续保留当前 '*' 规则 (i+1, j)
              public class Code04_RegularExpressionMatching {
                  public static boolean isMatch(String s, String p) {
                      return dfs(s.toCharArray(), p.toCharArray(), 0, 0); // @step:entry
                  }
                  // 阶段 1: 暴力递归尝试 (星号完全背包选择分支)
                  private static boolean dfs(char[] s, char[] p, int i, int j) { // @step:dfs_entry
                      if (j == p.length) return i == s.length; // @step:boundary
                      boolean first = i < s.length && (s[i] == p[j] || p[j] == '.'); // @step:first_match
                      if (j + 1 < p.length && p[j + 1] == '*') { // @step:check_star
                          return dfs(s, p, i, j + 2) // @step:branch_zero
                              || (first && dfs(s, p, i + 1, j)); // @step:branch_take
                      }
                      return first && dfs(s, p, i + 1, j + 1); // @step:branch_single
                  }
              }
          reverse:
            title: "Code04_RegularExpressionMatching_Branch_Reverse.java"
            source: |
              // LeetCode 10. 正则表达式匹配 - 阶段 1: 完全背包选择分支版 (逆推)
              public class Code04_RegularExpressionMatching {
                  public static boolean isMatch(String s, String p) {
                      return dfs(s.toCharArray(), p.toCharArray(), 0, 0); // @step:entry
                  }
                  private static boolean dfs(char[] s, char[] p, int i, int j) { // @step:dfs_entry
                      if (j == p.length) return i == s.length; // @step:boundary
                      boolean first = i < s.length && (s[i] == p[j] || p[j] == '.'); // @step:first_match
                      if (j + 1 < p.length && p[j + 1] == '*') { // @step:check_star
                          return dfs(s, p, i, j + 2) // @step:branch_zero
                              || (first && dfs(s, p, i + 1, j)); // @step:branch_take
                      }
                      return first && dfs(s, p, i + 1, j + 1); // @step:branch_single
                  }
              }
      naive_loop:
        variantLabel: "左神074原版循环枚举尝试 (带 while 暴力版)"
        title:
          forward: "Code04_RegularExpressionMatching_NaiveLoop.java"
          reverse: "Code04_RegularExpressionMatching_NaiveLoop_Reverse.java"
        code:
          forward:
            title: "Code04_RegularExpressionMatching_NaiveLoop.java"
            source: |
              // LeetCode 10. 正则表达式匹配 - 阶段 1: 左神 074 原版朴素循环枚举版
              // 核心思想：遇到 '*'，依次循环枚举匹配 0 个、1 个、2 个... 直到字符无法匹配
              public class Code04_RegularExpressionMatching {
                  public static boolean isMatch(String s, String p) {
                      return dfs(s.toCharArray(), p.toCharArray(), 0, 0); // @step:entry
                  }
                  private static boolean dfs(char[] s, char[] p, int i, int j) { // @step:dfs_entry
                      if (j == p.length) return i == s.length; // @step:boundary
                      if (j + 1 < p.length && p[j + 1] == '*') { // @step:check_star
                          // 决策 1: 当前 '*' 匹配 0 次
                          if (dfs(s, p, i, j + 2)) return true; // @step:branch_zero
                          // 决策 2: 用循环枚举 '*' 匹配 1 次、2 次、3 次...
                          for (int k = i; k < s.length && (s[k] == p[j] || p[j] == '.'); k++) { // @step:branch_take
                              if (dfs(s, p, k + 1, j + 2)) return true;
                          }
                          return false;
                      }
                      boolean first = i < s.length && (s[i] == p[j] || p[j] == '.'); // @step:first_match
                      return first && dfs(s, p, i + 1, j + 1); // @step:branch_single
                  }
              }
          reverse:
            title: "Code04_RegularExpressionMatching_NaiveLoop_Reverse.java"
            source: |
              // LeetCode 10. 正则表达式匹配 - 阶段 1: 左神 074 原版朴素循环枚举版 (逆推)
              public class Code04_RegularExpressionMatching {
                  public static boolean isMatch(String s, String p) {
                      return dfs(s.toCharArray(), p.toCharArray(), 0, 0); // @step:entry
                  }
                  private static boolean dfs(char[] s, char[] p, int i, int j) { // @step:dfs_entry
                      if (j == p.length) return i == s.length; // @step:boundary
                      if (j + 1 < p.length && p[j + 1] == '*') { // @step:check_star
                          if (dfs(s, p, i, j + 2)) return true; // @step:branch_zero
                          for (int k = i; k < s.length && (s[k] == p[j] || p[j] == '.'); k++) { // @step:branch_take
                              if (dfs(s, p, k + 1, j + 2)) return true;
                          }
                          return false;
                      }
                      boolean first = i < s.length && (s[i] == p[j] || p[j] == '.'); // @step:first_match
                      return first && dfs(s, p, i + 1, j + 1); // @step:branch_single
                  }
              }

  stage-2:
    shortName: "记忆化"
    type: "memoization"
    timeBadge: "O(N×M)"
    badgeBg: "bg-purple-100 text-purple-700"
    name:
      forward: "阶段 2: 记忆化搜索 (二维备忘录剪枝)"
      reverse: "阶段 2: 记忆化倒序剪枝 (自顶向下按需缓存)"
    desc:
      forward: "状态仅由文本串指针 i 与模式串指针 j 唯一确定。使用 memo[i][j] 缓存已计算结果，消灭重叠子树。"
      reverse: "采用倒序递归备忘录，缓存 memo[i][j] 消除重叠搜索计算。"
    variants:
      array_memo:
        variantLabel: "二维矩阵缓存版"
        title:
          forward: "Code04_RegularExpressionMatching_Memo.java"
          reverse: "Code04_RegularExpressionMatching_Memo_Reverse.java"
        code:
          forward:
            title: "Code04_RegularExpressionMatching_Memo.java"
            source: |
              // LeetCode 10. 正则表达式匹配
              // 左程云算法通关课 Class 074 Code04 标准实现
              public class Code04_RegularExpressionMatching {
                  public static boolean isMatch(String s, String p) {
                      char[] sArr = s.toCharArray(), pArr = p.toCharArray();
                      int[][] memo = new int[sArr.length + 1][pArr.length + 1]; // @step:entry
                      return dfs(sArr, pArr, 0, 0, memo);
                  }
                  // 阶段 2: 记忆化搜索 (二维备忘录消除重叠子问题)
                  private static boolean dfs(char[] s, char[] p, int i, int j, int[][] memo) { // @step:dfs_entry
                      if (memo[i][j] != 0) return memo[i][j] == 2; // @step:cache_hit
                      if (j == p.length) { // @step:boundary
                          memo[i][j] = (i == s.length) ? 2 : 1;
                          return memo[i][j] == 2;
                      }
                      boolean first = i < s.length && (s[i] == p[j] || p[j] == '.'); // @step:first_match
                      boolean ans;
                      if (j + 1 < p.length && p[j + 1] == '*') { // @step:check_star
                          ans = dfs(s, p, i, j + 2, memo) || (first && dfs(s, p, i + 1, j, memo)); // @step:star_eval
                      } else {
                          ans = first && dfs(s, p, i + 1, j + 1, memo); // @step:single_eval
                      }
                      memo[i][j] = ans ? 2 : 1; // @step:memo_store
                      return ans;
                  }
              }
          reverse:
            title: "Code04_RegularExpressionMatching_Memo_Reverse.java"
            source: |
              // LeetCode 10. 正则表达式匹配
              // 左程云算法通关课 Class 074 Code04 标准实现
              public class Code04_RegularExpressionMatching {
                  public static boolean isMatch(String s, String p) {
                      char[] sArr = s.toCharArray(), pArr = p.toCharArray();
                      int[][] memo = new int[sArr.length + 1][pArr.length + 1]; // @step:entry
                      return dfs(sArr, pArr, 0, 0, memo);
                  }
                  private static boolean dfs(char[] s, char[] p, int i, int j, int[][] memo) { // @step:dfs_entry
                      if (memo[i][j] != 0) return memo[i][j] == 2; // @step:cache_hit
                      if (j == p.length) { // @step:boundary
                          memo[i][j] = (i == s.length) ? 2 : 1;
                          return memo[i][j] == 2;
                      }
                      boolean first = i < s.length && (s[i] == p[j] || p[j] == '.'); // @step:first_match
                      boolean ans;
                      if (j + 1 < p.length && p[j + 1] == '*') { // @step:check_star
                          ans = dfs(s, p, i, j + 2, memo) || (first && dfs(s, p, i + 1, j, memo)); // @step:star_eval
                      } else {
                          ans = first && dfs(s, p, i + 1, j + 1, memo); // @step:single_eval
                      }
                      memo[i][j] = ans ? 2 : 1; // @step:memo_store
                      return ans;
                  }
              }

  stage-3:
    shortName: "二维DP"
    type: "tabulation-2d"
    timeBadge: "O(N×M)"
    badgeBg: "bg-emerald-100 text-emerald-700"
    name:
      forward: "阶段 3: 严格位置依赖二维 DP (自底向上填表)"
      reverse: "阶段 3: 二维 DP 状态空间逆推填表"
    desc:
      forward: "dp[i][j] 表示 s[i...] 与 p[j...] 是否匹配。从边界 dp[n][m] 逆序自底向上推导至答案 dp[0][0]。"
      reverse: "利用二维表格明确状态依赖关系，展示从终态基底反推状态演进。"
    variants:
      standard:
        variantLabel: "二维 DP 状态表"
        title:
          forward: "Code04_RegularExpressionMatching.java"
          reverse: "Code04_RegularExpressionMatching_Reverse.java"
        code:
          forward:
            title: "Code04_RegularExpressionMatching.java"
            source: |
              // LeetCode 10. 正则表达式匹配
              // 左程云算法通关课 Class 074 Code04 标准实现
              public class Code04_RegularExpressionMatching {

                  // 阶段 3: 严格位置依赖二维动态规划 (自底向上填表，星号斜率优化)
                  public static boolean isMatch(String s, String p) {
                      int n = s.length(), m = p.length();
                      boolean[][] dp = new boolean[n + 1][m + 1]; // @step:init
                      dp[n][m] = true; // @step:base
                      for (int j = m - 1; j >= 0; j--) { // @step:base_row
                          dp[n][j] = j + 1 < m && p.charAt(j + 1) == '*' && dp[n][j + 2];
                      }
                      for (int i = n - 1; i >= 0; i--) { // @step:loop_i
                          for (int j = m - 1; j >= 0; j--) { // @step:loop_j
                              if (j + 1 == m || p.charAt(j + 1) != '*') { // @step:check_star
                                  dp[i][j] = (s.charAt(i) == p.charAt(j) || p.charAt(j) == '.') && dp[i + 1][j + 1]; // @step:single_match
                              } else {
                                  dp[i][j] = dp[i][j + 2] || ((s.charAt(i) == p.charAt(j) || p.charAt(j) == '.') && dp[i + 1][j]); // @step:star_slope
                              }
                          }
                      }
                      return dp[0][0]; // @step:return
                  }
              }
          reverse:
            title: "Code04_RegularExpressionMatching_Reverse.java"
            source: |
              // LeetCode 10. 正则表达式匹配
              // 左程云算法通关课 Class 074 Code04 标准实现
