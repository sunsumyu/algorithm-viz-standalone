      icon: "🎯"
      badge: "后缀匹配状态"
    - label: "二、分类讨论"
      desc: "考察 <code>p[j+1]</code> 是否为 <code>'*'</code>：若非星号，则必须单个匹配且转移至 <code>dp[i+1][j+1]</code>；若为星号，则进入完全背包分支。"
      icon: "🔀"
      badge: "星号分界"
    - label: "三、星号完全背包斜率优化"
      desc: "<code>dp[i][j] = dp[i][j+2] || (firstMatch && dp[i+1][j])</code>。第一项让 * 匹配 0 次，第二项让 * 匹配至少 1 次且保留星号规则！"
      icon: "⚡"
      badge: "O(1) 转移"
    - label: "四、边界基底"
      desc: "双空串匹配成功 <code>dp[n][m] = true</code>；文本串为空但模式串为 <code>x*y*z*</code> 时可通过星号取 0 次消解为空。"
      icon: "🎬"
      badge: "星号消解空串"
    - label: "五、空间压缩"
      desc: "由于状态只依赖当前行与下一行，可利用两个长为 <code>M+1</code> 的向量进行滚动压缩，空间复杂度优化为 <code>O(M)</code>。"
      icon: "💾"
      badge: "两行滚动"

faqList:
  - question: "为什么通配星号 '*' 的转移是 dp[i+1][j] 而不是 dp[i+1][j+2]？"
    answer: "如果转移至 dp[i+1][j+2]，意味着星号只匹配了恰好 1 次便结束了；而转移至 dp[i+1][j]，文本串虽然消耗了 1 个字符（到 i+1），但模式串仍然停留在 j 处，意味着星号规则继续存在，后续还可以继续匹配更多次相同的字符，这正是完全背包同层累加的本质！"
    tag: "完全背包复用机制"
  - question: "为什么本题推荐从后向前（自底向上）而不是从前向后匹配？"
    answer: "因为模式串中的 '*' 是后置修饰符（修饰其前一个字符），从前往后看字符时还不知道下一个是不是 '*'，处理起来较为繁琐；而从后向前看，或者以后缀作为子问题，能够清晰地先检查 j+1 是否为 '*'，逻辑更加对称自然。"
    tag: "遍历次序选择"
