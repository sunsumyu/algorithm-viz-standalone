                      for (int j = m - 1; j >= 0; j--) { // @step:base_row
                          dp[n][j] = j + 1 < m && p.charAt(j + 1) == '*' && dp[n][j + 2];
                      }
                      for (int i = n - 1; i >= 0; i--) { // @step:loop_i
                          for (int j = m - 1; j >= 0; j--) { // @step:loop_j
                              if (j + 1 == m || p.charAt(j + 1) != '*') { // @step:check_star
                                  dp[i][j] = (s.charAt(i) == p.charAt(j) || p.charAt(j) == '.') && dp[i + 1][j + 1]; // @step:single_match
                              } else {
                                  dp[i][j] = dp[i][j + 2] || ((s.charAt(i) == p.charAt(j) || p.charAt(j) == '.') && dp[i + 1][j]); // @step:star_slope
                              }
                          }
                      }
                      return dp[0][0]; // @step:return
                  }
              }

  stage-4:
    shortName: "滚动优化"
    type: "space-optimized-1d"
    timeBadge: "O(M) ★"
    badgeBg: "bg-amber-100 text-amber-700"
    name:
      forward: "阶段 4: 两行滚动数组空间压缩 (O(M) 空间优化)"
      reverse: "阶段 4: 两行滚动数组空间压缩"
    desc:
      forward: "dp[i][j] 仅依赖当前行 i 与下一行 i+1，使用 cur 和 next 两个一维向量滚动更新，空间从 O(NM) 骤降至 O(M)。"
      reverse: "空间压缩消除额外行维度，只维护当前行与后继行。"
    variants:
      rolling:
        variantLabel: "两行滚动优化版"
        title:
          forward: "Code04_RegularExpressionMatching_Rolling.java"
          reverse: "Code04_RegularExpressionMatching_Rolling_Reverse.java"
        code:
          forward:
            title: "Code04_RegularExpressionMatching_Rolling.java"
            source: |
              // LeetCode 10. 正则表达式匹配
              // 左程云算法通关课 Class 074 Code04 标准实现
              public class Code04_RegularExpressionMatching {

                  // 阶段 4: 两行滚动数组空间压缩 (O(M) 空间优化)
                  public static boolean isMatch(String s, String p) {
                      int n = s.length(), m = p.length();
                      boolean[] next = new boolean[m + 1]; // @step:init
                      next[m] = true; // @step:base
                      for (int j = m - 1; j >= 0; j--) { // @step:base_row
                          next[j] = j + 1 < m && p.charAt(j + 1) == '*' && next[j + 2];
                      }
                      for (int i = n - 1; i >= 0; i--) { // @step:loop_i
                          boolean[] cur = new boolean[m + 1];
                          for (int j = m - 1; j >= 0; j--) { // @step:loop_j
                              if (j + 1 == m || p.charAt(j + 1) != '*') { // @step:check_star
                                  cur[j] = (s.charAt(i) == p.charAt(j) || p.charAt(j) == '.') && next[j + 1]; // @step:single_match
                              } else {
                                  cur[j] = cur[j + 2] || ((s.charAt(i) == p.charAt(j) || p.charAt(j) == '.') && next[j]); // @step:star_slope
                              }
                          }
                          next = cur; // @step:roll
                      }
                      return next[0]; // @step:return
                  }
              }
          reverse:
            title: "Code04_RegularExpressionMatching_Rolling_Reverse.java"
            source: |
