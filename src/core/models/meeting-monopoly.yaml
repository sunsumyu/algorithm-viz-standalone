# ==============================================================================
# 🏆 [TOP-LEVEL GREEDY MODEL] 会议独占最大数量顶层领域模型
# 对应：LeetCode 435 / 洛谷 P1803 / 左程云算法讲解 090 Code03
# 包含：按结束时间排序贪心、状态树展开、区间状态演进矩阵、洛谷最晚开始桶 O(N) 极速优化
# ==============================================================================

id: meeting-monopoly
name: 会议独占最大数量 (Meeting Monopoly)
category: greedy
difficulty: medium
tags:
  - 贪心算法
  - 区间调度
  - 排序
  - 数组
  - 状态树

description: |
  给定 n 场会议的开始与结束时间段 intervals[i] = [starti, endi]。
  同一时间只能使用该会议室举办一场会议（独占资源，会议间不能发生重叠，但前一个结束时间与后一个开始时间相等时允许衔接）。
  请你计算最多可以参加多少场会议。
  核心贪心策略：
  1. 结束时间升序排序（Earliest Deadline First）：
     - 越早结束的会议越早腾空会议室，给后续留出的可用时间窗口 [curEnd, +∞) 就越充裕！
     - 维护当前时间指针 curEnd，若会议 start >= curEnd 则贪心选中并更新 curEnd = end。
  2. 洛谷 P1803 数组桶优化：
     - 若时间跨度有限 (<= 10^6)，维护 latest[end] = 该时刻结束的会议中最晚开始时间，扫描时间轴实现 O(N) 线性极速贪心。
  3. Forward: 正向时间轴升序推演（按 end 升序，优先选最早结束者）。
  4. Reverse: 逆向时间轴对偶推演（按 start 降序，优先选最晚开始者）。

defaultParams:
  intervals:
    - [1, 2]
    - [2, 3]
    - [3, 4]
    - [1, 3]

constraints:
  - 1 <= intervals.length <= 10^5
  - 0 <= starti < endi <= 10^6

directions:
  forward:
    name: 正向结束时间升序调度 (Forward Earliest End First)
    description: 会议按结束时间 end 升序排列，优先选择最早结束的会议，最大化后续可用时间余量
  reverse:
    name: 逆向开始时间降序对偶调度 (Reverse Latest Start First)
    description: 会议按开始时间 start 降序排列，优先选择最晚开始的会议，时间倒流对偶等价最优

stages:
  stage-1:
    name: 暴力独立子集搜索
    shortName: 暴力搜索
    description: 暴力递归穷举所有不冲突的会议子集，评估各个子集的会议总数
    complexity:
      time: O(2^N)
      space: O(N)
    code:
      forward:
        language: java
        source: |
          public int maxMeetingsDFS(int[][] intervals, int idx, int curEnd) {
              if (idx == intervals.length) return 0;
              int skip = maxMeetingsDFS(intervals, idx + 1, curEnd);
              int take = 0;
              if (intervals[idx][0] >= curEnd) {
                  take = 1 + maxMeetingsDFS(intervals, idx + 1, intervals[idx][1]);
              }
              return Math.max(skip, take);
          }
        anchors:
          entry: 1
          skip: 3
          take_check: 4
          take: 5
          ret: 7
      reverse:
        language: java
        source: |
          public int maxMeetingsDFSReverse(int[][] intervals, int idx, int curStart) {
              if (idx < 0) return 0;
              int skip = maxMeetingsDFSReverse(intervals, idx - 1, curStart);
              int take = 0;
              if (intervals[idx][1] <= curStart) {
                  take = 1 + maxMeetingsDFSReverse(intervals, idx - 1, intervals[idx][0]);
              }
              return Math.max(skip, take);
          }
        anchors:
          entry: 1
          skip: 3
          take_check: 4
          take: 5
          ret: 7

  stage-2:
    name: 结束时间排序与小根堆状态树展开
    shortName: 决策树
    description: 按 end 升序排序，自顶向下构建贪心状态依赖树，实时展示选入与冲突淘汰决策
    card2Title: "贪心决策与开辟依赖树 (Greedy Decision Tree)"
    card2Desc: "直观展现会议按时间排序后，贪心挑选与冲突淘汰的决策过程。"
    complexity:
      time: O(N log N)
      space: O(N)
    code:
      forward:
        language: java
        source: |
          Arrays.sort(intervals, (a, b) -> a[1] - b[1]);
          int count = 0, curEnd = 0;
          for (int[] m : intervals) {
              if (m[0] >= curEnd) {
                  count++;
                  curEnd = m[1]; // 选入并更新结束时间
              } else {
                  // 与已选会议冲突，直接舍弃
              }
          }
          return count;
        anchors:
          sort: 1
          init: 2
          loop: 3
          pick: 5
          conflict: 8
          done: 10
      reverse:
        language: java
        source: |
          Arrays.sort(intervals, (a, b) -> b[0] - a[0]);
          int count = 0, curStart = Integer.MAX_VALUE;
          for (int[] m : intervals) {
              if (m[1] <= curStart) {
                  count++;
                  curStart = m[0]; // 逆向选入
              } else {
                  // 逆向冲突淘汰
              }
          }
          return count;
        anchors:
          sort: 1
          init: 2
          loop: 3
          pick: 5
          conflict: 8
          done: 10

  stage-3:
    name: 区间状态转移矩阵演进跟踪
    shortName: 状态矩阵
    description: 二维矩阵完整记录各会议开始时间、结束时间、冲突判定与累计入选数
    card2Title: "区间调度决策与兼容性沙盘"
    card2Desc: "二维矩阵动态记录每场会议的时间边界、兼容性判定与贪心选入结果。"
    complexity:
      time: O(N log N)
      space: O(N)
    code:
      forward:
        language: java
        source: |
          // M[i] 记录第 i 场会议的状态决策
          for (int i = 0; i < n; i++) {
              boolean valid = intervals[i][0] >= curEnd;
              if (valid) {
                  curEnd = intervals[i][1];
                  selected[i] = true;
              }
              matrix[i] = new int[]{intervals[i][0], intervals[i][1], curEnd, count};
          }
        anchors:
          init: 1
          loop: 2
          check: 3
          update: 5
          done: 8
      reverse:
        language: java
        source: |
          for (int i = 0; i < n; i++) {
              boolean valid = intervals[i][1] <= curStart;
              if (valid) {
                  curStart = intervals[i][0];
                  selected[i] = true;
              }
              matrix[i] = new int[]{intervals[i][0], intervals[i][1], curStart, count};
          }
        anchors:
          init: 1
          loop: 2
          check: 3
          update: 5
          done: 8

  stage-4:
    name: 洛谷 P1803 数组桶 O(N) 极速收敛
    shortName: 桶优化
    description: 建立 latest[end] 最晚开始时间数组，跳过显式排序，直接线性遍历时间轴
    complexity:
      time: O(N + MaxTime)
      space: O(MaxTime)
    code:
      forward:
        language: java
        source: |
          int[] latest = new int[maxEnd + 1];
          Arrays.fill(latest, -1);
          for (int[] m : intervals) latest[m[1]] = Math.max(latest[m[1]], m[0]);
          int count = 0, curEnd = 0;
          for (int t = 0; t <= maxEnd; t++) {
              if (latest[t] >= curEnd) {
                  count++;
                  curEnd = t;
              }
          }
          return count;
        anchors:
          bucket_init: 1
          bucket_fill: 3
          scan_init: 4
          scan_loop: 5
          scan_pick: 7
          done: 10
      reverse:
        language: java
        source: |
          int[] earliest = new int[maxEnd + 1];
          Arrays.fill(earliest, Integer.MAX_VALUE);
          for (int[] m : intervals) earliest[m[0]] = Math.min(earliest[m[0]], m[1]);
          int count = 0, curStart = maxEnd;
          for (int t = maxEnd; t >= 0; t--) {
              if (earliest[t] <= curStart) {
                  count++;
                  curStart = t;
              }
          }
          return count;
        anchors:
          bucket_init: 1
          bucket_fill: 3
          scan_init: 4
          scan_loop: 5
          scan_pick: 7
          done: 10
