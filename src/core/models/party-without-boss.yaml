# ==============================================================================
# 🏆 [TOP-LEVEL TREE DP MODEL] 没有上司的舞会 顶层领域模型
# 对应：洛谷 P1352 / 左程云算法讲解 079 Code01
# 包含：自底向上二元组汇报 [notCome, come]、最大权独立集、状态依赖树与常数空间压缩
# ==============================================================================

id: party-without-boss
name: 没有上司的舞会
category: dynamic-programming
difficulty: medium
tags:
  - 树型 DP
  - 动态规划
  - 最大权独立集
  - 多叉树
  - 深度优先搜索

description: |
  洛谷 P1352 · 左程云算法通关课第 079 讲 树型 DP（下）Code01：没有上司的舞会。
  某大学有 n 个职员，编号为 1..n。每位职员有快乐指数 happy[i]。
  直接上司与直接下属不能同时参加舞会。求出席员工的快乐指数总和的最大值。
  核心树型 DP 互斥二元组汇报模型 (Tree DP Independent Set Info)：
  每个节点向直接上级汇报二元组 [notCome, come]：
  1. 当前职员不参加舞会：直接下属来不来皆可，贪心取最大收益累加：
     notCome = ∑ max(sub.notCome, sub.come)
  2. 当前职员参加舞会：直接下属绝对不能参加（只能贡献 notCome）：
     come = happy[u] + ∑ sub.notCome
  自底向上后序遍历多叉树，最高上司根节点最终返回 max(root.notCome, root.come)。

defaultParams:
  n: 7
  happy: [0, 4, 1, 2, 3, 2, 5, 1]
  relations:
    - [2, 1]
    - [3, 1]
    - [4, 2]
    - [5, 2]
    - [6, 3]
    - [7, 3]

constraints:
  - 1 <= n <= 6000（教学演示建议 5~10 节点）
  - -128 <= happy[i] <= 127

directions:
  forward:
    name: 自底向上后序二元汇报 (Bottom-Up Post-Order Info Tuple)
    description: 多叉树后序遍历自底向上汇集 [不参加, 参加] 二元组，以上司下属互斥原则聚合最优快乐指数
  reverse:
    name: 自顶向下先序邀请对比探查 (Top-Down Pre-Order Exploration)
    description: 从最高上司根节点出发向下自顶向下先序试探性邀请，对比验证自底向上后序状态机的高效性

stages:
  stage-1:
    name: 后序遍历自底向上二元汇报
    description: 递归后序遍历多叉树，每个节点汇报 [不来最大快乐值, 参加最大快乐值] 二元组，求解最大权独立集
    complexity:
      time: O(N)
      space: O(H)
    code:
      forward:
        language: java
        source: |
          class Solution {
              public int maxHappy(int n, int[] happy, int[][] relations) { // @step:entry
                  List<Integer>[] tree = new ArrayList[n + 1];
                  for (int i = 0; i <= n; i++) tree[i] = new ArrayList<>();
                  boolean[] hasBoss = new boolean[n + 1];
                  for (int[] r : relations) { tree[r[1]].add(r[0]); hasBoss[r[0]] = true; }
                  int root = 1;
                  while (hasBoss[root]) root++; // @step:find_root
                  int[] res = dfs(root, tree, happy); // @step:init
                  return Math.max(res[0], res[1]); // @step:return
              }
              private int[] dfs(int u, List<Integer>[] tree, int[] happy) { // @step:dfs_entry
                  int notCome = 0; // @step:init_not_come
                  int come = happy[u]; // @step:init_come
                  for (int v : tree[u]) { // @step:loop_child
                      int[] sub = dfs(v, tree, happy); // @step:branch_call
                      notCome += Math.max(sub[0], sub[1]); // @step:accum_not_come
                      come += sub[0]; // @step:accum_come
                  }
                  return new int[]{ notCome, come }; // @step:combine
              }
          }
      reverse:
        language: java
        source: |
          class SolutionTopDown {
              public int maxHappyReverse(int n, int[] happy, int[][] relations) { // @step:entry
                  List<Integer>[] tree = new ArrayList[n + 1];
                  for (int i = 0; i <= n; i++) tree[i] = new ArrayList<>();
                  boolean[] hasBoss = new boolean[n + 1];
                  for (int[] r : relations) { tree[r[1]].add(r[0]); hasBoss[r[0]] = true; }
                  int root = 1;
                  while (hasBoss[root]) root++; // @step:find_root
                  return explorePreOrder(root, tree, happy, false); // @step:return
              }
              private int explorePreOrder(int u, List<Integer>[] tree, int[] happy, boolean bossCame) { // @step:dfs_entry
                  int come = bossCame ? 0 : happy[u]; // @step:init_come
                  int notCome = 0; // @step:init_not_come
                  for (int v : tree[u]) { // @step:loop_child
                      notCome += explorePreOrder(v, tree, happy, false); // @step:branch_call
                      if (!bossCame) come += explorePreOrder(v, tree, happy, true); // @step:accum_come
                  }
                  return Math.max(come, notCome); // @step:combine
              }
          }

