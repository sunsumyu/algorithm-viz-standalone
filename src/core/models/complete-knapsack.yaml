# ==============================================================================
# 🏆 [GOLDEN BASELINE MODEL] 黄金基准模型规范
# 本规范为「完全背包问题 (Complete Knapsack Problem)」四阶段全演化标准实现。
# 包含：无限件物品分支决策、二维备忘录剪枝、二维DP正序填表与一维正序滚动压缩。
# ==============================================================================

id: complete-knapsack
name: "完全背包问题"
nameEn: "Complete Knapsack Problem"
defaultStage: "stage-3"
category: "dynamic-programming"
icon: "🧺"
difficulty: 2
levelOrder: 15
learningGoal: "完全背包与0-1背包的本质分界：掌握同件物品无限累加、二维同行转移与一维正序滚动压缩"
description: "完全背包问题：n 种物品与容量为 w 的背包。每种物品有无限件可用，求不超过背包容量时的最大总价值。"
defaultParams:
  bagWeight: 4
  weights: [1, 3, 4]
  values: [15, 20, 30]

problem:
  leetcodeId: 1616
  title: "完全背包模版 (疯狂的采药 洛谷 P1616 / 完全背包)"
  difficulty: "中等"
  tags: ["动态规划", "背包问题", "完全背包", "正序滚动"]
  description: "有 <code>N</code> 种物品和一个容量为 <code>V</code> 的背包（或有 <code>M</code> 种草药和采药总时间 <code>T</code>）。每种物品/草药都有 <strong>无限件</strong> 可用。第 <code>i</code> 种物品的重量/耗时是 <code>weight[i]</code>，得到的价值是 <code>value[i]</code>。<br/><br/>求解将哪些物品装入背包可使费用总和不超过背包容量，且 <strong>价值总和最大</strong>。"
  examples:
    - input: "bagWeight = 4, weights = [1, 3, 4], values = [15, 20, 30]"
      output: "60"
      explanation: "选择 4 件物品 0 (每件重 1, 价值 15)，总重量 1 × 4 = 4 <= 4，获得最大价值 15 × 4 = 60。"
    - input: "t = 70, costs = [71, 23], values = [100, 10]"
      output: "30"
      explanation: "洛谷 P1616 经典用例：草药 2 耗时 23 价值 10，在 70 时间内采摘 3 次（23 × 3 = 69 <= 70），获得最大收益 10 × 3 = 30。"
    - input: "t = 10, costs = [2, 3, 5], values = [5, 8, 14]"
      output: "26"
      explanation: "多草药多重选择：草药 0 (2, 5)、草药 1 (3, 8)、草药 2 (5, 14)，规划采摘使得总时间不超过 10，获得最大总价值。"
  constraints:
    - "1 <= N, M <= 10000"
    - "1 <= V, T <= 10000000"
    - "1 <= weight[i], value[i] <= 100000"
  leetcodeUrl: "https://www.luogu.com.cn/problem/P1616"

directions:
  forward:
    label: "物品正序决策"
    branches:
      - name: "not_take"
        label: "不放入 (跳过当前物品)"
        codeVar: "not_take"
        arrow: "🚫"
      - name: "take_repeat"
        label: "放入一件 (容量扣减, 可重复选同种物品)"
        codeVar: "take"
        arrow: "🔁"
    combineFormula: "Math.max(not_take, take)"

  reverse:
    label: "逆推 (倒序)"
    description: "从末尾目标向子问题基底反推"
    startFormula: "末尾状态"
    target: "起始状态"
    branches: []
    combineFormula: "逆向聚合"
stages:
  stage-1:
    shortName: "递归"
    type: "recursion"
    timeBadge: "O(2ⁿ)"
    badgeBg: "bg-slate-100 text-slate-700"
    name:
      forward: "阶段 1: 朴素递归 (选0件或选1件并继续尝试当前物品)"
    desc:
      forward: "对每种物品决策：不放入背包（转向下一物品 i+1），或放入一件背包（扣减重量并累加价值，物品索引仍保持 i 允许继续放入），展开为递归决策树。"
    variants:
      standard:
        variantLabel: "洛谷提交递归版"
        title:
          forward: "Main.java (递归版)"
        code:
          forward:
            title: "Main.java"
            source: |
              // 洛谷 P1616 疯狂的采药 / 完全背包模版
              // 左程云算法通关课 Class 074 Code03 - 阶段 1: 暴力递归分支展开
              import java.io.BufferedReader;
              import java.io.IOException;
              import java.io.InputStreamReader;
              import java.io.OutputStreamWriter;
              import java.io.PrintWriter;
              import java.io.StreamTokenizer;

              public class Main {
                  public static int MAXM = 10001;
                  public static int[] cost = new int[MAXM];
                  public static int[] val = new int[MAXM];
                  public static int t, m;

                  public static void main(String[] args) throws IOException {
                      BufferedReader br = new BufferedReader(new InputStreamReader(System.in));
                      StreamTokenizer in = new StreamTokenizer(br);
                      PrintWriter out = new PrintWriter(new OutputStreamWriter(System.out));
                      while (in.nextToken() != StreamTokenizer.TT_EOF) {
                          t = (int) in.nval;
                          in.nextToken();
                          m = (int) in.nval;
                          for (int i = 1; i <= m; i++) {
                              in.nextToken(); cost[i] = (int) in.nval;
                              in.nextToken(); val[i] = (int) in.nval;
                          }
                          out.println(dfs(1, t)); // @step:return
                      }
                      out.flush();
                      out.close();
                      br.close();
                  }

                  // 暴力递归完全背包：每种草药可选无限次 (若选入，仍停留在第 i 种继续选)
                  public static long dfs(int i, int remCap) { // @step:entry
                      if (i > m || remCap <= 0) return 0; // @step:boundary
                      long notTake = dfs(i + 1, remCap); // @step:branch_down @step:branch_not_take
                      long take = 0;
                      if (remCap >= cost[i]) { // @step:cond_take
                          take = dfs(i, remCap - cost[i]) + val[i]; // @step:branch_right @step:branch_take
                      }
                      return Math.max(notTake, take); // @step:combine
                  }
              }

  stage-2:
    shortName: "记忆化"
    type: "memoization"
    timeBadge: "O(n×w)"
    badgeBg: "bg-purple-100 text-purple-700"
    name:
      forward: "阶段 2: 记忆化搜索 (二维备忘录剪枝)"
    desc:
      forward: "状态由 (物品索引 i, 剩余容量 w) 唯一确定。使用 memo[n][w+1] 二维数组缓存子问题计算结果，消灭重叠子树。"
    variants:
      array_memo:
        variantLabel: "洛谷提交备忘录版"
        title:
          forward: "Main.java (备忘录版)"
        code:
          forward:
            title: "Main.java"
            source: |
              // 洛谷 P1616 疯狂的采药 / 完全背包模版
              // 左程云算法通关课 Class 074 Code03 - 阶段 2: 记忆化搜索完全背包
              import java.io.BufferedReader;
              import java.io.IOException;
              import java.io.InputStreamReader;
              import java.io.OutputStreamWriter;
              import java.io.PrintWriter;
              import java.io.StreamTokenizer;
              import java.util.Arrays;

              public class Main {
                  public static int MAXM = 10001;
                  public static int[] cost = new int[MAXM];
                  public static int[] val = new int[MAXM];
                  public static long[][] memo;
                  public static int t, m;

                  public static void main(String[] args) throws IOException {
                      BufferedReader br = new BufferedReader(new InputStreamReader(System.in));
                      StreamTokenizer in = new StreamTokenizer(br);
                      PrintWriter out = new PrintWriter(new OutputStreamWriter(System.out));
                      while (in.nextToken() != StreamTokenizer.TT_EOF) {
                          t = (int) in.nval;
                          in.nextToken();
                          m = (int) in.nval;
                          for (int i = 1; i <= m; i++) {
                              in.nextToken(); cost[i] = (int) in.nval;
                              in.nextToken(); val[i] = (int) in.nval;
                          }
                          memo = new long[m + 1][t + 1];
                          for (long[] row : memo) Arrays.fill(row, -1);
                          out.println(dfs(1, t)); // @step:return
                      }
                      out.flush();
                      out.close();
                      br.close();
                  }

                  public static long dfs(int i, int remCap) { // @step:entry
                      if (i > m || remCap <= 0) return 0; // @step:boundary
                      if (memo[i][remCap] != -1) return memo[i][remCap]; // @step:cache_hit
                      long notTake = dfs(i + 1, remCap); // @step:branch_down @step:branch_not_take
                      long take = 0;
                      if (remCap >= cost[i]) { // @step:cond_take
                          take = dfs(i, remCap - cost[i]) + val[i]; // @step:branch_right @step:branch_take
                      }
                      return memo[i][remCap] = Math.max(notTake, take); // @step:combine
                  }
              }

  stage-3:
    shortName: "二维DP"
    type: "tabulation-2d"
    timeBadge: "O(n×w)"
    badgeBg: "bg-emerald-100 text-emerald-700"
    name:
      forward: "阶段 3: 严格位置依赖二维动态规划 (左神原版 compute1)"
    desc:
      forward: "dp[i][j] 表示前 i 种物品装入容量 j 背包的最大价值。由于物品可重复选取，放入决策来自本行已更新的状态：dp[i][j] = max(dp[i-1][j], dp[i][j - w[i]] + v[i])。"
    variants:
      standard:
        variantLabel: "洛谷提交二维DP版"
        title:
          forward: "Main.java (二维DP版)"
        code:
          forward:
            title: "Main.java"
            source: |
              // 洛谷 P1616 疯狂的采药 / 完全背包模版
              // 左程云算法通关课 Class 074 Code03
              // 阶段 3: 严格位置依赖二维动态规划 (仅在此阶段展示 compute1)
              // 注意：洛谷 P1616 数据量 t <= 10^7, m <= 10^4，二维表会超出内存限制 (MLE)，故在此阶段展示数学转移机理
              import java.io.BufferedReader;
              import java.io.IOException;
              import java.io.InputStreamReader;
              import java.io.OutputStreamWriter;
              import java.io.PrintWriter;
              import java.io.StreamTokenizer;

              public class Main {
                  public static int MAXM = 10001;
                  public static int[] cost = new int[MAXM];
                  public static int[] val = new int[MAXM];
                  public static int t, m;

                  public static void main(String[] args) throws IOException {
                      BufferedReader br = new BufferedReader(new InputStreamReader(System.in));
                      StreamTokenizer in = new StreamTokenizer(br);
                      PrintWriter out = new PrintWriter(new OutputStreamWriter(System.out));
                      while (in.nextToken() != StreamTokenizer.TT_EOF) {
                          t = (int) in.nval;
                          in.nextToken();
                          m = (int) in.nval;
                          for (int i = 1; i <= m; i++) {
                              in.nextToken(); cost[i] = (int) in.nval;
                              in.nextToken(); val[i] = (int) in.nval;
                          }
                          out.println(compute1());
                      }
                      out.flush();
                      out.close();
                      br.close();
                  }

                  // 阶段 3: 严格位置依赖的二维动态规划 (compute1)
                  public static long compute1() {
                      long[][] dp = new long[m + 1][t + 1]; // @step:init
                      for (int j = cost[1]; j <= t; j++) { // @step:init_val
                          dp[1][j] = dp[1][j - cost[1]] + val[1];
                      }
                      for (int i = 2; i <= m; i++) { // @step:loop_i
                          for (int j = 0; j <= t; j++) { // @step:loop_j
                              if (j < cost[i]) { // @step:cond
                                  dp[i][j] = dp[i - 1][j]; // @step:transfer_skip
                              } else {
                                  dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - cost[i]] + val[i]); // @step:transfer_max
                              }
                          }
                      }
                      return dp[m][t]; // @step:return
                  }
              }

  stage-4:
    shortName: "一维优化"
    type: "space-optimized-1d"
    timeBadge: "O(w) ★"
    badgeBg: "bg-amber-100 text-amber-700"
    name:
      forward: "阶段 4: 空间压缩一维动态规划 (左神原版 compute2)"
    desc:
      forward: "将二维矩阵压缩为一维数组 dp[j]。完全背包与0-1背包的本质区别：容量必须【从小到大正序遍历】，利用同一物品已被放入的累加效果达成多次选取！"
    variants:
      forward_1d:
        variantLabel: "洛谷 AC 满分提交版"
        title:
          forward: "Main.java (洛谷 P1616 完整提交版)"
        code:
          forward:
            title: "Main.java"
            source: |
              // 洛谷 P1616 疯狂的采药 / 完全背包模版
              // 左程云算法通关课 Class 074 Code03
              // 阶段 4: 空间压缩一维动态规划 (仅在此阶段展示 compute2)
              // 测试链接 : https://www.luogu.com.cn/problem/P1616
              // 提交以下全部代码保持主类名为 Main，可以直接在洛谷 100% AC 满分通过！
              import java.io.BufferedReader;
              import java.io.IOException;
              import java.io.InputStreamReader;
              import java.io.OutputStreamWriter;
              import java.io.PrintWriter;
              import java.io.StreamTokenizer;
              import java.util.Arrays;

              public class Main {
                  public static int MAXM = 10001;
                  public static int MAXT = 10000001;
                  public static int[] cost = new int[MAXM];
                  public static int[] val = new int[MAXM];
                  public static long[] dp = new long[MAXT];
                  public static int t, m;

                  public static void main(String[] args) throws IOException {
                      BufferedReader br = new BufferedReader(new InputStreamReader(System.in));
                      StreamTokenizer in = new StreamTokenizer(br);
                      PrintWriter out = new PrintWriter(new OutputStreamWriter(System.out));
                      while (in.nextToken() != StreamTokenizer.TT_EOF) {
                          t = (int) in.nval;
                          in.nextToken();
                          m = (int) in.nval;
                          for (int i = 1; i <= m; i++) {
                              in.nextToken(); cost[i] = (int) in.nval;
                              in.nextToken(); val[i] = (int) in.nval;
                          }
                          out.println(compute2());
                      }
                      out.flush();
                      out.close();
                      br.close();
                  }

                  // 阶段 4: 空间压缩一维动态规划 (compute2)
                  // 关键：容量从小到大正序遍历，允许同轮对同一草药进行无限次自累加
                  public static long compute2() {
                      Arrays.fill(dp, 1, t + 1, 0); // @step:init
                      for (int i = 1; i <= m; i++) { // @step:loop_i @step:outer_loop
                          for (int j = cost[i]; j <= t; j++) { // @step:loop_j
                              dp[j] = Math.max(dp[j], dp[j - cost[i]] + val[i]); // @step:transfer_max @step:calc_max @step:accumulate
                          }
                      }
                      return dp[t]; // @step:return
                  }
              }

# ==============================================================================
# 系统五步法解题解析 (Five-Step System Analysis)
# ==============================================================================
keyPoints:
  title: "🎯 完全背包 5 步法系统精讲"
  summary: "背包问题的核心变体。0-1 背包每种物品只能选 1 次（一维逆序遍历容量）；完全背包每种物品有无限件可用（一维正序遍历容量，允许同层状态累加）。"
  steps:
    - label: "一、状态定义"
      desc: "<code>dp[i][j]</code>：从前 <code>i</code> 种物品中任意挑选，放入容量为 <code>j</code> 的背包中的最大价值。"
      icon: "🎯"
      badge: "物品×容量状态"
    - label: "二、状态转移方程"
      desc: "<code>dp[i][j] = max(dp[i-1][j], dp[i][j - weights[i]] + values[i])</code>。注意第二项是 <code>dp[i]</code>（同行左侧状态），非 <code>dp[i-1]</code>。"
      icon: "🔄"
      badge: "同层重复选取"
    - label: "三、边界与初始化"
      desc: "容量 <code>j=0</code> 时全为 0。首行物品 0 可多次放入：<code>dp[0][j] = dp[0][j - weights[0]] + values[0]</code>。"
      icon: "🎬"
      badge: "首行累加初始化"
    - label: "四、一维正序遍历本质"
      desc: "一维压缩时容量必须从小到大正序遍历，因为计算 <code>dp[j]</code> 所依赖的 <code>dp[j - w]</code> 需要是本轮已经放入过该物品的更新后数值。"
      icon: "🧭"
      badge: "正序累加机制"
    - label: "五、举例推导"
      desc: "物品重量=[1,3,4]，价值=[15,20,30]，容量=4。dp 数组滚动推导：选4件物品0获得最大价值 15 × 4 = 60。"
      icon: "📊"
      badge: "全局最优"

# ==============================================================================
# 常见面试高频问题 (FAQ List)
# ==============================================================================
faqList:
  - question: "为什么 0-1 背包必须逆序遍历容量，而完全背包必须正序遍历容量？"
    answer: "0-1 背包为了保证每件物品只放入一次，计算 dp[j] 时必须使用尚未被当前物品污染的上一层状态 dp[j-w]，因此从大到小逆序；而完全背包每种物品可无限放入，计算 dp[j] 时正需要利用刚刚放入过该物品的新状态 dp[j-w]，因此从小到大正序！"
    tag: "遍历顺序分水岭"
  - question: "完全背包的物品循环与容量循环是否可以颠倒？"
    answer: "在单纯求最大价值的完全背包中，两层 for 循环先后顺序可以颠倒，结果完全相同；但在背包计数问题（如零钱兑换 II 求组合数 vs 组合总和 IV 求排列数）中，先物品后容量是组合数，先容量后物品是排列数！"
    tag: "组合与排列分界"
