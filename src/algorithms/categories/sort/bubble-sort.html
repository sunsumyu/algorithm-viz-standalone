            <option value="200">快速</option>
          </select>
        </div>
      </div>

      <!-- 卡片 2: 状态空间与指标监视器 -->
      <div class="bs-card">
        <div class="bs-card-header">
          <div>
            <div class="bs-card-title">🧭 排序状态与指标监视器</div>
            <div class="bs-card-desc">当前外层轮次、比对索引对、累计比较/交换次数与已就位元素数</div>
          </div>
          <span id="badge-sorted-count" class="bs-counter-badge" style="color:#16a34a; background:#f0fdf4; border-color:#86efac;">已就位: 0</span>
        </div>

        <!-- 状态空间展示盒 -->
        <div class="bs-state-space-box">
          <div class="bs-metrics-grid">
            <div class="bs-metric-card">
              <span class="bs-metric-label">当前轮次 pass</span>
              <span class="bs-metric-val" id="metric-pass" style="color: #2563eb;">0</span>
            </div>
            <div class="bs-metric-card">
              <span class="bs-metric-label">比对索引 [j, j+1]</span>
              <span class="bs-metric-val" id="metric-j" style="color: #a855f7;">[0, 1]</span>
            </div>
            <div class="bs-metric-card">
              <span class="bs-metric-label">比较 / 交换 Comp/Swap</span>
              <span class="bs-metric-val" id="metric-comp-swap" style="color: #f59e0b;">0 / 0</span>
            </div>
            <div class="bs-metric-card">
              <span class="bs-metric-label">末尾就位数量 Sorted</span>
              <span class="bs-metric-val" id="metric-sorted-count" style="color: #10b981;">0</span>
            </div>
          </div>

          <div class="bs-formula-box">
            <span style="color:#64748b;">当前操作判定:</span>
            <strong id="formula-action" style="color: #2563eb;">compare(arr[j], arr[j+1])</strong>
          </div>

          <div class="bs-live-alert">
            <span>💡</span> <span id="bs-live-text">准备就绪，点击运行开始冒泡排序。</span>
          </div>
        </div>
      </div>

    </section>

    <!-- ================= 右侧：代码终端 + 执行日志 ================= -->
    <section class="bs-right-section">

      <!-- 卡片 3: 暗色代码终端面板 -->
      <div class="bs-dark-terminal">
        <div class="bs-terminal-header">
          <!-- 1. 主 Tab 切换器 (源码 / 题目 / 精讲) -->
          <div class="bs-tab-group">
            <button id="btn-tab-code" class="bs-tab-item active">💻 代码调试</button>
            <button id="btn-tab-problem" class="bs-tab-item">📋 题目描述</button>
            <button id="btn-tab-analysis" class="bs-tab-item">💡 算法精讲</button>
          </div>

          <!-- 2. 多语言切换器 -->
          <div class="bs-lang-group" id="code-lang-tabs">
            <button class="bs-lang-btn active" data-lang="java">Java</button>
            <button class="bs-lang-btn" data-lang="cpp">C++</button>
            <button class="bs-lang-btn" data-lang="python">Python</button>
            <button class="bs-lang-btn" data-lang="javascript">JS</button>
          </div>

          <!-- 3. 字号缩放器与 macOS 窗口微控制 -->
          <div class="bs-font-tools">
            <div class="bs-font-scaler">
              <button id="btn-code-font-dec" title="缩小代码字号">A-</button>
              <span id="code-font-indicator" class="bs-font-indicator">12</span>
              <button id="btn-code-font-inc" title="放大代码字号">A+</button>
            </div>

            <div class="bs-window-dots">
              <span class="bs-dot" style="background:#ef4444;"></span>
              <span class="bs-dot" style="background:#eab308;"></span>
              <span class="bs-dot" style="background:#22c55e;"></span>
            </div>
          </div>
        </div>

        <!-- 容器 1: 源码高亮与单步追踪视图 -->
        <div id="code-view-container" style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;">
          <div class="bs-terminal-body">
            <div id="code-lines-wrapper">
              <!-- 动态装载代码行 -->
            </div>
          </div>
        </div>

        <!-- 容器 2: 题目完整描述视图 -->
        <div id="problem-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载题目内容 -->
        </div>

        <!-- 容器 3: 算法精讲视图 -->
        <div id="analysis-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载精讲内容 -->
        </div>
      </div>

      <!-- 卡片 4: 独立执行日志卡片 -->
      <div class="bs-log-card">
        <div class="bs-log-header">
          <div class="bs-log-header-title">
            <span>📜 执行日志</span>
          </div>
          <span id="log-count" class="bs-log-count">0 条记录</span>
        </div>

        <div id="log-container" class="bs-log-body">
          <!-- 动态填充日志条目 -->
        </div>
      </div>

    </section>

  </main>

  <!-- 4. 力扣原题描述轻量模态弹窗 (Modal) -->
  <div id="modal-problem" class="bs-modal-backdrop hidden">
    <div class="bs-modal-content">
      <div class="bs-modal-header">
        <div class="bs-modal-title">
          <span>📋 算法原理与题目说明</span>
        </div>
        <button id="btn-close-problem-modal" class="bs-modal-close" title="关闭 (Esc)">✕</button>
      </div>
      <div id="modal-problem-body" class="bs-modal-body">
        <!-- 动态装载题目内容 -->
      </div>
    </div>
  </div>
</div>
