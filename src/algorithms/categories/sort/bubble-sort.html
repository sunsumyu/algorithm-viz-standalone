<style>
  /* === 冒泡排序 · 玻璃感 + 蓝紫渐变 === */
  #algo-bubble-sort-view {
    --accent-a: #6366f1;
    --accent-b: #a855f7;
    --accent-glow: rgba(139, 92, 246, .45);
    --sorted-a: #06b6d4;
    --sorted-b: #8b5cf6;
    --key-color: #f59e0b;
    --swap-color: #ec4899;
    width: 100%; height: 100%;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background:
      radial-gradient(ellipse at 15% 10%, rgba(99, 102, 241, .32), transparent 55%),
      radial-gradient(ellipse at 85% 90%, rgba(168, 85, 247, .28), transparent 55%),
      linear-gradient(135deg, #0c0a1f 0%, #1a1442 50%, #1e1050 100%);
    overflow: hidden;
  }
  #algo-bubble-sort-view .bs-shell {
    width: 100%; height: 100%;
    display: grid; grid-template-rows: auto 1fr; overflow: hidden;
  }
  /* hero */
  #algo-bubble-sort-view .bs-hero {
    padding: 18px 24px 12px;
    display: flex; gap: 18px; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, .06);
    background: rgba(8, 8, 24, .35);
    backdrop-filter: blur(14px) saturate(150%);
  }
  #algo-bubble-sort-view .bs-hero-left { display: flex; align-items: center; gap: 14px; }
  #algo-bubble-sort-view .bs-icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 800;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #f5f3ff; box-shadow: 0 6px 20px var(--accent-glow);
  }
  #algo-bubble-sort-view h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: #f1f5f9; }
  #algo-bubble-sort-view .bs-sub { color: #94a3b8; font-size: 12.5px; margin-top: 4px; }
  #algo-bubble-sort-view .bs-tip {
    max-width: 480px; padding: 10px 14px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(99, 102, 241, .12), rgba(168, 85, 247, .08));
    border: 1px solid rgba(139, 92, 246, .28);
    color: #cbd5e1; font-size: 12.5px; line-height: 1.65;
  }
  #algo-bubble-sort-view .bs-tip strong { color: #c4b5fd; }
  /* main grid */
  #algo-bubble-sort-view .bs-main {
    min-height: 0; display: grid;
    grid-template-columns: minmax(0, 1fr) 420px; gap: 16px; padding: 16px; overflow: hidden;
  }
  #algo-bubble-sort-view .bs-left { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
  #algo-bubble-sort-view .bs-card {
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
    overflow: hidden;
  }
  #algo-bubble-sort-view .bs-card-title {
    padding: 10px 16px; border-bottom: 1px solid rgba(255, 255, 255, .06);
    display: flex; justify-content: space-between; align-items: center;
    color: #cbd5e1; font-weight: 700; font-size: 13px;
  }
  #algo-bubble-sort-view .bs-tag {
    font-size: 11px; color: #c4b5fd; background: rgba(139, 92, 246, .14);
    border: 1px solid rgba(139, 92, 246, .3); padding: 2px 8px; border-radius: 999px;
  }
  /* input */
  #algo-bubble-sort-view .bs-input-row {
    display: grid; grid-template-columns: 1fr auto;
    gap: 10px; align-items: center; padding: 14px 16px;
  }
  #algo-bubble-sort-view input {
    width: 100%; padding: 9px 12px; border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, .12);
    background: rgba(8, 8, 24, .6);
    color: #e2e8f0; font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 13px; outline: none; transition: all .2s;
  }
  #algo-bubble-sort-view input:focus { border-color: var(--accent-b); box-shadow: 0 0 0 3px rgba(168, 85, 247, .15); }
  #algo-bubble-sort-view button {
    padding: 8px 16px; border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 10px; background: rgba(255, 255, 255, .04);
    color: #e2e8f0; cursor: pointer; font-weight: 600; font-size: 13px;
    transition: all .25s cubic-bezier(.4, 0, .2, 1);
  }
  #algo-bubble-sort-view button:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    border-color: transparent; color: #f5f3ff; transform: translateY(-1px);
    box-shadow: 0 6px 20px var(--accent-glow);
  }
  #algo-bubble-sort-view button:disabled { opacity: .4; cursor: not-allowed; }
  #algo-bubble-sort-view .bs-examples { padding: 0 16px 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  #algo-bubble-sort-view .bs-chip {
    padding: 5px 12px; border-radius: 999px; font-size: 12px;
    background: rgba(139, 92, 246, .12); border: 1px solid rgba(139, 92, 246, .28);
    color: #c4b5fd; cursor: pointer; transition: all .2s;
  }
  #algo-bubble-sort-view .bs-chip:hover {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #f5f3ff; border-color: transparent; transform: translateY(-1px);
  }
  /* stats */
  #algo-bubble-sort-view .bs-stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }
  #algo-bubble-sort-view .bs-stat {
    position: relative; padding: 12px 14px 12px 16px;
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 14px; overflow: hidden;
  }
  #algo-bubble-sort-view .bs-stat::before {
    content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 4px; border-radius: 4px;
    background: linear-gradient(180deg, var(--accent-a), var(--accent-b));
  }
  #algo-bubble-sort-view .bs-stat.bs-stat--sorted::before { background: linear-gradient(180deg, var(--sorted-a), var(--sorted-b)); }
  #algo-bubble-sort-view .bs-stat.bs-stat--swap::before { background: linear-gradient(180deg, #f472b6, #ec4899); }
  #algo-bubble-sort-view .bs-stat-label { color: #94a3b8; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  #algo-bubble-sort-view .bs-stat-val {
    color: #e2e8f0; font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 22px; font-weight: 800; margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  #algo-bubble-sort-view .bs-stat--sorted .bs-stat-val { color: #c4b5fd; }
  #algo-bubble-sort-view .bs-stat--swap .bs-stat-val { color: #f9a8d4; }
  /* visual */
  #algo-bubble-sort-view .bs-visual { flex: 1; min-height: 280px; display: flex; flex-direction: column; }
  #algo-bubble-sort-view .bs-canvas {
    flex: 1; min-height: 0; padding: 36px 18px 20px;
    position: relative; overflow: hidden;
    display: flex; align-items: flex-end; justify-content: center;
  }
  #algo-bubble-sort-view .bs-canvas::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 100%, rgba(139, 92, 246, .12), transparent 60%);
    pointer-events: none;
  }
  #algo-bubble-sort-view .bs-bars {
    position: relative; display: flex; align-items: flex-end;
    gap: 6px; height: 220px; padding-bottom: 28px;
  }
  #algo-bubble-sort-view .bs-bar-wrap {
    position: relative; display: flex; flex-direction: column; align-items: center;
    width: 48px; transition: transform .45s cubic-bezier(.4, 0, .2, 1);
  }
  #algo-bubble-sort-view .bs-bar {
    width: 100%; border-radius: 10px 10px 4px 4px;
    background: linear-gradient(180deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .04));
    border: 1.5px solid rgba(255, 255, 255, .14);
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 6px; color: #e2e8f0;
    font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 800;
    transition: height .45s cubic-bezier(.4, 0, .2, 1),
                background .35s, border-color .35s, box-shadow .35s, color .35s, transform .35s;
  }
  /* sorted */
  #algo-bubble-sort-view .bs-bar.bs-sorted {
    background: linear-gradient(180deg, rgba(139, 92, 246, .5), rgba(99, 102, 241, .25));
    border-color: rgba(139, 92, 246, .8);
    color: #fff;
    box-shadow: 0 4px 18px rgba(139, 92, 246, .25);
  }
  /* comparing */
  #algo-bubble-sort-view .bs-bar.bs-compare {
    background: linear-gradient(180deg, rgba(245, 158, 11, .55), rgba(217, 119, 6, .25));
    border-color: #fbbf24;
    color: #fff7ed;
    box-shadow: 0 0 0 3px rgba(245, 158, 11, .3);
  }
  /* swapping */
  #algo-bubble-sort-view .bs-bar.bs-swapping {
    background: linear-gradient(180deg, rgba(236, 72, 153, .55), rgba(219, 39, 119, .25));
    border-color: #f472b6;
    color: #fff;
    box-shadow: 0 4px 18px rgba(236, 72, 153, .4);
    animation: bs-swap-pulse .45s ease-in-out;
  }
  @keyframes bs-swap-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  /* pass done marker */
  #algo-bubble-sort-view .bs-bar.bs-pass-done {
    border-color: rgba(6, 182, 212, .6);
    box-shadow: 0 0 12px rgba(6, 182, 212, .3);
  }
  /* all done */
  #algo-bubble-sort-view .bs-bar.bs-done {
    background: linear-gradient(180deg, rgba(52, 211, 153, .55), rgba(16, 185, 129, .25));
    border-color: #34d399;
    box-shadow: 0 0 0 3px rgba(52, 211, 153, .3);
  }
  #algo-bubble-sort-view .bs-idx {
    position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%);
    color: #64748b; font-size: 11px; font-weight: 600;
    font-family: 'JetBrains Mono', Consolas, monospace;
  }
  #algo-bubble-sort-view .bs-compare-marker {
    position: absolute; top: -24px; left: 50%; transform: translateX(-50%);
    color: #fbbf24; font-size: 11px; font-weight: 800;
    background: rgba(245, 158, 11, .15); border: 1px solid #fbbf24;
    padding: 2px 8px; border-radius: 6px;
    animation: bs-float 1.6s ease-in-out infinite;
    white-space: nowrap;
  }
  @keyframes bs-float {
    0%, 100% { transform: translate(-50%, 0); }
    50% { transform: translate(-50%, -4px); }
  }
  /* swap arrow between bars */
  #algo-bubble-sort-view .bs-swap-arrow {
    position: absolute; top: -28px;
    color: #f472b6; font-size: 18px; font-weight: 800;
    animation: bs-swap-bounce .45s ease-in-out;
  }
  @keyframes bs-swap-bounce {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(4px); }
  }
  /* sorted area overlay */
  #algo-bubble-sort-view .bs-sorted-overlay {
    position: absolute; right: 0; bottom: 0; height: 4px;
    background: linear-gradient(90deg, var(--sorted-b), var(--sorted-a));
    border-radius: 4px;
    transition: width .5s cubic-bezier(.4, 0, .2, 1), opacity .35s;
    box-shadow: 0 0 12px var(--sorted-a);
  }
  /* result banner */
  #algo-bubble-sort-view .bs-result {
    margin: 0 16px 16px; padding: 14px 18px; border-radius: 12px;
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(135deg, rgba(99, 102, 241, .12), rgba(168, 85, 247, .06));
    border: 1px solid rgba(139, 92, 246, .28);
    line-height: 1.55; font-size: 14px; color: #ede9fe;
  }
  #algo-bubble-sort-view .bs-result .bs-emoji {
    width: 36px; height: 36px; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 20px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #f5f3ff; box-shadow: 0 4px 14px var(--accent-glow);
  }
  #algo-bubble-sort-view .bs-result.bs-result--done {
    background: linear-gradient(135deg, rgba(52, 211, 153, .18), rgba(16, 185, 129, .08));
    border-color: rgba(52, 211, 153, .4); color: #d1fae5;
  }
  #algo-bubble-sort-view .bs-result.bs-result--done .bs-emoji {
    background: linear-gradient(135deg, #34d399, #10b981);
    box-shadow: 0 4px 14px rgba(52, 211, 153, .55);
  }
  /* log */
  #algo-bubble-sort-view .bs-log {
    min-height: 90px; max-height: 140px; padding: 10px 14px;
    overflow: auto; background: rgba(8, 8, 24, .55);
    font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px;
    line-height: 1.7; color: #94a3b8;
  }
  #algo-bubble-sort-view .bs-log-line { display: flex; gap: 8px; }
  #algo-bubble-sort-view .bs-log-line .bs-log-num { color: #475569; flex-shrink: 0; }
  #algo-bubble-sort-view .bs-log-line.bs-log-active { color: #c4b5fd; font-weight: 600; }
  #algo-bubble-sort-view .bs-log-line.bs-log-active .bs-log-num { color: var(--accent-b); }
  /* code panel */
  #algo-bubble-sort-view .bs-code {
    min-height: 0; display: flex;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; overflow: hidden;
  }
  #algo-bubble-sort-view .bs-code [data-code-panel] { flex: 1; min-width: 0; }
  /* controls */
  #algo-bubble-sort-view .bs-controls {
    padding: 14px 18px;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border-top: 1px solid rgba(255, 255, 255, .06);
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  #algo-bubble-sort-view .bs-controls .bs-ctrl-btn { min-width: 64px; }
  #algo-bubble-sort-view .bs-controls .bs-ctrl-primary {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #f5f3ff; border-color: transparent;
  }
  #algo-bubble-sort-view .bs-counter {
    color: #94a3b8; font-size: 13px; font-weight: 600;
    min-width: 110px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #algo-bubble-sort-view .bs-speed-wrap {
    display: flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 12px;
  }
  #algo-bubble-sort-view #bs-speed { width: 130px; accent-color: var(--accent-b); }
  @media (max-width: 1100px) {
    #algo-bubble-sort-view .bs-main { grid-template-columns: 1fr; overflow: auto; }
    #algo-bubble-sort-view .bs-code { min-height: 360px; }
  }
</style>

<div class="bs-shell">
  <div class="bs-hero">
    <div class="bs-hero-left">
      <span class="bs-icon">🫧</span>
      <div>
        <h1>冒泡排序</h1>
        <div class="bs-sub">相邻元素两两比较，大元素像气泡一样浮到右端 · 稳定 · O(n²)</div>
      </div>
    </div>
    <div class="bs-tip"><strong>核心动画：</strong>每轮从左到右逐个比较相邻元素，若逆序则交换；一轮结束后最大元素「冒泡」到最右端，后续轮次不再涉及已就位的尾部。</div>
  </div>
  <div class="bs-main">
    <div class="bs-left">
      <section class="bs-card">
        <div class="bs-card-title">输入 <span class="bs-tag">数组</span></div>
        <div class="bs-input-row">
          <input id="bs-array" value="5,2,9,1,5,6">
          <button id="bs-start">开始排序</button>
        </div>
        <div class="bs-examples">
          <button class="bs-chip" data-arr="5,2,9,1,5,6">默认 6 元素</button>
          <button class="bs-chip" data-arr="3,1,4,1,5,9,2,6">8 元素</button>
          <button class="bs-chip" data-arr="5,4,3,2,1">完全逆序</button>
          <button class="bs-chip" data-arr="1,2,3,4,5">已排序</button>
          <button class="bs-chip" data-arr="2,2,2,1">含重复</button>
        </div>
      </section>

      <div class="bs-stats">
        <div class="bs-stat bs-stat--sorted"><div class="bs-stat-label">轮数</div><div class="bs-stat-val" id="bs-stat-pass">0</div></div>
        <div class="bs-stat"><div class="bs-stat-label">比较次数</div><div class="bs-stat-val" id="bs-stat-cmp">0</div></div>
        <div class="bs-stat bs-stat--swap"><div class="bs-stat-label">交换次数</div><div class="bs-stat-val" id="bs-stat-swap">0</div></div>
        <div class="bs-stat"><div class="bs-stat-label">已就位</div><div class="bs-stat-val" id="bs-stat-sorted">0</div></div>
      </div>

      <section class="bs-card bs-visual">
        <div class="bs-card-title">排序过程</div>
        <div class="bs-canvas">
          <div class="bs-bars" id="bs-bars"></div>
        </div>
        <div class="bs-result" id="bs-result">
          <span class="bs-emoji">🫧</span>
          <div id="step-message">点击「开始排序」查看冒泡排序逐步过程</div>
        </div>
      </section>

      <section class="bs-card">
        <div class="bs-card-title">执行日志 <button id="bs-log-clear" style="padding:4px 10px;font-size:11px;border-radius:999px;">清空</button></div>
        <div class="bs-log" id="bs-log"></div>
      </section>
    </div>
    <aside class="bs-code"><div data-code-panel></div></aside>
  </div>
  <div class="bs-controls">
    <button id="step-reset" class="bs-ctrl-btn">⏮ 重置</button>
    <button id="step-prev" class="bs-ctrl-btn">◀ 上一步</button>
    <button id="step-play" class="bs-ctrl-btn bs-ctrl-primary">▶ 播放</button>
    <button id="step-next" class="bs-ctrl-btn">下一步 ▶</button>
    <span id="step-counter" class="bs-counter">步骤: 0 / 0</span>
    <div class="bs-speed-wrap">
      <span>速度</span>
      <input id="bs-speed" type="range" min="200" max="2500" step="100" value="700">
      <span id="bs-speed-label" style="min-width:42px;">0.7s</span>
    </div>
  </div>
</div>
