<style>
  /* === 快速排序 · 玻璃感 + 橙色渐变 === */
  #algo-quick-sort-view {
    --accent-a: #ea580c;
    --accent-b: #f97316;
    --accent-c: #fb923c;
    --accent-glow: rgba(249, 115, 22, .45);
    --pivot-color: #fbbf24;
    --swap-color: #ef4444;
    --pointer-color: #38bdf8;
    --sorted-a: #34d399;
    --sorted-b: #10b981;
    --recurse-a: #a78bfa;
    --recurse-b: #7c3aed;
    width: 100%; height: 100%;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background:
      radial-gradient(ellipse at 15% 10%, rgba(234, 88, 12, .30), transparent 55%),
      radial-gradient(ellipse at 85% 90%, rgba(251, 146, 60, .22), transparent 55%),
      linear-gradient(135deg, #1a0f08 0%, #2d1810 50%, #1f1008 100%);
    overflow: hidden;
  }
  #algo-quick-sort-view .qs-shell {
    width: 100%; height: 100%;
    display: grid; grid-template-rows: auto 1fr; overflow: hidden;
  }
  /* hero */
  #algo-quick-sort-view .qs-hero {
    padding: 18px 24px 12px;
    display: flex; gap: 18px; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, .06);
    background: rgba(8, 8, 24, .35);
    backdrop-filter: blur(14px) saturate(150%);
  }
  #algo-quick-sort-view .qs-hero-left { display: flex; align-items: center; gap: 14px; }
  #algo-quick-sort-view .qs-icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 800;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-c));
    color: #fff7ed; box-shadow: 0 6px 20px var(--accent-glow);
  }
  #algo-quick-sort-view h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: #f1f5f9; }
  #algo-quick-sort-view .qs-sub { color: #94a3b8; font-size: 12.5px; margin-top: 4px; }
  #algo-quick-sort-view .qs-tip {
    max-width: 480px; padding: 10px 14px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(234, 88, 12, .12), rgba(249, 115, 22, .08));
    border: 1px solid rgba(249, 115, 22, .28);
    color: #cbd5e1; font-size: 12.5px; line-height: 1.65;
  }
  #algo-quick-sort-view .qs-tip strong { color: #fdba74; }
  /* main grid */
  #algo-quick-sort-view .qs-main {
    min-height: 0; display: grid;
    grid-template-columns: minmax(0, 1fr) 420px; gap: 16px; padding: 16px; overflow: hidden;
  }
  #algo-quick-sort-view .qs-left { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
  #algo-quick-sort-view .qs-card {
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
    overflow: hidden;
  }
  #algo-quick-sort-view .qs-card-title {
    padding: 10px 16px; border-bottom: 1px solid rgba(255, 255, 255, .06);
    display: flex; justify-content: space-between; align-items: center;
    color: #cbd5e1; font-weight: 700; font-size: 13px;
  }
  #algo-quick-sort-view .qs-tag {
    font-size: 11px; color: #fdba74; background: rgba(249, 115, 22, .14);
    border: 1px solid rgba(249, 115, 22, .3); padding: 2px 8px; border-radius: 999px;
  }
  /* input */
  #algo-quick-sort-view .qs-input-row {
    display: grid; grid-template-columns: 1fr auto;
    gap: 10px; align-items: center; padding: 14px 16px;
  }
  #algo-quick-sort-view input {
    width: 100%; padding: 9px 12px; border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, .12);
    background: rgba(8, 8, 24, .6);
    color: #e2e8f0; font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 13px; outline: none; transition: all .2s;
  }
  #algo-quick-sort-view input:focus { border-color: var(--accent-b); box-shadow: 0 0 0 3px rgba(249, 115, 22, .15); }
  #algo-quick-sort-view button {
    padding: 8px 16px; border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 10px; background: rgba(255, 255, 255, .04);
    color: #e2e8f0; cursor: pointer; font-weight: 600; font-size: 13px;
    transition: all .25s cubic-bezier(.4, 0, .2, 1);
  }
  #algo-quick-sort-view button:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    border-color: transparent; color: #fff7ed; transform: translateY(-1px);
    box-shadow: 0 6px 20px var(--accent-glow);
  }
  #algo-quick-sort-view button:disabled { opacity: .4; cursor: not-allowed; }
  #algo-quick-sort-view .qs-examples { padding: 0 16px 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  #algo-quick-sort-view .qs-chip {
    padding: 5px 12px; border-radius: 999px; font-size: 12px;
    background: rgba(249, 115, 22, .12); border: 1px solid rgba(249, 115, 22, .28);
    color: #fdba74; cursor: pointer; transition: all .2s;
  }
  #algo-quick-sort-view .qs-chip:hover {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #fff7ed; border-color: transparent; transform: translateY(-1px);
  }
  /* stats */
  #algo-quick-sort-view .qs-stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }
  #algo-quick-sort-view .qs-stat {
    position: relative; padding: 12px 14px 12px 16px;
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 14px; overflow: hidden;
  }
  #algo-quick-sort-view .qs-stat::before {
    content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 4px; border-radius: 4px;
    background: linear-gradient(180deg, var(--accent-a), var(--accent-b));
  }
  #algo-quick-sort-view .qs-stat.qs-stat--depth::before { background: linear-gradient(180deg, var(--recurse-a), var(--recurse-b)); }
  #algo-quick-sort-view .qs-stat.qs-stat--pivot::before { background: linear-gradient(180deg, #fbbf24, #f59e0b); }
  #algo-quick-sort-view .qs-stat.qs-stat--done::before { background: linear-gradient(180deg, var(--sorted-a), var(--sorted-b)); }
  #algo-quick-sort-view .qs-stat-label { color: #94a3b8; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  #algo-quick-sort-view .qs-stat-val {
    color: #e2e8f0; font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 22px; font-weight: 800; margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  #algo-quick-sort-view .qs-stat--depth .qs-stat-val { color: #c4b5fd; }
  #algo-quick-sort-view .qs-stat--pivot .qs-stat-val { color: #fcd34d; }
  #algo-quick-sort-view .qs-stat--done .qs-stat-val { color: #6ee7b7; }
  /* legend */
  #algo-quick-sort-view .qs-legend {
    display: flex; gap: 14px; padding: 0 16px 8px; flex-wrap: wrap;
  }
  #algo-quick-sort-view .qs-legend-item {
    display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: #94a3b8;
  }
  #algo-quick-sort-view .qs-legend-dot {
    width: 12px; height: 12px; border-radius: 4px;
  }
  #algo-quick-sort-view .qs-legend-dot.dot-pivot {
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    box-shadow: 0 0 6px rgba(251, 191, 36, .5);
  }
  #algo-quick-sort-view .qs-legend-dot.dot-compare {
    background: linear-gradient(135deg, rgba(56, 189, 248, .7), rgba(14, 165, 233, .4));
  }
  #algo-quick-sort-view .qs-legend-dot.dot-swap {
    background: linear-gradient(135deg, rgba(239, 68, 68, .7), rgba(220, 38, 38, .4));
  }
  #algo-quick-sort-view .qs-legend-dot-dot-recurse {
    background: linear-gradient(135deg, rgba(167, 139, 250, .7), rgba(124, 58, 237, .4));
  }
  #algo-quick-sort-view .qs-legend-dot.dot-sorted {
    background: linear-gradient(135deg, #34d399, #10b981);
  }
  /* visual */
  #algo-quick-sort-view .qs-visual { flex: 1; min-height: 280px; display: flex; flex-direction: column; }
  #algo-quick-sort-view .qs-canvas {
    flex: 1; min-height: 0; padding: 36px 18px 20px;
    position: relative; overflow: hidden;
    display: flex; align-items: flex-end; justify-content: center;
  }
  #algo-quick-sort-view .qs-canvas::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 100%, rgba(249, 115, 22, .12), transparent 60%);
    pointer-events: none;
  }
  /* sub-array range indicator */
  #algo-quick-sort-view .qs-range-bar {
    position: absolute; bottom: 8px; height: 6px; border-radius: 3px;
    transition: all .4s cubic-bezier(.4, 0, .2, 1);
    opacity: .7;
  }
  #algo-quick-sort-view .qs-range-bar.range-active {
    background: linear-gradient(90deg, var(--recurse-a), var(--recurse-b));
    box-shadow: 0 0 10px rgba(167, 139, 250, .5);
  }
  #algo-quick-sort-view .qs-range-bar.range-done {
    background: linear-gradient(90deg, var(--sorted-a), var(--sorted-b));
    box-shadow: 0 0 10px rgba(52, 211, 153, .4);
  }
  #algo-quick-sort-view .qs-range-label {
    position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
    font-size: 10px; font-weight: 700; white-space: nowrap;
    color: #c4b5fd; font-family: 'JetBrains Mono', Consolas, monospace;
  }
  /* bars */
  #algo-quick-sort-view .qs-bars {
    position: relative; display: flex; align-items: flex-end;
    gap: 6px; height: 220px; padding-bottom: 28px;
  }
  #algo-quick-sort-view .qs-bar-wrap {
    position: relative; display: flex; flex-direction: column; align-items: center;
    width: 48px; transition: transform .45s cubic-bezier(.4, 0, .2, 1);
  }
  #algo-quick-sort-view .qs-bar {
    width: 100%; border-radius: 10px 10px 4px 4px;
    background: linear-gradient(180deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .04));
    border: 1.5px solid rgba(255, 255, 255, .14);
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 6px; color: #e2e8f0;
    font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 800;
    transition: height .45s cubic-bezier(.4, 0, .2, 1),
                background .35s, border-color .35s, box-shadow .35s, color .35s, transform .35s;
  }
  /* default dim for elements outside recursion range */
  #algo-quick-sort-view .qs-bar.qs-outside {
    opacity: .35;
  }
  /* pivot highlight */
  #algo-quick-sort-view .qs-bar.qs-pivot {
    background: linear-gradient(180deg, rgba(251, 191, 36, .6), rgba(245, 158, 11, .3));
    border-color: var(--pivot-color);
    color: #fff7ed;
    box-shadow: 0 0 0 3px rgba(251, 191, 36, .3), 0 4px 18px rgba(251, 191, 36, .25);
  }
  /* comparing elements */
  #algo-quick-sort-view .qs-bar.qs-compare {
    background: linear-gradient(180deg, rgba(56, 189, 248, .5), rgba(14, 165, 233, .25));
    border-color: #38bdf8;
    color: #fff;
    box-shadow: 0 0 0 3px rgba(56, 189, 248, .25);
    animation: qs-pulse .5s ease-in-out;
  }
  @keyframes qs-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  /* swapping elements */
  #algo-quick-sort-view .qs-bar.qs-swap {
    background: linear-gradient(180deg, rgba(239, 68, 68, .55), rgba(220, 38, 38, .25));
    border-color: #f87171;
    color: #fff;
    box-shadow: 0 0 0 3px rgba(239, 68, 68, .3);
    animation: qs-shake .4s ease-in-out;
  }
  @keyframes qs-shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(3px); }
  }
  /* pointer markers (i, j) */
  #algo-quick-sort-view .qs-pointer {
    position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
    font-size: 11px; font-weight: 800;
    padding: 2px 8px; border-radius: 6px;
    animation: qs-float 1.6s ease-in-out infinite;
    font-family: 'JetBrains Mono', Consolas, monospace;
  }
  #algo-quick-sort-view .qs-pointer.ptr-i {
    color: #34d399; background: rgba(52, 211, 153, .15); border: 1px solid #34d399;
  }
  #algo-quick-sort-view .qs-pointer.ptr-j {
    color: #38bdf8; background: rgba(56, 189, 248, .15); border: 1px solid #38bdf8;
  }
  #algo-quick-sort-view .qs-pointer.ptr-pivot {
    color: #fbbf24; background: rgba(251, 191, 36, .15); border: 1px solid #fbbf24;
  }
  @keyframes qs-float {
    0%, 100% { transform: translate(-50%, 0); }
    50% { transform: translate(-50%, -4px); }
  }
  /* sorted (pivot in final place) */
  #algo-quick-sort-view .qs-bar.qs-sorted {
    background: linear-gradient(180deg, rgba(52, 211, 153, .55), rgba(16, 185, 129, .25));
    border-color: var(--sorted-a);
    color: #fff;
    box-shadow: 0 4px 18px rgba(52, 211, 153, .25);
  }
  /* done - all sorted */
  #algo-quick-sort-view .qs-bar.qs-done {
    background: linear-gradient(180deg, rgba(52, 211, 153, .55), rgba(16, 185, 129, .25));
    border-color: var(--sorted-a);
    box-shadow: 0 0 0 3px rgba(52, 211, 153, .3);
    color: #fff;
  }
  /* recurse range highlight (in-range elements get a subtle tint) */
  #algo-quick-sort-view .qs-bar.qs-in-range {
    border-color: rgba(167, 139, 250, .5);
  }
  #algo-quick-sort-view .qs-idx {
    position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%);
    color: #64748b; font-size: 11px; font-weight: 600;
    font-family: 'JetBrains Mono', Consolas, monospace;
  }
  /* result banner */
  #algo-quick-sort-view .qs-result {
    margin: 0 16px 16px; padding: 14px 18px; border-radius: 12px;
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(135deg, rgba(234, 88, 12, .12), rgba(249, 115, 22, .06));
    border: 1px solid rgba(249, 115, 22, .28);
    line-height: 1.55; font-size: 14px; color: #fed7aa;
  }
  #algo-quick-sort-view .qs-result .qs-emoji {
    width: 36px; height: 36px; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 20px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #fff7ed; box-shadow: 0 4px 14px var(--accent-glow);
  }
  #algo-quick-sort-view .qs-result.qs-result--done {
    background: linear-gradient(135deg, rgba(52, 211, 153, .18), rgba(16, 185, 129, .08));
    border-color: rgba(52, 211, 153, .4); color: #d1fae5;
  }
  #algo-quick-sort-view .qs-result.qs-result--done .qs-emoji {
    background: linear-gradient(135deg, #34d399, #10b981);
    box-shadow: 0 4px 14px rgba(52, 211, 153, .55);
  }
  /* log */
  #algo-quick-sort-view .qs-log {
    min-height: 90px; max-height: 140px; padding: 10px 14px;
    overflow: auto; background: rgba(8, 8, 24, .55);
    font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px;
    line-height: 1.7; color: #94a3b8;
  }
  #algo-quick-sort-view .qs-log-line { display: flex; gap: 8px; }
  #algo-quick-sort-view .qs-log-line .qs-log-num { color: #475569; flex-shrink: 0; }
  #algo-quick-sort-view .qs-log-line.qs-log-active { color: #fdba74; font-weight: 600; }
  #algo-quick-sort-view .qs-log-line.qs-log-active .qs-log-num { color: var(--accent-b); }
  /* code panel */
  #algo-quick-sort-view .qs-code {
    min-height: 0; display: flex;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; overflow: hidden;
  }
  #algo-quick-sort-view .qs-code [data-code-panel] { flex: 1; min-width: 0; }
  /* controls */
  #algo-quick-sort-view .qs-controls {
    padding: 14px 18px;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border-top: 1px solid rgba(255, 255, 255, .06);
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  #algo-quick-sort-view .qs-controls .qs-ctrl-btn { min-width: 64px; }
  #algo-quick-sort-view .qs-controls .qs-ctrl-primary {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #fff7ed; border-color: transparent;
  }
  #algo-quick-sort-view .qs-counter {
    color: #94a3b8; font-size: 13px; font-weight: 600;
    min-width: 110px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #algo-quick-sort-view .qs-speed-wrap {
    display: flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 12px;
  }
  #algo-quick-sort-view #qs-speed { width: 130px; accent-color: var(--accent-b); }
  @media (max-width: 1100px) {
    #algo-quick-sort-view .qs-main { grid-template-columns: 1fr; overflow: auto; }
    #algo-quick-sort-view .qs-code { min-height: 360px; }
  }
</style>

<div class="qs-shell">
  <div class="qs-hero">
    <div class="qs-hero-left">
      <span class="qs-icon">⚡</span>
      <div>
        <h1>快速排序</h1>
        <div class="qs-sub">分治递归 · 选取 pivot 分区 · 平均 O(n log n) · 不稳定</div>
      </div>
    </div>
    <div class="qs-tip"><strong>核心动画：</strong>选基准 pivot → 左右指针 i/j 相向扫描 → 比 pivot 小的放左边，大的放右边 → pivot 归位 → 递归左右子数组。</div>
  </div>
  <div class="qs-main">
    <div class="qs-left">
      <section class="qs-card">
        <div class="qs-card-title">输入 <span class="qs-tag">数组</span></div>
        <div class="qs-input-row">
          <input id="qs-array" value="8,3,5,1,7,2,9,4">
          <button id="qs-start">开始排序</button>
        </div>
        <div class="qs-examples">
          <button class="qs-chip" data-arr="8,3,5,1,7,2,9,4">默认 8 元素</button>
          <button class="qs-chip" data-arr="5,3,8,4,2">5 元素</button>
          <button class="qs-chip" data-arr="7,6,5,4,3,2,1">完全逆序</button>
          <button class="qs-chip" data-arr="1,2,3,4,5,6">已排序</button>
          <button class="qs-chip" data-arr="3,3,1,1,2,2">含重复</button>
        </div>
      </section>

      <div class="qs-stats">
        <div class="qs-stat qs-stat--depth"><div class="qs-stat-label">递归深度</div><div class="qs-stat-val" id="qs-stat-depth">0</div></div>
        <div class="qs-stat"><div class="qs-stat-label">比较次数</div><div class="qs-stat-val" id="qs-stat-cmp">0</div></div>
        <div class="qs-stat"><div class="qs-stat-label">交换次数</div><div class="qs-stat-val" id="qs-stat-swap">0</div></div>
        <div class="qs-stat qs-stat--pivot"><div class="qs-stat-label">pivot</div><div class="qs-stat-val" id="qs-stat-pivot">-</div></div>
      </div>

      <div class="qs-legend">
        <div class="qs-legend-item"><div class="qs-legend-dot dot-pivot"></div><span>Pivot 基准</span></div>
        <div class="qs-legend-item"><div class="qs-legend-dot dot-compare"></div><span>当前比较</span></div>
        <div class="qs-legend-item"><div class="qs-legend-dot dot-swap"></div><span>交换</span></div>
        <div class="qs-legend-item"><div class="qs-legend-dot dot-sorted"></div><span>已归位</span></div>
      </div>

      <section class="qs-card qs-visual">
        <div class="qs-card-title">排序过程</div>
        <div class="qs-canvas">
          <div class="qs-bars" id="qs-bars"></div>
        </div>
        <div class="qs-result" id="qs-result">
          <span class="qs-emoji">⚡</span>
          <div id="step-message">点击「开始排序」查看快速排序逐步过程</div>
        </div>
      </section>

      <section class="qs-card">
        <div class="qs-card-title">执行日志 <button id="qs-log-clear" style="padding:4px 10px;font-size:11px;border-radius:999px;">清空</button></div>
        <div class="qs-log" id="qs-log"></div>
      </section>
    </div>
    <aside class="qs-code"><div data-code-panel></div></aside>
  </div>
  <div class="qs-controls">
    <button id="step-reset" class="qs-ctrl-btn">⏮ 重置</button>
    <button id="step-prev" class="qs-ctrl-btn">◀ 上一步</button>
    <button id="step-play" class="qs-ctrl-btn qs-ctrl-primary">▶ 播放</button>
    <button id="step-next" class="qs-ctrl-btn">下一步 ▶</button>
    <span id="step-counter" class="qs-counter">步骤: 0 / 0</span>
