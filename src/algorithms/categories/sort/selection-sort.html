        <div style="display: flex; align-items: center; gap: 4px; margin-left: 6px;">
          <select id="select-speed" style="padding: 2px 6px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 11px; background: #ffffff;">
            <option value="1200">慢速</option>
            <option value="500" selected>正常</option>
            <option value="200">快速</option>
          </select>
        </div>
      </div>

      <!-- 卡片 2: 状态空间与指标监视器 -->
      <div class="ss-card">
        <div class="ss-card-header">
          <div>
            <div class="ss-card-title">🧭 排序状态与指标监视器</div>
            <div class="ss-card-desc">归位目标索引 i、当前最小值索引 minIdx、扫描指针 j 与比较/交换统计</div>
          </div>
          <span id="badge-sorted-count" class="ss-counter-badge" style="color:#16a34a; background:#f0fdf4; border-color:#86efac;">已就位: 0</span>
        </div>

        <!-- 状态空间展示盒 -->
        <div class="ss-state-space-box">
          <div class="ss-metrics-grid">
            <div class="ss-metric-card">
              <span class="ss-metric-label">归位目标索引 i</span>
              <span class="ss-metric-val" id="metric-i" style="color: #2563eb;">0</span>
            </div>
            <div class="ss-metric-card">
              <span class="ss-metric-label">当前最小值 minIdx</span>
              <span class="ss-metric-val" id="metric-min-idx" style="color: #eab308;">0</span>
            </div>
            <div class="ss-metric-card">
              <span class="ss-metric-label">扫描指针 j</span>
              <span class="ss-metric-val" id="metric-j" style="color: #38bdf8;">1</span>
            </div>
            <div class="ss-metric-card">
              <span class="ss-metric-label">比较 / 交换 Comp/Swap</span>
              <span class="ss-metric-val" id="metric-comp-swap" style="color: #f59e0b;">0 / 0</span>
            </div>
          </div>

          <div class="ss-formula-box">
            <span style="color:#64748b;">当前操作判定:</span>
            <strong id="formula-action" style="color: #2563eb;">findMin(arr[i..n-1])</strong>
          </div>

          <div class="ss-live-alert">
            <span>💡</span> <span id="ss-live-text">准备就绪，点击运行开始选择排序。</span>
          </div>
        </div>
      </div>

    </section>

    <!-- ================= 右侧：代码终端 + 执行日志 ================= -->
    <section class="ss-right-section">

      <!-- 卡片 3: 暗色代码终端面板 -->
      <div class="ss-dark-terminal">
        <div class="ss-terminal-header">
          <!-- 1. 主 Tab 切换器 (源码 / 题目 / 精讲) -->
          <div class="ss-tab-group">
            <button id="btn-tab-code" class="ss-tab-item active">💻 代码调试</button>
            <button id="btn-tab-problem" class="ss-tab-item">📋 题目描述</button>
            <button id="btn-tab-analysis" class="ss-tab-item">💡 算法精讲</button>
          </div>

          <!-- 2. 多语言切换器 -->
          <div class="ss-lang-group" id="code-lang-tabs">
            <button class="ss-lang-btn active" data-lang="java">Java</button>
            <button class="ss-lang-btn" data-lang="cpp">C++</button>
            <button class="ss-lang-btn" data-lang="python">Python</button>
            <button class="ss-lang-btn" data-lang="javascript">JS</button>
          </div>

          <!-- 3. 字号缩放器与 macOS 窗口微控制 -->
          <div class="ss-font-tools">
            <div class="ss-font-scaler">
              <button id="btn-code-font-dec" title="缩小代码字号">A-</button>
              <span id="code-font-indicator" class="ss-font-indicator">12</span>
              <button id="btn-code-font-inc" title="放大代码字号">A+</button>
            </div>

            <div class="ss-window-dots">
              <span class="ss-dot" style="background:#ef4444;"></span>
              <span class="ss-dot" style="background:#eab308;"></span>
              <span class="ss-dot" style="background:#22c55e;"></span>
            </div>
          </div>
        </div>

        <!-- 容器 1: 源码高亮与单步追踪视图 -->
        <div id="code-view-container" style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;">
          <div class="ss-terminal-body">
            <div id="code-lines-wrapper">
              <!-- 动态装载代码行 -->
            </div>
          </div>
        </div>

        <!-- 容器 2: 题目完整描述视图 -->
        <div id="problem-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载题目内容 -->
        </div>

        <!-- 容器 3: 算法精讲视图 -->
        <div id="analysis-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载精讲内容 -->
        </div>
      </div>

      <!-- 卡片 4: 独立执行日志卡片 -->
      <div class="ss-log-card">
        <div class="ss-log-header">
          <div class="ss-log-header-title">
            <span>📜 执行日志</span>
          </div>
          <span id="log-count" class="ss-log-count">0 条记录</span>
        </div>

        <div id="log-container" class="ss-log-body">
          <!-- 动态填充日志条目 -->
        </div>
      </div>

    </section>

  </main>

  <!-- 4. 力扣原题描述轻量模态弹窗 (Modal) -->
  <div id="modal-problem" class="ss-modal-backdrop hidden">
    <div class="ss-modal-content">
      <div class="ss-modal-header">
        <div class="ss-modal-title">
          <span>📋 算法原理与题目说明</span>
        </div>
        <button id="btn-close-problem-modal" class="ss-modal-close" title="关闭 (Esc)">✕</button>
      </div>
      <div id="modal-problem-body" class="ss-modal-body">
        <!-- 动态装载题目内容 -->
      </div>
    </div>
  </div>
</div>
