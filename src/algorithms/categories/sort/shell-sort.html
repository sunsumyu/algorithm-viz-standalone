<style>
  /* === 希尔排序 · 玻璃感 + 靛蓝渐变 === */
  #algo-shell-sort-view {
    --accent-a: #4f46e5;
    --accent-b: #06b6d4;
    --accent-glow: rgba(79, 70, 229, .45);
    --key-color: #f59e0b;
    --group-1: #3b82f6;
    --group-2: #06b6d4;
    --group-3: #8b5cf6;
    --group-4: #10b981;
    --group-5: #ec4899;
    width: 100%; height: 100%;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background:
      radial-gradient(ellipse at 10% 5%, rgba(79, 70, 229, .32), transparent 55%),
      radial-gradient(ellipse at 90% 95%, rgba(6, 182, 212, .28), transparent 55%),
      linear-gradient(135deg, #0c0a1f 0%, #1a1442 50%, #241b4d 100%);
    overflow: hidden;
  }
  #algo-shell-sort-view .ss-shell {
    width: 100%; height: 100%;
    display: grid; grid-template-rows: auto 1fr; overflow: hidden;
  }
  /* hero */
  #algo-shell-sort-view .ss-hero {
    padding: 18px 24px 12px;
    display: flex; gap: 18px; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, .06);
    background: rgba(8, 8, 24, .35);
    backdrop-filter: blur(14px) saturate(150%);
  }
  #algo-shell-sort-view .ss-hero-left { display: flex; align-items: center; gap: 14px; }
  #algo-shell-sort-view .ss-icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 800;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #fdf4ff; box-shadow: 0 6px 20px var(--accent-glow);
  }
  #algo-shell-sort-view h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: #f1f5f9; }
  #algo-shell-sort-view .ss-sub { color: #94a3b8; font-size: 12.5px; margin-top: 4px; }
  #algo-shell-sort-view .ss-tip {
    max-width: 480px; padding: 10px 14px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(79, 70, 229, .12), rgba(6, 182, 212, .08));
    border: 1px solid rgba(6, 182, 212, .28);
    color: #cbd5e1; font-size: 12.5px; line-height: 1.65;
  }
  #algo-shell-sort-view .ss-tip strong { color: #67e8f9; }
  /* main grid */
  #algo-shell-sort-view .ss-main {
    min-height: 0; display: grid;
    grid-template-columns: minmax(0, 1fr) 420px; gap: 16px; padding: 16px; overflow: hidden;
  }
  #algo-shell-sort-view .ss-left { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
  #algo-shell-sort-view .ss-card {
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
    overflow: hidden;
  }
  #algo-shell-sort-view .ss-card-title {
    padding: 10px 16px; border-bottom: 1px solid rgba(255, 255, 255, .06);
    display: flex; justify-content: space-between; align-items: center;
    color: #cbd5e1; font-weight: 700; font-size: 13px;
  }
  #algo-shell-sort-view .ss-tag {
    font-size: 11px; color: #67e8f9; background: rgba(6, 182, 212, .14);
    border: 1px solid rgba(6, 182, 212, .3); padding: 2px 8px; border-radius: 999px;
  }
  /* input */
  #algo-shell-sort-view .ss-input-row {
    display: grid; grid-template-columns: 1fr auto;
    gap: 10px; align-items: center; padding: 14px 16px;
  }
  #algo-shell-sort-view input {
    width: 100%; padding: 9px 12px; border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, .12);
    background: rgba(8, 8, 24, .6);
    color: #e2e8f0; font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 13px; outline: none; transition: all .2s;
  }
  #algo-shell-sort-view input:focus { border-color: var(--accent-b); box-shadow: 0 0 0 3px rgba(6, 182, 212, .15); }
  #algo-shell-sort-view button {
    padding: 8px 16px; border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 10px; background: rgba(255, 255, 255, .04);
    color: #e2e8f0; cursor: pointer; font-weight: 600; font-size: 13px;
    transition: all .25s cubic-bezier(.4, 0, .2, 1);
  }
  #algo-shell-sort-view button:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    border-color: transparent; color: #fdf4ff; transform: translateY(-1px);
    box-shadow: 0 6px 20px var(--accent-glow);
  }
  #algo-shell-sort-view button:disabled { opacity: .4; cursor: not-allowed; }
  #algo-shell-sort-view .ss-examples { padding: 0 16px 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  #algo-shell-sort-view .ss-chip {
    padding: 5px 12px; border-radius: 999px; font-size: 12px;
    background: rgba(6, 182, 212, .12); border: 1px solid rgba(6, 182, 212, .28);
    color: #67e8f9; cursor: pointer; transition: all .2s;
  }
  #algo-shell-sort-view .ss-chip:hover {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #fdf4ff; border-color: transparent; transform: translateY(-1px);
  }
  /* stats */
  #algo-shell-sort-view .ss-stats {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
  }
  #algo-shell-sort-view .ss-stat {
    position: relative; padding: 12px 14px 12px 16px;
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 14px; overflow: hidden;
  }
  #algo-shell-sort-view .ss-stat::before {
    content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 4px; border-radius: 4px;
    background: linear-gradient(180deg, var(--accent-a), var(--accent-b));
  }
  #algo-shell-sort-view .ss-stat.ss-stat--gap::before { background: linear-gradient(180deg, #818cf8, #4f46e5); }
  #algo-shell-sort-view .ss-stat.ss-stat--round::before { background: linear-gradient(180deg, #06b6d4, #0891b2); }
  #algo-shell-sort-view .ss-stat-label { color: #94a3b8; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  #algo-shell-sort-view .ss-stat-val {
    color: #e2e8f0; font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 22px; font-weight: 800; margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  #algo-shell-sort-view .ss-stat--gap .ss-stat-val { color: #a5b4fc; }
  #algo-shell-sort-view .ss-stat--round .ss-stat-val { color: #67e8f9; }
  /* visual */
  #algo-shell-sort-view .ss-visual { flex: 1; min-height: 280px; display: flex; flex-direction: column; }
  #algo-shell-sort-view .ss-canvas {
    flex: 1; min-height: 0; padding: 36px 18px 20px;
    position: relative; overflow: hidden;
    display: flex; align-items: flex-end; justify-content: center;
  }
  #algo-shell-sort-view .ss-canvas::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 100%, rgba(6, 182, 212, .12), transparent 60%);
    pointer-events: none;
  }
  #algo-shell-sort-view .ss-bars {
    position: relative; display: flex; align-items: flex-end;
    gap: 6px; height: 220px; padding-bottom: 28px;
  }
  #algo-shell-sort-view .ss-bar-wrap {
    position: relative; display: flex; flex-direction: column; align-items: center;
    width: 48px; transition: transform .45s cubic-bezier(.4, 0, .2, 1);
  }
  #algo-shell-sort-view .ss-bar {
    width: 100%; border-radius: 10px 10px 4px 4px;
    background: linear-gradient(180deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .04));
    border: 1.5px solid rgba(255, 255, 255, .14);
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 6px; color: #e2e8f0;
    font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 800;
    transition: height .45s cubic-bezier(.4, 0, .2, 1),
                background .35s, border-color .35s, box-shadow .35s, color .35s, transform .35s;
  }
  /* group colors */
  #algo-shell-sort-view .ss-bar.ss-group-0 {
    background: linear-gradient(180deg, rgba(59, 130, 246, .5), rgba(37, 99, 235, .25));
    border-color: rgba(59, 130, 246, .8);
    box-shadow: 0 4px 18px rgba(59, 130, 246, .25);
  }
  #algo-shell-sort-view .ss-bar.ss-group-1 {
    background: linear-gradient(180deg, rgba(6, 182, 212, .5), rgba(8, 145, 178, .25));
    border-color: rgba(6, 182, 212, .8);
    box-shadow: 0 4px 18px rgba(6, 182, 212, .25);
  }
  #algo-shell-sort-view .ss-bar.ss-group-2 {
    background: linear-gradient(180deg, rgba(139, 92, 246, .5), rgba(109, 40, 217, .25));
    border-color: rgba(139, 92, 246, .8);
    box-shadow: 0 4px 18px rgba(139, 92, 246, .25);
  }
  #algo-shell-sort-view .ss-bar.ss-group-3 {
    background: linear-gradient(180deg, rgba(16, 185, 129, .5), rgba(5, 150, 105, .25));
    border-color: rgba(16, 185, 129, .8);
    box-shadow: 0 4px 18px rgba(16, 185, 129, .25);
  }
  #algo-shell-sort-view .ss-bar.ss-group-4 {
    background: linear-gradient(180deg, rgba(236, 72, 153, .5), rgba(219, 39, 119, .25));
    border-color: rgba(236, 72, 153, .8);
    box-shadow: 0 4px 18px rgba(236, 72, 153, .25);
  }
  #algo-shell-sort-view .ss-bar.ss-key {
    background: linear-gradient(180deg, rgba(245, 158, 11, .55), rgba(217, 119, 6, .25)) !important;
    border-color: var(--key-color) !important;
    color: #fff7ed;
    box-shadow: 0 4px 18px rgba(245, 158, 11, .45) !important;
  }
  #algo-shell-sort-view .ss-bar.ss-compare {
    background: linear-gradient(180deg, rgba(239, 68, 68, .55), rgba(220, 38, 38, .25)) !important;
    border-color: #f87171 !important;
    color: #fff;
    box-shadow: 0 0 0 3px rgba(239, 68, 68, .25) !important;
    animation: ss-shake .35s ease-in-out;
  }
  @keyframes ss-shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }
  #algo-shell-sort-view .ss-bar.ss-shift {
    border-color: #c084fc !important;
    background: linear-gradient(180deg, rgba(168, 85, 247, .45), rgba(124, 58, 237, .2)) !important;
  }
  #algo-shell-sort-view .ss-bar.ss-drop {
    animation: ss-drop .55s cubic-bezier(.34, 1.56, .64, 1);
  }
  @keyframes ss-drop {
    0% { transform: translateY(-80px) scale(1.1); opacity: .3; }
    60% { transform: translateY(8px) scale(1.05); opacity: 1; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  #algo-shell-sort-view .ss-bar.ss-done {
    background: linear-gradient(180deg, rgba(52, 211, 153, .55), rgba(16, 185, 129, .25)) !important;
    border-color: #34d399 !important;
    box-shadow: 0 0 0 3px rgba(52, 211, 153, .3) !important;
  }
  #algo-shell-sort-view .ss-idx {
    position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%);
    color: #64748b; font-size: 11px; font-weight: 600;
    font-family: 'JetBrains Mono', Consolas, monospace;
  }
  #algo-shell-sort-view .ss-key-marker {
    position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
    color: var(--key-color); font-size: 11px; font-weight: 800;
    background: rgba(245, 158, 11, .15); border: 1px solid var(--key-color);
    padding: 2px 8px; border-radius: 6px;
    animation: ss-float 1.6s ease-in-out infinite;
  }
  @keyframes ss-float {
    0%, 100% { transform: translate(-50%, 0); }
    50% { transform: translate(-50%, -4px); }
  }
  /* result banner */
  #algo-shell-sort-view .ss-result {
    margin: 0 16px 16px; padding: 14px 18px; border-radius: 12px;
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(135deg, rgba(79, 70, 229, .12), rgba(6, 182, 212, .06));
    border: 1px solid rgba(6, 182, 212, .28);
    line-height: 1.55; font-size: 14px; color: #cffafe;
  }
  #algo-shell-sort-view .ss-result .ss-emoji {
    width: 36px; height: 36px; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 20px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #fdf4ff; box-shadow: 0 4px 14px var(--accent-glow);
  }
  #algo-shell-sort-view .ss-result.ss-result--done {
    background: linear-gradient(135deg, rgba(52, 211, 153, .18), rgba(16, 185, 129, .08));
    border-color: rgba(52, 211, 153, .4); color: #d1fae5;
  }
  #algo-shell-sort-view .ss-result.ss-result--done .ss-emoji {
    background: linear-gradient(135deg, #34d399, #10b981);
    box-shadow: 0 4px 14px rgba(52, 211, 153, .55);
  }
  /* log */
  #algo-shell-sort-view .ss-log {
    min-height: 90px; max-height: 140px; padding: 10px 14px;
    overflow: auto; background: rgba(8, 8, 24, .55);
    font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px;
    line-height: 1.7; color: #94a3b8;
  }
  #algo-shell-sort-view .ss-log-line { display: flex; gap: 8px; }
  #algo-shell-sort-view .ss-log-line .ss-log-num { color: #475569; flex-shrink: 0; }
  #algo-shell-sort-view .ss-log-line.ss-log-active { color: #67e8f9; font-weight: 600; }
  #algo-shell-sort-view .ss-log-line.ss-log-active .ss-log-num { color: var(--accent-b); }
  /* code panel */
  #algo-shell-sort-view .ss-code {
    min-height: 0; display: flex;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; overflow: hidden;
  }
  #algo-shell-sort-view .ss-code [data-code-panel] { flex: 1; min-width: 0; }
  /* controls */
  #algo-shell-sort-view .ss-controls {
    padding: 14px 18px;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border-top: 1px solid rgba(255, 255, 255, .06);
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  #algo-shell-sort-view .ss-controls .ss-ctrl-btn { min-width: 64px; }
  #algo-shell-sort-view .ss-controls .ss-ctrl-primary {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #fdf4ff; border-color: transparent;
  }
  #algo-shell-sort-view .ss-counter {
    color: #94a3b8; font-size: 13px; font-weight: 600;
    min-width: 110px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #algo-shell-sort-view .ss-speed-wrap {
    display: flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 12px;
  }
  #algo-shell-sort-view #ss-speed { width: 130px; accent-color: var(--accent-b); }
  @media (max-width: 1100px) {
    #algo-shell-sort-view .ss-main { grid-template-columns: 1fr; overflow: auto; }
    #algo-shell-sort-view .ss-code { min-height: 360px; }
  }
</style>

<div class="ss-shell">
  <div class="ss-hero">
    <div class="ss-hero-left">
      <span class="ss-icon">📏</span>
      <div>
        <h1>希尔排序</h1>
        <div class="ss-sub">按间隔分组进行插入排序 · 逐步缩小间隔 · O(n^1.5)</div>
      </div>
    </div>
    <div class="ss-tip"><strong>核心动画：</strong>将数组按 gap 分组，每组独立进行插入排序。同组元素同色显示，gap 逐轮减半直至 1，最终完成排序。</div>
  </div>
  <div class="ss-main">
    <div class="ss-left">
      <section class="ss-card">
        <div class="ss-card-title">输入 <span class="ss-tag">数组</span></div>
        <div class="ss-input-row">
          <input id="ss-array" value="5,2,9,1,5,6,4,8">
          <button id="ss-start">开始排序</button>
        </div>
        <div class="ss-examples">
          <button class="ss-chip" data-arr="5,2,9,1,5,6,4,8">默认 8 元素</button>
          <button class="ss-chip" data-arr="3,1,4,1,5,9,2,6">8 元素</button>
          <button class="ss-chip" data-arr="5,4,3,2,1">完全逆序</button>
          <button class="ss-chip" data-arr="1,2,3,4,5">已排序</button>
          <button class="ss-chip" data-arr="2,2,2,1">含重复</button>
        </div>
      </section>

      <div class="ss-stats">
        <div class="ss-stat ss-stat--gap"><div class="ss-stat-label">当前 gap</div><div class="ss-stat-val" id="ss-stat-gap">-</div></div>
        <div class="ss-stat ss-stat--round"><div class="ss-stat-label">轮数</div><div class="ss-stat-val" id="ss-stat-round">0</div></div>
        <div class="ss-stat"><div class="ss-stat-label">比较次数</div><div class="ss-stat-val" id="ss-stat-cmp">0</div></div>
        <div class="ss-stat"><div class="ss-stat-label">移动次数</div><div class="ss-stat-val" id="ss-stat-mv">0</div></div>
      </div>

      <section class="ss-card ss-visual">
        <div class="ss-card-title">排序过程</div>
        <div class="ss-canvas">
          <div class="ss-bars" id="ss-bars"></div>
        </div>
        <div class="ss-result" id="ss-result">
          <span class="ss-emoji">📏</span>
          <div id="step-message">点击「开始排序」查看希尔排序逐步过程</div>
        </div>
      </section>

      <section class="ss-card">
        <div class="ss-card-title">执行日志 <button id="ss-log-clear" style="padding:4px 10px;font-size:11px;border-radius:999px;">清空</button></div>
        <div class="ss-log" id="ss-log"></div>
      </section>
    </div>
    <aside class="ss-code"><div data-code-panel></div></aside>
  </div>
  <div class="ss-controls">
    <button id="step-reset" class="ss-ctrl-btn">⏮ 重置</button>
    <button id="step-prev" class="ss-ctrl-btn">◀ 上一步</button>
    <button id="step-play" class="ss-ctrl-btn ss-ctrl-primary">▶ 播放</button>
    <button id="step-next" class="ss-ctrl-btn">下一步 ▶</button>
    <span id="step-counter" class="ss-counter">步骤: 0 / 0</span>
    <div class="ss-speed-wrap">
      <span>速度</span>
      <input id="ss-speed" type="range" min="200" max="2500" step="100" value="700">
      <span id="ss-speed-label" style="min-width:42px;">0.7s</span>
    </div>
  </div>
</div>
