<style>
  /* === 插入排序 · 玻璃感 + 渐变 === */
  #algo-insertion-sort-view {
    --accent-a: #7c3aed;
    --accent-b: #ec4899;
    --accent-glow: rgba(236, 72, 153, .45);
    --sorted-a: #06b6d4;
    --sorted-b: #3b82f6;
    --key-color: #f59e0b;
    width: 100%; height: 100%;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background:
      radial-gradient(ellipse at 10% 5%, rgba(124, 58, 237, .32), transparent 55%),
      radial-gradient(ellipse at 90% 95%, rgba(236, 72, 153, .28), transparent 55%),
      linear-gradient(135deg, #0c0a1f 0%, #1a1442 50%, #241b4d 100%);
    overflow: hidden;
  }
  #algo-insertion-sort-view .is-shell {
    width: 100%; height: 100%;
    display: grid; grid-template-rows: auto 1fr; overflow: hidden;
  }
  /* hero */
  #algo-insertion-sort-view .is-hero {
    padding: 18px 24px 12px;
    display: flex; gap: 18px; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, .06);
    background: rgba(8, 8, 24, .35);
    backdrop-filter: blur(14px) saturate(150%);
  }
  #algo-insertion-sort-view .is-hero-left { display: flex; align-items: center; gap: 14px; }
  #algo-insertion-sort-view .is-icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 800;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #fdf4ff; box-shadow: 0 6px 20px var(--accent-glow);
  }
  #algo-insertion-sort-view h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: #f1f5f9; }
  #algo-insertion-sort-view .is-sub { color: #94a3b8; font-size: 12.5px; margin-top: 4px; }
  #algo-insertion-sort-view .is-tip {
    max-width: 480px; padding: 10px 14px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(124, 58, 237, .12), rgba(236, 72, 153, .08));
    border: 1px solid rgba(236, 72, 153, .28);
    color: #cbd5e1; font-size: 12.5px; line-height: 1.65;
  }
  #algo-insertion-sort-view .is-tip strong { color: #f0abfc; }
  /* main grid */
  #algo-insertion-sort-view .is-main {
    min-height: 0; display: grid;
    grid-template-columns: minmax(0, 1fr) 420px; gap: 16px; padding: 16px; overflow: hidden;
  }
  #algo-insertion-sort-view .is-left { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
  #algo-insertion-sort-view .is-card {
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
    overflow: hidden;
  }
  #algo-insertion-sort-view .is-card-title {
    padding: 10px 16px; border-bottom: 1px solid rgba(255, 255, 255, .06);
    display: flex; justify-content: space-between; align-items: center;
    color: #cbd5e1; font-weight: 700; font-size: 13px;
  }
  #algo-insertion-sort-view .is-tag {
    font-size: 11px; color: #f0abfc; background: rgba(236, 72, 153, .14);
    border: 1px solid rgba(236, 72, 153, .3); padding: 2px 8px; border-radius: 999px;
  }
  /* input */
  #algo-insertion-sort-view .is-input-row {
    display: grid; grid-template-columns: 1fr auto;
    gap: 10px; align-items: center; padding: 14px 16px;
  }
  #algo-insertion-sort-view input {
    width: 100%; padding: 9px 12px; border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, .12);
    background: rgba(8, 8, 24, .6);
    color: #e2e8f0; font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 13px; outline: none; transition: all .2s;
  }
  #algo-insertion-sort-view input:focus { border-color: var(--accent-b); box-shadow: 0 0 0 3px rgba(236, 72, 153, .15); }
  #algo-insertion-sort-view button {
    padding: 8px 16px; border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 10px; background: rgba(255, 255, 255, .04);
    color: #e2e8f0; cursor: pointer; font-weight: 600; font-size: 13px;
    transition: all .25s cubic-bezier(.4, 0, .2, 1);
  }
  #algo-insertion-sort-view button:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    border-color: transparent; color: #fdf4ff; transform: translateY(-1px);
    box-shadow: 0 6px 20px var(--accent-glow);
  }
  #algo-insertion-sort-view button:disabled { opacity: .4; cursor: not-allowed; }
  #algo-insertion-sort-view .is-examples { padding: 0 16px 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  #algo-insertion-sort-view .is-chip {
    padding: 5px 12px; border-radius: 999px; font-size: 12px;
    background: rgba(236, 72, 153, .12); border: 1px solid rgba(236, 72, 153, .28);
    color: #f0abfc; cursor: pointer; transition: all .2s;
  }
  #algo-insertion-sort-view .is-chip:hover {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #fdf4ff; border-color: transparent; transform: translateY(-1px);
  }
  /* stats */
  #algo-insertion-sort-view .is-stats {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
  }
  #algo-insertion-sort-view .is-stat {
    position: relative; padding: 12px 14px 12px 16px;
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 14px; overflow: hidden;
  }
  #algo-insertion-sort-view .is-stat::before {
    content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 4px; border-radius: 4px;
    background: linear-gradient(180deg, var(--accent-a), var(--accent-b));
  }
  #algo-insertion-sort-view .is-stat.is-stat--sorted::before { background: linear-gradient(180deg, var(--sorted-a), var(--sorted-b)); }
  #algo-insertion-sort-view .is-stat.is-stat--key::before { background: linear-gradient(180deg, #fbbf24, #f59e0b); }
  #algo-insertion-sort-view .is-stat-label { color: #94a3b8; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  #algo-insertion-sort-view .is-stat-val {
    color: #e2e8f0; font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 22px; font-weight: 800; margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  #algo-insertion-sort-view .is-stat--sorted .is-stat-val { color: #67e8f9; }
  #algo-insertion-sort-view .is-stat--key .is-stat-val { color: #fcd34d; }
  /* visual */
  #algo-insertion-sort-view .is-visual { flex: 1; min-height: 280px; display: flex; flex-direction: column; }
  #algo-insertion-sort-view .is-canvas {
    flex: 1; min-height: 0; padding: 36px 18px 20px;
    position: relative; overflow: hidden;
    display: flex; align-items: flex-end; justify-content: center;
  }
  #algo-insertion-sort-view .is-canvas::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 100%, rgba(236, 72, 153, .12), transparent 60%);
    pointer-events: none;
  }
  #algo-insertion-sort-view .is-bars {
    position: relative; display: flex; align-items: flex-end;
    gap: 6px; height: 220px; padding-bottom: 28px;
  }
  #algo-insertion-sort-view .is-bar-wrap {
    position: relative; display: flex; flex-direction: column; align-items: center;
    width: 48px; transition: transform .45s cubic-bezier(.4, 0, .2, 1);
  }
  #algo-insertion-sort-view .is-bar {
    width: 100%; border-radius: 10px 10px 4px 4px;
    background: linear-gradient(180deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .04));
    border: 1.5px solid rgba(255, 255, 255, .14);
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 6px; color: #e2e8f0;
    font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 800;
    transition: height .45s cubic-bezier(.4, 0, .2, 1),
                background .35s, border-color .35s, box-shadow .35s, color .35s, transform .35s;
  }
  #algo-insertion-sort-view .is-bar.is-sorted {
    background: linear-gradient(180deg, rgba(6, 182, 212, .5), rgba(59, 130, 246, .25));
    border-color: rgba(6, 182, 212, .8);
    color: #fff;
    box-shadow: 0 4px 18px rgba(6, 182, 212, .25);
  }
  #algo-insertion-sort-view .is-bar.is-key {
    background: linear-gradient(180deg, rgba(245, 158, 11, .55), rgba(217, 119, 6, .25));
    border-color: var(--key-color);
    color: #fff7ed;
    box-shadow: 0 4px 18px rgba(245, 158, 11, .45);
  }
  #algo-insertion-sort-view .is-bar.is-compare {
    background: linear-gradient(180deg, rgba(239, 68, 68, .55), rgba(220, 38, 38, .25));
    border-color: #f87171;
    color: #fff;
    box-shadow: 0 0 0 3px rgba(239, 68, 68, .25);
    animation: is-shake .35s ease-in-out;
  }
  @keyframes is-shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }
  #algo-insertion-sort-view .is-bar.is-shift {
    border-color: #c084fc;
    background: linear-gradient(180deg, rgba(168, 85, 247, .45), rgba(124, 58, 237, .2));
  }
  #algo-insertion-sort-view .is-bar.is-drop {
    animation: is-drop .55s cubic-bezier(.34, 1.56, .64, 1);
  }
  @keyframes is-drop {
    0% { transform: translateY(-80px) scale(1.1); opacity: .3; }
    60% { transform: translateY(8px) scale(1.05); opacity: 1; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  #algo-insertion-sort-view .is-bar.is-done {
    background: linear-gradient(180deg, rgba(52, 211, 153, .55), rgba(16, 185, 129, .25));
    border-color: var(--success, #34d399);
    box-shadow: 0 0 0 3px rgba(52, 211, 153, .3);
  }
  #algo-insertion-sort-view .is-idx {
    position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%);
    color: #64748b; font-size: 11px; font-weight: 600;
    font-family: 'JetBrains Mono', Consolas, monospace;
  }
  #algo-insertion-sort-view .is-key-marker {
    position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
    color: var(--key-color); font-size: 11px; font-weight: 800;
    background: rgba(245, 158, 11, .15); border: 1px solid var(--key-color);
    padding: 2px 8px; border-radius: 6px;
    animation: is-float 1.6s ease-in-out infinite;
  }
  @keyframes is-float {
    0%, 100% { transform: translate(-50%, 0); }
    50% { transform: translate(-50%, -4px); }
  }
  /* sorted area overlay */
  #algo-insertion-sort-view .is-sorted-overlay {
    position: absolute; left: 0; bottom: 0; height: 4px;
    background: linear-gradient(90deg, var(--sorted-a), var(--sorted-b));
    border-radius: 4px;
    transition: width .5s cubic-bezier(.4, 0, .2, 1), opacity .35s;
    box-shadow: 0 0 12px var(--sorted-a);
  }
  /* result banner */
  #algo-insertion-sort-view .is-result {
    margin: 0 16px 16px; padding: 14px 18px; border-radius: 12px;
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(135deg, rgba(124, 58, 237, .12), rgba(236, 72, 153, .06));
    border: 1px solid rgba(236, 72, 153, .28);
    line-height: 1.55; font-size: 14px; color: #fae8ff;
  }
  #algo-insertion-sort-view .is-result .is-emoji {
    width: 36px; height: 36px; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 20px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #fdf4ff; box-shadow: 0 4px 14px var(--accent-glow);
  }
  #algo-insertion-sort-view .is-result.is-result--done {
    background: linear-gradient(135deg, rgba(52, 211, 153, .18), rgba(16, 185, 129, .08));
    border-color: rgba(52, 211, 153, .4); color: #d1fae5;
  }
  #algo-insertion-sort-view .is-result.is-result--done .is-emoji {
    background: linear-gradient(135deg, #34d399, #10b981);
    box-shadow: 0 4px 14px rgba(52, 211, 153, .55);
  }
  /* log */
  #algo-insertion-sort-view .is-log {
    min-height: 90px; max-height: 140px; padding: 10px 14px;
    overflow: auto; background: rgba(8, 8, 24, .55);
    font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px;
    line-height: 1.7; color: #94a3b8;
  }
  #algo-insertion-sort-view .is-log-line { display: flex; gap: 8px; }
  #algo-insertion-sort-view .is-log-line .is-log-num { color: #475569; flex-shrink: 0; }
  #algo-insertion-sort-view .is-log-line.is-log-active { color: #f0abfc; font-weight: 600; }
  #algo-insertion-sort-view .is-log-line.is-log-active .is-log-num { color: var(--accent-b); }
  /* code panel */
  #algo-insertion-sort-view .is-code {
    min-height: 0; display: flex;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; overflow: hidden;
  }
  #algo-insertion-sort-view .is-code [data-code-panel] { flex: 1; min-width: 0; }
  /* controls */
  #algo-insertion-sort-view .is-controls {
    padding: 14px 18px;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border-top: 1px solid rgba(255, 255, 255, .06);
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  #algo-insertion-sort-view .is-controls .is-ctrl-btn { min-width: 64px; }
  #algo-insertion-sort-view .is-controls .is-ctrl-primary {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #fdf4ff; border-color: transparent;
  }
  #algo-insertion-sort-view .is-counter {
    color: #94a3b8; font-size: 13px; font-weight: 600;
    min-width: 110px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #algo-insertion-sort-view .is-speed-wrap {
    display: flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 12px;
  }
  #algo-insertion-sort-view #is-speed { width: 130px; accent-color: var(--accent-b); }
  @media (max-width: 1100px) {
    #algo-insertion-sort-view .is-main { grid-template-columns: 1fr; overflow: auto; }
    #algo-insertion-sort-view .is-code { min-height: 360px; }
  }
</style>

<div class="is-shell">
  <div class="is-hero">
    <div class="is-hero-left">
      <span class="is-icon">📊</span>
      <div>
        <h1>插入排序</h1>
        <div class="is-sub">将每个元素插入到左侧已排序序列的合适位置 · 稳定 · O(n²)</div>
      </div>
    </div>
    <div class="is-tip"><strong>核心动画：</strong>本轮 key 从原位「飞起」漂浮在顶部 → 与左邻逐个比较 → 比 key 大的元素依次后移 → key 像水滴一样「落入」空位。</div>
  </div>
  <div class="is-main">
    <div class="is-left">
      <section class="is-card">
        <div class="is-card-title">输入 <span class="is-tag">数组</span></div>
        <div class="is-input-row">
          <input id="is-array" value="5,2,9,1,5,6">
          <button id="is-start">开始排序</button>
        </div>
        <div class="is-examples">
          <button class="is-chip" data-arr="5,2,9,1,5,6">默认 6 元素</button>
          <button class="is-chip" data-arr="3,1,4,1,5,9,2,6">8 元素</button>
          <button class="is-chip" data-arr="5,4,3,2,1">完全逆序</button>
          <button class="is-chip" data-arr="1,2,3,4,5">已排序</button>
          <button class="is-chip" data-arr="2,2,2,1">含重复</button>
        </div>
      </section>

      <div class="is-stats">
        <div class="is-stat is-stat--sorted"><div class="is-stat-label">已排序区间</div><div class="is-stat-val" id="is-stat-sorted">1</div></div>
        <div class="is-stat"><div class="is-stat-label">外层 i</div><div class="is-stat-val" id="is-stat-i">-</div></div>
        <div class="is-stat is-stat--key"><div class="is-stat-label">key</div><div class="is-stat-val" id="is-stat-key">-</div></div>
        <div class="is-stat"><div class="is-stat-label">比较次数</div><div class="is-stat-val" id="is-stat-cmp">0</div></div>
        <div class="is-stat"><div class="is-stat-label">移动次数</div><div class="is-stat-val" id="is-stat-mv">0</div></div>
      </div>

      <section class="is-card is-visual">
        <div class="is-card-title">排序过程</div>
        <div class="is-canvas">
          <div class="is-bars" id="is-bars"></div>
        </div>
        <div class="is-result" id="is-result">
          <span class="is-emoji">📊</span>
          <div id="step-message">点击「开始排序」查看插入排序逐步过程</div>
        </div>
      </section>

      <section class="is-card">
        <div class="is-card-title">执行日志 <button id="is-log-clear" style="padding:4px 10px;font-size:11px;border-radius:999px;">清空</button></div>
        <div class="is-log" id="is-log"></div>
      </section>
    </div>
    <aside class="is-code"><div data-code-panel></div></aside>
  </div>
  <div class="is-controls">
    <button id="step-reset" class="is-ctrl-btn">⏮ 重置</button>
    <button id="step-prev" class="is-ctrl-btn">◀ 上一步</button>
    <button id="step-play" class="is-ctrl-btn is-ctrl-primary">▶ 播放</button>
    <button id="step-next" class="is-ctrl-btn">下一步 ▶</button>
    <span id="step-counter" class="is-counter">步骤: 0 / 0</span>
    <div class="is-speed-wrap">
      <span>速度</span>
      <input id="is-speed" type="range" min="200" max="2500" step="100" value="700">
      <span id="is-speed-label" style="min-width:42px;">0.7s</span>
    </div>
  </div>
</div>
