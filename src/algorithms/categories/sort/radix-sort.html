<style>
  /* === 基数排序 · 琥珀/黄色系玻璃感 === */
  #algo-radix-sort-view {
    --accent-a: #f59e0b;
    --accent-b: #fbbf24;
    --accent-glow: rgba(251, 191, 36, .45);
    --bucket-color: #d97706;
    --highlight-color: #fde68a;
    width: 100%; height: 100%;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background:
      radial-gradient(ellipse at 10% 5%, rgba(245, 158, 11, .32), transparent 55%),
      radial-gradient(ellipse at 90% 95%, rgba(251, 191, 36, .28), transparent 55%),
      linear-gradient(135deg, #1a0f00 0%, #2d1a00 50%, #3d2400 100%);
    overflow: hidden;
  }
  #algo-radix-sort-view .rs-shell {
    width: 100%; height: 100%;
    display: grid; grid-template-rows: auto 1fr; overflow: hidden;
  }
  /* hero */
  #algo-radix-sort-view .rs-hero {
    padding: 18px 24px 12px;
    display: flex; gap: 18px; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, .06);
    background: rgba(8, 8, 24, .35);
    backdrop-filter: blur(14px) saturate(150%);
  }
  #algo-radix-sort-view .rs-hero-left { display: flex; align-items: center; gap: 14px; }
  #algo-radix-sort-view .rs-icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 800;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #fef3c7; box-shadow: 0 6px 20px var(--accent-glow);
  }
  #algo-radix-sort-view h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: #f1f5f9; }
  #algo-radix-sort-view .rs-sub { color: #94a3b8; font-size: 12.5px; margin-top: 4px; }
  #algo-radix-sort-view .rs-tip {
    max-width: 480px; padding: 10px 14px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(245, 158, 11, .12), rgba(251, 191, 36, .08));
    border: 1px solid rgba(251, 191, 36, .28);
    color: #cbd5e1; font-size: 12.5px; line-height: 1.65;
  }
  #algo-radix-sort-view .rs-tip strong { color: #fcd34d; }
  /* main grid */
  #algo-radix-sort-view .rs-main {
    min-height: 0; display: grid;
    grid-template-columns: minmax(0, 1fr) 420px; gap: 16px; padding: 16px; overflow: hidden;
  }
  #algo-radix-sort-view .rs-left { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
  #algo-radix-sort-view .rs-card {
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
    overflow: hidden;
  }
  #algo-radix-sort-view .rs-card-title {
    padding: 10px 16px; border-bottom: 1px solid rgba(255, 255, 255, .06);
    display: flex; justify-content: space-between; align-items: center;
    color: #cbd5e1; font-weight: 700; font-size: 13px;
  }
  #algo-radix-sort-view .rs-tag {
    font-size: 11px; color: #fcd34d; background: rgba(251, 191, 36, .14);
    border: 1px solid rgba(251, 191, 36, .3); padding: 2px 8px; border-radius: 999px;
  }
  /* input */
  #algo-radix-sort-view .rs-input-row {
    display: grid; grid-template-columns: 1fr auto;
    gap: 10px; align-items: center; padding: 14px 16px;
  }
  #algo-radix-sort-view input {
    width: 100%; padding: 9px 12px; border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, .12);
    background: rgba(8, 8, 24, .6);
    color: #e2e8f0; font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 13px; outline: none; transition: all .2s;
  }
  #algo-radix-sort-view input:focus { border-color: var(--accent-b); box-shadow: 0 0 0 3px rgba(251, 191, 36, .15); }
  #algo-radix-sort-view button {
    padding: 8px 16px; border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 10px; background: rgba(255, 255, 255, .04);
    color: #e2e8f0; cursor: pointer; font-weight: 600; font-size: 13px;
    transition: all .25s cubic-bezier(.4, 0, .2, 1);
  }
  #algo-radix-sort-view button:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    border-color: transparent; color: #fef3c7; transform: translateY(-1px);
    box-shadow: 0 6px 20px var(--accent-glow);
  }
  #algo-radix-sort-view button:disabled { opacity: .4; cursor: not-allowed; }
  #algo-radix-sort-view .rs-examples { padding: 0 16px 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  #algo-radix-sort-view .rs-chip {
    padding: 5px 12px; border-radius: 999px; font-size: 12px;
    background: rgba(251, 191, 36, .12); border: 1px solid rgba(251, 191, 36, .28);
    color: #fcd34d; cursor: pointer; transition: all .2s;
  }
  #algo-radix-sort-view .rs-chip:hover {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #fef3c7; border-color: transparent; transform: translateY(-1px);
  }
  /* stats */
  #algo-radix-sort-view .rs-stats {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
  }
  #algo-radix-sort-view .rs-stat {
    position: relative; padding: 12px 14px 12px 16px;
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 14px; overflow: hidden;
  }
  #algo-radix-sort-view .rs-stat::before {
    content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 4px; border-radius: 4px;
    background: linear-gradient(180deg, var(--accent-a), var(--accent-b));
  }
  #algo-radix-sort-view .rs-stat.rs-stat--digit::before { background: linear-gradient(180deg, #fbbf24, #f59e0b); }
  #algo-radix-sort-view .rs-stat.rs-stat--bucket::before { background: linear-gradient(180deg, #d97706, #b45309); }
  #algo-radix-sort-view .rs-stat-label { color: #94a3b8; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  #algo-radix-sort-view .rs-stat-val {
    color: #e2e8f0; font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 22px; font-weight: 800; margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  #algo-radix-sort-view .rs-stat--digit .rs-stat-val { color: #fcd34d; }
  #algo-radix-sort-view .rs-stat--bucket .rs-stat-val { color: #fbbf24; }
  /* visual */
  #algo-radix-sort-view .rs-visual { flex: 1; min-height: 280px; display: flex; flex-direction: column; }
  #algo-radix-sort-view .rs-canvas {
    flex: 1; min-height: 0; padding: 20px 18px;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; gap: 16px;
  }
  #algo-radix-sort-view .rs-canvas::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(251, 191, 36, .08), transparent 60%);
    pointer-events: none;
  }
  /* array bars */
  #algo-radix-sort-view .rs-array-section {
    display: flex; align-items: flex-end; justify-content: center;
    gap: 6px; height: 140px; position: relative;
  }
  #algo-radix-sort-view .rs-bar-wrap {
    position: relative; display: flex; flex-direction: column; align-items: center;
    width: 42px; transition: transform .45s cubic-bezier(.4, 0, .2, 1);
  }
  #algo-radix-sort-view .rs-bar {
    width: 100%; border-radius: 8px 8px 4px 4px;
    background: linear-gradient(180deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .04));
    border: 1.5px solid rgba(255, 255, 255, .14);
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 6px; color: #e2e8f0;
    font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; font-weight: 800;
    transition: height .45s cubic-bezier(.4, 0, .2, 1),
                background .35s, border-color .35s, box-shadow .35s, color .35s, transform .35s;
  }
  #algo-radix-sort-view .rs-bar.rs-highlight {
    background: linear-gradient(180deg, rgba(253, 230, 138, .6), rgba(251, 191, 36, .3));
    border-color: var(--highlight-color);
    color: #fff;
    box-shadow: 0 0 0 3px rgba(253, 230, 138, .4);
  }
  #algo-radix-sort-view .rs-bar.rs-done {
    background: linear-gradient(180deg, rgba(52, 211, 153, .55), rgba(16, 185, 129, .25));
    border-color: #34d399;
    box-shadow: 0 0 0 3px rgba(52, 211, 153, .3);
  }
  #algo-radix-sort-view .rs-idx {
    position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%);
    color: #64748b; font-size: 10px; font-weight: 600;
    font-family: 'JetBrains Mono', Consolas, monospace;
  }
  /* buckets */
  #algo-radix-sort-view .rs-buckets {
    display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px;
    padding: 12px; background: rgba(8, 8, 24, .4);
    border-radius: 12px; border: 1px solid rgba(255, 255, 255, .06);
  }
  #algo-radix-sort-view .rs-bucket {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 8px 4px; background: rgba(20, 18, 38, .6);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 10px; min-height: 80px;
  }
  #algo-radix-sort-view .rs-bucket-label {
    font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 14px; font-weight: 800; color: #fcd34d;
  }
  #algo-radix-sort-view .rs-bucket-items {
    display: flex; flex-direction: column; gap: 4px;
    flex: 1; width: 100%; align-items: center;
  }
  #algo-radix-sort-view .rs-bucket-item {
    padding: 4px 8px; background: linear-gradient(135deg, rgba(245, 158, 11, .3), rgba(251, 191, 36, .15));
    border: 1px solid rgba(251, 191, 36, .4);
    border-radius: 6px; font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 11px; font-weight: 700; color: #fef3c7;
    animation: rs-drop .4s cubic-bezier(.34, 1.56, .64, 1);
  }
  @keyframes rs-drop {
    0% { transform: translateY(-20px) scale(.8); opacity: 0; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  /* result banner */
  #algo-radix-sort-view .rs-result {
    margin: 0 16px 16px; padding: 14px 18px; border-radius: 12px;
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(135deg, rgba(245, 158, 11, .12), rgba(251, 191, 36, .06));
    border: 1px solid rgba(251, 191, 36, .28);
    line-height: 1.55; font-size: 14px; color: #fef3c7;
  }
  #algo-radix-sort-view .rs-result .rs-emoji {
    width: 36px; height: 36px; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 20px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #fef3c7; box-shadow: 0 4px 14px var(--accent-glow);
  }
  #algo-radix-sort-view .rs-result.rs-result--done {
    background: linear-gradient(135deg, rgba(52, 211, 153, .18), rgba(16, 185, 129, .08));
    border-color: rgba(52, 211, 153, .4); color: #d1fae5;
  }
  #algo-radix-sort-view .rs-result.rs-result--done .rs-emoji {
    background: linear-gradient(135deg, #34d399, #10b981);
    box-shadow: 0 4px 14px rgba(52, 211, 153, .55);
  }
  /* log */
  #algo-radix-sort-view .rs-log {
    min-height: 90px; max-height: 140px; padding: 10px 14px;
    overflow: auto; background: rgba(8, 8, 24, .55);
    font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px;
    line-height: 1.7; color: #94a3b8;
  }
  #algo-radix-sort-view .rs-log-line { display: flex; gap: 8px; }
  #algo-radix-sort-view .rs-log-line .rs-log-num { color: #475569; flex-shrink: 0; }
  #algo-radix-sort-view .rs-log-line.rs-log-active { color: #fcd34d; font-weight: 600; }
  #algo-radix-sort-view .rs-log-line.rs-log-active .rs-log-num { color: var(--accent-b); }
  /* code panel */
  #algo-radix-sort-view .rs-code {
    min-height: 0; display: flex;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; overflow: hidden;
  }
  #algo-radix-sort-view .rs-code [data-code-panel] { flex: 1; min-width: 0; }
  /* controls */
  #algo-radix-sort-view .rs-controls {
    padding: 14px 18px;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border-top: 1px solid rgba(255, 255, 255, .06);
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  #algo-radix-sort-view .rs-controls .rs-ctrl-btn { min-width: 64px; }
  #algo-radix-sort-view .rs-controls .rs-ctrl-primary {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #fef3c7; border-color: transparent;
  }
  #algo-radix-sort-view .rs-counter {
    color: #94a3b8; font-size: 13px; font-weight: 600;
    min-width: 110px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #algo-radix-sort-view .rs-speed-wrap {
    display: flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 12px;
  }
  #algo-radix-sort-view #rs-speed { width: 130px; accent-color: var(--accent-b); }
  @media (max-width: 1100px) {
    #algo-radix-sort-view .rs-main { grid-template-columns: 1fr; overflow: auto; }
    #algo-radix-sort-view .rs-code { min-height: 360px; }
  }
</style>

<div class="rs-shell">
  <div class="rs-hero">
    <div class="rs-hero-left">
      <span class="rs-icon">🔟</span>
      <div>
        <h1>基数排序</h1>
        <div class="rs-sub">按位分配至 0-9 号桶再收集 · 稳定 · O(d·n)</div>
      </div>
    </div>
    <div class="rs-tip"><strong>核心流程：</strong>从最低位（个位）开始，将元素按该位数字分配到 0-9 号桶，再从桶中依次收集回数组，然后处理下一位（十位、百位...），直到最高位。</div>
  </div>
  <div class="rs-main">
    <div class="rs-left">
      <section class="rs-card">
        <div class="rs-card-title">输入 <span class="rs-tag">数组</span></div>
        <div class="rs-input-row">
          <input id="rs-array" value="170,45,75,90,802,24,2,66">
          <button id="rs-start">开始排序</button>
        </div>
        <div class="rs-examples">
          <button class="rs-chip" data-arr="170,45,75,90,802,24,2,66">默认 8 元素</button>
          <button class="rs-chip" data-arr="53,27,89,12,45,67,34,91">8 元素</button>
          <button class="rs-chip" data-arr="999,100,500,200,300">大数</button>
          <button class="rs-chip" data-arr="5,4,3,2,1">完全逆序</button>
          <button class="rs-chip" data-arr="1,2,3,4,5">已排序</button>
        </div>
      </section>

      <div class="rs-stats">
        <div class="rs-stat rs-stat--digit"><div class="rs-stat-label">当前位</div><div class="rs-stat-val" id="rs-stat-digit">-</div></div>
        <div class="rs-stat"><div class="rs-stat-label">总位数</div><div class="rs-stat-val" id="rs-stat-total">-</div></div>
        <div class="rs-stat rs-stat--bucket"><div class="rs-stat-label">分配次数</div><div class="rs-stat-val" id="rs-stat-dist">0</div></div>
        <div class="rs-stat rs-stat--bucket"><div class="rs-stat-label">收集次数</div><div class="rs-stat-val" id="rs-stat-collect">0</div></div>
        <div class="rs-stat"><div class="rs-stat-label">轮次</div><div class="rs-stat-val" id="rs-stat-round">0</div></div>
      </div>

      <section class="rs-card rs-visual">
        <div class="rs-card-title">排序过程</div>
        <div class="rs-canvas">
          <div class="rs-array-section" id="rs-array-top"></div>
          <div class="rs-buckets" id="rs-buckets"></div>
          <div class="rs-array-section" id="rs-array-bottom"></div>
        </div>
        <div class="rs-result" id="rs-result">
          <span class="rs-emoji">🔟</span>
          <div id="step-message">点击「开始排序」查看基数排序逐步过程</div>
        </div>
      </section>

      <section class="rs-card">
        <div class="rs-card-title">执行日志 <button id="rs-log-clear" style="padding:4px 10px;font-size:11px;border-radius:999px;">清空</button></div>
        <div class="rs-log" id="rs-log"></div>
      </section>
    </div>
    <aside class="rs-code"><div data-code-panel></div></aside>
  </div>
  <div class="rs-controls">
    <button id="step-reset" class="rs-ctrl-btn">⏮ 重置</button>
    <button id="step-prev" class="rs-ctrl-btn">◀ 上一步</button>
    <button id="step-play" class="rs-ctrl-btn rs-ctrl-primary">▶ 播放</button>
    <button id="step-next" class="rs-ctrl-btn">下一步 ▶</button>
    <span id="step-counter" class="rs-counter">步骤: 0 / 0</span>
    <div class="rs-speed-wrap">
      <span>速度</span>
      <input id="rs-speed" type="range" min="200" max="2500" step="100" value="700">
      <span id="rs-speed-label" style="min-width:42px;">0.7s</span>
    </div>
  </div>
</div>
