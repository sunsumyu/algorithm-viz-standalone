<!-- 二叉搜索树中的搜索 LeetCode 700 -->
<style>
  #algo-bst-search-view {
    padding: 1.5rem;
    color: #cdd6f4;
    max-width: 1400px;
    margin: 0 auto;
    font-family: system-ui, -apple-system, sans-serif;
  }

  @keyframes bss-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(203, 166, 247, 0.7); }
    50% { box-shadow: 0 0 0 12px rgba(203, 166, 247, 0); }
  }

  @keyframes bss-pop-in {
    0% { opacity: 0; transform: scale(0.3) translateY(10px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  .bss-theme {
    --accent-a: rgb(203, 166, 247);
    --accent-b: rgb(148, 226, 213);
    --bg-start: 20, 18, 38;
    --bg-mid: 25, 23, 50;
    --bg-end: 35, 32, 60;
  }

  .bss-viz-container {
    position: relative;
    min-height: calc(100vh - 3rem);
  }

  .bss-root {
    background: radial-gradient(ellipse at 8% 6%, rgba(var(--accent-a), 0.3), transparent 55%),
                radial-gradient(ellipse at 92% 94%, rgba(var(--accent-b), 0.3), transparent 55%),
                linear-gradient(135deg, rgb(var(--bg-start)), rgb(var(--bg-mid)), rgb(var(--bg-end)));
    min-height: 100%;
    padding: 1.5rem;
    border-radius: 20px;
  }

  .bss-header {
    background: rgba(20, 18, 38, 0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border-radius: 16px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1rem;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .bss-header-left {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .bss-back-btn {
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    color: #cdd6f4;
  }

  .bss-back-btn:hover {
    background: rgba(255, 255, 255, 0.1);
  }

  .bss-title {
    font-size: 22px;
    font-weight: 800;
    margin: 0;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .bss-subtitle {
    font-size: 0.78rem;
    color: #6c7086;
    margin-top: 0.2rem;
  }

  .bss-tip {
    background: rgba(203, 166, 247, 0.1);
    border: 1px solid rgba(203, 166, 247, 0.25);
    border-radius: 10px;
    padding: 0.6rem 0.9rem;
    font-size: 0.78rem;
    color: #cba6f7;
    max-width: 280px;
  }

  .bss-main-content {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 1rem;
  }

  .bss-left-col {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .bss-panel {
    background: rgba(20, 18, 38, 0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }

  .bss-panel-header {
    background: rgba(25, 24, 42, 0.6);
    padding: 0.6rem 0.9rem;
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--accent-a);
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }

  .bss-tree-container {
    padding: 1rem;
    min-height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .bss-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.5rem;
    padding: 0.8rem;
  }

  .bss-stat-item {
    text-align: center;
  }

  .bss-stat-value {
    font-size: 1.2rem;
    font-weight: 800;
    color: var(--accent-a);
  }

  .bss-stat-label {
    font-size: 0.65rem;
    color: #6c7086;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .bss-controls {
    display: flex;
    gap: 0.3rem;
    padding: 0.8rem;
    flex-wrap: wrap;
  }

  .bss-btn {
    background: rgba(49, 50, 68, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #cdd6f4;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 8px;
    flex-shrink: 0;
  }

  .bss-btn:hover:not(:disabled) {
    background: rgba(49, 50, 68, 0.8);
    border-color: rgba(255, 255, 255, 0.2);
  }

  .bss-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .bss-btn-play {
    flex: 1;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #111;
    font-weight: 600;
    min-width: 70px;
  }

  .bss-message {
    text-align: center;
    padding: 0.65rem;
    font-size: 0.88rem;
    color: #9399b2;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
    transition: all 0.2s;
  }

  .bss-message.success {
    color: var(--accent-b);
    font-weight: 600;
  }

  .bss-message.error {
    color: #f38ba8;
    font-weight: 600;
  }

  .bss-log {
    padding: 0.6rem 0.8rem;
    max-height: 150px;
    overflow-y: auto;
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 0.75rem;
    line-height: 1.6;
  }

  .bss-log div {
    color: #6c7086;
    transition: color 0.2s;
  }

  .bss-log div.active {
    color: var(--accent-a);
    font-weight: 600;
  }

  .bss-input-row {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    padding: 0.8rem;
  }

  .bss-input-row label {
    font-size: 0.8rem;
    color: #9399b2;
  }

  .bss-input-num {
    background: rgba(49, 50, 68, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 6px;
    padding: 0.4rem 0.6rem;
    color: #cdd6f4;
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 0.85rem;
    width: 80px;
    outline: none;
    transition: border-color 0.2s;
  }

  .bss-input-num:focus {
    border-color: var(--accent-a);
  }

  .bss-example-row {
    display: flex;
    gap: 0.4rem;
    padding: 0.8rem;
    flex-wrap: wrap;
  }

  .bss-example-btn {
    background: rgba(49, 50, 68, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 999px;
    padding: 0.3rem 0.7rem;
    font-size: 0.72rem;
    color: #cdd6f4;
    cursor: pointer;
    transition: all 0.2s;
  }

  .bss-example-btn:hover {
    background: rgba(49, 50, 68, 0.8);
    border-color: var(--accent-a);
  }

  .bss-code-col {
    display: flex;
    flex-direction: column;
  }

  @media (max-width: 1100px) {
    .bss-main-content {
      grid-template-columns: 1fr;
    }
  }
</style>

<div class="bss-viz-container">
  <div class="bss-root bss-theme">
    <div class="bss-header">
      <div class="bss-header-left">
        <button id="btn-back" class="bss-back-btn" title="返回">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M19 12H5M12 19l-7-7 7-7" />
          </svg>
        </button>
        <div>
          <h1 class="bss-title">二叉搜索树中的搜索</h1>
          <div class="bss-subtitle">LeetCode 700 · 利用 BST 性质高效查找目标节点</div>
        </div>
      </div>
      <div class="bss-tip">💡 思路：目标 < 当前值 → 左子树，目标 > 当前值 → 右子树</div>
    </div>

    <div class="bss-main-content">
      <div class="bss-left-col">
        <div class="bss-panel">
          <div class="bss-panel-header">🌳 BST 搜索过程</div>
          <div id="bss-tree" class="bss-tree-container"></div>
          <div id="bss-message" class="bss-message">设置目标值后点击「开始搜索」</div>
        </div>

        <div class="bss-panel">
          <div class="bss-panel-header">📊 状态面板</div>
          <div class="bss-stats">
            <div class="bss-stat-item">
              <div class="bss-stat-value" id="bss-depth">0</div>
              <div class="bss-stat-label">深度</div>
            </div>
            <div class="bss-stat-item">
              <div class="bss-stat-value" id="bss-current">-</div>
              <div class="bss-stat-label">当前节点</div>
            </div>
            <div class="bss-stat-item">
              <div class="bss-stat-value" id="bss-direction">-</div>
              <div class="bss-stat-label">方向</div>
            </div>
            <div class="bss-stat-item">
              <div class="bss-stat-value" id="bss-compared">0</div>
              <div class="bss-stat-label">比较次数</div>
            </div>
          </div>
        </div>

        <div class="bss-panel">
          <div class="bss-panel-header">📋 执行日志</div>
          <div id="bss-log" class="bss-log"></div>
        </div>
      </div>

      <div class="bss-code-col">
        <div class="bss-panel" style="flex:1;">
          <div class="bss-panel-header">代码</div>
          <div data-code-panel style="flex:1;min-height:260px;overflow:hidden;"></div>
        </div>

        <div class="bss-panel" style="margin-top:0.75rem;">
          <div class="bss-panel-header">⚙️ 控制</div>
          <div class="bss-controls">
            <button id="step-reset" class="bss-btn" title="重置">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                <path d="M3 3v5h5" />
              </svg>
            </button>
            <button id="step-prev" class="bss-btn" title="上一步">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6" /></svg>
            </button>
            <button id="step-play" class="bss-btn bss-btn-play">播放</button>
            <button id="step-next" class="bss-btn" title="下一步">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6" /></svg>
            </button>
          </div>
          <div style="padding: 0 0.8rem 0.6rem;">
            <span style="font-size: 0.78rem; color: #6c7086;" id="step-counter">步骤: 0 / 0</span>
            <input type="range" id="step-speed" min="200" max="2000" value="900" step="100"
                   style="width:100%; margin-top:0.4rem; accent-color: var(--accent-a);" />
            <div style="text-align:center; font-size:0.72rem; color:#585b70;">
              速度: <span id="step-speed-label">0.9s</span>
            </div>
          </div>
        </div>

        <div class="bss-panel" style="margin-top:0.75rem;">
          <div class="bss-panel-header">🎯 搜索目标</div>
          <div class="bss-input-row">
            <label>目标值:</label>
            <input type="number" id="bss-target" class="bss-input-num" value="9">
            <button id="bss-start" class="bss-btn bss-btn-play" style="flex:none; width:auto; padding: 0 1rem;">搜索</button>
          </div>
        </div>

        <div class="bss-panel" style="margin-top:0.75rem;">
          <div class="bss-panel-header">📌 示例</div>
          <div class="bss-example-row">
            <button class="bss-example-btn" data-id="1">示例1: BST [4,2,7,1,3], 找9</button>
            <button class="bss-example-btn" data-id="2">示例2: BST [4,2,7,1,3], 找2</button>
            <button class="bss-example-btn" data-id="3">示例3: BST [4,2,7,1,3,5,10], 找5</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
