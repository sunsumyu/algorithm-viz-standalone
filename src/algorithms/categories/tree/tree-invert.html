<!-- 二叉树翻转 LeetCode 226 -->
<style>
  #algo-tree-invert-view {
    padding: 1.5rem;
    color: #cdd6f4;
    max-width: 1400px;
    margin: 0 auto;
    font-family: system-ui, -apple-system, sans-serif;
  }

  @keyframes ti-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(45, 212, 191, 0.7); }
    50% { box-shadow: 0 0 0 12px rgba(45, 212, 191, 0); }
  }

  @keyframes ti-pop-in {
    0% { opacity: 0; transform: scale(0.3) translateY(10px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  @keyframes ti-rotate-swap {
    0% { transform: rotateY(0deg) scale(1); }
    25% { transform: rotateY(90deg) scale(1.1); }
    50% { transform: rotateY(180deg) scale(1.2); }
    75% { transform: rotateY(270deg) scale(1.1); }
    100% { transform: rotateY(360deg) scale(1); }
  }

  @keyframes ti-flip-x {
    0% { transform: translateX(0); }
    50% { transform: translateX(15px) rotate(10deg); }
    100% { transform: translateX(0); }
  }

  .ti-theme {
    --accent-a: rgb(45, 212, 191);
    --accent-b: rgb(59, 130, 246);
    --bg-start: 18, 16, 36;
    --bg-mid: 22, 20, 48;
    --bg-end: 30, 28, 56;
  }

  .ti-container {
    position: relative;
    min-height: calc(100vh - 3rem);
  }

  .ti-root {
    background: radial-gradient(ellipse at 8% 6%, rgba(var(--accent-a), 0.18), transparent 55%),
                radial-gradient(ellipse at 92% 94%, rgba(var(--accent-b), 0.18), transparent 55%),
                linear-gradient(135deg, rgb(var(--bg-start)), rgb(var(--bg-mid)), rgb(var(--bg-end)));
    min-height: 100%;
    padding: 1.5rem;
    border-radius: 20px;
  }

  .ti-header {
    background: rgba(20, 18, 38, 0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border-radius: 16px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1rem;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .ti-header-left {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .ti-back-btn {
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    color: #cdd6f4;
  }

  .ti-back-btn:hover {
    background: rgba(255, 255, 255, 0.1);
  }

  .ti-icon-badge {
    width: 44px;
    height: 44px;
    border-radius: 11px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    box-shadow: 0 4px 12px rgba(45, 212, 191, 0.3);
  }

  .ti-title {
    font-size: 22px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 0;
  }

  .ti-header-right {
    display: flex;
    gap: 0.8rem;
    align-items: center;
  }

  .ti-legend {
    display: flex;
    gap: 0.8rem;
    align-items: center;
    font-size: 0.75rem;
    color: #9399b2;
  }

  .ti-legend-item {
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }

  .ti-legend-color {
    width: 12px;
    height: 12px;
    border-radius: 50%;
  }

  .ti-main-content {
    display: flex;
    flex-direction: row;
    flex: 1;
    gap: 1rem;
  }

  .ti-col-viz {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .ti-col-code {
    width: 320px;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    background: rgba(15, 14, 26, 0.5);
    border-radius: 16px;
    overflow: hidden;
  }

  .ti-panel {
    background: rgba(20, 18, 38, 0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }

  .ti-code-panel-header {
    padding: 0.6rem 0.9rem;
    background: rgba(25, 24, 42, 0.6);
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--accent-a);
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }

  .ti-canvas-container {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: rgba(15, 14, 26, 0.5);
    min-height: 300px;
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  .ti-canvas-container canvas {
    width: 100%;
    height: 100%;
  }

  .ti-status {
    background: rgba(15, 14, 26, 0.5);
    border-radius: 10px;
    padding: 0.75rem 1rem;
    margin-top: 0.75rem;
    text-align: center;
    font-size: 0.9rem;
    color: #cdd6f4;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  .ti-footer {
    background: rgba(20, 18, 38, 0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 0.75rem 1.2rem;
    margin-top: 0.75rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
  }

  .ti-control-group {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .ti-btn-icon {
    background: rgba(49, 50, 68, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #cdd6f4;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 8px;
  }

  .ti-btn-icon:hover:not(:disabled) {
    background: rgba(49, 50, 68, 0.8);
    border-color: rgba(255, 255, 255, 0.2);
  }

  .ti-btn-icon:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .ti-btn-play {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #111;
    font-weight: 600;
    border: none;
    cursor: pointer;
    width: 80px;
    height: 38px;
    border-radius: 8px;
    box-shadow: 0 4px 12px rgba(45, 212, 191, 0.3);
    transition: all 0.2s;
  }

  .ti-btn-play:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(45, 212, 191, 0.4);
  }

  .ti-speed-label {
    font-size: 0.8rem;
    color: #6c7086;
  }

  .ti-speed-slider {
    width: 100px;
    accent-color: var(--accent-a);
  }

  .ti-speed-value {
    font-size: 0.8rem;
    color: #6c7086;
    width: 35px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* Swap animation classes for canvas-drawn nodes */
  canvas.swap-animation {
    animation: ti-flip-x 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @media (max-width: 1100px) {
    .ti-main-content { flex-direction: column; }
    .ti-col-code { width: 100%; }
    .ti-footer { flex-direction: column; gap: 0.75rem; }
  }
</style>

<div class="ti-container">
  <div class="ti-root">
    <div class="ti-header">
      <div class="ti-header-left">
        <button id="btn-back" class="ti-back-btn" title="返回">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M19 12H5M12 19l-7-7 7-7" />
          </svg>
        </button>
        <div class="ti-icon-badge">🔄</div>
        <h1 class="ti-title">二叉树翻转</h1>
      </div>
      <div class="ti-header-right">
        <div class="ti-legend">
          <div class="ti-legend-item"><div class="ti-legend-color" style="background:rgba(49,50,68,0.8);"></div> 普通</div>
          <div class="ti-legend-item"><div class="ti-legend-color" style="background:var(--accent-a);"></div> 当前</div>
          <div class="ti-legend-item"><div class="ti-legend-color" style="background:#f9e2af;"></div> 已交换</div>
        </div>
      </div>
    </div>

    <div class="ti-main-content">
      <div class="ti-col-viz">
        <div class="ti-canvas-container">
          <canvas id="tree-invert-canvas"></canvas>
        </div>
        <div id="tree-invert-status" class="ti-status">初始二叉树，点击播放查看翻转过程</div>
      </div>
      <div class="ti-col-code">
        <div class="ti-code-panel-header">代码</div>
        <div data-code-panel style="flex:1;overflow:hidden;"></div>
      </div>
    </div>

    <div class="ti-footer">
      <div class="ti-control-group">
        <button id="tree-invert-reset" class="ti-btn-icon" title="⏮重置">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
          </svg>
        </button>
        <button id="tree-invert-prev" class="ti-btn-icon" title="◀上一步">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6" /></svg>
        </button>
        <button id="tree-invert-play" class="ti-btn-play">▶播放</button>
        <button id="tree-invert-next" class="ti-btn-icon" title="下一步▶">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6" /></svg>
        </button>
      </div>
      <div class="ti-control-group">
        <span class="ti-speed-label">速度</span>
        <input type="range" id="tree-invert-speed" class="ti-speed-slider" min="200" max="3000" step="100" value="1000">
        <span id="tree-invert-speed-label" class="ti-speed-value">1.0s</span>
      </div>
    </div>
  </div>
</div>
