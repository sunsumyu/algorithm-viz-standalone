<style>
  .apv { padding:1.5rem; color:#cdd6f4; max-width:1400px; margin:0 auto; font-family:system-ui,sans-serif }
  .aproot { background:radial-gradient(ellipse at 8% 6%,rgba(250,179,135,.3),transparent 55%),radial-gradient(ellipse at 92% 94%,rgba(249,226,175,.3),transparent 55%),linear-gradient(135deg,rgb(20,18,38),rgb(25,23,50),rgb(35,32,60)); min-height:100%; padding:1.5rem; border-radius:20px }
  .aph { background:rgba(20,18,38,.55); backdrop-filter:blur(18px); border-radius:16px; padding:1.25rem 1.5rem; margin-bottom:1rem; box-shadow:0 8px 32px rgba(0,0,0,.2); display:flex; justify-content:space-between; align-items:center }
  .aptitle { font-size:22px; font-weight:800; margin:0; background:linear-gradient(135deg,rgb(250,179,135),rgb(249,226,175)); -webkit-background-clip:text; -webkit-text-fill-color:transparent }
  .apsub { font-size:.78rem; color:#6c7086 }
  .aptip { background:rgba(250,179,135,.1); border:1px solid rgba(250,179,135,.25); border-radius:10px; padding:.6rem .9rem; font-size:.78rem; color:rgb(250,179,135); max-width:280px }
  .apmain { display:grid; grid-template-columns:1fr 320px; gap:1rem }
  .appanel { background:rgba(20,18,38,.55); backdrop-filter:blur(18px); border:1px solid rgba(255,255,255,.08); border-radius:16px; overflow:hidden; box-shadow:0 12px 40px rgba(0,0,0,.35) }
  .apph { background:rgba(25,24,42,.6); padding:.6rem .9rem; font-size:.65rem; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:rgb(250,179,135); border-bottom:1px solid rgba(255,255,255,.05) }
  .aptree { padding:1rem; min-height:260px; display:flex; align-items:center; justify-content:center }
  .apstats { display:grid; grid-template-columns:repeat(4,1fr); gap:.5rem; padding:.8rem }
  .apstats div { text-align:center }
  .apsv { font-size:1.2rem; font-weight:800; color:rgb(250,179,135) }
  .apsl { font-size:.65rem; color:#6c7086; text-transform:uppercase; letter-spacing:.05em }
  .apctrls { display:flex; gap:.3rem; padding:.8rem; flex-wrap:wrap }
  .apbtn { background:rgba(49,50,68,.6); border:1px solid rgba(255,255,255,.1); color:#cdd6f4; cursor:pointer; transition:all .2s; display:flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:8px; flex-shrink:0 }
  .apbtn:hover:not(:disabled) { background:rgba(49,50,68,.8) }
  .apbtn:disabled { opacity:.4; cursor:not-allowed }
  .applay { flex:1; background:linear-gradient(135deg,rgb(250,179,135),rgb(249,226,175)); color:#111; font-weight:600; min-width:70px }
  .apmsg { text-align:center; padding:.65rem; font-size:.88rem; color:#9399b2; border-top:1px solid rgba(255,255,255,.05) }
  .apmsg.success { color:rgb(249,226,175); font-weight:600 }
  .apmsg.error { color:#f38ba8; font-weight:600 }
  .aplog { padding:.6rem .8rem; max-height:150px; overflow-y:auto; font-family:ui-monospace,monospace; font-size:.75rem; line-height:1.6 }
  .aplog div { color:#6c7086 }
  .aplog div.active { color:rgb(250,179,135); font-weight:600 }
  .apex { display:flex; gap:.4rem; padding:.8rem; flex-wrap:wrap }
  .apex-btn { background:rgba(49,50,68,.5); border:1px solid rgba(255,255,255,.1); border-radius:999px; padding:.3rem .7rem; font-size:.72rem; color:#cdd6f4; cursor:pointer; transition:all .2s }
  .apex-btn:hover { background:rgba(49,50,68,.8); border-color:rgb(250,179,135) }
  @media (max-width:1100px){.apmain{grid-template-columns:1fr}}
</style>
<div style="position:relative;min-height:calc(100vh - 3rem)"><div class="aproot">
<div class="aph"><div style="display:flex;align-items:center;gap:1rem"><button id="btn-back" style="background:transparent;border:1px solid rgba(255,255,255,.1);border-radius:8px;cursor:pointer;width:36px;height:36px;color:#cdd6f4"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button><div><h1 class="aptitle">🛤️ 二叉树所有路径</h1><div class="apsub">LeetCode 257</div></div></div><div class="aptip">💡 从根到叶子的所有路径</div></div>
<div class="apmain"><div style="display:flex;flex-direction:column;gap:.75rem">
<div class="appanel"><div class="apph">🌳 二叉树</div><div id="aptree" class="aptree"></div><div id="apmsg" class="apmsg">点击演示查看过程</div></div>
<div class="appanel"><div class="apph">📊 状态</div><div class="apstats"><div><div class="apsv" id="apcur">-</div><div class="apsl">当前</div></div><div><div class="apsv" id="apdepth">0</div><div class="apsl">深度</div></div><div><div class="apsv" id="apaux">-</div><div class="apsl">辅助</div></div><div><div class="apsv" id="apresult">?</div><div class="apsl">结果</div></div></div></div>
<div class="appanel"><div class="apph">📋 日志</div><div id="aplog" class="aplog"></div></div>
</div><div style="display:flex;flex-direction:column">
<div class="appanel" style="flex:1"><div class="apph">代码</div><div data-code-panel style="flex:1;min-height:260px;overflow:hidden"></div></div>
<div class="appanel" style="margin-top:.75rem"><div class="apph">⚙️ 控制</div><div class="apctrls"><button id="step-reset" class="apbtn" title="重置"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button><button id="step-prev" class="apbtn" title="上一步"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg></button><button id="step-play" class="apbtn applay">播放</button><button id="step-next" class="apbtn" title="下一步"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg></button></div>
<div style="padding:0 .8rem .6rem"><span style="font-size:.78rem;color:#6c7086" id="step-counter">步骤: 0 / 0</span><input type="range" id="step-speed" min="200" max="2000" value="900" step="100" style="width:100%;margin-top:.4rem;accent-color:rgb(250,179,135)"><div style="text-align:center;font-size:.72rem;color:#585b70">速度: <span id="step-speed-label">0.9s</span></div></div></div>
<div class="appanel" style="margin-top:.75rem"><div class="apph">📌 示例</div><div class="apex"><button class="ap-ex-btn" data-id="1">[1,2,3,null,5]</button><button class="ap-ex-btn" data-id="2">[1,2,3,4,5,6,7]</button><button class="ap-ex-btn" data-id="3">[1]</button></div></div>
</div></div></div></div>
