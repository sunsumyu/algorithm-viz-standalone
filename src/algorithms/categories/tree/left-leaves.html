<style>
  .llv { padding:1.5rem; color:#cdd6f4; max-width:1400px; margin:0 auto; font-family:system-ui,sans-serif }
  .llroot { background:radial-gradient(ellipse at 8% 6%,rgba(166,227,161,.3),transparent 55%),radial-gradient(ellipse at 92% 94%,rgba(137,220,235,.3),transparent 55%),linear-gradient(135deg,rgb(20,18,38),rgb(25,23,50),rgb(35,32,60)); min-height:100%; padding:1.5rem; border-radius:20px }
  .llh { background:rgba(20,18,38,.55); backdrop-filter:blur(18px); border-radius:16px; padding:1.25rem 1.5rem; margin-bottom:1rem; box-shadow:0 8px 32px rgba(0,0,0,.2); display:flex; justify-content:space-between; align-items:center }
  .lltitle { font-size:22px; font-weight:800; margin:0; background:linear-gradient(135deg,rgb(166,227,161),rgb(137,220,235)); -webkit-background-clip:text; -webkit-text-fill-color:transparent }
  .llsub { font-size:.78rem; color:#6c7086 }
  .lltip { background:rgba(166,227,161,.1); border:1px solid rgba(166,227,161,.25); border-radius:10px; padding:.6rem .9rem; font-size:.78rem; color:rgb(166,227,161); max-width:280px }
  .llmain { display:grid; grid-template-columns:1fr 320px; gap:1rem }
  .llpanel { background:rgba(20,18,38,.55); backdrop-filter:blur(18px); border:1px solid rgba(255,255,255,.08); border-radius:16px; overflow:hidden; box-shadow:0 12px 40px rgba(0,0,0,.35) }
  .llph { background:rgba(25,24,42,.6); padding:.6rem .9rem; font-size:.65rem; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:rgb(166,227,161); border-bottom:1px solid rgba(255,255,255,.05) }
  .lltree { padding:1rem; min-height:260px; display:flex; align-items:center; justify-content:center }
  .llstats { display:grid; grid-template-columns:repeat(4,1fr); gap:.5rem; padding:.8rem }
  .llstats div { text-align:center }
  .llsv { font-size:1.2rem; font-weight:800; color:rgb(166,227,161) }
  .llsl { font-size:.65rem; color:#6c7086; text-transform:uppercase; letter-spacing:.05em }
  .llctrls { display:flex; gap:.3rem; padding:.8rem; flex-wrap:wrap }
  .llbtn { background:rgba(49,50,68,.6); border:1px solid rgba(255,255,255,.1); color:#cdd6f4; cursor:pointer; transition:all .2s; display:flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:8px; flex-shrink:0 }
  .llbtn:hover:not(:disabled) { background:rgba(49,50,68,.8) }
  .llbtn:disabled { opacity:.4; cursor:not-allowed }
  .llplay { flex:1; background:linear-gradient(135deg,rgb(166,227,161),rgb(137,220,235)); color:#111; font-weight:600; min-width:70px }
  .llmsg { text-align:center; padding:.65rem; font-size:.88rem; color:#9399b2; border-top:1px solid rgba(255,255,255,.05) }
  .llmsg.success { color:rgb(137,220,235); font-weight:600 }
  .llmsg.error { color:#f38ba8; font-weight:600 }
  .lllog { padding:.6rem .8rem; max-height:150px; overflow-y:auto; font-family:ui-monospace,monospace; font-size:.75rem; line-height:1.6 }
  .lllog div { color:#6c7086 }
  .lllog div.active { color:rgb(166,227,161); font-weight:600 }
  .llex { display:flex; gap:.4rem; padding:.8rem; flex-wrap:wrap }
  .llex-btn { background:rgba(49,50,68,.5); border:1px solid rgba(255,255,255,.1); border-radius:999px; padding:.3rem .7rem; font-size:.72rem; color:#cdd6f4; cursor:pointer; transition:all .2s }
  .llex-btn:hover { background:rgba(49,50,68,.8); border-color:rgb(166,227,161) }
  @media (max-width:1100px){.llmain{grid-template-columns:1fr}}
</style>
<div style="position:relative;min-height:calc(100vh - 3rem)"><div class="llroot">
<div class="llh"><div style="display:flex;align-items:center;gap:1rem"><button id="btn-back" style="background:transparent;border:1px solid rgba(255,255,255,.1);border-radius:8px;cursor:pointer;width:36px;height:36px;color:#cdd6f4"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button><div><h1 class="lltitle">🍃 左叶子之和</h1><div class="llsub">LeetCode 404</div></div></div><div class="lltip">💡 左叶子 = 某节点的左子节点且为叶子</div></div>

</div><div style="display:flex;flex-direction:column">
