        <div style="display: flex; align-items: center; gap: 4px; flex-shrink: 0;">
          <button id="btn-step-prev" title="上一步" class="tt-ctrl-btn">◀</button>
          <button id="btn-play-pause" title="自动播放/暂停" class="tt-play-circle-btn">
            <span id="play-icon">▶</span>
          </button>
          <button id="btn-step-next" title="下一步" class="tt-ctrl-btn">▶</button>
        </div>
        <div style="display: flex; align-items: center; gap: 4px; margin-left: 6px;">
          <select id="select-speed" style="padding: 2px 6px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 11px; background: #ffffff;">
            <option value="1200">慢速</option>
            <option value="600" selected>正常</option>
            <option value="250">快速</option>
          </select>
        </div>
      </div>

      <!-- 卡片 2: 状态空间与指标监视器 -->
      <div class="tt-card">
        <div class="tt-card-header">
          <div>
            <div class="tt-card-title">🧭 遍历指标与输出序列监视器 (Traversal Monitor)</div>
            <div class="tt-card-desc">当前节点、递归深度、已输出节点与遍历模式</div>
          </div>
          <span id="badge-mode-name" class="tt-counter-badge" style="color:#2563eb; background:#eff6ff; border-color:#bfdbfe;">前序遍历</span>
        </div>

        <!-- 状态空间展示盒 -->
        <div class="tt-state-space-box">
          <div class="tt-metrics-grid">
            <div class="tt-metric-card">
              <span class="tt-metric-label">当前节点 val</span>
              <span class="tt-metric-val" id="metric-cur-node" style="color: #f59e0b;">1</span>
            </div>
            <div class="tt-metric-card">
              <span class="tt-metric-label">调用栈深度 depth</span>
              <span class="tt-metric-val" id="metric-depth" style="color: #2563eb;">0</span>
            </div>
            <div class="tt-metric-card">
              <span class="tt-metric-label">已访问节点数</span>
              <span class="tt-metric-val" id="metric-visited-count" style="color: #0f172a;">0</span>
            </div>
            <div class="tt-metric-card">
              <span class="tt-metric-label">当前遍历模式</span>
              <span class="tt-metric-val" id="metric-mode-name" style="color: #3b82f6;">前序 (根左右)</span>
            </div>
          </div>

          <div class="tt-seq-box" id="tt-seq-box">
            <span style="color: #64748b; font-weight: 700;">输出序列:</span>
            <span id="traversal-result" style="color: #10b981; font-weight: 800;">[ ]</span>
          </div>

          <div class="tt-live-alert">
            <span>💡</span> <span id="tt-live-text">准备就绪，点击运行开始二叉树遍历。</span>
          </div>
        </div>
      </div>

    </section>

    <!-- ================= 右侧：代码终端 + 执行日志 ================= -->
    <section class="tt-right-section">

      <!-- 卡片 3: 暗色代码终端面板 -->
      <div class="tt-dark-terminal">
        <div class="tt-terminal-header">
          <!-- 1. 主 Tab 切换器 (源码 / 题目 / 精讲) -->
          <div class="tt-tab-group">
            <button id="btn-tab-code" class="tt-tab-item active">💻 代码调试</button>
            <button id="btn-tab-problem" class="tt-tab-item">📋 题目描述</button>
            <button id="btn-tab-analysis" class="tt-tab-item">💡 算法精讲</button>
          </div>

          <!-- 2. 多语言切换器 -->
          <div class="tt-lang-group" id="code-lang-tabs">
            <button class="tt-lang-btn active" data-lang="java">Java</button>
            <button class="tt-lang-btn" data-lang="cpp">C++</button>
            <button class="tt-lang-btn" data-lang="python">Python</button>
            <button class="tt-lang-btn" data-lang="javascript">JS</button>
          </div>

          <!-- 3. 字号缩放器与 macOS 窗口微控制 -->
          <div class="tt-font-tools">
            <div class="tt-font-scaler">
              <button id="btn-code-font-dec" title="缩小代码字号">A-</button>
              <span id="code-font-indicator" class="tt-font-indicator">12</span>
              <button id="btn-code-font-inc" title="放大代码字号">A+</button>
            </div>

            <div class="tt-window-dots">
              <span class="tt-dot" style="background:#ef4444;"></span>
              <span class="tt-dot" style="background:#eab308;"></span>
              <span class="tt-dot" style="background:#22c55e;"></span>
            </div>
          </div>
        </div>

        <!-- 容器 1: 源码高亮与单步追踪视图 -->
        <div id="code-view-container" style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;">
          <div class="tt-terminal-body">
            <div id="code-lines-wrapper">
              <!-- 动态装载代码行 -->
            </div>
          </div>
        </div>

        <!-- 容器 2: 题目完整描述视图 -->
        <div id="problem-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载题目内容 -->
        </div>

        <!-- 容器 3: 算法精讲视图 -->
        <div id="analysis-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载精讲内容 -->
        </div>
      </div>

      <!-- 卡片 4: 独立执行日志卡片 -->
      <div class="tt-log-card">
        <div class="tt-log-header">
          <div class="tt-log-header-title">
            <span>📜 执行日志</span>
          </div>
          <span id="log-count" class="tt-log-count">0 条记录</span>
        </div>

        <div id="log-container" class="tt-log-body">
          <!-- 动态填充日志条目 -->
        </div>
      </div>

    </section>

  </main>

  <!-- 4. 力扣原题描述轻量模态弹窗 (Modal) -->
  <div id="modal-problem" class="tt-modal-backdrop hidden">
    <div class="tt-modal-content">
      <div class="tt-modal-header">
        <div class="tt-modal-title">
          <span>📋 算法原理与题目说明</span>
        </div>
        <button id="btn-close-problem-modal" class="tt-modal-close" title="关闭 (Esc)">✕</button>
      </div>
      <div id="modal-problem-body" class="tt-modal-body">
        <!-- 动态装载题目内容 -->
      </div>
    </div>
  </div>
</div>
