<!-- 对称二叉树 LeetCode 101 -->
<style>
  #algo-tree-symmetric-view {
    padding: 1.5rem;
    color: #cdd6f4;
    max-width: 1400px;
    margin: 0 auto;
    font-family: system-ui, -apple-system, sans-serif;
  }

  @keyframes ts-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7); }
    50% { box-shadow: 0 0 0 12px rgba(52, 211, 153, 0); }
  }

  @keyframes ts-pop-in {
    0% { opacity: 0; transform: scale(0.3) translateY(10px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  @keyframes ts-glow {
    0%, 100% { filter: drop-shadow(0 0 6px rgba(137, 180, 250, 0.4)); }
    50% { filter: drop-shadow(0 0 14px rgba(137, 180, 250, 0.8)); }
  }

  .ts-theme {
    --accent-a: rgb(166, 227, 161);
    --accent-b: rgb(137, 180, 250);
    --bg-start: 20, 18, 38;
    --bg-mid: 25, 23, 50;
    --bg-end: 35, 32, 60;
  }

  .ts-viz-container {
    position: relative;
    min-height: calc(100vh - 3rem);
  }

  .ts-root {
    background: radial-gradient(ellipse at 8% 6%, rgba(var(--accent-a), 0.3), transparent 55%),
                radial-gradient(ellipse at 92% 94%, rgba(var(--accent-b), 0.3), transparent 55%),
                linear-gradient(135deg, rgb(var(--bg-start)), rgb(var(--bg-mid)), rgb(var(--bg-end)));
    min-height: 100%;
    padding: 1.5rem;
    border-radius: 20px;
  }

  .ts-header {
    background: rgba(20, 18, 38, 0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border-radius: 16px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1rem;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .ts-header-left {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .ts-back-btn {
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    color: #cdd6f4;
  }

  .ts-back-btn:hover {
    background: rgba(255, 255, 255, 0.1);
  }

  .ts-title {
    font-size: 22px;
    font-weight: 800;
    margin: 0;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .ts-subtitle {
    font-size: 0.78rem;
    color: #6c7086;
    margin-top: 0.2rem;
  }

  .ts-tip {
    background: rgba(166, 227, 161, 0.1);
    border: 1px solid rgba(166, 227, 161, 0.25);
    border-radius: 10px;
    padding: 0.6rem 0.9rem;
    font-size: 0.78rem;
    color: #a6e3a1;
    max-width: 280px;
  }

  .ts-main-content {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 1rem;
  }

  .ts-left-col {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .ts-panel {
    background: rgba(20, 18, 38, 0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }

  .ts-panel-header {
    background: rgba(25, 24, 42, 0.6);
    padding: 0.6rem 0.9rem;
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--accent-a);
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }

  .ts-tree-container {
    padding: 1rem;
    min-height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ts-compare-panel {
    padding: 1rem;
  }

  .ts-compare-row {
    display: flex;
    gap: 0.75rem;
    margin-bottom: 0.75rem;
  }

  .ts-compare-box {
    flex: 1;
    background: rgba(15, 14, 26, 0.5);
    border-radius: 10px;
    padding: 0.6rem;
    min-height: 80px;
  }

  .ts-compare-box h4 {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #6c7086;
    margin: 0 0 0.4rem 0;
  }

  .ts-chip-list {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
  }

  .ts-chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 32px;
    height: 28px;
    padding: 0 0.45rem;
    border-radius: 8px;
    font-size: 0.78rem;
    font-weight: 600;
    transition: all 0.2s;
  }

  .ts-chip.left-side {
    background: rgba(166, 227, 161, 0.15);
    border: 1px solid rgba(166, 227, 161, 0.4);
    color: #a6e3a1;
  }

  .ts-chip.right-side {
    background: rgba(137, 180, 250, 0.15);
    border: 1px solid rgba(137, 180, 250, 0.4);
    color: #89b4fa;
  }

  .ts-chip.match {
    background: rgba(166, 227, 161, 0.25);
    border-color: #a6e3a1;
    color: #a6e3a1;
    animation: ts-pop-in 0.4s ease;
  }

  .ts-chip.mismatch {
    background: rgba(243, 139, 168, 0.25);
    border-color: #f38ba8;
    color: #f38ba8;
    animation: ts-pulse 0.5s ease;
  }

  .ts-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.5rem;
    padding: 0.8rem;
  }

  .ts-stat-item {
    text-align: center;
  }

  .ts-stat-value {
    font-size: 1.2rem;
    font-weight: 800;
    color: var(--accent-a);
  }

  .ts-stat-label {
    font-size: 0.65rem;
    color: #6c7086;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .ts-controls {
    display: flex;
    gap: 0.3rem;
    padding: 0.8rem;
    flex-wrap: wrap;
  }

  .ts-btn {
    background: rgba(49, 50, 68, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #cdd6f4;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 8px;
    flex-shrink: 0;
  }

  .ts-btn:hover:not(:disabled) {
    background: rgba(49, 50, 68, 0.8);
    border-color: rgba(255, 255, 255, 0.2);
  }

  .ts-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .ts-btn-play {
    flex: 1;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #111;
    font-weight: 600;
    min-width: 70px;
  }

  .ts-message {
    text-align: center;
    padding: 0.65rem;
    font-size: 0.88rem;
    color: #9399b2;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
    transition: all 0.2s;
  }

  .ts-message.success {
    color: var(--accent-a);
    font-weight: 600;
  }

  .ts-message.error {
    color: #f38ba8;
    font-weight: 600;
  }

  .ts-example-row {
    display: flex;
    gap: 0.4rem;
    padding: 0.8rem;
    flex-wrap: wrap;
  }

  .ts-example-btn {
    background: rgba(49, 50, 68, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 999px;
    padding: 0.3rem 0.7rem;
    font-size: 0.72rem;
    color: #cdd6f4;
    cursor: pointer;
    transition: all 0.2s;
  }

  .ts-example-btn:hover {
    background: rgba(49, 50, 68, 0.8);
    border-color: var(--accent-a);
  }

  .ts-log {
    padding: 0.6rem 0.8rem;
    max-height: 150px;
    overflow-y: auto;
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 0.75rem;
    line-height: 1.6;
  }

  .ts-log div {
    color: #6c7086;
    transition: color 0.2s;
  }

  .ts-log div.active {
    color: var(--accent-a);
    font-weight: 600;
  }

  .ts-code-col {
    display: flex;
    flex-direction: column;
  }

  @media (max-width: 1100px) {
    .ts-main-content {
      grid-template-columns: 1fr;
    }
  }
</style>

<div class="ts-viz-container">
  <div class="ts-root ts-theme">
    <div class="ts-header">
      <div class="ts-header-left">
        <button id="btn-back" class="ts-back-btn" title="返回">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M19 12H5M12 19l-7-7 7-7" />
          </svg>
        </button>
        <div>
          <h1 class="ts-title">对称二叉树</h1>
          <div class="ts-subtitle">LeetCode 101 · 递归对比左右子树镜像</div>
        </div>
      </div>
      <div class="ts-tip">💡 思路：左子树的左 = 右子树的右，左子树的右 = 右子树的左</div>
    </div>

    <div class="ts-main-content">
      <div class="ts-left-col">
        <div class="ts-panel">
          <div class="ts-panel-header">🌳 二叉树结构</div>
          <div id="ts-tree" class="ts-tree-container"></div>
          <div id="ts-message" class="ts-message">点击上方示例查看对称判定过程</div>
        </div>

        <div class="ts-panel">
          <div class="ts-panel-header">📊 统计面板</div>
          <div class="ts-stats">
            <div class="ts-stat-item">
              <div class="ts-stat-value" id="ts-depth">0</div>
              <div class="ts-stat-label">深度</div>
            </div>
            <div class="ts-stat-item">
              <div class="ts-stat-value" id="ts-compared">0</div>
              <div class="ts-stat-label">对比次数</div>
            </div>
            <div class="ts-stat-item">
              <div class="ts-stat-value" id="ts-matches">0</div>
              <div class="ts-stat-label">匹配</div>
            </div>
            <div class="ts-stat-item">
              <div class="ts-stat-value" id="ts-result">?</div>
              <div class="ts-stat-label">结果</div>
            </div>
          </div>
        </div>

        <div class="ts-panel">
          <div class="ts-panel-header">🔍 镜像对比</div>
          <div class="ts-compare-panel">
            <div class="ts-compare-row">
              <div class="ts-compare-box">
                <h4>左子树 (L)</h4>
                <div id="ts-left-chips" class="ts-chip-list"></div>
              </div>
              <div class="ts-compare-box">
                <h4>右子树 (R)</h4>
                <div id="ts-right-chips" class="ts-chip-list"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="ts-panel">
          <div class="ts-panel-header">📋 执行日志</div>
          <div id="ts-log" class="ts-log"></div>
        </div>
      </div>

      <div class="ts-code-col">
        <div class="ts-panel" style="flex:1;">
          <div class="ts-panel-header">代码</div>
          <div data-code-panel style="flex:1;min-height:260px;overflow:hidden;"></div>
        </div>

        <div class="ts-panel" style="margin-top:0.75rem;">
          <div class="ts-panel-header">⚙️ 控制</div>
          <div class="ts-controls">
            <button id="step-reset" class="ts-btn" title="重置">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                <path d="M3 3v5h5" />
              </svg>
            </button>
            <button id="step-prev" class="ts-btn" title="上一步">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6" /></svg>
            </button>
            <button id="step-play" class="ts-btn ts-btn-play">播放</button>
            <button id="step-next" class="ts-btn" title="下一步">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6" /></svg>
            </button>
          </div>
          <div style="padding: 0 0.8rem 0.6rem;">
            <span style="font-size: 0.78rem; color: #6c7086;" id="step-counter">步骤: 0 / 0</span>
            <input type="range" id="step-speed" min="200" max="2000" value="900" step="100"
                   style="width:100%; margin-top:0.4rem; accent-color: var(--accent-a);" />
            <div style="text-align:center; font-size:0.72rem; color:#585b70;">
              速度: <span id="step-speed-label">0.9s</span>
            </div>
          </div>
        </div>

        <div class="ts-panel" style="margin-top:0.75rem;">
          <div class="ts-panel-header">📌 示例</div>
          <div class="ts-example-row">
            <button class="ts-example-btn" data-id="1">对称树 [1,2,2,3,4,4,3]</button>
            <button class="ts-example-btn" data-id="2">非对称 [1,2,2,null,3,null,3]</button>
            <button class="ts-example-btn" data-id="3">单层对称 [1,2,2]</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
