            <button class="td-chip" data-tree="1, null, 2">单节点斜树: ([1,null,2])</button>
            <button class="td-chip" data-tree="1, 2, 3, 4, 5, 6, 7">满二叉树: ([1,2,3,4,5,6,7])</button>
          </div>
        </div>
      </div>

      <!-- 贯穿式 Scrubber 步数进度条与播放控制器 -->
      <div class="td-playback-bar">
        <input type="range" id="slider-progress" min="0" max="0" value="0" class="td-slider" />
        <div class="td-counter-badge">
          <span id="step-cur" style="color: #2563eb;">0</span> / <span id="step-total">0</span>
        </div>
        <div style="display: flex; align-items: center; gap: 4px; flex-shrink: 0;">
          <button id="btn-step-prev" title="上一步" class="td-ctrl-btn">◀</button>
          <button id="btn-play-pause" title="自动播放/暂停" class="td-play-circle-btn">
            <span id="play-icon">▶</span>
          </button>
          <button id="btn-step-next" title="下一步" class="td-ctrl-btn">▶</button>
        </div>
        <div style="display: flex; align-items: center; gap: 4px; margin-left: 6px;">
          <select id="select-speed" style="padding: 2px 6px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 11px; background: #ffffff;">
            <option value="1200">慢速</option>
            <option value="600" selected>正常</option>
            <option value="250">快速</option>
          </select>
        </div>
      </div>

      <!-- 卡片 2: 状态空间与指标监视器 -->
      <div class="td-card">
        <div class="td-card-header">
          <div>
            <div class="td-card-title">🧭 左右子树深度与归约监视器</div>
            <div class="td-card-desc">当前节点、左子树深度、右子树深度与最大深度</div>
          </div>
          <span id="badge-max-depth" class="td-counter-badge" style="color:#2563eb; background:#eff6ff; border-color:#bfdbfe;">最大深度: 0</span>
        </div>

        <!-- 状态空间展示盒 -->
        <div class="td-state-space-box">
          <div class="td-metrics-grid">
            <div class="td-metric-card">
              <span class="td-metric-label">当前节点 curr</span>
              <span class="td-metric-val" id="metric-curr" style="color: #fbbf24;">3</span>
            </div>
            <div class="td-metric-card">
              <span class="td-metric-label">左子树深 left</span>
              <span class="td-metric-val" id="metric-left-depth" style="color: #3b82f6;">1</span>
            </div>
            <div class="td-metric-card">
              <span class="td-metric-label">右子树深 right</span>
              <span class="td-metric-val" id="metric-right-depth" style="color: #a855f7;">2</span>
            </div>
            <div class="td-metric-card">
              <span class="td-metric-label">最大深度 result</span>
              <span class="td-metric-val" id="metric-max-depth" style="color: #10b981;">3</span>
            </div>
          </div>

          <div class="td-formula-box" id="td-formula-box">
            <span>深度公式:</span> <strong id="formula-action" style="color: #2563eb;">1 + Math.max(leftDepth, rightDepth)</strong>
          </div>

          <div class="td-live-alert">
            <span>💡</span> <span id="td-live-text">准备就绪，点击运行开始计算最大深度。</span>
          </div>
        </div>
      </div>

    </section>

    <!-- ================= 右侧：代码终端 + 执行日志 ================= -->
    <section class="td-right-section">

      <!-- 卡片 3: 暗色代码终端面板 -->
      <div class="td-dark-terminal">
        <div class="td-terminal-header">
          <!-- 1. 主 Tab 切换器 (源码 / 题目 / 精讲) -->
          <div class="td-tab-group">
            <button id="btn-tab-code" class="td-tab-item active">💻 代码调试</button>
            <button id="btn-tab-problem" class="td-tab-item">📋 题目描述</button>
            <button id="btn-tab-analysis" class="td-tab-item">💡 算法精讲</button>
          </div>

          <!-- 2. 多语言切换器 -->
          <div class="td-lang-group" id="code-lang-tabs">
            <button class="td-lang-btn active" data-lang="java">Java</button>
            <button class="td-lang-btn" data-lang="cpp">C++</button>
            <button class="td-lang-btn" data-lang="python">Python</button>
            <button class="td-lang-btn" data-lang="javascript">JS</button>
          </div>

          <!-- 3. 字号缩放器与 macOS 窗口微控制 -->
          <div class="td-font-tools">
            <div class="td-font-scaler">
              <button id="btn-code-font-dec" title="缩小代码字号">A-</button>
              <span id="code-font-indicator" class="td-font-indicator">12</span>
              <button id="btn-code-font-inc" title="放大代码字号">A+</button>
            </div>

            <div class="td-window-dots">
              <span class="td-dot" style="background:#ef4444;"></span>
              <span class="td-dot" style="background:#eab308;"></span>
              <span class="td-dot" style="background:#22c55e;"></span>
            </div>
          </div>
        </div>

        <!-- 容器 1: 源码高亮与单步追踪视图 -->
        <div id="code-view-container" style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;">
          <div class="td-terminal-body">
            <div id="code-lines-wrapper">
              <!-- 动态装载代码行 -->
            </div>
          </div>
        </div>

        <!-- 容器 2: 题目完整描述视图 -->
        <div id="problem-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载题目内容 -->
        </div>

        <!-- 容器 3: 算法精讲视图 -->
        <div id="analysis-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载精讲内容 -->
        </div>
      </div>

      <!-- 卡片 4: 独立执行日志卡片 -->
      <div class="td-log-card">
        <div class="td-log-header">
          <div class="td-log-header-title">
            <span>📜 执行日志</span>
          </div>
          <span id="log-count" class="td-log-count">0 条记录</span>
        </div>

        <div id="log-container" class="td-log-body">
          <!-- 动态填充日志条目 -->
        </div>
      </div>

    </section>

  </main>

  <!-- 4. 力扣原题描述轻量模态弹窗 (Modal) -->
  <div id="modal-problem" class="td-modal-backdrop hidden">
    <div class="td-modal-content">
      <div class="td-modal-header">
        <div class="td-modal-title">
          <span>📋 算法原理与题目说明</span>
        </div>
        <button id="btn-close-problem-modal" class="td-modal-close" title="关闭 (Esc)">✕</button>
      </div>
      <div id="modal-problem-body" class="td-modal-body">
        <!-- 动态装载题目内容 -->
      </div>
    </div>
  </div>
</div>
