<!-- 二叉树层序遍历 LeetCode 102 -->
<style>
  #algo-binary-tree-level-view {
    padding: 1.5rem;
    color: #cdd6f4;
    max-width: 1400px;
    margin: 0 auto;
    font-family: system-ui, -apple-system, sans-serif;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7); }
    50% { box-shadow: 0 0 0 12px rgba(52, 211, 153, 0); }
  }

  @keyframes pop-in {
    0% { opacity: 0; transform: scale(0.3) translateY(10px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  .btl-theme {
    --accent-a: rgb(52, 211, 153);
    --accent-b: rgb(45, 212, 191);
    --bg-start: 20, 18, 38;
    --bg-mid: 25, 23, 50;
    --bg-end: 35, 32, 60;
  }

  .btl-container {
    position: relative;
    min-height: calc(100vh - 3rem);
  }

  .btl-root {
    background: radial-gradient(ellipse at 8% 6%, rgba(var(--accent-a), 0.15), transparent 55%),
                radial-gradient(ellipse at 92% 94%, rgba(var(--accent-b), 0.15), transparent 55%),
                linear-gradient(135deg, rgb(var(--bg-start)), rgb(var(--bg-mid)), rgb(var(--bg-end)));
    min-height: 100%;
    padding: 1.5rem;
    border-radius: 20px;
  }

  .btl-header {
    background: rgba(20, 18, 38, 0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border-radius: 16px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1rem;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
  }

  .btl-header-content {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .btl-icon-badge {
    width: 44px;
    height: 44px;
    border-radius: 11px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    box-shadow: 0 4px 12px rgba(52, 211, 153, 0.3);
  }

  .btl-title {
    font-size: 22px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 0;
  }

  .btl-desc {
    color: #9399b2;
    margin-bottom: 0.75rem;
    font-size: 0.9rem;
    line-height: 1.5;
  }

  .btl-tip {
    background: rgba(52, 211, 153, 0.1);
    border: 1px solid rgba(52, 211, 153, 0.2);
    border-radius: 10px;
    padding: 0.5rem 0.75rem;
    font-size: 0.8rem;
    color: var(--accent-a);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .btl-layout {
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 1rem;
  }

  @media (max-width: 1100px) {
    .btl-layout { grid-template-columns: 1fr; }
  }

  .btl-main {
    background: rgba(20, 18, 38, 0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 1.25rem;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }

  .btl-controls {
    display: flex;
    gap: 0.6rem;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 1rem;
  }

  .btl-btn {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #111;
    border: none;
    border-radius: 10px;
    padding: 0.5rem 1rem;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
    box-shadow: 0 4px 12px rgba(52, 211, 153, 0.3);
  }

  .btl-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(52, 211, 153, 0.4);
  }

  .btl-example {
    background: rgba(255, 255, 255, 0.05);
    color: #cdd6f4;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    padding: 0.4rem 0.8rem;
    cursor: pointer;
    font-size: 0.8rem;
    transition: all 0.2s;
  }

  .btl-example:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.2);
  }

  .btl-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.6rem;
    margin-bottom: 1rem;
  }

  .btl-stat-wrapper {
    position: relative;
    background: rgba(15, 14, 26, 0.5);
    border-radius: 10px;
    padding: 0.6rem;
    text-align: center;
    overflow: hidden;
  }

  .btl-stat-wrapper::before {
    content: '';
    position: absolute;
    left: 2px;
    top: 2px;
    bottom: 2px;
    width: 3px;
    background: linear-gradient(180deg, var(--accent-a), var(--accent-b));
    border-radius: 3px;
  }

  .btl-stat-label {
    font-size: 0.7rem;
    color: #6c7086;
    margin-bottom: 0.25rem;
  }

  .btl-stat-val {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--accent-a);
    font-variant-numeric: tabular-nums;
  }

  .btl-tree {
    background: rgba(15, 14, 26, 0.5);
    border-radius: 10px;
    padding: 1rem;
    min-height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 1rem;
  }

  .btl-message {
    background: rgba(15, 14, 26, 0.5);
    border-left: 3px solid var(--accent-a);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    margin-bottom: 1rem;
    font-size: 0.9rem;
    line-height: 1.5;
  }

  .btl-log {
    background: rgba(15, 14, 26, 0.5);
    border-radius: 8px;
    padding: 0.75rem;
    max-height: 140px;
    overflow-y: auto;
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 0.78rem;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  .btl-log div { padding: 2px 0; color: #9399b2; }

  .btl-log div.active {
    color: #cdd6f4;
    font-weight: 600;
    background: rgba(52, 211, 153, 0.15);
    border-radius: 4px;
    padding: 2px 6px;
  }

  .btl-right {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .btl-playback {
    background: rgba(20, 18, 38, 0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 1rem;
  }

  .btl-pb-row {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    margin-bottom: 0.75rem;
  }

  .btl-pb-btn {
    flex: 1;
    background: rgba(49, 50, 68, 0.6);
    color: #cdd6f4;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    padding: 0.5rem;
    cursor: pointer;
    font-size: 0.8rem;
    transition: all 0.2s;
  }

  .btl-pb-btn:hover:not(:disabled) {
    background: rgba(49, 50, 68, 0.8);
    border-color: rgba(255, 255, 255, 0.2);
  }

  .btl-pb-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .btl-pb-btn.play {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #111;
    font-weight: 600;
    box-shadow: 0 4px 12px rgba(52, 211, 153, 0.3);
  }

  .btl-pb-btn.play:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(52, 211, 153, 0.4);
  }

  .btl-speed-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.8rem;
    color: #6c7086;
    margin-bottom: 0.5rem;
  }

  .btl-speed-row input[type="range"] {
    flex: 1;
    accent-color: var(--accent-a);
  }

  .btl-speed-row span {
    font-variant-numeric: tabular-nums;
  }

  .btl-counter {
    color: #6c7086;
    font-size: 0.8rem;
    text-align: center;
  }

  /* Tree node animations */
  svg circle.current-node {
    animation: pulse 1.2s infinite;
    stroke: var(--accent-a);
    stroke-width: 3;
  }

  svg circle.new-visited {
    animation: pop-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  svg line {
    transition: stroke 0.3s, stroke-width 0.3s;
  }
</style>

<div class="btl-container">
  <div class="btl-root">
    <div class="btl-header">
      <div class="btl-header-content">
        <div class="btl-icon-badge">🌲</div>
        <div>
          <h1 class="btl-title">二叉树层序遍历（BFS）</h1>
          <div class="btl-desc">LeetCode 102 · 使用队列逐层遍历，每层节点值收集到一个数组，最终返回二维列表。</div>
        </div>
      </div>
      <div class="btl-tip">💡 核心动画：节点出队→新节点入队→当前节点高亮→层完成</div>
    </div>

    <div class="btl-layout">
      <div class="btl-main">
        <div class="btl-controls">
          <button id="btl-start" class="btl-btn">开始层序</button>
          <button class="btl-example" data-id="1">示例树1</button>
          <button class="btl-example" data-id="2">示例树2</button>
          <button class="btl-example" data-id="3">空树</button>
        </div>

        <div class="btl-stats">
          <div class="btl-stat-wrapper"><div class="btl-stat-label">队列长度</div><div class="btl-stat-val" id="btl-qlen">0</div></div>
          <div class="btl-stat-wrapper"><div class="btl-stat-label">当前层</div><div class="btl-stat-val" id="btl-level">-</div></div>
          <div class="btl-stat-wrapper"><div class="btl-stat-label">已访问</div><div class="btl-stat-val" id="btl-visited">0</div></div>
          <div class="btl-stat-wrapper"><div class="btl-stat-label">层数</div><div class="btl-stat-val" id="btl-depth">0</div></div>
        </div>

        <div class="btl-tree" id="btl-tree"></div>

        <div class="btl-message" id="step-message">点击「开始层序」查看层序遍历的 BFS 过程。</div>

        <div class="btl-log" id="btl-log"></div>
      </div>

      <div class="btl-right">
        <div data-code-panel></div>
        <div class="btl-playback">
          <div class="btl-pb-row">
            <button id="step-reset" class="btl-pb-btn">⏮重置</button>
            <button id="step-prev" class="btl-pb-btn">◀上一步</button>
            <button id="step-play" class="btl-pb-btn play">▶播放</button>
            <button id="step-next" class="btl-pb-btn">下一步▶</button>
          </div>
          <div class="btl-speed-row">
            <span>速度</span>
            <input id="step-speed" type="range" min="200" max="2000" step="100" value="800" />
            <span id="step-speed-label">0.8s</span>
          </div>
          <div class="btl-counter" id="step-counter">步骤: 1 / 1</div>
        </div>
      </div>
    </div>
  </div>
</div>
