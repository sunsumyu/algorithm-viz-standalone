<div class="lrh-page">
  <div class="lrh-header">
    <div class="lrh-hero-left">
      <span class="lrh-icon">📊</span>
      <div>
        <h2>柱状图中最大的矩形（单调栈）</h2>
        <div class="lrh-desc">LeetCode 84 · 用单调栈找直方图中的最大矩形面积</div>
      </div>
    </div>
    <div class="lrh-tip"><strong>核心思想：</strong>维护高度递增的单调栈。当遇到比栈顶矮的柱子时，弹出栈顶并以弹出柱的高度为矩形高度，计算能形成的最大矩形面积。</div>
  </div>

  <div class="lrh-main">
    <div class="lrh-left">
      <section class="lrh-card">
        <div class="lrh-card-title">输入高度数组 <span class="lrh-tag">heights 序列</span></div>
        <div class="lrh-input-row">
          <input id="lrh-input" value="2,1,5,6,2,3">
          <button id="lrh-start">开始计算</button>
        </div>
        <div class="lrh-examples">
          <button class="lrh-example-btn" data-val="2,1,5,6,2,3">经典示例</button>
          <button class="lrh-example-btn" data-val="1,2,3,4,5">递增</button>
          <button class="lrh-example-btn" data-val="5,4,3,2,1">递减</button>
          <button class="lrh-example-btn" data-val="3,3,3,3">全相同</button>
        </div>
      </section>

      <div class="lrh-stats">
        <div class="lrh-stat lrh-stat--i"><label>当前 i</label><span id="lrh-i">0</span></div>
        <div class="lrh-stat lrh-stat--pop"><label>弹出高度</label><span id="lrh-pop-h">-</span></div>
        <div class="lrh-stat lrh-stat--area"><label>当前面积</label><span id="lrh-cur-area">-</span></div>
        <div class="lrh-stat lrh-stat--max"><label>最大面积</label><span id="lrh-max-area">0</span></div>
      </div>

      <section class="lrh-card lrh-visual">
        <div class="lrh-card-title">直方图 + 矩形叠加 <span class="lrh-tag">栈内高亮</span></div>
        <div class="lrh-bars" id="lrh-bars"></div>
        <div class="lrh-stack-area">
          <div class="lrh-stack-title">📦 单调递增栈（存下标，高度递增）</div>
          <div class="lrh-stack-items" id="lrh-stack"></div>
        </div>
        <div class="lrh-message" id="lrh-result">
          <span class="lrh-emoji">📊</span>
          <div id="step-message">点击「开始计算」观看单调栈计算最大矩形面积的过程</div>
        </div>
      </section>

      <section class="lrh-card">
        <div class="lrh-card-title">执行日志</div>
        <div class="lrh-log" id="lrh-log"></div>
      </section>
    </div>
    <aside class="lrh-code"><div data-code-panel></div></aside>
  </div>

  <div class="lrh-controls">
    <button id="step-reset" class="lrh-ctrl-btn">⏮ 重置</button>
    <button id="step-prev" class="lrh-ctrl-btn">◀ 上一步</button>
    <button id="step-play" class="lrh-ctrl-btn lrh-ctrl-primary">▶ 播放</button>
    <button id="step-next" class="lrh-ctrl-btn">下一步 ▶</button>
    <span id="step-counter" class="lrh-counter">步骤: 0 / 0</span>
    <div class="lrh-speed-wrap">
      <span>速度</span>
      <input id="lrh-speed" type="range" min="200" max="2500" step="100" value="900">

    </div>
  </div>
</div>
