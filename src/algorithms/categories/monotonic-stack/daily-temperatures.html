<style>
  /* === 每日温度 · 玻璃感 + 柱状图 + 栈可视化 === */
  #algo-daily-temperatures-view {
    --accent-a: #fb923c;
    --accent-b: #f87171;
    --accent-glow: rgba(251, 146, 60, .4);
    --warm-color: #fb923c;
    --cool-color: #60a5fa;
    --stack-color: #fbbf24;
    --resolve-color: #34d399;
    width: 100%; height: 100%;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background:
      radial-gradient(ellipse at 8% 6%, rgba(251, 146, 60, .22), transparent 55%),
      radial-gradient(ellipse at 92% 94%, rgba(248, 113, 113, .22), transparent 55%),
      linear-gradient(135deg, #1a0e05 0%, #2a0e0e 50%, #2a1a14 100%);
    overflow: hidden;
  }
  #algo-daily-temperatures-view .dt-page { height: 100%; display: flex; flex-direction: column; overflow: hidden; }
  #algo-daily-temperatures-view .dt-header {
    padding: 18px 24px 12px;
    background: rgba(8, 8, 24, .35);
    backdrop-filter: blur(14px) saturate(150%);
    border-bottom: 1px solid rgba(255, 255, 255, .06);
    display: flex; justify-content: space-between; gap: 18px; align-items: center;
  }
  #algo-daily-temperatures-view .dt-hero-left { display: flex; align-items: center; gap: 14px; }
  #algo-daily-temperatures-view .dt-icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: inline-flex; align-items: center; justify-content: center; font-size: 24px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; box-shadow: 0 6px 20px var(--accent-glow);
  }
  #algo-daily-temperatures-view h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: #f1f5f9; }
  #algo-daily-temperatures-view .dt-desc { margin: 4px 0 0; color: #94a3b8; font-size: 12.5px; line-height: 1.5; }
  #algo-daily-temperatures-view .dt-tip {
    max-width: 460px; padding: 10px 14px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(251, 146, 60, .12), rgba(248, 113, 113, .08));
    border: 1px solid rgba(251, 146, 60, .3);
    color: #cbd5e1; font-size: 12.5px; line-height: 1.65;
  }
  #algo-daily-temperatures-view .dt-tip strong { color: #fdba74; }
  #algo-daily-temperatures-view .dt-main {
    flex: 1; min-height: 0; display: grid;
    grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; padding: 16px; overflow: hidden;
  }
  #algo-daily-temperatures-view .dt-left { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
  #algo-daily-temperatures-view .dt-card {
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
    overflow: hidden;
  }
  #algo-daily-temperatures-view .dt-card-title {
    padding: 10px 16px; border-bottom: 1px solid rgba(255, 255, 255, .06);
    display: flex; justify-content: space-between; align-items: center;
    color: #cbd5e1; font-weight: 700; font-size: 13px;
  }
  #algo-daily-temperatures-view .dt-tag {
    font-size: 11px; color: #fdba74; background: rgba(251, 146, 60, .14);
    border: 1px solid rgba(251, 146, 60, .3); padding: 2px 8px; border-radius: 999px;
  }
  #algo-daily-temperatures-view .dt-input-row {
    display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 14px 16px;
  }
  #algo-daily-temperatures-view input {
    width: 100%; padding: 9px 12px; border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, .12);
    background: rgba(8, 8, 24, .6);
    color: #e2e8f0; font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 13px; outline: none; transition: all .2s;
  }
  #algo-daily-temperatures-view input:focus { border-color: var(--accent-a); box-shadow: 0 0 0 3px rgba(251, 146, 60, .15); }
  #algo-daily-temperatures-view button {
    padding: 8px 16px; border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 10px; background: rgba(255, 255, 255, .04);
    color: #e2e8f0; cursor: pointer; font-weight: 600; font-size: 13px;
    transition: all .25s cubic-bezier(.4, 0, .2, 1);
  }
  #algo-daily-temperatures-view button:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    border-color: transparent; color: #06121f; transform: translateY(-1px);
    box-shadow: 0 6px 18px var(--accent-glow);
  }
  #algo-daily-temperatures-view button:disabled { opacity: .4; cursor: not-allowed; }
  #algo-daily-temperatures-view .dt-examples { padding: 0 16px 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  #algo-daily-temperatures-view .dt-example-btn {
    padding: 5px 12px; border-radius: 999px; font-size: 12px;
    background: rgba(248, 113, 113, .12); border: 1px solid rgba(248, 113, 113, .28);
    color: #fca5a5; cursor: pointer; transition: all .2s;
  }
  #algo-daily-temperatures-view .dt-example-btn:hover {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; border-color: transparent; transform: translateY(-1px);
  }
  /* 统计 */
  #algo-daily-temperatures-view .dt-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  #algo-daily-temperatures-view .dt-stat {
    position: relative; padding: 12px 14px 12px 18px;
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 14px; overflow: hidden;
  }
  #algo-daily-temperatures-view .dt-stat::before {
    content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 4px; border-radius: 4px;
  }
  #algo-daily-temperatures-view .dt-stat--i::before { background: linear-gradient(180deg, #fb923c, #f97316); }
  #algo-daily-temperatures-view .dt-stat--i span { color: #fdba74; }
  #algo-daily-temperatures-view .dt-stat--cur::before { background: linear-gradient(180deg, #f87171, #ef4444); }
  #algo-daily-temperatures-view .dt-stat--cur span { color: #fca5a5; }
  #algo-daily-temperatures-view .dt-stat--top::before { background: linear-gradient(180deg, #fbbf24, #f59e0b); }
  #algo-daily-temperatures-view .dt-stat--top span { color: #fde68a; }
  #algo-daily-temperatures-view .dt-stat--fill::before { background: linear-gradient(180deg, #34d399, #10b981); }
  #algo-daily-temperatures-view .dt-stat--fill span { color: #6ee7b7; }
  #algo-daily-temperatures-view .dt-stat label {
    display: block; margin-bottom: 4px; color: #94a3b8;
    font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
  }
  #algo-daily-temperatures-view .dt-stat span {
    font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums;
  }
  /* 柱状图 */
  #algo-daily-temperatures-view .dt-visual { flex: 1; min-height: 280px; display: flex; flex-direction: column; }
  #algo-daily-temperatures-view .dt-bars {
    flex: 1; min-height: 220px; padding: 24px 18px;
    overflow: auto; display: flex; align-items: flex-end; gap: 10px;
  }
  #algo-daily-temperatures-view .dt-bar-col {
    display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1; min-width: 32px;
  }
  #algo-daily-temperatures-view .dt-bar {
    width: 100%; border-radius: 8px 8px 0 0;
    background: linear-gradient(180deg, rgba(255, 255, 255, .04), rgba(255, 255, 255, .02));
    border: 1.5px solid rgba(255, 255, 255, .1);
    transition: all .35s cubic-bezier(.4, 0, .2, 1);
    display: flex; align-items: flex-start; justify-content: center;
    color: #cbd5e1; font-weight: 800; font-size: 14px; padding-top: 6px;
    font-family: 'JetBrains Mono', monospace;
  }
  #algo-daily-temperatures-view .dt-bar.current {
    background: linear-gradient(180deg, rgba(251, 146, 60, .45), rgba(249, 115, 22, .15));
    border-color: var(--accent-a);
    color: #fed7aa;
    transform: translateY(-6px) scale(1.05);
    box-shadow: 0 0 0 3px rgba(251, 146, 60, .25), 0 8px 22px rgba(251, 146, 60, .4);
    animation: dt-bar-pulse 1.2s ease-in-out infinite;
  }
  @keyframes dt-bar-pulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(251, 146, 60, .25), 0 8px 22px rgba(251, 146, 60, .4); }
    50% { box-shadow: 0 0 0 6px rgba(251, 146, 60, .12), 0 10px 28px rgba(251, 146, 60, .55); }
  }
  #algo-daily-temperatures-view .dt-bar.instack {
    background: linear-gradient(180deg, rgba(251, 191, 36, .3), rgba(245, 158, 11, .1));
    border-color: rgba(251, 191, 36, .5);
    color: #fde68a;
  }
  #algo-daily-temperatures-view .dt-bar.popping {
    animation: dt-pop-shake .5s cubic-bezier(.34, 1.56, .64, 1);
  }
  @keyframes dt-pop-shake {
    0% { transform: translateX(0) scale(1); }
    30% { transform: translateX(-4px) scale(1.08); }
    60% { transform: translateX(4px) scale(1.05); }
    100% { transform: translateX(0) scale(1); }
  }
  #algo-daily-temperatures-view .dt-bar.resolved {
    background: linear-gradient(180deg, rgba(52, 211, 153, .3), rgba(16, 185, 129, .1));
    border-color: rgba(52, 211, 153, .5);
    color: #6ee7b7;
    animation: dt-resolve-pop .5s cubic-bezier(.34, 1.56, .64, 1);
  }
  @keyframes dt-resolve-pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.12); box-shadow: 0 0 16px rgba(52, 211, 153, .5); }
    100% { transform: scale(1); }
  }
  #algo-daily-temperatures-view .dt-ans {
    font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700;
    color: #64748b;
    padding: 4px 8px; border-radius: 6px;
    background: rgba(255, 255, 255, .04);
  }
  #algo-daily-temperatures-view .dt-ans.filled {
    color: #6ee7b7;
    background: rgba(52, 211, 153, .12);
  }
  /* 栈区 */
  #algo-daily-temperatures-view .dt-stack-area {
    padding: 14px 18px;
    background: rgba(8, 8, 24, .55);
    border-top: 1px solid rgba(255, 255, 255, .06);
  }
  #algo-daily-temperatures-view .dt-stack-title {
    color: #94a3b8; font-size: 12px; font-weight: 700; margin-bottom: 10px;
    letter-spacing: .03em;
  }
  #algo-daily-temperatures-view .dt-stack-items {
    display: flex; gap: 8px; flex-wrap: wrap-reverse; flex-direction: column-reverse;
    align-items: flex-start;
  }
  #algo-daily-temperatures-view .dt-stack-item {
    padding: 6px 12px; border-radius: 8px;
    background: linear-gradient(135deg, rgba(251, 191, 36, .25), rgba(245, 158, 11, .1));
    border: 1px solid rgba(251, 191, 36, .5);
    font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700;
    color: #fde68a;
    animation: dt-stack-push .4s cubic-bezier(.34, 1.56, .64, 1);
  }
  @keyframes dt-stack-push {
    0% { transform: translateX(-20px) scale(.6); opacity: 0; }
    60% { transform: translateX(2px) scale(1.1); opacity: 1; }
    100% { transform: translateX(0) scale(1); opacity: 1; }
  }
  #algo-daily-temperatures-view .dt-stack-item.dt-stack-top {
    border-color: var(--accent-a);
    background: linear-gradient(135deg, rgba(251, 146, 60, .3), rgba(248, 113, 113, .12));
    color: #fdba74;
  }
  /* 结果 */
  #algo-daily-temperatures-view .dt-message {
    margin: 0 16px 16px; padding: 14px 18px; border-radius: 12px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: linear-gradient(135deg, rgba(251, 146, 60, .12), rgba(248, 113, 113, .06));
    border: 1px solid rgba(251, 146, 60, .28);
    line-height: 1.55; font-size: 14px; color: #fed7aa;
  }
  #algo-daily-temperatures-view .dt-message .dt-emoji {
    width: 36px; height: 36px; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center; font-size: 20px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; box-shadow: 0 4px 14px var(--accent-glow); flex-shrink: 0;
  }
  #algo-daily-temperatures-view .dt-message.dt-result--done {
    background: linear-gradient(135deg, rgba(52, 211, 153, .18), rgba(16, 185, 129, .08));
    border-color: rgba(52, 211, 153, .4); color: #d1fae5;
  }
  #algo-daily-temperatures-view .dt-message.dt-result--done .dt-emoji {
    background: linear-gradient(135deg, #34d399, #10b981);
    box-shadow: 0 4px 14px rgba(52, 211, 153, .55);
  }
  #algo-daily-temperatures-view .dt-log {
    min-height: 80px; max-height: 130px; padding: 10px 14px;
    overflow: auto; background: rgba(8, 8, 24, .55);
    font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px;
    line-height: 1.65; color: #94a3b8;
  }
  #algo-daily-temperatures-view .dt-log div { padding: 1px 0; color: #94a3b8; }
  #algo-daily-temperatures-view .dt-log div.active { color: #fdba74; font-weight: 600; }
  #algo-daily-temperatures-view .dt-code {
    min-height: 0; display: flex;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; overflow: hidden;
  }
  #algo-daily-temperatures-view .dt-code [data-code-panel] { flex: 1; min-width: 0; }
  #algo-daily-temperatures-view .dt-controls {
    padding: 14px 18px;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border-top: 1px solid rgba(255, 255, 255, .06);
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  #algo-daily-temperatures-view .dt-controls .dt-ctrl-btn { min-width: 64px; }
  #algo-daily-temperatures-view .dt-controls .dt-ctrl-primary {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; border-color: transparent;
  }
  #algo-daily-temperatures-view .dt-counter {
    color: #94a3b8; font-size: 13px; font-weight: 600;
    min-width: 110px; text-align: center; font-variant-numeric: tabular-nums;
  }
  #algo-daily-temperatures-view .dt-speed-wrap { display: flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 12px; }
  #algo-daily-temperatures-view #dt-speed { width: 130px; accent-color: var(--accent-a); }
  @media (max-width: 1100px) {
    #algo-daily-temperatures-view .dt-main { grid-template-columns: 1fr; overflow: auto; }
    #algo-daily-temperatures-view .dt-code { min-height: 360px; }
  }
</style>

<div class="dt-page">
  <div class="dt-header">
    <div class="dt-hero-left">
      <span class="dt-icon">🌡️</span>
      <div>
        <h2>每日温度（单调栈）</h2>
        <div class="dt-desc">LeetCode 739 · 对每天求下一个更高温度出现在几天后</div>
      </div>
    </div>
    <div class="dt-tip"><strong>核心动画：</strong>当前柱<span style="color:#fdba74">橙色脉冲</span>；栈内柱<span style="color:#fde68a">金色高亮</span>；弹栈时<span style="color:#fca5a5">shake</span>；填答案时<span style="color:#6ee7b7">绿色 pop</span>。</div>
  </div>
  <div class="dt-main">
    <div class="dt-left">
      <section class="dt-card">
        <div class="dt-card-title">输入温度 <span class="dt-tag">°C 序列</span></div>
        <div class="dt-input-row">
          <input id="dt-input" value="73,74,75,71,69,72,76,73">
          <button id="dt-start">开始查找</button>
        </div>
        <div class="dt-examples">
          <button class="dt-example-btn" data-val="73,74,75,71,69,72,76,73">经典示例</button>
          <button class="dt-example-btn" data-val="30,40,50,60">递增</button>
          <button class="dt-example-btn" data-val="60,50,40,30">递减</button>
          <button class="dt-example-btn" data-val="50,40,60,30,70">波动</button>
        </div>
      </section>

      <div class="dt-stats">
        <div class="dt-stat dt-stat--i"><label>当前 i</label><span id="dt-i">0</span></div>
        <div class="dt-stat dt-stat--cur"><label>当前温度</label><span id="dt-cur">-</span></div>
        <div class="dt-stat dt-stat--top"><label>栈顶温度</label><span id="dt-top">-</span></div>
        <div class="dt-stat dt-stat--fill"><label>已填答案数</label><span id="dt-filled">0</span></div>
      </div>

      <section class="dt-card dt-visual">
        <div class="dt-card-title">温度柱状图 <span class="dt-tag">栈内 / 已解</span></div>
        <div class="dt-bars" id="dt-bars"></div>
        <div class="dt-stack-area">
          <div class="dt-stack-title">📦 单调递减栈（存下标，温度递减）</div>
          <div class="dt-stack-items" id="dt-stack"></div>
        </div>
        <div class="dt-message" id="dt-result">
          <span class="dt-emoji">🌡️</span>
          <div id="step-message">点击「开始查找」观看柱状图 + 弹栈动画</div>
        </div>
      </section>

      <section class="dt-card">
        <div class="dt-card-title">执行日志</div>
        <div class="dt-log" id="dt-log"></div>
      </section>
    </div>
    <aside class="dt-code"><div data-code-panel></div></aside>
  </div>
  <div class="dt-controls">
    <button id="step-reset" class="dt-ctrl-btn">⏮ 重置</button>
    <button id="step-prev" class="dt-ctrl-btn">◀ 上一步</button>
    <button id="step-play" class="dt-ctrl-btn dt-ctrl-primary">▶ 播放</button>
    <button id="step-next" class="dt-ctrl-btn">下一步 ▶</button>
    <span id="step-counter" class="dt-counter">步骤: 0 / 0</span>
    <div class="dt-speed-wrap">
      <span>速度</span>
      <input id="dt-speed" type="range" min="200" max="2500" step="100" value="900">
      <span id="dt-speed-label" style="min-width:42px;">0.9s</span>
    </div>
  </div>
</div>
