<div class="nge2-page">
  <div class="nge2-header">
    <div class="nge2-hero-left">
      <span class="nge2-icon">🔄</span>
      <div>
        <h2>下一个更大元素II（单调栈）</h2>
        <div class="nge2-desc">LeetCode 503 · 循环数组中找下一个更大元素</div>
      </div>
    </div>
    <div class="nge2-tip"><strong>核心动画：</strong>当前柱<span style="color:#a5f3fc">青色脉冲</span>；栈内柱<span style="color:#a5f3fc">青色高亮</span>；弹栈时<span style="color:#67e8f9">shake</span>；填答案时<span style="color:#6ee7b7">绿色 pop</span>。从 2n-1 倒序遍历模拟循环。</div>
  </div>
  <div class="nge2-main">
    <div class="nge2-left">
      <section class="nge2-card">
        <div class="nge2-card-title">输入数组 <span class="nge2-tag">循环数组</span></div>
        <div class="nge2-input-row">
          <input id="nge2-input" value="1,2,1">
          <button id="nge2-start">开始查找</button>
        </div>
        <div class="nge2-examples">
          <button class="nge2-example-btn" data-val="1,2,1">经典示例</button>
          <button class="nge2-example-btn" data-val="3,3,3">全部相同</button>
          <button class="nge2-example-btn" data-val="5,4,3,2,1">递减</button>
          <button class="nge2-example-btn" data-val="1,2,3,2,1">循环</button>
        </div>
      </section>

      <div class="nge2-stats">
        <div class="nge2-stat nge2-stat--i"><label>当前 i</label><span id="nge2-i">-</span></div>
        <div class="nge2-stat nge2-stat--idx"><label>实际下标</label><span id="nge2-idx">-</span></div>
        <div class="nge2-stat nge2-stat--top"><label>栈顶值</label><span id="nge2-top">-</span></div>
        <div class="nge2-stat nge2-stat--fill"><label>已填答案数</label><span id="nge2-filled">0</span></div>
      </div>

      <section class="nge2-card nge2-visual">
        <div class="nge2-card-title">循环数组柱状图 <span class="nge2-tag">栈内 / 已解</span></div>
        <div class="nge2-bars" id="nge2-bars"></div>
        <div class="nge2-stack-area">
          <div class="nge2-stack-title">📦 单调递减栈（存下标，值递减）</div>
          <div class="nge2-stack-items" id="nge2-stack"></div>
        </div>
        <div class="nge2-message" id="nge2-result">
          <span class="nge2-emoji">🔄</span>
          <div id="step-message">点击「开始查找」观看循环数组 + 单调栈动画</div>
        </div>
      </section>

      <section class="nge2-card">
        <div class="nge2-card-title">执行日志</div>
        <div class="nge2-log" id="nge2-log"></div>
      </section>
    </div>
    <aside class="nge2-code"><div data-code-panel></div></aside>
  </div>
  <div class="nge2-controls">
    <button id="step-reset" class="nge2-ctrl-btn">⏮ 重置</button>
    <button id="step-prev" class="nge2-ctrl-btn">◀ 上一步</button>
    <button id="step-play" class="nge2-ctrl-btn nge2-ctrl-primary">▶ 播放</button>
    <button id="step-next" class="nge2-ctrl-btn">下一步 ▶</button>
    <span id="step-counter" class="nge2-counter">步骤: 0 / 0</span>
    <div class="nge2-speed-wrap">
      <span>速度</span>
      <input id="nge2-speed" type="range" min="200" max="2500" step="100" value="900">
      <span id="nge2-speed-label" style="min-width:42px;">0.9s</span>
    </div>
  </div>
</div>
