<style>
  :root {
    --accent-a: #c084fc;
    --accent-b: #f472b6;
    --accent-rgb: 192, 132, 252;
  }
  #algo-spiral-matrix-ii-view {
    width: 100%; height: 100%; color: #cdd6f4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: radial-gradient(ellipse at 8% 6%, var(--accent-rgb), transparent 55%),
                radial-gradient(ellipse at 92% 94%, #f472b6, transparent 55%),
                linear-gradient(135deg, #181825, #1e1e2e, #11111b);
  }
  #algo-spiral-matrix-ii-view .sp-page {
    height: 100%; display: flex; flex-direction: column; overflow: hidden;
  }
  #algo-spiral-matrix-ii-view .sp-header {
    padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; gap: 18px;
  }
  #algo-spiral-matrix-ii-view .sp-icon-badge {
    width: 44px; height: 44px; border-radius: 10px; background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  #algo-spiral-matrix-ii-view h1 { margin: 0; font-size: 22px; font-weight: 800; color: #fff; }
  #algo-spiral-matrix-ii-view .sp-desc { margin: 5px 0 0; color: #a6adc8; font-size: 14px; line-height: 1.4; }
  #algo-spiral-matrix-ii-view .sp-tip {
    max-width: 430px; padding: 11px 14px; border-radius: 12px;
    background: rgba(192, 132, 252, 0.12); backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(192, 132, 252, 0.25); color: #bac2de; font-size: 13px; line-height: 1.55;
  }
  #algo-spiral-matrix-ii-view .sp-tip strong { color: var(--accent-a); }
  #algo-spiral-matrix-ii-view .sp-main {
    flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 420px;
    gap: 16px; padding: 16px; overflow: hidden;
  }
  #algo-spiral-matrix-ii-view .sp-left { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
  #algo-spiral-matrix-ii-view .sp-card {
    background: rgba(20, 18, 38, 0.55); backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; overflow: hidden; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }
  #algo-spiral-matrix-ii-view .sp-card-title {
    padding: 13px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: flex; justify-content: space-between; color: #fff; font-weight: 700; font-size: 14px;
  }
  #algo-spiral-matrix-ii-view .sp-input-row {
    display: grid; grid-template-columns: 120px auto 1fr; gap: 10px; align-items: center; padding: 16px;
  }
  #algo-spiral-matrix-ii-view input {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(20, 18, 38, 0.6); color: #cdd6f4; font-family: Consolas, monospace; outline: none;
  }
  #algo-spiral-matrix-ii-view input:focus { border-color: var(--accent-a); box-shadow: 0 0 0 3px rgba(192, 132, 252, 0.2); }
  #algo-spiral-matrix-ii-view button {
    padding: 9px 16px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(20, 18, 38, 0.6); color: #cdd6f4; cursor: pointer; transition: all 0.2s;
  }
  #algo-spiral-matrix-ii-view button:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b)); border-color: transparent; color: #fff;
  }
  #algo-spiral-matrix-ii-view button:disabled { opacity: 0.4; cursor: not-allowed; }
  #algo-spiral-matrix-ii-view .sp-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  #algo-spiral-matrix-ii-view .sp-stat {
    padding: 14px; background: rgba(20, 18, 38, 0.4); border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.06); position: relative; overflow: hidden;
  }
  #algo-spiral-matrix-ii-view .sp-stat::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: linear-gradient(180deg, var(--accent-a), var(--accent-b));
  }
  #algo-spiral-matrix-ii-view .sp-stat label { display: block; margin-bottom: 6px; color: #a6adc8; font-size: 12px; }
  #algo-spiral-matrix-ii-view .sp-stat span {
    color: var(--accent-a); font-family: Consolas, monospace; font-size: 21px; font-weight: 800;
  }
  #algo-spiral-matrix-ii-view .sp-visual { flex: 1; min-height: 240px; display: flex; flex-direction: column; }
  #algo-spiral-matrix-ii-view .sp-grid-wrap {
    flex: 1; min-height: 0; padding: 18px; overflow: auto; display: flex; align-items: center; justify-content: center;
  }
  #algo-spiral-matrix-ii-view .sp-grid { display: grid; gap: 6px; }
  #algo-spiral-matrix-ii-view .sp-cell {
    width: 52px; height: 52px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.06);
    background: rgba(20, 18, 38, 0.5); display: flex; align-items: center; justify-content: center;
    font-family: Consolas, monospace; font-size: 18px; font-weight: 700; color: #6c7086;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #algo-spiral-matrix-ii-view .sp-cell.filled {
    color: #cdd6f4; background: rgba(20, 18, 38, 0.7); border-color: rgba(255, 255, 255, 0.12);
  }
  #algo-spiral-matrix-ii-view .sp-cell.current {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b)); color: #fff;
    transform: scale(1.08); border-color: transparent;
    animation: pulse-glow 1.2s infinite;
  }
  #algo-spiral-matrix-ii-view .sp-result-banner {
    margin: 0 16px 16px; padding: 12px 16px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(20, 18, 38, 0.5); backdrop-filter: blur(18px); font-size: 14px; line-height: 1.5;
    transform: scale(1); transition: all 0.3s;
  }
  #algo-spiral-matrix-ii-view .sp-result-banner.success { background: rgba(34, 197, 94, 0.12); border-color: #22c55e; color: #86efac; }
  #algo-spiral-matrix-ii-view .sp-result-banner .badge { margin-right: 8px; }
  #algo-spiral-matrix-ii-view .sp-log {
    min-height: 90px; max-height: 120px; padding: 12px 16px; overflow: auto;
    background: rgba(20, 18, 38, 0.4); border-radius: 12px; font-family: Consolas, monospace; font-size: 12px; line-height: 1.7; color: #a6adc8;
  }
  #algo-spiral-matrix-ii-view .sp-log .active {
    color: var(--accent-a); background: rgba(192, 132, 252, 0.1); border-left: 2px solid var(--accent-a); padding-left: 8px;
  }
  #algo-spiral-matrix-ii-view .sp-code {
    min-height: 0; display: flex; background: rgba(20, 18, 38, 0.4); border-radius: 16px; overflow: hidden;
  }
  #algo-spiral-matrix-ii-view .sp-code [data-code-panel] { flex: 1; min-width: 0; }
  #algo-spiral-matrix-ii-view .sp-controls {
    padding: 14px 20px; background: rgba(20, 18, 38, 0.6); border-top: 1px solid rgba(255, 255, 255, 0.06);
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  #algo-spiral-matrix-ii-view .sp-btn {
    padding: 10px 18px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(20, 18, 38, 0.5); color: #cdd6f4; cursor: pointer; transition: all 0.2s;
    font-size: 14px; font-weight: 500;
  }
  #algo-spiral-matrix-ii-view .sp-btn:hover:not(:disabled) { border-color: var(--accent-a); color: #fff; }
  #algo-spiral-matrix-ii-view .sp-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #algo-spiral-matrix-ii-view .sp-play-btn {
    border: 1px solid transparent; background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #fff; font-weight: 600;
  }
  #algo-spiral-matrix-ii-view .sp-play-btn:hover:not(:disabled) { box-shadow: 0 0 20px rgba(192, 132, 252, 0.4); border-color: transparent; }
  #algo-spiral-matrix-ii-view .sp-counter { color: #a6adc8; font-size: 13px; min-width: 100px; text-align: center; }
  #algo-spiral-matrix-ii-view .sp-slider-container { display: flex; align-items: center; gap: 8px; }
  #algo-spiral-matrix-ii-view .sp-slider-container input[type=range] {
    width: 100px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.15);
    outline: none; -webkit-appearance: none;
  }
  #algo-spiral-matrix-ii-view .sp-slider-container input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent-a);
    cursor: pointer; box-shadow: 0 0 10px rgba(192, 132, 252, 0.4);
  }
  #algo-spiral-matrix-ii-view .sp-slider-container span { color: #a6adc8; font-size: 13px; min-width: 40px; }

  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(192, 132, 252, 0.5); }
    50% { box-shadow: 0 0 0 10px rgba(192, 132, 252, 0); }
  }
  @keyframes pop-in {
    0% { transform: scale(0); opacity: 0; }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes burst {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); filter: brightness(1.2); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  /* 螺旋填充发光：每填入一个新 cell 时脉冲发光 */
  @keyframes sp-filling {
    0% { box-shadow: 0 0 0 0 rgba(244, 114, 182, 0.9); transform: scale(1); filter: brightness(1); }
    35% { box-shadow: 0 0 26px 8px rgba(244, 114, 182, 0.85); transform: scale(1.15); filter: brightness(1.4); border-color: var(--accent-b); }
    100% { box-shadow: 0 0 10px 1px rgba(192, 132, 252, 0.3); transform: scale(1); filter: brightness(1); }
  }
  #algo-spiral-matrix-ii-view .sp-cell.new { animation: pop-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
  #algo-spiral-matrix-ii-view .sp-cell.current { animation: pulse-glow 1.2s infinite; }
  #algo-spiral-matrix-ii-view .sp-cell.success { animation: burst 0.5s ease-out; }
  #algo-spiral-matrix-ii-view .sp-cell.conflict { animation: shake 0.3s ease-in-out; }
  /* 填充发光 / 螺旋轨迹发光（新增） */
  #algo-spiral-matrix-ii-view .sp-cell.filling {
    animation: sp-filling 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 2;
  }
  #algo-spiral-matrix-ii-view .sp-cell.trail {
    box-shadow: 0 0 8px 0 rgba(192, 132, 252, 0.25);
    border-color: rgba(192, 132, 252, 0.25);
  }
  /* 方向指示器：当前填充方向箭头随 #sp-dir 文字变化（简化为统一发光徽章） */
  #algo-spiral-matrix-ii-view .sp-grid-wrap {
    position: relative;
  }
  #algo-spiral-matrix-ii-view .sp-grid-wrap::after {
    content: '◎';
    position: absolute; top: 10px; right: 14px;
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 800; color: var(--accent-a);
    background: rgba(20, 18, 38, 0.7);
    border: 1px solid rgba(192, 132, 252, 0.4);
    box-shadow: 0 0 0 0 rgba(192, 132, 252, 0.5);
    transition: all 0.3s;
  }
  #algo-spiral-matrix-ii-view .sp-grid-wrap[data-dir="right"]::after { content: '→'; color: #a6e3a1; border-color: #a6e3a1; box-shadow: 0 0 16px 2px rgba(166, 227, 161, 0.5); }
  #algo-spiral-matrix-ii-view .sp-grid-wrap[data-dir="down"]::after { content: '↓'; color: #89dceb; border-color: #89dceb; box-shadow: 0 0 16px 2px rgba(137, 220, 235, 0.5); }
  #algo-spiral-matrix-ii-view .sp-grid-wrap[data-dir="left"]::after { content: '←'; color: #f9e2af; border-color: #f9e2af; box-shadow: 0 0 16px 2px rgba(249, 226, 175, 0.5); }
  #algo-spiral-matrix-ii-view .sp-grid-wrap[data-dir="up"]::after { content: '↑'; color: #f5c2e7; border-color: #f5c2e7; box-shadow: 0 0 16px 2px rgba(245, 194, 231, 0.5); }
  #algo-spiral-matrix-ii-view .sp-grid-wrap[data-dir="done"]::after { content: '✓'; color: #a6e3a1; border-color: #a6e3a1; }

  @media (max-width: 1100px) {
    #algo-spiral-matrix-ii-view .sp-main { grid-template-columns: 1fr; overflow: auto; }
    #algo-spiral-matrix-ii-view .sp-code { min-height: 360px; }
    #algo-spiral-matrix-ii-view .sp-header { flex-direction: column; align-items: flex-start; gap: 10px; }
    #algo-spiral-matrix-ii-view .sp-tip { max-width: 100%; }
  }
</style>

<div class="sp-page">
  <div class="sp-header">
    <div>
      <div class="sp-icon-badge">🌀</div>
      <h1>螺旋矩阵 II（模拟）</h1>
      <p class="sp-desc">LeetCode 59：生成 n×n 矩阵，按顺时针螺旋顺序填入 1 到 n²</p>
    </div>
    <div class="sp-tip"><strong>按层模拟：</strong>维护上下左右四个边界，依次向右→向下→向左→向上填数，每填完一条边收缩对应边界。</div>
  </div>
  <div class="sp-main">
    <div class="sp-left">
      <section class="sp-card">
        <div class="sp-card-title">输入</div>
        <div class="sp-input-row">
          <input id="sp-n-input" type="number" min="1" max="8" value="4">
          <button id="sp-start">生成矩阵</button>
          <div></div>
        </div>
      </section>
      <div class="sp-stats">
        <div class="sp-stat"><label>当前填入</label><span id="sp-num">0</span></div>
        <div class="sp-stat"><label>方向</label><span id="sp-dir">-</span></div>
        <div class="sp-stat"><label>上/下边界</label><span id="sp-rowb">-</span></div>
        <div class="sp-stat"><label>左/右边界</label><span id="sp-colb">-</span></div>
      </div>
      <section class="sp-card sp-visual">
        <div class="sp-card-title">矩阵填充过程</div>
        <div class="sp-grid-wrap" id="sp-grid-wrap"></div>
        <div class="sp-result-banner" id="step-message"><span class="badge">💡</span>点击生成矩阵</div>
      </section>
      <section class="sp-card">
        <div class="sp-card-title">执行日志</div>
        <div class="sp-log" id="sp-log"></div>
      </section>
    </div>
    <aside class="sp-code"><div data-code-panel></div></aside>
  </div>
  <div class="sp-controls">
    <button id="step-reset" class="sp-btn">⏮重置</button>
    <button id="step-prev" class="sp-btn">◀上一步</button>
    <button id="step-play" class="sp-btn sp-play-btn">▶播放</button>
    <button id="step-next" class="sp-btn">下一步▶</button>
    <span id="step-counter" class="sp-counter">步骤: 0 / 0</span>
    <div class="sp-slider-container">
      <input id="step-speed" type="range" min="300" max="2000" step="100" value="700">
      <span id="step-speed-label" class="sp-counter">0.7s</span>
    </div>
  </div>
</div>
