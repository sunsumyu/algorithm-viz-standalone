<style>
  :root {
    --accent-a: #22d3ee;
    --accent-b: #14b8a6;
    --accent-rgb: 34, 211, 238;
  }
  #algo-sorted-squares-view {
    width: 100%; height: 100%; color: #cdd6f4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: radial-gradient(ellipse at 8% 6%, var(--accent-rgb), transparent 55%),
                radial-gradient(ellipse at 92% 94%, #14b8a6, transparent 55%),
                linear-gradient(135deg, #181825, #1e1e2e, #11111b);
  }
  #algo-sorted-squares-view .ssq-page {
    height: 100%; display: flex; flex-direction: column; overflow: hidden;
  }
  #algo-sorted-squares-view .ssq-header {
    padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; gap: 18px;
  }
  #algo-sorted-squares-view .ssq-icon-badge {
    width: 44px; height: 44px; border-radius: 10px; background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; color: #0f172a;
  }
  #algo-sorted-squares-view h1 { margin: 0; font-size: 22px; font-weight: 800; color: #fff; }
  #algo-sorted-squares-view .ssq-desc { margin: 5px 0 0; color: #a6adc8; font-size: 14px; line-height: 1.4; }
  #algo-sorted-squares-view .ssq-tip {
    max-width: 420px; padding: 11px 14px; border-radius: 12px;
    background: rgba(34, 211, 238, 0.12); backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(34, 211, 238, 0.25); color: #bac2de; font-size: 13px; line-height: 1.55;
  }
  #algo-sorted-squares-view .ssq-tip strong { color: var(--accent-a); }
  #algo-sorted-squares-view .ssq-main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 16px; padding: 16px; overflow: hidden; }
  #algo-sorted-squares-view .ssq-left { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
  #algo-sorted-squares-view .ssq-card {
    background: rgba(20, 18, 38, 0.55); backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; overflow: hidden; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }
  #algo-sorted-squares-view .ssq-card-title {
    padding: 13px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: flex; justify-content: space-between; color: #fff; font-weight: 700; font-size: 14px;
  }
  #algo-sorted-squares-view .ssq-input-row {
    display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 16px;
  }
  #algo-sorted-squares-view input {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(20, 18, 38, 0.6); color: #cdd6f4; font-family: Consolas, monospace; outline: none;
  }
  #algo-sorted-squares-view input:focus { border-color: var(--accent-a); box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.2); }
  #algo-sorted-squares-view button {
    padding: 9px 16px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(20, 18, 38, 0.6); color: #cdd6f4; cursor: pointer; transition: all 0.2s;
  }
  #algo-sorted-squares-view button:hover:not(:disabled) { background: linear-gradient(135deg, var(--accent-a), var(--accent-b)); border-color: transparent; color: #0f172a; font-weight: 700; }
  #algo-sorted-squares-view button:disabled { opacity: 0.4; cursor: not-allowed; }
  #algo-sorted-squares-view .ssq-examples { padding: 0 16px 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  #algo-sorted-squares-view .ssq-example-btn {
    padding: 6px 12px; border-radius: 999px; font-size: 12px; border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(20, 18, 38, 0.4); color: #a6adc8; cursor: pointer; transition: all 0.2s;
  }
  #algo-sorted-squares-view .ssq-example-btn:hover { border-color: var(--accent-a); color: #fff; }
  #algo-sorted-squares-view .ssq-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  #algo-sorted-squares-view .ssq-stat {
    padding: 14px; background: rgba(20, 18, 38, 0.4); border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.06); position: relative; overflow: hidden;
  }
  #algo-sorted-squares-view .ssq-stat::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: linear-gradient(180deg, var(--accent-a), var(--accent-b));
  }
  #algo-sorted-squares-view .ssq-stat label { display: block; margin-bottom: 6px; color: #a6adc8; font-size: 12px; }
  #algo-sorted-squares-view .ssq-stat span {
    color: var(--accent-a); font-family: Consolas, monospace; font-size: 21px; font-weight: 800;
  }
  #algo-sorted-squares-view .ssq-visual { flex: 1; min-height: 230px; display: flex; flex-direction: column; }
  #algo-sorted-squares-view .ssq-viz-body { flex: 1; min-height: 0; padding: 18px; overflow: auto; display: flex; flex-direction: column; gap: 24px; justify-content: center; }
  #algo-sorted-squares-view .ssq-row { display: flex; flex-direction: column; gap: 6px; }
  #algo-sorted-squares-view .ssq-row-label { color: #a6adc8; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
  #algo-sorted-squares-view .ssq-track { display: flex; align-items: center; gap: 10px; }
  #algo-sorted-squares-view .ssq-cell {
    min-width: 54px; height: 60px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(20, 18, 38, 0.5); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative;
  }
  #algo-sorted-squares-view .ssq-cell .idx { color: #6c7086; font-size: 11px; }
  #algo-sorted-squares-view .ssq-cell .val { color: #cdd6f4; font-weight: 800; font-size: 18px; }
  #algo-sorted-squares-view .ssq-cell.empty .val { color: #585b70; font-style: italic; font-size: 14px; }
  #algo-sorted-squares-view .ssq-cell.left-ptr {
    border-color: #a6e3a1; box-shadow: 0 0 0 3px rgba(166, 227, 161, 0.25);
  }
  #algo-sorted-squares-view .ssq-cell.right-ptr {
    border-color: #fab387; box-shadow: 0 0 0 3px rgba(250, 179, 135, 0.25);
  }
  #algo-sorted-squares-view .ssq-cell.both-ptr {
    border-image: linear-gradient(135deg, #a6e3a1, #fab387) 1;
    box-shadow: 0 0 0 3px rgba(166, 227, 161, 0.25), 0 0 0 6px rgba(250, 179, 135, 0.2);
  }
  #algo-sorted-squares-view .ssq-cell.compare {
    background: rgba(34, 211, 238, 0.18); border-color: var(--accent-a);
    box-shadow: 0 0 20px rgba(34, 211, 238, 0.4); transform: translateY(-4px);
    animation: pulse-glow-cyan 1.2s infinite;
  }
  #algo-sorted-squares-view .ssq-cell.writing {
    background: rgba(20, 184, 166, 0.22); border-color: var(--accent-b);
    box-shadow: 0 0 24px rgba(20, 184, 166, 0.5);
    animation: pop-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #algo-sorted-squares-view .ssq-cell.filled {
    background: rgba(34, 211, 238, 0.08); border-color: rgba(34, 211, 238, 0.4);
  }
  #algo-sorted-squares-view .ssq-cell.done {
    background: rgba(166, 227, 161, 0.12); border-color: #a6e3a1;
  }
  #algo-sorted-squares-view .ssq-ptr {
    position: absolute; top: -18px; font-size: 11px; font-weight: 700; white-space: nowrap;
  }
  #algo-sorted-squares-view .ssq-ptr.left { color: #a6e3a1; left: 4px; }
  #algo-sorted-squares-view .ssq-ptr.right { color: #fab387; right: 4px; }
  #algo-sorted-squares-view .ssq-ptr.write { color: var(--accent-a); left: 50%; transform: translateX(-50%); top: -18px; }
  #algo-sorted-squares-view .ssq-result-banner {
    margin: 0 16px 16px; padding: 12px 16px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(20, 18, 38, 0.5); backdrop-filter: blur(18px); font-size: 14px; line-height: 1.5;
    transform: scale(1); transition: all 0.3s;
  }
  #algo-sorted-squares-view .ssq-result-banner.success { background: rgba(166, 227, 161, 0.12); border-color: #a6e3a1; color: #86efac; }
  #algo-sorted-squares-view .ssq-result-banner .badge { margin-right: 8px; }
  #algo-sorted-squares-view .ssq-log {
    min-height: 90px; max-height: 120px; padding: 12px 16px; overflow: auto;
    background: rgba(20, 18, 38, 0.4); border-radius: 12px; font-family: Consolas, monospace; font-size: 12px; line-height: 1.7; color: #a6adc8;
  }
  #algo-sorted-squares-view .ssq-log .active { color: var(--accent-a); background: rgba(34, 211, 238, 0.1); border-left: 2px solid var(--accent-a); padding-left: 8px; }
  #algo-sorted-squares-view .ssq-code {
    min-height: 0; display: flex; background: rgba(20, 18, 38, 0.4); border-radius: 16px; overflow: hidden;
  }
  #algo-sorted-squares-view .ssq-code [data-code-panel] { flex: 1; min-width: 0; }
  #algo-sorted-squares-view .ssq-controls {
    padding: 14px 20px; background: rgba(20, 18, 38, 0.6); border-top: 1px solid rgba(255, 255, 255, 0.06);
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  #algo-sorted-squares-view .ssq-btn {
    padding: 10px 18px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(20, 18, 38, 0.5); color: #cdd6f4; cursor: pointer; transition: all 0.2s;
    font-size: 14px; font-weight: 500;
  }
  #algo-sorted-squares-view .ssq-btn:hover:not(:disabled) { border-color: var(--accent-a); color: #fff; }
  #algo-sorted-squares-view .ssq-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #algo-sorted-squares-view .ssq-play-btn {
    border: 1px solid transparent; background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #0f172a; font-weight: 700;
  }
  #algo-sorted-squares-view .ssq-play-btn:hover:not(:disabled) { box-shadow: 0 0 20px rgba(34, 211, 238, 0.4); border-color: transparent; }
  #algo-sorted-squares-view .ssq-counter { color: #a6adc8; font-size: 13px; min-width: 100px; text-align: center; }
  #algo-sorted-squares-view .ssq-slider-container { display: flex; align-items: center; gap: 8px; }
  #algo-sorted-squares-view .ssq-slider-container input[type=range] {
    width: 100px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.15);
    outline: none; -webkit-appearance: none;
  }
  #algo-sorted-squares-view .ssq-slider-container input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent-a);
    cursor: pointer; box-shadow: 0 0 10px rgba(34, 211, 238, 0.4);
  }
  #algo-sorted-squares-view .ssq-slider-container span {
    color: #a6adc8; font-size: 13px; min-width: 40px;
  }

  @keyframes pulse-glow-cyan {
    0%, 100% { box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.4); }
    50% { box-shadow: 0 0 0 8px rgba(34, 211, 238, 0); }
  }
  @keyframes pop-in {
    0% { transform: scale(0); opacity: 0; }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes burst {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); filter: brightness(1.2); }
  }
  /* 元素被"飞入结果数组"：input cell 渐隐 + 缩小 */
  @keyframes ssq-flying-out {
    0% { transform: scale(1) translateY(0); opacity: 1; filter: brightness(1); box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.6); }
    50% { transform: scale(1.15) translateY(-8px); filter: brightness(1.4); box-shadow: 0 0 24px 4px rgba(34, 211, 238, 0.7); }
    100% { transform: scale(1) translateY(0); opacity: 1; filter: brightness(1); box-shadow: 0 0 0 0 rgba(34, 211, 238, 0); }
  }
  /* 结果 cell 被填入：从 input 轨道方向"飞入" */
  @keyframes ssq-flying-in {
    0% { transform: translateY(-32px) scale(0.6); opacity: 0; filter: brightness(1.6); box-shadow: 0 0 30px 6px rgba(20, 184, 166, 0.8); }
    40% { opacity: 1; }
    70% { transform: translateY(4px) scale(1.08); box-shadow: 0 0 26px 4px rgba(20, 184, 166, 0.6); }
    100% { transform: translateY(0) scale(1); opacity: 1; filter: brightness(1); box-shadow: 0 0 0 0 rgba(20, 184, 166, 0); }
  }
  #algo-sorted-squares-view .ssq-cell.new { animation: pop-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
  #algo-sorted-squares-view .ssq-cell.success { animation: burst 0.5s ease-out; }
  /* 飞入/飞出动画 class（新增） */
  #algo-sorted-squares-view .ssq-cell.flying-out {
    animation: ssq-flying-out 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 2;
  }
  #algo-sorted-squares-view .ssq-cell.flying-in {
    animation: ssq-flying-in 0.7s cubic-bezier(0.34, 1.4, 0.64, 1);
    z-index: 2;
    background: rgba(20, 184, 166, 0.28);
    border-color: var(--accent-b);
  }

  @media (max-width: 1100px) {
    #algo-sorted-squares-view .ssq-main { grid-template-columns: 1fr; overflow: auto; }
    #algo-sorted-squares-view .ssq-code { min-height: 360px; }
    #algo-sorted-squares-view .ssq-header { flex-direction: column; align-items: flex-start; gap: 10px; }
    #algo-sorted-squares-view .ssq-tip { max-width: 100%; }
  }
</style>

<div class="ssq-page">
  <div class="ssq-header">
    <div>
      <div class="ssq-icon-badge">²</div>
      <h1>有序数组的平方（双指针）</h1>
      <p class="ssq-desc">LeetCode 977 · 首尾双指针从大到小填入结果</p>
    </div>
    <div class="ssq-tip"><strong>首尾双指针：</strong>由于数组已有序，平方后的最大值一定出现在两端。用 left / right 从两端向内比较，将较大者从结果数组最右端开始依次填入。</div>
  </div>

  <div class="ssq-main">
    <div class="ssq-left">
      <section class="ssq-card">
        <div class="ssq-card-title"><span>输入</span><span style="color:#a6adc8;font-weight:400;font-size:12px;">非递减排序数组</span></div>
        <div class="ssq-input-row">
          <input id="ssq-array-input" value="-4,-1,0,3,10">
          <button id="ssq-start">开始计算</button>
        </div>
        <div class="ssq-examples">
          <button class="ssq-example-btn" data-arr="-4,-1,0,3,10">-4,-1,0,3,10</button>
          <button class="ssq-example-btn" data-arr="-7,-3,2,3,11">-7,-3,2,3,11</button>
          <button class="ssq-example-btn" data-arr="-5,-3,-2,-1">-5,-3,-2,-1</button>
        </div>
      </section>

      <div class="ssq-stats">
        <div class="ssq-stat"><label>左指针 left</label><span id="ssq-left">0</span></div>
        <div class="ssq-stat"><label>右指针 right</label><span id="ssq-right">0</span></div>
        <div class="ssq-stat"><label>写入位置 i</label><span id="ssq-write">-</span></div>
        <div class="ssq-stat"><label>当前平方</label><span id="ssq-square">-</span></div>
      </div>

      <section class="ssq-card ssq-visual">
        <div class="ssq-card-title"><span>数组可视化</span><span id="ssq-viz-hint" style="color:#a6adc8;font-weight:400;font-size:12px;">结果从右往左填充</span></div>
        <div class="ssq-viz-body">
          <div class="ssq-row">
            <div class="ssq-row-label">输入数组 nums</div>
            <div class="ssq-track" id="ssq-input-track"></div>
          </div>
          <div class="ssq-row">
            <div class="ssq-row-label">结果数组 result</div>
            <div class="ssq-track" id="ssq-result-track"></div>
          </div>
        </div>
        <div class="ssq-result-banner" id="step-message"><span class="badge">💡</span>点击开始计算</div>
      </section>

      <section class="ssq-card">
        <div class="ssq-card-title">执行日志</div>
        <div class="ssq-log" id="ssq-log"></div>
      </section>
    </div>
    <aside class="ssq-code"><div data-code-panel></div></aside>
  </div>

  <div class="ssq-controls">
    <button id="step-reset" class="ssq-btn">⏮重置</button>
    <button id="step-prev" class="ssq-btn">◀上一步</button>
    <button id="step-play" class="ssq-btn ssq-play-btn">▶播放</button>
    <button id="step-next" class="ssq-btn">下一步▶</button>
    <span id="step-counter" class="ssq-counter">步骤: 0 / 0</span>
    <div class="ssq-slider-container">
      <input id="step-speed" type="range" min="400" max="2500" step="100" value="900">
      <span id="step-speed-label" class="ssq-counter">0.9s</span>
    </div>
  </div>
</div>
