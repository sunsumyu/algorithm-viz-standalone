<style>
  :root {
    --accent-a: #60a5fa;
    --accent-b: #22d3ee;
    --accent-rgb: 96, 165, 250;
  }
  #algo-min-subarray-len-view {
    width: 100%; height: 100%; color: #cdd6f4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: radial-gradient(ellipse at 8% 6%, var(--accent-rgb), transparent 55%),
                radial-gradient(ellipse at 92% 94%, #c8b6ff, transparent 55%),
                linear-gradient(135deg, #181825, #1e1e2e, #11111b);
  }
  #algo-min-subarray-len-view .sw-page {
    height: 100%; display: flex; flex-direction: column; overflow: hidden;
  }
  #algo-min-subarray-len-view .sw-header {
    padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; gap: 18px;
  }
  #algo-min-subarray-len-view .sw-icon-badge {
    width: 44px; height: 44px; border-radius: 10px; background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  #algo-min-subarray-len-view h1 { margin: 0; font-size: 22px; font-weight: 800; color: #fff; }
  #algo-min-subarray-len-view .sw-desc { margin: 5px 0 0; color: #a6adc8; font-size: 14px; line-height: 1.4; }
  #algo-min-subarray-len-view .sw-tip {
    max-width: 430px; padding: 11px 14px; border-radius: 12px;
    background: rgba(96, 165, 250, 0.12); backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(96, 165, 250, 0.25); color: #bac2de; font-size: 13px; line-height: 1.55;
  }
  #algo-min-subarray-len-view .sw-tip strong { color: var(--accent-b); }
  #algo-min-subarray-len-view .sw-main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 16px; padding: 16px; overflow: hidden; }
  #algo-min-subarray-len-view .sw-left { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
  #algo-min-subarray-len-view .sw-card {
    background: rgba(20, 18, 38, 0.55); backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; overflow: hidden; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }
  #algo-min-subarray-len-view .sw-card-title {
    padding: 13px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: flex; justify-content: space-between; color: #fff; font-weight: 700; font-size: 14px;
  }
  #algo-min-subarray-len-view .sw-input-row {
    display: grid; grid-template-columns: 1fr 110px auto; gap: 10px; align-items: center; padding: 16px;
  }
  #algo-min-subarray-len-view input {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(20, 18, 38, 0.6); color: #cdd6f4; font-family: Consolas, monospace; outline: none;
  }
  #algo-min-subarray-len-view input:focus { border-color: var(--accent-b); box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.2); }
  #algo-min-subarray-len-view button {
    padding: 9px 16px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(20, 18, 38, 0.6); color: #cdd6f4; cursor: pointer; transition: all 0.2s;
  }
  #algo-min-subarray-len-view button:hover:not(:disabled) { background: linear-gradient(135deg, var(--accent-a), var(--accent-b)); border-color: transparent; color: #fff; }
  #algo-min-subarray-len-view button:disabled { opacity: 0.4; cursor: not-allowed; }
  #algo-min-subarray-len-view .sw-examples { padding: 0 16px 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  #algo-min-subarray-len-view .sw-example-btn {
    padding: 6px 12px; border-radius: 999px; font-size: 12px; border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(20, 18, 38, 0.4); color: #a6adc8; cursor: pointer; transition: all 0.2s;
  }
  #algo-min-subarray-len-view .sw-example-btn:hover { border-color: var(--accent-b); color: #fff; }
  #algo-min-subarray-len-view .sw-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  #algo-min-subarray-len-view .sw-stat {
    padding: 14px; background: rgba(20, 18, 38, 0.4); border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.06); position: relative; overflow: hidden;
  }
  #algo-min-subarray-len-view .sw-stat::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: linear-gradient(180deg, var(--accent-a), var(--accent-b));
  }
  #algo-min-subarray-len-view .sw-stat label { display: block; margin-bottom: 6px; color: #a6adc8; font-size: 12px; }
  #algo-min-subarray-len-view .sw-stat span {
    color: var(--accent-b); font-family: Consolas, monospace; font-size: 21px; font-weight: 800;
  }
  #algo-min-subarray-len-view .sw-visual { flex: 1; min-height: 230px; display: flex; flex-direction: column; }
  #algo-min-subarray-len-view .sw-track {
    flex: 1; min-height: 0; padding: 22px 18px; overflow: auto; display: flex; align-items: center; gap: 10px;
    position: relative;
  }
  #algo-min-subarray-len-view .sw-cell {
    min-width: 54px; height: 60px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(20, 18, 38, 0.5); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    transition: background 0.3s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative;
  }
  #algo-min-subarray-len-view .sw-cell .idx { color: #6c7086; font-size: 11px; }
  #algo-min-subarray-len-view .sw-cell .val { color: #cdd6f4; font-weight: 800; font-size: 20px; }
  #algo-min-subarray-len-view .sw-cell.inwindow {
    background: rgba(34, 211, 238, 0.10); border-color: rgba(34, 211, 238, 0.45);
  }
  /* 窗口框覆盖层：整体平移滑动，覆盖在 cells 上方 */
  #algo-min-subarray-len-view .sw-window-box {
    position: absolute; left: 0; top: 0; width: 0; height: 60px; border-radius: 10px;
    background: rgba(34, 211, 238, 0.10); border: 2px solid var(--accent-b);
    pointer-events: none; box-sizing: border-box; z-index: 5;
    transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1), width 0.32s cubic-bezier(0.4, 0, 0.2, 1), height 0.32s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease;
    box-shadow: 0 0 16px rgba(34, 211, 238, 0.22);
  }
  #algo-min-subarray-len-view .sw-ptr {
    position: absolute; top: -18px; font-size: 11px; font-weight: 700; z-index: 6;
  }
  #algo-min-subarray-len-view .sw-ptr.left { color: #a6e3a1; }
  #algo-min-subarray-len-view .sw-ptr.right { color: var(--accent-b); }
  #algo-min-subarray-len-view .sw-result-banner {
    margin: 0 16px 16px; padding: 12px 16px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(20, 18, 38, 0.5); backdrop-filter: blur(18px); font-size: 14px; line-height: 1.5;
    transform: scale(1); transition: all 0.3s;
  }
  #algo-min-subarray-len-view .sw-result-banner.success { background: rgba(34, 197, 94, 0.12); border-color: #22c55e; color: #86efac; }
  #algo-min-subarray-len-view .sw-result-banner .badge { margin-right: 8px; }
  #algo-min-subarray-len-view .sw-log {
    min-height: 90px; max-height: 120px; padding: 12px 16px; overflow: auto;
    background: rgba(20, 18, 38, 0.4); border-radius: 12px; font-family: Consolas, monospace; font-size: 12px; line-height: 1.7; color: #a6adc8;
  }
  #algo-min-subarray-len-view .sw-log .active { color: var(--accent-b); background: rgba(34, 211, 238, 0.1); border-left: 2px solid var(--accent-b); padding-left: 8px; }
  #algo-min-subarray-len-view .sw-code {
    min-height: 0; display: flex; background: rgba(20, 18, 38, 0.4); border-radius: 16px; overflow: hidden;
  }
  #algo-min-subarray-len-view .sw-code [data-code-panel] { flex: 1; min-width: 0; }
  #algo-min-subarray-len-view .sw-controls {
    padding: 14px 20px; background: rgba(20, 18, 38, 0.6); border-top: 1px solid rgba(255, 255, 255, 0.06);
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  #algo-min-subarray-len-view .sw-btn {
    padding: 10px 18px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(20, 18, 38, 0.5); color: #cdd6f4; cursor: pointer; transition: all 0.2s;
    font-size: 14px; font-weight: 500;
  }
  #algo-min-subarray-len-view .sw-btn:hover:not(:disabled) { border-color: var(--accent-a); color: #fff; }
  #algo-min-subarray-len-view .sw-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #algo-min-subarray-len-view .sw-play-btn {
    border: 1px solid transparent; background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #fff; font-weight: 600;
  }
  #algo-min-subarray-len-view .sw-play-btn:hover:not(:disabled) { box-shadow: 0 0 20px rgba(34, 211, 238, 0.4); border-color: transparent; }
  #algo-min-subarray-len-view .sw-counter { color: #a6adc8; font-size: 13px; min-width: 100px; text-align: center; }
  #algo-min-subarray-len-view .sw-slider-container { display: flex; align-items: center; gap: 8px; }
  #algo-min-subarray-len-view .sw-slider-container input[type=range] {
    width: 100px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.15);
    outline: none; -webkit-appearance: none;
  }
  #algo-min-subarray-len-view .sw-slider-container input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent-b);
    cursor: pointer; box-shadow: 0 0 10px rgba(34, 211, 238, 0.4);
  }
  #algo-min-subarray-len-view .sw-slider-container span {
    color: #a6adc8; font-size: 13px; min-width: 40px;
  }

  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.4); }
    50% { box-shadow: 0 0 0 8px rgba(34, 211, 238, 0); }
  }
  @keyframes pop-in {
    0% { transform: scale(0); opacity: 0; }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes burst {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); filter: brightness(1.2); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  #algo-min-subarray-len-view .sw-cell.new { animation: pop-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
  #algo-min-subarray-len-view .sw-cell.current { animation: pulse-glow 1.2s infinite; }
  #algo-min-subarray-len-view .sw-cell.success { animation: burst 0.5s ease-out; }
  #algo-min-subarray-len-view .sw-cell.conflict { animation: shake 0.3s ease-in-out; }

  @media (max-width: 1100px) {
    #algo-min-subarray-len-view .sw-main { grid-template-columns: 1fr; overflow: auto; }
    #algo-min-subarray-len-view .sw-code { min-height: 360px; }
    #algo-min-subarray-len-view .sw-header { flex-direction: column; align-items: flex-start; gap: 10px; }
    #algo-min-subarray-len-view .sw-tip { max-width: 100%; }
  }
</style>

<div class="sw-page">
  <div class="sw-header">
    <div>
      <div class="sw-icon-badge">🪟</div>
      <h1>长度最小的子数组（滑动窗口）</h1>
      <p class="sw-desc">LeetCode 209：找出和 ≥ target 的长度最小连续子数组</p>
    </div>
    <div class="sw-tip"><strong>滑动窗口：</strong>右指针扩展窗口累加，当窗口和 ≥ target 时左指针收缩尝试缩小长度。</div>
  </div>
  <div class="sw-main">
    <div class="sw-left">
      <section class="sw-card">
        <div class="sw-card-title">输入</div>
        <div class="sw-input-row">
          <input id="sw-array-input" value="2,3,1,2,4,3">
          <input id="sw-target-input" value="7">
          <button id="sw-start">开始滑窗</button>
        </div>
        <div class="sw-examples">
          <button class="sw-example-btn" data-arr="2,3,1,2,4,3" data-tgt="7">示例 target=7</button>
          <button class="sw-example-btn" data-arr="1,4,4" data-tgt="4">target=4</button>
          <button class="sw-example-btn" data-arr="1,1,1,1,7" data-tgt="7">末尾命中</button>
        </div>
      </section>
      <div class="sw-stats">
        <div class="sw-stat"><label>左指针 left</label><span id="sw-left-ptr">0</span></div>
        <div class="sw-stat"><label>右指针 right</label><span id="sw-right-ptr">0</span></div>
        <div class="sw-stat"><label>窗口和</label><span id="sw-sum">0</span></div>
        <div class="sw-stat"><label>最小长度</label><span id="sw-minlen">∞</span></div>
      </div>
      <section class="sw-card sw-visual">
        <div class="sw-card-title">窗口可视化</div>
        <div class="sw-track" id="sw-track"></div>
        <div class="sw-result-banner" id="step-message"><span class="badge">💡</span>点击开始滑窗</div>
      </section>
      <section class="sw-card">
        <div class="sw-card-title">执行日志</div>
        <div class="sw-log" id="sw-log"></div>
      </section>
    </div>
    <aside class="sw-code"><div data-code-panel></div></aside>
  </div>
  <div class="sw-controls">
    <button id="step-reset" class="sw-btn">⏮重置</button>
    <button id="step-prev" class="sw-btn">◀上一步</button>
    <button id="step-play" class="sw-btn sw-play-btn">▶播放</button>
    <button id="step-next" class="sw-btn">下一步▶</button>
    <span id="step-counter" class="sw-counter">步骤: 0 / 0</span>
    <div class="sw-slider-container">
      <input id="step-speed" type="range" min="400" max="2500" step="100" value="900">
      <span id="step-speed-label" class="sw-counter">0.9s</span>
    </div>
  </div>
</div>
