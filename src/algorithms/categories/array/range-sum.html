<style>
  :root {
    --accent-a: #a78bfa;
    --accent-b: #c084fc;
    --accent-rgb: 167, 139, 250;
  }
  #algo-range-sum-view {
    width: 100%; height: 100%; color: #cdd6f4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: radial-gradient(ellipse at 8% 6%, var(--accent-rgb), transparent 55%),
                radial-gradient(ellipse at 92% 94%, #c084fc, transparent 55%),
                linear-gradient(135deg, #181825, #1e1e2e, #11111b);
  }
  #algo-range-sum-view .rsum-page {
    height: 100%; display: flex; flex-direction: column; overflow: hidden;
  }
  #algo-range-sum-view .rsum-header {
    padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; gap: 18px;
  }
  #algo-range-sum-view .rsum-icon-badge {
    width: 44px; height: 44px; border-radius: 10px; background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  #algo-range-sum-view h1 { margin: 0; font-size: 22px; font-weight: 800; color: #fff; }
  #algo-range-sum-view .rsum-desc { margin: 5px 0 0; color: #a6adc8; font-size: 14px; line-height: 1.4; }
  #algo-range-sum-view .rsum-tip {
    max-width: 420px; padding: 11px 14px; border-radius: 12px;
    background: rgba(167, 139, 250, 0.12); backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(167, 139, 250, 0.25); color: #bac2de; font-size: 13px; line-height: 1.55;
  }
  #algo-range-sum-view .rsum-tip strong { color: var(--accent-a); }
  #algo-range-sum-view .rsum-main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 16px; padding: 16px; overflow: hidden; }
  #algo-range-sum-view .rsum-left { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
  #algo-range-sum-view .rsum-card {
    background: rgba(20, 18, 38, 0.55); backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; overflow: hidden; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }
  #algo-range-sum-view .rsum-card-title {
    padding: 13px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: flex; justify-content: space-between; color: #fff; font-weight: 700; font-size: 14px;
  }
  #algo-range-sum-view .rsum-input-row {
    display: grid; grid-template-columns: 1fr 180px auto; gap: 10px; align-items: center; padding: 16px;
  }
  #algo-range-sum-view input {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(20, 18, 38, 0.6); color: #cdd6f4; font-family: Consolas, monospace; outline: none;
  }
  #algo-range-sum-view input:focus { border-color: var(--accent-a); box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.2); }
  #algo-range-sum-view button {
    padding: 9px 16px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(20, 18, 38, 0.6); color: #cdd6f4; cursor: pointer; transition: all 0.2s;
  }
  #algo-range-sum-view button:hover:not(:disabled) { background: linear-gradient(135deg, var(--accent-a), var(--accent-b)); border-color: transparent; color: #fff; }
  #algo-range-sum-view button:disabled { opacity: 0.4; cursor: not-allowed; }
  #algo-range-sum-view .rsum-examples { padding: 0 16px 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  #algo-range-sum-view .rsum-example-btn {
    padding: 6px 12px; border-radius: 999px; font-size: 12px; border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(20, 18, 38, 0.4); color: #a6adc8; cursor: pointer; transition: all 0.2s;
  }
  #algo-range-sum-view .rsum-example-btn:hover { border-color: var(--accent-a); color: #fff; }
  #algo-range-sum-view .rsum-stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  #algo-range-sum-view .rsum-stat {
    padding: 14px; background: rgba(20, 18, 38, 0.4); border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.06); position: relative; overflow: hidden;
  }
  #algo-range-sum-view .rsum-stat::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: linear-gradient(180deg, var(--accent-a), var(--accent-b));
  }
  #algo-range-sum-view .rsum-stat label { display: block; margin-bottom: 6px; color: #a6adc8; font-size: 12px; }
  #algo-range-sum-view .rsum-stat span {
    color: var(--accent-a); font-family: Consolas, monospace; font-size: 21px; font-weight: 800;
  }
  #algo-range-sum-view .rsum-visual { flex: 1; min-height: 280px; display: flex; flex-direction: column; }
  #algo-range-sum-view .rsum-track {
    flex: 1; min-height: 0; padding: 18px; overflow: auto; display: flex; flex-direction: column; gap: 16px;
  }
  #algo-range-sum-view .rsum-row {
    display: flex; align-items: center; gap: 10px;
  }
  #algo-range-sum-view .rsum-row-label {
    min-width: 80px; color: #a6adc8; font-size: 13px; font-weight: 600;
  }
  #algo-range-sum-view .rsum-row-cells {
    display: flex; gap: 8px; flex: 1;
  }
  #algo-range-sum-view .rsum-cell {
    min-width: 54px; height: 60px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(20, 18, 38, 0.5); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative;
  }
  #algo-range-sum-view .rsum-cell .idx { color: #6c7086; font-size: 11px; }
  #algo-range-sum-view .rsum-cell .val { color: #cdd6f4; font-weight: 800; font-size: 20px; }
  #algo-range-sum-view .rsum-cell.range {
    background: rgba(167, 139, 250, 0.25); border-color: var(--accent-a);
    box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.3);
  }
  #algo-range-sum-view .rsum-cell.active {
    border-color: #f9e2af; box-shadow: 0 0 0 3px rgba(249, 226, 175, 0.3);
    animation: pulse-glow-purple 1.2s infinite;
  }
  #algo-range-sum-view .rsum-cell.computed {
    background: rgba(166, 227, 161, 0.15); border-color: #a6e3a1;
  }
  #algo-range-sum-view .rsum-formula {
    padding: 14px 16px; background: rgba(20, 18, 38, 0.5); border-radius: 12px;
    border: 1px solid rgba(167, 139, 250, 0.2); font-family: Consolas, monospace; font-size: 14px;
    color: #cdd6f4; text-align: center;
  }
  #algo-range-sum-view .rsum-formula .highlight { color: var(--accent-a); font-weight: 700; }
  #algo-range-sum-view .rsum-results {
    padding: 16px; display: flex; flex-direction: column; gap: 8px;
  }
  #algo-range-sum-view .rsum-result-item {
    padding: 10px 14px; background: rgba(20, 18, 38, 0.4); border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.08); font-size: 14px; line-height: 1.5;
  }
  #algo-range-sum-view .rsum-result-item .query { color: #a6adc8; }
  #algo-range-sum-view .rsum-result-item .answer { color: var(--accent-a); font-weight: 700; font-size: 16px; margin-left: 12px; }
  #algo-range-sum-view .rsum-result-banner {
    margin: 0 16px 16px; padding: 12px 16px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(20, 18, 38, 0.5); backdrop-filter: blur(18px); font-size: 14px; line-height: 1.5;
  }
  #algo-range-sum-view .rsum-result-banner.success { background: rgba(167, 139, 250, 0.15); border-color: var(--accent-a); color: #d8b4fe; }
  #algo-range-sum-view .rsum-log {
    min-height: 90px; max-height: 120px; padding: 12px 16px; overflow: auto;
    background: rgba(20, 18, 38, 0.4); border-radius: 12px; font-family: Consolas, monospace; font-size: 12px; line-height: 1.7; color: #a6adc8;
  }
  #algo-range-sum-view .rsum-log .active { color: var(--accent-a); background: rgba(167, 139, 250, 0.1); border-left: 2px solid var(--accent-a); padding-left: 8px; }
  #algo-range-sum-view .rsum-code {
    min-height: 0; display: flex; background: rgba(20, 18, 38, 0.4); border-radius: 16px; overflow: hidden;
  }
  #algo-range-sum-view .rsum-code [data-code-panel] { flex: 1; min-width: 0; }
  #algo-range-sum-view .rsum-controls {
    padding: 14px 20px; background: rgba(20, 18, 38, 0.6); border-top: 1px solid rgba(255, 255, 255, 0.06);
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  #algo-range-sum-view .rsum-btn {
    padding: 10px 18px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(20, 18, 38, 0.5); color: #cdd6f4; cursor: pointer; transition: all 0.2s;
    font-size: 14px; font-weight: 500;
  }
  #algo-range-sum-view .rsum-btn:hover:not(:disabled) { border-color: var(--accent-a); color: #fff; }
  #algo-range-sum-view .rsum-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #algo-range-sum-view .rsum-play-btn {
    border: 1px solid transparent; background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #fff; font-weight: 600;
  }
  #algo-range-sum-view .rsum-play-btn:hover:not(:disabled) { box-shadow: 0 0 20px rgba(167, 139, 250, 0.4); border-color: transparent; }
  #algo-range-sum-view .rsum-counter { color: #a6adc8; font-size: 13px; min-width: 100px; text-align: center; }
  #algo-range-sum-view .rsum-slider-container { display: flex; align-items: center; gap: 8px; }
  #algo-range-sum-view .rsum-slider-container input[type=range] {
    width: 100px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.15);
    outline: none; -webkit-appearance: none;
  }
  #algo-range-sum-view .rsum-slider-container input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent-a);
    cursor: pointer; box-shadow: 0 0 10px rgba(167, 139, 250, 0.4);
  }
  #algo-range-sum-view .rsum-slider-container span {
    color: #a6adc8; font-size: 13px; min-width: 40px;
  }

  @keyframes pulse-glow-purple {
    0%, 100% { box-shadow: 0 0 0 0 rgba(167, 139, 250, 0.4); }
    50% { box-shadow: 0 0 0 8px rgba(167, 139, 250, 0); }
  }
  @keyframes pop-in {
    0% { transform: scale(0); opacity: 0; }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }
  /* 填充轨迹发光：prefix[i] 被计算填入时脉冲发光 */
  @keyframes rsum-filling {
    0% { box-shadow: 0 0 0 0 rgba(249, 226, 175, 0.7); background: rgba(249, 226, 175, 0.5); transform: scale(1); }
    40% { box-shadow: 0 0 28px 6px rgba(249, 226, 175, 0.8); background: rgba(249, 226, 175, 0.45); transform: scale(1.1); border-color: #f9e2af; }
    100% { box-shadow: 0 0 0 0 rgba(249, 226, 175, 0); background: rgba(166, 227, 161, 0.15); transform: scale(1); }
  }
  /* 累加来源高亮：prefix[i-1] 与 arr[i] 同时闪一下 */
  @keyframes rsum-source {
    0%, 100% { box-shadow: 0 0 0 0 rgba(167, 139, 250, 0); border-color: rgba(255, 255, 255, 0.08); }
    50% { box-shadow: 0 0 18px 2px rgba(167, 139, 250, 0.6); border-color: var(--accent-a); }
  }
  #algo-range-sum-view .rsum-cell.new { animation: pop-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
  /* 填充轨迹 / 累加来源动画 class（新增） */
  #algo-range-sum-view .rsum-cell.filling {
    animation: rsum-filling 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 2;
  }
  #algo-range-sum-view .rsum-cell.filling-source {
    animation: rsum-source 0.7s ease-out;
  }
  /* 原数组行累加来源 cell（arr[i] 当前参与计算） */
  #algo-range-sum-view .rsum-cell.source {
    border-color: var(--accent-a);
    box-shadow: 0 0 18px 2px rgba(167, 139, 250, 0.5);
    animation: rsum-source 0.7s ease-out;
  }

  @media (max-width: 1100px) {
    #algo-range-sum-view .rsum-main { grid-template-columns: 1fr; overflow: auto; }
    #algo-range-sum-view .rsum-code { min-height: 360px; }
    #algo-range-sum-view .rsum-header { flex-direction: column; align-items: flex-start; gap: 10px; }
    #algo-range-sum-view .rsum-tip { max-width: 100%; }
  }
</style>

<div class="rsum-page">
  <div class="rsum-header">
    <div>
      <div class="rsum-icon-badge">Σ</div>
      <h1>区间和（前缀和）</h1>
      <p class="rsum-desc">经典算法 · 预处理前缀和数组 O(1) 回答区间查询</p>
    </div>
    <div class="rsum-tip"><strong>前缀和思想：</strong>预处理前缀和数组 prefix，其中 prefix[i+1] = prefix[i] + arr[i]。查询区间 [L, R] 的和时，直接用 prefix[R+1] - prefix[L]，O(1) 时间完成。</div>
  </div>

  <div class="rsum-main">
    <div class="rsum-left">
      <section class="rsum-card">
        <div class="rsum-card-title">输入</div>
        <div class="rsum-input-row">
          <input id="rsum-arr-input" value="1,2,3,4,5">
          <input id="rsum-query-input" value="0,2|1,3|2,4">
          <button id="rsum-start">开始计算</button>
        </div>
        <div class="rsum-examples">
          <button class="rsum-example-btn" data-arr="1,2,3,4,5" data-q="0,2|1,3|2,4">示例 1</button>
          <button class="rsum-example-btn" data-arr="3,1,4,1,5,9" data-q="0,5|2,4">示例 2</button>
          <button class="rsum-example-btn" data-arr="-1,2,-3,4,-5" data-q="0,4|1,3">示例 3</button>
        </div>
      </section>

      <div class="rsum-stats">
        <div class="rsum-stat"><label>查询序号</label><span id="rsum-q-index">-</span></div>
        <div class="rsum-stat"><label>L</label><span id="rsum-l">-</span></div>
        <div class="rsum-stat"><label>R</label><span id="rsum-r">-</span></div>
        <div class="rsum-stat"><label>当前和</label><span id="rsum-sum">-</span></div>
        <div class="rsum-stat"><label>prefix[R+1]</label><span id="rsum-prefix-r">-</span></div>
      </div>

      <section class="rsum-card rsum-visual">
        <div class="rsum-card-title">数组可视化</div>
        <div class="rsum-track" id="rsum-track">
          <div class="rsum-row">
            <div class="rsum-row-label">原数组</div>
            <div class="rsum-row-cells" id="rsum-arr-cells"></div>
          </div>
          <div class="rsum-row">
            <div class="rsum-row-label">前缀和</div>
            <div class="rsum-row-cells" id="rsum-prefix-cells"></div>
          </div>
          <div class="rsum-formula" id="rsum-formula">
            sum[L, R] = prefix[R+1] - prefix[L]
          </div>
        </div>
      </section>

      <section class="rsum-card">
        <div class="rsum-card-title">查询结果</div>
        <div class="rsum-results" id="rsum-results"></div>
      </section>

      <section class="rsum-card">
        <div class="rsum-card-title">执行日志</div>
        <div class="rsum-log" id="rsum-log"></div>
      </section>
    </div>
    <aside class="rsum-code"><div data-code-panel></div></aside>
  </div>

  <div class="rsum-controls">
    <button id="step-reset" class="rsum-btn">⏮重置</button>
    <button id="step-prev" class="rsum-btn">◀上一步</button>
    <button id="step-play" class="rsum-btn rsum-play-btn">▶播放</button>
    <button id="step-next" class="rsum-btn">下一步▶</button>
    <span id="step-counter" class="rsum-counter">步骤: 0 / 0</span>
    <div class="rsum-slider-container">
      <input id="step-speed" type="range" min="400" max="2500" step="100" value="900">
      <span id="step-speed-label" class="rsum-counter">0.9s</span>
    </div>
  </div>
</div>
