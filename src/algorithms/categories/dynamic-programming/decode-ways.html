          <div data-code-panel></div>
        </div>
        <div class="dw-card dw-log-card">
          <div class="dw-log-head">执行日志</div>
          <div id="dw-log"></div>
        </div>
      </aside>
    </div>

    <!-- 播放控制 -->
    <div class="dw-playback">
      <button id="step-reset" class="dw-pb-btn" type="button">重置</button>
      <button id="step-prev" class="dw-pb-btn" type="button">上一步</button>
      <button id="step-play" class="dw-pb-btn is-play" type="button">播放</button>
      <button id="step-next" class="dw-pb-btn" type="button">下一步</button>
      <input id="dw-speed" type="range" min="100" max="2000" step="100" value="900" />
      <span id="dw-speed-label">0.9s</span>
      <span id="step-counter">步骤: 0 / 0</span>
    </div>

  </div>
</div>
