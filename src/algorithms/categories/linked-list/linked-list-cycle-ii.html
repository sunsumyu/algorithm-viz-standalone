            <div class="llc-subcard">
              <div class="llc-subcard-title">⚖️ 阶段与追击决策 (Phase Monitor)</div>
              <div id="llc-decision-monitor-container" style="flex: 1; min-height: 0; overflow-y: auto;"></div>
            </div>
          </div>
          <!-- 结果展示 -->
          <div class="llc-subcard" style="flex-shrink: 0;">
            <div class="llc-subcard-title">🏆 入环节点检索结果 (Cycle Entrance)</div>
            <div id="llc-metrics-container"></div>
          </div>
        </div>
      </div>

    </section>

    <!-- ================= 右侧：代码终端 + 执行日志 ================= -->
    <section class="llc-right-section">

      <!-- 卡片 3: 暗色代码终端面板 -->
      <div class="llc-dark-terminal">
        <div class="llc-terminal-header">
          <!-- 1. 主 Tab 切换器 (源码 / 题目 / 精讲) -->
          <div class="llc-tab-group">
            <button id="btn-tab-code" class="llc-tab-item active">💻 代码调试</button>
            <button id="btn-tab-problem" class="llc-tab-item">📋 题目描述</button>
            <button id="btn-tab-analysis" class="llc-tab-item">💡 贪心精讲</button>
          </div>

          <!-- 2. 多语言切换器 -->
          <div class="llc-lang-group" id="code-lang-tabs">
            <button class="llc-lang-btn active" data-lang="java">Java</button>
            <button class="llc-lang-btn" data-lang="cpp">C++</button>
            <button class="llc-lang-btn" data-lang="python">Python</button>
            <button class="llc-lang-btn" data-lang="javascript">JS</button>
          </div>

          <!-- 3. 字号缩放器与 macOS 窗口微控制 -->
          <div class="llc-font-tools">
            <div class="llc-font-scaler">
              <button id="btn-code-font-dec" title="缩小代码字号">A-</button>
              <span id="code-font-indicator">12</span>
              <button id="btn-code-font-inc" title="放大代码字号">A+</button>
            </div>

            <div class="llc-window-dots">
              <span class="llc-dot" style="background:#ef4444; width:7px; height:7px; border-radius:999px;"></span>
              <span class="llc-dot" style="background:#eab308; width:7px; height:7px; border-radius:999px;"></span>
              <span class="llc-dot" style="background:#22c55e; width:7px; height:7px; border-radius:999px;"></span>
            </div>
          </div>
        </div>

        <!-- 容器 1: 源码高亮与单步追踪视图 -->
        <div id="code-view-container" style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;">
          <div class="llc-terminal-body">
            <div id="code-lines-wrapper">
              <!-- 动态装载代码行 -->
            </div>
          </div>
        </div>

        <!-- 容器 2: 题目完整描述视图 -->
        <div id="problem-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载题目内容 -->
        </div>

        <!-- 容器 3: 贪心精讲视图 -->
        <div id="analysis-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载贪心精讲内容 -->
        </div>
      </div>

      <!-- 卡片 4: 独立执行日志卡片 -->
      <div class="llc-log-card">
        <div class="llc-log-header">
          <div class="llc-log-header-title">
            <span>📜 执行日志</span>
          </div>
          <span id="log-count" class="llc-log-count">0 条记录</span>
        </div>

        <div id="log-container" class="llc-log-body">
          <!-- 动态填充日志条目 -->
        </div>
      </div>

    </section>

  </main>

  <!-- 4. 力扣原题描述轻量模态弹窗 (Modal) -->
  <div id="modal-problem" class="llc-modal-backdrop hidden">
    <div class="llc-modal-content">
      <div class="llc-modal-header">
        <div class="llc-modal-title">
          <span>📋 力扣原题描述</span>
        </div>
        <button id="btn-close-problem-modal" class="llc-modal-close" title="关闭 (Esc)">✕</button>
      </div>
      <div id="modal-problem-body" class="llc-modal-body">
        <!-- 动态装载题目内容 -->
      </div>
    </div>
  </div>
</div>
