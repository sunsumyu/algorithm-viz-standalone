<div id="algo-move-zeroes-view" class="algo-modern-container">
  <!-- 顶部控制栏与参数栏 -->
  <header class="algo-header">
    <div class="algo-header-left">
      <div class="algo-title-wrap">
        <h1 class="algo-title">移动零 (LeetCode 283)</h1>
        <span class="algo-badge primary">快慢双指针 原地交换</span>
        <span class="algo-badge success">O(n) 时间 · O(1) 空间</span>
        <button id="open-problem-btn" class="algo-btn-subtle" title="查看 LeetCode 题目描述与算法解析">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          题解与思路
        </button>
      </div>
      <div class="algo-param-bar">
        <div class="param-item">
          <label for="nums-input">数组元素 (含0):</label>
          <input type="text" id="nums-input" value="0, 1, 0, 3, 12" placeholder="例如: 0, 1, 0, 3, 12" style="width: 180px;" />
        </div>
        <button id="apply-btn" class="algo-btn primary">重新构建并开始</button>
        <button id="random-btn" class="algo-btn">随机用例</button>
      </div>
    </div>
    <div class="algo-header-right">
      <div class="algo-chip-group">
        <span class="algo-chip">慢指针 slow (非零待填区)</span>
        <span class="algo-chip">快指针 fast (探路扫描)</span>
      </div>
    </div>
  </header>

  <!-- 主体工作区：标准 4-Card 布局 -->
  <main class="algo-workspace">
    <!-- 左侧区域：Card 1 视觉沙盒 + Card 2 状态监控 (54%) -->
    <section class="algo-left-pane">
      <!-- Card 1: 视觉沙盒 -->
      <div class="algo-card visual-sandbox-card">
        <div class="card-header">
          <div class="card-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
            快慢指针数组元素交换沙盒 (Fast/Slow Pointer Array Swap)
          </div>
          <div class="card-actions">
            <span id="step-phase-badge" class="algo-badge info">初始化</span>
          </div>
        </div>
        <div class="card-body">
          <div id="mz-canvas-container" class="mz-canvas-wrap">
            <!-- 动态渲染数组节点与快慢指针 -->
          </div>
        </div>
      </div>

      <!-- 步进时间轴与回放控制 -->
      <div class="algo-timeline-controls">
        <div class="playback-buttons">
          <button id="prev-btn" class="algo-btn" title="上一步">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="19 20 9 12 19 4 19 20"></polygon>
              <line x1="5" y1="19" x2="5" y2="5"></line>
            </svg>
          </button>
          <button id="play-btn" class="algo-btn primary" title="播放/暂停">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
          </button>
          <button id="next-btn" class="algo-btn" title="下一步">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="5 4 15 12 5 20 5 4"></polygon>
              <line x1="19" y1="5" x2="19" y2="19"></line>
            </svg>
          </button>
          <button id="reset-btn" class="algo-btn" title="重置">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
              <path d="M3 3v5h5"></path>
            </svg>
          </button>
        </div>
        <div class="scrubber-wrap">
          <input type="range" id="step-scrubber" min="0" max="0" value="0" class="algo-scrubber" />
          <div class="step-indicator">
            <span id="current-step-num">0</span> / <span id="total-steps-num">0</span> 步
          </div>
        </div>
        <div class="speed-controls">
          <label for="speed-select">速度:</label>
          <select id="speed-select" class="algo-select">
            <option value="1200">0.5x</option>
            <option value="700" selected>1.0x</option>
            <option value="400">1.5x</option>
            <option value="200">2.0x</option>
          </select>
        </div>
      </div>

      <!-- Card 2: 状态监控区 -->
      <div class="algo-card status-monitor-card">
        <div class="card-header">
          <div class="card-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
            </svg>
            快慢指针状态与当前决策 (State Space)
          </div>
        </div>
        <div class="card-body">
          <div class="monitor-grid">
            <div class="monitor-item">
              <span class="label">慢指针 slow (非零尾):</span>
              <span id="slow-monitor-val" class="value highlight">0</span>
            </div>
            <div class="monitor-item">
              <span class="label">快指针 fast (探路扫描):</span>
              <span id="fast-monitor-val" class="value highlight">0</span>
            </div>
            <div class="monitor-item">
              <span class="label">当前探测元素:</span>
              <span id="cur-val-monitor-val" class="value warning">-</span>
            </div>
            <div class="monitor-item full-width">
              <span class="label">当前动作说明:</span>
              <div id="step-action-desc" class="desc-box">初始化就绪</div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 右侧区域：Card 3 代码终端 + Card 4 执行日志 (46%) -->
    <section class="algo-right-pane">
      <!-- Card 3: 现代化深色代码终端 (DarkCodeTerminalPresenter) -->
      <div class="algo-card code-terminal-card">
        <div id="code-terminal-container" class="terminal-container-wrap">
          <!-- 由 DarkCodeTerminalPresenter 注入 -->
        </div>
      </div>

      <!-- Card 4: 执行日志记录 -->
      <div class="algo-card exec-log-card">
        <div class="card-header">
          <div class="card-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="21" y1="10" x2="3" y2="10"></line>
              <line x1="21" y1="6" x2="3" y2="6"></line>
              <line x1="21" y1="14" x2="3" y2="14"></line>
              <line x1="21" y1="18" x2="3" y2="18"></line>
            </svg>
            移动零执行流水 (Execution Log Stream)
          </div>
          <button id="clear-log-btn" class="algo-btn-subtle" title="清空日志">清空</button>
        </div>
        <div class="card-body">
          <div id="exec-log-stream" class="exec-log-stream">
            <!-- 动态注入日志行 -->
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 题目详情与深度解析模态弹窗 (DDD 领域模型) -->
  <div id="problem-modal" class="algo-modal-overlay">
    <div class="algo-modal-box">
      <div class="algo-modal-header">
        <h2 class="modal-title">LeetCode 283 · 移动零 深度题解与核心逻辑</h2>
        <button id="close-modal-btn" class="modal-close-btn">&times;</button>
      </div>
      <div class="algo-modal-body">
        <div class="modal-tab-bar">
          <button id="modal-tab-problem" class="modal-tab active">题目描述</button>
          <button id="modal-tab-analysis" class="modal-tab">算法核心解析</button>
        </div>
        <div id="modal-content-area" class="modal-tab-content">
          <!-- 动态注入 -->
        </div>
      </div>
    </div>
  </div>
</div>
