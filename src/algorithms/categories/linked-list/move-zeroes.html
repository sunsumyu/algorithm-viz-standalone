<style>

  }

  }

  #algo-move-zeroes-view .mz-page {

    overflow: hidden;

    gap: 16px;
    padding: 16px;
    overflow: hidden;
  }

  @media (max-width: 1100px) {
    #algo-move-zeroes-view .mz-layout {
      grid-template-columns: 1fr;
      overflow: auto;
    }
  }

  .mz-main {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow: hidden;
    flex: 1;
  }

  .mz-card {
    background: rgba(20, 18, 38, 0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);

  .mz-controls {

    align-items: center;

  }

    flex: 1;
    min-width: 140px;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);

  }

  .mz-btn {
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: linear-gradient(135deg, #fbbf24, #fb923c);
    color: #431407;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
    box-shadow: 0 4px 15px rgba(251, 191, 36, 0.3);
  }

  .mz-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(251, 191, 36, 0.4);
  }

  .mz-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    box-shadow: none;
  }

  .mz-example {
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid rgba(248, 113, 113, 0.3);
    background: rgba(251, 191, 36, 0.1);
    color: #cdd6f4;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .mz-example:hover {
    background: rgba(251, 191, 36, 0.2);
    border-color: #fbbf24;
  }

  .mz-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    padding: 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .mz-stat {
    padding: 14px 0;
    position: relative;
    background: rgba(20, 18, 38, 0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    overflow: hidden;
  }

  .mz-stat::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #fbbf24, #fb923c);
  }

  .mz-stat-label {
    display: block;
    margin-bottom: 6px;
    color: rgba(204, 214, 244, 0.7);
    font-size: 12px;
  }

  .mz-stat-val {
    color: #fbbf24;
    font-family: ui-monospace, monospace;
    font-size: 19px;
    font-weight: 700;
    -webkit-font-variant-numeric: tabular-nums;
    font-variant-numeric: tabular-nums;
  }

  .mz-canvas {
    padding: 18px;
    background: rgba(11, 10, 23, 0.6);
    min-height: 240px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .mz-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    transition: all 0.3s ease;
  }

  .mz-bar {
    width: 36px;
    border-radius: 4px 4px 0 0;
    transition: all 0.3s;
    position: relative;
  }

  .mz-bar.num {
    background: rgba(140, 146, 164, 0.4);
    box-shadow: 0 4px 12px rgba(140, 146, 164, 0.2);
  }

  .mz-bar.zero {
    background: rgba(248, 113, 113, 0.6);
    box-shadow: 0 4px 15px rgba(248, 113, 113, 0.4);
  }

  .mz-bar.swapping {
    animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .mz-bar.new {
    animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .mz-bar.match {
    animation: burst 0.4s ease;
  }

  .mz-bar.fail {
    animation: shake 0.4s ease;
  }

  .mz-idx {
    font-size: 11px;
    color: rgba(204, 214, 244, 0.6);
  }

  .mz-message {
    margin: 0 14px 14px;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid rgba(251, 191, 36, 0.2);
    background: rgba(251, 191, 36, 0.08);
    color: #cdd6f4;
    font-size: 13px;
    line-height: 1.5;
  }

  .mz-log {
    min-height: 0;
    max-height: 130px;
    padding: 14px 16px;
    overflow: auto;
    background: rgba(11, 10, 23, 0.8);
    font-family: ui-monospace, monospace;
    font-size: 12px;
    line-height: 1.7;
    color: rgba(204, 214, 244, 0.8);
  }

  .mz-log div {
    padding: 2px 0;
  }

  .mz-log div.active {
    color: #fbbf24;
    font-weight: 600;
  }

  .mz-right {
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow: hidden;
  }

  .mz-code-card {
    background: rgba(11, 10, 23, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    overflow: hidden;
    flex: 1;
  }

  .mz-playback {
    background: rgba(20, 18, 38, 0.5);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .mz-pb-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .mz-pb-btn {
    flex: 1;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(59, 130, 246, 0.1);
    color: #cdd6f4;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
  }

  .mz-pb-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .mz-pb-btn:not(:disabled):hover {
    background: rgba(59, 130, 246, 0.2);
    border-color: #3b82f6;
    transform: translateY(-1px);
  }

  .mz-pb-btn.play {
    background: linear-gradient(135deg, #fbbf24, #fb923c);
    border: none;
    color: #431407;
    box-shadow: 0 4px 15px rgba(251, 191, 36, 0.3);
  }

  .mz-pb-btn.play:not(:disabled):hover {
    box-shadow: 0 6px 20px rgba(251, 191, 36, 0.4);
  }

  .mz-speed-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: rgba(204, 214, 244, 0.7);
  }

  .mz-speed-row input {
    flex: 1;
    accent-color: #fbbf24;
  }

  .mz-counter {
    color: rgba(204, 214, 244, 0.6);
    font-size: 13px;
    font-family: ui-monospace, monospace;
    text-align: center;
    -webkit-font-variant-numeric: tabular-nums;
    font-variant-numeric: tabular-nums;
  }

  /* Animations */
  @keyframes pulse {
    0%, 100% {
      box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.7);
    }
    50% {
      box-shadow: 0 0 0 8px rgba(251, 191, 36, 0);
    }
  }

  @keyframes popIn {
    0% {
      transform: scale(0) rotate(-10deg);
      opacity: 0;
    }
    100% {
      transform: scale(1) rotate(0deg);
      opacity: 1;
    }
  }

  @keyframes burst {
    0%, 100% {
      transform: scale(1);
      opacity: 1;
    }
    50% {
      transform: scale(1.15);
      opacity: 0.8;
    }
  }

  @keyframes shake {
    0%, 100% {
      transform: translateX(0);
    }
    20%, 60% {
      transform: translateX(-5px);
    }
    40%, 80% {
      transform: translateX(5px);
    }
  }

  .mz-pb-btn#step-play.play {
    animation: pulse 1.2s infinite;
  }

  .mz-bar.swapping {
    animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .mz-bar.new {
    animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .mz-bar.match {
    animation: burst 0.4s ease;
  }

  .mz-bar.fail {
    animation: shake 0.4s ease;
  }

  @media (max-width: 1100px) {
    .mz-main {
      overflow: visible;
    }
  }

<div class="mz-page">

        <div class="mz-speed-row">

    </div>
