        <div class="rll-card-header">

            <div class="rll-card-title">📦 指针状态空间与链表重构看板</div>
            <div class="rll-card-desc">pre、cur、next 当前位置与反转推进进度</div>
          </div>
          <span id="badge-reversed-count" class="rll-counter-badge" style="color:#2563eb; background:#eff6ff; border-color:#bfdbfe;">已反转: 0 个</span>
        </div>

        <!-- 状态空间展示盒 -->
        <div class="rll-state-space-box">
          <div class="rll-state-columns">
            <!-- 指针位置 -->
            <div class="rll-subcard">
              <div class="rll-subcard-title">📍 指针位置 (Pointers State)</div>
              <div id="rll-pointers-container" style="flex: 1; min-height: 0; overflow-y: auto;"></div>
            </div>
            <!-- 反转迭代决策监视器 -->
            <div class="rll-subcard">
              <div class="rll-subcard-title">⚖️ 原地反转指令监视器 (Step Action)</div>
              <div id="rll-decision-monitor-container" style="flex: 1; min-height: 0; overflow-y: auto;"></div>
            </div>
          </div>
          <!-- 统计与进度 -->
          <div class="rll-subcard" style="flex-shrink: 0;">
            <div class="rll-subcard-title">🏆 反转后新链表头节点 (New Head)</div>
            <div id="rll-metrics-container"></div>
          </div>
        </div>
      </div>

    </section>

    <!-- ================= 右侧：代码终端 + 执行日志 ================= -->
    <section class="rll-right-section">

      <!-- 卡片 3: 暗色代码终端面板 -->
      <div class="rll-dark-terminal">
        <div class="rll-terminal-header">
          <!-- 1. 主 Tab 切换器 (源码 / 题目 / 精讲) -->
          <div class="rll-tab-group">
            <button id="btn-tab-code" class="rll-tab-item active">💻 代码调试</button>
            <button id="btn-tab-problem" class="rll-tab-item">📋 题目描述</button>
            <button id="btn-tab-analysis" class="rll-tab-item">💡 贪心精讲</button>
          </div>

          <!-- 2. 多语言切换器 -->
          <div class="rll-lang-group" id="code-lang-tabs">
            <button class="rll-lang-btn active" data-lang="java">Java</button>
            <button class="rll-lang-btn" data-lang="cpp">C++</button>
            <button class="rll-lang-btn" data-lang="python">Python</button>
            <button class="rll-lang-btn" data-lang="javascript">JS</button>
          </div>

          <!-- 3. 字号缩放器与 macOS 窗口微控制 -->
          <div class="rll-font-tools">
            <div class="rll-font-scaler">
              <button id="btn-code-font-dec" title="缩小代码字号">A-</button>
              <span id="code-font-indicator">12</span>
              <button id="btn-code-font-inc" title="放大代码字号">A+</button>
            </div>

            <div class="rll-window-dots">
              <span class="rll-dot" style="background:#ef4444;"></span>
              <span class="rll-dot" style="background:#eab308;"></span>
              <span class="rll-dot" style="background:#22c55e;"></span>
            </div>
          </div>
        </div>

        <!-- 容器 1: 源码高亮与单步追踪视图 -->
        <div id="code-view-container" style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;">
          <div class="rll-terminal-body">
            <div id="code-lines-wrapper">
              <!-- 动态装载代码行 -->
            </div>
          </div>
        </div>

        <!-- 容器 2: 题目完整描述视图 -->
        <div id="problem-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载题目内容 -->
        </div>

        <!-- 容器 3: 贪心精讲视图 -->
        <div id="analysis-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载贪心精讲内容 -->
        </div>
      </div>

      <!-- 卡片 4: 独立执行日志卡片 -->
      <div class="rll-log-card">
        <div class="rll-log-header">
          <div class="rll-log-header-title">
            <span>📜 执行日志</span>
          </div>
          <span id="log-count" class="rll-log-count">0 条记录</span>
        </div>

        <div id="log-container" class="rll-log-body">
          <!-- 动态填充日志条目 -->
        </div>
      </div>

    </section>

  </main>

  <!-- 4. 力扣原题描述轻量模态弹窗 (Modal) -->
  <div id="modal-problem" class="rll-modal-backdrop hidden">
    <div class="rll-modal-content">
      <div class="rll-modal-header">
        <div class="rll-modal-title">
          <span>📋 力扣原题描述</span>
        </div>
        <button id="btn-close-problem-modal" class="rll-modal-close" title="关闭 (Esc)">✕</button>
      </div>
      <div id="modal-problem-body" class="rll-modal-body">
        <!-- 动态装载题目内容 -->
      </div>
    </div>
  </div>
</div>
