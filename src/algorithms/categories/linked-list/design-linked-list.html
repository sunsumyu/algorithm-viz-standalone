            <div class="dll-card-title">📦 链表状态空间与调用指令监视器</div>
            <div class="dll-card-desc">当前调用操作、返回值与节点总数 size 动态跟踪</div>
          </div>
          <span id="badge-dll-status" class="dll-counter-badge" style="color:#2563eb; background:#eff6ff; border-color:#bfdbfe;">链表就绪</span>
        </div>

        <!-- 状态空间展示盒 -->
        <div class="dll-state-space-box">
          <div class="dll-state-columns">
            <!-- 链表指标 -->
            <div class="dll-subcard">
              <div class="dll-subcard-title">📊 链表属性 (Properties)</div>
              <div id="dll-pointers-container" style="flex: 1; min-height: 0; overflow-y: auto;"></div>
            </div>
            <!-- 阶段监视器 -->
            <div class="dll-subcard">
              <div class="dll-subcard-title">⚙️ 执行指令监视 (Operation Monitor)</div>
              <div id="dll-decision-monitor-container" style="flex: 1; min-height: 0; overflow-y: auto;"></div>
            </div>
          </div>
          <!-- 结果展示 -->
          <div class="dll-subcard" style="flex-shrink: 0;">
            <div class="dll-subcard-title">🎯 最新操作结果 (Return Value)</div>
            <div id="dll-metrics-container"></div>
          </div>
        </div>
      </div>

    </section>

    <!-- ================= 右侧：代码终端 + 执行日志 ================= -->
    <section class="dll-right-section">

      <!-- 卡片 3: 暗色代码终端面板 -->
      <div class="dll-dark-terminal">
        <div class="dll-terminal-header">
          <!-- 1. 主 Tab 切换器 (源码 / 题目 / 精讲) -->
          <div class="dll-tab-group">
            <button id="btn-tab-code" class="dll-tab-item active">💻 代码调试</button>
            <button id="btn-tab-problem" class="dll-tab-item">📋 题目描述</button>
            <button id="btn-tab-analysis" class="dll-tab-item">💡 贪心精讲</button>
          </div>

          <!-- 2. 多语言切换器 -->
          <div class="dll-lang-group" id="code-lang-tabs">
            <button class="dll-lang-btn active" data-lang="java">Java</button>
            <button class="dll-lang-btn" data-lang="cpp">C++</button>
            <button class="dll-lang-btn" data-lang="python">Python</button>
            <button class="dll-lang-btn" data-lang="javascript">JS</button>
          </div>

          <!-- 3. 字号缩放器与 macOS 窗口微控制 -->
          <div class="dll-font-tools">
            <div class="dll-font-scaler">
              <button id="btn-code-font-dec" title="缩小代码字号">A-</button>
              <span id="algo-design-linked-list-indicator">12</span>
              <button id="btn-code-font-inc" title="放大代码字号">A+</button>
            </div>

            <div class="dll-window-dots">
              <span class="dll-dot" style="background:#ef4444; width:7px; height:7px; border-radius:999px;"></span>
              <span class="dll-dot" style="background:#eab308; width:7px; height:7px; border-radius:999px;"></span>
              <span class="dll-dot" style="background:#22c55e; width:7px; height:7px; border-radius:999px;"></span>
            </div>
          </div>
        </div>

        <!-- 容器 1: 源码高亮与单步追踪视图 -->
        <div id="code-view-container" style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;">
          <div class="dll-terminal-body">
            <div id="code-lines-wrapper">
              <!-- 动态装载代码行 -->
            </div>
          </div>
        </div>

        <!-- 容器 2: 题目完整描述视图 -->
        <div id="problem-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载题目内容 -->
        </div>

        <!-- 容器 3: 贪心精讲视图 -->
        <div id="analysis-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载贪心精讲内容 -->
        </div>
      </div>

      <!-- 卡片 4: 独立执行日志卡片 -->
      <div class="dll-log-card">
        <div class="dll-log-header">
          <div class="dll-log-header-title">
            <span>📜 执行日志</span>
          </div>
          <span id="log-count" class="dll-log-count">0 条记录</span>
        </div>

        <div id="log-container" class="dll-log-body">
          <!-- 动态填充日志条目 -->
        </div>
      </div>

    </section>

  </main>

  <!-- 4. 力扣原题描述轻量模态弹窗 (Modal) -->
  <div id="modal-problem" class="dll-modal-backdrop hidden">
    <div class="dll-modal-content">
      <div class="dll-modal-header">
        <div class="dll-modal-title">
          <span>📋 力扣原题描述</span>
        </div>
        <button id="btn-close-problem-modal" class="dll-modal-close" title="关闭 (Esc)">✕</button>
      </div>
      <div id="modal-problem-body" class="dll-modal-body">
        <!-- 动态装载题目内容 -->
      </div>
    </div>
  </div>
</div>
