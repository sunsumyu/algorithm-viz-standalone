  #algo-remove-nth-from-end-view .rn-box.rn-dummy .rn-tag-dummy {
    position: absolute; top: -22px; left: 50%; transform: translateX(-50%);

    padding: 2px 8px; border-radius: 6px;
  }
  #algo-remove-nth-from-end-view .rn-box.rn-fast {
    border-color: var(--fast-color);
    background: linear-gradient(180deg, rgba(96, 165, 250, .3), rgba(59, 130, 246, .1));
    color: #dbeafe;
    box-shadow: 0 0 0 3px rgba(96, 165, 250, .25), 0 6px 18px rgba(96, 165, 250, .3);
  }
  #algo-remove-nth-from-end-view .rn-box.rn-fast.rn-sprint {
    animation: rn-fast-sprint .5s ease-in-out;
  }
  @keyframes rn-fast-sprint {
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(96, 165, 250, .6), 0 0 24px rgba(96, 165, 250, .55); }
    50% { transform: scale(1.1); box-shadow: 0 0 0 8px rgba(96, 165, 250, 0), 0 0 30px rgba(96, 165, 250, .7); }
    100% { transform: scale(1); box-shadow: 0 0 0 3px rgba(96, 165, 250, .25), 0 6px 18px rgba(96, 165, 250, .3); }
  }
  #algo-remove-nth-from-end-view .rn-box.rn-slow {
    border-color: var(--slow-color);
    background: linear-gradient(180deg, rgba(34, 211, 238, .3), rgba(6, 182, 212, .1));
    color: #cffafe;
    box-shadow: 0 0 0 3px rgba(34, 211, 238, .22), 0 6px 18px rgba(34, 211, 238, .25);
  }
  #algo-remove-nth-from-end-view .rn-box.rn-target {
    border-color: var(--del-color);
    background: linear-gradient(180deg, rgba(248, 113, 113, .3), rgba(239, 68, 68, .08));

    box-shadow: 0 0 0 3px rgba(248, 113, 113, .25), 0 6px 18px rgba(248, 113, 113, .3);
    animation: rn-shake .6s ease-in-out;
  }
  @keyframes rn-shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-5px) rotate(-1deg); }
    40% { transform: translateX(5px) rotate(1deg); }
    60% { transform: translateX(-3px) rotate(-0.5deg); }
    80% { transform: translateX(3px) rotate(0.5deg); }
  }
  #algo-remove-nth-from-end-view .rn-box.rn-removed {
    animation: rn-vanish .55s ease-in forwards;
  }
  @keyframes rn-vanish {
    0% { transform: scale(1) rotate(0); opacity: 1; }
    50% { transform: scale(.4) rotate(8deg); opacity: .3; }
    100% { transform: scale(0) rotate(15deg); opacity: 0; }
  }
  #algo-remove-nth-from-end-view .rn-pointer {
    position: absolute; top: -34px; left: 50%; transform: translateX(-50%);
    font-size: 11px; font-weight: 800;
    padding: 2px 8px; border-radius: 6px;
    background: rgba(8, 8, 24, .8);
    border: 1.5px solid;
    animation: rn-pointer-bounce 1s ease-in-out infinite;
  }
  @keyframes rn-pointer-bounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-3px); }
  }
  #algo-remove-nth-from-end-view .rn-pointer--fast { color: #93c5fd; border-color: #60a5fa; box-shadow: 0 0 12px rgba(96, 165, 250, .45); }
  #algo-remove-nth-from-end-view .rn-pointer--slow { color: #67e8f9; border-color: #22d3ee; box-shadow: 0 0 12px rgba(34, 211, 238, .45); }
  #algo-remove-nth-from-end-view .rn-arrow {
    color: #64748b; font-size: 22px; padding: 0 8px;

  #algo-remove-nth-from-end-view .rn-arrow.rn-arrow-cancel {
    animation: rn-arrow-cancel .55s ease-in forwards;
  }
  @keyframes rn-arrow-cancel {
    0% { opacity: 1; color: #f87171; transform: scale(1); }
    50% { opacity: .5; color: #f87171; transform: scale(1.4); }
    100% { opacity: 0; color: #f87171; transform: scale(0); }
  }
  #algo-remove-nth-from-end-view .rn-null {
    color: #64748b; font-family: 'JetBrains Mono', Consolas, monospace;

    border: 1.5px dashed rgba(100, 116, 139, .35); border-radius: 999px;
  }
  /* result banner */
  #algo-remove-nth-from-end-view .rn-result {
    margin: 0 16px 16px; padding: 14px 18px; border-radius: 12px;

    border: 1px solid rgba(99, 102, 241, .28);
    line-height: 1.55; font-size: 14px; color: #e0e7ff;
  }
  #algo-remove-nth-from-end-view .rn-result .rn-emoji {
    width: 36px; height: 36px; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 20px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; box-shadow: 0 4px 14px var(--accent-glow);
  }
  #algo-remove-nth-from-end-view .rn-result.rn-result--done {
    background: linear-gradient(135deg, rgba(52, 211, 153, .18), rgba(16, 185, 129, .08));

  }
  #algo-remove-nth-from-end-view .rn-result.rn-result--done .rn-emoji {
    background: linear-gradient(135deg, #34d399, #10b981);
    box-shadow: 0 4px 14px rgba(52, 211, 153, .55);
  }
  /* log */
  #algo-remove-nth-from-end-view .rn-log {
    min-height: 90px; max-height: 140px; padding: 10px 14px;
    overflow: auto; background: rgba(8, 8, 24, .55);
    font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px;
    line-height: 1.7; color: #94a3b8;
  }
  #algo-remove-nth-from-end-view .rn-log-line { display: flex; gap: 8px; }
  #algo-remove-nth-from-end-view .rn-log-line .rn-log-num { color: #475569; flex-shrink: 0; }
  #algo-remove-nth-from-end-view .rn-log-line.rn-log-active { color: #a5b4fc; font-weight: 600; }
  #algo-remove-nth-from-end-view .rn-log-line.rn-log-active .rn-log-num { color: var(--accent-b); }
  /* code */
  #algo-remove-nth-from-end-view .rn-code {
    min-height: 0; display: flex;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; overflow: hidden;
  }
  #algo-remove-nth-from-end-view .rn-code [data-code-panel] { flex: 1; min-width: 0; }

  #algo-remove-nth-from-end-view .rn-controls {
    padding: 14px 18px;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);

    display: flex; align-items: center; justify-content: center; gap: 12px;

  #algo-remove-nth-from-end-view .rn-controls .rn-ctrl-btn { min-width: 64px; }

    color: #94a3b8; font-size: 13px; font-weight: 600;
    min-width: 110px; text-align: center;
    font-variant-numeric: tabular-nums;

    display: flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 12px;
  }
  #algo-remove-nth-from-end-view #rn-speed { width: 130px; accent-color: var(--accent-b); }

<div class="rn-shell">
  <div class="rn-hero">
    <div class="rn-hero-left">
      <span class="rn-icon">🗑️</span>
      <div>
        <h1>删除链表的倒数第 N 个节点（快慢指针）</h1>
        <div class="rn-sub">LeetCode 19 · 一次遍历 + dummy 节点完成删除</div>
      </div>
    </div>
    <div class="rn-tip"><strong>核心动画：</strong><span style="color:#93c5fd">fast</span>（蓝）先 <code>sprint</code> 冲刺 n 步 → 然后与 <span style="color:#67e8f9">slow</span>（青）锁步前进；fast 抵达末尾时 slow 恰好停在待删节点前驱；目标节点先 <code>shake</code> 再 <code>vanish</code> 消失，相邻箭头同步坍缩。</div>
  </div>
  <div class="rn-main">
    <div class="rn-left">
      <section class="rn-card">
        <div class="rn-card-title">输入 <span class="rn-tag">链表 + n</span></div>
        <div class="rn-input-row">
          <input id="rn-array" value="1,2,3,4,5">
          <input id="rn-n" type="number" min="1" max="9" value="2">
          <button id="rn-start">开始移除</button>
        </div>
        <div class="rn-examples">
          <button class="rn-chip" data-val="1,2,3,4,5" data-n="2">删倒数第 2</button>
          <button class="rn-chip" data-val="1,2,3,4,5" data-n="5">删头节点</button>
          <button class="rn-chip" data-val="1,2,3,4,5" data-n="1">删尾节点</button>
          <button class="rn-chip" data-val="1" data-n="1">单节点</button>
          <button class="rn-chip" data-val="7,7,7,7" data-n="2">重复值</button>
        </div>
      </section>

      <div class="rn-stats">
        <div class="rn-stat rn-stat--fast"><div class="rn-stat-label">fast 位置</div><div class="rn-stat-val" id="rn-stat-fast" style="font-size:16px;">dummy</div></div>
        <div class="rn-stat rn-stat--slow"><div class="rn-stat-label">slow 位置</div><div class="rn-stat-val" id="rn-stat-slow" style="font-size:16px;">dummy</div></div>
        <div class="rn-stat"><div class="rn-stat-label">已走步数</div><div class="rn-stat-val" id="rn-stat-steps">0</div></div>
        <div class="rn-stat rn-stat--target"><div class="rn-stat-label">待删节点</div><div class="rn-stat-val" id="rn-stat-target" style="font-size:16px;">-</div></div>
        <div class="rn-stat"><div class="rn-stat-label">链表长度</div><div class="rn-stat-val" id="rn-stat-len">0</div></div>
      </div>

      <section class="rn-card rn-visual">
        <div class="rn-card-title">链表与快慢指针</div>
        <div class="rn-canvas" id="rn-canvas"></div>
        <div class="rn-result" id="rn-result">
          <span class="rn-emoji">🗑️</span>
          <div id="step-message">点击「开始移除」观察 fast 冲刺 + 删除动画</div>
        </div>
      </section>

      <section class="rn-card">
        <div class="rn-card-title">执行日志 <button id="rn-log-clear" style="padding:4px 10px;font-size:11px;border-radius:999px;">清空</button></div>
        <div class="rn-log" id="rn-log"></div>
      </section>
    </div>
    <aside class="rn-code"><div data-code-panel></div></aside>
  </div>
  <div class="rn-controls">
    <button id="step-reset" class="rn-ctrl-btn">⏮ 重置</button>
    <button id="step-prev" class="rn-ctrl-btn">◀ 上一步</button>
    <button id="step-play" class="rn-ctrl-btn rn-ctrl-primary">▶ 播放</button>
    <button id="step-next" class="rn-ctrl-btn">下一步 ▶</button>
    <span id="step-counter" class="rn-counter">步骤: 0 / 0</span>
    <div class="rn-speed-wrap">
      <span>速度</span>
      <input id="rn-speed" type="range" min="200" max="2500" step="100" value="900">
      <span id="rn-speed-label" style="min-width:42px;">0.9s</span>
    </div>
  </div>
</div>
