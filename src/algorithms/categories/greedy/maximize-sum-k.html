<style>
  :root {
    --mk-accent-a: #fbbf24;
    --mk-accent-b: #fb923c;
  }
  .max-sum-k-viz-container {
    width: 100%; height: 100%; color: #cdd6f4;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:
      radial-gradient(ellipse at 8% 6%, rgba(251, 191, 36, 0.5), transparent 55%),
      radial-gradient(ellipse at 92% 94%, rgba(251, 146, 60, 0.55), transparent 55%),
      linear-gradient(135deg, #1a1206, #1c1208, #160d05);
    display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box;
  }
  .max-sum-k-viz-container .sw-page { height: 100%; display: flex; flex-direction: column; overflow: hidden; }
  .max-sum-k-viz-container .sw-header {
    padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; gap: 18px;
  }
  .max-sum-k-viz-container .sw-head-left { display: flex; align-items: center; gap: 14px; }
  .max-sum-k-viz-container .sw-icon-badge {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, var(--mk-accent-a), var(--mk-accent-b));
    display: flex; align-items: center; justify-content: center; font-size: 22px;
    box-shadow: 0 8px 24px rgba(251, 146, 60, 0.4);
  }
  .max-sum-k-viz-container h1 { margin: 0; font-size: 22px; font-weight: 800; color: #fff; }
  .max-sum-k-viz-container .sw-desc { margin: 4px 0 0; color: #a6adc8; font-size: 13px; line-height: 1.4; }
  .max-sum-k-viz-container .sw-tip {
    max-width: 400px; padding: 11px 14px; border-radius: 12px;
    background: rgba(251, 191, 36, 0.12); backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(251, 191, 36, 0.25); color: #bac2de; font-size: 13px; line-height: 1.55;
  }
  .max-sum-k-viz-container .sw-tip strong { color: var(--mk-accent-a); }
  .max-sum-k-viz-container .sw-main {
    flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 420px;
    gap: 16px; padding: 0 16px 16px; overflow: hidden;
  }
  .max-sum-k-viz-container .sw-left { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
  .max-sum-k-viz-container .sw-card {
    background: rgba(20, 18, 38, 0.55); backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; overflow: hidden;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }
  .max-sum-k-viz-container .sw-card-title {
    padding: 13px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: flex; justify-content: space-between; color: #fff; font-weight: 700; font-size: 14px;
  }
  .max-sum-k-viz-container .sw-input-row {
    display: grid; grid-template-columns: 1fr 90px auto; gap: 10px; align-items: center; padding: 14px 16px;
  }
  .max-sum-k-viz-container input[type="text"], .max-sum-k-viz-container input[type="number"] {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(20, 18, 38, 0.6); color: #cdd6f4; font-family: Consolas, monospace; outline: none; font-size: 13px;
  }
  .max-sum-k-viz-container input:focus {
    border-color: var(--mk-accent-a); box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.2);
  }
  .max-sum-k-viz-container .sw-start-btn {
    padding: 10px 16px; border-radius: 10px; border: 1px solid transparent;
    background: linear-gradient(135deg, var(--mk-accent-a), var(--mk-accent-b)); color: #1a1206;
    font-weight: 700; cursor: pointer; transition: all 0.2s; font-size: 13px;
  }
  .max-sum-k-viz-container .sw-start-btn:hover { box-shadow: 0 0 20px rgba(251, 146, 60, 0.45); }
  .max-sum-k-viz-container .sw-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .max-sum-k-viz-container .sw-stat {
    padding: 14px; background: rgba(20, 18, 38, 0.4); border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.06); position: relative; overflow: hidden;
  }
  .max-sum-k-viz-container .sw-stat::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: linear-gradient(180deg, var(--mk-accent-a), var(--mk-accent-b));
  }
  .max-sum-k-viz-container .sw-stat label { display: block; margin-bottom: 6px; color: #a6adc8; font-size: 12px; }
  .max-sum-k-viz-container .sw-stat span {
    color: var(--mk-accent-a); font-family: Consolas, monospace; font-size: 21px; font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .max-sum-k-viz-container .sw-visual { flex: 1; min-height: 220px; display: flex; flex-direction: column; }
  .max-sum-k-viz-container .sw-track {
    flex: 1; min-height: 0; padding: 24px 18px; overflow: auto;
    display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
  }
  .max-sum-k-viz-container .max-sum-cell {
    width: 60px; min-width: 60px; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(20, 18, 38, 0.5); position: relative;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s, border-color 0.3s, box-shadow 0.3s;
    will-change: transform;
  }
  .max-sum-k-viz-container .max-sum-cell .value {
    font-family: Consolas, monospace; font-size: 18px; font-weight: 800; color: #e6e9f5;
  }
  .max-sum-k-viz-container .max-sum-cell .index { font-size: 10px; color: #7c839c; }
  .max-sum-k-viz-container .max-sum-cell.flipped {
    background: rgba(251, 191, 36, 0.16); border-color: rgba(251, 191, 36, 0.55);
    animation: burst 0.45s ease-out;
  }
  .max-sum-k-viz-container .max-sum-cell.current {
    background: rgba(251, 146, 60, 0.25); border-color: var(--mk-accent-b);
    transform: scale(1.15);
    box-shadow: 0 0 18px rgba(251, 146, 60, 0.5);
    animation: pulse-mk 1.2s infinite, pop-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 5;
  }
  .max-sum-k-viz-container .max-sum-cell.current .value { color: #fff; }
  .max-sum-k-viz-container .sw-result-banner {
    margin: 0 16px 16px; padding: 12px 16px; border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.12); background: rgba(20, 18, 38, 0.5);
    backdrop-filter: blur(18px); font-size: 14px; line-height: 1.5; transition: all 0.3s;
  }
  .max-sum-k-viz-container .sw-result-banner.success {
    background: rgba(251, 191, 36, 0.14); border-color: var(--mk-accent-a); color: #fde68a;
  }
  .max-sum-k-viz-container .sw-result-banner .badge { margin-right: 8px; }
  .max-sum-k-viz-container .sw-code {
    min-height: 0; display: flex; background: rgba(20, 18, 38, 0.4); border-radius: 16px; overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.06);
  }
  .max-sum-k-viz-container .sw-code [data-code-panel] { flex: 1; min-width: 0; }
  .max-sum-k-viz-container .sw-controls {
    padding: 14px 20px; background: rgba(20, 18, 38, 0.6); border-top: 1px solid rgba(255, 255, 255, 0.06);
    display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
  }
  .max-sum-k-viz-container .sw-btn {
    padding: 10px 18px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(20, 18, 38, 0.5); color: #cdd6f4; cursor: pointer; transition: all 0.2s;
    font-size: 14px; font-weight: 500;
  }
  .max-sum-k-viz-container .sw-btn:hover:not(:disabled) { border-color: var(--mk-accent-a); color: #fff; }
  .max-sum-k-viz-container .sw-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .max-sum-k-viz-container .sw-play-btn {
    border: 1px solid transparent; background: linear-gradient(135deg, var(--mk-accent-a), var(--mk-accent-b));
    color: #1a1206; font-weight: 700;
  }
  .max-sum-k-viz-container .sw-play-btn:hover:not(:disabled) { box-shadow: 0 0 20px rgba(251, 146, 60, 0.45); }
  .max-sum-k-viz-container .sw-counter { color: #a6adc8; font-size: 13px; min-width: 110px; text-align: center; font-variant-numeric: tabular-nums; }
  .max-sum-k-viz-container .sw-slider-container { display: flex; align-items: center; gap: 8px; }
  .max-sum-k-viz-container .sw-slider-container input[type=range] {
    width: 110px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.15);
    outline: none; -webkit-appearance: none;
  }
  .max-sum-k-viz-container .sw-slider-container input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--mk-accent-a);
    cursor: pointer; box-shadow: 0 0 10px rgba(251, 191, 36, 0.55);
  }
  .max-sum-k-viz-container .sw-slider-container span { color: #a6adc8; font-size: 13px; min-width: 40px; font-variant-numeric: tabular-nums; }

  @keyframes pulse-mk {
    0%, 100% { box-shadow: 0 0 0 0 rgba(251, 146, 60, 0.55); }
    50% { box-shadow: 0 0 0 9px rgba(251, 146, 60, 0); }
  }
  @keyframes pop-in {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes burst {
    0%, 100% { transform: scale(1); filter: brightness(1); }
    50% { transform: scale(1.1); filter: brightness(1.3); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  @media (max-width: 1100px) {
    .max-sum-k-viz-container .sw-main { grid-template-columns: 1fr; overflow: auto; }
    .max-sum-k-viz-container .sw-code { min-height: 340px; }
    .max-sum-k-viz-container .sw-header { flex-direction: column; align-items: flex-start; gap: 10px; }
    .max-sum-k-viz-container .sw-tip { max-width: 100%; }
    .max-sum-k-viz-container .sw-stats { grid-template-columns: repeat(2, 1fr); }
    .max-sum-k-viz-container .sw-input-row { grid-template-columns: 1fr; }
  }
</style>

<div class="max-sum-k-viz-container">
  <div class="sw-page">
    <div class="sw-header">
      <div class="sw-head-left">
        <div class="sw-icon-badge">🔄</div>
        <div>
          <h1>K次取反后最大化的数组和（贪心）</h1>
          <p class="sw-desc">LeetCode 1005：按符号和绝对值排序，每次翻转最小负数，使数组和最大化</p>
        </div>
      </div>
      <div class="sw-tip"><strong>贪心策略：</strong>优先翻转绝对值最小的负数；负数用完后在最小正数上反复翻转。</div>
    </div>
    <div class="sw-main">
      <div class="sw-left">
        <section class="sw-card">
          <div class="sw-card-title">输入</div>
          <div class="sw-input-row">
            <input type="text" id="max-sum-k-input" value="4,2,3,0,-1,-5,3,-4,5">
            <input type="number" id="max-sum-k-k" value="4" min="0">
            <button id="max-sum-k-start" class="sw-start-btn">开始求和</button>
          </div>
          <div style="padding: 0 16px 14px;">
            <button id="max-sum-k-set-k" class="sw-start-btn" style="width:100%;">设置 K 值并重算</button>
          </div>
        </section>
        <div class="sw-stats">
          <div class="sw-stat"><label>翻转次数</label><span id="flip-count">0</span></div>
          <div class="sw-stat"><label>剩余 K</label><span id="remaining-k">0</span></div>
          <div class="sw-stat"><label>当前总和</label><span id="current-sum">0</span></div>
          <div class="sw-stat"><label>排序依据</label><span>符号|绝对值</span></div>
        </div>
        <section class="sw-card sw-visual">
          <div class="sw-card-title">数组可视化</div>
          <div id="max-sum-k-array-display" class="sw-track"></div>
          <div class="sw-result-banner" id="max-sum-k-status"><span class="badge">💡</span>输入数组后点击开始求和</div>
        </section>
      </div>
      <aside class="sw-code"><div data-code-panel></div></aside>
    </div>
    <div class="sw-controls">
      <button id="max-sum-k-reset" class="sw-btn">⏮重置</button>
      <button id="max-sum-k-prev" class="sw-btn">◀上一步</button>
      <button id="max-sum-k-play" class="sw-btn sw-play-btn">▶播放</button>
      <button id="max-sum-k-next" class="sw-btn">下一步▶</button>
      <span id="step-counter" class="sw-counter">步骤: 0 / 0</span>
      <div class="sw-slider-container">
        <input id="max-sum-k-speed" type="range" min="200" max="2000" step="100" value="600">
        <span id="max-sum-k-speed-label">0.6s</span>
      </div>
    </div>
  </div>
</div>
