        </div>

        <!-- 状态空间展示盒 -->
        <div class="gs-state-space-box">
          <div class="gs-state-columns">
            <!-- 当前油量状态 -->
            <div class="gs-subcard">
              <div class="gs-subcard-title">🚗 当前油箱续航 (Fuel Tank)</div>
              <div id="gs-tank-container" style="flex: 1; min-height: 0; overflow-y: auto;"></div>
            </div>
            <!-- 亏空重置监视器 -->
            <div class="gs-subcard">
              <div class="gs-subcard-title">⚖️ 贪心亏空重置监视器 (Reset Monitor)</div>
              <div id="gs-reset-monitor-container" style="flex: 1; min-height: 0; overflow-y: auto;"></div>
            </div>
          </div>
          <!-- 统计与进度 -->
          <div class="gs-subcard" style="flex-shrink: 0;">
            <div class="gs-subcard-title">🏆 全局收支与唯一有效起点 (Circuit Result)</div>
            <div id="gs-metrics-container"></div>
          </div>
        </div>
      </div>

    </section>

    <!-- ================= 右侧：代码终端 + 执行日志 ================= -->
    <section class="gs-right-section">

      <!-- 卡片 3: 暗色代码终端面板 -->
      <div class="gs-dark-terminal">
        <div class="gs-terminal-header">
          <!-- 1. 主 Tab 切换器 (源码 / 题目 / 精讲) -->
          <div class="gs-tab-group">
            <button id="btn-tab-code" class="gs-tab-item active">💻 代码调试</button>
            <button id="btn-tab-problem" class="gs-tab-item">📋 题目描述</button>
            <button id="btn-tab-analysis" class="gs-tab-item">💡 贪心精讲</button>
          </div>

          <!-- 2. 多语言切换器 -->
          <div class="gs-lang-group" id="code-lang-tabs">
            <button class="gs-lang-btn active" data-lang="java">Java</button>
            <button class="gs-lang-btn" data-lang="cpp">C++</button>
            <button class="gs-lang-btn" data-lang="python">Python</button>
            <button class="gs-lang-btn" data-lang="javascript">JS</button>
          </div>

          <!-- 3. 字号缩放器与 macOS 窗口微控制 -->
          <div class="gs-font-tools">
            <div class="gs-font-scaler">
              <button id="btn-code-font-dec" title="缩小代码字号">A-</button>
              <span id="code-font-indicator" class="gs-font-indicator">12</span>
              <button id="btn-code-font-inc" title="放大代码字号">A+</button>
            </div>

            <div class="gs-window-dots">
              <span class="gs-dot" style="background:#ef4444;"></span>
              <span class="gs-dot" style="background:#eab308;"></span>
              <span class="gs-dot" style="background:#22c55e;"></span>
            </div>
          </div>
        </div>

        <!-- 容器 1: 源码高亮与单步追踪视图 -->
        <div id="code-view-container" style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;">
          <div class="gs-terminal-body">
            <div id="code-lines-wrapper">
              <!-- 动态装载代码行 -->
            </div>
          </div>
        </div>

        <!-- 容器 2: 题目完整描述视图 -->
        <div id="problem-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载题目内容 -->
        </div>

        <!-- 容器 3: 贪心精讲视图 -->
        <div id="analysis-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载贪心精讲内容 -->
        </div>
      </div>

      <!-- 卡片 4: 独立执行日志卡片 -->
      <div class="gs-log-card">
        <div class="gs-log-header">
          <div class="gs-log-header-title">
            <span>📜 执行日志</span>
          </div>
          <span id="log-count" class="gs-log-count">0 条记录</span>
        </div>

        <div id="log-container" class="gs-log-body">
          <!-- 动态填充日志条目 -->
        </div>
      </div>

    </section>

  </main>

  <!-- 4. 力扣原题描述轻量模态弹窗 (Modal) -->
  <div id="modal-problem" class="gs-modal-backdrop hidden">
    <div class="gs-modal-content">
      <div class="gs-modal-header">
        <div class="gs-modal-title">
          <span>📋 力扣原题描述</span>
        </div>
        <button id="btn-close-problem-modal" class="gs-modal-close" title="关闭 (Esc)">✕</button>
      </div>
      <div id="modal-problem-body" class="gs-modal-body">
        <!-- 动态装载题目内容 -->
      </div>
    </div>
  </div>
</div>
