<style>
  /* === 根据身高重建队列 · 玻璃感 + 排序飞入 + 位置计数动画 === */
  #algo-reconstruct-queue-view {
    --accent-a: #06b6d4;
    --accent-b: #f97316;
    --accent-glow: rgba(249, 115, 22, .45);
    --current-color: #fbbf24;
    --insert-color: #34d399;
    --sorted-color: #60a5fa;
    --count-color: #f97316;
    width: 100%; height: 100%;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background:
      radial-gradient(ellipse at 8% 5%, rgba(6, 182, 212, .26), transparent 55%),
      radial-gradient(ellipse at 92% 90%, rgba(249, 115, 22, .28), transparent 55%),
      linear-gradient(135deg, #0a1a22 0%, #1a1230 50%, #25151a 100%);
    overflow: hidden;
  }
  #algo-reconstruct-queue-view .rq-shell {
    width: 100%; height: 100%;
    display: grid; grid-template-rows: auto 1fr; overflow: hidden;
  }
  /* hero */
  #algo-reconstruct-queue-view .rq-hero {
    padding: 18px 24px 12px;
    display: flex; gap: 18px; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, .06);
    background: rgba(8, 8, 24, .35);
    backdrop-filter: blur(14px) saturate(150%);
  }
  #algo-reconstruct-queue-view .rq-hero-left { display: flex; align-items: center; gap: 14px; }
  #algo-reconstruct-queue-view .rq-icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 800;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; box-shadow: 0 6px 20px var(--accent-glow);
  }
  #algo-reconstruct-queue-view h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: #f1f5f9; }
  #algo-reconstruct-queue-view .rq-sub { color: #94a3b8; font-size: 12.5px; margin-top: 4px; }
  #algo-reconstruct-queue-view .rq-tip {
    max-width: 540px; padding: 10px 14px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(6, 182, 212, .12), rgba(249, 115, 22, .08));
    border: 1px solid rgba(249, 115, 22, .3);
    color: #cbd5e1; font-size: 12.5px; line-height: 1.65;
  }
  #algo-reconstruct-queue-view .rq-tip strong { color: #fb923c; }
  /* main */
  #algo-reconstruct-queue-view .rq-main {
    min-height: 0; display: grid;
    grid-template-columns: minmax(0, 1fr) 420px; gap: 16px; padding: 16px; overflow: hidden;
  }
  #algo-reconstruct-queue-view .rq-left { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
  #algo-reconstruct-queue-view .rq-card {
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
    overflow: hidden;
  }
  #algo-reconstruct-queue-view .rq-card-title {
    padding: 10px 16px; border-bottom: 1px solid rgba(255, 255, 255, .06);
    display: flex; justify-content: space-between; align-items: center;
    color: #cbd5e1; font-weight: 700; font-size: 13px;
  }
  #algo-reconstruct-queue-view .rq-tag {
    font-size: 11px; color: #fb923c; background: rgba(249, 115, 22, .14);
    border: 1px solid rgba(249, 115, 22, .3); padding: 2px 8px; border-radius: 999px;
  }
  /* input */
  #algo-reconstruct-queue-view .rq-input-row {
    display: grid; grid-template-columns: 1fr auto;
    gap: 10px; align-items: center; padding: 14px 16px;
  }
  #algo-reconstruct-queue-view input {
    width: 100%; padding: 9px 12px; border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, .12);
    background: rgba(8, 8, 24, .6);
    color: #e2e8f0; font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 13px; outline: none; transition: all .2s;
  }
  #algo-reconstruct-queue-view input:focus { border-color: var(--accent-b); box-shadow: 0 0 0 3px rgba(249, 115, 22, .15); }
  #algo-reconstruct-queue-view button {
    padding: 8px 16px; border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 10px; background: rgba(255, 255, 255, .04);

    transition: all .25s cubic-bezier(.4, 0, .2, 1);

  #algo-reconstruct-queue-view button:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    border-color: transparent; color: #06121f; transform: translateY(-1px);
    box-shadow: 0 6px 18px var(--accent-glow);
  }
  #algo-reconstruct-queue-view button:disabled { opacity: .4; cursor: not-allowed; }
  #algo-reconstruct-queue-view .rq-examples { padding: 0 16px 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  #algo-reconstruct-queue-view .rq-chip {
    padding: 5px 12px; border-radius: 999px; font-size: 12px;
    background: rgba(249, 115, 22, .12); border: 1px solid rgba(249, 115, 22, .28);
    color: #fb923c; cursor: pointer; transition: all .2s;
  }
  #algo-reconstruct-queue-view .rq-chip:hover {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; border-color: transparent; transform: translateY(-1px);
  }
  /* stats */
  #algo-reconstruct-queue-view .rq-stats {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
  }
  #algo-reconstruct-queue-view .rq-stat {
    position: relative; padding: 12px 14px 12px 16px;
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 14px; overflow: hidden;
  }
  #algo-reconstruct-queue-view .rq-stat::before {
    content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 4px; border-radius: 4px;
    background: linear-gradient(180deg, var(--accent-a), var(--accent-b));
  }
  #algo-reconstruct-queue-view .rq-stat--current::before { background: linear-gradient(180deg, #fbbf24, #f59e0b); }
  #algo-reconstruct-queue-view .rq-stat--current .rq-stat-val { color: #fde68a; }
  #algo-reconstruct-queue-view .rq-stat--insert::before { background: linear-gradient(180deg, #34d399, #10b981); }
  #algo-reconstruct-queue-view .rq-stat--insert .rq-stat-val { color: #6ee7b7; }
  #algo-reconstruct-queue-view .rq-stat--count::before { background: linear-gradient(180deg, #fb923c, #f97316); }
  #algo-reconstruct-queue-view .rq-stat--count .rq-stat-val { color: #fdba74; }
  #algo-reconstruct-queue-view .rq-stat-label { color: #94a3b8; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  #algo-reconstruct-queue-view .rq-stat-val {
    color: #e2e8f0; font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 22px; font-weight: 800; margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  /* sorted source */
  #algo-reconstruct-queue-view .rq-source {
    padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 10px;
    min-height: 92px; align-items: flex-start;
  }
  #algo-reconstruct-queue-view .rq-source-empty {
    color: #64748b; font-size: 13px; padding: 12px;
  }
  #algo-reconstruct-queue-view .rq-person {
    position: relative; min-width: 64px;
    border: 2px solid rgba(255, 255, 255, .12);
    background: linear-gradient(180deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .02));
    border-radius: 12px;
    padding: 8px 10px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-family: 'JetBrains Mono', Consolas, monospace;
    color: #e2e8f0; transition: all .35s cubic-bezier(.4, 0, .2, 1);
  }
  #algo-reconstruct-queue-view .rq-person-h {
    font-size: 18px; font-weight: 800; color: #f1f5f9;
  }
  #algo-reconstruct-queue-view .rq-person-k {
    font-size: 10.5px; color: #94a3b8;
    padding: 1px 6px; border-radius: 6px;
    background: rgba(148, 163, 184, .12);
  }
  #algo-reconstruct-queue-view .rq-person--current {
    border-color: var(--current-color);
    background: linear-gradient(180deg, rgba(251, 191, 36, .25), rgba(245, 158, 11, .08));
    color: #fef3c7;
    box-shadow: 0 0 0 3px rgba(251, 191, 36, .25), 0 8px 22px rgba(251, 191, 36, .35);
    transform: translateY(-4px) scale(1.06);
    animation: rq-pulse-current 1.2s ease-in-out infinite;
  }
  #algo-reconstruct-queue-view .rq-person--current .rq-person-h { color: #fef3c7; }
  #algo-reconstruct-queue-view .rq-person--current .rq-person-k { background: rgba(251, 191, 36, .25); color: #fde68a; }
  @keyframes rq-pulse-current {
    0%, 100% { box-shadow: 0 0 0 3px rgba(251, 191, 36, .25), 0 8px 22px rgba(251, 191, 36, .35); }
    50% { box-shadow: 0 0 0 6px rgba(251, 191, 36, .15), 0 10px 28px rgba(251, 191, 36, .5); }
  }
  #algo-reconstruct-queue-view .rq-person--done {
    opacity: .35; filter: grayscale(.6);
  }
  /* canvas + queue */
  #algo-reconstruct-queue-view .rq-canvas {
    padding: 24px 18px; min-height: 160px;
    position: relative; overflow: auto;
    display: flex; align-items: center; justify-content: center;
  }
  #algo-reconstruct-queue-view .rq-canvas::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(249, 115, 22, .12), transparent 60%);
    pointer-events: none;
  }
  #algo-reconstruct-queue-view .rq-queue {
    display: flex; align-items: stretch; gap: 10px; flex-wrap: wrap; min-height: 80px;
  }
  #algo-reconstruct-queue-view .rq-empty-queue {
    color: #64748b; font-size: 13px; padding: 24px;
    border: 1.5px dashed rgba(100, 116, 139, .35); border-radius: 12px;
  }
  /* queue person (uses same rq-person base but with queue-state modifiers) */
  #algo-reconstruct-queue-view .rq-queue .rq-person {
    animation: rq-pop-in .5s cubic-bezier(.34, 1.56, .64, 1);
  }
  @keyframes rq-pop-in {
    0% { transform: scale(.3) translateY(-30px); opacity: 0; }
    60% { transform: scale(1.12) translateY(4px); opacity: 1; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }
  #algo-reconstruct-queue-view .rq-person--fresh {
    border-color: var(--insert-color);
    background: linear-gradient(180deg, rgba(52, 211, 153, .28), rgba(16, 185, 129, .08));
    color: #d1fae5;
    box-shadow: 0 0 0 3px rgba(52, 211, 153, .25), 0 8px 22px rgba(52, 211, 153, .35);
    animation: rq-pop-in .5s cubic-bezier(.34, 1.56, .64, 1), rq-bounce-land .55s ease-in-out .5s;
  }
  @keyframes rq-bounce-land {
    0%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
    60% { transform: translateY(-2px); }
  }
  #algo-reconstruct-queue-view .rq-person--sorted {
    border-color: var(--sorted-color);
    background: linear-gradient(180deg, rgba(96, 165, 250, .22), rgba(59, 130, 246, .06));
    color: #dbeafe;
    box-shadow: 0 0 0 2px rgba(96, 165, 250, .15);
  }
  /* counting pointer above queue */
  #algo-reconstruct-queue-view .rq-counter-pin {
    position: absolute; top: -28px; left: 50%; transform: translateX(-50%);
    font-size: 11px; font-weight: 800;
    padding: 2px 8px; border-radius: 6px;
    background: rgba(8, 8, 24, .85);
    border: 1.5px solid var(--count-color);
    color: #fdba74;
    box-shadow: 0 0 12px rgba(249, 115, 22, .5);
    animation: rq-pin-bounce 1s ease-in-out infinite;
  }
  @keyframes rq-pin-bounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-3px); }
  }
  #algo-reconstruct-queue-view .rq-person--counting {
    border-color: var(--count-color);
    background: linear-gradient(180deg, rgba(249, 115, 22, .25), rgba(249, 115, 22, .05));
    color: #fed7aa;
    box-shadow: 0 0 0 3px rgba(249, 115, 22, .25), 0 6px 18px rgba(249, 115, 22, .35);
  }
  #algo-reconstruct-queue-view .rq-person--target-slot {
    border-color: var(--insert-color);
    background: linear-gradient(180deg, rgba(52, 211, 153, .25), rgba(16, 185, 129, .05));
    color: #a7f3d0;
    box-shadow: 0 0 0 3px rgba(52, 211, 153, .3), 0 8px 24px rgba(52, 211, 153, .45);
    animation: rq-target-glow 1s ease-in-out infinite;
  }
  @keyframes rq-target-glow {
    0%, 100% { box-shadow: 0 0 0 3px rgba(52, 211, 153, .3), 0 8px 24px rgba(52, 211, 153, .45); }
    50% { box-shadow: 0 0 0 6px rgba(52, 211, 153, .15), 0 10px 30px rgba(52, 211, 153, .6); }
  }
  #algo-reconstruct-queue-view .rq-insert-arrow {
    position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
    font-size: 18px; color: var(--insert-color);
    animation: rq-arrow-down 1s ease-in-out infinite;
  }
  @keyframes rq-arrow-down {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(4px); }
  }
  /* result banner */
  #algo-reconstruct-queue-view .rq-result {
    margin: 0 16px 16px; padding: 14px 18px; border-radius: 12px;
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(135deg, rgba(6, 182, 212, .12), rgba(249, 115, 22, .06));
    border: 1px solid rgba(249, 115, 22, .28);
    line-height: 1.55; font-size: 14px; color: #fed7aa;
  }
  #algo-reconstruct-queue-view .rq-result .rq-emoji {
    width: 36px; height: 36px; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 20px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; box-shadow: 0 4px 14px var(--accent-glow);
  }
  #algo-reconstruct-queue-view .rq-result.rq-result--done {
    background: linear-gradient(135deg, rgba(52, 211, 153, .18), rgba(16, 185, 129, .08));
    border-color: rgba(52, 211, 153, .4); color: #d1fae5;
  }
  #algo-reconstruct-queue-view .rq-result.rq-result--done .rq-emoji {
    background: linear-gradient(135deg, #34d399, #10b981);
    box-shadow: 0 4px 14px rgba(52, 211, 153, .55);
  }
  /* log */
  #algo-reconstruct-queue-view .rq-log {
    min-height: 90px; max-height: 160px; padding: 10px 14px;
    overflow: auto; background: rgba(8, 8, 24, .55);
    font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px;
    line-height: 1.7; color: #94a3b8;
  }
  #algo-reconstruct-queue-view .rq-log-line { display: flex; gap: 8px; }
  #algo-reconstruct-queue-view .rq-log-line .rq-log-num { color: #475569; flex-shrink: 0; }
  #algo-reconstruct-queue-view .rq-log-line.rq-log-active { color: #fb923c; font-weight: 600; }
  #algo-reconstruct-queue-view .rq-log-line.rq-log-active .rq-log-num { color: var(--accent-b); }
  /* code */
  #algo-reconstruct-queue-view .rq-code {
    min-height: 0; display: flex;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; overflow: hidden;
  }
  #algo-reconstruct-queue-view .rq-code [data-code-panel] { flex: 1; min-width: 0; }
  /* controls */
  #algo-reconstruct-queue-view .rq-controls {
    padding: 14px 18px;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border-top: 1px solid rgba(255, 255, 255, .06);
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  #algo-reconstruct-queue-view .rq-controls .rq-ctrl-btn { min-width: 64px; }
  #algo-reconstruct-queue-view .rq-controls .rq-ctrl-primary {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; border-color: transparent;
  }
  #algo-reconstruct-queue-view .rq-counter {
    color: #94a3b8; font-size: 13px; font-weight: 600;
    min-width: 110px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #algo-reconstruct-queue-view .rq-speed-wrap {
    display: flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 12px;
  }
  #algo-reconstruct-queue-view #rq-speed { width: 130px; accent-color: var(--accent-b); }
  @media (max-width: 1100px) {
    #algo-reconstruct-queue-view .rq-main { grid-template-columns: 1fr; overflow: auto; }
    #algo-reconstruct-queue-view .rq-code { min-height: 360px; }
  }
</style>

<div class="rq-shell">
  <div class="rq-hero">
    <div class="rq-hero-left">
      <span class="rq-icon">👥</span>
      <div>
        <h1>根据身高重建队列（贪心）</h1>
        <div class="rq-sub">LeetCode 406 · 按 [身高降序, k 升序] 排序后逐个插回 k 位置</div>
      </div>
    </div>
    <div class="rq-tip"><strong>核心动画：</strong>排序后<span style="color:#fde68a">高的人先站好</span>，再依次把矮的人插入 k 位置；插入前会<span style="color:#fdba74">从左扫描计数</span>，找到第 k 个空位，新插入的节点<span style="color:#6ee7b7">弹性 pop-in</span> 落地。</div>
  </div>
  <div class="rq-main">
    <div class="rq-left">
      <section class="rq-card">
        <div class="rq-card-title">输入 <span class="rq-tag">people = [[h,k]...]</span></div>
        <div class="rq-input-row">
          <input id="rq-input" value="[[7,0],[4,4],[7,1],[5,0],[6,1],[5,2]]">
          <button id="rq-start">开始重建</button>
        </div>
        <div class="rq-examples">
          <button class="rq-chip" data-val="[[7,0],[4,4],[7,1],[5,0],[6,1],[5,2]]">默认 6 人</button>
          <button class="rq-chip" data-val="[[7,0],[4,2],[5,0]]">简单 3 人</button>
          <button class="rq-chip" data-val="[[5,0],[5,1],[5,2]]">相同身高</button>
          <button class="rq-chip" data-val="[[7,0],[6,0],[5,0],[4,0]]">已排序</button>
          <button class="rq-chip" data-val="[[4,3],[5,2],[6,1],[7,0]]">逆序输入</button>
        </div>
      </section>

      <div class="rq-stats">
        <div class="rq-stat rq-stat--current"><div class="rq-stat-label">处理中</div><div class="rq-stat-val" id="rq-stat-current" style="font-size:16px;">-</div></div>
        <div class="rq-stat"><div class="rq-stat-label">身高 h</div><div class="rq-stat-val" id="rq-stat-h">-</div></div>
        <div class="rq-stat rq-stat--count"><div class="rq-stat-label">k 值</div><div class="rq-stat-val" id="rq-stat-k">-</div></div>
        <div class="rq-stat rq-stat--insert"><div class="rq-stat-label">插入位置</div><div class="rq-stat-val" id="rq-stat-pos">-</div></div>
        <div class="rq-stat"><div class="rq-stat-label">已处理</div><div class="rq-stat-val" id="rq-stat-done">0</div></div>
      </div>

      <section class="rq-card">
        <div class="rq-card-title">排序后序列 <span class="rq-tag">高 → 矮</span></div>
        <div class="rq-source" id="rq-source"></div>
      </section>

      <section class="rq-card">
        <div class="rq-card-title">重建队列 <span class="rq-tag">逐个插入</span></div>
        <div class="rq-canvas">
          <div class="rq-queue" id="rq-queue"></div>
        </div>
        <div class="rq-result" id="rq-result">
          <span class="rq-emoji">👥</span>
          <div id="step-message">点击「开始重建」观察排序 + 计数 + 插入动画</div>
        </div>
      </section>

      <section class="rq-card">
        <div class="rq-card-title">执行日志 <button id="rq-log-clear" style="padding:4px 10px;font-size:11px;border-radius:999px;">清空</button></div>
        <div class="rq-log" id="rq-log"></div>
      </section>
    </div>
    <aside class="rq-code"><div data-code-panel></div></aside>
  </div>
  <div class="rq-controls">
    <button id="step-reset" class="rq-ctrl-btn">⏮ 重置</button>
    <button id="step-prev" class="rq-ctrl-btn">◀ 上一步</button>
    <button id="step-play" class="rq-ctrl-btn rq-ctrl-primary">▶ 播放</button>
    <button id="step-next" class="rq-ctrl-btn">下一步 ▶</button>
    <span id="step-counter" class="rq-counter">步骤: 0 / 0</span>
    <div class="rq-speed-wrap">
      <span>速度</span>
      <input id="rq-speed" type="range" min="200" max="2500" step="100" value="900">
      <span id="rq-speed-label" style="min-width:42px;">0.9s</span>
    </div>
  </div>
</div>
