              <div class="ma-subcard-title">🎈 当前考察区间 (Current Interval)</div>
              <div id="ma-interval-container" style="flex: 1; min-height: 0; overflow-y: auto;"></div>
            </div>
            <!-- 重叠判定监视器 -->
            <div class="ma-subcard">
              <div class="ma-subcard-title">⚖️ 重叠与加箭监视器 (Overlap Monitor)</div>
              <div id="ma-overlap-monitor-container" style="flex: 1; min-height: 0; overflow-y: auto;"></div>
            </div>
          </div>
          <!-- 统计与进度 -->
          <div class="ma-subcard" style="flex-shrink: 0;">
            <div class="ma-subcard-title">🏆 最终射箭与引爆看板 (Arrow Metrics)</div>
            <div id="ma-metrics-container"></div>
          </div>
        </div>
      </div>

    </section>

    <!-- ================= 右侧：代码终端 + 执行日志 ================= -->
    <section class="ma-right-section">

      <!-- 卡片 3: 暗色代码终端面板 -->
      <div class="ma-dark-terminal">
        <div class="ma-terminal-header">
          <!-- 1. 主 Tab 切换器 (源码 / 题目 / 精讲) -->
          <div class="ma-tab-group">
            <button id="btn-tab-code" class="ma-tab-item active">💻 代码调试</button>
            <button id="btn-tab-problem" class="ma-tab-item">📋 题目描述</button>
            <button id="btn-tab-analysis" class="ma-tab-item">💡 贪心精讲</button>
          </div>

          <!-- 2. 多语言切换器 -->
          <div class="ma-lang-group" id="code-lang-tabs">
            <button class="ma-lang-btn active" data-lang="java">Java</button>
            <button class="ma-lang-btn" data-lang="cpp">C++</button>
            <button class="ma-lang-btn" data-lang="python">Python</button>
            <button class="ma-lang-btn" data-lang="javascript">JS</button>
          </div>

          <!-- 3. 字号缩放器与 macOS 窗口微控制 -->
          <div class="ma-font-tools">
            <div class="ma-font-scaler">
              <button id="btn-code-font-dec" title="缩小代码字号">A-</button>
              <span id="code-font-indicator" class="ma-font-indicator">12</span>
              <button id="btn-code-font-inc" title="放大代码字号">A+</button>
            </div>

            <div class="ma-window-dots">
              <span class="ma-dot" style="background:#ef4444;"></span>
              <span class="ma-dot" style="background:#eab308;"></span>
              <span class="ma-dot" style="background:#22c55e;"></span>
            </div>
          </div>
        </div>

        <!-- 容器 1: 源码高亮与单步追踪视图 -->
        <div id="code-view-container" style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;">
          <div class="ma-terminal-body">
            <div id="code-lines-wrapper">
              <!-- 动态装载代码行 -->
            </div>
          </div>
        </div>

        <!-- 容器 2: 题目完整描述视图 -->
        <div id="problem-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载题目内容 -->
        </div>

        <!-- 容器 3: 贪心精讲视图 -->
        <div id="analysis-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载贪心精讲内容 -->
        </div>
      </div>

      <!-- 卡片 4: 独立执行日志卡片 -->
      <div class="ma-log-card">
        <div class="ma-log-header">
          <div class="ma-log-header-title">
            <span>📜 执行日志</span>
          </div>
          <span id="log-count" class="ma-log-count">0 条记录</span>
        </div>

        <div id="log-container" class="ma-log-body">
          <!-- 动态填充日志条目 -->
        </div>
      </div>

    </section>

  </main>

  <!-- 4. 力扣原题描述轻量模态弹窗 (Modal) -->
  <div id="modal-problem" class="ma-modal-backdrop hidden">
    <div class="ma-modal-content">
      <div class="ma-modal-header">
        <div class="ma-modal-title">
          <span>📋 力扣原题描述</span>
        </div>
        <button id="btn-close-problem-modal" class="ma-modal-close" title="关闭 (Esc)">✕</button>
      </div>
      <div id="modal-problem-body" class="ma-modal-body">
        <!-- 动态装载题目内容 -->
      </div>
    </div>
  </div>
</div>
