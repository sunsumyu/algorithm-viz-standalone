        </div>

        <div class="tc-state-space-box">
          <div class="tc-state-columns">
            <!-- 当前节点与子树状态 -->
            <div class="tc-subcard">
              <div class="tc-subcard-title">🌳 当前后序节点 (Current Node)</div>
              <div id="tc-node-container" style="flex: 1; min-height: 0; overflow-y: auto;"></div>
            </div>
            <!-- 贪心状态转移决策监视器 -->
            <div class="tc-subcard">
              <div class="tc-subcard-title">⚖️ 状态转移决策监视器 (Cover Decision)</div>
              <div id="tc-decision-monitor-container" style="flex: 1; min-height: 0; overflow-y: auto;"></div>
            </div>
          </div>
          <!-- 统计与进度 -->
          <div class="tc-subcard" style="flex-shrink: 0;">
            <div class="tc-subcard-title">🏆 最小摄像头安装配置看板 (Cameras Result)</div>
            <div id="tc-metrics-container"></div>
          </div>
        </div>
      </div>

    </section>

    <!-- ================= 右侧：代码终端 + 执行日志 ================= -->
    <section class="tc-right-section">

      <!-- 卡片 3: 暗色代码终端面板 -->
      <div class="tc-dark-terminal">
        <div class="tc-terminal-header">
          <!-- 1. 主 Tab 切换器 (源码 / 题目 / 精讲) -->
          <div class="tc-tab-group">
            <button id="btn-tab-code" class="tc-tab-item active">💻 代码调试</button>
            <button id="btn-tab-problem" class="tc-tab-item">📋 题目描述</button>
            <button id="btn-tab-analysis" class="tc-tab-item">💡 贪心精讲</button>
          </div>

          <!-- 2. 多语言切换器 -->
          <div class="tc-lang-group" id="code-lang-tabs">
            <button class="tc-lang-btn active" data-lang="java">Java</button>
            <button class="tc-lang-btn" data-lang="cpp">C++</button>
            <button class="tc-lang-btn" data-lang="python">Python</button>
            <button class="tc-lang-btn" data-lang="javascript">JS</button>
          </div>

          <!-- 3. 字号缩放器与 macOS 窗口微控制 -->
          <div class="tc-font-tools">
            <div class="tc-font-scaler">
              <button id="btn-code-font-dec" title="缩小代码字号">A-</button>
              <span id="code-font-indicator" class="tc-font-indicator">12</span>
              <button id="btn-code-font-inc" title="放大代码字号">A+</button>
            </div>

            <div class="tc-window-dots">
              <span class="tc-dot" style="background:#ef4444;"></span>
              <span class="tc-dot" style="background:#eab308;"></span>
              <span class="tc-dot" style="background:#22c55e;"></span>
            </div>
          </div>
        </div>

        <!-- 容器 1: 源码高亮与单步追踪视图 -->
        <div id="code-view-container" style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;">
          <div class="tc-terminal-body">
            <div id="code-lines-wrapper">
              <!-- 动态装载代码行 -->
            </div>
          </div>
        </div>

        <!-- 容器 2: 题目完整描述视图 -->
        <div id="problem-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载题目内容 -->
        </div>

        <!-- 容器 3: 贪心精讲视图 -->
        <div id="analysis-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载贪心精讲内容 -->
        </div>
      </div>

      <!-- 卡片 4: 独立执行日志卡片 -->
      <div class="tc-log-card">
        <div class="tc-log-header">
          <div class="tc-log-header-title">
            <span>📜 执行日志</span>
          </div>
          <span id="log-count" class="tc-log-count">0 条记录</span>
        </div>

        <div id="log-container" class="tc-log-body">
          <!-- 动态填充日志条目 -->
        </div>
      </div>

    </section>

  </main>

  <!-- 4. 力扣原题描述轻量模态弹窗 (Modal) -->
  <div id="modal-problem" class="tc-modal-backdrop hidden">
    <div class="tc-modal-content">
      <div class="tc-modal-header">
        <div class="tc-modal-title">
          <span>📋 力扣原题描述</span>
        </div>
        <button id="btn-close-problem-modal" class="tc-modal-close" title="关闭 (Esc)">✕</button>
      </div>
      <div id="modal-problem-body" class="tc-modal-body">
        <!-- 动态装载题目内容 -->
      </div>
    </div>
  </div>
</div>
