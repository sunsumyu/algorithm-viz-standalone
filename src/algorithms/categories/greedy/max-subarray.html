    font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;
    color: #e2e8f0;

    margin-top: auto;

  #algo-max-subarray-view .ms-bar.ms-bar--neg {
    background: linear-gradient(0deg, rgba(248, 113, 113, .45), rgba(239, 68, 68, .15));

  }

    background: linear-gradient(0deg, rgba(251, 191, 36, .65), rgba(245, 158, 11, .2));
  }

    0%, 100% { box-shadow: 0 0 0 3px rgba(251, 191, 36, .25), 0 6px 18px rgba(251, 191, 36, .4); }

  }
  #algo-max-subarray-view .ms-bar.ms-bar--sub {
    background: linear-gradient(180deg, rgba(96, 165, 250, .55), rgba(59, 130, 246, .15));

  #algo-max-subarray-view .ms-bar.ms-bar--neg.ms-bar--sub {
    background: linear-gradient(0deg, rgba(96, 165, 250, .55), rgba(59, 130, 246, .15));
  }
  #algo-max-subarray-view .ms-bar.ms-bar--max {
    background: linear-gradient(180deg, rgba(52, 211, 153, .65), rgba(16, 185, 129, .2));

  }
  #algo-max-subarray-view .ms-bar.ms-bar--neg.ms-bar--max {
    background: linear-gradient(0deg, rgba(52, 211, 153, .55), rgba(16, 185, 129, .15));
  }

    background: linear-gradient(180deg, rgba(251, 191, 36, .65), rgba(245, 158, 11, .2));

  }

  }
  @keyframes ms-shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-4px) rotate(-1deg); }
    40% { transform: translateX(4px) rotate(1deg); }
    60% { transform: translateX(-3px) rotate(-0.5deg); }
    80% { transform: translateX(3px) rotate(0.5deg); }
  }
  #algo-max-subarray-view .ms-bar.ms-bar--bump {
    animation: ms-bump .6s cubic-bezier(.34, 1.56, .64, 1);
  }
  @keyframes ms-bump {
    0% { transform: scale(1); }

    100% { transform: scale(1); }
  }
  #algo-max-subarray-view .ms-bar-label {
    font-size: 10.5px; color: #64748b; font-weight: 600;
    padding-top: 6px; font-variant-numeric: tabular-nums;
    text-align: center;

  #algo-max-subarray-view .ms-result.ms-result--done {

  }
  #algo-max-subarray-view .ms-result.ms-result--done .ms-emoji {
    background: linear-gradient(135deg, #34d399, #10b981);

  }
  #algo-max-subarray-view .ms-result.ms-result--reset {
    background: linear-gradient(135deg, rgba(248, 113, 113, .18), rgba(239, 68, 68, .06));

  }
  #algo-max-subarray-view .ms-result.ms-result--reset .ms-emoji {
    background: linear-gradient(135deg, #f87171, #ef4444);
    box-shadow: 0 4px 14px rgba(248, 113, 113, .5);
    color: #fff;
  }

  #algo-max-subarray-view .ms-log {

  #algo-max-subarray-view .ms-log-line .ms-log-num { color: #475569; flex-shrink: 0; }
  #algo-max-subarray-view .ms-log-line.ms-log-active { color: #fdba74; font-weight: 600; }
  #algo-max-subarray-view .ms-log-line.ms-log-active .ms-log-num { color: var(--accent-b); }
  /* code */
  #algo-max-subarray-view .ms-code {
    min-height: 0; display: flex;
    background: rgba(8, 8, 24, .55);

    border-radius: 16px; overflow: hidden;

    padding: 14px 18px;

    border-top: 1px solid rgba(255, 255, 255, .06);
    display: flex; align-items: center; justify-content: center; gap: 12px;

  #algo-max-subarray-view .ms-controls .ms-ctrl-btn { min-width: 64px; }

  }
  #algo-max-subarray-view .ms-counter {
    color: #94a3b8; font-size: 13px; font-weight: 600;

    font-variant-numeric: tabular-nums;
  }
  #algo-max-subarray-view .ms-speed-wrap {

<div class="ms-shell">
  <div class="ms-hero">
    <div class="ms-hero-left">
      <span class="ms-icon">📊</span>

        <h1>最大子序和（贪心 Kadane）</h1>
        <div class="ms-sub">LeetCode 53 · 连续子数组的最大和</div>
      </div>
    </div>
    <div class="ms-tip"><strong>核心动画：</strong>柱状图 <span style="color:#93c5fd">蓝色子数组区间</span> 随指针滑动；<span style="color:#fef3c7">当前柱</span>黄色脉冲；<span style="color:#6ee7b7">max 区间</span>绿色常驻；<span style="color:#fca5a5">重置</span>时柱 shake + result banner 变红。</div>
  </div>
  <div class="ms-main">
    <div class="ms-left">
      <section class="ms-card">
        <div class="ms-card-title">输入 <span class="ms-tag">nums = [-2,1,...]</span></div>
        <div class="ms-input-row">
          <input id="maxsub-input" value="-2,1,-3,4,-1,2,1,-5,4">
          <button id="maxsub-start">开始求和</button>
        </div>
        <div class="ms-examples">
          <button class="ms-chip" data-val="-2,1,-3,4,-1,2,1,-5,4">经典 9 个</button>
          <button class="ms-chip" data-val="1,2,3,4,5">全正</button>
          <button class="ms-chip" data-val="-5,-3,-2,-4,-1">全负</button>
          <button class="ms-chip" data-val="-1,-2,0,3,-1,5">零穿插</button>
          <button class="ms-chip" data-val="5,-10,5,-10,15">峰值</button>
        </div>
      </section>

      <div class="ms-stats">
        <div class="ms-stat ms-stat--sub"><div class="ms-stat-label">当前和</div><div class="ms-stat-val" id="maxsub-cursum">0</div></div>
        <div class="ms-stat ms-stat--max"><div class="ms-stat-label">最大和</div><div class="ms-stat-val" id="maxsub-maxsum">-</div></div>
        <div class="ms-stat ms-stat--range"><div class="ms-stat-label">max 区间</div><div class="ms-stat-val" id="maxsub-range" style="font-size:16px;">-</div></div>
        <div class="ms-stat"><div class="ms-stat-label">当前指针</div><div class="ms-stat-val" id="maxsub-idx">-</div></div>
        <div class="ms-stat"><div class="ms-stat-label">状态</div><div class="ms-stat-val" id="maxsub-status" style="font-size:14px;">-</div></div>
      </div>

      <section class="ms-card ms-chart-card">
        <div class="ms-card-title">柱状图与子数组 <span class="ms-tag">Kadane 算法</span></div>
        <div class="ms-canvas">
          <div class="ms-bars" id="maxsub-bars"></div>
        </div>
        <div class="ms-result" id="maxsub-result">
          <span class="ms-emoji">📊</span>
          <div id="step-message">点击「开始求和」观察柱状图 + 子数组滑动</div>
        </div>
      </section>

      <section class="ms-card">
        <div class="ms-card-title">执行日志 <button id="maxsub-log-clear" style="padding:4px 10px;font-size:11px;border-radius:999px;">清空</button></div>

      </section>
    </div>

  </div>

    <span id="step-counter" class="ms-counter">步骤: 0 / 0</span>

      <span id="maxsub-speed-label" style="min-width:42px;">0.9s</span>
    </div>
  </div>
</div>
