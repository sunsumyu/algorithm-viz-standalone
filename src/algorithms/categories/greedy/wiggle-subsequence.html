          <span id="badge-wiggle-count" class="ws-counter-badge" style="color:#059669; background:#ecfdf5; border-color:#a7f3d0;">摆动长度: 1</span>
        </div>

        <!-- 状态空间展示盒 -->
        <div class="ws-state-space-box">
          <div class="ws-state-columns">
            <!-- 差值与方向 -->
            <div class="ws-subcard">
              <div class="ws-subcard-title">〰️ 差值与坡度状态 (Diff & Slope)</div>
              <div id="ws-diff-container" style="flex: 1; min-height: 0; overflow-y: auto;"></div>
            </div>
            <!-- 峰谷判定监视器 -->
            <div class="ws-subcard">
              <div class="ws-subcard-title">⚖️ 峰谷翻转判定监视器 (Peak/Valley Rule)</div>
              <div id="ws-peak-monitor-container" style="flex: 1; min-height: 0; overflow-y: auto;"></div>
            </div>
          </div>
          <!-- 统计与进度 -->
          <div class="ws-subcard" style="flex-shrink: 0;">
            <div class="ws-subcard-title">🏆 摆动序列构成与指标 (Wiggle Metrics)</div>
            <div id="ws-metrics-container"></div>
          </div>
        </div>
      </div>

    </section>

    <!-- ================= 右侧：代码终端 + 执行日志 ================= -->
    <section class="ws-right-section">

      <!-- 卡片 3: 暗色代码终端面板 -->
      <div class="ws-dark-terminal">
        <div class="ws-terminal-header">
          <!-- 1. 主 Tab 切换器 (源码 / 题目 / 精讲) -->
          <div class="ws-tab-group">
            <button id="btn-tab-code" class="ws-tab-item active">💻 代码调试</button>
            <button id="btn-tab-problem" class="ws-tab-item">📋 题目描述</button>
            <button id="btn-tab-analysis" class="ws-tab-item">💡 贪心精讲</button>
          </div>

          <!-- 2. 多语言切换器 -->
          <div class="ws-lang-group" id="code-lang-tabs">
            <button class="ws-lang-btn active" data-lang="java">Java</button>
            <button class="ws-lang-btn" data-lang="cpp">C++</button>
            <button class="ws-lang-btn" data-lang="python">Python</button>
            <button class="ws-lang-btn" data-lang="javascript">JS</button>
          </div>

          <!-- 3. 字号缩放器与 macOS 窗口微控制 -->
          <div class="ws-font-tools">
            <div class="ws-font-scaler">
              <button id="btn-code-font-dec" title="缩小代码字号">A-</button>
              <span id="code-font-indicator" class="ws-font-indicator">12</span>
              <button id="btn-code-font-inc" title="放大代码字号">A+</button>
            </div>

            <div class="ws-window-dots">
              <span class="ws-dot" style="background:#ef4444;"></span>
              <span class="ws-dot" style="background:#eab308;"></span>
              <span class="ws-dot" style="background:#22c55e;"></span>
            </div>
          </div>
        </div>

        <!-- 容器 1: 源码高亮与单步追踪视图 -->
        <div id="code-view-container" style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;">
          <div class="ws-terminal-body">
            <div id="code-lines-wrapper">
              <!-- 动态装载代码行 -->
            </div>
          </div>
        </div>

        <!-- 容器 2: 题目完整描述视图 -->
        <div id="problem-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载题目内容 -->
        </div>

        <!-- 容器 3: 贪心精讲视图 -->
        <div id="analysis-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载贪心精讲内容 -->
        </div>
      </div>

      <!-- 卡片 4: 独立执行日志卡片 -->
      <div class="ws-log-card">
        <div class="ws-log-header">
          <div class="ws-log-header-title">
            <span>📜 执行日志</span>
          </div>
          <span id="log-count" class="ws-log-count">0 条记录</span>
        </div>

        <div id="log-container" class="ws-log-body">
          <!-- 动态填充日志条目 -->
        </div>
      </div>

    </section>

  </main>

  <!-- 4. 力扣原题描述轻量模态弹窗 (Modal) -->
  <div id="modal-problem" class="ws-modal-backdrop hidden">
    <div class="ws-modal-content">
      <div class="ws-modal-header">
        <div class="ws-modal-title">
          <span>📋 力扣原题描述</span>
        </div>
        <button id="btn-close-problem-modal" class="ws-modal-close" title="关闭 (Esc)">✕</button>
      </div>
      <div id="modal-problem-body" class="ws-modal-body">
        <!-- 动态装载题目内容 -->
      </div>
    </div>
  </div>
</div>
