<style>
  :root {
    --no-accent-a: #2dd4bf;
    --no-accent-b: #34d399;
  }
  .non-overlap-viz-container {
    width: 100%; height: 100%; color: #cdd6f4;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:
      radial-gradient(ellipse at 8% 6%, rgba(45, 212, 191, 0.5), transparent 55%),
      radial-gradient(ellipse at 92% 94%, rgba(52, 211, 153, 0.55), transparent 55%),
      linear-gradient(135deg, #06171a, #0a1f1c, #08160f);
    display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box;
  }
  .non-overlap-viz-container .sw-page { height: 100%; display: flex; flex-direction: column; overflow: hidden; }
  .non-overlap-viz-container .sw-header {
    padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; gap: 18px;
  }
  .non-overlap-viz-container .sw-head-left { display: flex; align-items: center; gap: 14px; }
  .non-overlap-viz-container .sw-icon-badge {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, var(--no-accent-a), var(--no-accent-b));
    display: flex; align-items: center; justify-content: center; font-size: 22px;
    box-shadow: 0 8px 24px rgba(45, 212, 191, 0.4);
  }
  .non-overlap-viz-container h1 { margin: 0; font-size: 22px; font-weight: 800; color: #fff; }
  .non-overlap-viz-container .sw-desc { margin: 4px 0 0; color: #a6adc8; font-size: 13px; line-height: 1.4; }
  .non-overlap-viz-container .sw-tip {
    max-width: 400px; padding: 11px 14px; border-radius: 12px;
    background: rgba(45, 212, 191, 0.12); backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(45, 212, 191, 0.25); color: #bac2de; font-size: 13px; line-height: 1.55;
  }
  .non-overlap-viz-container .sw-tip strong { color: var(--no-accent-a); }
  .non-overlap-viz-container .sw-main {
    flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 420px;
    gap: 16px; padding: 0 16px 16px; overflow: hidden;
  }
  .non-overlap-viz-container .sw-left { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
  .non-overlap-viz-container .sw-card {
    background: rgba(20, 18, 38, 0.55); backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; overflow: hidden;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }
  .non-overlap-viz-container .sw-card-title {
    padding: 13px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: flex; justify-content: space-between; color: #fff; font-weight: 700; font-size: 14px;
  }
  .non-overlap-viz-container .sw-input-row {
    display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 14px 16px;
  }
  .non-overlap-viz-container input[type="text"] {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(20, 18, 38, 0.6); color: #cdd6f4; font-family: Consolas, monospace; outline: none; font-size: 13px;
  }
  .non-overlap-viz-container input[type="text"]:focus {
    border-color: var(--no-accent-a); box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.2);
  }
  .non-overlap-viz-container .sw-start-btn {
    padding: 10px 18px; border-radius: 10px; border: 1px solid transparent;
    background: linear-gradient(135deg, var(--no-accent-a), var(--no-accent-b)); color: #06171a;
    font-weight: 700; cursor: pointer; transition: all 0.2s; font-size: 14px;
  }
  .non-overlap-viz-container .sw-start-btn:hover { box-shadow: 0 0 20px rgba(52, 211, 153, 0.45); }
  .non-overlap-viz-container .sw-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .non-overlap-viz-container .sw-stat {
    padding: 14px; background: rgba(20, 18, 38, 0.4); border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.06); position: relative; overflow: hidden;
  }
  .non-overlap-viz-container .sw-stat::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: linear-gradient(180deg, var(--no-accent-a), var(--no-accent-b));
  }
  .non-overlap-viz-container .sw-stat label { display: block; margin-bottom: 6px; color: #a6adc8; font-size: 12px; }
  .non-overlap-viz-container .sw-stat span {
    color: var(--no-accent-b); font-family: Consolas, monospace; font-size: 21px; font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .non-overlap-viz-container .sw-visual { flex: 1; min-height: 220px; display: flex; flex-direction: column; }
  .non-overlap-viz-container .sw-track {
    flex: 1; min-height: 0; padding: 16px 16px 20px; overflow: auto; display: flex; flex-direction: column; gap: 8px;
  }
  .non-overlap-viz-container .interval-row {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(20, 18, 38, 0.45);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s, border-color 0.3s, opacity 0.3s;
    will-change: transform;
  }
  .non-overlap-viz-container .interval-row .interval-index {
    width: 32px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    background: rgba(45, 212, 191, 0.2); color: #5eead4; font-size: 12px; font-weight: 700; flex-shrink: 0;
    font-family: Consolas, monospace;
  }
  .non-overlap-viz-container .interval-row .interval-range {
    font-family: Consolas, monospace; font-size: 14px; color: #d8dbee; flex: 1;
  }
  .non-overlap-viz-container .interval-row .interval-tag {
    font-size: 11px; padding: 3px 8px; border-radius: 6px; font-weight: 600;
  }
  .non-overlap-viz-container .interval-row .tag-kept { background: rgba(52, 211, 153, 0.3); color: #6ee7b7; }
  .non-overlap-viz-container .interval-row .tag-removed { background: rgba(248, 113, 113, 0.3); color: #fca5a5; }
  .non-overlap-viz-container .interval-row.current {
    background: rgba(45, 212, 191, 0.18); border-color: var(--no-accent-a);
    transform: scale(1.02); animation: pulse-no 1.2s infinite;
  }
  .non-overlap-viz-container .interval-row.kept {
    background: rgba(52, 211, 153, 0.14); border-color: var(--no-accent-b);
    animation: pop-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .non-overlap-viz-container .interval-row.removed {
    background: rgba(248, 113, 113, 0.1); border-color: rgba(248, 113, 113, 0.4); opacity: 0.55;
    animation: shake 0.35s ease-in-out;
  }
  .non-overlap-viz-container .sw-result-banner {
    margin: 0 16px 16px; padding: 12px 16px; border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.12); background: rgba(20, 18, 38, 0.5);
    backdrop-filter: blur(18px); font-size: 14px; line-height: 1.5; transition: all 0.3s;
  }
  .non-overlap-viz-container .sw-result-banner.success {
    background: rgba(52, 211, 153, 0.14); border-color: var(--no-accent-b); color: #6ee7b7;
  }
  .non-overlap-viz-container .sw-result-banner .badge { margin-right: 8px; }
  .non-overlap-viz-container .sw-code {
    min-height: 0; display: flex; background: rgba(20, 18, 38, 0.4); border-radius: 16px; overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.06);
  }
  .non-overlap-viz-container .sw-code [data-code-panel] { flex: 1; min-width: 0; }
  .non-overlap-viz-container .sw-controls {
    padding: 14px 20px; background: rgba(20, 18, 38, 0.6); border-top: 1px solid rgba(255, 255, 255, 0.06);
    display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
  }
  .non-overlap-viz-container .sw-btn {
    padding: 10px 18px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(20, 18, 38, 0.5); color: #cdd6f4; cursor: pointer; transition: all 0.2s;
    font-size: 14px; font-weight: 500;
  }
  .non-overlap-viz-container .sw-btn:hover:not(:disabled) { border-color: var(--no-accent-a); color: #fff; }
  .non-overlap-viz-container .sw-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .non-overlap-viz-container .sw-play-btn {
    border: 1px solid transparent; background: linear-gradient(135deg, var(--no-accent-a), var(--no-accent-b));
    color: #06171a; font-weight: 700;
  }
  .non-overlap-viz-container .sw-play-btn:hover:not(:disabled) { box-shadow: 0 0 20px rgba(52, 211, 153, 0.45); }
  .non-overlap-viz-container .sw-counter { color: #a6adc8; font-size: 13px; min-width: 110px; text-align: center; font-variant-numeric: tabular-nums; }
  .non-overlap-viz-container .sw-slider-container { display: flex; align-items: center; gap: 8px; }
  .non-overlap-viz-container .sw-slider-container input[type=range] {
    width: 110px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.15);
    outline: none; -webkit-appearance: none;
  }
  .non-overlap-viz-container .sw-slider-container input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--no-accent-a);
    cursor: pointer; box-shadow: 0 0 10px rgba(45, 212, 191, 0.5);
  }
  .non-overlap-viz-container .sw-slider-container span { color: #a6adc8; font-size: 13px; min-width: 40px; font-variant-numeric: tabular-nums; }

  @keyframes pulse-no {
    0%, 100% { box-shadow: 0 0 0 0 rgba(45, 212, 191, 0.5); }
    50% { box-shadow: 0 0 0 8px rgba(45, 212, 191, 0); }
  }
  @keyframes pop-in {
    0% { transform: scale(0.8); opacity: 0; }
    60% { transform: scale(1.06); }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes burst {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); filter: brightness(1.25); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  @media (max-width: 1100px) {
    .non-overlap-viz-container .sw-main { grid-template-columns: 1fr; overflow: auto; }
    .non-overlap-viz-container .sw-code { min-height: 340px; }
    .non-overlap-viz-container .sw-header { flex-direction: column; align-items: flex-start; gap: 10px; }
    .non-overlap-viz-container .sw-tip { max-width: 100%; }
    .non-overlap-viz-container .sw-stats { grid-template-columns: repeat(2, 1fr); }
  }
</style>

<div class="non-overlap-viz-container">
  <div class="sw-page">
    <div class="sw-header">
      <div class="sw-head-left">
        <div class="sw-icon-badge">📐</div>
        <div>
          <h1>无重叠区间（贪心）</h1>
          <p class="sw-desc">LeetCode 435：按终点排序贪心保留，求最少移除区间数</p>
        </div>
      </div>
      <div class="sw-tip"><strong>贪心策略：</strong>按终点升序排序，起点 ≥ 当前终点则保留，否则移除。</div>
    </div>
    <div class="sw-main">
      <div class="sw-left">
        <section class="sw-card">
          <div class="sw-card-title">输入</div>
          <div class="sw-input-row">
            <input type="text" id="non-overlap-input" value="[[1,2],[2,3],[3,4],[1,3]]">
            <button id="non-overlap-start" class="sw-start-btn">开始筛选</button>
          </div>
        </section>
        <div class="sw-stats">
          <div class="sw-stat"><label>保留区间</label><span id="kept-count">0</span></div>
          <div class="sw-stat"><label>移除区间</label><span id="removed-count">0</span></div>
          <div class="sw-stat"><label>当前终点</label><span id="current-end">-</span></div>
          <div class="sw-stat"><label>排序依据</label><span>终点↑</span></div>
        </div>
        <section class="sw-card sw-visual">
          <div class="sw-card-title">区间可视化</div>
          <div id="non-overlap-display" class="sw-track"></div>
          <div class="sw-result-banner" id="non-overlap-status"><span class="badge">💡</span>输入区间数组后点击开始筛选</div>
        </section>
      </div>
      <aside class="sw-code"><div data-code-panel></div></aside>
    </div>
    <div class="sw-controls">
      <button id="non-overlap-reset" class="sw-btn">⏮重置</button>
      <button id="non-overlap-prev" class="sw-btn">◀上一步</button>
      <button id="non-overlap-play" class="sw-btn sw-play-btn">▶播放</button>
      <button id="non-overlap-next" class="sw-btn">下一步▶</button>
      <span id="step-counter" class="sw-counter">步骤: 0 / 0</span>
      <div class="sw-slider-container">
        <input id="non-overlap-speed" type="range" min="200" max="2000" step="100" value="600">
        <span id="non-overlap-speed-label">0.6s</span>
      </div>
    </div>
  </div>
</div>
