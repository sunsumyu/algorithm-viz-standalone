<style>
  /* === 合并区间 · 玻璃感 + 区间轴 + merge 抖动 + append pop-in === */
  #algo-merge-intervals-view {
    --accent-a: #8b5cf6;
    --accent-b: #f97316;
    --accent-glow: rgba(249, 115, 22, .45);
    --current-color: #fb923c;
    --merged-color: #34d399;
    --check-color: #fbbf24;
    width: 100%; height: 100%;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background:
      radial-gradient(ellipse at 5% 5%, rgba(139, 92, 246, .26), transparent 55%),
      radial-gradient(ellipse at 95% 90%, rgba(249, 115, 22, .26), transparent 55%),
      linear-gradient(135deg, #0f0820 0%, #1a0e14 50%, #2a1406 100%);
    overflow: hidden;
  }
  #algo-merge-intervals-view .merge-page {
    width: 100%; height: 100%;
    display: grid; grid-template-rows: auto 1fr; overflow: hidden;
  }
  /* hero */
  #algo-merge-intervals-view .merge-header {
    padding: 18px 24px 12px;
    display: flex; gap: 18px; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, .06);
    background: rgba(8, 8, 24, .35);
    backdrop-filter: blur(14px) saturate(150%);
  }
  #algo-merge-intervals-view .merge-header-left { display: flex; align-items: center; gap: 14px; }
  #algo-merge-intervals-view .merge-icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 800;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; box-shadow: 0 6px 20px var(--accent-glow);
  }
  #algo-merge-intervals-view h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: #f1f5f9; }
  #algo-merge-intervals-view .merge-desc { color: #94a3b8; font-size: 12.5px; margin-top: 4px; }
  #algo-merge-intervals-view .merge-tip {
    max-width: 520px; padding: 10px 14px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(139, 92, 246, .12), rgba(249, 115, 22, .08));
    border: 1px solid rgba(249, 115, 22, .3);
    color: #cbd5e1; font-size: 12.5px; line-height: 1.65;
  }
  #algo-merge-intervals-view .merge-tip strong { color: #fb923c; }
  /* main */
  #algo-merge-intervals-view .merge-main {
    min-height: 0; display: grid;
    grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; padding: 16px; overflow: hidden;
  }
  #algo-merge-intervals-view .merge-left { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
  #algo-merge-intervals-view .merge-card {
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
    overflow: hidden;
  }
  #algo-merge-intervals-view .merge-card-title {
    padding: 10px 16px; border-bottom: 1px solid rgba(255, 255, 255, .06);
    display: flex; justify-content: space-between; align-items: center;
    color: #cbd5e1; font-weight: 700; font-size: 13px;
  }
  #algo-merge-intervals-view .merge-tag {
    font-size: 11px; color: #fb923c; background: rgba(249, 115, 22, .14);
    border: 1px solid rgba(249, 115, 22, .3); padding: 2px 8px; border-radius: 999px;
  }
  /* input */
  #algo-merge-intervals-view .merge-input-row {
    display: grid; grid-template-columns: 1fr auto;
    gap: 10px; align-items: center; padding: 14px 16px;
  }
  #algo-merge-intervals-view input {
    width: 100%; padding: 9px 12px; border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, .12);
    background: rgba(8, 8, 24, .6);
    color: #e2e8f0; font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 13px; outline: none; transition: all .2s;
  }
  #algo-merge-intervals-view input:focus { border-color: var(--accent-b); box-shadow: 0 0 0 3px rgba(249, 115, 22, .15); }
  #algo-merge-intervals-view button {
    padding: 8px 16px; border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 10px; background: rgba(255, 255, 255, .04);
    color: #e2e8f0; cursor: pointer; font-weight: 600; font-size: 13px;
    transition: all .25s cubic-bezier(.4, 0, .2, 1);
  }
  #algo-merge-intervals-view button:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    border-color: transparent; color: #06121f; transform: translateY(-1px);
    box-shadow: 0 6px 18px var(--accent-glow);
  }
  #algo-merge-intervals-view button:disabled { opacity: .4; cursor: not-allowed; }
  #algo-merge-intervals-view .merge-examples { padding: 0 16px 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  #algo-merge-intervals-view .merge-example-btn {
    padding: 5px 12px; border-radius: 999px; font-size: 12px;
    background: rgba(139, 92, 246, .12); border: 1px solid rgba(139, 92, 246, .28);
    color: #c4b5fd; cursor: pointer; transition: all .2s;
  }
  #algo-merge-intervals-view .merge-example-btn:hover {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; border-color: transparent; transform: translateY(-1px);
  }
  /* stats */
  #algo-merge-intervals-view .merge-stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }
  #algo-merge-intervals-view .merge-stat {
    position: relative; padding: 12px 14px 12px 16px;
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 14px; overflow: hidden;
  }
  #algo-merge-intervals-view .merge-stat::before {
    content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 4px; border-radius: 4px;
    background: linear-gradient(180deg, var(--accent-a), var(--accent-b));
  }
  #algo-merge-intervals-view .merge-stat--current::before { background: linear-gradient(180deg, #fb923c, #f97316); }
  #algo-merge-intervals-view .merge-stat--current span { color: #fdba74; }
  #algo-merge-intervals-view .merge-stat--count::before { background: linear-gradient(180deg, #34d399, #10b981); }
  #algo-merge-intervals-view .merge-stat--count span { color: #6ee7b7; }
  #algo-merge-intervals-view .merge-stat--status::before { background: linear-gradient(180deg, #fbbf24, #f59e0b); }
  #algo-merge-intervals-view .merge-stat--status span { color: #fde68a; }
  #algo-merge-intervals-view .merge-stat label { color: #94a3b8; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; display: block; margin-bottom: 4px; }
  #algo-merge-intervals-view .merge-stat span {
    color: #e2e8f0; font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 22px; font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  /* lanes */
  #algo-merge-intervals-view .merge-visual { flex: 1; min-height: 260px; display: flex; flex-direction: column; }
  #algo-merge-intervals-view .merge-lanes {
    flex: 1; min-height: 0; padding: 16px;
    overflow: auto; display: flex; flex-direction: column; gap: 18px;
  }
  #algo-merge-intervals-view .merge-lane-title {
    margin-bottom: 8px; color: #94a3b8;
    font-size: 12px; font-weight: 700; letter-spacing: .03em;
  }
  #algo-merge-intervals-view .merge-axis {
    position: relative; min-width: 720px; height: 112px;
    padding: 12px 16px; border-radius: 14px;
    background: rgba(8, 8, 24, .55);
    border: 1px solid rgba(255, 255, 255, .08);
  }
  #algo-merge-intervals-view .merge-axis-line {
    position: absolute; left: 18px; right: 18px; top: 58px; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(148, 163, 184, .4), transparent);
  }
  #algo-merge-intervals-view .merge-segment {
    position: absolute; height: 24px; border-radius: 999px;
    background: linear-gradient(180deg, rgba(139, 92, 246, .35), rgba(139, 92, 246, .12));
    border: 2px solid rgba(139, 92, 246, .5);
    color: #e0e7ff;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-family: 'JetBrains Mono', Consolas, monospace;
    font-weight: 600;
    transition: all .4s cubic-bezier(.4, 0, .2, 1);
    box-shadow: 0 2px 8px rgba(139, 92, 246, .2);
  }
  #algo-merge-intervals-view .merge-segment.current {
    background: linear-gradient(180deg, rgba(251, 191, 36, .5), rgba(245, 158, 11, .2));
    border-color: rgba(251, 191, 36, .7);
    color: #fef3c7;
    box-shadow: 0 0 0 3px rgba(251, 191, 36, .25), 0 6px 18px rgba(251, 191, 36, .35);
    transform: translateY(-6px);
    animation: merge-seg-pulse 1.2s ease-in-out infinite;
  }
  @keyframes merge-seg-pulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(251, 191, 36, .25), 0 6px 18px rgba(251, 191, 36, .35); }
    50% { box-shadow: 0 0 0 6px rgba(251, 191, 36, .15), 0 8px 22px rgba(251, 191, 36, .5); }
  }
  #algo-merge-intervals-view .merge-segment.merged {
    background: linear-gradient(180deg, rgba(52, 211, 153, .45), rgba(16, 185, 129, .12));
    border-color: rgba(52, 211, 153, .6);
    color: #d1fae5;
    box-shadow: 0 0 0 2px rgba(52, 211, 153, .2), 0 4px 12px rgba(52, 211, 153, .3);
    animation: merge-seg-pop .5s cubic-bezier(.34, 1.56, .64, 1);
  }
  @keyframes merge-seg-pop {
    0% { transform: scale(.5); opacity: 0; }
    60% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  #algo-merge-intervals-view .merge-segment.merged.current {
    background: linear-gradient(180deg, rgba(251, 191, 36, .5), rgba(245, 158, 11, .2));
    border-color: rgba(251, 191, 36, .7);
    color: #fef3c7;
    transform: translateY(-6px);
    animation: merge-seg-pulse 1.2s ease-in-out infinite;
  }
  #algo-merge-intervals-view .merge-segment.merge-seg--appended {
    animation: merge-seg-pop .5s cubic-bezier(.34, 1.56, .64, 1);
  }
  #algo-merge-intervals-view .merge-segment.merge-seg--merged {
    animation: merge-seg-merge-shake .55s ease-in-out;
  }
  @keyframes merge-seg-merge-shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-4px) rotate(-1deg); }
    40% { transform: translateX(4px) rotate(1deg); }
    60% { transform: translateX(-3px) rotate(-0.5deg); }
    80% { transform: translateX(3px) rotate(0.5deg); }
  }
  /* result banner */
  #algo-merge-intervals-view .merge-message {
    margin: 0 16px 16px; padding: 14px 18px; border-radius: 12px;
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(135deg, rgba(139, 92, 246, .12), rgba(249, 115, 22, .06));
    border: 1px solid rgba(249, 115, 22, .28);
    line-height: 1.55; font-size: 14px; color: #fdba74;
  }
  #algo-merge-intervals-view .merge-message .merge-emoji {
    width: 32px; height: 32px; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 18px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; box-shadow: 0 4px 12px var(--accent-glow);
    flex-shrink: 0;
  }
  #algo-merge-intervals-view .merge-message.merge-result--done {
    background: linear-gradient(135deg, rgba(52, 211, 153, .18), rgba(16, 185, 129, .08));
    border-color: rgba(52, 211, 153, .4); color: #d1fae5;
  }
  #algo-merge-intervals-view .merge-message.merge-result--done .merge-emoji {
    background: linear-gradient(135deg, #34d399, #10b981);
    box-shadow: 0 4px 12px rgba(52, 211, 153, .5);
  }
  #algo-merge-intervals-view .merge-message.merge-result--merge {
    background: linear-gradient(135deg, rgba(251, 191, 36, .18), rgba(245, 158, 11, .08));
    border-color: rgba(251, 191, 36, .4); color: #fde68a;
  }
  #algo-merge-intervals-view .merge-message.merge-result--merge .merge-emoji {
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    box-shadow: 0 4px 12px rgba(251, 191, 36, .5);
    color: #140211;
  }
  /* log */
  #algo-merge-intervals-view .merge-log {
    min-height: 80px; max-height: 130px; padding: 10px 14px;
    overflow: auto; background: rgba(8, 8, 24, .55);
    font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px;
    line-height: 1.65; color: #94a3b8;
  }
  #algo-merge-intervals-view .merge-log-line { display: flex; gap: 8px; }
  #algo-merge-intervals-view .merge-log-line .merge-log-num { color: #475569; flex-shrink: 0; }
  #algo-merge-intervals-view .merge-log-line.active { color: #fb923c; font-weight: 600; }
  #algo-merge-intervals-view .merge-log-line.active .merge-log-num { color: var(--accent-b); }
  /* code */
  #algo-merge-intervals-view .merge-code {
    min-height: 0; display: flex;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; overflow: hidden;
  }
  #algo-merge-intervals-view .merge-code [data-code-panel] { flex: 1; min-width: 0; }
  /* controls */
  #algo-merge-intervals-view .merge-controls {
    padding: 14px 18px;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border-top: 1px solid rgba(255, 255, 255, .06);
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  #algo-merge-intervals-view .merge-control-btn { min-width: 64px; }
  #algo-merge-intervals-view .merge-ctrl-primary {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; border-color: transparent;
  }
  #algo-merge-intervals-view .merge-counter {
    color: #94a3b8; font-size: 13px; font-weight: 600;
    min-width: 110px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #algo-merge-intervals-view .merge-speed-wrap {
    display: flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 12px;
  }
  #algo-merge-intervals-view #merge-speed { width: 130px; accent-color: var(--accent-b); }
  @media (max-width: 1100px) {
    #algo-merge-intervals-view .merge-main { grid-template-columns: 1fr; overflow: auto; }
    #algo-merge-intervals-view .merge-code { min-height: 360px; }
  }
</style>

<div class="merge-page">
  <div class="merge-header">
    <div class="merge-header-left">
      <span class="merge-icon">🧩</span>
      <div>
        <h1>合并区间（排序 + 贪心）</h1>
        <div class="merge-desc">LeetCode 56 · 合并所有重叠区间</div>
      </div>
    </div>
    <div class="merge-tip"><strong>核心动画：</strong>排序后区间从左到右扫描；<span style="color:#fde68a">当前区间</span>黄色脉冲上浮；<span style="color:#fde68a">重叠时</span>结果末尾 shake 抖动；<span style="color:#6ee7b7">新区间追加</span>绿色 pop-in 弹入。</div>
  </div>

  <div class="merge-main">
    <div class="merge-left">
      <section class="merge-card">
        <div class="merge-card-title">输入区间 <span class="merge-tag">[[s,e]...]</span></div>
        <div class="merge-input-row">
          <input id="merge-intervals-input" value="[1,3],[2,6],[8,10],[15,18]" placeholder="例如: [1,3],[2,6],[8,10]">
          <button id="merge-start">开始合并</button>
        </div>
        <div class="merge-examples">
          <button class="merge-example-btn" data-value="[1,3],[2,6],[8,10],[15,18]">基础重叠</button>
          <button class="merge-example-btn" data-value="[1,4],[4,5]">端点相接</button>
          <button class="merge-example-btn" data-value="[1,4],[0,2],[3,5],[7,9]">乱序输入</button>
          <button class="merge-example-btn" data-value="[1,4],[2,3]">完全包含</button>
          <button class="merge-example-btn" data-value="[1,2],[3,4],[5,6]">互不重叠</button>
        </div>
      </section>

      <div class="merge-stats">
        <div class="merge-stat merge-stat--current"><label>当前区间</label><span id="merge-current">-</span></div>
        <div class="merge-stat merge-stat--count"><label>结果数量</label><span id="merge-count">0</span></div>
        <div class="merge-stat merge-stat--status"><label>状态</label><span id="merge-status">就绪</span></div>
        <div class="merge-stat"><label>步骤</label><span id="merge-counter" style="font-size:16px;">0/0</span></div>
      </div>

      <section class="merge-card merge-visual">
        <div class="merge-card-title">区间轴可视化 <span class="merge-tag">排序后扫描</span></div>
        <div class="merge-lanes" id="merge-lanes"></div>
        <div class="merge-message" id="merge-message">
          <span class="merge-emoji">🧩</span>
          <div>点击开始合并过程</div>
        </div>
      </section>

      <section class="merge-card">
        <div class="merge-card-title">执行日志 <button id="merge-log-clear" style="padding:4px 10px;font-size:11px;border-radius:999px;">清空</button></div>
        <div class="merge-log" id="merge-log"></div>
      </section>
    </div>

    <aside class="merge-code">
      <div data-code-panel></div>
    </aside>
  </div>

  <div class="merge-controls">
    <button id="merge-reset" class="merge-control-btn">⏮ 重置</button>
    <button id="merge-prev" class="merge-control-btn">◀ 上一步</button>
    <button id="merge-play" class="merge-control-btn merge-ctrl-primary">▶ 播放</button>
    <button id="merge-next" class="merge-control-btn">下一步 ▶</button>
    <span id="merge-speed-label" class="merge-counter">0.9s</span>
    <input id="merge-speed" type="range" min="200" max="2500" step="100" value="900">
  </div>
</div>
