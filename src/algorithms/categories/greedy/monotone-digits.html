            <div class="md-card-desc">逆序相邻位比较、置9起始标记位与最终单调递增数字看板</div>
          </div>
          <span id="badge-flag-pos" class="md-counter-badge" style="color:#c026d3; background:#fdf4ff; border-color:#f5d0fe;">置9起始: -</span>
        </div>

        <!-- 状态空间展示盒 -->
        <div class="md-state-space-box">
          <div class="md-state-columns">
            <!-- 比较位状态 -->
            <div class="md-subcard">
              <div class="md-subcard-title">🔢 逆序比较位 (Digits Pair)</div>
              <div id="md-pair-container" style="flex: 1; min-height: 0; overflow-y: auto;"></div>
            </div>
            <!-- 借位决策监视器 -->
            <div class="md-subcard">
              <div class="md-subcard-title">⚖️ 借位与置9决策监视器 (Borrow Decision)</div>
              <div id="md-decision-monitor-container" style="flex: 1; min-height: 0; overflow-y: auto;"></div>
            </div>
          </div>
          <!-- 统计与进度 -->
          <div class="md-subcard" style="flex-shrink: 0;">
            <div class="md-subcard-title">🏆 最终最大单调递增数字 (Result Number)</div>
            <div id="md-metrics-container"></div>
          </div>
        </div>
      </div>

    </section>

    <!-- ================= 右侧：代码终端 + 执行日志 ================= -->
    <section class="md-right-section">

      <!-- 卡片 3: 暗色代码终端面板 -->
      <div class="md-dark-terminal">
        <div class="md-terminal-header">
          <!-- 1. 主 Tab 切换器 (源码 / 题目 / 精讲) -->
          <div class="md-tab-group">
            <button id="btn-tab-code" class="md-tab-item active">💻 代码调试</button>
            <button id="btn-tab-problem" class="md-tab-item">📋 题目描述</button>
            <button id="btn-tab-analysis" class="md-tab-item">💡 贪心精讲</button>
          </div>

          <!-- 2. 多语言切换器 -->
          <div class="md-lang-group" id="code-lang-tabs">
            <button class="md-lang-btn active" data-lang="java">Java</button>
            <button class="md-lang-btn" data-lang="cpp">C++</button>
            <button class="md-lang-btn" data-lang="python">Python</button>
            <button class="md-lang-btn" data-lang="javascript">JS</button>
          </div>

          <!-- 3. 字号缩放器与 macOS 窗口微控制 -->
          <div class="md-font-tools">
            <div class="md-font-scaler">
              <button id="btn-code-font-dec" title="缩小代码字号">A-</button>
              <span id="code-font-indicator" class="md-font-indicator">12</span>
              <button id="btn-code-font-inc" title="放大代码字号">A+</button>
            </div>

            <div class="md-window-dots">
              <span class="md-dot" style="background:#ef4444;"></span>
              <span class="md-dot" style="background:#eab308;"></span>
              <span class="md-dot" style="background:#22c55e;"></span>
            </div>
          </div>
        </div>

        <!-- 容器 1: 源码高亮与单步追踪视图 -->
        <div id="code-view-container" style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;">
          <div class="md-terminal-body">
            <div id="code-lines-wrapper">
              <!-- 动态装载代码行 -->
            </div>
          </div>
        </div>

        <!-- 容器 2: 题目完整描述视图 -->
        <div id="problem-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载题目内容 -->
        </div>

        <!-- 容器 3: 贪心精讲视图 -->
        <div id="analysis-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载贪心精讲内容 -->
        </div>
      </div>

      <!-- 卡片 4: 独立执行日志卡片 -->
      <div class="md-log-card">
        <div class="md-log-header">
          <div class="md-log-header-title">
            <span>📜 执行日志</span>
          </div>
          <span id="log-count" class="md-log-count">0 条记录</span>
        </div>

        <div id="log-container" class="md-log-body">
          <!-- 动态填充日志条目 -->
        </div>
      </div>

    </section>

  </main>

  <!-- 4. 力扣原题描述轻量模态弹窗 (Modal) -->
  <div id="modal-problem" class="md-modal-backdrop hidden">
    <div class="md-modal-content">
      <div class="md-modal-header">
        <div class="md-modal-title">
          <span>📋 力扣原题描述</span>
        </div>
        <button id="btn-close-problem-modal" class="md-modal-close" title="关闭 (Esc)">✕</button>
      </div>
      <div id="modal-problem-body" class="md-modal-body">
        <!-- 动态装载题目内容 -->
      </div>
    </div>
  </div>
</div>
