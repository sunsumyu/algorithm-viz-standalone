          <span id="badge-total-profit" class="st-counter-badge" style="color:#059669; background:#ecfdf5; border-color:#a7f3d0;">总利润: 0</span>
        </div>

        <!-- 状态空间展示盒 -->
        <div class="st-state-space-box">
          <div class="st-state-columns">
            <!-- 差值与买卖状态 -->
            <div class="st-subcard">
              <div class="st-subcard-title">💵 当日差值与交易行为 (Daily Diff & Trade)</div>
              <div id="st-diff-container" style="flex: 1; min-height: 0; overflow-y: auto;"></div>
            </div>
            <!-- 贪心判定监视器 -->
            <div class="st-subcard">
              <div class="st-subcard-title">⚖️ 贪心交易判定监视器 (Greedy Decision)</div>
              <div id="st-decision-monitor-container" style="flex: 1; min-height: 0; overflow-y: auto;"></div>
            </div>
          </div>
          <!-- 统计与进度 -->
          <div class="st-subcard" style="flex-shrink: 0;">
            <div class="st-subcard-title">🏆 累计交易与总收益看板 (Trade Metrics)</div>
            <div id="st-metrics-container"></div>
          </div>
        </div>
      </div>

    </section>

    <!-- ================= 右侧：代码终端 + 执行日志 ================= -->
    <section class="st-right-section">

      <!-- 卡片 3: 暗色代码终端面板 -->
      <div class="st-dark-terminal">
        <div class="st-terminal-header">
          <!-- 1. 主 Tab 切换器 (源码 / 题目 / 精讲) -->
          <div class="st-tab-group">
            <button id="btn-tab-code" class="st-tab-item active">💻 代码调试</button>
            <button id="btn-tab-problem" class="st-tab-item">📋 题目描述</button>
            <button id="btn-tab-analysis" class="st-tab-item">💡 贪心精讲</button>
          </div>

          <!-- 2. 多语言切换器 -->
          <div class="st-lang-group" id="code-lang-tabs">
            <button class="st-lang-btn active" data-lang="java">Java</button>
            <button class="st-lang-btn" data-lang="cpp">C++</button>
            <button class="st-lang-btn" data-lang="python">Python</button>
            <button class="st-lang-btn" data-lang="javascript">JS</button>
          </div>

          <!-- 3. 字号缩放器与 macOS 窗口微控制 -->
          <div class="st-font-tools">
            <div class="st-font-scaler">
              <button id="btn-code-font-dec" title="缩小代码字号">A-</button>
              <span id="code-font-indicator" class="st-font-indicator">12</span>
              <button id="btn-code-font-inc" title="放大代码字号">A+</button>
            </div>

            <div class="st-window-dots">
              <span class="st-dot" style="background:#ef4444;"></span>
              <span class="st-dot" style="background:#eab308;"></span>
              <span class="st-dot" style="background:#22c55e;"></span>
            </div>
          </div>
        </div>

        <!-- 容器 1: 源码高亮与单步追踪视图 -->
        <div id="code-view-container" style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;">
          <div class="st-terminal-body">
            <div id="code-lines-wrapper">
              <!-- 动态装载代码行 -->
            </div>
          </div>
        </div>

        <!-- 容器 2: 题目完整描述视图 -->
        <div id="problem-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载题目内容 -->
        </div>

        <!-- 容器 3: 贪心精讲视图 -->
        <div id="analysis-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载贪心精讲内容 -->
        </div>
      </div>

      <!-- 卡片 4: 独立执行日志卡片 -->
      <div class="st-log-card">
        <div class="st-log-header">
          <div class="st-log-header-title">
            <span>📜 执行日志</span>
          </div>
          <span id="log-count" class="st-log-count">0 条记录</span>
        </div>

        <div id="log-container" class="st-log-body">
          <!-- 动态填充日志条目 -->
        </div>
      </div>

    </section>

  </main>

  <!-- 4. 力扣原题描述轻量模态弹窗 (Modal) -->
  <div id="modal-problem" class="st-modal-backdrop hidden">
    <div class="st-modal-content">
      <div class="st-modal-header">
        <div class="st-modal-title">
          <span>📋 力扣原题描述</span>
        </div>
        <button id="btn-close-problem-modal" class="st-modal-close" title="关闭 (Esc)">✕</button>
      </div>
      <div id="modal-problem-body" class="st-modal-body">
        <!-- 动态装载题目内容 -->
      </div>
    </div>
  </div>
</div>
