<style>
  /* === 买卖股票最佳时机 II · 玻璃感 + 价格折线 + 买卖闪烁 === */
  #algo-best-time-stock-view {
    --accent-a: #10b981;
    --accent-b: #f59e0b;
    --accent-glow: rgba(245, 158, 11, .45);
    --up-color: #34d399;
    --down-color: #f87171;
    --buy-color: #60a5fa;
    --sell-color: #fbbf24;
    width: 100%; height: 100%;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background:
      radial-gradient(ellipse at 5% 5%, rgba(16, 185, 129, .26), transparent 55%),
      radial-gradient(ellipse at 95% 90%, rgba(245, 158, 11, .26), transparent 55%),
      linear-gradient(135deg, #08160f 0%, #14110a 50%, #1a1206 100%);
    overflow: hidden;
  }
  #algo-best-time-stock-view .stock-shell {
    width: 100%; height: 100%;
    display: grid; grid-template-rows: auto 1fr; overflow: hidden;
  }
  #algo-best-time-stock-view .stock-hero {
    padding: 18px 24px 12px;
    display: flex; gap: 18px; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, .06);
    background: rgba(8, 8, 24, .35);
    backdrop-filter: blur(14px) saturate(150%);
  }
  #algo-best-time-stock-view .stock-hero-left { display: flex; align-items: center; gap: 14px; }
  #algo-best-time-stock-view .stock-icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 800;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; box-shadow: 0 6px 20px var(--accent-glow);
  }
  #algo-best-time-stock-view h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: #f1f5f9; }
  #algo-best-time-stock-view .stock-sub { color: #94a3b8; font-size: 12.5px; margin-top: 4px; }
  #algo-best-time-stock-view .stock-tip {
    max-width: 520px; padding: 10px 14px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(16, 185, 129, .12), rgba(245, 158, 11, .08));
    border: 1px solid rgba(245, 158, 11, .3);
    color: #cbd5e1; font-size: 12.5px; line-height: 1.65;
  }
  #algo-best-time-stock-view .stock-tip strong { color: #fbbf24; }
  /* main */
  #algo-best-time-stock-view .stock-main {
    min-height: 0; display: grid;
    grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; padding: 16px; overflow: hidden;
  }
  #algo-best-time-stock-view .stock-left { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
  #algo-best-time-stock-view .stock-card {
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
    overflow: hidden;
  }
  #algo-best-time-stock-view .stock-card-title {
    padding: 10px 16px; border-bottom: 1px solid rgba(255, 255, 255, .06);
    display: flex; justify-content: space-between; align-items: center;
    color: #cbd5e1; font-weight: 700; font-size: 13px;
  }
  #algo-best-time-stock-view .stock-tag {
    font-size: 11px; color: #fbbf24; background: rgba(245, 158, 11, .14);
    border: 1px solid rgba(245, 158, 11, .3); padding: 2px 8px; border-radius: 999px;
  }
  /* input */
  #algo-best-time-stock-view .stock-input-row {
    display: grid; grid-template-columns: 1fr auto;
    gap: 10px; align-items: center; padding: 14px 16px;
  }
  #algo-best-time-stock-view input {
    width: 100%; padding: 9px 12px; border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, .12);
    background: rgba(8, 8, 24, .6);
    color: #e2e8f0; font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 13px; outline: none; transition: all .2s;
  }
  #algo-best-time-stock-view input:focus { border-color: var(--accent-b); box-shadow: 0 0 0 3px rgba(245, 158, 11, .15); }
  #algo-best-time-stock-view button {
    padding: 8px 16px; border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 10px; background: rgba(255, 255, 255, .04);
    color: #e2e8f0; cursor: pointer; font-weight: 600; font-size: 13px;
    transition: all .25s cubic-bezier(.4, 0, .2, 1);
  }
  #algo-best-time-stock-view button:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    border-color: transparent; color: #06121f; transform: translateY(-1px);
    box-shadow: 0 6px 18px var(--accent-glow);
  }
  #algo-best-time-stock-view button:disabled { opacity: .4; cursor: not-allowed; }
  #algo-best-time-stock-view .stock-examples { padding: 0 16px 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  #algo-best-time-stock-view .stock-chip {
    padding: 5px 12px; border-radius: 999px; font-size: 12px;
    background: rgba(16, 185, 129, .12); border: 1px solid rgba(16, 185, 129, .28);
    color: #6ee7b7; cursor: pointer; transition: all .2s;
  }
  #algo-best-time-stock-view .stock-chip:hover {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; border-color: transparent; transform: translateY(-1px);
  }
  /* stats */
  #algo-best-time-stock-view .stock-stats {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
  }
  #algo-best-time-stock-view .stock-stat {
    position: relative; padding: 12px 14px 12px 16px;
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 14px; overflow: hidden;
  }
  #algo-best-time-stock-view .stock-stat::before {
    content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 4px; border-radius: 4px;
    background: linear-gradient(180deg, var(--accent-a), var(--accent-b));
  }
  #algo-best-time-stock-view .stock-stat--day::before { background: linear-gradient(180deg, #fbbf24, #f59e0b); }
  #algo-best-time-stock-view .stock-stat--day .stock-stat-val { color: #fde68a; }
  #algo-best-time-stock-view .stock-stat--profit::before { background: linear-gradient(180deg, #34d399, #10b981); }
  #algo-best-time-stock-view .stock-stat--profit .stock-stat-val { color: #6ee7b7; }
  #algo-best-time-stock-view .stock-stat--tx::before { background: linear-gradient(180deg, #60a5fa, #3b82f6); }
  #algo-best-time-stock-view .stock-stat--tx .stock-stat-val { color: #93c5fd; }
  #algo-best-time-stock-view .stock-stat-label { color: #94a3b8; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  #algo-best-time-stock-view .stock-stat-val {
    color: #e2e8f0; font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 22px; font-weight: 800; margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  /* chart canvas */
  #algo-best-time-stock-view .stock-chart-card { flex: 1; min-height: 280px; display: flex; flex-direction: column; }
  #algo-best-time-stock-view .stock-canvas {
    flex: 1; min-height: 220px; padding: 12px 16px 16px;
    position: relative; overflow: hidden;
  }
  #algo-best-time-stock-view .stock-canvas svg {
    width: 100%; height: 100%; display: block;
  }
  #algo-best-time-stock-view .stock-grid line { stroke: rgba(255, 255, 255, .05); stroke-width: 1; }
  #algo-best-time-stock-view .stock-axis-label { fill: #64748b; font-size: 10px; font-family: 'JetBrains Mono', monospace; }
  #algo-best-time-stock-view .stock-line {
    fill: none; stroke: url(#stockGrad); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round;
  }
  #algo-best-time-stock-view .stock-area { fill: url(#stockAreaGrad); opacity: .35; }
  #algo-best-time-stock-view .stock-pt { transition: all .35s cubic-bezier(.4, 0, .2, 1); }
  #algo-best-time-stock-view .stock-pt--current {
    animation: stock-pt-pulse 1.2s ease-in-out infinite;
  }
  @keyframes stock-pt-pulse {
    0%, 100% { r: 6; }
    50% { r: 9; }
  }
  #algo-best-time-stock-view .stock-pt--buy { fill: var(--buy-color); animation: stock-bt-bounce .55s cubic-bezier(.34, 1.56, .64, 1); }
  #algo-best-time-stock-view .stock-pt--sell { fill: var(--sell-color); animation: stock-bt-bounce .55s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes stock-bt-bounce {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.4); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  #algo-best-time-stock-view .stock-link {
    stroke: var(--sell-color); stroke-width: 2; stroke-dasharray: 4 3;
    animation: stock-link-draw .55s ease-out forwards;
  }
  @keyframes stock-link-draw {
    from { stroke-dashoffset: 200; opacity: 0; }
    to { stroke-dashoffset: 0; opacity: 1; }
  }
  #algo-best-time-stock-view .stock-pt-label {
    fill: #f1f5f9; font-size: 11px; font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    text-anchor: middle;
  }
  /* result */
  #algo-best-time-stock-view .stock-result {
    margin: 0 16px 16px; padding: 14px 18px; border-radius: 12px;
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(135deg, rgba(16, 185, 129, .12), rgba(245, 158, 11, .06));
    border: 1px solid rgba(245, 158, 11, .28);
    line-height: 1.55; font-size: 14px; color: #fde68a;
  }
  #algo-best-time-stock-view .stock-result .stock-emoji {
    width: 36px; height: 36px; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 20px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; box-shadow: 0 4px 14px var(--accent-glow);
  }
  #algo-best-time-stock-view .stock-result.stock-result--done {
    background: linear-gradient(135deg, rgba(52, 211, 153, .18), rgba(16, 185, 129, .08));
    border-color: rgba(52, 211, 153, .4); color: #d1fae5;
  }
  #algo-best-time-stock-view .stock-result.stock-result--done .stock-emoji {
    background: linear-gradient(135deg, #34d399, #10b981);
    box-shadow: 0 4px 14px rgba(52, 211, 153, .55);
  }
  /* log */
  #algo-best-time-stock-view .stock-log {
    min-height: 80px; max-height: 130px; padding: 10px 14px;
    overflow: auto; background: rgba(8, 8, 24, .55);
    font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px;
    line-height: 1.65; color: #94a3b8;
  }
  #algo-best-time-stock-view .stock-log-line { display: flex; gap: 8px; }
  #algo-best-time-stock-view .stock-log-line .stock-log-num { color: #475569; flex-shrink: 0; }
  #algo-best-time-stock-view .stock-log-line.stock-log-active { color: #fbbf24; font-weight: 600; }
  #algo-best-time-stock-view .stock-log-line.stock-log-active .stock-log-num { color: var(--accent-b); }
  /* code */
  #algo-best-time-stock-view .stock-code {
    min-height: 0; display: flex;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; overflow: hidden;
  }
  #algo-best-time-stock-view .stock-code [data-code-panel] { flex: 1; min-width: 0; }
  /* controls */
  #algo-best-time-stock-view .stock-controls {
    padding: 14px 18px;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border-top: 1px solid rgba(255, 255, 255, .06);
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  #algo-best-time-stock-view .stock-controls .stock-ctrl-btn { min-width: 64px; }
  #algo-best-time-stock-view .stock-controls .stock-ctrl-primary {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; border-color: transparent;
  }
  #algo-best-time-stock-view .stock-counter {
    color: #94a3b8; font-size: 13px; font-weight: 600;
    min-width: 110px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #algo-best-time-stock-view .stock-speed-wrap {
    display: flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 12px;
  }
  #algo-best-time-stock-view #stock-speed { width: 130px; accent-color: var(--accent-b); }
  @media (max-width: 1100px) {
    #algo-best-time-stock-view .stock-main { grid-template-columns: 1fr; overflow: auto; }
    #algo-best-time-stock-view .stock-code { min-height: 360px; }
  }
</style>

<div class="stock-shell">
  <div class="stock-hero">
    <div class="stock-hero-left">
      <span class="stock-icon">📈</span>
      <div>
        <h1>买卖股票的最佳时机 II（贪心）</h1>
        <div class="stock-sub">LeetCode 122 · 收集所有上涨日的收益</div>
      </div>
    </div>
    <div class="stock-tip"><strong>核心动画：</strong>价格折线<span style="color:#6ee7b7">渐变绘制</span>，<span style="color:#93c5fd">买入点</span>蓝色弹入、<span style="color:#fbbf24">卖出点</span>金色弹入，两节点之间用虚线连接并 <code>stroke-dashoffset</code> 流动。</div>
  </div>
  <div class="stock-main">
    <div class="stock-left">
      <section class="stock-card">
        <div class="stock-card-title">输入 <span class="stock-tag">prices = [7,1,5,...]</span></div>
        <div class="stock-input-row">
          <input id="stock-input" value="7,1,5,3,6,4">
          <button id="stock-start">开始交易</button>
        </div>
        <div class="stock-examples">
          <button class="stock-chip" data-val="7,1,5,3,6,4">经典示例</button>
          <button class="stock-chip" data-val="1,2,3,4,5">单调上升</button>
          <button class="stock-chip" data-val="5,4,3,2,1">单调下降</button>
          <button class="stock-chip" data-val="3,3,3,3">价格持平</button>
          <button class="stock-chip" data-val="1,5,2,8,3,9">震荡</button>
        </div>
      </section>

      <div class="stock-stats">
        <div class="stock-stat stock-stat--day"><div class="stock-stat-label">当前日</div><div class="stock-stat-val" id="stock-stat-day" style="font-size:18px;">-</div></div>
        <div class="stock-stat"><div class="stock-stat-label">今日价</div><div class="stock-stat-val" id="stock-stat-price">-</div></div>
        <div class="stock-stat stock-stat--profit"><div class="stock-stat-label">累计利润</div><div class="stock-stat-val" id="stock-stat-profit">0</div></div>
        <div class="stock-stat stock-stat--tx"><div class="stock-stat-label">交易次数</div><div class="stock-stat-val" id="stock-stat-tx">0</div></div>
        <div class="stock-stat"><div class="stock-stat-label">状态</div><div class="stock-stat-val" id="stock-stat-status" style="font-size:14px;">-</div></div>
      </div>

      <section class="stock-card stock-chart-card">
        <div class="stock-card-title">价格走势与买卖点 <span class="stock-tag">SVG 折线图</span></div>
        <div class="stock-canvas">
          <svg id="stock-svg" preserveAspectRatio="none"></svg>
        </div>
        <div class="stock-result" id="stock-result">
          <span class="stock-emoji">📈</span>
          <div id="step-message">点击「开始交易」观察折线绘制 + 买卖点弹入动画</div>
        </div>
      </section>

      <section class="stock-card">
        <div class="stock-card-title">执行日志 <button id="stock-log-clear" style="padding:4px 10px;font-size:11px;border-radius:999px;">清空</button></div>
        <div class="stock-log" id="stock-log"></div>
      </section>
    </div>
    <aside class="stock-code"><div data-code-panel></div></aside>
  </div>
  <div class="stock-controls">
    <button id="step-reset" class="stock-ctrl-btn">⏮ 重置</button>
    <button id="step-prev" class="stock-ctrl-btn">◀ 上一步</button>
    <button id="step-play" class="stock-ctrl-btn stock-ctrl-primary">▶ 播放</button>
    <button id="step-next" class="stock-ctrl-btn">下一步 ▶</button>
    <span id="step-counter" class="stock-counter">步骤: 0 / 0</span>
    <div class="stock-speed-wrap">
      <span>速度</span>
      <input id="stock-speed" type="range" min="200" max="2500" step="100" value="900">
      <span id="stock-speed-label" style="min-width:42px;">0.9s</span>
    </div>
  </div>
</div>
