<style>
  :root {
    --cj-accent-a: #34d399;
    --cj-accent-b: #3b82f6;
    --cj-accent-a-rgb: 52, 211, 153;
    --cj-accent-b-rgb: 59, 130, 246;
  }
  .canjump-viz-container {
    width: 100%; height: 100%; color: #cdd6f4;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:
      radial-gradient(ellipse at 8% 6%, rgba(52, 211, 153, 0.55), transparent 55%),
      radial-gradient(ellipse at 92% 94%, rgba(59, 130, 246, 0.55), transparent 55%),
      linear-gradient(135deg, #0f172a, #111827, #0b1220);
    display: flex; flex-direction: column; overflow: hidden;
    box-sizing: border-box;
  }
  .canjump-viz-container .sw-page { height: 100%; display: flex; flex-direction: column; overflow: hidden; }
  .canjump-viz-container .sw-header {
    padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; gap: 18px;
  }
  .canjump-viz-container .sw-head-left { display: flex; align-items: center; gap: 14px; }
  .canjump-viz-container .sw-icon-badge {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, var(--cj-accent-a), var(--cj-accent-b));
    display: flex; align-items: center; justify-content: center; font-size: 22px;
    box-shadow: 0 8px 24px rgba(59, 130, 246, 0.35);
  }
  .canjump-viz-container h1 { margin: 0; font-size: 22px; font-weight: 800; color: #fff; }
  .canjump-viz-container .sw-desc { margin: 4px 0 0; color: #a6adc8; font-size: 13px; line-height: 1.4; }
  .canjump-viz-container .sw-legend { display: flex; gap: 14px; font-size: 12px; color: #a6adc8; flex-wrap: wrap; }
  .canjump-viz-container .sw-legend-item { display: flex; align-items: center; gap: 6px; }
  .canjump-viz-container .sw-legend-dot { width: 9px; height: 9px; border-radius: 3px; }
  .canjump-viz-container .sw-main {
    flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 420px;
    gap: 16px; padding: 0 16px 16px; overflow: hidden;
  }
  .canjump-viz-container .sw-left { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
  .canjump-viz-container .sw-card {
    background: rgba(20, 18, 38, 0.55); backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; overflow: hidden;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }
  .canjump-viz-container .sw-card-title {
    padding: 13px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: flex; justify-content: space-between; color: #fff; font-weight: 700; font-size: 14px;
  }
  .canjump-viz-container .sw-input-row {
    display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 14px 16px;
  }
  .canjump-viz-container input[type="text"] {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(20, 18, 38, 0.6); color: #cdd6f4; font-family: Consolas, monospace; outline: none; font-size: 13px;
  }
  .canjump-viz-container input[type="text"]:focus {
    border-color: var(--cj-accent-a); box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.2);
  }
  .canjump-viz-container .sw-start-btn {
    padding: 10px 18px; border-radius: 10px; border: 1px solid transparent;
    background: linear-gradient(135deg, var(--cj-accent-a), var(--cj-accent-b)); color: #fff;
    font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 14px;
  }
  .canjump-viz-container .sw-start-btn:hover { box-shadow: 0 0 20px rgba(59, 130, 246, 0.45); }
  .canjump-viz-container .sw-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .canjump-viz-container .sw-stat {
    padding: 14px; background: rgba(20, 18, 38, 0.4); border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.06); position: relative; overflow: hidden;
  }
  .canjump-viz-container .sw-stat::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: linear-gradient(180deg, var(--cj-accent-a), var(--cj-accent-b));
  }
  .canjump-viz-container .sw-stat label { display: block; margin-bottom: 6px; color: #a6adc8; font-size: 12px; }
  .canjump-viz-container .sw-stat span {
    color: var(--cj-accent-a); font-family: Consolas, monospace; font-size: 21px; font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .canjump-viz-container .sw-visual { flex: 1; min-height: 200px; display: flex; flex-direction: column; }
  .canjump-viz-container .sw-track {
    flex: 1; min-height: 0; padding: 28px 18px 22px; overflow: auto;
    display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;
  }
  .canjump-viz-container .jump-cell {
    width: 74px; height: 74px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(20, 18, 38, 0.5); position: relative;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s, background 0.3s, border-color 0.3s;
    will-change: transform;
  }
  .canjump-viz-container .jump-cell .value {
    font-family: Consolas, monospace; font-size: 22px; font-weight: 800; color: #e6e9f5;
  }
  .canjump-viz-container .jump-cell .index { font-size: 11px; color: #7c839c; }
  .canjump-viz-container .jump-cell .range { font-size: 10px; color: #6c7086; font-family: Consolas, monospace; }
  .canjump-viz-container .jump-cell.reachable {
    background: rgba(52, 211, 153, 0.12); border-color: rgba(52, 211, 153, 0.45);
  }
  .canjump-viz-container .jump-cell.blocked {
    background: rgba(248, 113, 113, 0.12); border-color: rgba(248, 113, 113, 0.45); opacity: 0.7;
  }
  .canjump-viz-container .jump-cell.max-reach {
    background: rgba(59, 130, 246, 0.18); border-color: var(--cj-accent-b);
    box-shadow: 0 0 18px rgba(59, 130, 246, 0.45);
    animation: burst 0.5s ease-out;
  }
  .canjump-viz-container .jump-cell.current {
    background: rgba(52, 211, 153, 0.28); border-color: var(--cj-accent-a);
    transform: scale(1.18) translateY(-4px);
    animation: pulse-cj 1.2s infinite, jump-arc 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 5;
  }
  .canjump-viz-container .jump-cell.current .value { color: #fff; }
  .canjump-viz-container .sw-result-banner {
    margin: 0 16px 16px; padding: 12px 16px; border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.12); background: rgba(20, 18, 38, 0.5);
    backdrop-filter: blur(18px); font-size: 14px; line-height: 1.5; transition: all 0.3s;
  }
  .canjump-viz-container .sw-result-banner.success {
    background: rgba(52, 211, 153, 0.14); border-color: var(--cj-accent-a); color: #86efac;
  }
  .canjump-viz-container .sw-result-banner.fail {
    background: rgba(248, 113, 113, 0.14); border-color: #f87171; color: #fca5a5;
    animation: shake 0.4s ease-in-out;
  }
  .canjump-viz-container .sw-result-banner .badge { margin-right: 8px; }
  .canjump-viz-container .sw-code {
    min-height: 0; display: flex; background: rgba(20, 18, 38, 0.4); border-radius: 16px; overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.06);
  }
  .canjump-viz-container .sw-code [data-code-panel] { flex: 1; min-width: 0; }
  .canjump-viz-container .sw-controls {
    padding: 14px 20px; background: rgba(20, 18, 38, 0.6); border-top: 1px solid rgba(255, 255, 255, 0.06);
    display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
  }
  .canjump-viz-container .sw-btn {
    padding: 10px 18px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(20, 18, 38, 0.5); color: #cdd6f4; cursor: pointer; transition: all 0.2s;
    font-size: 14px; font-weight: 500;
  }
  .canjump-viz-container .sw-btn:hover:not(:disabled) { border-color: var(--cj-accent-a); color: #fff; }
  .canjump-viz-container .sw-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .canjump-viz-container .sw-play-btn {
    border: 1px solid transparent; background: linear-gradient(135deg, var(--cj-accent-a), var(--cj-accent-b));
    color: #fff; font-weight: 600;
  }
  .canjump-viz-container .sw-play-btn:hover:not(:disabled) { box-shadow: 0 0 20px rgba(59, 130, 246, 0.45); }
  .canjump-viz-container .sw-counter { color: #a6adc8; font-size: 13px; min-width: 110px; text-align: center; font-variant-numeric: tabular-nums; }
  .canjump-viz-container .sw-slider-container { display: flex; align-items: center; gap: 8px; }
  .canjump-viz-container .sw-slider-container input[type=range] {
    width: 110px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.15);
    outline: none; -webkit-appearance: none;
  }
  .canjump-viz-container .sw-slider-container input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--cj-accent-a);
    cursor: pointer; box-shadow: 0 0 10px rgba(52, 211, 153, 0.5);
  }
  .canjump-viz-container .sw-slider-container span { color: #a6adc8; font-size: 13px; min-width: 40px; font-variant-numeric: tabular-nums; }

  @keyframes pulse-cj {
    0%, 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.55); }
    50% { box-shadow: 0 0 0 10px rgba(52, 211, 153, 0); }
  }
  @keyframes pop-in {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes burst {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); filter: brightness(1.25); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  @keyframes jump-arc {
    0% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-18px) scale(1.18); }
    100% { transform: translateY(-4px) scale(1.18); }
  }
  .canjump-viz-container .jump-cell.new { animation: pop-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }

  @media (max-width: 1100px) {
    .canjump-viz-container .sw-main { grid-template-columns: 1fr; overflow: auto; }
    .canjump-viz-container .sw-code { min-height: 340px; }
    .canjump-viz-container .sw-header { flex-direction: column; align-items: flex-start; gap: 10px; }
    .canjump-viz-container .sw-stats { grid-template-columns: repeat(2, 1fr); }
  }
</style>

<div class="canjump-viz-container">
  <div class="sw-page">
    <div class="sw-header">
      <div class="sw-head-left">
        <div class="sw-icon-badge">🦘</div>
        <div>
          <h1>跳跃游戏 I（贪心）</h1>
          <p class="sw-desc">LeetCode 55：维护最大可达位置，贪心判断能否到达数组末尾</p>
        </div>
      </div>
      <div class="sw-legend">
        <div class="sw-legend-item"><div class="sw-legend-dot" style="background:#34d399;"></div> 当前位置</div>
        <div class="sw-legend-item"><div class="sw-legend-dot" style="background:#3b82f6;"></div> 最远可达</div>
        <div class="sw-legend-item"><div class="sw-legend-dot" style="background:#f87171;"></div> 阻塞</div>
      </div>
    </div>
    <div class="sw-main">
      <div class="sw-left">
        <section class="sw-card">
          <div class="sw-card-title">输入</div>
          <div class="sw-input-row">
            <input type="text" id="canjump-input" value="2,3,1,1,4">
            <button id="canjump-start" class="sw-start-btn">开始跳跃</button>
          </div>
        </section>
        <div class="sw-stats">
          <div class="sw-stat"><label>最大可达</label><span id="max-reach">0</span></div>
          <div class="sw-stat"><label>当前索引</label><span id="current-index">0</span></div>
          <div class="sw-stat"><label>状态</label><span id="jump-status">进行中</span></div>
          <div class="sw-stat"><label>策略</label><span>贪心覆盖</span></div>
        </div>
        <section class="sw-card sw-visual">
          <div class="sw-card-title">跳跃可视化 <span style="font-weight:400;color:#a6adc8;font-size:12px;">值 → 可跳达</span></div>
          <div id="canjump-array-display" class="sw-track"></div>
          <div class="sw-result-banner" id="canjump-status"><span class="badge">💡</span>输入数组后点击开始跳跃</div>
        </section>
      </div>
      <aside class="sw-code"><div data-code-panel></div></aside>
    </div>
    <div class="sw-controls">
      <button id="canjump-reset" class="sw-btn">⏮重置</button>
      <button id="canjump-prev" class="sw-btn">◀上一步</button>
      <button id="canjump-play" class="sw-btn sw-play-btn">▶播放</button>
      <button id="canjump-next" class="sw-btn">下一步▶</button>
      <span id="step-counter" class="sw-counter">步骤: 0 / 0</span>
      <div class="sw-slider-container">
        <input id="canjump-speed" type="range" min="200" max="2000" step="100" value="800">
        <span id="canjump-speed-label">0.8s</span>
      </div>
    </div>
  </div>
</div>
