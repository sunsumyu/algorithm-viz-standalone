<style>
  /* === 两数之和 · 玻璃感 + 哈希表查表 + 命中爆发 === */
  #algo-two-sum-view {
    --accent-a: #22d3ee;
    --accent-b: #3b82f6;
    --accent-glow: rgba(34, 211, 238, .45);
    --match-color: #34d399;
    --conflict-color: #f87171;
    width: 100%; height: 100%;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background:
      radial-gradient(ellipse at 8% 6%, rgba(34, 211, 238, .25), transparent 55%),
      radial-gradient(ellipse at 92% 94%, rgba(59, 130, 246, .25), transparent 55%),
      linear-gradient(135deg, #06121f 0%, #0f1a30 50%, #14122a 100%);
    overflow: hidden;
  }
  #algo-two-sum-view .ts-shell {
    width: 100%; height: 100%;
    display: grid; grid-template-rows: auto 1fr; overflow: hidden;
  }
  #algo-two-sum-view .ts-hero {
    padding: 18px 24px 12px;
    display: flex; gap: 18px; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, .06);
    background: rgba(8, 8, 24, .35);
    backdrop-filter: blur(14px) saturate(150%);
  }
  #algo-two-sum-view .ts-hero-left { display: flex; align-items: center; gap: 14px; }
  #algo-two-sum-view .ts-icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 24px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; box-shadow: 0 6px 20px var(--accent-glow);
  }
  #algo-two-sum-view h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: #f1f5f9; }
  #algo-two-sum-view .ts-sub { color: #94a3b8; font-size: 12.5px; margin-top: 4px; }
  #algo-two-sum-view .ts-tip {
    max-width: 540px; padding: 10px 14px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(34, 211, 238, .12), rgba(59, 130, 246, .08));
    border: 1px solid rgba(34, 211, 238, .3);
    color: #cbd5e1; font-size: 12.5px; line-height: 1.65;
  }
  #algo-two-sum-view .ts-tip strong { color: #67e8f9; }
  #algo-two-sum-view .ts-main {
    min-height: 0; display: grid;
    grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; padding: 16px; overflow: hidden;
  }
  #algo-two-sum-view .ts-left { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
  #algo-two-sum-view .ts-card {
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
    overflow: hidden;
  }
  #algo-two-sum-view .ts-card-title {
    padding: 10px 16px; border-bottom: 1px solid rgba(255, 255, 255, .06);
    display: flex; justify-content: space-between; align-items: center;
    color: #cbd5e1; font-weight: 700; font-size: 13px;
  }
  #algo-two-sum-view .ts-tag {
    font-size: 11px; color: #67e8f9; background: rgba(34, 211, 238, .14);
    border: 1px solid rgba(34, 211, 238, .3); padding: 2px 8px; border-radius: 999px;
  }
  #algo-two-sum-view .ts-input-row {
    display: grid; grid-template-columns: 1fr 110px auto;
    gap: 10px; align-items: center; padding: 14px 16px;
  }
  #algo-two-sum-view input {
    width: 100%; padding: 9px 12px; border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, .12);
    background: rgba(8, 8, 24, .6);
    color: #e2e8f0; font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 13px; outline: none; transition: all .2s;
  }
  #algo-two-sum-view input:focus { border-color: var(--accent-a); box-shadow: 0 0 0 3px rgba(34, 211, 238, .15); }
  #algo-two-sum-view button {
    padding: 8px 16px; border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 10px; background: rgba(255, 255, 255, .04);
    color: #e2e8f0; cursor: pointer; font-weight: 600; font-size: 13px;
    transition: all .25s cubic-bezier(.4, 0, .2, 1);
  }
  #algo-two-sum-view button:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    border-color: transparent; color: #06121f; transform: translateY(-1px);
    box-shadow: 0 6px 18px var(--accent-glow);
  }
  #algo-two-sum-view button:disabled { opacity: .4; cursor: not-allowed; }
  #algo-two-sum-view .ts-examples { padding: 0 16px 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  #algo-two-sum-view .ts-example-btn {
    padding: 5px 12px; border-radius: 999px; font-size: 12px;
    background: rgba(59, 130, 246, .12); border: 1px solid rgba(59, 130, 246, .28);
    color: #93c5fd; cursor: pointer; transition: all .2s;
  }
  #algo-two-sum-view .ts-example-btn:hover {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; border-color: transparent; transform: translateY(-1px);
  }
  /* 统计 */
  #algo-two-sum-view .ts-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  #algo-two-sum-view .ts-stat {
    position: relative; padding: 12px 14px 12px 18px;
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 14px; overflow: hidden;
  }
  #algo-two-sum-view .ts-stat::before {
    content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 4px; border-radius: 4px;
  }
  #algo-two-sum-view .ts-stat--i::before { background: linear-gradient(180deg, #22d3ee, #06b6d4); }
  #algo-two-sum-view .ts-stat--i .ts-stat-val { color: #67e8f9; }
  #algo-two-sum-view .ts-stat--cur::before { background: linear-gradient(180deg, #3b82f6, #2563eb); }
  #algo-two-sum-view .ts-stat--cur .ts-stat-val { color: #93c5fd; }
  #algo-two-sum-view .ts-stat--comp::before { background: linear-gradient(180deg, #a78bfa, #8b5cf6); }
  #algo-two-sum-view .ts-stat--comp .ts-stat-val { color: #c4b5fd; }
  #algo-two-sum-view .ts-stat--res::before { background: linear-gradient(180deg, #34d399, #10b981); }
  #algo-two-sum-view .ts-stat--res .ts-stat-val { color: #6ee7b7; }
  #algo-two-sum-view .ts-stat-label { color: #94a3b8; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  #algo-two-sum-view .ts-stat-val {
    font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 20px; font-weight: 800; margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  /* 数组可视化 */
  #algo-two-sum-view .ts-visual { flex: 1; min-height: 240px; display: flex; flex-direction: column; }
  #algo-two-sum-view .ts-track {
    flex: 1; min-height: 0; padding: 24px 18px;
    overflow: auto; display: flex; align-items: center; gap: 10px;
    justify-content: center;
  }
  #algo-two-sum-view .ts-cell {
    position: relative; min-width: 54px; height: 64px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    border: 1.5px solid rgba(255, 255, 255, .1);
    background: linear-gradient(180deg, rgba(255, 255, 255, .04), rgba(255, 255, 255, .02));
    border-radius: 10px;
    font-family: 'JetBrains Mono', monospace;
    transition: all .35s cubic-bezier(.4, 0, .2, 1);
  }
  #algo-two-sum-view .ts-cell .idx { color: #64748b; font-size: 11px; }
  #algo-two-sum-view .ts-cell .val { color: #cbd5e1; font-weight: 800; font-size: 20px; }
  #algo-two-sum-view .ts-cell.current {
    border-color: var(--accent-a);
    background: linear-gradient(180deg, rgba(34, 211, 238, .35), rgba(6, 182, 212, .12));
    transform: translateY(-6px) scale(1.08);
    box-shadow: 0 0 0 3px rgba(34, 211, 238, .25), 0 8px 22px rgba(34, 211, 238, .4);
    animation: ts-pulse 1.2s ease-in-out infinite;
  }
  @keyframes ts-pulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(34, 211, 238, .25), 0 8px 22px rgba(34, 211, 238, .4); }
    50% { box-shadow: 0 0 0 6px rgba(34, 211, 238, .12), 0 10px 28px rgba(34, 211, 238, .55); }
  }
  #algo-two-sum-view .ts-cell.current .val { color: #a5f3fc; }
  #algo-two-sum-view .ts-cell.pair {
    border-color: var(--match-color);
    background: linear-gradient(180deg, rgba(52, 211, 153, .3), rgba(16, 185, 129, .1));
    animation: ts-match-burst .6s cubic-bezier(.34, 1.56, .64, 1);
  }
  @keyframes ts-match-burst {
    0% { transform: scale(1); }
    40% { transform: scale(1.25); box-shadow: 0 0 0 8px rgba(52, 211, 153, .2), 0 0 24px rgba(52, 211, 153, .6); }
    100% { transform: scale(1); }
  }
  #algo-two-sum-view .ts-cell.pair .val { color: #a7f3d0; }
  /* 哈希表 */
  #algo-two-sum-view .ts-map {
    padding: 14px 16px; background: rgba(8, 8, 24, .45); border-top: 1px solid rgba(255, 255, 255, .06);
    min-height: 80px;
  }
  #algo-two-sum-view .ts-map-title { color: #94a3b8; font-size: 12px; margin-bottom: 8px; }
  #algo-two-sum-view .ts-map-items { display: flex; flex-wrap: wrap; gap: 8px; }
  #algo-two-sum-view .ts-map-item {
    padding: 6px 10px; border-radius: 8px;
    background: rgba(59, 130, 246, .15); border: 1px solid rgba(59, 130, 246, .3);
    font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #cbd5e1;
    animation: ts-slide-in .35s cubic-bezier(.34, 1.56, .64, 1);
  }
  @keyframes ts-slide-in {
    0% { transform: translateY(8px) scale(.85); opacity: 0; }
    60% { transform: translateY(-2px) scale(1.08); opacity: 1; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  #algo-two-sum-view .ts-map-item.hit {
    background: linear-gradient(135deg, #34d399, #10b981);
    color: #06121f; border-color: transparent;
    animation: ts-hit-pop .5s cubic-bezier(.34, 1.56, .64, 1);
    box-shadow: 0 0 18px rgba(52, 211, 153, .55);
  }
  @keyframes ts-hit-pop {
    0% { transform: scale(.6); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  /* 结果横幅 */
  #algo-two-sum-view .ts-result {
    margin: 0 16px 16px; padding: 14px 18px; border-radius: 12px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: linear-gradient(135deg, rgba(34, 211, 238, .12), rgba(59, 130, 246, .06));
    border: 1px solid rgba(34, 211, 238, .28);
    line-height: 1.55; font-size: 14px; color: #a5f3fc;
  }
  #algo-two-sum-view .ts-result .ts-emoji {
    width: 36px; height: 36px; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 20px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; box-shadow: 0 4px 14px var(--accent-glow);
    flex-shrink: 0;
  }
  #algo-two-sum-view .ts-result.ts-result--success {
    background: linear-gradient(135deg, rgba(52, 211, 153, .18), rgba(16, 185, 129, .08));
    border-color: rgba(52, 211, 153, .4); color: #d1fae5;
  }
  #algo-two-sum-view .ts-result.ts-result--success .ts-emoji {
    background: linear-gradient(135deg, #34d399, #10b981);
    box-shadow: 0 4px 14px rgba(52, 211, 153, .55);
  }
  #algo-two-sum-view .ts-result.ts-result--fail {
    background: linear-gradient(135deg, rgba(248, 113, 113, .14), rgba(59, 130, 246, .06));
    border-color: rgba(248, 113, 113, .35); color: #fecaca;
    animation: ts-shake .5s ease-in-out;
  }
  #algo-two-sum-view .ts-result.ts-result--fail .ts-emoji {
    background: linear-gradient(135deg, #f87171, #ef4444);
    box-shadow: 0 4px 14px rgba(248, 113, 113, .55);
  }
  @keyframes ts-shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  /* 日志 */
  #algo-two-sum-view .ts-log {
    min-height: 90px; max-height: 130px; padding: 10px 14px;
    overflow: auto; background: rgba(8, 8, 24, .55);
    font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px;
    line-height: 1.7; color: #94a3b8;
  }
  #algo-two-sum-view .ts-log .active { color: #67e8f9; font-weight: 600; }
  /* 代码 */
  #algo-two-sum-view .ts-code {
    min-height: 0; display: flex;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; overflow: hidden;
  }
  #algo-two-sum-view .ts-code [data-code-panel] { flex: 1; min-width: 0; }
  /* 控制栏 */
  #algo-two-sum-view .ts-controls {
    padding: 14px 18px;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border-top: 1px solid rgba(255, 255, 255, .06);
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  #algo-two-sum-view .ts-controls .ts-ctrl-btn { min-width: 64px; }
  #algo-two-sum-view .ts-controls .ts-ctrl-primary {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; border-color: transparent;
  }
  #algo-two-sum-view .ts-counter {
    color: #94a3b8; font-size: 13px; font-weight: 600;
    min-width: 110px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #algo-two-sum-view .ts-speed-wrap {
    display: flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 12px;
  }
  #algo-two-sum-view #step-speed { width: 130px; accent-color: var(--accent-a); }
  @media (max-width: 1100px) {
    #algo-two-sum-view .ts-main { grid-template-columns: 1fr; overflow: auto; }
    #algo-two-sum-view .ts-code { min-height: 360px; }
  }
</style>

<div class="ts-shell">
  <div class="ts-hero">
    <div class="ts-hero-left">
      <span class="ts-icon">🔗</span>
      <div>
        <h1>两数之和（哈希表）</h1>
        <div class="ts-sub">LeetCode 1 · 一次遍历，map 记录「值→下标」，命中 complement 即返回</div>
      </div>
    </div>
    <div class="ts-tip"><strong>核心动画：</strong>当前元素<span style="color:#67e8f9">青色脉冲</span>上浮；哈希表条目<span style="color:#93c5fd">滑入</span>；命中 complement 时<span style="color:#6ee7b7">绿色 burst 爆发</span>；未命中则存入并继续。</div>
  </div>
  <div class="ts-main">
    <div class="ts-left">
      <section class="ts-card">
        <div class="ts-card-title">输入 <span class="ts-tag">数组 / target</span></div>
        <div class="ts-input-row">
          <input id="ts-array-input" value="2,7,11,15" placeholder="数组 nums">
          <input id="ts-target-input" value="9" placeholder="target">
          <button id="ts-start">开始查找</button>
        </div>
        <div class="ts-examples">
          <button class="ts-example-btn" data-arr="2,7,11,15" data-tgt="9">target=9</button>
          <button class="ts-example-btn" data-arr="3,2,4" data-tgt="6">target=6</button>
          <button class="ts-example-btn" data-arr="3,3" data-tgt="6">重复值</button>
        </div>
      </section>

      <div class="ts-stats">
        <div class="ts-stat ts-stat--i"><div class="ts-stat-label">当前 i</div><div class="ts-stat-val" id="ts-i">0</div></div>
        <div class="ts-stat ts-stat--cur"><div class="ts-stat-label">nums[i]</div><div class="ts-stat-val" id="ts-cur">-</div></div>
        <div class="ts-stat ts-stat--comp"><div class="ts-stat-label">complement</div><div class="ts-stat-val" id="ts-comp">-</div></div>
        <div class="ts-stat ts-stat--res"><div class="ts-stat-label">结果</div><div class="ts-stat-val" id="ts-result">-</div></div>
      </div>

      <section class="ts-card ts-visual">
        <div class="ts-card-title">数组与哈希表 <span class="ts-tag">值 → 下标</span></div>
        <div class="ts-track" id="ts-track"></div>
        <div class="ts-map">
          <div class="ts-map-title">哈希表 map（值 → 下标）</div>
          <div class="ts-map-items" id="ts-map-items"></div>
        </div>
        <div class="ts-result" id="step-message-banner">
          <span class="ts-emoji">🔗</span>
          <div id="step-message">点击「开始查找」观看哈希查表 + 命中爆发动画</div>
        </div>
      </section>

      <section class="ts-card">
        <div class="ts-card-title">执行日志</div>
        <div class="ts-log" id="ts-log"></div>
      </section>
    </div>
    <aside class="ts-code"><div data-code-panel></div></aside>
  </div>
  <div class="ts-controls">
    <button id="step-reset" class="ts-ctrl-btn">⏮ 重置</button>
    <button id="step-prev" class="ts-ctrl-btn">◀ 上一步</button>
    <button id="step-play" class="ts-ctrl-btn ts-ctrl-primary">▶ 播放</button>
    <button id="step-next" class="ts-ctrl-btn">下一步 ▶</button>
    <span id="step-counter" class="ts-counter">步骤: 0 / 0</span>
    <div class="ts-speed-wrap">
      <span>速度</span>
      <input id="step-speed" type="range" min="400" max="2500" step="100" value="900">
      <span id="step-speed-label" style="min-width:42px;">0.9s</span>
    </div>
  </div>
</div>
