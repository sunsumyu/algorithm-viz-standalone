<style>
  /* === 快乐数 · 玻璃感 + 哈希集合判环 + 平方和链 === */

  /* 已见集合 */

  #algo-happy-number-view .hn-seen-chip {

  #algo-happy-number-view .hn-seen-chip.hn-seen-hit {

  @keyframes hn-hit-pop {

  #algo-happy-number-view .hn-seen-chip.hn-seen-latest {

  #algo-happy-number-view .hn-chain-node.hn-chain-current {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));

  }
  #algo-happy-number-view .hn-chain-node.hn-chain-happy {
    background: linear-gradient(135deg, #34d399, #10b981);

  #algo-happy-number-view .hn-chain-arrow { color: #64748b; font-size: 14px; font-weight: 700; }
  /* 结果横幅 */
  #algo-happy-number-view .hn-result {

    background: linear-gradient(135deg, rgba(245, 158, 11, .12), rgba(217, 119, 6, .06));

  #algo-happy-number-view .hn-result .hn-emoji {

  }
  #algo-happy-number-view .hn-result.hn-result--happy {
    background: linear-gradient(135deg, rgba(52, 211, 153, .18), rgba(16, 185, 129, .08));

  #algo-happy-number-view .hn-result.hn-result--happy .hn-emoji {

  #algo-happy-number-view .hn-result.hn-result--cycle {
    background: linear-gradient(135deg, rgba(248, 113, 113, .14), rgba(217, 119, 6, .06));

  }
  #algo-happy-number-view .hn-result.hn-result--cycle .hn-emoji {

  /* 日志 */
  #algo-happy-number-view .hn-log {

  #algo-happy-number-view .hn-code {

  #algo-happy-number-view .hn-controls {

    display: flex; align-items: center; justify-content: center; gap: 12px;

  #algo-happy-number-view .hn-controls .hn-ctrl-btn { min-width: 64px; }
  #algo-happy-number-view .hn-controls .hn-ctrl-primary {

  #algo-happy-number-view .hn-speed-wrap {
    display: flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 12px;

<div class="hn-shell">
  <div class="hn-hero">
    <div class="hn-hero-left">
      <span class="hn-icon">😊</span>
      <div>
        <h1>快乐数（哈希集合判环）</h1>
        <div class="hn-sub">LeetCode 202 · 用哈希集合检测平方和循环</div>
      </div>
    </div>
    <div class="hn-tip"><strong>核心动画：</strong>当前数字<span style="color:#fcd34d">琥珀脉冲</span>；数字分解<span style="color:#fdba74">弹入</span>；平方求和<span style="color:#fb923c">高亮</span>；seen 集合<span style="color:#c4b5fd">滑入</span>；发现环时<span style="color:#fca5a5">红色 burst</span>，快乐数时<span style="color:#6ee7b7">绿色爆发</span>。</div>
  </div>
  <div class="hn-main">
    <div class="hn-left">
      <section class="hn-card">
        <div class="hn-card-title">输入 <span class="hn-tag">正整数 n</span></div>
        <div class="hn-input-row">
          <input id="hn-number-input" value="19" placeholder="正整数 n">
          <button id="hn-start">开始判断</button>
        </div>
        <div class="hn-examples">
          <button class="hn-example-btn" data-num="19">19（快乐数）</button>
          <button class="hn-example-btn" data-num="2">2（循环）</button>
          <button class="hn-example-btn" data-num="7">7（快乐数）</button>
          <button class="hn-example-btn" data-num="20">20（循环）</button>
        </div>
      </section>

      <div class="hn-stats">
        <div class="hn-stat hn-stat--n"><div class="hn-stat-label">当前数字</div><div class="hn-stat-val" id="hn-cur-num">-</div></div>
        <div class="hn-stat hn-stat--iter"><div class="hn-stat-label">迭代次数</div><div class="hn-stat-val" id="hn-iteration">0</div></div>
        <div class="hn-stat hn-stat--seen"><div class="hn-stat-label">已见集合</div><div class="hn-stat-val" id="hn-seen-size">0</div></div>
      </div>

      <section class="hn-card hn-visual">
        <div class="hn-card-title">平方和分解与判环 <span class="hn-tag">Set 检测循环</span></div>
        <div class="hn-area" id="hn-area"></div>
        <div class="hn-result" id="step-message-banner">
          <span class="hn-emoji">😊</span>
          <div id="step-message">点击「开始判断」观看数字分解与集合判环动画</div>
        </div>
      </section>

      <section class="hn-card">
        <div class="hn-card-title">执行日志</div>
        <div class="hn-log" id="hn-log"></div>
      </section>
    </div>
    <aside class="hn-code"><div data-code-panel></div></aside>
  </div>
  <div class="hn-controls">
    <button id="step-reset" class="hn-ctrl-btn">⏮ 重置</button>
    <button id="step-prev" class="hn-ctrl-btn">◀ 上一步</button>
    <button id="step-play" class="hn-ctrl-btn hn-ctrl-primary">▶ 播放</button>
    <button id="step-next" class="hn-ctrl-btn">下一步 ▶</button>
    <span id="step-counter" class="hn-counter">步骤: 0 / 0</span>
    <div class="hn-speed-wrap">
      <span>速度</span>
      <input id="step-speed" type="range" min="400" max="2500" step="100" value="900">
      <span id="step-speed-label" style="min-width:42px;">0.9s</span>
    </div>
  </div>
</div>
