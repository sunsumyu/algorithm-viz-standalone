<div class="ia-shell">
  <div class="ia-hero">
    <div class="ia-hero-left">
      <span class="ia-icon">&#128256;</span>
      <div>
        <h1>两个数组的交集（哈希集合）</h1>
        <div class="ia-sub">LeetCode 349/350 &middot; 用哈希集合求两个数组的交集元素</div>
      </div>
    </div>
    <div class="ia-tip"><strong>核心动画：</strong>阶段一将 <span style="color:#c4b5fd">arr1 元素逐个滑入集合</span>；阶段二扫描 <span style="color:#a5b4fc">arr2 元素查表</span>，命中时<span style="color:#6ee7b7">绿色 burst 爆发</span>；重复元素<span style="color:#94a3b8">灰色跳过</span>。</div>
  </div>
  <div class="ia-main">
    <div class="ia-left">
      <section class="ia-card">
        <div class="ia-card-title">输入 <span class="ia-tag">数组 1 / 数组 2</span></div>
        <div class="ia-input-row">
          <input id="ia-arr1-input" value="1,2,2,1" placeholder="数组 nums1">
          <input id="ia-arr2-input" value="2,2" placeholder="数组 nums2">
          <button id="ia-start">开始求交集</button>
        </div>
        <div class="ia-examples">
          <button class="ia-example-btn" data-arr1="1,2,2,1" data-arr2="2,2">[1,2,2,1] &amp; [2,2]</button>
          <button class="ia-example-btn" data-arr1="4,9,5" data-arr2="9,4,9,8,4">[4,9,5] &amp; [9,4,9,8,4]</button>
        </div>
      </section>

      <div class="ia-stats">
        <div class="ia-stat ia-stat--i"><div class="ia-stat-label">当前 i</div><div class="ia-stat-val" id="ia-i">0</div></div>
        <div class="ia-stat ia-stat--cur"><div class="ia-stat-label">当前元素</div><div class="ia-stat-val" id="ia-cur">-</div></div>
        <div class="ia-stat ia-stat--set"><div class="ia-stat-label">Set 大小</div><div class="ia-stat-val" id="ia-set-size">0</div></div>
        <div class="ia-stat ia-stat--res"><div class="ia-stat-label">结果数</div><div class="ia-stat-val" id="ia-result-count">0</div></div>
      </div>

      <section class="ia-card ia-visual">
        <div class="ia-card-title">数组与集合可视化 <span class="ia-tag">build-set &rarr; scan</span></div>
        <div class="ia-track-wrapper">
          <span class="ia-track-label">nums1</span>
          <div class="ia-track" id="ia-arr1-track"></div>
        </div>
        <div class="ia-set">
          <div class="ia-set-title">哈希集合 Set（存储 nums1 的不重复元素）</div>
          <div class="ia-set-items" id="ia-set-items"></div>
        </div>
        <div class="ia-track-wrapper">
          <span class="ia-track-label">nums2</span>
          <div class="ia-track" id="ia-arr2-track"></div>
        </div>
        <div class="ia-message" id="step-message">点击「开始求交集」观看哈希集合构建 + 交集扫描动画</div>
        <div class="ia-result" id="ia-result">
          <span class="ia-emoji">&#128256;</span>
          <span class="ia-empty-text">结果将在此显示</span>
        </div>
      </section>

      <section class="ia-card">
        <div class="ia-card-title">执行日志</div>
        <div class="ia-log" id="ia-log"></div>
      </section>
    </div>
    <aside class="ia-code"><div data-code-panel></div></aside>
  </div>
  <div class="ia-controls">
    <button id="step-reset" class="ia-ctrl-btn">&#9198; 重置</button>
    <button id="step-prev" class="ia-ctrl-btn">&#9664; 上一步</button>
    <button id="step-play" class="ia-ctrl-btn ia-ctrl-primary">&#9654; 播放</button>
    <button id="step-next" class="ia-ctrl-btn">下一步 &#9654;</button>
    <span id="step-counter" class="ia-counter">步骤: 0 / 0</span>
    <div class="ia-speed-wrap">
      <span>速度</span>
      <input id="step-speed" type="range" min="400" max="2500" step="100" value="900">
      <span id="step-speed-label" style="min-width:42px;">0.9s</span>
    </div>
  </div>
</div>
