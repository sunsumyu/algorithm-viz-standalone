<style>
  /* === 四数之和 · 玻璃感 + 双指针扫描 + 命中爆发 === */
  #algo-four-sum-view {
    --accent-a: #f472b6;
    --accent-b: #ec4899;
    --accent-glow: rgba(244, 114, 182, .45);
    --match-color: #34d399;
    --i-color: #f472b6;
    --j-color: #a78bfa;
    --l-color: #34d399;
    --r-color: #f9e2af;
    width: 100%; height: 100%;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background:
      radial-gradient(ellipse at 8% 6%, rgba(244, 114, 182, .25), transparent 55%),
      radial-gradient(ellipse at 92% 94%, rgba(236, 72, 153, .25), transparent 55%),
      linear-gradient(135deg, #1a0a1e 0%, #1e1038 50%, #1a1230 100%);
    overflow: hidden;
  }
  #algo-four-sum-view .fs-shell { width: 100%; height: 100%; display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
  #algo-four-sum-view .fs-hero {
    padding: 18px 24px 12px; display: flex; gap: 18px; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, .06);
    background: rgba(8, 8, 24, .35); backdrop-filter: blur(14px) saturate(150%);
  }
  #algo-four-sum-view .fs-hero-left { display: flex; align-items: center; gap: 14px; }
  #algo-four-sum-view .fs-icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: inline-flex; align-items: center; justify-content: center; font-size: 24px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #1e1230; box-shadow: 0 6px 20px var(--accent-glow);
  }
  #algo-four-sum-view h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: #f1f5f9; }
  #algo-four-sum-view .fs-sub { color: #94a3b8; font-size: 12.5px; margin-top: 4px; }
  #algo-four-sum-view .fs-tip {
    max-width: 540px; padding: 10px 14px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(244, 114, 182, .12), rgba(236, 72, 153, .08));
    border: 1px solid rgba(244, 114, 182, .3);

  }
  #algo-four-sum-view .fs-tip strong { color: #f9a8d4; }
  #algo-four-sum-view .fs-main {
    min-height: 0; display: grid;
    grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; padding: 16px; overflow: hidden;
  }
  #algo-four-sum-view .fs-left { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
  #algo-four-sum-view .fs-card {
    background: rgba(20, 18, 38, .55); backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; box-shadow: 0 12px 40px rgba(0, 0, 0, .35); overflow: hidden;
  }
  #algo-four-sum-view .fs-card-title {
    padding: 10px 16px; border-bottom: 1px solid rgba(255, 255, 255, .06);
    display: flex; justify-content: space-between; align-items: center;
    color: #cbd5e1; font-weight: 700; font-size: 13px;
  }
  #algo-four-sum-view .fs-tag {
    font-size: 11px; color: #f9a8d4; background: rgba(244, 114, 182, .14);
    border: 1px solid rgba(244, 114, 182, .3); padding: 2px 8px; border-radius: 999px;
  }
  #algo-four-sum-view .fs-input-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 14px 16px; }
  #algo-four-sum-view input {

    border: 1px solid rgba(255, 255, 255, .12);
    background: rgba(8, 8, 24, .6); color: #e2e8f0;
    font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; outline: none; transition: all .2s;

  #algo-four-sum-view input:focus { border-color: var(--accent-a); box-shadow: 0 0 0 3px rgba(244, 114, 182, .15); }
  #algo-four-sum-view button {

  #algo-four-sum-view button:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    border-color: transparent; color: #1e1230; transform: translateY(-1px);
    box-shadow: 0 6px 18px var(--accent-glow);
  }
  #algo-four-sum-view button:disabled { opacity: .4; cursor: not-allowed; }
  #algo-four-sum-view .fs-examples { padding: 0 16px 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  #algo-four-sum-view .fs-example-btn {
    padding: 5px 12px; border-radius: 999px; font-size: 12px;
    background: rgba(236, 72, 153, .12); border: 1px solid rgba(236, 72, 153, .28);
    color: #f9a8d4; cursor: pointer; transition: all .2s;
  }
  #algo-four-sum-view .fs-example-btn:hover {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #1e1230; border-color: transparent; transform: translateY(-1px);
  }
  /* 统计 */
  #algo-four-sum-view .fs-stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  #algo-four-sum-view .fs-stat {
    position: relative; padding: 12px 14px 12px 18px;
    background: rgba(20, 18, 38, .55); backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08); border-radius: 14px; overflow: hidden;
  }
  #algo-four-sum-view .fs-stat::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 4px; border-radius: 4px; }
  #algo-four-sum-view .fs-stat--i::before { background: linear-gradient(180deg, #f472b6, #ec4899); }
  #algo-four-sum-view .fs-stat--i .fs-stat-val { color: #f9a8d4; }
  #algo-four-sum-view .fs-stat--j::before { background: linear-gradient(180deg, #a78bfa, #8b5cf6); }
  #algo-four-sum-view .fs-stat--j .fs-stat-val { color: #c4b5fd; }
  #algo-four-sum-view .fs-stat--lr::before { background: linear-gradient(180deg, #34d399, #10b981); }
  #algo-four-sum-view .fs-stat--lr .fs-stat-val { color: #6ee7b7; }
  #algo-four-sum-view .fs-stat--sum::before { background: linear-gradient(180deg, #ec4899, #db2777); }
  #algo-four-sum-view .fs-stat--sum .fs-stat-val { color: #fbcfe8; }
  #algo-four-sum-view .fs-stat--count::before { background: linear-gradient(180deg, #f9e2af, #fbbf24); }
  #algo-four-sum-view .fs-stat--count .fs-stat-val { color: #fde68a; }
  #algo-four-sum-view .fs-stat-label { color: #94a3b8; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  #algo-four-sum-view .fs-stat-val {
    font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 18px; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums;
  }
  /* 数组可视化 */
  #algo-four-sum-view .fs-visual { flex: 1; min-height: 240px; display: flex; flex-direction: column; }
  #algo-four-sum-view .fs-track {
    flex: 1; min-height: 0; padding: 28px 18px 24px;
    overflow: auto; display: flex; align-items: center; gap: 10px; justify-content: center;
  }
  #algo-four-sum-view .fs-cell {
    position: relative; min-width: 50px; height: 60px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    border: 1.5px solid rgba(255, 255, 255, .1);
    background: linear-gradient(180deg, rgba(255, 255, 255, .04), rgba(255, 255, 255, .02));
    border-radius: 10px; font-family: 'JetBrains Mono', monospace;
    transition: all .35s cubic-bezier(.4, 0, .2, 1);
  }
  #algo-four-sum-view .fs-cell .idx { color: #64748b; font-size: 11px; }
  #algo-four-sum-view .fs-cell .val { color: #cbd5e1; font-weight: 800; font-size: 18px; }
  #algo-four-sum-view .fs-ptr { position: absolute; top: -18px; font-size: 11px; font-weight: 800; }
  #algo-four-sum-view .fs-cell.i {
    border-color: var(--i-color);
    background: linear-gradient(180deg, rgba(244, 114, 182, .35), rgba(236, 72, 153, .12));
    transform: translateY(-8px) scale(1.08);
    box-shadow: 0 0 0 3px rgba(244, 114, 182, .25), 0 8px 22px rgba(244, 114, 182, .4);
    animation: fs-pulse-i 1.2s ease-in-out infinite;
  }
  @keyframes fs-pulse-i {
    0%, 100% { box-shadow: 0 0 0 3px rgba(244, 114, 182, .25), 0 8px 22px rgba(244, 114, 182, .4); }
    50% { box-shadow: 0 0 0 6px rgba(244, 114, 182, .12), 0 10px 28px rgba(244, 114, 182, .55); }
  }
  #algo-four-sum-view .fs-cell.i .val { color: #fbcfe8; }
  #algo-four-sum-view .fs-cell.j {
    border-color: var(--j-color);
    background: linear-gradient(180deg, rgba(167, 139, 250, .35), rgba(139, 92, 246, .12));
    transform: translateY(-6px) scale(1.06);
    box-shadow: 0 0 0 3px rgba(167, 139, 250, .25), 0 8px 22px rgba(167, 139, 250, .4);
    animation: fs-pulse-j 1.2s ease-in-out infinite;
  }
  @keyframes fs-pulse-j {
    0%, 100% { box-shadow: 0 0 0 3px rgba(167, 139, 250, .25), 0 8px 22px rgba(167, 139, 250, .4); }
    50% { box-shadow: 0 0 0 6px rgba(167, 139, 250, .12), 0 10px 28px rgba(167, 139, 250, .55); }
  }
  #algo-four-sum-view .fs-cell.j .val { color: #ddd6fe; }
  #algo-four-sum-view .fs-cell.left {
    border-color: var(--l-color);
    background: linear-gradient(180deg, rgba(52, 211, 153, .3), rgba(16, 185, 129, .1));
    transform: translateY(-4px) scale(1.05);
    animation: fs-pulse-l 1.2s ease-in-out infinite;
  }
  @keyframes fs-pulse-l {
    0%, 100% { box-shadow: 0 0 0 3px rgba(52, 211, 153, .22), 0 6px 18px rgba(52, 211, 153, .35); }
    50% { box-shadow: 0 0 0 6px rgba(52, 211, 153, .1), 0 8px 24px rgba(52, 211, 153, .5); }
  }
  #algo-four-sum-view .fs-cell.left .val { color: #a7f3d0; }
  #algo-four-sum-view .fs-cell.right {
    border-color: var(--r-color);
    background: linear-gradient(180deg, rgba(249, 226, 175, .3), rgba(251, 191, 36, .1));
    transform: translateY(-4px) scale(1.05);
    animation: fs-pulse-r 1.2s ease-in-out infinite;
  }
  @keyframes fs-pulse-r {
    0%, 100% { box-shadow: 0 0 0 3px rgba(249, 226, 175, .22), 0 6px 18px rgba(249, 226, 175, .35); }
    50% { box-shadow: 0 0 0 6px rgba(249, 226, 175, .1), 0 8px 24px rgba(249, 226, 175, .5); }
  }
  #algo-four-sum-view .fs-cell.right .val { color: #fde68a; }
  #algo-four-sum-view .fs-cell.quad {
    border-color: var(--match-color);
    background: linear-gradient(180deg, rgba(52, 211, 153, .4), rgba(16, 185, 129, .15));
    animation: fs-match-burst .65s cubic-bezier(.34, 1.56, .64, 1);
    box-shadow: 0 0 0 4px rgba(52, 211, 153, .25), 0 0 26px rgba(52, 211, 153, .55);
  }
  @keyframes fs-match-burst {
    0% { transform: scale(1); }
    40% { transform: scale(1.28); box-shadow: 0 0 0 8px rgba(52, 211, 153, .2), 0 0 28px rgba(52, 211, 153, .65); }
    100% { transform: scale(1); }
  }
  #algo-four-sum-view .fs-cell.quad .val { color: #a7f3d0; }
  /* 结果列表 */
  #algo-four-sum-view .fs-results {
    padding: 12px 16px; background: rgba(8, 8, 24, .45); border-top: 1px solid rgba(255, 255, 255, .06);
    max-height: 90px; overflow: auto;
  }
  #algo-four-sum-view .fs-results-title { color: #94a3b8; font-size: 12px; margin-bottom: 6px; }
  #algo-four-sum-view .fs-result-chip {
    display: inline-block; padding: 5px 10px; margin: 0 6px 6px 0; border-radius: 8px;
    background: rgba(52, 211, 153, .15); border: 1px solid rgba(52, 211, 153, .35);
    font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #6ee7b7;
    animation: fs-slide-in .35s cubic-bezier(.34, 1.56, .64, 1);
  }
  @keyframes fs-slide-in {
    0% { transform: translateY(8px) scale(.85); opacity: 0; }
    60% { transform: translateY(-2px) scale(1.08); opacity: 1; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  /* 结果横幅 */
  #algo-four-sum-view .fs-result {
    margin: 0 16px 16px; padding: 14px 18px; border-radius: 12px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: linear-gradient(135deg, rgba(244, 114, 182, .12), rgba(236, 72, 153, .06));
    border: 1px solid rgba(244, 114, 182, .28);
    line-height: 1.55; font-size: 14px; color: #fbcfe8;
  }
  #algo-four-sum-view .fs-result .fs-emoji {
    width: 36px; height: 36px; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center; font-size: 20px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #1e1230; box-shadow: 0 4px 14px var(--accent-glow); flex-shrink: 0;
  }
  #algo-four-sum-view .fs-result.fs-result--success {
    background: linear-gradient(135deg, rgba(52, 211, 153, .18), rgba(16, 185, 129, .08));
    border-color: rgba(52, 211, 153, .4); color: #d1fae5;
  }
  #algo-four-sum-view .fs-result.fs-result--success .fs-emoji {
    background: linear-gradient(135deg, #34d399, #10b981);
    box-shadow: 0 4px 14px rgba(52, 211, 153, .55);
  }
  #algo-four-sum-view .fs-result.fs-result--fail {
    background: linear-gradient(135deg, rgba(248, 113, 113, .14), rgba(236, 72, 153, .06));
    border-color: rgba(248, 113, 113, .35); color: #fecaca;
    animation: fs-shake .5s ease-in-out;
  }
  #algo-four-sum-view .fs-result.fs-result--fail .fs-emoji {
    background: linear-gradient(135deg, #f87171, #ef4444);
    box-shadow: 0 4px 14px rgba(248, 113, 113, .55);
  }
  @keyframes fs-shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  /* 日志 */
  #algo-four-sum-view .fs-log {
    min-height: 80px; max-height: 120px; padding: 10px 14px;
    overflow: auto; background: rgba(8, 8, 24, .55);
    font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px;
    line-height: 1.7; color: #94a3b8;
  }
  #algo-four-sum-view .fs-log .active { color: #f9a8d4; font-weight: 600; }
  /* 代码 */
  #algo-four-sum-view .fs-code {
    min-height: 0; display: flex;
    background: rgba(8, 8, 24, .55); backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08); border-radius: 16px; overflow: hidden;
  }
  #algo-four-sum-view .fs-code [data-code-panel] { flex: 1; min-width: 0; }
  /* 控制栏 */
  #algo-four-sum-view .fs-controls {
    padding: 14px 18px; background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border-top: 1px solid rgba(255, 255, 255, .06);
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  #algo-four-sum-view .fs-controls .fs-ctrl-btn { min-width: 64px; }
  #algo-four-sum-view .fs-controls .fs-ctrl-primary {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #1e1230; border-color: transparent;
  }
  #algo-four-sum-view .fs-counter {
    color: #94a3b8; font-size: 13px; font-weight: 600;
    min-width: 110px; text-align: center; font-variant-numeric: tabular-nums;
  }
  #algo-four-sum-view .fs-speed-wrap {
    display: flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 12px;
  }
  #algo-four-sum-view #step-speed { width: 130px; accent-color: var(--accent-a); }
  @media (max-width: 1100px) {
    #algo-four-sum-view .fs-main { grid-template-columns: 1fr; overflow: auto; }
    #algo-four-sum-view .fs-code { min-height: 360px; }
  }
</style>

<div class="fs-shell">
  <div class="fs-hero">
    <div class="fs-hero-left">
      <span class="fs-icon">🎯</span>
      <div>
        <h1>四数之和（排序 + 双指针）</h1>
        <div class="fs-sub">LeetCode 18 · 排序后固定 i、j，left/right 双指针逼近 target-nums[i]-nums[j]，去重收集四元组</div>
      </div>
    </div>
    <div class="fs-tip"><strong>核心动画：</strong>i/j 指 <span style="color:#f9a8d4">粉</span>/<span style="color:#c4b5fd">紫</span>色脉冲，L/R 双指针<span style="color:#6ee7b7">绿</span>/<span style="color:#fde68a">黄</span>色脉动；命中四元组时<span style="color:#6ee7b7">绿色 burst 爆发</span>；结果 chip 滑入。</div>
  </div>
  <div class="fs-main">
    <div class="fs-left">
      <section class="fs-card">
        <div class="fs-card-title">输入数组 <span class="fs-tag">未排序</span></div>
        <div class="fs-input-row">
          <input id="fs-input" value="1,0,-1,0,-2,2" placeholder="nums">
          <button id="fs-start">开始查找</button>
        </div>
        <div class="fs-input-row" style="padding-top:0;">
          <input id="fs-target" value="0" placeholder="target" style="grid-column: 1 / -1;">
        </div>
        <div class="fs-examples">
          <button class="fs-example-btn" data-val="1,0,-1,0,-2,2" data-target="0">示例1</button>
          <button class="fs-example-btn" data-val="2,2,2,2,2" data-target="8">全2</button>
          <button class="fs-example-btn" data-val="-3,-2,-1,0,0,1,2,3" data-target="0">多组</button>
        </div>
      </section>

      <div class="fs-stats">
        <div class="fs-stat fs-stat--i"><div class="fs-stat-label">i</div><div class="fs-stat-val" id="fs-i">0</div></div>
        <div class="fs-stat fs-stat--j"><div class="fs-stat-label">j</div><div class="fs-stat-val" id="fs-j">0</div></div>
        <div class="fs-stat fs-stat--lr"><div class="fs-stat-label">left / right</div><div class="fs-stat-val" id="fs-lr">-</div></div>
        <div class="fs-stat fs-stat--sum"><div class="fs-stat-label">四数和</div><div class="fs-stat-val" id="fs-sum">-</div></div>
        <div class="fs-stat fs-stat--count"><div class="fs-stat-label">结果组数</div><div class="fs-stat-val" id="fs-count">0</div></div>
      </div>

      <section class="fs-card fs-visual">
        <div class="fs-card-title">数组与双指针 <span class="fs-tag">i / j / L / R</span></div>
        <div class="fs-track" id="fs-track"></div>
        <div class="fs-results">
          <div class="fs-results-title">已找到的四元组</div>
          <div id="fs-results-list"></div>
        </div>
        <div class="fs-result" id="step-message-banner">
          <span class="fs-emoji">🎯</span>
          <div id="step-message">点击「开始查找」观看排序 + 双指针扫描 + 命中爆发动画</div>
        </div>
      </section>

      <section class="fs-card">
        <div class="fs-card-title">执行日志</div>
        <div class="fs-log" id="fs-log"></div>
      </section>
    </div>
    <aside class="fs-code"><div data-code-panel></div></aside>
  </div>
  <div class="fs-controls">
    <button id="step-reset" class="fs-ctrl-btn">⏮ 重置</button>
    <button id="step-prev" class="fs-ctrl-btn">◀ 上一步</button>
    <button id="step-play" class="fs-ctrl-btn fs-ctrl-primary">▶ 播放</button>
    <button id="step-next" class="fs-ctrl-btn">下一步 ▶</button>
    <span id="step-counter" class="fs-counter">步骤: 0 / 0</span>
    <div class="fs-speed-wrap">
      <span>速度</span>
      <input id="step-speed" type="range" min="400" max="2500" step="100" value="900">
      <span id="step-speed-label" style="min-width:42px;">0.9s</span>
    </div>
  </div>
</div>
