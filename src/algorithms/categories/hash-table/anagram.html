<style>
  /* === 字母异位词 · 玻璃感 + 计数表抵消 + 全零爆发 === */
  #algo-anagram-view {
    --accent-a: #f472b6;
    --accent-b: #fb7185;
    --accent-glow: rgba(244, 114, 182, .45);
    --match-color: #34d399;
    --conflict-color: #f87171;
    width: 100%; height: 100%;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background:
      radial-gradient(ellipse at 8% 6%, rgba(244, 114, 182, .25), transparent 55%),
      radial-gradient(ellipse at 92% 94%, rgba(251, 113, 133, .25), transparent 55%),
      linear-gradient(135deg, #220a18 0%, #2a0f22 50%, #2a1230 100%);
    overflow: hidden;
  }
  #algo-anagram-view .an-shell {
    width: 100%; height: 100%;
    display: grid; grid-template-rows: auto 1fr; overflow: hidden;
  }
  #algo-anagram-view .an-hero {
    padding: 18px 24px 12px;
    display: flex; gap: 18px; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, .06);
    background: rgba(8, 8, 24, .35);
    backdrop-filter: blur(14px) saturate(150%);
  }
  #algo-anagram-view .an-hero-left { display: flex; align-items: center; gap: 14px; }
  #algo-anagram-view .an-icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 24px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #2a0a18; box-shadow: 0 6px 20px var(--accent-glow);
  }
  #algo-anagram-view h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: #f1f5f9; }
  #algo-anagram-view .an-sub { color: #94a3b8; font-size: 12.5px; margin-top: 4px; }
  #algo-anagram-view .an-tip {
    max-width: 540px; padding: 10px 14px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(244, 114, 182, .12), rgba(251, 113, 133, .08));
    border: 1px solid rgba(244, 114, 182, .3);
    color: #cbd5e1; font-size: 12.5px; line-height: 1.65;
  }
  #algo-anagram-view .an-tip strong { color: #f9a8d4; }
  #algo-anagram-view .an-main {
    min-height: 0; display: grid;
    grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; padding: 16px; overflow: hidden;
  }
  #algo-anagram-view .an-left { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
  #algo-anagram-view .an-card {
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
    overflow: hidden;
  }
  #algo-anagram-view .an-card-title {
    padding: 10px 16px; border-bottom: 1px solid rgba(255, 255, 255, .06);
    display: flex; justify-content: space-between; align-items: center;
    color: #cbd5e1; font-weight: 700; font-size: 13px;
  }
  #algo-anagram-view .an-tag {
    font-size: 11px; color: #f9a8d4; background: rgba(244, 114, 182, .14);
    border: 1px solid rgba(244, 114, 182, .3); padding: 2px 8px; border-radius: 999px;
  }
  #algo-anagram-view .an-input-row {
    display: grid; grid-template-columns: 1fr 1fr auto;
    gap: 10px; align-items: center; padding: 14px 16px;
  }
  #algo-anagram-view input {
    width: 100%; padding: 9px 12px; border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, .12);
    background: rgba(8, 8, 24, .6);
    color: #e2e8f0; font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 13px; outline: none; transition: all .2s;
  }
  #algo-anagram-view input:focus { border-color: var(--accent-a); box-shadow: 0 0 0 3px rgba(244, 114, 182, .15); }
  #algo-anagram-view button {
    padding: 8px 16px; border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 10px; background: rgba(255, 255, 255, .04);
    color: #e2e8f0; cursor: pointer; font-weight: 600; font-size: 13px;
    transition: all .25s cubic-bezier(.4, 0, .2, 1);
  }
  #algo-anagram-view button:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    border-color: transparent; color: #2a0a18; transform: translateY(-1px);
    box-shadow: 0 6px 18px var(--accent-glow);
  }
  #algo-anagram-view button:disabled { opacity: .4; cursor: not-allowed; }
  #algo-anagram-view .an-examples { padding: 0 16px 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  #algo-anagram-view .an-example-btn {
    padding: 5px 12px; border-radius: 999px; font-size: 12px;
    background: rgba(251, 113, 133, .12); border: 1px solid rgba(251, 113, 133, .28);
    color: #fda4af; cursor: pointer; transition: all .2s;
  }
  #algo-anagram-view .an-example-btn:hover {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #2a0a18; border-color: transparent; transform: translateY(-1px);
  }
  /* 统计 */
  #algo-anagram-view .an-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  #algo-anagram-view .an-stat {
    position: relative; padding: 12px 14px 12px 18px;
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 14px; overflow: hidden;
  }
  #algo-anagram-view .an-stat::before {
    content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 4px; border-radius: 4px;
  }
  #algo-anagram-view .an-stat--cur::before { background: linear-gradient(180deg, #f472b6, #ec4899); }
  #algo-anagram-view .an-stat--cur .an-stat-val { color: #f9a8d4; }
  #algo-anagram-view .an-stat--phase::before { background: linear-gradient(180deg, #fb7185, #f43f5e); }
  #algo-anagram-view .an-stat--phase .an-stat-val { color: #fda4af; }
  #algo-anagram-view .an-stat--res::before { background: linear-gradient(180deg, #34d399, #10b981); }
  #algo-anagram-view .an-stat--res .an-stat-val { color: #6ee7b7; }
  #algo-anagram-view .an-stat-label { color: #94a3b8; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  #algo-anagram-view .an-stat-val {
    font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 18px; font-weight: 800; margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  /* 可视化区域 */
  #algo-anagram-view .an-visual { flex: 1; min-height: 240px; display: flex; flex-direction: column; }
  #algo-anagram-view .an-area {
    flex: 1; min-height: 0; padding: 18px; overflow: auto;
    display: flex; flex-direction: column; gap: 18px;
  }
  #algo-anagram-view .an-block-title { color: #94a3b8; font-size: 12.5px; font-weight: 700; margin-bottom: 8px; }
  #algo-anagram-view .an-strings { display: flex; gap: 8px; flex-wrap: wrap; }
  #algo-anagram-view .an-char {
    width: 38px; height: 48px; border-radius: 10px;
    border: 1.5px solid rgba(255, 255, 255, .1);
    background: linear-gradient(180deg, rgba(255, 255, 255, .04), rgba(255, 255, 255, .02));
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 800;
    color: #cbd5e1; transition: all .35s cubic-bezier(.4, 0, .2, 1);
  }
  #algo-anagram-view .an-char.current {
    border-color: var(--accent-a);
    background: linear-gradient(180deg, rgba(244, 114, 182, .35), rgba(236, 72, 153, .12));
    transform: translateY(-6px) scale(1.1);
    box-shadow: 0 0 0 3px rgba(244, 114, 182, .25), 0 8px 22px rgba(244, 114, 182, .4);
    color: #fbcfe8;
    animation: an-pulse 1.2s ease-in-out infinite;
  }
  @keyframes an-pulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(244, 114, 182, .25), 0 8px 22px rgba(244, 114, 182, .4); }
    50% { box-shadow: 0 0 0 6px rgba(244, 114, 182, .12), 0 10px 28px rgba(244, 114, 182, .55); }
  }
  /* 计数表 */
  #algo-anagram-view .an-count-table { display: flex; flex-wrap: wrap; gap: 6px; }
  #algo-anagram-view .an-count-cell {
    min-width: 50px; padding: 6px 8px; border-radius: 8px;
    background: rgba(8, 8, 24, .55); border: 1px solid rgba(255, 255, 255, .1);
    text-align: center; font-family: 'JetBrains Mono', monospace;
    transition: all .3s cubic-bezier(.4, 0, .2, 1);
  }
  #algo-anagram-view .an-count-cell .ch { color: #93c5fd; font-size: 14px; font-weight: 800; }
  #algo-anagram-view .an-count-cell .cnt { color: #cbd5e1; font-size: 16px; font-weight: 700; }
  #algo-anagram-view .an-count-cell.changed {
    border-color: var(--accent-a);
    background: linear-gradient(180deg, rgba(244, 114, 182, .25), rgba(236, 72, 153, .08));
    animation: an-pop .45s cubic-bezier(.34, 1.56, .64, 1);
  }
  @keyframes an-pop {
    0% { transform: scale(.85); }
    55% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  #algo-anagram-view .an-count-cell.changed .cnt { color: #f9a8d4; }
  #algo-anagram-view .an-count-cell.zero .cnt { color: #6ee7b7; }
  /* 结果横幅 */
  #algo-anagram-view .an-result {
    margin: 0 16px 16px; padding: 14px 18px; border-radius: 12px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: linear-gradient(135deg, rgba(244, 114, 182, .12), rgba(251, 113, 133, .06));
    border: 1px solid rgba(244, 114, 182, .28);
    line-height: 1.55; font-size: 14px; color: #f9a8d4;
  }
  #algo-anagram-view .an-result .an-emoji {
    width: 36px; height: 36px; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 20px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #2a0a18; box-shadow: 0 4px 14px var(--accent-glow);
    flex-shrink: 0;
  }
  #algo-anagram-view .an-result.an-result--success {
    background: linear-gradient(135deg, rgba(52, 211, 153, .18), rgba(16, 185, 129, .08));
    border-color: rgba(52, 211, 153, .4); color: #d1fae5;
    animation: an-burst-banner .6s cubic-bezier(.34, 1.56, .64, 1);
  }
  #algo-anagram-view .an-result.an-result--success .an-emoji {
    background: linear-gradient(135deg, #34d399, #10b981);
    box-shadow: 0 4px 14px rgba(52, 211, 153, .55);
  }
  @keyframes an-burst-banner {
    0% { transform: scale(1); }
    40% { transform: scale(1.03); box-shadow: 0 0 0 8px rgba(52, 211, 153, .2), 0 0 28px rgba(52, 211, 153, .5); }
    100% { transform: scale(1); }
  }
  #algo-anagram-view .an-result.an-result--fail {
    background: linear-gradient(135deg, rgba(248, 113, 113, .14), rgba(251, 113, 133, .06));
    border-color: rgba(248, 113, 113, .35); color: #fecaca;
    animation: an-shake .5s ease-in-out;
  }
  #algo-anagram-view .an-result.an-result--fail .an-emoji {
    background: linear-gradient(135deg, #f87171, #ef4444);
    box-shadow: 0 4px 14px rgba(248, 113, 113, .55);
  }
  @keyframes an-shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  /* 日志 */
  #algo-anagram-view .an-log {
    min-height: 80px; max-height: 120px; padding: 10px 14px;
    overflow: auto; background: rgba(8, 8, 24, .55);
    font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px;
    line-height: 1.7; color: #94a3b8;
  }
  #algo-anagram-view .an-log .active { color: #f9a8d4; font-weight: 600; }
  /* 代码 */
  #algo-anagram-view .an-code {
    min-height: 0; display: flex;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; overflow: hidden;
  }
  #algo-anagram-view .an-code [data-code-panel] { flex: 1; min-width: 0; }
  /* 控制栏 */
  #algo-anagram-view .an-controls {
    padding: 14px 18px;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border-top: 1px solid rgba(255, 255, 255, .06);
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  #algo-anagram-view .an-controls .an-ctrl-btn { min-width: 64px; }
  #algo-anagram-view .an-controls .an-ctrl-primary {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #2a0a18; border-color: transparent;
  }
  #algo-anagram-view .an-counter {
    color: #94a3b8; font-size: 13px; font-weight: 600;
    min-width: 110px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #algo-anagram-view .an-speed-wrap {
    display: flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 12px;
  }
  #algo-anagram-view #step-speed { width: 130px; accent-color: var(--accent-a); }
  @media (max-width: 1100px) {
    #algo-anagram-view .an-main { grid-template-columns: 1fr; overflow: auto; }
    #algo-anagram-view .an-code { min-height: 360px; }
  }
</style>

<div class="an-shell">
  <div class="an-hero">
    <div class="an-hero-left">
      <span class="an-icon">🔤</span>
      <div>
        <h1>有效的字母异位词（哈希计数）</h1>
        <div class="an-sub">LeetCode 242 · 26 长计数数组，s 计数 t 抵消，全零即异位词</div>
      </div>
    </div>
    <div class="an-tip"><strong>核心动画：</strong>当前字符<span style="color:#f9a8d4">粉色脉冲</span>上浮；计数格变化时<span style="color:#f9a8d4">弹性 pop</span>；全零通过时<span style="color:#6ee7b7">绿色 burst 爆发</span>，非零则<span style="color:#fca5a5">抖动</span>。</div>
  </div>
  <div class="an-main">
    <div class="an-left">
      <section class="an-card">
        <div class="an-card-title">输入 <span class="an-tag">字符串 s / t</span></div>
        <div class="an-input-row">
          <input id="an-s-input" value="anagram" placeholder="字符串 s">
          <input id="an-t-input" value="nagaram" placeholder="字符串 t">
          <button id="an-start">开始比对</button>
        </div>
        <div class="an-examples">
          <button class="an-example-btn" data-s="anagram" data-t="nagaram">异位词</button>
          <button class="an-example-btn" data-s="rat" data-t="car">非异位词</button>
          <button class="an-example-btn" data-s="listen" data-t="silent">listen/silent</button>
        </div>
      </section>

      <div class="an-stats">
        <div class="an-stat an-stat--cur"><div class="an-stat-label">当前字符</div><div class="an-stat-val" id="an-cur">-</div></div>
        <div class="an-stat an-stat--phase"><div class="an-stat-label">阶段</div><div class="an-stat-val" id="an-phase">就绪</div></div>
        <div class="an-stat an-stat--res"><div class="an-stat-label">结论</div><div class="an-stat-val" id="an-result">-</div></div>
      </div>

      <section class="an-card an-visual">
        <div class="an-card-title">字符串与计数表 <span class="an-tag">count[26]</span></div>
        <div class="an-area" id="an-area"></div>
        <div class="an-result" id="step-message-banner">
          <span class="an-emoji">🔤</span>
          <div id="step-message">点击「开始比对」观看计数抵消 + 全零爆发动画</div>
        </div>
      </section>

      <section class="an-card">
        <div class="an-card-title">执行日志</div>
        <div class="an-log" id="an-log"></div>
      </section>
    </div>
    <aside class="an-code"><div data-code-panel></div></aside>
  </div>
  <div class="an-controls">
    <button id="step-reset" class="an-ctrl-btn">⏮ 重置</button>
    <button id="step-prev" class="an-ctrl-btn">◀ 上一步</button>
    <button id="step-play" class="an-ctrl-btn an-ctrl-primary">▶ 播放</button>
    <button id="step-next" class="an-ctrl-btn">下一步 ▶</button>
    <span id="step-counter" class="an-counter">步骤: 0 / 0</span>
    <div class="an-speed-wrap">
      <span>速度</span>
      <input id="step-speed" type="range" min="400" max="2500" step="100" value="900">
      <span id="step-speed-label" style="min-width:42px;">0.9s</span>
    </div>
  </div>
</div>
