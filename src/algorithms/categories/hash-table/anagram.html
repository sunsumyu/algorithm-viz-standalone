  <!-- 1. 顶栏 Header -->
  <header class="an-header">
    <div class="an-header-left">
      <div class="an-icon-btn">🔤</div>
      <h1 class="an-main-title">有效的字母异位词</h1>
      <button id="btn-open-problem-modal" class="an-btn-problem">📋 题目</button>
      <span class="an-badge-mode">26 长度哈希数组·正负抵消</span>
      <span class="an-badge-complexity">O(n) · O(1)</span>
    </div>

    <div class="an-header-right">
      <div class="an-input-group">
        <label for="input-s">s:</label>
        <input type="text" id="input-s" value="anagram" style="width: 75px;" placeholder="字符串 s" />
      </div>
      <div class="an-input-group">
        <label for="input-t">t:</label>
        <input type="text" id="input-t" value="nagaram" style="width: 75px;" placeholder="字符串 t" />
      </div>
      <button id="btn-generate" class="an-btn-generate">
        <span>▶ 运行</span>
      </button>
      <button id="btn-reset" class="an-btn-reset">
        重置
      </button>
    </div>
  </header>

  <!-- 2. 主演示区 4-Card 布局 -->
  <main class="an-main-layout">

    <!-- ================= 左侧：双看板 + 底部进度条 ================= -->
    <section class="an-left-section">

      <!-- 卡片 1: 字符串与 26 字符哈希桶沙盘 -->
      <div class="an-card">
        <div class="an-card-header">
          <div class="an-card-title">
            <span>📊 字符串双轨与 26 字符频次哈希桶</span>
          </div>
          <div class="an-legend-bar">
            <div><span class="an-legend-dot" style="background:#2563eb;"></span> s(+) 累加</div>
            <div><span class="an-legend-dot" style="background:#dc2626;"></span> t(-) 抵消</div>
          </div>
        </div>

        <!-- 主沙盘展示区 (彻底去框，开阔纯粹) -->
        <div class="an-sandbox-wrap">
          <div class="an-strings-row">
            <div class="an-string-track">
              <span class="an-string-label">s:</span>
              <div class="an-char-cells" id="an-track-s"></div>
            </div>
            <div class="an-string-track">
              <span class="an-string-label">t:</span>
              <div class="an-char-cells" id="an-track-t"></div>
            </div>
          </div>
          <div class="an-buckets-header">
            26 字符计数哈希桶 record[0..25]
          </div>
          <div class="an-buckets-grid" id="an-buckets-grid"></div>
        </div>

        <!-- 预设案例栏：单一外框统一包裹，左固定标签，右侧按钮换行完美左对齐 -->
        <div class="an-preset-bar">
          <span class="an-preset-label">预设案例:</span>
          <div class="an-preset-list">
            <button class="an-chip" data-s="anagram" data-t="nagaram">经典匹配: ("anagram", "nagaram")</button>
            <button class="an-chip" data-s="rat" data-t="car">字符失配: ("rat", "car")</button>
            <button class="an-chip" data-s="ab" data-t="a">长度不一致: ("ab", "a")</button>
            <button class="an-chip" data-s="listen" data-t="silent">单词乱序: ("listen", "silent")</button>
          </div>
        </div>
      </div>

      <!-- 贯穿式 Scrubber 步数进度条与播放控制器 -->
      <div class="an-playback-bar">
        <input type="range" id="slider-progress" min="0" max="0" value="0" class="an-slider" />
        <div class="an-counter-badge">
          <span id="step-cur" style="color: #2563eb;">0</span> / <span id="step-total">0</span>
        </div>
        <div style="display: flex; align-items: center; gap: 4px; flex-shrink: 0;">
          <button id="btn-step-prev" title="上一步" class="an-ctrl-btn">◀</button>
          <button id="btn-play-pause" title="自动播放/暂停" class="an-play-circle-btn">
            <span id="play-icon">▶</span>
          </button>
          <button id="btn-step-next" title="下一步" class="an-ctrl-btn">▶</button>
        </div>
        <div style="display: flex; align-items: center; gap: 4px; margin-left: 6px;">
          <select id="select-speed" style="padding: 2px 6px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 11px; background: #ffffff;">
            <option value="1200">慢速</option>
            <option value="600" selected>正常</option>
            <option value="250">快速</option>
          </select>
        </div>
      </div>

      <!-- 卡片 2: 状态空间与指标监视器 -->
      <div class="an-card">
        <div class="an-card-header">
          <div>
            <div class="an-card-title">🧭 频次统计与判定监视器</div>
            <div class="an-card-desc">当前阶段、当前字符、目标槽位与最终异位词判定</div>
          </div>
          <span id="badge-phase" class="an-counter-badge" style="color:#2563eb; background:#eff6ff; border-color:#bfdbfe;">初始化</span>
        </div>

        <!-- 状态空间展示盒 -->
        <div class="an-state-space-box">
          <div class="an-metrics-grid">
            <div class="an-metric-card">
              <span class="an-metric-label">当前阶段</span>
              <span class="an-metric-val" id="metric-phase" style="color: #2563eb;">长度检查</span>
            </div>
            <div class="an-metric-card">
              <span class="an-metric-label">当前字符 char</span>
              <span class="an-metric-val" id="metric-char" style="color: #9333ea;">—</span>
            </div>
            <div class="an-metric-card">
              <span class="an-metric-label">槽位索引 slot</span>
              <span class="an-metric-val" id="metric-slot" style="color: #f59e0b;">—</span>
            </div>
            <div class="an-metric-card">
              <span class="an-metric-label">异位词判定</span>
              <span class="an-metric-val" id="metric-res" style="color: #10b981;">统计中...</span>
            </div>
          </div>

          <div class="an-formula-box" id="an-formula-box">
            <span>映射公式:</span> <strong id="formula-calc" style="color: #2563eb;">'char' - 'a' = 槽位索引 (0~25)</strong>
          </div>

          <div class="an-live-alert">
            <span>💡</span> <span id="an-live-text">准备就绪，点击运行开始异位词检验。</span>
          </div>
        </div>
      </div>

    </section>

    <!-- ================= 右侧：代码终端 + 执行日志 ================= -->
    <section class="an-right-section">

      <!-- 卡片 3: 暗色代码终端面板 -->
      <div class="an-dark-terminal">
        <div class="an-terminal-header">
          <!-- 1. 主 Tab 切换器 (源码 / 题目 / 精讲) -->
          <div class="an-tab-group">
            <button id="btn-tab-code" class="an-tab-item active">💻 代码调试</button>
            <button id="btn-tab-problem" class="an-tab-item">📋 题目描述</button>
            <button id="btn-tab-analysis" class="an-tab-item">💡 算法精讲</button>
          </div>

          <!-- 2. 多语言切换器 -->
          <div class="an-lang-group" id="code-lang-tabs">
            <button class="an-lang-btn active" data-lang="java">Java</button>
            <button class="an-lang-btn" data-lang="cpp">C++</button>
            <button class="an-lang-btn" data-lang="python">Python</button>
            <button class="an-lang-btn" data-lang="javascript">JS</button>
          </div>

          <!-- 3. 字号缩放器与 macOS 窗口微控制 -->
          <div class="an-font-tools">
            <div class="an-font-scaler">
              <button id="btn-code-font-dec" title="缩小代码字号">A-</button>
              <span id="code-font-indicator" class="an-font-indicator">12</span>
              <button id="btn-code-font-inc" title="放大代码字号">A+</button>
            </div>

            <div class="an-window-dots">
              <span class="an-dot" style="background:#ef4444;"></span>
              <span class="an-dot" style="background:#eab308;"></span>
              <span class="an-dot" style="background:#22c55e;"></span>
            </div>
          </div>
        </div>

        <!-- 容器 1: 源码高亮与单步追踪视图 -->
        <div id="code-view-container" style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;">
          <div class="an-terminal-body">
            <div id="code-lines-wrapper">
              <!-- 动态装载代码行 -->
            </div>
          </div>
        </div>

        <!-- 容器 2: 题目完整描述视图 -->
        <div id="problem-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载题目内容 -->
        </div>

        <!-- 容器 3: 算法精讲视图 -->
        <div id="analysis-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载精讲内容 -->
        </div>
      </div>

      <!-- 卡片 4: 独立执行日志卡片 -->
      <div class="an-log-card">
        <div class="an-log-header">
          <div class="an-log-header-title">
            <span>📜 执行日志</span>
          </div>
          <span id="log-count" class="an-log-count">0 条记录</span>
        </div>

        <div id="log-container" class="an-log-body">
          <!-- 动态填充日志条目 -->
        </div>
      </div>

    </section>

  </main>

  <!-- 4. 力扣原题描述轻量模态弹窗 (Modal) -->
  <div id="modal-problem" class="an-modal-backdrop hidden">
    <div class="an-modal-content">
      <div class="an-modal-header">
        <div class="an-modal-title">
          <span>📋 算法原理与题目说明</span>
        </div>
        <button id="btn-close-problem-modal" class="an-modal-close" title="关闭 (Esc)">✕</button>
      </div>
      <div id="modal-problem-body" class="an-modal-body">
        <!-- 动态装载题目内容 -->
      </div>
    </div>
  </div>
</div>
