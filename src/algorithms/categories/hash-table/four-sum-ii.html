        <div class="fsii-stat fsii-stat--map"><div class="fsii-stat-label">Map 大小</div><div class="fsii-stat-val" id="fsii-map-size">0</div></div>
        <div class="fsii-stat fsii-stat--count"><div class="fsii-stat-label">元组数</div><div class="fsii-stat-val" id="fsii-count">0</div></div>
      </div>

      <section class="fsii-card fsii-visual">
        <div class="fsii-card-title">四数组 & 哈希表 <span class="fsii-tag" id="fsii-visual-tag">构建中</span></div>
        <div class="fsii-rows" id="fsii-rows"></div>
        <div class="fsii-map">
          <div class="fsii-map-title">哈希表 sum → count <span class="fsii-phase-tag build" id="fsii-phase-tag">构建</span></div>
          <div class="fsii-map-items" id="fsii-map-items"></div>
        </div>
        <div class="fsii-result" id="step-message-banner">
          <span class="fsii-emoji">🧮</span>
          <div id="step-message">点击「开始统计」观看分组哈希 + 两阶段扫描动画</div>
        </div>
      </section>

      <section class="fsii-card">
        <div class="fsii-card-title">执行日志</div>
        <div class="fsii-log" id="fsii-log"></div>
      </section>
    </div>
    <aside class="fsii-code"><div data-code-panel></div></aside>
  </div>
  <div class="fsii-controls">
    <button id="step-reset" class="fsii-ctrl-btn">⏮ 重置</button>
    <button id="step-prev" class="fsii-ctrl-btn">◀ 上一步</button>
    <button id="step-play" class="fsii-ctrl-btn fsii-ctrl-primary">▶ 播放</button>
    <button id="step-next" class="fsii-ctrl-btn">下一步 ▶</button>
    <span id="step-counter" class="fsii-counter">步骤: 0 / 0</span>
    <div class="fsii-speed-wrap">
      <span>速度</span>
      <input id="step-speed" type="range" min="400" max="2500" step="100" value="900">
      <span id="step-speed-label" style="min-width:42px;">0.9s</span>
    </div>
  </div>
</div>
