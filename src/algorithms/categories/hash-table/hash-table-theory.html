  <!-- 2. 主演示区 4-Card 布局 -->
  <main class="htt-main-layout">

    <!-- ================= 左侧：双看板 + 底部进度条 ================= -->
    <section class="htt-left-section">

      <!-- 卡片 1: 哈希桶阵列与链表沙盘 -->
      <div class="htt-card">
        <div class="htt-card-header">
          <div class="htt-card-title">
            <span>📊 哈希桶阵列与拉链法链表沙盘</span>
          </div>
          <div class="htt-legend-bar">
            <div><span class="htt-legend-dot" style="background:#2563eb;"></span> 目标槽位</div>
            <div><span class="htt-legend-dot" style="background:#10b981;"></span> 新插入节点</div>
            <div><span class="htt-legend-dot" style="background:#f59e0b;"></span> 碰撞冲突</div>
          </div>
        </div>

        <!-- 哈希桶展示盒 -->
        <div class="htt-sandbox-wrap">
          <div class="htt-buckets-list" id="htt-buckets-list"></div>
        </div>

        <!-- 预设案例栏：单一外框统一包裹，左固定标签，右侧按钮换行完美左对齐 -->
        <div class="htt-preset-bar">
          <span class="htt-preset-label">预设案例:</span>
          <div class="htt-preset-list">
            <button class="htt-chip" data-keys="12, 18, 24, 7, 13">连续碰撞案例: (12, 18, 24 ➔ 桶 0)</button>
            <button class="htt-chip" data-keys="5, 11, 17, 23, 29">桶 5 重度碰撞</button>
            <button class="htt-chip" data-keys="1, 2, 3, 4, 5">均匀分散分布</button>
          </div>
        </div>
      </div>

      <!-- 贯穿式 Scrubber 步数进度条与播放控制器 -->
      <div class="htt-playback-bar">
        <input type="range" id="slider-progress" min="0" max="0" value="0" class="htt-slider" />
        <div class="htt-counter-badge">
          <span id="step-cur" style="color: #2563eb;">0</span> / <span id="step-total">0</span>
        </div>
        <div style="display: flex; align-items: center; gap: 4px; flex-shrink: 0;">
          <button id="btn-step-prev" title="上一步" class="htt-ctrl-btn">◀</button>
          <button id="btn-play-pause" title="自动播放/暂停" class="htt-play-circle-btn">
            <span id="play-icon">▶</span>
          </button>
          <button id="btn-step-next" title="下一步" class="htt-ctrl-btn">▶</button>
        </div>
        <div style="display: flex; align-items: center; gap: 4px; margin-left: 6px;">
          <select id="select-speed" style="padding: 2px 6px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 11px; background: #ffffff;">
            <option value="1200">慢速</option>
            <option value="600" selected>正常</option>
            <option value="250">快速</option>
          </select>
        </div>
      </div>

      <!-- 卡片 2: 状态空间与指标监视器 -->
      <div class="htt-card">
        <div class="htt-card-header">
          <div>
            <div class="htt-card-title">🧭 哈希计算与碰撞监视器</div>
            <div class="htt-card-desc">当前键、哈希槽位、碰撞判定与装载因子</div>
          </div>
          <span id="badge-collision" class="htt-counter-badge" style="color:#2563eb; background:#eff6ff; border-color:#bfdbfe;">初始化</span>
        </div>

        <!-- 状态空间展示盒 -->
        <div class="htt-state-space-box">
          <div class="htt-metrics-grid">
            <div class="htt-metric-card">
              <span class="htt-metric-label">当前键 Key</span>
              <span class="htt-metric-val" id="metric-key" style="color: #2563eb;">—</span>
            </div>
            <div class="htt-metric-card">
              <span class="htt-metric-label">目标槽位 Slot</span>
              <span class="htt-metric-val" id="metric-slot" style="color: #9333ea;">—</span>
            </div>
            <div class="htt-metric-card">
              <span class="htt-metric-label">碰撞判定</span>
              <span class="htt-metric-val" id="metric-collision" style="color: #f59e0b;">否</span>
            </div>
            <div class="htt-metric-card">
              <span class="htt-metric-label">装载因子 Load</span>
              <span class="htt-metric-val" id="metric-load" style="color: #10b981;">0.00</span>
            </div>
          </div>

          <div class="htt-formula-box" id="htt-formula-box">
            <span>哈希函数:</span> <strong id="formula-calc" style="color: #2563eb;">hash(key) = key % 6</strong>
          </div>

          <div class="htt-live-alert">
            <span>💡</span> <span id="htt-live-text">准备就绪，点击运行开始哈希表拉链法演示。</span>
          </div>
        </div>
      </div>

    </section>

    <!-- ================= 右侧：代码终端 + 执行日志 ================= -->
    <section class="htt-right-section">

      <!-- 卡片 3: 暗色代码终端面板 -->
      <div class="htt-dark-terminal">
        <div class="htt-terminal-header">
          <!-- 1. 主 Tab 切换器 (源码 / 题目 / 精讲) -->
          <div class="htt-tab-group">
            <button id="btn-tab-code" class="htt-tab-item active">💻 代码调试</button>
            <button id="btn-tab-problem" class="htt-tab-item">📋 理论全景</button>
            <button id="btn-tab-analysis" class="htt-tab-item">💡 算法精讲</button>
          </div>

          <!-- 2. 多语言切换器 -->
          <div class="htt-lang-group" id="code-lang-tabs">
            <button class="htt-lang-btn active" data-lang="java">Java</button>
            <button class="htt-lang-btn" data-lang="cpp">C++</button>
            <button class="htt-lang-btn" data-lang="python">Python</button>
            <button class="htt-lang-btn" data-lang="javascript">JS</button>
          </div>

          <!-- 3. 字号缩放器与 macOS 窗口微控制 -->
          <div class="htt-font-tools">
            <div class="htt-font-scaler">
              <button id="btn-code-font-dec" title="缩小代码字号">A-</button>
              <span id="code-font-indicator" class="htt-font-indicator">12</span>
              <button id="btn-code-font-inc" title="放大代码字号">A+</button>
            </div>

            <div class="htt-window-dots">
              <span class="htt-dot" style="background:#ef4444;"></span>
              <span class="htt-dot" style="background:#eab308;"></span>
              <span class="htt-dot" style="background:#22c55e;"></span>
            </div>
          </div>
        </div>

        <!-- 容器 1: 源码高亮与单步追踪视图 -->
        <div id="code-view-container" style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;">
          <div class="htt-terminal-body">
            <div id="code-lines-wrapper">
              <!-- 动态装载代码行 -->
            </div>
          </div>
        </div>

        <!-- 容器 2: 题目完整描述视图 -->
        <div id="problem-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载题目内容 -->
        </div>

        <!-- 容器 3: 算法精讲视图 -->
        <div id="analysis-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载精讲内容 -->
        </div>
      </div>

      <!-- 卡片 4: 独立执行日志卡片 -->
      <div class="htt-log-card">
        <div class="htt-log-header">
          <div class="htt-log-header-title">
            <span>📜 执行日志</span>
          </div>
          <span id="log-count" class="htt-log-count">0 条记录</span>
        </div>

        <div id="log-container" class="htt-log-body">
          <!-- 动态填充日志条目 -->
        </div>
      </div>

    </section>

  </main>

  <!-- 4. 力扣原题描述轻量模态弹窗 (Modal) -->
  <div id="modal-problem" class="htt-modal-backdrop hidden">
    <div class="htt-modal-content">
      <div class="htt-modal-header">
        <div class="htt-modal-title">
          <span>📋 算法原理与理论全景</span>
        </div>
        <button id="btn-close-problem-modal" class="htt-modal-close" title="关闭 (Esc)">✕</button>
      </div>
      <div id="modal-problem-body" class="htt-modal-body">
        <!-- 动态装载题目内容 -->
      </div>
    </div>
  </div>
</div>
