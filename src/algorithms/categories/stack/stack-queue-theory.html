              <div class="sqt-subcard-title">⚖️ 访问约束监视器 (Access Constraint)</div>

            </div>
          </div>
          <!-- 统计与进度 -->
          <div class="sqt-subcard" style="flex-shrink: 0;">
            <div class="sqt-subcard-title">🏆 基础理论核心结论 (Theory Summary)</div>
            <div id="sqt-metrics-container"></div>
          </div>
        </div>
      </div>

    </section>

    <!-- ================= 右侧：代码终端 + 执行日志 ================= -->
    <section class="sqt-right-section">

      <!-- 卡片 3: 暗色代码终端面板 -->
      <div class="sqt-dark-terminal">
        <div class="sqt-terminal-header">
          <!-- 1. 主 Tab 切换器 (源码 / 题目 / 精讲) -->
          <div class="sqt-tab-group">
            <button id="btn-tab-code" class="sqt-tab-item active">💻 代码调试</button>
            <button id="btn-tab-problem" class="sqt-tab-item">📋 基础概念</button>
            <button id="btn-tab-analysis" class="sqt-tab-item">💡 STL/Java剖析</button>
          </div>

          <!-- 2. 多语言切换器 -->
          <div class="sqt-lang-group" id="code-lang-tabs">
            <button class="sqt-lang-btn active" data-lang="java">Java</button>
            <button class="sqt-lang-btn" data-lang="cpp">C++</button>
            <button class="sqt-lang-btn" data-lang="python">Python</button>
            <button class="sqt-lang-btn" data-lang="javascript">JS</button>
          </div>

          <!-- 3. 字号缩放器与 macOS 窗口微控制 -->
          <div class="sqt-font-tools">
            <div class="sqt-font-scaler">
              <button id="btn-code-font-dec" title="缩小代码字号">A-</button>
              <span id="code-font-indicator">12</span>
              <button id="btn-code-font-inc" title="放大代码字号">A+</button>
            </div>

            <div class="sqt-window-dots">
              <span class="sqt-dot" style="background:#ef4444;"></span>
              <span class="sqt-dot" style="background:#eab308;"></span>
              <span class="sqt-dot" style="background:#22c55e;"></span>
            </div>
          </div>
        </div>

        <!-- 容器 1: 源码高亮与单步追踪视图 -->
        <div id="code-view-container" style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;">
          <div class="sqt-terminal-body">
            <div id="code-lines-wrapper">
              <!-- 动态装载代码行 -->
            </div>
          </div>
        </div>

        <!-- 容器 2: 题目完整描述视图 -->
        <div id="problem-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载题目内容 -->
        </div>

        <!-- 容器 3: 贪心精讲视图 -->
        <div id="analysis-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载贪心精讲内容 -->
        </div>
      </div>

      <!-- 卡片 4: 独立执行日志卡片 -->
      <div class="sqt-log-card">
        <div class="sqt-log-header">
          <div class="sqt-log-header-title">
            <span>📜 执行日志</span>
          </div>
          <span id="log-count" class="sqt-log-count">0 条记录</span>
        </div>

        <div id="log-container" class="sqt-log-body">
          <!-- 动态填充日志条目 -->
        </div>
      </div>

    </section>

  </main>

  <!-- 4. 理论原题描述轻量模态弹窗 (Modal) -->
  <div id="modal-problem" class="sqt-modal-backdrop hidden">
    <div class="sqt-modal-content">
      <div class="sqt-modal-header">
        <div class="sqt-modal-title">
          <span>📋 理论知识精讲</span>
        </div>
        <button id="btn-close-problem-modal" class="sqt-modal-close" title="关闭 (Esc)">✕</button>
      </div>
      <div id="modal-problem-body" class="sqt-modal-body">
        <!-- 动态装载题目内容 -->
      </div>
    </div>
  </div>
</div>
