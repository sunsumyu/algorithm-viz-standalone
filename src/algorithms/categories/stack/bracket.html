<div id="algo-bracket-view">
  <!-- 1. 顶栏 Header -->
  <header class="bracket-header">
    <div class="bracket-header-left">
      <div class="bracket-icon-btn">🎯</div>
      <h1 class="bracket-main-title">LeetCode 20. 有效的括号</h1>
      <button id="btn-open-problem-modal" class="bracket-btn-problem">📋 题目</button>
      <span class="bracket-badge-mode">遇左压右策略 / O(1) 栈顶直接比对</span>
      <span class="bracket-badge-complexity">O(N)</span>
    </div>

    <!-- 参数与操作工具组 -->
    <div class="bracket-header-right">
      <div style="display: flex; align-items: center; gap: 4px;">
        <button class="bracket-chip" data-val="()[]{}">标准混合</button>
        <button class="bracket-chip" data-val="{[()]}">深层嵌套</button>
        <button class="bracket-chip" data-val="([)]">交叉错位 (False)</button>
      </div>

      <div class="bracket-input-group">
        <span>s:</span>
        <input type="text" id="input-brackets" value="()[]{}" class="bracket-input-str" placeholder="()[]{}" />
      </div>

      <button id="btn-generate" class="bracket-btn-generate">
        <span>▶ 运行</span>
      </button>

      <button id="btn-reset" class="bracket-btn-reset">
        重置
      </button>
    </div>
  </header>

  <!-- 2. 主演示区 4-Card 布局 -->
  <main class="bracket-main-layout">

    <!-- ================= 左侧：双看板 + 底部进度条 ================= -->
    <section class="bracket-left-section">

      <!-- 卡片 1: 字符串字符流与括号匹配栈沙盘 (Bracket Match Sandbox) -->
      <div class="bracket-card">
        <div class="bracket-card-header">
          <div class="bracket-card-title">
            <span>🎯 字符串字符流与括号匹配栈沙盘 (Bracket Match Sandbox)</span>
          </div>
          <div class="bracket-legend-bar">
            <div><span class="bracket-legend-dot" style="background:#059669;"></span> 📍 当前字符</div>
            <div><span class="bracket-legend-dot" style="background:#fbbf24;"></span> 🥞 期望右括号栈</div>
            <div><span class="bracket-legend-dot" style="background:#10b981;"></span> ✓ 匹配成功</div>
          </div>
        </div>

        <!-- 括号匹配沙盘展示盒 -->
        <div id="bracket-sandbox-container"></div>
      </div>

      <!-- 贯穿式 Scrubber 步数进度条与播放控制器 -->
      <div class="bracket-playback-bar">
        <input type="range" id="slider-progress" min="0" max="0" value="0" class="bracket-slider" />
        <div class="bracket-counter-badge">
          <span id="step-cur" style="color: #059669;">0</span> / <span id="step-total">0</span>
        </div>
        <div style="display: flex; align-items: center; gap: 4px; flex-shrink: 0;">
          <button id="btn-step-prev" title="上一步" class="bracket-ctrl-btn">◀</button>
          <button id="btn-play-pause" title="自动播放/暂停" class="bracket-play-circle-btn">
            <span id="play-icon">▶</span>
          </button>
          <button id="btn-step-next" title="下一步" class="bracket-ctrl-btn">▶</button>
        </div>
      </div>

          </div>

          <!-- 统计与进度 -->
          <div class="bracket-subcard" style="flex-shrink: 0;">
            <div class="bracket-subcard-title">🏆 最终括号匹配结论 (Result)</div>
            <div id="bracket-metrics-container"></div>
          </div>
        </div>
      </div>

    </section>

    <!-- ================= 右侧：代码终端 + 执行日志 ================= -->
    <section class="bracket-right-section">

      <!-- 卡片 3: 暗色代码终端面板 -->
      <div class="bracket-dark-terminal">
        <div class="bracket-terminal-header">
          <!-- 1. 主 Tab 切换器 (源码 / 题目 / 精讲) -->
          <div class="bracket-tab-group">
            <button id="btn-tab-code" class="bracket-tab-item active">💻 代码调试</button>
            <button id="btn-tab-problem" class="bracket-tab-item">📋 题目描述</button>
            <button id="btn-tab-analysis" class="bracket-tab-item">💡 贪心精讲</button>
          </div>

          <!-- 2. 多语言切换器 -->
          <div class="bracket-lang-group" id="code-lang-tabs">
            <button class="bracket-lang-btn active" data-lang="java">Java</button>
            <button class="bracket-lang-btn" data-lang="cpp">C++</button>
            <button class="bracket-lang-btn" data-lang="python">Python</button>
            <button class="bracket-lang-btn" data-lang="javascript">JS</button>
          </div>

          <!-- 3. 字号缩放器与 macOS 窗口微控制 -->
          <div class="bracket-font-tools">
            <div class="bracket-font-scaler">
              <button id="btn-code-font-dec" title="缩小代码字号">A-</button>
              <span id="code-font-indicator" class="bracket-font-indicator">12</span>
              <button id="btn-code-font-inc" title="放大代码字号">A+</button>
            </div>

            <div class="bracket-window-dots">
              <span class="bracket-dot" style="background:#ef4444;"></span>
              <span class="bracket-dot" style="background:#eab308;"></span>
              <span class="bracket-dot" style="background:#22c55e;"></span>
            </div>
          </div>
        </div>

        <!-- 容器 1: 源码高亮与单步追踪视图 -->
        <div id="code-view-container" style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;">
          <div class="bracket-terminal-body">
            <div id="code-lines-wrapper">
              <!-- 动态装载代码行 -->
            </div>
          </div>
        </div>

        <!-- 容器 2: 题目完整描述视图 -->
        <div id="problem-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载题目内容 -->
        </div>

        <!-- 容器 3: 贪心精讲视图 -->
        <div id="analysis-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载贪心精讲内容 -->
        </div>
      </div>

      <!-- 卡片 4: 独立执行日志卡片 -->
      <div class="bracket-log-card">
        <div class="bracket-log-header">
          <div class="bracket-log-header-title">
            <span>📜 执行日志</span>
          </div>
          <span id="log-count" class="bracket-log-count">0 条记录</span>
        </div>

        <div id="log-container" class="bracket-log-body">
          <!-- 动态填充日志条目 -->
        </div>
      </div>

    </section>

  </main>

  <!-- 4. 力扣原题描述轻量模态弹窗 (Modal) -->
  <div id="modal-problem" class="bracket-modal-backdrop hidden">
    <div class="bracket-modal-content">
      <div class="bracket-modal-header">
        <div class="bracket-modal-title">
          <span>📋 力扣原题描述</span>
        </div>
        <button id="btn-close-problem-modal" class="bracket-modal-close" title="关闭 (Esc)">✕</button>
      </div>
      <div id="modal-problem-body" class="bracket-modal-body">
        <!-- 动态装载题目内容 -->
      </div>
    </div>
  </div>
</div>
