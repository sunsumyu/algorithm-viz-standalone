                    <div id="mq-result-banner" class="result-banner" style="display:none;"></div>
                </div>
                <div id="step-message">就绪</div>
                <div class="log-panel" id="mq-log"></div>
            </div>
        </div>
        <div class="col-state">
            <div class="panel">
                <div class="panel-title">状态</div>
                <div class="state-grid">
                    <div class="state-card">
                        <div class="state-label">inStack 大小</div>
                        <div id="mq-state-in" class="state-value">0</div>
                    </div>
                    <div class="state-card">
                        <div class="state-label">outStack 大小</div>
                        <div id="mq-state-out" class="state-value">0</div>
                    </div>
                    <div class="state-card">
                        <div class="state-label">操作索引</div>
                        <div id="mq-state-op-index" class="state-value">0</div>
                    </div>
                    <div class="state-card">
                        <div class="state-label">当前操作</div>
                        <div id="mq-state-op" class="state-value">-</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-code">
            <div class="panel code-panel">
                <div class="panel-title">代码</div>
                <div data-code-panel></div>
            </div>
        </div>
    </div>

    <div class="viz-footer">
        <div class="control-group">
            <div class="input-wrapper">
                <span class="speed-label">操作序列:</span>
                <input type="text" id="mq-ops-input" value="push 1,push 2,pop,push 3,pop,pop">
            </div>
            <button id="mq-start" class="btn-primary">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M5 3l14 9-14 9V3z" />
                </svg>
                开始
            </button>
        </div>
        <div class="control-group">
            <button id="step-reset" class="btn-secondary" title="重置">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                    <path d="M3 3v5h5" />
                </svg>
                重置
            </button>
            <button id="step-prev" class="btn-icon" title="上一步">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="m15 18-6-6 6-6" />
                </svg>
            </button>
            <button id="step-play" class="btn-primary" style="min-width:90px;">播放</button>
            <button id="step-next" class="btn-icon" title="下一步">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="m9 18 6-6-6-6" />
                </svg>
            </button>
            <div class="control-divider"></div>
            <span id="step-counter" class="step-counter" style="min-width:90px;">步骤: 1 / 1</span>
        </div>
        <div class="control-group">
            <span class="speed-label">速度</span>
            <input type="range" id="step-speed" min="200" max="3000" step="100" value="1000">
            <span id="step-speed-label" class="speed-label" style="min-width:35px;text-align:right;">1.0s</span>
        </div>
    </div>
</div>
