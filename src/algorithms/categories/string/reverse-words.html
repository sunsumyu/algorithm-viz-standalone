<style>
  #algo-reverse-words-view {
    width: 100%;
    height: 100%;
    background:
      radial-gradient(ellipse at 8% 6%, rgba(167, 139, 250, 0.18), transparent 55%),
      radial-gradient(ellipse at 92% 94%, rgba(192, 132, 252, 0.18), transparent 55%),
      linear-gradient(135deg, #181229, #1a162c, #11131d);
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  #algo-reverse-words-view .rw-page {
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #algo-reverse-words-view .rw-header {
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 18px;
    flex-shrink: 0;
  }
  #algo-reverse-words-view .rw-header-left {
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  #algo-reverse-words-view .rw-icon-badge {
    width: 44px;
    height: 44px;
    border-radius: 11px;
    background: linear-gradient(135deg, #a78bfa, #c084fc);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  #algo-reverse-words-view h2 {
    margin: 0 0 5px;
    font-size: 22px;
    font-weight: 800;
    background: linear-gradient(135deg, #a78bfa, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  #algo-reverse-words-view .rw-desc {
    margin: 0;
    color: #94a3b8;
    font-size: 13px;
    line-height: 1.5;
  }
  #algo-reverse-words-view .rw-tip {
    max-width: 440px;
    padding: 9px 12px;
    border-radius: 10px;
    background: rgba(167, 139, 250, 0.1);
    border: 1px solid rgba(167, 139, 250, 0.24);
    color: #e9d5ff;
    font-size: 13px;
    line-height: 1.55;
  }
  #algo-reverse-words-view .rw-tip strong { color: #a78bfa; }
  #algo-reverse-words-view .rw-main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 420px;
    gap: 14px;
    padding: 14px;
    overflow: hidden;
  }
  #algo-reverse-words-view .rw-left {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
    padding-right: 4px;
  }
  /* Glass cards */
  #algo-reverse-words-view .glass-card,
  #algo-reverse-words-view .rw-card {
    backdrop-filter: blur(18px) saturate(160%);
    background: rgba(20, 18, 38, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    overflow: hidden;
  }
  #algo-reverse-words-view .rw-card-title {
    padding: 11px 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    display: flex;
    justify-content: space-between;
    color: #e2e8f0;
    font-weight: 700;
    font-size: 14px;
  }
  #algo-reverse-words-view .rw-input-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 14px;
  }
  #algo-reverse-words-view input {
    width: 100%;
    padding: 9px 11px;
    border-radius: 10px;
    border: 1px solid rgba(100, 116, 139, 0.3);
    background: rgba(17, 17, 27, 0.7);
    color: #e2e8f0;
    outline: none;
    transition: border-color 0.2s;
  }
  #algo-reverse-words-view input:focus {
    border-color: rgba(167, 139, 250, 0.5);
  }
  #algo-reverse-words-view button {
    padding: 8px 14px;
    border: 1px solid rgba(100, 116, 139, 0.3);
    border-radius: 10px;
    background: rgba(100, 116, 139, 0.2);
    color: #e2e8f0;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 14px;
  }
  #algo-reverse-words-view button:hover:not(:disabled) {
    background: linear-gradient(135deg, #a78bfa, #c084fc);
    border-color: transparent;
    color: #1e1e2e;
  }
  #algo-reverse-words-view button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  #algo-reverse-words-view .rw-examples {
    padding: 0 14px 14px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  #algo-reverse-words-view .rw-example-btn {
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 12px;
  }
  /* Stat panel */
  #algo-reverse-words-view .rw-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  #algo-reverse-words-view .rw-stat {
    position: relative;
    overflow: hidden;
    padding: 12px 12px 12px 18px;
    backdrop-filter: blur(18px) saturate(160%);
    background: rgba(20, 18, 38, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }
  #algo-reverse-words-view .rw-stat::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: linear-gradient(180deg, #a78bfa, #c084fc);
    border-radius: 2px 0 0 2px;
  }
  #algo-reverse-words-view .rw-stat label {
    display: block;
    margin-bottom: 6px;
    color: #94a3b8;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }
  #algo-reverse-words-view .rw-stat span {
    color: #a78bfa;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 18px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  #algo-reverse-words-view .rw-visual {
    flex: 1;
    min-height: 240px;
    display: flex;
    flex-direction: column;
  }
  #algo-reverse-words-view .rw-area {
    flex: 1;
    min-height: 0;
    padding: 18px;
    overflow: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  #algo-reverse-words-view .rw-block-title {
    color: #94a3b8;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  /* Char block style */
  #algo-reverse-words-view .rw-chars-block {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    min-height: 48px;
    align-items: center;
  }
  #algo-reverse-words-view .rw-char {
    width: 30px;
    height: 38px;
    border-radius: 6px;
    border: 1px solid rgba(100, 116, 139, 0.3);
    background: rgba(17, 17, 27, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 16px;
    font-weight: 700;
    color: #e2e8f0;
    transition: all 0.2s;
  }
  #algo-reverse-words-view .rw-char.space {
    background: transparent;
    border-color: transparent;
    color: #64748b;
  }
  #algo-reverse-words-view .rw-char.current {
    border-color: #a78bfa;
    box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.18);
    animation: pulseChar 1.2s infinite;
  }
  /* Words block */
  #algo-reverse-words-view .rw-words-block {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  #algo-reverse-words-view .rw-word {
    padding: 6px 12px;
    border-radius: 8px;
    background: rgba(100, 116, 139, 0.25);
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 15px;
    color: #e2e8f0;
    transition: all 0.2s;
  }
  #algo-reverse-words-view .rw-word.current {
    background: linear-gradient(135deg, #a78bfa, #c084fc);
    color: #1e1e2e;
    box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.15);
  }
  /* Result banner */
  #algo-reverse-words-view .rw-result-block {
    padding: 10px 14px;
    border-radius: 8px;
    background: rgba(167, 139, 250, 0.1);
    border: 1px solid rgba(167, 139, 250, 0.35);
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 15px;
    color: #c4b5fd;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }
  #algo-reverse-words-view .rw-message {
    margin: 0 16px 16px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(167, 139, 250, 0.25);
    background: rgba(167, 139, 250, 0.08);
    line-height: 1.5;
    font-size: 14px;
    color: #e9d5ff;
  }
  #algo-reverse-words-view .rw-log {
    min-height: 80px;
    max-height: 110px;
    padding: 10px 14px;
    overflow: auto;
    background: rgba(17, 17, 27, 0.7);
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 12px;
    line-height: 1.7;
    color: #94a3b8;
  }
  #algo-reverse-words-view .rw-log .active {
    color: #a78bfa;
    background: rgba(167, 139, 250, 0.05);
    font-weight: 600;
  }
  #algo-reverse-words-view .rw-code {
    min-height: 0;
    display: flex;
    background: rgba(17, 17, 27, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    overflow: hidden;
    backdrop-filter: blur(18px) saturate(160%);
  }
  #algo-reverse-words-view .rw-code [data-code-panel] {
    flex: 1;
    min-width: 0;
  }
  /* Unified controls bar */
  #algo-reverse-words-view .rw-controls {
    padding: 12px 16px;
    background: rgba(24, 24, 37, 0.9);
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  #algo-reverse-words-view .rw-controls button {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.35rem;
    padding: 0.5rem 1rem;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  #algo-reverse-words-view .rw-controls .btn-primary {
    background: linear-gradient(135deg, #a78bfa, #c084fc);
    border: none;
    color: #1e1e2e;
  }
  #algo-reverse-words-view .rw-controls button:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(167, 139, 250, 0.25);
  }
  #algo-reverse-words-view .rw-controls button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }
  #algo-reverse-words-view .rw-counter {
    color: #94a3b8;
    font-size: 14px;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  #algo-reverse-words-view .control-divider {
    width: 1px;
    height: 24px;
    background: rgba(255, 255, 255, 0.1);
  }
  #algo-reverse-words-view #step-speed {
    accent-color: #a78bfa;
    width: 100px;
  }
  /* Keyframe animations */
  @keyframes pulseChar {
    0%, 100% { box-shadow: 0 0 0 0 rgba(167, 139, 250, 0.4); }
    50% { box-shadow: 0 0 0 8px rgba(167, 139, 250, 0); }
  }
  @keyframes matchBurst {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); filter: brightness(1.1); }
    100% { transform: scale(1); }
  }
  @keyframes mismatchShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  @keyframes slideInResult {
    0% {
      transform: translateY(20px);
      opacity: 0;
    }
    100% {
      transform: translateY(0);
      opacity: 1;
    }
  }
  #algo-reverse-words-view .rw-char.current.animate-match {
    animation: matchBurst 0.5s ease;
  }
  #algo-reverse-words-view .rw-word.animate-match {
    animation: matchBurst 0.5s ease;
  }
  #algo-reverse-words-view .rw-result-block {
    animation: slideInResult 0.5s ease;
  }
  @media (max-width: 1100px) {
    #algo-reverse-words-view .rw-main { grid-template-columns: 1fr; overflow: auto; }
    #algo-reverse-words-view .rw-code { min-height: 360px; }
  }
</style>

<div class="rw-page">
  <div class="rw-header">
    <div class="rw-header-left">
      <div class="rw-icon-badge">🔃</div>
      <div>
        <h2>翻转字符串里的单词（双指针）</h2>
        <p class="rw-desc">LeetCode 151：反转句子中的单词顺序，并去除多余空格</p>
      </div>
    </div>
    <div class="rw-tip"><strong>三步法：</strong>① 移除多余空格；② 整体反转；③ 逐个单词反转。动画演示逐词提取、补全、倒序拼接过程。</div>
  </div>
  <div class="rw-main">
    <div class="rw-left">
      <section class="rw-card">
        <div class="rw-card-title">输入句子</div>
        <div class="rw-input-row">
          <input id="rw-input" value="  the sky is blue  ">
          <button id="rw-start">开始反转</button>
        </div>
        <div class="rw-examples">
          <button class="rw-example-btn" data-val="  the sky is blue  ">the sky is blue</button>
          <button class="rw-example-btn" data-val="  hello world  ">含首尾空格</button>
          <button class="rw-example-btn" data-val="a good   example">多空格</button>
        </div>
      </section>
      <div class="rw-stats">
        <div class="rw-stat"><label>阶段</label><span id="rw-phase">就绪</span></div>
        <div class="rw-stat"><label>单词数</label><span id="rw-wordcount">0</span></div>
        <div class="rw-stat"><label>当前单词</label><span id="rw-curword">-</span></div>
      </div>
      <section class="rw-card rw-visual">
        <div class="rw-card-title">处理过程</div>
        <div class="rw-area" id="rw-area"></div>
        <div class="rw-message" id="step-message">点击开始反转</div>
      </section>
      <section class="rw-card">
        <div class="rw-card-title">执行日志</div>
        <div class="rw-log" id="rw-log"></div>
      </section>
    </div>
    <aside class="rw-code"><div data-code-panel></div></aside>
  </div>
  <div class="rw-controls">
    <button id="step-reset">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
        <path d="M3 3v5h5" />
      </svg>
      重置
    </button>
    <button id="step-prev">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m15 18-6-6 6-6" />
      </svg>
      上一步
    </button>
    <button id="step-play">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M5 3l14 9-14 9V3z" />
      </svg>
      播放
    </button>
    <button id="step-next">
      下一步
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m9 18 6-6-6-6" />
      </svg>
    </button>
    <div class="control-divider"></div>
    <span id="step-counter" class="rw-counter">步骤: 0 / 0</span>
    <div style="display:flex; align-items:center; gap:0.5rem;">
      <span class="rw-counter">速度</span>
      <input id="step-speed" type="range" min="400" max="2500" step="100" value="900">
      <span id="step-speed-label" class="rw-counter">0.9s</span>
    </div>
  </div>
</div>
