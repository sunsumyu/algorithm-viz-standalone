<style>

    grid-template-columns: repeat(4, 1fr);

    overflow: hidden;
    padding: 12px 12px 12px 18px;
    backdrop-filter: blur(18px) saturate(160%);

    border: 1px solid rgba(255, 255, 255, 0.08);

    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);

  #algo-repeated-substring-view .rps-stat::before {
    content: '';

    left: 0;

    bottom: 0;

    flex: 1;
    min-height: 230px;
    display: flex;
    flex-direction: column;

  #algo-repeated-substring-view .rps-track {
    flex: 1;
    min-height: 0;

    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  #algo-repeated-substring-view .rps-row {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  #algo-repeated-substring-view .rps-row-label {
    color: #94a3b8;
    font-size: 12px;
    font-weight: 600;
    width: 60px;
    text-align: right;
    flex-shrink: 0;
  }
  #algo-repeated-substring-view .rps-cells {
    display: flex;
    gap: 4px;
    align-items: center;
  }
  #algo-repeated-substring-view .rps-cell {
    width: 44px;
    height: 50px;
    border-radius: 10px;
    border: 1px solid rgba(100, 116, 139, 0.3);
    background: rgba(17, 17, 27, 0.7);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    transition: all 0.25s ease;
    position: relative;
  }
  #algo-repeated-substring-view .rps-cell .idx {
    color: #64748b;
    font-size: 10px;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  #algo-repeated-substring-view .rps-cell .val {
    color: #e2e8f0;
    font-weight: 800;
    font-size: 18px;
  }
  #algo-repeated-substring-view .rps-cell.pattern {
    border-color: #ec4899;
    box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.18);
    background: rgba(236, 72, 153, 0.12);
  }
  #algo-repeated-substring-view .rps-cell.match-0 {
    border-color: #a78bfa;
    background: rgba(167, 139, 250, 0.12);
    box-shadow: 0 0 0 2px rgba(167, 139, 250, 0.15);
  }
  #algo-repeated-substring-view .rps-cell.match-1 {
    border-color: #38bdf8;
    background: rgba(56, 189, 248, 0.12);
    box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15);
  }
  #algo-repeated-substring-view .rps-cell.match-2 {
    border-color: #34d399;
    background: rgba(52, 211, 153, 0.12);
    box-shadow: 0 0 0 2px rgba(52, 211, 153, 0.15);
  }
  #algo-repeated-substring-view .rps-cell.match-3 {
    border-color: #fbbf24;
    background: rgba(251, 191, 36, 0.12);
    box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.15);
  }
  #algo-repeated-substring-view .rps-cell.match-ok {
    border-color: #4ade80;
    background: rgba(74, 222, 128, 0.12);
    box-shadow: 0 0 0 2px rgba(74, 222, 128, 0.15);
  }
  #algo-repeated-substring-view .rps-cell.match-bad {
    border-color: #f87171;
    background: rgba(248, 113, 113, 0.12);
    box-shadow: 0 0 0 2px rgba(248, 113, 113, 0.15);
    animation: rpsShake 0.4s ease;
  }
  #algo-repeated-substring-view .rps-cell.skipped {
    opacity: 0.35;
  }
  /* Result banner */
  #algo-repeated-substring-view .rps-result {
    margin: 0 16px 8px;
    padding: 10px 14px;
    border-radius: 10px;
    text-align: center;
    font-weight: 700;
    font-size: 14px;
    display: none;
  }
  #algo-repeated-substring-view .rps-result.found {
    display: block;
    border: 1px solid rgba(74, 222, 128, 0.3);
    background: rgba(74, 222, 128, 0.1);
    color: #4ade80;
  }
  #algo-repeated-substring-view .rps-result.not-found {
    display: block;
    border: 1px solid rgba(248, 113, 113, 0.3);
    background: rgba(248, 113, 113, 0.1);
    color: #f87171;
  }
  #algo-repeated-substring-view .rps-message {
    margin: 0 16px 8px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(236, 72, 153, 0.22);
    background: rgba(236, 72, 153, 0.08);
    line-height: 1.5;
    font-size: 14px;
    color: #fbcfe8;
  }
  #algo-repeated-substring-view .rps-log {
    min-height: 80px;
    max-height: 110px;
    padding: 10px 14px;
    overflow: auto;
    background: rgba(17, 17, 27, 0.7);
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 12px;
    line-height: 1.7;
    color: #94a3b8;
  }
  #algo-repeated-substring-view .rps-log .active {
    color: #ec4899;
    background: rgba(236, 72, 153, 0.05);
    font-weight: 600;
  }
  #algo-repeated-substring-view .rps-code {
    min-height: 0;
    display: flex;
    background: rgba(17, 17, 27, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    overflow: hidden;
    backdrop-filter: blur(18px) saturate(160%);
  }
  #algo-repeated-substring-view .rps-code [data-code-panel] {
    flex: 1;
    min-width: 0;
  }
  /* Unified controls bar */
  #algo-repeated-substring-view .rps-controls {
    padding: 12px 16px;
    background: rgba(24, 24, 37, 0.9);
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  #algo-repeated-substring-view .rps-controls button {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.35rem;
    padding: 0.5rem 1rem;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  #algo-repeated-substring-view .rps-controls #step-play {
    background: linear-gradient(135deg, #ec4899, #db2777);
    border: none;
    color: #1e1e2e;
  }
  #algo-repeated-substring-view .rps-controls button:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(236, 72, 153, 0.2);
  }
  #algo-repeated-substring-view .rps-controls button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }
  #algo-repeated-substring-view .rps-counter {
    color: #94a3b8;
    font-size: 14px;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  #algo-repeated-substring-view .control-divider {
    width: 1px;
    height: 24px;
    background: rgba(255, 255, 255, 0.1);
  }
  #algo-repeated-substring-view #step-speed {
    accent-color: #ec4899;
    width: 100px;
  }
  /* Keyframe animations */
  @keyframes rpsShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  @keyframes rpsPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.4); }
    50% { box-shadow: 0 0 0 8px rgba(236, 72, 153, 0); }
  }
  @media (max-width: 1100px) {
    #algo-repeated-substring-view .rps-main { grid-template-columns: 1fr; overflow: auto; }
    #algo-repeated-substring-view .rps-code { min-height: 360px; }
  }
</style>

<div class="rps-page">
  <div class="rps-header">
    <div class="rps-header-left">
      <div class="rps-icon-badge">🔁</div>
      <div>
        <h2>重复的子字符串</h2>
        <p class="rps-desc">LeetCode 459 · 判断字符串是否由重复子串构成</p>
      </div>
    </div>
    <div class="rps-tip"><strong>枚举因子长度：</strong>从 len=1 到 n/2 逐个尝试，若 n 能被 len 整除，则提取 s[0..len-1] 作为模式串，依次对比每个等长分块是否相同。</div>
  </div>
  <div class="rps-main">
    <div class="rps-left">
      <section class="rps-card">
        <div class="rps-card-title">输入字符串</div>
        <div class="rps-input-row">
          <input id="rps-input" value="abab">
          <button id="rps-start">开始检测</button>
        </div>
        <div class="rps-examples">
          <button class="rps-example-btn" data-s="abab">abab (true)</button>
          <button class="rps-example-btn" data-s="aba">aba (false)</button>
          <button class="rps-example-btn" data-s="abcabcabc">abcabcabc (true)</button>
          <button class="rps-example-btn" data-s="aabaaba">aabaaba (false)</button>
        </div>
      </section>
      <div class="rps-stats">
        <div class="rps-stat"><label>候选长度</label><span id="rps-pat-len">-</span></div>
        <div class="rps-stat"><label>候选份数 (n/len)</label><span id="rps-pat-count">-</span></div>
        <div class="rps-stat"><label>当前尝试</label><span id="rps-attempt">-</span></div>
        <div class="rps-stat"><label>匹配结果</label><span id="rps-found">-</span></div>
      </div>
      <section class="rps-card rps-visual">
        <div class="rps-card-title">字符串可视化</div>
        <div class="rps-track" id="rps-track"></div>
        <div class="rps-result" id="rps-result"></div>
        <div class="rps-message" id="step-message">点击开始检测</div>
      </section>
      <section class="rps-card">
        <div class="rps-card-title">执行日志</div>
        <div class="rps-log" id="rps-log"></div>
      </section>
    </div>
    <aside class="rps-code"><div data-code-panel></div></aside>
  </div>
  <div class="rps-controls">
    <button id="step-reset">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
        <path d="M3 3v5h5" />
      </svg>
      重置
    </button>
    <button id="step-prev">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m15 18-6-6 6-6" />
      </svg>
      上一步
    </button>
    <button id="step-play">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M5 3l14 9-14 9V3z" />
      </svg>
      播放
    </button>
    <button id="step-next">
      下一步
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m9 18 6-6-6-6" />
      </svg>
    </button>
    <div class="control-divider"></div>
    <span id="step-counter" class="rps-counter">步骤: 0 / 0</span>
    <div style="display:flex; align-items:center; gap:0.5rem;">
      <span class="rps-counter">速度</span>
      <input id="step-speed" type="range" min="400" max="2500" step="100" value="900">
      <span id="step-speed-label" class="rps-counter">0.9s</span>
    </div>
  </div>
</div>
