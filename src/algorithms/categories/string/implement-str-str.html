<style>

  #algo-str-str-view .ss-icon-badge {

  #algo-str-str-view h2 {

  #algo-str-str-view .ss-desc {
    margin: 0;

  #algo-str-str-view .ss-tip {

  }
  #algo-str-str-view .ss-tip strong { color: #6366f1; }
  #algo-str-str-view .ss-main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 420px;
    gap: 14px;
    padding: 14px;
    overflow: hidden;
  }
  #algo-str-str-view .ss-left {
    min-width: 0;

    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
    padding-right: 4px;
  }
  /* Glass cards */
  #algo-str-str-view .glass-card,
  #algo-str-str-view .ss-card {
    backdrop-filter: blur(18px) saturate(160%);
    background: rgba(20, 18, 38, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);

  }
  #algo-str-str-view .ss-card-title {

  #algo-str-str-view .ss-input-row {

    align-items: center;
    padding: 14px;

  #algo-str-str-view input {
    width: 100%;
    padding: 9px 11px;

    border: 1px solid rgba(100, 116, 139, 0.3);

    outline: none;

  #algo-str-str-view input:focus {

  #algo-str-str-view button {
    padding: 8px 14px;
    border: 1px solid rgba(100, 116, 139, 0.3);

    background: rgba(100, 116, 139, 0.2);
    color: #e2e8f0;

    transition: all 0.2s;
    font-size: 14px;
  }
  #algo-str-str-view button:hover:not(:disabled) {
    background: linear-gradient(135deg, #6366f1, #3b82f6);
    border-color: transparent;
    color: #1e1e2e;
  }
  #algo-str-str-view button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  #algo-str-str-view .ss-examples {
    padding: 0 14px 14px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  #algo-str-str-view .ss-example-btn {
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 12px;
  }
  /* Stat panel */
  #algo-str-str-view .ss-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  #algo-str-str-view .ss-stat {
    position: relative;
    overflow: hidden;
    padding: 12px 12px 12px 18px;
    backdrop-filter: blur(18px) saturate(160%);
    background: rgba(20, 18, 38, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }
  #algo-str-str-view .ss-stat::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: linear-gradient(180deg, #6366f1, #3b82f6);
    border-radius: 2px 0 0 2px;
  }
  #algo-str-str-view .ss-stat label {
    display: block;
    margin-bottom: 6px;
    color: #94a3b8;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }
  #algo-str-str-view .ss-stat span {
    color: #6366f1;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 20px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  #algo-str-str-view .ss-visual {
    flex: 1;
    min-height: 230px;
    display: flex;
    flex-direction: column;
  }
  #algo-str-str-view .ss-track {
    flex: 1;
    min-height: 0;
    padding: 28px 18px 18px;
    overflow: auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  #algo-str-str-view .ss-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  #algo-str-str-view .ss-row-label {
    font-size: 13px;
    font-weight: 600;
    color: #94a3b8;
    min-width: 70px;
  }
  #algo-str-str-view .ss-cell {
    width: 50px;
    height: 56px;
    border-radius: 12px;
    border: 1px solid rgba(100, 116, 139, 0.3);
    background: rgba(17, 17, 27, 0.7);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    transition: all 0.25s ease;
    position: relative;
    transform-origin: center bottom;
  }
  #algo-str-str-view .ss-cell .idx {
    color: #64748b;
    font-size: 11px;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  #algo-str-str-view .ss-cell .val {
    color: #e2e8f0;
    font-weight: 800;
    font-size: 20px;
  }
  #algo-str-str-view .ss-cell.matched {
    background: rgba(34, 197, 94, 0.14);
    border-color: #22c55e;
    box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18);
  }
  #algo-str-str-view .ss-cell.current {
    border-color: #f97316;
    box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.18);
    animation: pulseCurrent 1.2s infinite;
  }
  #algo-str-str-view .ss-cell.mismatch {
    animation: mismatchShake 0.4s ease;
    border-color: #ef4444;
    box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.18);
  }
  #algo-str-str-view .ss-cell.found {
    background: rgba(34, 197, 94, 0.2);
    border-color: #22c55e;
    box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.3);
  }
  #algo-str-str-view .ss-ptr {
    position: absolute;
    top: -18px;
    font-size: 11px;
    font-weight: 700;
  }
  #algo-str-str-view .ss-ptr.ptr-i { color: #6366f1; }
  #algo-str-str-view .ss-ptr.ptr-j { color: #3b82f6; }
  #algo-str-str-view .ss-next-table {
    padding: 10px 14px;
    background: rgba(17, 17, 27, 0.5);
    border-radius: 10px;
    margin: 0 18px 18px;
  }
  #algo-str-str-view .ss-next-table-title {
    font-size: 12px;
    color: #94a3b8;
    margin-bottom: 8px;
    font-weight: 600;
  }
  #algo-str-str-view .ss-next-grid {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  #algo-str-str-view .ss-next-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 4px 8px;
    border-radius: 6px;
    background: rgba(99, 102, 241, 0.1);
    border: 1px solid rgba(99, 102, 241, 0.2);
    min-width: 36px;
  }
  #algo-str-str-view .ss-next-item .next-idx {
    font-size: 10px;
    color: #64748b;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  #algo-str-str-view .ss-next-item .next-val {
    font-size: 14px;
    color: #6366f1;
    font-weight: 700;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  #algo-str-str-view .ss-message {
    margin: 0 16px 16px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(99, 102, 241, 0.22);
    background: rgba(99, 102, 241, 0.08);
    line-height: 1.5;
    font-size: 14px;
    color: #c7d2fe;
  }
  #algo-str-str-view .ss-log {
    min-height: 80px;
    max-height: 110px;
    padding: 10px 14px;
    overflow: auto;
    background: rgba(17, 17, 27, 0.7);
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 12px;
    line-height: 1.7;
    color: #94a3b8;
  }
  #algo-str-str-view .ss-log .active {
    color: #6366f1;
    background: rgba(99, 102, 241, 0.05);
    font-weight: 600;
  }
  #algo-str-str-view .ss-code {
    min-height: 0;
    display: flex;
    background: rgba(17, 17, 27, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    overflow: hidden;
    backdrop-filter: blur(18px) saturate(160%);
  }
  #algo-str-str-view .ss-code [data-code-panel] {
    flex: 1;
    min-width: 0;
  }
  /* Unified controls bar */
  #algo-str-str-view .ss-controls {
    padding: 12px 16px;
    background: rgba(24, 24, 37, 0.9);
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  #algo-str-str-view .ss-controls button {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.35rem;
    padding: 0.5rem 1rem;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  #algo-str-str-view .ss-controls #step-play {
    background: linear-gradient(135deg, #6366f1, #3b82f6);
    border: none;
    color: #1e1e2e;
  }
  #algo-str-str-view .ss-controls button:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
  }
  #algo-str-str-view .ss-controls button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }
  #algo-str-str-view .ss-counter {
    color: #94a3b8;
    font-size: 14px;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  #algo-str-str-view .control-divider {
    width: 1px;
    height: 24px;
    background: rgba(255, 255, 255, 0.1);
  }
  #algo-str-str-view #step-speed {
    accent-color: #6366f1;
    width: 100px;
  }
  /* Keyframe animations */
  @keyframes pulseCurrent {
    0%, 100% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.4); }
    50% { box-shadow: 0 0 0 8px rgba(249, 115, 22, 0); }
  }
  @keyframes mismatchShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  @media (max-width: 1100px) {
    #algo-str-str-view .ss-main { grid-template-columns: 1fr; overflow: auto; }
    #algo-str-str-view .ss-code { min-height: 360px; }
  }
</style>

<div class="ss-page">
  <div class="ss-header">
    <div class="ss-header-left">
      <div class="ss-icon-badge">🔍</div>
      <div>
        <h2>实现strStr()（KMP算法）</h2>
        <p class="ss-desc">LeetCode 28 · 字符串匹配的高效算法</p>
      </div>
    </div>
    <div class="ss-tip"><strong>KMP 算法：</strong>通过预处理模式串构建 next 数组，在失配时利用已匹配信息跳过不必要的比较，时间复杂度 O(n+m)。</div>
  </div>
  <div class="ss-main">
    <div class="ss-left">
      <section class="ss-card">
        <div class="ss-card-title">输入字符串</div>
        <div class="ss-input-row">
          <input id="ss-haystack" placeholder="haystack" value="hello">
          <input id="ss-needle" placeholder="needle" value="ll">
          <button id="ss-start">开始匹配</button>
        </div>
        <div class="ss-examples">
          <button class="ss-example-btn" data-h="hello" data-n="ll">hello / ll → 2</button>
          <button class="ss-example-btn" data-h="aaaaa" data-n="bba">aaaaa / bba → -1</button>
          <button class="ss-example-btn" data-h="abcabdabc" data-n="abc">abcabdabc / abc → 0</button>
        </div>
      </section>
      <div class="ss-stats">
        <div class="ss-stat"><label>haystack 指针 i</label><span id="ss-i">0</span></div>
        <div class="ss-stat"><label>needle 指针 j</label><span id="ss-j">0</span></div>
        <div class="ss-stat"><label>当前匹配长度</label><span id="ss-match-len">0</span></div>
        <div class="ss-stat"><label>找到位置</label><span id="ss-found">-1</span></div>
      </div>
      <section class="ss-card ss-visual">
        <div class="ss-card-title">字符串匹配过程</div>
        <div class="ss-track" id="ss-track"></div>
        <div class="ss-next-table">
          <div class="ss-next-table-title">Next 数组（失败函数）</div>
          <div class="ss-next-grid" id="ss-next-grid"></div>
        </div>
        <div class="ss-message" id="step-message">点击开始匹配</div>
      </section>
      <section class="ss-card">
        <div class="ss-card-title">执行日志</div>
        <div class="ss-log" id="ss-log"></div>
      </section>
    </div>
    <aside class="ss-code"><div data-code-panel></div></aside>
  </div>
  <div class="ss-controls">
    <button id="step-reset">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
        <path d="M3 3v5h5" />
      </svg>
      重置
    </button>
    <button id="step-prev">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m15 18-6-6 6-6" />
      </svg>
      上一步
    </button>
    <button id="step-play">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M5 3l14 9-14 9V3z" />
      </svg>
      播放
    </button>
    <button id="step-next">
      下一步
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m9 18 6-6-6-6" />
      </svg>
    </button>
    <div class="control-divider"></div>
    <span id="step-counter" class="ss-counter">步骤: 0 / 0</span>
    <div style="display:flex; align-items:center; gap:0.5rem;">
      <span class="ss-counter">速度</span>
      <input id="step-speed" type="range" min="400" max="2500" step="100" value="900">
      <span id="step-speed-label" class="ss-counter">0.9s</span>
    </div>
  </div>
</div>
