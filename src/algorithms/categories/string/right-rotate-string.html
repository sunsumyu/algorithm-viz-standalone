<div id="algo-right-rotate-view">
  <!-- 1. 顶栏 Header -->
  <header class="rr-header">
    <div class="rr-header-left">
      <div class="rr-icon-btn">🔄</div>
      <h1 class="rr-main-title">右旋转字符串</h1>
      <button id="btn-open-problem-modal" class="rr-btn-problem">📋 题目</button>
      <span class="rr-badge-mode">三次反转法·原地旋转</span>
      <span class="rr-badge-complexity">O(n) · O(1)</span>
    </div>

    <div class="rr-header-right">
      <div class="rr-input-group">
        <label for="input-s">s:</label>
        <input type="text" id="input-s" value="abcdefg" style="width: 80px;" />
      </div>
      <div class="rr-input-group">
        <label for="input-k">k:</label>
        <input type="number" id="input-k" value="2" min="1" max="10" style="width: 42px;" />

      <button id="btn-generate" class="rr-btn-generate">

      </button>
      <button id="btn-reset" class="rr-btn-reset">

      </button>
    </div>
  </header>

  <!-- 2. 主演示区 4-Card 布局 -->
  <main class="rr-main-layout">

    <!-- ================= 左侧：双看板 + 底部进度条 ================= -->
    <section class="rr-left-section">

      <!-- 卡片 1: 三次反转沙盘 -->
      <div class="rr-card">
        <div class="rr-card-header">
          <div class="rr-card-title">
            <span>📊 三次反转沙盘</span>
          </div>
          <div class="rr-stage-pills">
            <span class="rr-stage-pill is-active" id="pill-stage-1">1. 反转整体</span>
            <span class="rr-stage-pill" id="pill-stage-2">2. 反转前 k</span>
            <span class="rr-stage-pill" id="pill-stage-3">3. 反转后 n-k</span>

        <!-- 字符展示盒 -->
        <div class="rr-sandbox-wrap">
          <div class="rr-track-row" id="rr-track-row"></div>
        </div>

        <!-- 预设案例栏：单一外框统一包裹，左固定标签，右侧按钮换行完美左对齐 -->

          <span class="rr-preset-label">预设案例:</span>
          <div class="rr-preset-list">
            <button class="rr-chip" data-s="abcdefg" data-k="2">示例 1: ("abcdefg", k=2)</button>
            <button class="rr-chip" data-s="lrloseumgh" data-k="6">示例 2: ("lrloseumgh", k=6)</button>
            <button class="rr-chip" data-s="helloworld" data-k="5">对半旋转: ("helloworld", k=5)</button>
            <button class="rr-chip" data-s="abc" data-k="1">短字符串: ("abc", k=1)</button>
          </div>
        </div>
      </div>

      <div class="rr-playback-bar">
        <input type="range" id="slider-progress" min="0" max="0" value="0" class="rr-slider" />
        <div class="rr-counter-badge">
          <span id="step-cur" style="color: #2563eb;">0</span> / <span id="step-total">0</span>
        </div>
        <div style="display: flex; align-items: center; gap: 4px; flex-shrink: 0;">
          <button id="btn-step-prev" title="上一步" class="rr-ctrl-btn">◀</button>
          <button id="btn-play-pause" title="自动播放/暂停" class="rr-play-circle-btn">
            <span id="play-icon">▶</span>
          </button>
          <button id="btn-step-next" title="下一步" class="rr-ctrl-btn">▶</button>
        </div>
        <div style="display: flex; align-items: center; gap: 4px; margin-left: 6px;">
          <select id="select-speed" style="padding: 2px 6px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 11px; background: #ffffff;">
            <option value="1200">慢速</option>
            <option value="600" selected>正常</option>
            <option value="250">快速</option>
          </select>
        </div>
      </div>

      <!-- 卡片 2: 状态空间与指标监视器 -->
      <div class="rr-card">

          <div>

          <span id="badge-phase" class="rr-counter-badge" style="color:#2563eb; background:#eff6ff; border-color:#bfdbfe;">反转整体</span>
        </div>

        <!-- 状态空间展示盒 -->

          <div class="rr-metrics-grid">

            </div>
            <div class="rr-metric-card">
              <span class="rr-metric-label">反转区间 [L, R]</span>

            </div>
            <div class="rr-metric-card">
              <span class="rr-metric-label">旋转量 k</span>
              <span class="rr-metric-val" id="metric-k" style="color: #f59e0b;">2</span>
            </div>
            <div class="rr-metric-card">
              <span class="rr-metric-label">执行状态</span>
              <span class="rr-metric-val" id="metric-status" style="color: #0f172a;">反转整体</span>
            </div>
          </div>

          <div class="rr-formula-box" id="rr-formula-box">
            <span>当前操作:</span> <strong id="formula-op" style="color: #2563eb;">reverse(0, n - 1)</strong>
          </div>

          <div class="rr-live-alert">
            <span>💡</span> <span id="rr-live-text">准备就绪，点击运行开始三次反转法。</span>
          </div>
        </div>
      </div>

    </section>

    <section class="rr-right-section">

      <div class="rr-dark-terminal">
        <div class="rr-terminal-header">

          <div class="rr-tab-group">
            <button id="btn-tab-code" class="rr-tab-item active">💻 代码调试</button>
            <button id="btn-tab-problem" class="rr-tab-item">📋 题目描述</button>
            <button id="btn-tab-analysis" class="rr-tab-item">💡 算法精讲</button>
          </div>

              <span class="rr-dot" style="background:#22c55e;"></span>
            </div>
          </div>
        </div>

        <div id="code-view-container" style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;">
          <div class="rr-terminal-body">
            <div id="code-lines-wrapper">
              <!-- 动态装载代码行 -->
            </div>
          </div>
        </div>

        <!-- 容器 2: 题目完整描述视图 -->
        <div id="problem-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载题目内容 -->
        </div>

        <!-- 容器 3: 算法精讲视图 -->
        <div id="analysis-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载精讲内容 -->
        </div>
      </div>

      <!-- 卡片 4: 独立执行日志卡片 -->
      <div class="rr-log-card">
        <div class="rr-log-header">
          <div class="rr-log-header-title">
            <span>📜 执行日志</span>
          </div>
          <span id="log-count" class="rr-log-count">0 条记录</span>
        </div>

        <div id="log-container" class="rr-log-body">
          <!-- 动态填充日志条目 -->
        </div>
      </div>

    </section>

  </main>

    <div class="rr-modal-content">
      <div class="rr-modal-header">

          <span>📋 算法原理与题目说明</span>

      </div>
      <div id="modal-problem-body" class="rr-modal-body">
        <!-- 动态装载题目内容 -->
      </div>
    </div>
  </div>
