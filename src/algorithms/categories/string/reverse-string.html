<style>
  #algo-reverse-string-view {
    width: 100%;
    height: 100%;
    background:
      radial-gradient(ellipse at 8% 6%, rgba(251, 191, 36, 0.18), transparent 55%),
      radial-gradient(ellipse at 92% 94%, rgba(251, 146, 60, 0.18), transparent 55%),
      linear-gradient(135deg, #181229, #1a162c, #11131d);
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  #algo-reverse-string-view .rs-page {
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #algo-reverse-string-view .rs-header {
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 18px;
    flex-shrink: 0;
  }
  #algo-reverse-string-view .rs-header-left {
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  #algo-reverse-string-view .rs-icon-badge {
    width: 44px;
    height: 44px;
    border-radius: 11px;
    background: linear-gradient(135deg, #fbbf24, #fb923c);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  #algo-reverse-string-view h2 {
    margin: 0 0 5px;
    font-size: 22px;
    font-weight: 800;
    background: linear-gradient(135deg, #fbbf24, #fb923c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  #algo-reverse-string-view .rs-desc {
    margin: 0;
    color: #94a3b8;
    font-size: 13px;
    line-height: 1.5;
  }
  #algo-reverse-string-view .rs-tip {
    max-width: 420px;
    padding: 9px 12px;
    border-radius: 10px;
    background: rgba(251, 191, 36, 0.1);
    border: 1px solid rgba(251, 191, 36, 0.24);
    color: #fde68a;
    font-size: 13px;
    line-height: 1.55;
  }
  #algo-reverse-string-view .rs-tip strong { color: #fbbf24; }
  #algo-reverse-string-view .rs-main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 420px;
    gap: 14px;
    padding: 14px;
    overflow: hidden;
  }
  #algo-reverse-string-view .rs-left {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
    padding-right: 4px;
  }
  /* Glass cards */
  #algo-reverse-string-view .glass-card,
  #algo-reverse-string-view .rs-card {
    backdrop-filter: blur(18px) saturate(160%);
    background: rgba(20, 18, 38, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    overflow: hidden;
  }
  #algo-reverse-string-view .rs-card-title {
    padding: 11px 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    display: flex;
    justify-content: space-between;
    color: #e2e8f0;
    font-weight: 700;
    font-size: 14px;
  }
  #algo-reverse-string-view .rs-input-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 14px;
  }
  #algo-reverse-string-view input {
    width: 100%;
    padding: 9px 11px;
    border-radius: 10px;
    border: 1px solid rgba(100, 116, 139, 0.3);
    background: rgba(17, 17, 27, 0.7);
    color: #e2e8f0;
    font-family: Consolas, monospace;
    outline: none;
    transition: border-color 0.2s;
  }
  #algo-reverse-string-view input:focus {
    border-color: rgba(251, 191, 36, 0.5);
  }
  #algo-reverse-string-view button {
    padding: 8px 14px;
    border: 1px solid rgba(100, 116, 139, 0.3);
    border-radius: 10px;
    background: rgba(100, 116, 139, 0.2);
    color: #e2e8f0;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 14px;
  }
  #algo-reverse-string-view button:hover:not(:disabled) {
    background: linear-gradient(135deg, #fbbf24, #fb923c);
    border-color: transparent;
    color: #1e1e2e;
  }
  #algo-reverse-string-view button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  #algo-reverse-string-view .rs-examples {
    padding: 0 14px 14px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  #algo-reverse-string-view .rs-example-btn {
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 12px;
  }
  /* Stat panel */
  #algo-reverse-string-view .rs-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  #algo-reverse-string-view .rs-stat {
    position: relative;
    overflow: hidden;
    padding: 12px 12px 12px 18px;
    backdrop-filter: blur(18px) saturate(160%);
    background: rgba(20, 18, 38, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }
  #algo-reverse-string-view .rs-stat::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: linear-gradient(180deg, #fbbf24, #fb923c);
    border-radius: 2px 0 0 2px;
  }
  #algo-reverse-string-view .rs-stat label {
    display: block;
    margin-bottom: 6px;
    color: #94a3b8;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }
  #algo-reverse-string-view .rs-stat span {
    color: #fbbf24;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 20px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  #algo-reverse-string-view .rs-visual {
    flex: 1;
    min-height: 230px;
    display: flex;
    flex-direction: column;
  }
  #algo-reverse-string-view .rs-track {
    flex: 1;
    min-height: 0;
    padding: 28px 18px 18px;
    overflow: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  #algo-reverse-string-view .rs-cell {
    width: 50px;
    height: 56px;
    border-radius: 12px;
    border: 1px solid rgba(100, 116, 139, 0.3);
    background: rgba(17, 17, 27, 0.7);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    transition: all 0.25s ease;
    position: relative;
    transform-origin: center bottom;
  }
  #algo-reverse-string-view .rs-cell .idx {
    color: #64748b;
    font-size: 11px;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  #algo-reverse-string-view .rs-cell .val {
    color: #e2e8f0;
    font-weight: 800;
    font-size: 20px;
  }
  #algo-reverse-string-view .rs-cell.left {
    border-color: #fbbf24;
    box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.18);
    animation: pulseLeft 1.2s infinite;
  }
  #algo-reverse-string-view .rs-cell.right {
    border-color: #fb923c;
    box-shadow: 0 0 0 3px rgba(251, 146, 60, 0.18);
    animation: pulseRight 1.2s infinite;
  }
  #algo-reverse-string-view .rs-cell.swapped {
    background: rgba(251, 191, 36, 0.14);
    border-color: #fbbf24;
    animation: swapArc 0.6s ease;
  }
  #algo-reverse-string-view .rs-ptr {
    position: absolute;
    top: -18px;
    font-size: 11px;
    font-weight: 700;
  }
  #algo-reverse-string-view .rs-ptr.left { color: #fbbf24; }
  #algo-reverse-string-view .rs-ptr.right { color: #fb923c; }
  #algo-reverse-string-view .rs-message {
    margin: 0 16px 16px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(251, 191, 36, 0.22);
    background: rgba(251, 191, 36, 0.08);
    line-height: 1.5;
    font-size: 14px;
    color: #fde68a;
  }
  #algo-reverse-string-view .rs-log {
    min-height: 80px;
    max-height: 110px;
    padding: 10px 14px;
    overflow: auto;
    background: rgba(17, 17, 27, 0.7);
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 12px;
    line-height: 1.7;
    color: #94a3b8;
  }
  #algo-reverse-string-view .rs-log .active {
    color: #fbbf24;
    background: rgba(251, 191, 36, 0.05);
    font-weight: 600;
  }
  #algo-reverse-string-view .rs-code {
    min-height: 0;
    display: flex;
    background: rgba(17, 17, 27, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    overflow: hidden;
    backdrop-filter: blur(18px) saturate(160%);
  }
  #algo-reverse-string-view .rs-code [data-code-panel] {
    flex: 1;
    min-width: 0;
  }
  /* Unified controls bar */
  #algo-reverse-string-view .rs-controls {
    padding: 12px 16px;
    background: rgba(24, 24, 37, 0.9);
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  #algo-reverse-string-view .rs-controls button {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.35rem;
    padding: 0.5rem 1rem;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  #algo-reverse-string-view .rs-controls #step-play {
    background: linear-gradient(135deg, #fbbf24, #fb923c);
    border: none;
    color: #1e1e2e;
  }
  #algo-reverse-string-view .rs-controls button:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(251, 191, 36, 0.2);
  }
  #algo-reverse-string-view .rs-controls button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }
  #algo-reverse-string-view .rs-counter {
    color: #94a3b8;
    font-size: 14px;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  #algo-reverse-string-view .control-divider {
    width: 1px;
    height: 24px;
    background: rgba(255, 255, 255, 0.1);
  }
  #algo-reverse-string-view #step-speed {
    accent-color: #fbbf24;
    width: 100px;
  }
  /* Keyframe animations */
  @keyframes pulseLeft {
    0%, 100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.4); }
    50% { box-shadow: 0 0 0 8px rgba(251, 191, 36, 0); }
  }
  @keyframes pulseRight {
    0%, 100% { box-shadow: 0 0 0 0 rgba(251, 146, 60, 0.4); }
    50% { box-shadow: 0 0 0 8px rgba(251, 146, 60, 0); }
  }
  @keyframes swapArc {
    0% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(8deg); }
    100% { transform: translateY(0) rotate(0deg); }
  }
  @keyframes mismatchShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  #algo-reverse-string-view .rs-cell.swapped.mismatch {
    animation: mismatchShake 0.4s ease;
  }
  @media (max-width: 1100px) {
    #algo-reverse-string-view .rs-main { grid-template-columns: 1fr; overflow: auto; }
    #algo-reverse-string-view .rs-code { min-height: 360px; }
  }
</style>

<div class="rs-page">
  <div class="rs-header">
    <div class="rs-header-left">
      <div class="rs-icon-badge">↔️</div>
      <div>
        <h2>反转字符串（双指针）</h2>
        <p class="rs-desc">LeetCode 344：原地反转字符数组</p>
      </div>
    </div>
    <div class="rs-tip"><strong>首尾双指针：</strong>left、right 从两端向中间逼近，每步交换两个字符并各自内移。动画演示交换弧线。</div>
  </div>
  <div class="rs-main">
    <div class="rs-left">
      <section class="rs-card">
        <div class="rs-card-title">输入字符串</div>
        <div class="rs-input-row">
          <input id="rs-input" value="hello">
          <button id="rs-start">开始反转</button>
        </div>
        <div class="rs-examples">
          <button class="rs-example-btn" data-val="hello">hello</button>
          <button class="rs-example-btn" data-val="abcdef">abcdef</button>
          <button class="rs-example-btn" data-val="算法">算法</button>
        </div>
      </section>
      <div class="rs-stats">
        <div class="rs-stat"><label>left</label><span id="rs-left">0</span></div>
        <div class="rs-stat"><label>right</label><span id="rs-right">0</span></div>
        <div class="rs-stat"><label>交换次数</label><span id="rs-swap">0</span></div>
      </div>
      <section class="rs-card rs-visual">
        <div class="rs-card-title">字符数组</div>
        <div class="rs-track" id="rs-track"></div>
        <div class="rs-message" id="step-message">点击开始反转</div>
      </section>
      <section class="rs-card">
        <div class="rs-card-title">执行日志</div>
        <div class="rs-log" id="rs-log"></div>
      </section>
    </div>
    <aside class="rs-code"><div data-code-panel></div></aside>
  </div>
  <div class="rs-controls">
    <button id="step-reset">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
        <path d="M3 3v5h5" />
      </svg>
      重置
    </button>
    <button id="step-prev">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m15 18-6-6 6-6" />
      </svg>
      上一步
    </button>
    <button id="step-play">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M5 3l14 9-14 9V3z" />
      </svg>
      播放
    </button>
    <button id="step-next">
      下一步
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m9 18 6-6-6-6" />
      </svg>
    </button>
    <div class="control-divider"></div>
    <span id="step-counter" class="rs-counter">步骤: 0 / 0</span>
    <div style="display:flex; align-items:center; gap:0.5rem;">
      <span class="rs-counter">速度</span>
      <input id="step-speed" type="range" min="400" max="2500" step="100" value="900">
      <span id="step-speed-label" class="rs-counter">0.9s</span>
    </div>
  </div>
</div>
