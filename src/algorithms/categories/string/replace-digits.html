      <button id="btn-open-problem-modal" class="rd-btn-problem">📋 题目</button>
      <span class="rd-badge-mode">从后向前双指针·原地替换</span>
      <span class="rd-badge-complexity">O(n) · O(1)</span>
    </div>

    <div class="rd-header-right">
      <div class="rd-input-group">
        <label for="input-s">字符串:</label>
        <input type="text" id="input-s" value="a1b2c" style="width: 80px;" placeholder="字符串" />
      </div>
      <button id="btn-generate" class="rd-btn-generate">
        <span>▶ 运行</span>
      </button>
      <button id="btn-reset" class="rd-btn-reset">
        重置
      </button>
    </div>
  </header>

  <!-- 2. 主演示区 4-Card 布局 -->
  <main class="rd-main-layout">

    <!-- ================= 左侧：双看板 + 底部进度条 ================= -->
    <section class="rd-left-section">

      <!-- 卡片 1: 字符沙盘 -->
      <div class="rd-card">
        <div class="rd-card-header">
          <div class="rd-card-title">
            <span>📊 预扩容字符数组与从后向前填充沙盘</span>
          </div>
          <div class="rd-legend-bar">
            <div><span class="rd-legend-dot" style="background:#2563eb;"></span> oldIndex (读)</div>
            <div><span class="rd-legend-dot" style="background:#f59e0b;"></span> newIndex (写)</div>
            <div><span class="rd-legend-dot" style="background:#10b981;"></span> "number"</div>
          </div>
        </div>

        <!-- 字符展示盒 -->
        <div class="rd-sandbox-wrap">
          <div class="rd-track-row" id="rd-track-row"></div>
        </div>

        <!-- 预设案例栏：单一外框统一包裹，左固定标签，右侧按钮换行完美左对齐 -->
        <div class="rd-preset-bar">
          <span class="rd-preset-label">预设案例:</span>
          <div class="rd-preset-list">
            <button class="rd-chip" data-s="a1b2c">示例 1: ("a1b2c")</button>
            <button class="rd-chip" data-s="123">纯数字: ("123")</button>
            <button class="rd-chip" data-s="hello">纯字母: ("hello")</button>
            <button class="rd-chip" data-s="a9b">单个数字: ("a9b")</button>
          </div>
        </div>
      </div>

      <!-- 贯穿式 Scrubber 步数进度条与播放控制器 -->
      <div class="rd-playback-bar">
        <input type="range" id="slider-progress" min="0" max="0" value="0" class="rd-slider" />
        <div class="rd-counter-badge">
          <span id="step-cur" style="color: #2563eb;">0</span> / <span id="step-total">0</span>
        </div>
        <div style="display: flex; align-items: center; gap: 4px; flex-shrink: 0;">
          <button id="btn-step-prev" title="上一步" class="rd-ctrl-btn">◀</button>
          <button id="btn-play-pause" title="自动播放/暂停" class="rd-play-circle-btn">
            <span id="play-icon">▶</span>
          </button>
          <button id="btn-step-next" title="下一步" class="rd-ctrl-btn">▶</button>
        </div>
        <div style="display: flex; align-items: center; gap: 4px; margin-left: 6px;">
          <select id="select-speed" style="padding: 2px 6px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 11px; background: #ffffff;">
            <option value="1200">慢速</option>
            <option value="600" selected>正常</option>
            <option value="250">快速</option>
          </select>
        </div>
      </div>

      <!-- 卡片 2: 状态空间与指标监视器 -->
      <div class="rd-card">
        <div class="rd-card-header">
          <div>
            <div class="rd-card-title">🧭 替换与扩容监视器</div>
            <div class="rd-card-desc">读取指针、写入指针、数字字符数与当前阶段</div>
          </div>
          <span id="badge-phase" class="rd-counter-badge" style="color:#2563eb; background:#eff6ff; border-color:#bfdbfe;">初始化</span>
        </div>

        <!-- 状态空间展示盒 -->
        <div class="rd-state-space-box">
          <div class="rd-metrics-grid">
            <div class="rd-metric-card">
              <span class="rd-metric-label">读取指针 oldIndex</span>
              <span class="rd-metric-val" id="metric-old-idx" style="color: #3b82f6;">—</span>
            </div>
            <div class="rd-metric-card">
              <span class="rd-metric-label">写入指针 newIndex</span>
              <span class="rd-metric-val" id="metric-new-idx" style="color: #f59e0b;">—</span>
            </div>
            <div class="rd-metric-card">
              <span class="rd-metric-label">数字个数 count</span>
              <span class="rd-metric-val" id="metric-digits" style="color: #10b981;">0</span>
            </div>
            <div class="rd-metric-card">
              <span class="rd-metric-label">当前阶段</span>
              <span class="rd-metric-val" id="metric-phase" style="color: #0f172a;">初始化</span>
            </div>
          </div>

          <div class="rd-formula-box" id="rd-formula-box">
            <span>扩容公式:</span> <strong id="formula-resize" style="color: #2563eb;">newSize = oldSize + count * 5</strong>
          </div>

          <div class="rd-live-alert">
            <span>💡</span> <span id="rd-live-text">准备就绪，点击运行开始从后向前替换数字。</span>
          </div>
        </div>
      </div>

    </section>

    <!-- ================= 右侧：代码终端 + 执行日志 ================= -->
    <section class="rd-right-section">

      <!-- 卡片 3: 暗色代码终端面板 -->
      <div class="rd-dark-terminal">
        <div class="rd-terminal-header">
          <!-- 1. 主 Tab 切换器 (源码 / 题目 / 精讲) -->
          <div class="rd-tab-group">
            <button id="btn-tab-code" class="rd-tab-item active">💻 代码调试</button>
            <button id="btn-tab-problem" class="rd-tab-item">📋 题目描述</button>
            <button id="btn-tab-analysis" class="rd-tab-item">💡 算法精讲</button>
          </div>

          <!-- 2. 多语言切换器 -->
          <div class="rd-lang-group" id="code-lang-tabs">
            <button class="rd-lang-btn active" data-lang="java">Java</button>
            <button class="rd-lang-btn" data-lang="cpp">C++</button>
            <button class="rd-lang-btn" data-lang="python">Python</button>
            <button class="rd-lang-btn" data-lang="javascript">JS</button>
          </div>

          <!-- 3. 字号缩放器与 macOS 窗口微控制 -->
          <div class="rd-font-tools">
            <div class="rd-font-scaler">
              <button id="btn-code-font-dec" title="缩小代码字号">A-</button>
              <span id="code-font-indicator" class="rd-font-indicator">12</span>
              <button id="btn-code-font-inc" title="放大代码字号">A+</button>
            </div>

            <div class="rd-window-dots">
              <span class="rd-dot" style="background:#ef4444;"></span>
              <span class="rd-dot" style="background:#eab308;"></span>
              <span class="rd-dot" style="background:#22c55e;"></span>
            </div>
          </div>
        </div>

        <!-- 容器 1: 源码高亮与单步追踪视图 -->
        <div id="code-view-container" style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;">
          <div class="rd-terminal-body">
            <div id="code-lines-wrapper">
              <!-- 动态装载代码行 -->
            </div>
          </div>
        </div>

        <!-- 容器 2: 题目完整描述视图 -->
        <div id="problem-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载题目内容 -->
        </div>

        <!-- 容器 3: 算法精讲视图 -->
        <div id="analysis-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载精讲内容 -->
        </div>
      </div>

      <!-- 卡片 4: 独立执行日志卡片 -->
      <div class="rd-log-card">
        <div class="rd-log-header">
          <div class="rd-log-header-title">
            <span>📜 执行日志</span>
          </div>
          <span id="log-count" class="rd-log-count">0 条记录</span>
        </div>

        <div id="log-container" class="rd-log-body">
          <!-- 动态填充日志条目 -->
        </div>
      </div>

    </section>

  </main>

  <!-- 4. 力扣原题描述轻量模态弹窗 (Modal) -->
  <div id="modal-problem" class="rd-modal-backdrop hidden">
    <div class="rd-modal-content">
      <div class="rd-modal-header">
        <div class="rd-modal-title">
          <span>📋 算法原理与题目说明</span>
        </div>
        <button id="btn-close-problem-modal" class="rd-modal-close" title="关闭 (Esc)">✕</button>
      </div>
      <div id="modal-problem-body" class="rd-modal-body">
        <!-- 动态装载题目内容 -->
      </div>
    </div>
  </div>
</div>
