<style>
  #algo-mst-kruskal-view {
    width: 100%;
    height: 100%;
    color: #cdd6f4;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    position: relative;
    overflow: hidden;
  }

  #algo-mst-kruskal-view::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: radial-gradient(ellipse at 10% 5%, #14b8a655, transparent 55%),
                radial-gradient(ellipse at 90% 95%, #0d948855, transparent 55%),
                linear-gradient(135deg, #042f2e 0%, #134e4a 25%, #042f2e 50%, #115e59 75%, #042f2e 100%);
    z-index: -2;
  }

  #algo-mst-kruskal-view::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(4, 47, 46, 0.4), transparent 70%);
    z-index: -1;
  }

  #algo-mst-kruskal-view .mstk-page {
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .mstk-hero {
    padding: 16px 24px;
    background: rgba(20, 18, 38, 0.5);
    backdrop-filter: blur(18px) saturate(160%);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 0 0 16px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
  }

  .mstk-hero .mstk-title-wrapper {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .mstk-hero-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, #14b8a6, #0d9488);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: 0 4px 15px rgba(20, 184, 166, 0.3);
  }

  .mstk-hero-text h2 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 800;
    background: linear-gradient(135deg, #14b8a6, #0d9488);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .mstk-hero-text p {
    margin: 0;
    color: rgba(204, 214, 244, 0.8);
    font-size: 13px;
  }

  .mstk-tip {
    max-width: 480px;
    padding: 12px 16px;
    border-radius: 12px;
    background: rgba(20, 184, 166, 0.08);
    border: 1px solid rgba(20, 184, 166, 0.2);
    color: rgba(204, 214, 244, 0.9);
    font-size: 13px;
    line-height: 1.55;
  }

  .mstk-tip strong {
    color: #14b8a6;
    font-weight: 600;
  }

  #algo-mst-kruskal-view .mstk-layout {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 16px;
    padding: 16px;
    overflow: hidden;
  }

  @media (max-width: 1100px) {
    #algo-mst-kruskal-view .mstk-layout {
      grid-template-columns: 1fr;
      overflow: auto;
    }
  }

  .mstk-main {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow: hidden;
    flex: 1;
  }

  .mstk-card {
    background: rgba(20, 18, 38, 0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }

  .mstk-controls {
    padding: 14px 18px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .mstk-btn {
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: linear-gradient(135deg, #14b8a6, #0d9488);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
    box-shadow: 0 4px 15px rgba(20, 184, 166, 0.3);
  }

  .mstk-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(20, 184, 166, 0.4);
  }

  .mstk-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    padding: 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .mstk-stat {
    padding: 14px 0;
    position: relative;
    background: rgba(20, 18, 38, 0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    overflow: hidden;
  }

  .mstk-stat::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #14b8a6, #0d9488);
  }

  .mstk-stat-label {
    display: block;
    margin-bottom: 6px;
    color: rgba(204, 214, 244, 0.7);
    font-size: 12px;
  }

  .mstk-stat-val {
    color: #14b8a6;
    font-family: ui-monospace, monospace;
    font-size: 19px;
    font-weight: 700;
  }

  .mstk-graph-container {
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 280px;
  }

  .mstk-graph-container svg {
    width: 100%;
    max-width: 480px;
    height: 280px;
  }

  .mstk-edges-container {
    padding: 16px 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }

  .mstk-edges-title {
    color: rgba(204, 214, 244, 0.7);
    font-size: 12px;
    margin-bottom: 10px;
    font-weight: 600;
  }

  .mstk-edges-list {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    min-height: 36px;
    align-items: center;
  }

  .mstk-edge-item {
    padding: 5px 10px;
    border-radius: 8px;
    background: rgba(20, 184, 166, 0.12);
    border: 1px solid rgba(20, 184, 166, 0.25);
    color: #14b8a6;
    font-family: ui-monospace, monospace;
    font-size: 11px;
    font-weight: 600;
    animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    white-space: nowrap;
  }

  .mstk-edge-item.current {
    background: rgba(245, 158, 11, 0.2);
    border-color: #f59e0b;
    color: #f59e0b;
    box-shadow: 0 0 8px rgba(245, 158, 11, 0.3);
  }

  .mstk-edge-item.accepted {
    background: rgba(34, 197, 94, 0.2);
    border-color: rgba(34, 197, 94, 0.5);
    color: #22c55e;
  }

  .mstk-edge-item.rejected {
    background: rgba(239, 68, 68, 0.2);
    border-color: rgba(239, 68, 68, 0.5);
    color: #ef4444;
    text-decoration: line-through;
  }

  .mstk-uf-container {
    padding: 16px 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }

  .mstk-uf-title {
    color: rgba(204, 214, 244, 0.7);
    font-size: 12px;
    margin-bottom: 10px;
    font-weight: 600;
  }

  .mstk-uf-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    min-height: 36px;
    align-items: center;
    margin-bottom: 8px;
  }

  .mstk-uf-item {
    padding: 6px 10px;
    border-radius: 8px;
    background: rgba(20, 184, 166, 0.15);
    border: 1px solid rgba(20, 184, 166, 0.3);
    color: #14b8a6;
    font-family: ui-monospace, monospace;
    font-size: 12px;
    font-weight: 600;
    min-width: 32px;
    text-align: center;
    animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .mstk-uf-item .mstk-idx {
    display: block;
    font-size: 9px;
    color: rgba(204, 214, 244, 0.5);
    margin-bottom: 2px;
  }

  .mstk-uf-item.changed {
    background: rgba(20, 184, 166, 0.4);
    border-color: #14b8a6;
    box-shadow: 0 0 8px rgba(20, 184, 166, 0.4);
  }

  .mstk-message {
    margin: 0 14px 14px;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid rgba(20, 184, 166, 0.2);
    background: rgba(20, 184, 166, 0.08);
    color: #cdd6f4;
    font-size: 13px;
    line-height: 1.5;
  }

  .mstk-log {
    min-height: 0;
    max-height: 120px;
    padding: 14px 16px;
    overflow: auto;
    background: rgba(11, 10, 23, 0.8);
    font-family: ui-monospace, monospace;
    font-size: 12px;
    line-height: 1.7;
    color: rgba(204, 214, 244, 0.8);
  }

  .mstk-log div {
    padding: 2px 0;
  }

  .mstk-log div.active {
    color: #14b8a6;
    font-weight: 600;
  }

  .mstk-right {
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow: hidden;
  }

  .mstk-code-card {
    background: rgba(11, 10, 23, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    overflow: hidden;
    flex: 1;
  }

  .mstk-legend {
    background: rgba(20, 18, 38, 0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 14px;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .mstk-legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .mstk-legend-box {
    width: 16px;
    height: 16px;
    border-radius: 4px;
  }

  .mstk-playback {
    background: rgba(20, 18, 38, 0.5);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .mstk-pb-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .mstk-pb-btn {
    flex: 1;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(20, 184, 166, 0.1);
    color: #cdd6f4;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
  }

  .mstk-pb-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .mstk-pb-btn:not(:disabled):hover {
    background: rgba(20, 184, 166, 0.2);
    border-color: #14b8a6;
    transform: translateY(-1px);
  }

  .mstk-pb-btn.play {
    background: linear-gradient(135deg, #14b8a6, #0d9488);
    border: none;
    color: #fff;
    box-shadow: 0 4px 15px rgba(20, 184, 166, 0.3);
  }

  .mstk-pb-btn.play:not(:disabled):hover {
    box-shadow: 0 6px 20px rgba(20, 184, 166, 0.4);
  }

  .mstk-speed-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: rgba(204, 214, 244, 0.7);
  }

  .mstk-speed-row input {
    flex: 1;
    accent-color: #14b8a6;
  }

  .mstk-counter {
    color: rgba(204, 214, 244, 0.6);
    font-size: 13px;
    font-family: ui-monospace, monospace;
    text-align: center;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  @keyframes popIn {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes pathPulse {
    0%, 100% { stroke-opacity: 1; }
    50% { stroke-opacity: 0.5; }
  }

  @keyframes shakeIn {
    0% { transform: scale(0); opacity: 0; }
    50% { transform: scale(1.2) rotate(5deg); }
    70% { transform: scale(0.9) rotate(-3deg); }
    100% { transform: scale(1) rotate(0); }
  }

  .mstk-node {
    transition: all 0.3s ease;
  }

  .mstk-edge {
    transition: all 0.3s ease;
  }
</style>

<div class="mstk-page">
  <div class="mstk-hero">
    <div class="mstk-title-wrapper">
      <div class="mstk-hero-icon">🌲</div>
      <div class="mstk-hero-text">
        <h2>最小生成树之 Kruskal 算法</h2>
        <p>按权重排序所有边，依次加入不构成环的边来构建 MST</p>
      </div>
    </div>
    <div class="mstk-tip"><strong>Kruskal 核心：</strong>将所有边按权重从小到大排序，依次检查每条边：如果它的两端不在同一集合（不形成环），就加入 MST 并合并集合；否则跳过。使用并查集高效判环。</div>
  </div>

  <div class="mstk-layout">
    <div class="mstk-main">
      <div class="mstk-card">
        <div class="mstk-controls">
          <button id="mstk-start" class="mstk-btn">开始建树</button>
        </div>

        <div class="mstk-stats">
          <div class="mstk-stat"><span class="mstk-stat-label">当前边</span><span class="mstk-stat-val" id="mstk-current">-</span></div>
          <div class="mstk-stat"><span class="mstk-stat-label">MST边数</span><span class="mstk-stat-val" id="mstk-edges">0</span></div>
          <div class="mstk-stat"><span class="mstk-stat-label">MST权重</span><span class="mstk-stat-val" id="mstk-weight">0</span></div>
          <div class="mstk-stat"><span class="mstk-stat-label">决策</span><span class="mstk-stat-val" id="mstk-decision">-</span></div>
        </div>

        <div class="mstk-graph-container" id="mstk-graph"></div>

        <div class="mstk-edges-container">
          <div class="mstk-edges-title">排序后的边列表（按权重从小到大）</div>
          <div class="mstk-edges-list" id="mstk-edge-list"></div>
        </div>

        <div class="mstk-uf-container">
          <div class="mstk-uf-title">并查集 parent 数组（用于判环）</div>
          <div class="mstk-uf-row" id="mstk-parent"></div>
          <div class="mstk-uf-title" style="margin-top:8px;">并查集 rank 数组</div>
          <div class="mstk-uf-row" id="mstk-rank"></div>
        </div>

        <div class="mstk-message" id="step-message">点击「开始建树」用 Kruskal 算法构建最小生成树。</div>

        <div class="mstk-log" id="mstk-log"></div>
      </div>
    </div>

    <div class="mstk-right">
      <div data-code-panel class="mstk-code-card"></div>
      <div class="mstk-legend">
        <div class="mstk-legend-item"><span class="mstk-legend-box" style="background:rgba(20,184,166,0.2);border:2px solid #14b8a6"></span>未处理节点</div>
        <div class="mstk-legend-item"><span class="mstk-legend-box" style="background:rgba(34,197,94,0.4);border:2px solid #22c55e"></span>MST中的节点</div>
        <div class="mstk-legend-item"><span class="mstk-legend-box" style="background:#f59e0b"></span>当前检查边</div>
        <div class="mstk-legend-item"><span class="mstk-legend-box" style="background:rgba(239,68,68,0.3);border:2px solid #ef4444"></span>拒绝(成环)</div>
      </div>
      <div class="mstk-playback">
        <div class="mstk-pb-row">
          <button id="step-reset" class="mstk-pb-btn">重置</button>
          <button id="step-prev" class="mstk-pb-btn">上一步</button>
          <button id="step-play" class="mstk-pb-btn play">播放</button>
          <button id="step-next" class="mstk-pb-btn">下一步</button>
        </div>
        <div class="mstk-speed-row">
          <span>速度</span>
          <input id="mstk-speed" type="range" min="150" max="1500" step="100" value="700" />
          <span id="mstk-speed-label" style="font-family:ui-monospace,monospace;font-size:13px;color:rgba(204,214,244,0.7);margin-left:4px;">0.7s</span>
        </div>
        <div id="step-counter" class="mstk-counter">步骤: 1 / 1</div>
      </div>
    </div>
  </div>
</div>
