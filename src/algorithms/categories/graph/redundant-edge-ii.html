          </button>
          <button id="btn-step-next" title="下一步" class="re2-ctrl-btn">▶</button>
        </div>
        <div style="display: flex; align-items: center; gap: 4px; margin-left: 6px;">
          <select id="select-speed" style="padding: 2px 6px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 11px; background: #ffffff;">
            <option value="1200">慢速</option>
            <option value="500" selected>正常</option>
            <option value="200">快速</option>
          </select>
        </div>
      </div>

      <!-- 卡片 2: 有向树三情形指标监视器 -->
      <div class="re2-card">
        <div class="re2-card-header">
          <div>
            <div class="re2-card-title">🧭 有向树三情形指标监视器</div>
            <div class="re2-card-desc">入度为 2 双亲节点检测、有向环判定与最终冗余边判定</div>
          </div>
          <span id="badge-redundant-edge" class="re2-counter-badge" style="color:#e11d48; background:#fff1f2; border-color:#fecdd3;">冗余边: 待检测</span>
        </div>

        <!-- 状态空间展示盒 -->
        <div class="re2-state-space-box">
          <div class="re2-metrics-grid">
            <div class="re2-metric-card">
              <span class="re2-metric-label">当前阶段 Stage</span>
              <span class="re2-metric-val" id="metric-stage" style="color: #e11d48;">检测入度</span>
            </div>
            <div class="re2-metric-card">
              <span class="re2-metric-label">入度为 2 候选边对</span>
              <span class="re2-metric-val" id="metric-two-parents" style="color: #3b82f6;">无</span>
            </div>
            <div class="re2-metric-card">
              <span class="re2-metric-label">有向环检测 Has Cycle</span>
              <span class="re2-metric-val" id="metric-cycle-detect" style="color: #10b981;">false</span>
            </div>
            <div class="re2-metric-card">
              <span class="re2-metric-label">最终冗余有向边</span>
              <span class="re2-metric-val" id="metric-redundant" style="color: #e11d48;">[—, —]</span>
            </div>
          </div>

          <div class="re2-formula-box">
            <span style="color:#64748b;">分类决策:</span>
            <strong id="formula-action" style="color: #e11d48;">1. 入度为2(双亲)且有环 2. 入度为2无环 3. 纯有向环</strong>
          </div>

          <div class="re2-live-alert">
            <span>💡</span> <span id="re2-live-text">准备就绪，点击运行开始冗余连接 II 分析。</span>
          </div>
        </div>
      </div>

    </section>

    <!-- ================= 右侧：代码终端 + 执行日志 ================= -->
    <section class="re2-right-section">

      <!-- 卡片 3: 暗色代码终端面板 -->
      <div class="re2-dark-terminal">
        <div class="re2-terminal-header">
          <!-- 1. 主 Tab 切换器 (源码 / 题目 / 精讲) -->
          <div class="re2-tab-group">
            <button id="btn-tab-code" class="re2-tab-item active">💻 代码调试</button>
            <button id="btn-tab-problem" class="re2-tab-item">📋 题目描述</button>
            <button id="btn-tab-analysis" class="re2-tab-item">💡 算法精讲</button>
          </div>

          <!-- 2. 多语言切换器 -->
          <div class="re2-lang-group" id="code-lang-tabs">
            <button class="re2-lang-btn active" data-lang="java">Java</button>
            <button class="re2-lang-btn" data-lang="cpp">C++</button>
            <button class="re2-lang-btn" data-lang="python">Python</button>
            <button class="re2-lang-btn" data-lang="javascript">JS</button>
          </div>

          <!-- 3. 字号缩放器与 macOS 窗口微控制 -->
          <div class="re2-font-tools">
            <div class="re2-font-scaler">
              <button id="btn-code-font-dec" title="缩小代码字号">A-</button>
              <span id="code-font-indicator" class="re2-font-indicator">12</span>
              <button id="btn-code-font-inc" title="放大代码字号">A+</button>
            </div>

            <div class="re2-window-dots">
              <span class="re2-dot" style="background:#ef4444;"></span>
              <span class="re2-dot" style="background:#eab308;"></span>
              <span class="re2-dot" style="background:#22c55e;"></span>
            </div>
          </div>
        </div>

        <!-- 容器 1: 源码高亮与单步追踪视图 -->
        <div id="code-view-container" style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;">
          <div class="re2-terminal-body">
            <div id="code-lines-wrapper">
              <!-- 动态装载代码行 -->
            </div>
          </div>
        </div>

        <!-- 容器 2: 题目完整描述视图 -->
        <div id="problem-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载题目内容 -->
        </div>

        <!-- 容器 3: 算法精讲视图 -->
        <div id="analysis-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载精讲内容 -->
        </div>
      </div>

      <!-- 卡片 4: 独立执行日志卡片 -->
      <div class="re2-log-card">
        <div class="re2-log-header">
          <div class="re2-log-header-title">
            <span>📜 执行日志</span>
          </div>
          <span id="log-count" class="re2-log-count">0 条记录</span>
        </div>

        <div id="log-container" class="re2-log-body">
          <!-- 动态填充日志条目 -->
        </div>
      </div>

    </section>

  </main>

  <!-- 4. 力扣原题描述轻量模态弹窗 (Modal) -->
  <div id="modal-problem" class="re2-modal-backdrop hidden">
    <div class="re2-modal-content">
      <div class="re2-modal-header">
        <div class="re2-modal-title">
          <span>📋 力扣原题描述</span>
        </div>
        <button id="btn-close-problem-modal" class="re2-modal-close" title="关闭 (Esc)">✕</button>
      </div>
      <div id="modal-problem-body" class="re2-modal-body">
        <!-- 动态装载题目内容 -->
      </div>
    </div>
  </div>
</div>
