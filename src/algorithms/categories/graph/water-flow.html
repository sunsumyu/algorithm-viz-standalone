<style>
  #algo-water-flow-view {
    width: 100%;
    height: 100%;
    color: #cdd6f4;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    position: relative;
    overflow: hidden;
  }

  #algo-water-flow-view::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at 10% 5%, #3b82f655, transparent 55%),
                radial-gradient(ellipse at 90% 95%, #6366f155, transparent 55%),
                linear-gradient(135deg, #0a1628 0%, #1e3a5f 25%, #0a1628 50%, #1e1b4b 75%, #0a1628 100%);
    z-index: -2;
  }

  #algo-water-flow-view::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(10, 22, 40, 0.4), transparent 70%);
    z-index: -1;
  }

  .wf-page { height: 100%; display: flex; flex-direction: column; overflow: hidden; }

  .wf-hero {
    padding: 16px 24px;
    background: rgba(20, 18, 38, 0.5);
    backdrop-filter: blur(18px) saturate(160%);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    border-radius: 0 0 16px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
  }

  .wf-hero .wf-title-wrapper { display: flex; align-items: center; gap: 12px; }

  .wf-hero-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, #3b82f6, #6366f1);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    box-shadow: 0 4px 15px rgba(59,130,246,0.3);
  }

  .wf-hero-text h2 {
    margin: 0 0 4px;
    font-size: 22px; font-weight: 800;
    background: linear-gradient(135deg, #3b82f6, #6366f1);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .wf-hero-text p { margin: 0; color: rgba(204,214,244,0.8); font-size: 13px; }

  .wf-tip {
    max-width: 480px; padding: 12px 16px; border-radius: 12px;
    background: rgba(59,130,246,0.08); border: 1px solid rgba(59,130,246,0.2);
    color: rgba(204,214,244,0.9); font-size: 13px; line-height: 1.55;
  }

  .wf-tip strong { color: #3b82f6; font-weight: 600; }

  #algo-water-flow-view .wf-layout {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: 1fr 380px;
    gap: 16px; padding: 16px; overflow: hidden;
  }

  @media (max-width: 1100px) {
    #algo-water-flow-view .wf-layout { grid-template-columns: 1fr; overflow: auto; }
  }

  .wf-main { min-width: 0; display: flex; flex-direction: column; gap: 16px; overflow: hidden; flex: 1; }

  .wf-card {
    background: rgba(20,18,38,0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  }

  .wf-controls {
    padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }

  .wf-input {
    flex: 1; min-width: 140px;
    padding: 10px 14px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(11,10,23,0.8); color: #cdd6f4;
    font-family: ui-monospace, monospace; font-size: 13px;
    outline: none; transition: border-color 0.2s, box-shadow 0.2s;
  }

  .wf-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }

  .wf-btn {
    padding: 10px 18px; border-radius: 10px; border: none;
    background: linear-gradient(135deg, #3b82f6, #6366f1);
    color: #fff; font-weight: 600; cursor: pointer; font-size: 13px;
    transition: all 0.2s; box-shadow: 0 4px 15px rgba(59,130,246,0.3);
  }

  .wf-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59,130,246,0.4); }

  .wf-example {
    padding: 8px 14px; border-radius: 999px;
    border: 1px solid rgba(59,130,246,0.3);
    background: rgba(59,130,246,0.1); color: #cdd6f4;
    font-size: 12px; cursor: pointer; transition: all 0.2s;
  }

  .wf-example:hover { background: rgba(59,130,246,0.2); border-color: #3b82f6; }

  .wf-stats {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 12px; padding: 14px; border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .wf-stat {
    padding: 14px 0; position: relative;
    background: rgba(20,18,38,0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; overflow: hidden;
  }

  .wf-stat::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, #3b82f6, #6366f1);
  }

  .wf-stat-label { display: block; margin-bottom: 6px; color: rgba(204,214,244,0.7); font-size: 12px; }
  .wf-stat-val { color: #3b82f6; font-family: ui-monospace, monospace; font-size: 19px; font-weight: 700; }

  .wf-grid-container {
    padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 260px;
  }

  .wf-grid {
    display: grid; gap: 4px;
  }

  .wf-cell {
    width: 56px; height: 56px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: ui-monospace, monospace; font-size: 16px; font-weight: 700;
    transition: all 0.3s ease;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .wf-message {
    margin: 0 14px 14px; padding: 12px 16px; border-radius: 12px;
    border: 1px solid rgba(59,130,246,0.2); background: rgba(59,130,246,0.08);
    color: #cdd6f4; font-size: 13px; line-height: 1.5;
  }

  .wf-log {
    min-height: 0; max-height: 130px; padding: 14px 16px; overflow: auto;
    background: rgba(11,10,23,0.8); font-family: ui-monospace, monospace;
    font-size: 12px; line-height: 1.7; color: rgba(204,214,244,0.8);
  }

  .wf-log div { padding: 2px 0; }
  .wf-log div.active { color: #3b82f6; font-weight: 600; }

  .wf-right { display: flex; flex-direction: column; gap: 16px; overflow: hidden; }

  .wf-code-card {
    background: rgba(11,10,23,0.8); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; overflow: hidden; flex: 1;
  }

  .wf-legend {
    background: rgba(20,18,38,0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 16px;
    padding: 14px; font-size: 12px; display: flex; flex-direction: column; gap: 8px;
  }

  .wf-legend-item { display: flex; align-items: center; gap: 10px; }
  .wf-legend-box { width: 16px; height: 16px; border-radius: 4px; }

  .wf-playback {
    background: rgba(20,18,38,0.5);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 16px;
    padding: 16px; display: flex; flex-direction: column; gap: 12px;
  }

  .wf-pb-row { display: flex; gap: 10px; align-items: center; }

  .wf-pb-btn {
    flex: 1; padding: 12px 16px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(59,130,246,0.1); color: #cdd6f4;
    cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s;
  }

  .wf-pb-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .wf-pb-btn:not(:disabled):hover { background: rgba(59,130,246,0.2); border-color: #3b82f6; transform: translateY(-1px); }

  .wf-pb-btn.play {
    background: linear-gradient(135deg, #3b82f6, #6366f1);
    border: none; color: #fff; box-shadow: 0 4px 15px rgba(59,130,246,0.3);
  }

  .wf-pb-btn.play:not(:disabled):hover { box-shadow: 0 6px 20px rgba(59,130,246,0.4); }

  .wf-speed-row {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; color: rgba(204,214,244,0.7);
  }

  .wf-speed-row input { flex: 1; accent-color: #3b82f6; }

  .wf-counter {
    color: rgba(204,214,244,0.6); font-size: 13px;
    font-family: ui-monospace, monospace; text-align: center;
  }

  @keyframes wf-ripple {
    0% { transform: scale(0); opacity: 1; }
    100% { transform: scale(2.5); opacity: 0; }
  }

  @keyframes wf-glow {
    0%, 100% { box-shadow: 0 0 8px rgba(59,130,246,0.4); }
    50% { box-shadow: 0 0 18px rgba(99,102,241,0.7); }
  }

  .wf-cell.dual { animation: wf-glow 1.2s infinite; }
</style>

<div class="wf-page">
  <div class="wf-hero">
    <div class="wf-title-wrapper">
      <div class="wf-hero-icon">💧</div>
      <div class="wf-hero-text">
        <h2>高山流水</h2>
        <p>找出所有水流能同时到达左上和右下水域的格子</p>
      </div>
    </div>
    <div class="wf-tip"><strong>算法要点：</strong>从边界反向 DFS/BFS：水从高往低流，等价于从边界向高处搜索。两个方向都能到达的格子即为所求。</div>
  </div>

  <div class="wf-layout">
    <div class="wf-main">
      <div class="wf-card">
        <div class="wf-controls">
          <input id="wf-grid-input" class="wf-input" value="3,4,2,1;2,1,3,4;1,2,4,3;4,3,2,1" title="网格高度，行用分号分隔，列用逗号分隔" />
          <button id="wf-start" class="wf-btn">开始搜索</button>
          <button class="wf-example" data-grid="3,4,2,1;2,1,3,4;1,2,4,3;4,3,2,1">示例1</button>
          <button class="wf-example" data-grid="1,2,2;2,3,2;2,1,1">示例2</button>
        </div>

        <div class="wf-stats">
          <div class="wf-stat"><span class="wf-stat-label">当前步骤</span><span class="wf-stat-val" id="wf-phase">-</span></div>
          <div class="wf-stat"><span class="wf-stat-label">左上可达</span><span class="wf-stat-val" id="wf-tl-count">0</span></div>
          <div class="wf-stat"><span class="wf-stat-label">右下可达</span><span class="wf-stat-val" id="wf-br-count">0</span></div>
          <div class="wf-stat"><span class="wf-stat-label">双达格子</span><span class="wf-stat-val" id="wf-dual-count">0</span></div>
        </div>

        <div class="wf-grid-container" id="wf-grid"></div>

        <div class="wf-message" id="step-message">输入高度网格，点击「开始搜索」查看水流路径分析。</div>

        <div class="wf-log" id="wf-log"></div>
      </div>
    </div>

    <div class="wf-right">
      <div data-code-panel class="wf-code-card"></div>
      <div class="wf-legend">
        <div class="wf-legend-item"><span class="wf-legend-box" style="background:rgba(59,130,246,0.3)"></span>仅左上可达</div>
        <div class="wf-legend-item"><span class="wf-legend-box" style="background:rgba(99,102,241,0.3)"></span>仅右下可达</div>
        <div class="wf-legend-item"><span class="wf-legend-box" style="background:rgba(59,130,246,0.6);border:2px solid #6366f1"></span>双达（结果）</div>
      </div>
      <div class="wf-playback">
        <div class="wf-pb-row">
          <button id="step-reset" class="wf-pb-btn">重置</button>
          <button id="step-prev" class="wf-pb-btn">上一步</button>
          <button id="step-play" class="wf-pb-btn play">播放</button>
          <button id="step-next" class="wf-pb-btn">下一步</button>
        </div>
        <div class="wf-speed-row">
          <span>速度</span>
          <input id="wf-speed" type="range" min="150" max="1500" step="100" value="700" />
          <span id="wf-speed-label" style="font-family:ui-monospace,monospace;font-size:13px;color:rgba(204,214,244,0.7);margin-left:4px;">0.7s</span>
        </div>
        <div id="step-counter" class="wf-counter">步骤: 1 / 1</div>
      </div>
    </div>
  </div>
</div>
