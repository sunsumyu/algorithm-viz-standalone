<style>
  #algo-reachable-paths-view {
    width: 100%;
    height: 100%;
    color: #cdd6f4;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    position: relative;
    overflow: hidden;
  }

  #algo-reachable-paths-view::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: radial-gradient(ellipse at 10% 5%, #f9731655, transparent 55%),
                radial-gradient(ellipse at 90% 95%, #ea580c55, transparent 55%),
                linear-gradient(135deg, #431407 0%, #7c2d12 25%, #431407 50%, #9a3412 75%, #431407 100%);
    z-index: -2;
  }

  #algo-reachable-paths-view::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(67, 20, 7, 0.4), transparent 70%);
    z-index: -1;
  }

  #algo-reachable-paths-view .rp-page {
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .rp-hero {
    padding: 16px 24px;
    background: rgba(20, 18, 38, 0.5);
    backdrop-filter: blur(18px) saturate(160%);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 0 0 16px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
  }

  .rp-hero .rp-title-wrapper {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .rp-hero-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, #f97316, #ea580c);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
  }

  .rp-hero-text h2 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 800;
    background: linear-gradient(135deg, #f97316, #ea580c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .rp-hero-text p {
    margin: 0;
    color: rgba(204, 214, 244, 0.8);
    font-size: 13px;
  }

  .rp-tip {
    max-width: 480px;
    padding: 12px 16px;
    border-radius: 12px;
    background: rgba(249, 115, 22, 0.08);
    border: 1px solid rgba(249, 115, 22, 0.2);
    color: rgba(204, 214, 244, 0.9);
    font-size: 13px;
    line-height: 1.55;
  }

  .rp-tip strong {
    color: #f97316;
    font-weight: 600;
  }

  #algo-reachable-paths-view .rp-layout {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 16px;
    padding: 16px;
    overflow: hidden;
  }

  @media (max-width: 1100px) {
    #algo-reachable-paths-view .rp-layout {
      grid-template-columns: 1fr;
      overflow: auto;
    }
  }

  .rp-main {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow: hidden;
    flex: 1;
  }

  .rp-card {
    background: rgba(20, 18, 38, 0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }

  .rp-controls {
    padding: 14px 18px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .rp-input {
    flex: 1;
    min-width: 140px;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(11, 10, 23, 0.8);
    color: #cdd6f4;
    font-family: ui-monospace, monospace;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .rp-input:focus {
    border-color: #f97316;
    box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15);
  }

  .rp-btn {
    padding: 10px 18px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, #f97316, #ea580c);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
    box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
  }

  .rp-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(249, 115, 22, 0.4);
  }

  .rp-example {
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid rgba(249, 115, 22, 0.3);
    background: rgba(249, 115, 22, 0.1);
    color: #cdd6f4;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .rp-example:hover {
    background: rgba(249, 115, 22, 0.2);
    border-color: #f97316;
  }

  .rp-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    padding: 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .rp-stat {
    padding: 14px 0;
    position: relative;
    background: rgba(20, 18, 38, 0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    overflow: hidden;
  }

  .rp-stat::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #f97316, #ea580c);
  }

  .rp-stat-label {
    display: block;
    margin-bottom: 6px;
    color: rgba(204, 214, 244, 0.7);
    font-size: 12px;
  }

  .rp-stat-val {
    color: #f97316;
    font-family: ui-monospace, monospace;
    font-size: 19px;
    font-weight: 700;
  }

  .rp-graph-container {
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 260px;
  }

  .rp-graph-container svg {
    width: 100%;
    max-width: 480px;
    height: 240px;
  }

  .rp-stack-container {
    padding: 16px 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }

  .rp-stack-title {
    color: rgba(204, 214, 244, 0.7);
    font-size: 12px;
    margin-bottom: 10px;
  }

  .rp-stack {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    min-height: 36px;
    align-items: center;
  }

  .rp-stack-item {
    padding: 6px 12px;
    border-radius: 8px;
    background: rgba(249, 115, 22, 0.2);
    border: 1px solid rgba(249, 115, 22, 0.4);
    color: #f97316;
    font-family: ui-monospace, monospace;
    font-size: 13px;
    font-weight: 600;
    animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .rp-stack-item.top {
    background: linear-gradient(135deg, #f97316, #ea580c);
    color: #fff;
    box-shadow: 0 2px 10px rgba(249, 115, 22, 0.4);
  }

  .rp-reachable-container {
    padding: 16px 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }

  .rp-reachable-title {
    color: rgba(204, 214, 244, 0.7);
    font-size: 12px;
    margin-bottom: 10px;
  }

  .rp-reachable {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    min-height: 36px;
    align-items: center;
  }

  .rp-reachable-item {
    padding: 6px 12px;
    border-radius: 8px;
    background: rgba(16, 185, 129, 0.2);
    border: 1px solid rgba(16, 185, 129, 0.4);
    color: #10b981;
    font-family: ui-monospace, monospace;
    font-size: 13px;
    font-weight: 600;
    animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .rp-message {
    margin: 0 14px 14px;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid rgba(249, 115, 22, 0.2);
    background: rgba(249, 115, 22, 0.08);
    color: #cdd6f4;
    font-size: 13px;
    line-height: 1.5;
  }

  .rp-log {
    min-height: 0;
    max-height: 130px;
    padding: 14px 16px;
    overflow: auto;
    background: rgba(11, 10, 23, 0.8);
    font-family: ui-monospace, monospace;
    font-size: 12px;
    line-height: 1.7;
    color: rgba(204, 214, 244, 0.8);
  }

  .rp-log div {
    padding: 2px 0;
  }

  .rp-log div.active {
    color: #f97316;
    font-weight: 600;
  }

  .rp-right {
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow: hidden;
  }

  .rp-code-card {
    background: rgba(11, 10, 23, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    overflow: hidden;
    flex: 1;
  }

  .rp-legend {
    background: rgba(20, 18, 38, 0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 14px;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .rp-legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .rp-legend-box {
    width: 16px;
    height: 16px;
    border-radius: 50%;
  }

  .rp-playback {
    background: rgba(20, 18, 38, 0.5);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .rp-pb-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .rp-pb-btn {
    flex: 1;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(249, 115, 22, 0.1);
    color: #cdd6f4;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
  }

  .rp-pb-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .rp-pb-btn:not(:disabled):hover {
    background: rgba(249, 115, 22, 0.2);
    border-color: #f97316;
    transform: translateY(-1px);
  }

  .rp-pb-btn.play {
    background: linear-gradient(135deg, #f97316, #ea580c);
    border: none;
    color: #fff;
    box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
  }

  .rp-pb-btn.play:not(:disabled):hover {
    box-shadow: 0 6px 20px rgba(249, 115, 22, 0.4);
  }

  .rp-speed-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: rgba(204, 214, 244, 0.7);
  }

  .rp-speed-row input {
    flex: 1;
    accent-color: #f97316;
  }

  .rp-counter {
    color: rgba(204, 214, 244, 0.6);
    font-size: 13px;
    font-family: ui-monospace, monospace;
    text-align: center;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  @keyframes popIn {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .rp-node {
    transition: all 0.3s ease;
  }

  .rp-edge {
    transition: all 0.3s ease;
  }
</style>

<div class="rp-page">
  <div class="rp-hero">
    <div class="rp-title-wrapper">
      <div class="rp-hero-icon">🎯</div>
      <div class="rp-hero-text">
        <h2>可达路径</h2>
        <p>从源节点出发，用 DFS/BFS 找到有向图中所有可达节点</p>
      </div>
    </div>
    <div class="rp-tip"><strong>可达性：</strong>从源点出发，沿着有向边能到达的所有节点。用 DFS 或 BFS 遍历即可，时间复杂度 O(V+E)。</div>
  </div>

  <div class="rp-layout">
    <div class="rp-main">
      <div class="rp-card">
        <div class="rp-controls">
          <input id="rp-adj-input" class="rp-input" value="0:1,2; 1:3; 2:3; 3:" title="邻接表格式: 源:目标1,目标2; ..." />
          <input id="rp-source-input" class="rp-input" style="max-width:80px;" value="0" title="源节点" />
          <button id="rp-start" class="rp-btn">开始搜索</button>
          <button class="rp-example" data-adj="0:1,2; 1:3; 2:3; 3:" data-src="0">示例1</button>
          <button class="rp-example" data-adj="0:1; 1:2,3; 2:0; 3:4; 4:" data-src="0">示例2</button>
          <button class="rp-example" data-adj="0:1; 1:2; 2:3; 3:1; 4:0" data-src="4">示例3</button>
        </div>

        <div class="rp-stats">
          <div class="rp-stat"><span class="rp-stat-label">当前节点</span><span class="rp-stat-val" id="rp-current">-</span></div>
          <div class="rp-stat"><span class="rp-stat-label">已访问</span><span class="rp-stat-val" id="rp-visited">0</span></div>
          <div class="rp-stat"><span class="rp-stat-label">可达数</span><span class="rp-stat-val" id="rp-reachable">0</span></div>
          <div class="rp-stat"><span class="rp-stat-label">栈大小</span><span class="rp-stat-val" id="rp-stack-size">0</span></div>
        </div>

        <div class="rp-graph-container" id="rp-graph"></div>

        <div class="rp-stack-container">
          <div class="rp-stack-title">遍历栈 (Stack)</div>
          <div class="rp-stack" id="rp-stack"></div>
        </div>

        <div class="rp-reachable-container">
          <div class="rp-reachable-title">可达节点集合</div>
          <div class="rp-reachable" id="rp-reachable-list"></div>
        </div>

        <div class="rp-message" id="step-message">输入邻接表和源节点，点击「开始搜索」查看可达性分析。</div>

        <div class="rp-log" id="rp-log"></div>
      </div>
    </div>

    <div class="rp-right">
      <div data-code-panel class="rp-code-card"></div>
      <div class="rp-legend">
        <div class="rp-legend-item"><span class="rp-legend-box" style="background:rgba(249,115,22,0.2);border:2px solid #f97316"></span>未访问</div>
        <div class="rp-legend-item"><span class="rp-legend-box" style="background:#f59e0b"></span>当前访问</div>
        <div class="rp-legend-item"><span class="rp-legend-box" style="background:#10b981"></span>可达（已访问）</div>
      </div>
      <div class="rp-playback">
        <div class="rp-pb-row">
          <button id="step-reset" class="rp-pb-btn">重置</button>
          <button id="step-prev" class="rp-pb-btn">上一步</button>
          <button id="step-play" class="rp-pb-btn play">播放</button>
          <button id="step-next" class="rp-pb-btn">下一步</button>
        </div>
        <div class="rp-speed-row">
          <span>速度</span>
          <input id="rp-speed" type="range" min="150" max="1500" step="100" value="700" />
          <span id="rp-speed-label" style="font-family:ui-monospace,monospace;font-size:13px;color:rgba(204,214,244,0.7);margin-left:4px;">0.7s</span>
        </div>
        <div id="step-counter" class="rp-counter">步骤: 1 / 1</div>
      </div>
    </div>
  </div>
</div>
