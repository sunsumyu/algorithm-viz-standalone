        <div style="display: flex; align-items: center; gap: 4px; margin-left: 6px;">
          <select id="select-speed" style="padding: 2px 6px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 11px; background: #ffffff;">
            <option value="1200">慢速</option>
            <option value="500" selected>正常</option>
            <option value="200">快速</option>
          </select>
        </div>
      </div>

      <!-- 卡片 2: 状态空间与淹没指标监视器 -->
      <div class="sink-card">
        <div class="sink-card-header">
          <div>
            <div class="sink-card-title">🧭 状态指标与淹没监视器</div>
            <div class="sink-card-desc">当前处理坐标、边缘连通保护数与孤岛淹没计数</div>
          </div>
          <span id="badge-sunk-count" class="sink-counter-badge" style="color:#dc2626; background:#fef2f2; border-color:#fecaca;">淹没孤岛: 0 格</span>
        </div>

        <!-- 状态空间展示盒 -->
        <div class="sink-state-space-box">
          <div class="sink-metrics-grid">
            <div class="sink-metric-card">
              <span class="sink-metric-label">当前检查格子</span>
              <span class="sink-metric-val" id="metric-cur-cell" style="color: #eab308;">—</span>
            </div>
            <div class="sink-metric-card">
              <span class="sink-metric-label">处理阶段 Stage</span>
              <span class="sink-metric-val" id="metric-stage" style="color: #4338ca;">边缘保护</span>
            </div>
            <div class="sink-metric-card">
              <span class="sink-metric-label">受保护陆地 Protected</span>
              <span class="sink-metric-val" id="metric-protected-count" style="color: #10b981;">0</span>
            </div>
            <div class="sink-metric-card">
              <span class="sink-metric-label">已沉没孤岛数 Sunk</span>
              <span class="sink-metric-val" id="metric-sunk-count" style="color: #dc2626;">0</span>
            </div>
          </div>

          <div class="sink-formula-box">
            <span style="color:#64748b;">两阶段沉没:</span>
            <strong id="formula-action" style="color: #16a34a;">1. 边缘连通 DFS (1->2) 2. 内部孤岛沉没 (1->0) 与还原 (2->1)</strong>
          </div>

          <div class="sink-live-alert">
            <span>💡</span> <span id="sink-live-text">准备就绪，点击运行开始沉没孤岛分析。</span>
          </div>
        </div>
      </div>

    </section>

    <!-- ================= 右侧：代码终端 + 执行日志 ================= -->
    <section class="sink-right-section">

      <!-- 卡片 3: 暗色代码终端面板 -->
      <div class="sink-dark-terminal">
        <div class="sink-terminal-header">
          <!-- 1. 主 Tab 切换器 (源码 / 题目 / 精讲) -->
          <div class="sink-tab-group">
            <button id="btn-tab-code" class="sink-tab-item active">💻 代码调试</button>
            <button id="btn-tab-problem" class="sink-tab-item">📋 题目描述</button>
            <button id="btn-tab-analysis" class="sink-tab-item">💡 算法精讲</button>
          </div>

          <!-- 2. 多语言切换器 -->
          <div class="sink-lang-group" id="code-lang-tabs">
            <button class="sink-lang-btn active" data-lang="java">Java</button>
            <button class="sink-lang-btn" data-lang="cpp">C++</button>
            <button class="sink-lang-btn" data-lang="python">Python</button>
            <button class="sink-lang-btn" data-lang="javascript">JS</button>
          </div>

          <!-- 3. 字号缩放器与 macOS 窗口微控制 -->
          <div class="sink-font-tools">
            <div class="sink-font-scaler">
              <button id="btn-code-font-dec" title="缩小代码字号">A-</button>
              <span id="code-font-indicator" class="sink-font-indicator">12</span>
              <button id="btn-code-font-inc" title="放大代码字号">A+</button>
            </div>

            <div class="sink-window-dots">
              <span class="sink-dot" style="background:#ef4444;"></span>
              <span class="sink-dot" style="background:#eab308;"></span>
              <span class="sink-dot" style="background:#22c55e;"></span>
            </div>
          </div>
        </div>

        <!-- 容器 1: 源码高亮与单步追踪视图 -->
        <div id="code-view-container" style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;">
          <div class="sink-terminal-body">
            <div id="code-lines-wrapper">
              <!-- 动态装载代码行 -->
            </div>
          </div>
        </div>

        <!-- 容器 2: 题目完整描述视图 -->
        <div id="problem-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载题目内容 -->
        </div>

        <!-- 容器 3: 算法精讲视图 -->
        <div id="analysis-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载精讲内容 -->
        </div>
      </div>

      <!-- 卡片 4: 独立执行日志卡片 -->
      <div class="sink-log-card">
        <div class="sink-log-header">
          <div class="sink-log-header-title">
            <span>📜 执行日志</span>
          </div>
          <span id="log-count" class="sink-log-count">0 条记录</span>
        </div>

        <div id="log-container" class="sink-log-body">
          <!-- 动态填充日志条目 -->
        </div>
      </div>

    </section>

  </main>

  <!-- 4. 力扣原题描述轻量模态弹窗 (Modal) -->
  <div id="modal-problem" class="sink-modal-backdrop hidden">
    <div class="sink-modal-content">
      <div class="sink-modal-header">
        <div class="sink-modal-title">
          <span>📋 力扣原题描述</span>
        </div>
        <button id="btn-close-problem-modal" class="sink-modal-close" title="关闭 (Esc)">✕</button>
      </div>
      <div id="modal-problem-body" class="sink-modal-body">
        <!-- 动态装载题目内容 -->
      </div>
    </div>
  </div>
</div>
