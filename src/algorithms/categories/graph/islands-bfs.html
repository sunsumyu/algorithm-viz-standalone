            <div><span class="isl-legend-dot" style="background:#60a5fa;"></span> 水域 (0)</div>
            <div><span class="isl-legend-dot" style="background:#fbbf24;"></span> 队列处理中</div>
            <div><span class="isl-legend-dot" style="background:#94a3b8;"></span> 沉没/已访问</div>
          </div>
        </div>

        <!-- 网格沙盘展示盒 -->
        <div class="isl-sandbox-wrap">
          <div class="isl-grid-matrix" id="isl-grid-container"></div>
        </div>
      </div>

      <!-- 贯穿式 Scrubber 步数进度条与播放控制器 -->
      <div class="isl-playback-bar">
        <input type="range" id="slider-progress" min="0" max="0" value="0" class="isl-slider" />
        <div class="isl-counter-badge">
          <span id="step-cur" style="color: #2563eb;">0</span> / <span id="step-total">0</span>
        </div>
        <div style="display: flex; align-items: center; gap: 4px; flex-shrink: 0;">
          <button id="btn-step-prev" title="上一步" class="isl-ctrl-btn">◀</button>
          <button id="btn-play-pause" title="自动播放/暂停" class="isl-play-circle-btn">
            <span id="play-icon">▶</span>
          </button>
          <button id="btn-step-next" title="下一步" class="isl-ctrl-btn">▶</button>
        </div>
        <div style="display: flex; align-items: center; gap: 4px; margin-left: 6px;">
          <select id="select-speed" style="padding: 2px 6px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 11px; background: #ffffff;">
            <option value="1200">慢速</option>
            <option value="400" selected>正常</option>
            <option value="150">快速</option>
          </select>
        </div>
      </div>

      <!-- 卡片 2: BFS 队列与状态监视器 -->
      <div class="isl-card">
        <div class="isl-card-header">
          <div>
            <div class="isl-card-title">🧭 BFS 队列与指标监视器</div>
            <div class="isl-card-desc">波前队列元素、出队入队操作与岛屿总数计数</div>
          </div>
          <span id="badge-island-count" class="isl-counter-badge" style="color:#2563eb; background:#eff6ff; border-color:#bfdbfe;">已发现岛屿: 0</span>
        </div>

        <!-- 状态空间展示盒 -->
        <div class="isl-state-space-box">
          <div class="isl-metrics-grid">
            <div class="isl-metric-card">
              <span class="isl-metric-label">当前扫描格</span>
              <span class="isl-metric-val" id="metric-scan" style="color: #3b82f6;">(0, 0)</span>
            </div>
            <div class="isl-metric-card">
              <span class="isl-metric-label">当前出队坐标</span>
              <span class="isl-metric-val" id="metric-curr" style="color: #fbbf24;">(0, 0)</span>
            </div>
            <div class="isl-metric-card">
              <span class="isl-metric-label">队列长度 queue</span>
              <span class="isl-metric-val" id="metric-queue-size" style="color: #a855f7;">0</span>
            </div>
            <div class="isl-metric-card">
              <span class="isl-metric-label">已发现岛屿数 COUNT</span>
              <span class="isl-metric-val" id="metric-island-count" style="color: #10b981;">0</span>
            </div>
          </div>

          <div class="isl-queue-box">
            <span style="color:#64748b; font-weight:700;">BFS 队列:</span>
            <span id="queue-elements" style="color: #2563eb; font-weight: 800;">[ ]</span>
          </div>

          <div class="isl-live-alert">
            <span>💡</span> <span id="isl-live-text">准备就绪，点击运行开始 BFS 广度优先探索。</span>
          </div>
        </div>
      </div>

    </section>

    <!-- ================= 右侧：代码终端 + 执行日志 ================= -->
    <section class="isl-right-section">

      <!-- 卡片 3: 暗色代码终端面板 -->
      <div class="isl-dark-terminal">
        <div class="isl-terminal-header">
          <!-- 1. 主 Tab 切换器 (源码 / 题目 / 精讲) -->
          <div class="isl-tab-group">
            <button id="btn-tab-code" class="isl-tab-item active">💻 代码调试</button>
            <button id="btn-tab-problem" class="isl-tab-item">📋 题目描述</button>
            <button id="btn-tab-analysis" class="isl-tab-item">💡 BFS 精讲</button>
          </div>

          <!-- 2. 多语言切换器 -->
          <div class="isl-lang-group" id="code-lang-tabs">
            <button class="isl-lang-btn active" data-lang="java">Java</button>
            <button class="isl-lang-btn" data-lang="cpp">C++</button>
            <button class="isl-lang-btn" data-lang="python">Python</button>
            <button class="isl-lang-btn" data-lang="javascript">JS</button>
          </div>

          <!-- 3. 字号缩放器与 macOS 窗口微控制 -->
          <div class="isl-font-tools">
            <div class="isl-font-scaler">
              <button id="btn-code-font-dec" title="缩小代码字号">A-</button>
              <span id="code-font-indicator" class="isl-font-indicator">12</span>
              <button id="btn-code-font-inc" title="放大代码字号">A+</button>
            </div>

            <div class="isl-window-dots">
              <span class="isl-dot" style="background:#ef4444;"></span>
              <span class="isl-dot" style="background:#eab308;"></span>
              <span class="isl-dot" style="background:#22c55e;"></span>
            </div>
          </div>
        </div>

        <!-- 容器 1: 源码高亮与单步追踪视图 -->
        <div id="code-view-container" style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;">
          <div class="isl-terminal-body">
            <div id="code-lines-wrapper">
              <!-- 动态装载代码行 -->
            </div>
          </div>
        </div>

        <!-- 容器 2: 题目完整描述视图 -->
        <div id="problem-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载题目内容 -->
        </div>

        <!-- 容器 3: 算法精讲视图 -->
        <div id="analysis-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载精讲内容 -->
        </div>
      </div>

      <!-- 卡片 4: 独立执行日志卡片 -->
      <div class="isl-log-card">
        <div class="isl-log-header">
          <div class="isl-log-header-title">
            <span>📜 执行日志</span>
          </div>
          <span id="log-count" class="isl-log-count">0 条记录</span>
        </div>

        <div id="log-container" class="isl-log-body">
          <!-- 动态填充日志条目 -->
        </div>
      </div>

    </section>

  </main>

  <!-- 4. 力扣原题描述轻量模态弹窗 (Modal) -->
  <div id="modal-problem" class="isl-modal-backdrop hidden">
    <div class="isl-modal-content">
      <div class="isl-modal-header">
        <div class="isl-modal-title">
          <span>📋 力扣原题描述</span>
        </div>
        <button id="btn-close-problem-modal" class="isl-modal-close" title="关闭 (Esc)">✕</button>
      </div>
      <div id="modal-problem-body" class="isl-modal-body">
        <!-- 动态装载题目内容 -->
      </div>
    </div>
  </div>
</div>
