<div id="algo-floyd-view">

    </div>

    <div class="fl-header-right">
      <button id="btn-generate" class="fl-btn-generate">
        <span>▶ 运行</span>
      </button>
      <button id="btn-reset" class="fl-btn-reset">
        重置
      </button>
    </div>
  </header>

  <!-- 2. 主演示区 4-Card 布局 -->

          <div class="fl-card-title">
            <span>📊 全源最短路矩阵沙盘</span>
          </div>
          <div class="fl-legend-bar">
            <div><span class="fl-legend-dot" style="background:#fef08a;"></span> 中继点 k</div>
            <div><span class="fl-legend-dot" style="background:#fed7aa;"></span> 考察格 (i, j)</div>
            <div><span class="fl-legend-dot" style="background:#bbf7d0;"></span> 成功更新更短路</div>
          </div>
        </div>

        <!-- 距离矩阵展示盒 -->
        <div class="fl-sandbox-wrap">
          <div id="floyd-matrix-container"></div>
        </div>
      </div>

      <!-- 贯穿式 Scrubber 步数进度条与播放控制器 -->
      <div class="fl-playback-bar">
        <input type="range" id="slider-progress" min="0" max="0" value="0" class="fl-slider" />
        <div class="fl-counter-badge">
          <span id="step-cur" style="color: #ea580c;">0</span> / <span id="step-total">0</span>
        </div>

          <button id="btn-step-next" title="下一步" class="fl-ctrl-btn">▶</button>
        </div>
        <div style="display: flex; align-items: center; gap: 4px; margin-left: 6px;">
          <select id="select-speed" style="padding: 2px 6px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 11px; background: #ffffff;">
            <option value="1200">慢速</option>
            <option value="350" selected>正常</option>
            <option value="100">快速</option>
          </select>
        </div>
      </div>

        <div class="fl-card-header">
          <div>
            <div class="fl-card-title">🧭 三重循环指标监视器</div>

          </div>
          <span id="badge-mid-k" class="fl-counter-badge" style="color:#ea580c; background:#fff7ed; border-color:#fed7aa;">中继点 k: 0</span>
        </div>

            <div class="fl-metric-card">
              <span class="fl-metric-label">中继节点 k (Mid)</span>
              <span class="fl-metric-val" id="metric-k" style="color: #ea580c;">0</span>
            </div>
            <div class="fl-metric-card">
              <span class="fl-metric-label">起点 i (From)</span>
              <span class="fl-metric-val" id="metric-i" style="color: #3b82f6;">0</span>
            </div>
            <div class="fl-metric-card">
              <span class="fl-metric-label">终点 j (To)</span>
              <span class="fl-metric-val" id="metric-j" style="color: #10b981;">0</span>
            </div>
            <div class="fl-metric-card">
              <span class="fl-metric-label">松弛更新总次数</span>
              <span class="fl-metric-val" id="metric-update-count" style="color: #a855f7;">0</span>
            </div>
          </div>

          <div class="fl-formula-box">
            <span style="color:#64748b;">状态转移方程:</span>
            <strong id="formula-action" style="color: #ea580c;">dp[i][j] = min(dp[i][j], dp[i][k] + dp[k][j])</strong>
          </div>

          <div class="fl-live-alert">
            <span>💡</span> <span id="fl-live-text">准备就绪，点击运行开始 Floyd 全源最短路计算。</span>
          </div>
        </div>
      </div>

    </section>

    <!-- ================= 右侧：代码终端 + 执行日志 ================= -->
    <section class="fl-right-section">

      <!-- 卡片 3: 暗色代码终端面板 -->
      <div class="fl-dark-terminal">
        <div class="fl-terminal-header">
          <!-- 1. 主 Tab 切换器 (源码 / 题目 / 精讲) -->
          <div class="fl-tab-group">
            <button id="btn-tab-code" class="fl-tab-item active">💻 代码调试</button>
            <button id="btn-tab-problem" class="fl-tab-item">📋 题目描述</button>
            <button id="btn-tab-analysis" class="fl-tab-item">💡 算法精讲</button>
          </div>

          <!-- 2. 多语言切换器 -->
          <div class="fl-lang-group" id="code-lang-tabs">
            <button class="fl-lang-btn active" data-lang="java">Java</button>
            <button class="fl-lang-btn" data-lang="cpp">C++</button>
            <button class="fl-lang-btn" data-lang="python">Python</button>
            <button class="fl-lang-btn" data-lang="javascript">JS</button>
          </div>

          <!-- 3. 字号缩放器与 macOS 窗口微控制 -->
          <div class="fl-font-tools">
            <div class="fl-font-scaler">
              <button id="btn-code-font-dec" title="缩小代码字号">A-</button>
              <span id="code-font-indicator" class="fl-font-indicator">12</span>
              <button id="btn-code-font-inc" title="放大代码字号">A+</button>
            </div>

            <div class="fl-window-dots">
              <span class="fl-dot" style="background:#ef4444;"></span>
              <span class="fl-dot" style="background:#eab308;"></span>
              <span class="fl-dot" style="background:#22c55e;"></span>
            </div>
          </div>
        </div>

        <!-- 容器 1: 源码高亮与单步追踪视图 -->
        <div id="code-view-container" style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;">
          <div class="fl-terminal-body">
            <div id="code-lines-wrapper">
              <!-- 动态装载代码行 -->
            </div>
          </div>
        </div>

        <!-- 容器 2: 题目完整描述视图 -->
        <div id="problem-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载题目内容 -->
        </div>

        <!-- 容器 3: 算法精讲视图 -->
        <div id="analysis-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载精讲内容 -->
        </div>
      </div>

      <!-- 卡片 4: 独立执行日志卡片 -->
      <div class="fl-log-card">
        <div class="fl-log-header">
          <div class="fl-log-header-title">
            <span>📜 执行日志</span>
          </div>
          <span id="log-count" class="fl-log-count">0 条记录</span>
        </div>

        <div id="log-container" class="fl-log-body">
          <!-- 动态填充日志条目 -->
        </div>
      </div>

    </section>

  </main>

  <!-- 4. 力扣原题描述轻量模态弹窗 (Modal) -->
  <div id="modal-problem" class="fl-modal-backdrop hidden">
    <div class="fl-modal-content">
      <div class="fl-modal-header">
        <div class="fl-modal-title">
          <span>📋 算法原理与全源最短路解析</span>
        </div>
        <button id="btn-close-problem-modal" class="fl-modal-close" title="关闭 (Esc)">✕</button>
      </div>
      <div id="modal-problem-body" class="fl-modal-body">
        <!-- 动态装载题目内容 -->
      </div>
    </div>
  </div>
</div>
