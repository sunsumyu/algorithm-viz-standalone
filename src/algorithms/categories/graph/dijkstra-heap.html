<style>
  #algo-dijkstra-heap-view {
    width: 100%;
    height: 100%;
    color: #cdd6f4;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    position: relative;
    overflow: hidden;
  }

  #algo-dijkstra-heap-view::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: radial-gradient(ellipse at 10% 5%, #6366f155, transparent 55%),
                radial-gradient(ellipse at 90% 95%, #4f46e555, transparent 55%),
                linear-gradient(135deg, #1e1b4b 0%, #312e81 25%, #1e1b4b 50%, #3730a3 75%, #1e1b4b 100%);
    z-index: -2;
  }

  #algo-dijkstra-heap-view::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(30, 27, 75, 0.4), transparent 70%);
    z-index: -1;
  }

  #algo-dijkstra-heap-view .djh-page {
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .djh-hero {
    padding: 16px 24px;
    background: rgba(20, 18, 38, 0.5);
    backdrop-filter: blur(18px) saturate(160%);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 0 0 16px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
  }

  .djh-hero .djh-title-wrapper {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .djh-hero-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
  }

  .djh-hero-text h2 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 800;
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .djh-hero-text p {
    margin: 0;
    color: rgba(204, 214, 244, 0.8);
    font-size: 13px;
  }

  .djh-tip {
    max-width: 480px;
    padding: 12px 16px;
    border-radius: 12px;
    background: rgba(99, 102, 241, 0.08);
    border: 1px solid rgba(99, 102, 241, 0.2);
    color: rgba(204, 214, 244, 0.9);
    font-size: 13px;
    line-height: 1.55;
  }

  .djh-tip strong {
    color: #6366f1;
    font-weight: 600;
  }

  #algo-dijkstra-heap-view .djh-layout {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 16px;
    padding: 16px;
    overflow: hidden;
  }

  @media (max-width: 1100px) {
    #algo-dijkstra-heap-view .djh-layout {
      grid-template-columns: 1fr;
      overflow: auto;
    }
  }

  .djh-main {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow: hidden;
    flex: 1;
  }

  .djh-card {
    background: rgba(20, 18, 38, 0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }

  .djh-controls {
    padding: 14px 18px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .djh-btn {
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
  }

  .djh-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
  }

  .djh-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    padding: 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .djh-stat {
    padding: 14px 0;
    position: relative;
    background: rgba(20, 18, 38, 0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    overflow: hidden;
  }

  .djh-stat::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #6366f1, #4f46e5);
  }

  .djh-stat-label {
    display: block;
    margin-bottom: 6px;
    color: rgba(204, 214, 244, 0.7);
    font-size: 12px;
  }

  .djh-stat-val {
    color: #6366f1;
    font-family: ui-monospace, monospace;
    font-size: 19px;
    font-weight: 700;
  }

  .djh-graph-container {
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 240px;
  }

  .djh-graph-container svg {
    width: 100%;
    max-width: 480px;
    height: 240px;
  }

  .djh-heap-container {
    padding: 16px 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }

  .djh-heap-title {
    color: rgba(204, 214, 244, 0.7);
    font-size: 12px;
    margin-bottom: 10px;
    font-weight: 600;
  }

  .djh-heap-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    min-height: 36px;
    align-items: center;
  }

  .djh-heap-item {
    padding: 6px 10px;
    border-radius: 8px;
    background: rgba(99, 102, 241, 0.15);
    border: 1px solid rgba(99, 102, 241, 0.3);
    color: #6366f1;
    font-family: ui-monospace, monospace;
    font-size: 11px;
    font-weight: 600;
    min-width: 50px;
    text-align: center;
    animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .djh-heap-item .djh-heap-node {
    display: block;
    font-size: 9px;
    color: rgba(204, 214, 244, 0.5);
    margin-bottom: 2px;
  }

  .djh-heap-item.top {
    background: rgba(99, 102, 241, 0.4);
    border-color: #6366f1;
    box-shadow: 0 0 8px rgba(99, 102, 241, 0.4);
  }

  .djh-dist-container {
    padding: 16px 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }

  .djh-dist-title {
    color: rgba(204, 214, 244, 0.7);
    font-size: 12px;
    margin-bottom: 10px;
    font-weight: 600;
  }

  .djh-dist-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    min-height: 36px;
    align-items: center;
  }

  .djh-dist-item {
    padding: 6px 10px;
    border-radius: 8px;
    background: rgba(99, 102, 241, 0.15);
    border: 1px solid rgba(99, 102, 241, 0.3);
    color: #6366f1;
    font-family: ui-monospace, monospace;
    font-size: 12px;
    font-weight: 600;
    min-width: 32px;
    text-align: center;
    animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .djh-dist-item .djh-idx {
    display: block;
    font-size: 9px;
    color: rgba(204, 214, 244, 0.5);
    margin-bottom: 2px;
  }

  .djh-dist-item.updated {
    background: rgba(99, 102, 241, 0.4);
    border-color: #6366f1;
    box-shadow: 0 0 8px rgba(99, 102, 241, 0.4);
  }

  .djh-dist-item.visited-node {
    background: rgba(34, 197, 94, 0.2);
    border-color: rgba(34, 197, 94, 0.5);
    color: #22c55e;
  }

  .djh-visited-container {
    padding: 16px 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }

  .djh-visited-title {
    color: rgba(204, 214, 244, 0.7);
    font-size: 12px;
    margin-bottom: 10px;
    font-weight: 600;
  }

  .djh-visited-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    min-height: 36px;
    align-items: center;
  }

  .djh-visited-item {
    padding: 6px 12px;
    border-radius: 8px;
    background: rgba(34, 197, 94, 0.2);
    border: 1px solid rgba(34, 197, 94, 0.4);
    color: #22c55e;
    font-family: ui-monospace, monospace;
    font-size: 13px;
    font-weight: 600;
    animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .djh-message {
    margin: 0 14px 14px;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid rgba(99, 102, 241, 0.2);
    background: rgba(99, 102, 241, 0.08);
    color: #cdd6f4;
    font-size: 13px;
    line-height: 1.5;
  }

  .djh-log {
    min-height: 0;
    max-height: 100px;
    padding: 14px 16px;
    overflow: auto;
    background: rgba(11, 10, 23, 0.8);
    font-family: ui-monospace, monospace;
    font-size: 12px;
    line-height: 1.7;
    color: rgba(204, 214, 244, 0.8);
  }

  .djh-log div {
    padding: 2px 0;
  }

  .djh-log div.active {
    color: #6366f1;
    font-weight: 600;
  }

  .djh-right {
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow: hidden;
  }

  .djh-code-card {
    background: rgba(11, 10, 23, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    overflow: hidden;
    flex: 1;
  }

  .djh-legend {
    background: rgba(20, 18, 38, 0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 14px;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .djh-legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .djh-legend-box {
    width: 16px;
    height: 16px;
    border-radius: 4px;
  }

  .djh-playback {
    background: rgba(20, 18, 38, 0.5);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .djh-pb-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .djh-pb-btn {
    flex: 1;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(99, 102, 241, 0.1);
    color: #cdd6f4;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
  }

  .djh-pb-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .djh-pb-btn:not(:disabled):hover {
    background: rgba(99, 102, 241, 0.2);
    border-color: #6366f1;
    transform: translateY(-1px);
  }

  .djh-pb-btn.play {
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    border: none;
    color: #fff;
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
  }

  .djh-pb-btn.play:not(:disabled):hover {
    box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
  }

  .djh-speed-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: rgba(204, 214, 244, 0.7);
  }

  .djh-speed-row input {
    flex: 1;
    accent-color: #6366f1;
  }

  .djh-counter {
    color: rgba(204, 214, 244, 0.6);
    font-size: 13px;
    font-family: ui-monospace, monospace;
    text-align: center;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  @keyframes popIn {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes pathPulse {
    0%, 100% { stroke-opacity: 1; }
    50% { stroke-opacity: 0.5; }
  }

  .djh-node {
    transition: all 0.3s ease;
  }

  .djh-edge {
    transition: all 0.3s ease;
  }
</style>

<div class="djh-page">
  <div class="djh-hero">
    <div class="djh-title-wrapper">
      <div class="djh-hero-icon">🔮</div>
      <div class="djh-hero-text">
        <h2>Dijkstra 堆优化版</h2>
        <p>优先队列 O((V+E)logV) 单源最短路径</p>
      </div>
    </div>
    <div class="djh-tip"><strong>优化思路：</strong>用最小堆（优先队列）替代朴素扫描，每次 O(logV) 取出 dist 最小节点。复杂度从 O(V^2) 降为 O((V+E)logV)，适合稀疏图。</div>
  </div>

  <div class="djh-layout">
    <div class="djh-main">
      <div class="djh-card">
        <div class="djh-controls">
          <button id="djh-start" class="djh-btn">开始寻路</button>
        </div>

        <div class="djh-stats">
          <div class="djh-stat"><span class="djh-stat-label">当前节点</span><span class="djh-stat-val" id="djh-current">-</span></div>
          <div class="djh-stat"><span class="djh-stat-label">已访问</span><span class="djh-stat-val" id="djh-visited-count">0</span></div>
          <div class="djh-stat"><span class="djh-stat-label">堆大小</span><span class="djh-stat-val" id="djh-heap-size">0</span></div>
          <div class="djh-stat"><span class="djh-stat-label">状态</span><span class="djh-stat-val" id="djh-status">-</span></div>
        </div>

        <div class="djh-graph-container" id="djh-graph"></div>

        <div class="djh-heap-container">
          <div class="djh-heap-title">最小堆（优先队列）</div>
          <div class="djh-heap-row" id="djh-heap"></div>
        </div>

        <div class="djh-dist-container">
          <div class="djh-dist-title">距离数组 dist[]</div>
          <div class="djh-dist-row" id="djh-dist"></div>
        </div>

        <div class="djh-visited-container">
          <div class="djh-visited-title">已访问集合</div>
          <div class="djh-visited-row" id="djh-visited"></div>
        </div>

        <div class="djh-message" id="step-message">点击「开始寻路」执行 Dijkstra 堆优化版算法。</div>

        <div class="djh-log" id="djh-log"></div>
      </div>
    </div>

    <div class="djh-right">
      <div data-code-panel class="djh-code-card"></div>
      <div class="djh-legend">
        <div class="djh-legend-item"><span class="djh-legend-box" style="background:rgba(99,102,241,0.2);border:2px solid #6366f1"></span>未访问节点</div>
        <div class="djh-legend-item"><span class="djh-legend-box" style="background:rgba(34,197,94,0.4);border:2px solid #22c55e"></span>已访问节点</div>
        <div class="djh-legend-item"><span class="djh-legend-box" style="background:#f59e0b"></span>当前处理节点</div>
        <div class="djh-legend-item"><span class="djh-legend-box" style="background:rgba(239,68,68,0.3);border:2px solid #ef4444"></span>正在松弛的边</div>
      </div>
      <div class="djh-playback">
        <div class="djh-pb-row">
          <button id="step-reset" class="djh-pb-btn">重置</button>
          <button id="step-prev" class="djh-pb-btn">上一步</button>
          <button id="step-play" class="djh-pb-btn play">播放</button>
          <button id="step-next" class="djh-pb-btn">下一步</button>
        </div>
        <div class="djh-speed-row">
          <span>速度</span>
          <input id="djh-speed" type="range" min="150" max="1500" step="100" value="700" />
          <span id="djh-speed-label" style="font-family:ui-monospace,monospace;font-size:13px;color:rgba(204,214,244,0.7);margin-left:4px;">0.7s</span>
        </div>
        <div id="step-counter" class="djh-counter">步骤: 1 / 1</div>
      </div>
    </div>
  </div>
</div>
