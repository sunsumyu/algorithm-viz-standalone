<style>
  #algo-spfa-view {
    width: 100%;
    height: 100%;
    color: #cdd6f4;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    position: relative;
    overflow: hidden;
  }

  #algo-spfa-view::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: radial-gradient(ellipse at 10% 5%, #14b8a655, transparent 55%),
                radial-gradient(ellipse at 90% 95%, #0d948855, transparent 55%),
                linear-gradient(135deg, #042f2e 0%, #115e59 25%, #042f2e 50%, #134e4a 75%, #042f2e 100%);
    z-index: -2;
  }

  #algo-spfa-view::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(4, 47, 46, 0.4), transparent 70%);
    z-index: -1;
  }

  #algo-spfa-view .spfa-page {
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .spfa-hero {
    padding: 16px 24px;
    background: rgba(20, 18, 38, 0.5);
    backdrop-filter: blur(18px) saturate(160%);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 0 0 16px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
  }

  .spfa-hero .spfa-title-wrapper {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .spfa-hero-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, #14b8a6, #0d9488);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: 0 4px 15px rgba(20, 184, 166, 0.3);
  }

  .spfa-hero-text h2 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 800;
    background: linear-gradient(135deg, #14b8a6, #0d9488);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .spfa-hero-text p {
    margin: 0;
    color: rgba(204, 214, 244, 0.8);
    font-size: 13px;
  }

  .spfa-tip {
    max-width: 480px;
    padding: 12px 16px;
    border-radius: 12px;
    background: rgba(20, 184, 166, 0.08);
    border: 1px solid rgba(20, 184, 166, 0.2);
    color: rgba(204, 214, 244, 0.9);
    font-size: 13px;
    line-height: 1.55;
  }

  .spfa-tip strong {
    color: #14b8a6;
    font-weight: 600;
  }

  #algo-spfa-view .spfa-layout {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 16px;
    padding: 16px;
    overflow: hidden;
  }

  @media (max-width: 1100px) {
    #algo-spfa-view .spfa-layout {
      grid-template-columns: 1fr;
      overflow: auto;
    }
  }

  .spfa-main {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow: hidden;
    flex: 1;
  }

  .spfa-card {
    background: rgba(20, 18, 38, 0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }

  .spfa-controls {
    padding: 14px 18px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .spfa-btn {
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: linear-gradient(135deg, #14b8a6, #0d9488);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
    box-shadow: 0 4px 15px rgba(20, 184, 166, 0.3);
  }

  .spfa-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(20, 184, 166, 0.4);
  }

  .spfa-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    padding: 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .spfa-stat {
    padding: 14px 0;
    position: relative;
    background: rgba(20, 18, 38, 0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    overflow: hidden;
  }

  .spfa-stat::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #14b8a6, #0d9488);
  }

  .spfa-stat-label {
    display: block;
    margin-bottom: 6px;
    color: rgba(204, 214, 244, 0.7);
    font-size: 12px;
  }

  .spfa-stat-val {
    color: #14b8a6;
    font-family: ui-monospace, monospace;
    font-size: 19px;
    font-weight: 700;
  }

  .spfa-graph-container {
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 280px;
  }

  .spfa-graph-container svg {
    width: 100%;
    max-width: 480px;
    height: 280px;
  }

  .spfa-queue-container {
    padding: 16px 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }

  .spfa-queue-title {
    color: rgba(204, 214, 244, 0.7);
    font-size: 12px;
    margin-bottom: 10px;
    font-weight: 600;
  }

  .spfa-queue-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    min-height: 36px;
    align-items: center;
  }

  .spfa-queue-item {
    padding: 6px 12px;
    border-radius: 8px;
    background: rgba(20, 184, 166, 0.2);
    border: 1px solid rgba(20, 184, 166, 0.4);
    color: #14b8a6;
    font-family: ui-monospace, monospace;
    font-size: 13px;
    font-weight: 600;
    animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .spfa-queue-item.current {
    background: rgba(20, 184, 166, 0.5);
    border-color: #14b8a6;
    box-shadow: 0 0 10px rgba(20, 184, 166, 0.4);
  }

  .spfa-dist-container {
    padding: 16px 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }

  .spfa-dist-title {
    color: rgba(204, 214, 244, 0.7);
    font-size: 12px;
    margin-bottom: 10px;
    font-weight: 600;
  }

  .spfa-dist-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    min-height: 36px;
    align-items: center;
  }

  .spfa-dist-item {
    padding: 6px 10px;
    border-radius: 8px;
    background: rgba(20, 184, 166, 0.15);
    border: 1px solid rgba(20, 184, 166, 0.3);
    color: #14b8a6;
    font-family: ui-monospace, monospace;
    font-size: 12px;
    font-weight: 600;
    min-width: 32px;
    text-align: center;
    animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .spfa-dist-item .spfa-idx {
    display: block;
    font-size: 9px;
    color: rgba(204, 214, 244, 0.5);
    margin-bottom: 2px;
  }

  .spfa-dist-item.updated {
    background: rgba(20, 184, 166, 0.4);
    border-color: #14b8a6;
    box-shadow: 0 0 8px rgba(20, 184, 166, 0.4);
  }

  .spfa-inqueue-container {
    padding: 16px 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }

  .spfa-inqueue-title {
    color: rgba(204, 214, 244, 0.7);
    font-size: 12px;
    margin-bottom: 10px;
    font-weight: 600;
  }

  .spfa-inqueue-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    min-height: 36px;
    align-items: center;
  }

  .spfa-inqueue-item {
    padding: 6px 10px;
    border-radius: 8px;
    background: rgba(20, 184, 166, 0.1);
    border: 1px solid rgba(20, 184, 166, 0.2);
    color: rgba(20, 184, 166, 0.6);
    font-family: ui-monospace, monospace;
    font-size: 11px;
    font-weight: 600;
    min-width: 32px;
    text-align: center;
  }

  .spfa-inqueue-item .spfa-idx {
    display: block;
    font-size: 9px;
    color: rgba(204, 214, 244, 0.5);
    margin-bottom: 2px;
  }

  .spfa-inqueue-item.in-queue {
    background: rgba(20, 184, 166, 0.3);
    border-color: rgba(20, 184, 166, 0.5);
    color: #14b8a6;
  }

  .spfa-message {
    margin: 0 14px 14px;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid rgba(20, 184, 166, 0.2);
    background: rgba(20, 184, 166, 0.08);
    color: #cdd6f4;
    font-size: 13px;
    line-height: 1.5;
  }

  .spfa-log {
    min-height: 0;
    max-height: 120px;
    padding: 14px 16px;
    overflow: auto;
    background: rgba(11, 10, 23, 0.8);
    font-family: ui-monospace, monospace;
    font-size: 12px;
    line-height: 1.7;
    color: rgba(204, 214, 244, 0.8);
  }

  .spfa-log div {
    padding: 2px 0;
  }

  .spfa-log div.active {
    color: #14b8a6;
    font-weight: 600;
  }

  .spfa-right {
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow: hidden;
  }

  .spfa-code-card {
    background: rgba(11, 10, 23, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    overflow: hidden;
    flex: 1;
  }

  .spfa-legend {
    background: rgba(20, 18, 38, 0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 14px;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .spfa-legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .spfa-legend-box {
    width: 16px;
    height: 16px;
    border-radius: 4px;
  }

  .spfa-playback {
    background: rgba(20, 18, 38, 0.5);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .spfa-pb-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .spfa-pb-btn {
    flex: 1;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(20, 184, 166, 0.1);
    color: #cdd6f4;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
  }

  .spfa-pb-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .spfa-pb-btn:not(:disabled):hover {
    background: rgba(20, 184, 166, 0.2);
    border-color: #14b8a6;
    transform: translateY(-1px);
  }

  .spfa-pb-btn.play {
    background: linear-gradient(135deg, #14b8a6, #0d9488);
    border: none;
    color: #fff;
    box-shadow: 0 4px 15px rgba(20, 184, 166, 0.3);
  }

  .spfa-pb-btn.play:not(:disabled):hover {
    box-shadow: 0 6px 20px rgba(20, 184, 166, 0.4);
  }

  .spfa-speed-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: rgba(204, 214, 244, 0.7);
  }

  .spfa-speed-row input {
    flex: 1;
    accent-color: #14b8a6;
  }

  .spfa-counter {
    color: rgba(204, 214, 244, 0.6);
    font-size: 13px;
    font-family: ui-monospace, monospace;
    text-align: center;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  @keyframes popIn {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes pathPulse {
    0%, 100% { stroke-opacity: 1; }
    50% { stroke-opacity: 0.5; }
  }

  .spfa-node {
    transition: all 0.3s ease;
  }

  .spfa-edge {
    transition: all 0.3s ease;
  }
</style>

<div class="spfa-page">
  <div class="spfa-hero">
    <div class="spfa-title-wrapper">
      <div class="spfa-hero-icon">⚡</div>
      <div class="spfa-hero-text">
        <h2>SPFA 算法</h2>
        <p>Bellman-Ford 之队列优化，仅松弛队列中节点的出边</p>
      </div>
    </div>
    <div class="spfa-tip"><strong>优化思路：</strong>SPFA 是对 Bellman-Ford 的队列优化。不再盲目遍历所有边，而是只松弛队列中节点的出边。若邻接节点的距离被更新且不在队列中，则将其入队。平均复杂度接近 O(E)。</div>
  </div>

  <div class="spfa-layout">
    <div class="spfa-main">
      <div class="spfa-card">
        <div class="spfa-controls">
          <button id="spfa-start" class="spfa-btn">开始寻路</button>
        </div>

        <div class="spfa-stats">
          <div class="spfa-stat"><span class="spfa-stat-label">当前节点</span><span class="spfa-stat-val" id="spfa-current">-</span></div>
          <div class="spfa-stat"><span class="spfa-stat-label">队列大小</span><span class="spfa-stat-val" id="spfa-queue-size">0</span></div>
          <div class="spfa-stat"><span class="spfa-stat-label">更新次数</span><span class="spfa-stat-val" id="spfa-update-count">0</span></div>
          <div class="spfa-stat"><span class="spfa-stat-label">状态</span><span class="spfa-stat-val" id="spfa-status">-</span></div>
        </div>

        <div class="spfa-graph-container" id="spfa-graph"></div>

        <div class="spfa-queue-container">
          <div class="spfa-queue-title">队列</div>
          <div class="spfa-queue-row" id="spfa-queue"></div>
        </div>

        <div class="spfa-dist-container">
          <div class="spfa-dist-title">距离数组 dist[]</div>
          <div class="spfa-dist-row" id="spfa-dist"></div>
        </div>

        <div class="spfa-inqueue-container">
          <div class="spfa-inqueue-title">在队列中标志 (inQueue[])</div>
          <div class="spfa-inqueue-row" id="spfa-inqueue"></div>
        </div>

        <div class="spfa-message" id="step-message">点击「开始寻路」执行 SPFA 算法。</div>

        <div class="spfa-log" id="spfa-log"></div>
      </div>
    </div>

    <div class="spfa-right">
      <div data-code-panel class="spfa-code-card"></div>
      <div class="spfa-legend">
        <div class="spfa-legend-item"><span class="spfa-legend-box" style="background:rgba(20,184,166,0.2);border:2px solid #14b8a6"></span>普通节点</div>
        <div class="spfa-legend-item"><span class="spfa-legend-box" style="background:#f59e0b"></span>当前处理节点</div>
        <div class="spfa-legend-item"><span class="spfa-legend-box" style="background:rgba(34,197,94,0.4);border:2px solid #22c55e"></span>松弛成功的边</div>
        <div class="spfa-legend-item"><span class="spfa-legend-box" style="background:rgba(20,184,166,0.5);border:2px solid #14b8a6"></span>队列中节点</div>
      </div>
      <div class="spfa-playback">
        <div class="spfa-pb-row">
          <button id="step-reset" class="spfa-pb-btn">重置</button>
          <button id="step-prev" class="spfa-pb-btn">上一步</button>
          <button id="step-play" class="spfa-pb-btn play">播放</button>
          <button id="step-next" class="spfa-pb-btn">下一步</button>
        </div>
        <div class="spfa-speed-row">
          <span>速度</span>
          <input id="spfa-speed" type="range" min="150" max="1500" step="100" value="700" />
          <span id="spfa-speed-label" style="font-family:ui-monospace,monospace;font-size:13px;color:rgba(204,214,244,0.7);margin-left:4px;">0.7s</span>
        </div>
        <div id="step-counter" class="spfa-counter">步骤: 1 / 1</div>
      </div>
    </div>
  </div>
</div>
