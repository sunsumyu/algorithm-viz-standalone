            <div class="spfa-metric-card">
              <span class="spfa-metric-label">当前出队节点 u</span>
              <span class="spfa-metric-val" id="metric-cur-node" style="color: #c026d3;">—</span>
            </div>
            <div class="spfa-metric-card">
              <span class="spfa-metric-label">考察松弛边 (u -> v)</span>
              <span class="spfa-metric-val" id="metric-relax-edge" style="color: #3b82f6;">—</span>
            </div>
            <div class="spfa-metric-card">
              <span class="spfa-metric-label">队列元素数 queue</span>
              <span class="spfa-metric-val" id="metric-q-size" style="color: #a855f7;">0</span>
            </div>
            <div class="spfa-metric-card">
              <span class="spfa-metric-label">累计入队次数</span>
              <span class="spfa-metric-val" id="metric-in-q-count" style="color: #10b981;">0</span>
            </div>
          </div>

          <div class="spfa-queue-box">
            <span style="color:#64748b; font-weight:700;">SPFA 队列:</span>
            <span id="queue-elements" style="color: #c026d3; font-weight: 800;">[ ]</span>
          </div>

          <div class="spfa-live-alert">
            <span>💡</span> <span id="spfa-live-text">准备就绪，点击运行开始 SPFA 算法演示。</span>
          </div>
        </div>
      </div>

    </section>

    <!-- ================= 右侧：代码终端 + 执行日志 ================= -->
    <section class="spfa-right-section">

      <!-- 卡片 3: 暗色代码终端面板 -->
      <div class="spfa-dark-terminal">
        <div class="spfa-terminal-header">
          <!-- 1. 主 Tab 切换器 (源码 / 题目 / 精讲) -->
          <div class="spfa-tab-group">
            <button id="btn-tab-code" class="spfa-tab-item active">💻 代码调试</button>
            <button id="btn-tab-problem" class="spfa-tab-item">📋 题目描述</button>
            <button id="btn-tab-analysis" class="spfa-tab-item">💡 算法精讲</button>
          </div>

          <!-- 2. 多语言切换器 -->
          <div class="spfa-lang-group" id="code-lang-tabs">
            <button class="spfa-lang-btn active" data-lang="java">Java</button>
            <button class="spfa-lang-btn" data-lang="cpp">C++</button>
            <button class="spfa-lang-btn" data-lang="python">Python</button>
            <button class="spfa-lang-btn" data-lang="javascript">JS</button>
          </div>

          <!-- 3. 字号缩放器与 macOS 窗口微控制 -->
          <div class="spfa-font-tools">
            <div class="spfa-font-scaler">
              <button id="btn-code-font-dec" title="缩小代码字号">A-</button>
              <span id="code-font-indicator" class="spfa-font-indicator">12</span>
              <button id="btn-code-font-inc" title="放大代码字号">A+</button>
            </div>

            <div class="spfa-window-dots">
              <span class="spfa-dot" style="background:#ef4444;"></span>
              <span class="spfa-dot" style="background:#eab308;"></span>
              <span class="spfa-dot" style="background:#22c55e;"></span>
            </div>
          </div>
        </div>

        <!-- 容器 1: 源码高亮与单步追踪视图 -->
        <div id="code-view-container" style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;">
          <div class="spfa-terminal-body">
            <div id="code-lines-wrapper">
              <!-- 动态装载代码行 -->
            </div>
          </div>
        </div>

        <!-- 容器 2: 题目完整描述视图 -->
        <div id="problem-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载题目内容 -->
        </div>

        <!-- 容器 3: 算法精讲视图 -->
        <div id="analysis-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载精讲内容 -->
        </div>
      </div>

      <!-- 卡片 4: 独立执行日志卡片 -->
      <div class="spfa-log-card">
        <div class="spfa-log-header">
          <div class="spfa-log-header-title">
            <span>📜 执行日志</span>
          </div>
          <span id="log-count" class="spfa-log-count">0 条记录</span>
        </div>

        <div id="log-container" class="spfa-log-body">
          <!-- 动态填充日志条目 -->
        </div>
      </div>

    </section>

  </main>

  <!-- 4. 力扣原题描述轻量模态弹窗 (Modal) -->
  <div id="modal-problem" class="spfa-modal-backdrop hidden">
    <div class="spfa-modal-content">
      <div class="spfa-modal-header">
        <div class="spfa-modal-title">
          <span>📋 算法原理与队列优化解析</span>
        </div>
        <button id="btn-close-problem-modal" class="spfa-modal-close" title="关闭 (Esc)">✕</button>
      </div>
      <div id="modal-problem-body" class="spfa-modal-body">
        <!-- 动态装载题目内容 -->
      </div>
    </div>
  </div>
</div>
