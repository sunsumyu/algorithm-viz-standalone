            <div class="scc-metric-card">
              <span class="scc-metric-label">强连通判定 Result</span>
              <span class="scc-metric-val" id="metric-is-scc" style="color: #16a34a;">待定</span>
            </div>
          </div>

          <div class="scc-formula-box">
            <span style="color:#64748b;">强连通充分必要条件:</span>
            <strong id="formula-action" style="color: #2563eb;">正向 DFS 全可达 ∧ 反向 DFS 全可达 ⟺ 强连通</strong>
          </div>

          <div class="scc-live-alert">
            <span>💡</span> <span id="scc-live-text">准备就绪，点击运行开始强连通性检测。</span>
          </div>
        </div>
      </div>

    </section>

    <!-- ================= 右侧：代码终端 + 执行日志 ================= -->
    <section class="scc-right-section">

      <!-- 卡片 3: 暗色代码终端面板 -->
      <div class="scc-dark-terminal">
        <div class="scc-terminal-header">
          <!-- 1. 主 Tab 切换器 (源码 / 题目 / 精讲) -->
          <div class="scc-tab-group">
            <button id="btn-tab-code" class="scc-tab-item active">💻 代码调试</button>
            <button id="btn-tab-problem" class="scc-tab-item">📋 题目描述</button>
            <button id="btn-tab-analysis" class="scc-tab-item">💡 算法精讲</button>
          </div>

          <!-- 2. 多语言切换器 -->
          <div class="scc-lang-group" id="code-lang-tabs">
            <button class="scc-lang-btn active" data-lang="java">Java</button>
            <button class="scc-lang-btn" data-lang="cpp">C++</button>
            <button class="scc-lang-btn" data-lang="python">Python</button>
            <button class="scc-lang-btn" data-lang="javascript">JS</button>
          </div>

          <!-- 3. 字号缩放器与 macOS 窗口微控制 -->
          <div class="scc-font-tools">
            <div class="scc-font-scaler">
              <button id="btn-code-font-dec" title="缩小代码字号">A-</button>
              <span id="code-font-indicator" class="scc-font-indicator">12</span>
              <button id="btn-code-font-inc" title="放大代码字号">A+</button>
            </div>

            <div class="scc-window-dots">
              <span class="scc-dot" style="background:#ef4444;"></span>
              <span class="scc-dot" style="background:#eab308;"></span>
              <span class="scc-dot" style="background:#22c55e;"></span>
            </div>
          </div>
        </div>

        <!-- 容器 1: 源码高亮与单步追踪视图 -->
        <div id="code-view-container" style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;">
          <div class="scc-terminal-body">
            <div id="code-lines-wrapper">
              <!-- 动态装载代码行 -->
            </div>
          </div>
        </div>

        <!-- 容器 2: 题目完整描述视图 -->
        <div id="problem-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载题目内容 -->
        </div>

        <!-- 容器 3: 算法精讲视图 -->
        <div id="analysis-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载精讲内容 -->
        </div>
      </div>

      <!-- 卡片 4: 独立执行日志卡片 -->
      <div class="scc-log-card">
        <div class="scc-log-header">
          <div class="scc-log-header-title">
            <span>📜 执行日志</span>
          </div>
          <span id="log-count" class="scc-log-count">0 条记录</span>
        </div>

        <div id="log-container" class="scc-log-body">
          <!-- 动态填充日志条目 -->
        </div>
      </div>

    </section>

  </main>

  <!-- 4. 力扣原题描述轻量模态弹窗 (Modal) -->
  <div id="modal-problem" class="scc-modal-backdrop hidden">
    <div class="scc-modal-content">
      <div class="scc-modal-header">
        <div class="scc-modal-title">
          <span>📋 算法原理与题目说明</span>
        </div>
        <button id="btn-close-problem-modal" class="scc-modal-close" title="关闭 (Esc)">✕</button>
      </div>
      <div id="modal-problem-body" class="scc-modal-body">
        <!-- 动态装载题目内容 -->
      </div>
    </div>
  </div>
</div>
