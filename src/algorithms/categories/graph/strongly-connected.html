<style>
  #algo-strongly-connected-view {
    width: 100%; height: 100%;
    color: #cdd6f4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    position: relative; overflow: hidden;
  }

  #algo-strongly-connected-view::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at 10% 5%, #6366f155, transparent 55%),
                radial-gradient(ellipse at 90% 95%, #4f46e555, transparent 55%),
                linear-gradient(135deg, #0f0a2e 0%, #312e81 25%, #0f0a2e 50%, #3730a3 75%, #0f0a2e 100%);
    z-index: -2;
  }

  #algo-strongly-connected-view::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at center, rgba(15, 10, 46, 0.4), transparent 70%);
    z-index: -1;
  }

  .scc-page { height: 100%; display: flex; flex-direction: column; overflow: hidden; }

  .scc-hero {
    padding: 16px 24px; background: rgba(20,18,38,0.5);
    backdrop-filter: blur(18px) saturate(160%);
    border-bottom: 1px solid rgba(255,255,255,0.08); border-radius: 0 0 16px 16px;
    display: flex; justify-content: space-between; align-items: center; gap: 24px;
  }

  .scc-hero .scc-title-wrapper { display: flex; align-items: center; gap: 12px; }

  .scc-hero-icon {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; box-shadow: 0 4px 15px rgba(99,102,241,0.3);
  }

  .scc-hero-text h2 {
    margin: 0 0 4px; font-size: 22px; font-weight: 800;
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }

  .scc-hero-text p { margin: 0; color: rgba(204,214,244,0.8); font-size: 13px; }

  .scc-tip {
    max-width: 480px; padding: 12px 16px; border-radius: 12px;
    background: rgba(99,102,241,0.08); border: 1px solid rgba(99,102,241,0.2);
    color: rgba(204,214,244,0.9); font-size: 13px; line-height: 1.55;
  }

  .scc-tip strong { color: #6366f1; font-weight: 600; }

  #algo-strongly-connected-view .scc-layout {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: 1fr 380px;
    gap: 16px; padding: 16px; overflow: hidden;
  }

  @media (max-width: 1100px) {
    #algo-strongly-connected-view .scc-layout { grid-template-columns: 1fr; overflow: auto; }
  }

  .scc-main { min-width: 0; display: flex; flex-direction: column; gap: 16px; overflow: hidden; flex: 1; }

  .scc-card {
    background: rgba(20,18,38,0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  }

  .scc-controls {
    padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }

  .scc-input {
    flex: 1; min-width: 140px; padding: 10px 14px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(11,10,23,0.8); color: #cdd6f4;
    font-family: ui-monospace, monospace; font-size: 13px;
    outline: none; transition: border-color 0.2s, box-shadow 0.2s;
  }

  .scc-input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }

  .scc-btn {
    padding: 10px 18px; border-radius: 10px; border: none;
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    color: #fff; font-weight: 600; cursor: pointer; font-size: 13px;
    transition: all 0.2s; box-shadow: 0 4px 15px rgba(99,102,241,0.3);
  }

  .scc-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(99,102,241,0.4); }

  .scc-example {
    padding: 8px 14px; border-radius: 999px;
    border: 1px solid rgba(99,102,241,0.3);
    background: rgba(99,102,241,0.1); color: #cdd6f4;
    font-size: 12px; cursor: pointer; transition: all 0.2s;
  }

  .scc-example:hover { background: rgba(99,102,241,0.2); border-color: #6366f1; }

  .scc-stats {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 12px; padding: 14px; border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .scc-stat {
    padding: 14px 0; position: relative;
    background: rgba(20,18,38,0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; overflow: hidden;
  }

  .scc-stat::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, #6366f1, #4f46e5);
  }

  .scc-stat-label { display: block; margin-bottom: 6px; color: rgba(204,214,244,0.7); font-size: 12px; }
  .scc-stat-val { color: #6366f1; font-family: ui-monospace, monospace; font-size: 19px; font-weight: 700; }

  .scc-graph-container {
    padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 280px;
  }

  .scc-graph-container svg {
    width: 100%; max-width: 480px; height: 260px;
  }

  .scc-reach-container {
    padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.08);
  }

  .scc-reach-title {
    color: rgba(204,214,244,0.7); font-size: 12px; margin-bottom: 10px;
  }

  .scc-reach {
    display: flex; gap: 8px; flex-wrap: wrap; min-height: 36px; align-items: center;
  }

  .scc-reach-item {
    padding: 6px 12px; border-radius: 8px;
    background: rgba(99,102,241,0.2); border: 1px solid rgba(99,102,241,0.4);
    color: #a5b4fc; font-family: ui-monospace, monospace; font-size: 13px; font-weight: 600;
    animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .scc-reach-item.unreachable {
    background: rgba(244,63,94,0.2); border-color: rgba(244,63,94,0.4); color: #fda4af;
  }

  .scc-message {
    margin: 0 14px 14px; padding: 12px 16px; border-radius: 12px;
    border: 1px solid rgba(99,102,241,0.2); background: rgba(99,102,241,0.08);
    color: #cdd6f4; font-size: 13px; line-height: 1.5;
  }

  .scc-log {
    min-height: 0; max-height: 130px; padding: 14px 16px; overflow: auto;
    background: rgba(11,10,23,0.8); font-family: ui-monospace, monospace;
    font-size: 12px; line-height: 1.7; color: rgba(204,214,244,0.8);
  }

  .scc-log div { padding: 2px 0; }
  .scc-log div.active { color: #6366f1; font-weight: 600; }

  .scc-right { display: flex; flex-direction: column; gap: 16px; overflow: hidden; }

  .scc-code-card {
    background: rgba(11,10,23,0.8); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; overflow: hidden; flex: 1;
  }

  .scc-legend {
    background: rgba(20,18,38,0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 16px;
    padding: 14px; font-size: 12px; display: flex; flex-direction: column; gap: 8px;
  }

  .scc-legend-item { display: flex; align-items: center; gap: 10px; }
  .scc-legend-box { width: 16px; height: 16px; border-radius: 50%; }

  .scc-playback {
    background: rgba(20,18,38,0.5);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 16px;
    padding: 16px; display: flex; flex-direction: column; gap: 12px;
  }

  .scc-pb-row { display: flex; gap: 10px; align-items: center; }

  .scc-pb-btn {
    flex: 1; padding: 12px 16px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(99,102,241,0.1); color: #cdd6f4;
    cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s;
  }

  .scc-pb-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .scc-pb-btn:not(:disabled):hover { background: rgba(99,102,241,0.2); border-color: #6366f1; transform: translateY(-1px); }

  .scc-pb-btn.play {
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    border: none; color: #fff; box-shadow: 0 4px 15px rgba(99,102,241,0.3);
  }

  .scc-pb-btn.play:not(:disabled):hover { box-shadow: 0 6px 20px rgba(99,102,241,0.4); }

  .scc-speed-row {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; color: rgba(204,214,244,0.7);
  }

  .scc-speed-row input { flex: 1; accent-color: #6366f1; }

  .scc-counter {
    color: rgba(204,214,244,0.6); font-size: 13px;
    font-family: ui-monospace, monospace; text-align: center;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  @keyframes popIn {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .scc-node { transition: all 0.3s ease; }
  .scc-edge { transition: all 0.3s ease; }
</style>

<div class="scc-page">
  <div class="scc-hero">
    <div class="scc-title-wrapper">
      <div class="scc-hero-icon">🔗</div>
      <div class="scc-hero-text">
        <h2>完全连通性</h2>
        <p>检测有向图中所有节点是否能互相到达</p>
      </div>
    </div>
    <div class="scc-tip"><strong>算法要点：</strong>从每个节点 BFS/DFS，检查是否可达所有节点。若每个节点的可达集均为全集，则为强连通。也可用 Kosaraju 算法。</div>
  </div>

  <div class="scc-layout">
    <div class="scc-main">
      <div class="scc-card">
        <div class="scc-controls">
          <input id="scc-adj-input" class="scc-input" value="0:1; 1:2; 2:0" title="邻接表格式: 源:目标1,目标2; ..." />
          <button id="scc-start" class="scc-btn">检测连通</button>
          <button class="scc-example" data-adj="0:1; 1:2; 2:0">示例1</button>
          <button class="scc-example" data-adj="0:1,2; 1:2; 2:0">示例2</button>
          <button class="scc-example" data-adj="0:1; 1:2; 2:3; 3:0; 4:">示例3</button>
          <button class="scc-example" data-adj="0:1; 1:0; 2:3; 3:2">示例4</button>
        </div>

        <div class="scc-stats">
          <div class="scc-stat"><span class="scc-stat-label">BFS源</span><span class="scc-stat-val" id="scc-source">-</span></div>
          <div class="scc-stat"><span class="scc-stat-label">已访问</span><span class="scc-stat-val" id="scc-visited">0</span></div>
          <div class="scc-stat"><span class="scc-stat-label">节点总数</span><span class="scc-stat-val" id="scc-total">0</span></div>
          <div class="scc-stat"><span class="scc-stat-label">结果</span><span class="scc-stat-val" id="scc-result">-</span></div>
        </div>

        <div class="scc-graph-container" id="scc-graph"></div>

        <div class="scc-reach-container">
          <div class="scc-reach-title">当前 BFS 可达节点</div>
          <div class="scc-reach" id="scc-reach-list"></div>
        </div>

        <div class="scc-message" id="step-message">输入有向图邻接表，点击「检测连通」检测强连通性。</div>

        <div class="scc-log" id="scc-log"></div>
      </div>
    </div>

    <div class="scc-right">
      <div data-code-panel class="scc-code-card"></div>
      <div class="scc-legend">
        <div class="scc-legend-item"><span class="scc-legend-box" style="background:rgba(99,102,241,0.2);border:2px solid #6366f1"></span>未访问</div>
        <div class="scc-legend-item"><span class="scc-legend-box" style="background:#818cf8"></span>当前 BFS 源</div>
        <div class="scc-legend-item"><span class="scc-legend-box" style="background:#a5b4fc"></span>可达</div>
        <div class="scc-legend-item"><span class="scc-legend-box" style="background:#fda4af;border:2px solid #f43f5e"></span>不可达</div>
      </div>
      <div class="scc-playback">
        <div class="scc-pb-row">
          <button id="step-reset" class="scc-pb-btn">重置</button>
          <button id="step-prev" class="scc-pb-btn">上一步</button>
          <button id="step-play" class="scc-pb-btn play">播放</button>
          <button id="step-next" class="scc-pb-btn">下一步</button>
        </div>
        <div class="scc-speed-row">
          <span>速度</span>
          <input id="scc-speed" type="range" min="150" max="1500" step="100" value="700" />
          <span id="scc-speed-label" style="font-family:ui-monospace,monospace;font-size:13px;color:rgba(204,214,244,0.7);margin-left:4px;">0.7s</span>
        </div>
        <div id="step-counter" class="scc-counter">步骤: 1 / 1</div>
      </div>
    </div>
  </div>
</div>
