<div class="ts-page">
  <div class="ts-hero">

      <div class="ts-hero-icon">📐</div>

        <h2>拓扑排序</h2>
        <p>Kahn 算法：反复移除入度为 0 的节点，得到 DAG 的线性序</p>
      </div>
    </div>
    <div class="ts-tip"><strong>核心思想：</strong>计算所有节点的入度，将入度为 0 的节点加入队列。每次取出队首节点加入拓扑序，并减少其邻接节点的入度。若邻接节点入度变为 0，则入队。最终得到 DAG 的拓扑排序。</div>

        </div>

          <div class="ts-result-title">拓扑排序结果</div>
          <div class="ts-result-row" id="ts-result"></div>
        </div>

        <div class="ts-log" id="ts-log"></div>
      </div>
    </div>

      <div data-code-panel class="ts-code-card"></div>
