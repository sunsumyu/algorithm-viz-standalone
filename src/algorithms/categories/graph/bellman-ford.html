<style>
  #algo-bellman-ford-view {
    width: 100%;
    height: 100%;
    color: #cdd6f4;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    position: relative;
    overflow: hidden;
  }

  #algo-bellman-ford-view::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: radial-gradient(ellipse at 10% 5%, #f9731655, transparent 55%),
                radial-gradient(ellipse at 90% 95%, #ea580c55, transparent 55%),
                linear-gradient(135deg, #431407 0%, #7c2d12 25%, #431407 50%, #9a3412 75%, #431407 100%);
    z-index: -2;
  }

  #algo-bellman-ford-view::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(67, 20, 7, 0.4), transparent 70%);
    z-index: -1;
  }

  #algo-bellman-ford-view .bf-page {
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .bf-hero {
    padding: 16px 24px;
    background: rgba(20, 18, 38, 0.5);
    backdrop-filter: blur(18px) saturate(160%);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 0 0 16px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
  }

  .bf-hero .bf-title-wrapper {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .bf-hero-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, #f97316, #ea580c);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
  }

  .bf-hero-text h2 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 800;
    background: linear-gradient(135deg, #f97316, #ea580c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .bf-hero-text p {
    margin: 0;
    color: rgba(204, 214, 244, 0.8);
    font-size: 13px;
  }

  .bf-tip {
    max-width: 480px;
    padding: 12px 16px;
    border-radius: 12px;
    background: rgba(249, 115, 22, 0.08);
    border: 1px solid rgba(249, 115, 22, 0.2);
    color: rgba(204, 214, 244, 0.9);
    font-size: 13px;
    line-height: 1.55;
  }

  .bf-tip strong {
    color: #f97316;
    font-weight: 600;
  }

  #algo-bellman-ford-view .bf-layout {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 16px;
    padding: 16px;
    overflow: hidden;
  }

  @media (max-width: 1100px) {
    #algo-bellman-ford-view .bf-layout {
      grid-template-columns: 1fr;
      overflow: auto;
    }
  }

  .bf-main {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow: hidden;
    flex: 1;
  }

  .bf-card {
    background: rgba(20, 18, 38, 0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }

  .bf-controls {
    padding: 14px 18px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .bf-btn {
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: linear-gradient(135deg, #f97316, #ea580c);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
    box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
  }

  .bf-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(249, 115, 22, 0.4);
  }

  .bf-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    padding: 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .bf-stat {
    padding: 14px 0;
    position: relative;
    background: rgba(20, 18, 38, 0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    overflow: hidden;
  }

  .bf-stat::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #f97316, #ea580c);
  }

  .bf-stat-label {
    display: block;
    margin-bottom: 6px;
    color: rgba(204, 214, 244, 0.7);
    font-size: 12px;
  }

  .bf-stat-val {
    color: #f97316;
    font-family: ui-monospace, monospace;
    font-size: 19px;
    font-weight: 700;
  }

  .bf-graph-container {
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 280px;
  }

  .bf-graph-container svg {
    width: 100%;
    max-width: 480px;
    height: 280px;
  }

  .bf-dist-container {
    padding: 16px 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }

  .bf-dist-title {
    color: rgba(204, 214, 244, 0.7);
    font-size: 12px;
    margin-bottom: 10px;
    font-weight: 600;
  }

  .bf-dist-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    min-height: 36px;
    align-items: center;
  }

  .bf-dist-item {
    padding: 6px 10px;
    border-radius: 8px;
    background: rgba(249, 115, 22, 0.15);
    border: 1px solid rgba(249, 115, 22, 0.3);
    color: #f97316;
    font-family: ui-monospace, monospace;
    font-size: 12px;
    font-weight: 600;
    min-width: 32px;
    text-align: center;
    animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .bf-dist-item .bf-idx {
    display: block;
    font-size: 9px;
    color: rgba(204, 214, 244, 0.5);
    margin-bottom: 2px;
  }

  .bf-dist-item.updated {
    background: rgba(249, 115, 22, 0.4);
    border-color: #f97316;
    box-shadow: 0 0 8px rgba(249, 115, 22, 0.4);
  }

  .bf-message {
    margin: 0 14px 14px;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid rgba(249, 115, 22, 0.2);
    background: rgba(249, 115, 22, 0.08);
    color: #cdd6f4;
    font-size: 13px;
    line-height: 1.5;
  }

  .bf-log {
    min-height: 0;
    max-height: 120px;
    padding: 14px 16px;
    overflow: auto;
    background: rgba(11, 10, 23, 0.8);
    font-family: ui-monospace, monospace;
    font-size: 12px;
    line-height: 1.7;
    color: rgba(204, 214, 244, 0.8);
  }

  .bf-log div {
    padding: 2px 0;
  }

  .bf-log div.active {
    color: #f97316;
    font-weight: 600;
  }

  .bf-right {
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow: hidden;
  }

  .bf-code-card {
    background: rgba(11, 10, 23, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    overflow: hidden;
    flex: 1;
  }

  .bf-legend {
    background: rgba(20, 18, 38, 0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 14px;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .bf-legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .bf-legend-box {
    width: 16px;
    height: 16px;
    border-radius: 4px;
  }

  .bf-playback {
    background: rgba(20, 18, 38, 0.5);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .bf-pb-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .bf-pb-btn {
    flex: 1;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(249, 115, 22, 0.1);
    color: #cdd6f4;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
  }

  .bf-pb-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .bf-pb-btn:not(:disabled):hover {
    background: rgba(249, 115, 22, 0.2);
    border-color: #f97316;
    transform: translateY(-1px);
  }

  .bf-pb-btn.play {
    background: linear-gradient(135deg, #f97316, #ea580c);
    border: none;
    color: #fff;
    box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
  }

  .bf-pb-btn.play:not(:disabled):hover {
    box-shadow: 0 6px 20px rgba(249, 115, 22, 0.4);
  }

  .bf-speed-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: rgba(204, 214, 244, 0.7);
  }

  .bf-speed-row input {
    flex: 1;
    accent-color: #f97316;
  }

  .bf-counter {
    color: rgba(204, 214, 244, 0.6);
    font-size: 13px;
    font-family: ui-monospace, monospace;
    text-align: center;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  @keyframes popIn {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes pathPulse {
    0%, 100% { stroke-opacity: 1; }
    50% { stroke-opacity: 0.5; }
  }

  .bf-node {
    transition: all 0.3s ease;
  }

  .bf-edge {
    transition: all 0.3s ease;
  }
</style>

<div class="bf-page">
  <div class="bf-hero">
    <div class="bf-title-wrapper">
      <div class="bf-hero-icon">🔄</div>
      <div class="bf-hero-text">
        <h2>Bellman-Ford 算法</h2>
        <p>松弛所有边 V-1 轮，支持负权边</p>
      </div>
    </div>
    <div class="bf-tip"><strong>核心思想：</strong>对所有边进行 V-1 轮松弛操作。每轮遍历全部边，如果 dist[u]+w &lt; dist[v] 则更新 dist[v]。V-1 轮后得到最短路径。还可以检测负环。</div>
  </div>

  <div class="bf-layout">
    <div class="bf-main">
      <div class="bf-card">
        <div class="bf-controls">
          <button id="bf-start" class="bf-btn">开始寻路</button>
        </div>

        <div class="bf-stats">
          <div class="bf-stat"><span class="bf-stat-label">当前轮次</span><span class="bf-stat-val" id="bf-round">-</span></div>
          <div class="bf-stat"><span class="bf-stat-label">当前边</span><span class="bf-stat-val" id="bf-edge">-</span></div>
          <div class="bf-stat"><span class="bf-stat-label">更新次数</span><span class="bf-stat-val" id="bf-update-count">0</span></div>
          <div class="bf-stat"><span class="bf-stat-label">状态</span><span class="bf-stat-val" id="bf-status">-</span></div>
        </div>

        <div class="bf-graph-container" id="bf-graph"></div>

        <div class="bf-dist-container">
          <div class="bf-dist-title">距离数组 dist[]</div>
          <div class="bf-dist-row" id="bf-dist"></div>
        </div>

        <div class="bf-message" id="step-message">点击「开始寻路」执行 Bellman-Ford 算法。</div>

        <div class="bf-log" id="bf-log"></div>
      </div>
    </div>

    <div class="bf-right">
      <div data-code-panel class="bf-code-card"></div>
      <div class="bf-legend">
        <div class="bf-legend-item"><span class="bf-legend-box" style="background:rgba(249,115,22,0.2);border:2px solid #f97316"></span>未处理节点</div>
        <div class="bf-legend-item"><span class="bf-legend-box" style="background:#f59e0b"></span>当前处理节点(u)</div>
        <div class="bf-legend-item"><span class="bf-legend-box" style="background:rgba(239,68,68,0.4);border:2px solid #ef4444"></span>正在松弛的边</div>
        <div class="bf-legend-item"><span class="bf-legend-box" style="background:rgba(34,197,94,0.4);border:2px solid #22c55e"></span>松弛成功(距离缩短)</div>
      </div>
      <div class="bf-playback">
        <div class="bf-pb-row">
          <button id="step-reset" class="bf-pb-btn">重置</button>
          <button id="step-prev" class="bf-pb-btn">上一步</button>
          <button id="step-play" class="bf-pb-btn play">播放</button>
          <button id="step-next" class="bf-pb-btn">下一步</button>
        </div>
        <div class="bf-speed-row">
          <span>速度</span>
          <input id="bf-speed" type="range" min="150" max="1500" step="100" value="700" />
          <span id="bf-speed-label" style="font-family:ui-monospace,monospace;font-size:13px;color:rgba(204,214,244,0.7);margin-left:4px;">0.7s</span>
        </div>
        <div id="step-counter" class="bf-counter">步骤: 1 / 1</div>
      </div>
    </div>
  </div>
</div>
