<style>
  #algo-dfs-theory-view {
    width: 100%;
    height: 100%;
    color: #cdd6f4;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    position: relative;
    overflow: hidden;
  }

  #algo-dfs-theory-view::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: radial-gradient(ellipse at 10% 5%, #8b5cf655, transparent 55%),
                radial-gradient(ellipse at 90% 95%, #7c3aed55, transparent 55%),
                linear-gradient(135deg, #1e1b4b 0%, #312e81 25%, #1e1b4b 50%, #3730a3 75%, #1e1b4b 100%);
    z-index: -2;
  }

  #algo-dfs-theory-view::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(30, 27, 75, 0.4), transparent 70%);
    z-index: -1;
  }

  #algo-dfs-theory-view .dfs-page {
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .dfs-hero {
    padding: 16px 24px;
    background: rgba(20, 18, 38, 0.5);
    backdrop-filter: blur(18px) saturate(160%);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 0 0 16px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
  }

  .dfs-hero .dfs-title-wrapper {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .dfs-hero-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, #8b5cf6, #7c3aed);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
  }

  .dfs-hero-text h2 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 800;
    background: linear-gradient(135deg, #8b5cf6, #7c3aed);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .dfs-hero-text p {
    margin: 0;
    color: rgba(204, 214, 244, 0.8);
    font-size: 13px;
  }

  .dfs-tip {
    max-width: 480px;
    padding: 12px 16px;
    border-radius: 12px;
    background: rgba(139, 92, 246, 0.08);
    border: 1px solid rgba(139, 92, 246, 0.2);
    color: rgba(204, 214, 244, 0.9);
    font-size: 13px;
    line-height: 1.55;
  }

  .dfs-tip strong {
    color: #8b5cf6;
    font-weight: 600;
  }

  #algo-dfs-theory-view .dfs-layout {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 16px;
    padding: 16px;
    overflow: hidden;
  }

  @media (max-width: 1100px) {
    #algo-dfs-theory-view .dfs-layout {
      grid-template-columns: 1fr;
      overflow: auto;
    }
  }

  .dfs-main {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow: hidden;
    flex: 1;
  }

  .dfs-card {
    background: rgba(20, 18, 38, 0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }

  .dfs-controls {
    padding: 14px 18px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .dfs-btn {
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: linear-gradient(135deg, #8b5cf6, #7c3aed);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
    box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
  }

  .dfs-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
  }

  .dfs-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    padding: 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .dfs-stat {
    padding: 14px 0;
    position: relative;
    background: rgba(20, 18, 38, 0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    overflow: hidden;
  }

  .dfs-stat::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #8b5cf6, #7c3aed);
  }

  .dfs-stat-label {
    display: block;
    margin-bottom: 6px;
    color: rgba(204, 214, 244, 0.7);
    font-size: 12px;
  }

  .dfs-stat-val {
    color: #8b5cf6;
    font-family: ui-monospace, monospace;
    font-size: 19px;
    font-weight: 700;
  }

  .dfs-graph-container {
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 260px;
  }

  .dfs-graph-container svg {
    width: 100%;
    max-width: 480px;
    height: 240px;
  }

  .dfs-stack-container {
    padding: 16px 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }

  .dfs-stack-title {
    color: rgba(204, 214, 244, 0.7);
    font-size: 12px;
    margin-bottom: 10px;
  }

  .dfs-stack {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    min-height: 36px;
    align-items: center;
  }

  .dfs-stack-item {
    padding: 6px 12px;
    border-radius: 8px;
    background: rgba(139, 92, 246, 0.2);
    border: 1px solid rgba(139, 92, 246, 0.4);
    color: #8b5cf6;
    font-family: ui-monospace, monospace;
    font-size: 13px;
    font-weight: 600;
    animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .dfs-stack-item.top {
    background: linear-gradient(135deg, #8b5cf6, #7c3aed);
    color: #fff;
    box-shadow: 0 2px 10px rgba(139, 92, 246, 0.4);
  }

  .dfs-order-container {
    padding: 16px 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }

  .dfs-order-title {
    color: rgba(204, 214, 244, 0.7);
    font-size: 12px;
    margin-bottom: 10px;
  }

  .dfs-order {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    min-height: 36px;
    align-items: center;
  }

  .dfs-order-item {
    padding: 6px 12px;
    border-radius: 8px;
    background: rgba(16, 185, 129, 0.2);
    border: 1px solid rgba(16, 185, 129, 0.4);
    color: #10b981;
    font-family: ui-monospace, monospace;
    font-size: 13px;
    font-weight: 600;
    animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .dfs-message {
    margin: 0 14px 14px;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid rgba(139, 92, 246, 0.2);
    background: rgba(139, 92, 246, 0.08);
    color: #cdd6f4;
    font-size: 13px;
    line-height: 1.5;
  }

  .dfs-log {
    min-height: 0;
    max-height: 130px;
    padding: 14px 16px;
    overflow: auto;
    background: rgba(11, 10, 23, 0.8);
    font-family: ui-monospace, monospace;
    font-size: 12px;
    line-height: 1.7;
    color: rgba(204, 214, 244, 0.8);
  }

  .dfs-log div {
    padding: 2px 0;
  }

  .dfs-log div.active {
    color: #8b5cf6;
    font-weight: 600;
  }

  .dfs-right {
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow: hidden;
  }

  .dfs-code-card {
    background: rgba(11, 10, 23, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    overflow: hidden;
    flex: 1;
  }

  .dfs-legend {
    background: rgba(20, 18, 38, 0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 14px;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .dfs-legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .dfs-legend-box {
    width: 16px;
    height: 16px;
    border-radius: 50%;
  }

  .dfs-playback {
    background: rgba(20, 18, 38, 0.5);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .dfs-pb-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .dfs-pb-btn {
    flex: 1;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(139, 92, 246, 0.1);
    color: #cdd6f4;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
  }

  .dfs-pb-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .dfs-pb-btn:not(:disabled):hover {
    background: rgba(139, 92, 246, 0.2);
    border-color: #8b5cf6;
    transform: translateY(-1px);
  }

  .dfs-pb-btn.play {
    background: linear-gradient(135deg, #8b5cf6, #7c3aed);
    border: none;
    color: #fff;
    box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
  }

  .dfs-pb-btn.play:not(:disabled):hover {
    box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
  }

  .dfs-speed-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: rgba(204, 214, 244, 0.7);
  }

  .dfs-speed-row input {
    flex: 1;
    accent-color: #8b5cf6;
  }

  .dfs-counter {
    color: rgba(204, 214, 244, 0.6);
    font-size: 13px;
    font-family: ui-monospace, monospace;
    text-align: center;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  @keyframes popIn {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .dfs-node {
    transition: all 0.3s ease;
  }

  .dfs-edge {
    transition: all 0.3s ease;
  }
</style>

<div class="dfs-page">
  <div class="dfs-hero">
    <div class="dfs-title-wrapper">
      <div class="dfs-hero-icon">🔍</div>
      <div class="dfs-hero-text">
        <h2>深度优先搜索理论基础</h2>
        <p>DFS 遍历图：递归深入、回溯、访问顺序、递归栈可视化</p>
      </div>
    </div>
    <div class="dfs-tip"><strong>DFS 核心：</strong>从起点出发，沿一条路一直走到底，走不通时回溯到上一个分叉点，再选另一条路继续走。</div>
  </div>

  <div class="dfs-layout">
    <div class="dfs-main">
      <div class="dfs-card">
        <div class="dfs-controls">
          <button id="dfs-start" class="dfs-btn">开始遍历</button>
        </div>

        <div class="dfs-stats">
          <div class="dfs-stat"><span class="dfs-stat-label">当前节点</span><span class="dfs-stat-val" id="dfs-current">-</span></div>
          <div class="dfs-stat"><span class="dfs-stat-label">递归深度</span><span class="dfs-stat-val" id="dfs-depth">0</span></div>
          <div class="dfs-stat"><span class="dfs-stat-label">已访问</span><span class="dfs-stat-val" id="dfs-visited">0</span></div>
          <div class="dfs-stat"><span class="dfs-stat-label">步骤</span><span class="dfs-stat-val" id="dfs-step-num">0</span></div>
        </div>

        <div class="dfs-graph-container" id="dfs-graph"></div>

        <div class="dfs-stack-container">
          <div class="dfs-stack-title">递归栈 (Stack)</div>
          <div class="dfs-stack" id="dfs-stack"></div>
        </div>

        <div class="dfs-order-container">
          <div class="dfs-order-title">遍历顺序 (Traversal Order)</div>
          <div class="dfs-order" id="dfs-order"></div>
        </div>

        <div class="dfs-message" id="step-message">点击「开始遍历」观看 DFS 遍历过程。</div>

        <div class="dfs-log" id="dfs-log"></div>
      </div>
    </div>

    <div class="dfs-right">
      <div data-code-panel class="dfs-code-card"></div>
      <div class="dfs-legend">
        <div class="dfs-legend-item"><span class="dfs-legend-box" style="background:rgba(139,92,246,0.2);border:2px solid #8b5cf6"></span>未访问</div>
        <div class="dfs-legend-item"><span class="dfs-legend-box" style="background:#f59e0b"></span>当前访问</div>
        <div class="dfs-legend-item"><span class="dfs-legend-box" style="background:#10b981"></span>已访问</div>
      </div>
      <div class="dfs-playback">
        <div class="dfs-pb-row">
          <button id="step-reset" class="dfs-pb-btn">重置</button>
          <button id="step-prev" class="dfs-pb-btn">上一步</button>
          <button id="step-play" class="dfs-pb-btn play">播放</button>
          <button id="step-next" class="dfs-pb-btn">下一步</button>
        </div>
        <div class="dfs-speed-row">
          <span>速度</span>
          <input id="dfs-speed" type="range" min="150" max="1500" step="100" value="700" />
          <span id="dfs-speed-label" style="font-family:ui-monospace,monospace;font-size:13px;color:rgba(204,214,244,0.7);margin-left:4px;">0.7s</span>
        </div>
        <div id="step-counter" class="dfs-counter">步骤: 1 / 1</div>
      </div>
    </div>
  </div>
</div>
