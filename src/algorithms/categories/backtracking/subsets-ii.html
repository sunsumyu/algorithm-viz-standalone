<style>
  /* === 子集 II · 玻璃感 + chip 脉冲 + 去重 shake + 收集 burst === */
  #algo-subsets-ii-view {
    --accent-a: #fbbf24;
    --accent-b: #fb7185;
    --accent-glow: rgba(251, 191, 36, .4);
    width: 100%; height: 100%;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background:
      radial-gradient(ellipse at 8% 6%, rgba(251, 191, 36, .22), transparent 55%),
      radial-gradient(ellipse at 92% 94%, rgba(251, 113, 133, .22), transparent 55%),
      linear-gradient(135deg, #1a0e05 0%, #1d0e1a 50%, #2a1a20 100%);
    overflow: hidden;
  }
  #algo-subsets-ii-view .bt-shell {
    width: 100%; height: 100%;
    display: grid; grid-template-rows: auto 1fr; overflow: hidden;
  }
  #algo-subsets-ii-view .bt-hero {
    padding: 18px 24px 12px;
    display: flex; gap: 18px; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, .06);
    background: rgba(8, 8, 24, .35);
    backdrop-filter: blur(14px) saturate(150%);
  }
  #algo-subsets-ii-view .bt-hero-left { display: flex; align-items: center; gap: 14px; }
  #algo-subsets-ii-view .bt-icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 24px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; box-shadow: 0 6px 20px var(--accent-glow);
  }
  #algo-subsets-ii-view h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: #f1f5f9; }
  #algo-subsets-ii-view .bt-sub { color: #94a3b8; font-size: 12.5px; margin-top: 4px; }
  #algo-subsets-ii-view .bt-tip {
    max-width: 540px; padding: 10px 14px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(251, 191, 36, .12), rgba(251, 113, 133, .08));
    border: 1px solid rgba(251, 191, 36, .3);
    color: #cbd5e1; font-size: 12.5px; line-height: 1.65;
  }
  #algo-subsets-ii-view .bt-tip strong { color: #fde68a; }
  #algo-subsets-ii-view .bt-main {
    min-height: 0; display: grid;
    grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; padding: 16px; overflow: hidden;
  }
  #algo-subsets-ii-view .bt-left { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
  #algo-subsets-ii-view .bt-card {
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
    overflow: hidden;
  }
  #algo-subsets-ii-view .bt-card-title {
    padding: 10px 16px; border-bottom: 1px solid rgba(255, 255, 255, .06);
    display: flex; justify-content: space-between; align-items: center;
    color: #cbd5e1; font-weight: 700; font-size: 13px;
  }
  #algo-subsets-ii-view .bt-tag {
    font-size: 11px; color: #fde68a; background: rgba(251, 191, 36, .14);
    border: 1px solid rgba(251, 191, 36, .3); padding: 2px 8px; border-radius: 999px;
  }
  #algo-subsets-ii-view .bt-input-row {
    display: grid; grid-template-columns: 1fr auto;
    gap: 10px; align-items: center; padding: 14px 16px;
  }
  #algo-subsets-ii-view input {
    width: 100%; padding: 9px 12px; border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, .12);
    background: rgba(8, 8, 24, .6);
    color: #e2e8f0; font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 13px; outline: none; transition: all .2s;
  }
  #algo-subsets-ii-view input:focus { border-color: var(--accent-a); box-shadow: 0 0 0 3px rgba(251, 191, 36, .15); }
  #algo-subsets-ii-view button {
    padding: 8px 16px; border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 10px; background: rgba(255, 255, 255, .04);
    color: #e2e8f0; cursor: pointer; font-weight: 600; font-size: 13px;
    transition: all .25s cubic-bezier(.4, 0, .2, 1);
  }
  #algo-subsets-ii-view button:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    border-color: transparent; color: #06121f; transform: translateY(-1px);
    box-shadow: 0 6px 18px var(--accent-glow);
  }
  #algo-subsets-ii-view button:disabled { opacity: .4; cursor: not-allowed; }
  #algo-subsets-ii-view .bt-examples { padding: 0 16px 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  #algo-subsets-ii-view .bt-chip-btn {
    padding: 5px 12px; border-radius: 999px; font-size: 12px;
    background: rgba(251, 113, 133, .12); border: 1px solid rgba(251, 113, 133, .28);
    color: #fda4af; cursor: pointer; transition: all .2s;
  }
  #algo-subsets-ii-view .bt-chip-btn:hover {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; border-color: transparent; transform: translateY(-1px);
  }
  /* 统计 */
  #algo-subsets-ii-view .bt-stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }
  #algo-subsets-ii-view .bt-stat {
    position: relative; padding: 12px 14px 12px 18px;
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 14px; overflow: hidden;
  }
  #algo-subsets-ii-view .bt-stat::before {
    content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 4px; border-radius: 4px;
    background: linear-gradient(180deg, var(--accent-a), var(--accent-b));
  }
  #algo-subsets-ii-view .bt-stat-label { color: #94a3b8; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  #algo-subsets-ii-view .bt-stat-val {
    font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 22px; font-weight: 800; margin-top: 4px;
    color: #fde68a;
    font-variant-numeric: tabular-nums;
  }
  /* 决策树展示（SVG） */
  #algo-subsets-ii-view .bt-viz-card { flex: 1; min-height: 220px; display: flex; flex-direction: column; }
  #algo-subsets-ii-view #subsets-ii-tree-display {
    flex: 1; min-height: 180px; padding: 12px 8px;
    display: flex; align-items: center; justify-content: center;
    overflow: auto;
  }
  #algo-subsets-ii-view #subsets-ii-tree-display svg {
    max-width: 100%; max-height: 100%;
  }
  #algo-subsets-ii-view .bt-empty { color: #64748b; font-size: 13px; font-style: italic; }
  #algo-subsets-ii-view .bt-message {
    margin: 0 16px 16px; padding: 14px 18px; border-radius: 12px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: linear-gradient(135deg, rgba(251, 191, 36, .12), rgba(251, 113, 133, .06));
    border: 1px solid rgba(251, 191, 36, .28);
    line-height: 1.55; font-size: 14px; color: #fef3c7;
  }
  #algo-subsets-ii-view .bt-message .bt-emoji {
    width: 36px; height: 36px; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 20px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; box-shadow: 0 4px 14px var(--accent-glow);
    flex-shrink: 0;
  }
  #algo-subsets-ii-view .bt-message.done {
    background: linear-gradient(135deg, rgba(251, 113, 133, .18), rgba(251, 191, 36, .12));
    border-color: rgba(251, 113, 133, .4); color: #fce7f3;
  }
  #algo-subsets-ii-view .bt-log {
    min-height: 80px; max-height: 130px; padding: 10px 14px;
    overflow: auto; background: rgba(8, 8, 24, .55);
    font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px;
    line-height: 1.65; color: #94a3b8;
  }
  #algo-subsets-ii-view .bt-code {
    min-height: 0; display: flex;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; overflow: hidden;
  }
  #algo-subsets-ii-view .bt-code [data-code-panel] { flex: 1; min-width: 0; }
  #algo-subsets-ii-view .bt-controls {
    padding: 14px 18px;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border-top: 1px solid rgba(255, 255, 255, .06);
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  #algo-subsets-ii-view .bt-controls .bt-ctrl-btn { min-width: 64px; }
  #algo-subsets-ii-view .bt-controls .bt-ctrl-primary {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; border-color: transparent;
  }
  #algo-subsets-ii-view .bt-counter {
    color: #94a3b8; font-size: 13px; font-weight: 600;
    min-width: 110px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #algo-subsets-ii-view .bt-speed-wrap {
    display: flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 12px;
  }
  #algo-subsets-ii-view #step-speed { width: 130px; accent-color: var(--accent-a); }
  @media (max-width: 1100px) {
    #algo-subsets-ii-view .bt-main { grid-template-columns: 1fr; overflow: auto; }
    #algo-subsets-ii-view .bt-code { min-height: 360px; }
  }
</style>

<div class="bt-shell">
  <div class="bt-hero">
    <div class="bt-hero-left">
      <span class="bt-icon">🧩</span>
      <div>
        <h1>子集 II（回溯 + 去重）</h1>
        <div class="bt-sub">LeetCode 90 · 输入含重复元素，排序后同层去重生成不重复子集</div>
      </div>
    </div>
    <div class="bt-tip"><strong>核心动画：</strong>黄色<span style="color:#fbbf24">脉冲</span>为当前节点，紫色为已访问节点，绿色为已收集子集，红色虚线<span style="color:#f87171">X</span>为同层去重剪枝。</div>
  </div>
  <div class="bt-main">
    <div class="bt-left">
      <section class="bt-card">
        <div class="bt-card-title">输入 <span class="bt-tag">含重复元素数组</span></div>
        <div class="bt-input-row">
          <input id="bt-nums" value="1,2,2" placeholder="数字数组（可含重复）">
          <button id="bt-start">生成子集</button>
        </div>
        <div class="bt-examples">
          <button class="bt-chip-btn bt-example" data-nums="1,2,2">示例1</button>
          <button class="bt-chip-btn bt-example" data-nums="4,4,4,1,4">示例2</button>
          <button class="bt-chip-btn bt-example" data-nums="1,1,1">三重去重</button>
        </div>
      </section>

      <div class="bt-stats">
        <div class="bt-stat"><div class="bt-stat-label">递归深度</div><div class="bt-stat-val" id="sii-depth">0</div></div>
        <div class="bt-stat"><div class="bt-stat-label">已收集</div><div class="bt-stat-val" id="sii-count">0</div></div>
        <div class="bt-stat"><div class="bt-stat-label">路径长度</div><div class="bt-stat-val" id="sii-path-len">0</div></div>
        <div class="bt-stat"><div class="bt-stat-label">剪枝数</div><div class="bt-stat-val" id="sii-pruned">0</div></div>
      </div>

      <section class="bt-card bt-viz-card">
        <div class="bt-card-title">回溯决策树 <span class="bt-tag">SVG · 同层去重</span></div>
        <div id="subsets-ii-tree-display"></div>
        <div class="bt-message" id="step-message">
          <span class="bt-emoji">🧩</span>
          <div>点击「生成子集」观看回溯 + 去重决策树动画</div>
        </div>
      </section>

      <section class="bt-card">
        <div class="bt-card-title">执行日志 <button id="sii-log-clear" style="padding:4px 10px;font-size:11px;border-radius:999px;">清空</button></div>
        <div class="bt-log" id="sii-log"></div>
      </section>
    </div>
    <aside class="bt-code"><div data-code-panel></div></aside>
  </div>
  <div class="bt-controls">
    <button id="step-reset" class="bt-ctrl-btn">⏮ 重置</button>
    <button id="step-prev" class="bt-ctrl-btn">◀ 上一步</button>
    <button id="step-play" class="bt-ctrl-btn bt-ctrl-primary">▶ 播放</button>
    <button id="step-next" class="bt-ctrl-btn">下一步 ▶</button>
    <span id="step-counter" class="bt-counter">步骤: 0 / 0</span>
    <div class="bt-speed-wrap">
      <span>速度</span>
      <input id="step-speed" type="range" min="200" max="2500" step="100" value="900">
      <span id="step-speed-label" style="min-width:42px;">0.9s</span>
    </div>
  </div>
</div>
