<style>

      radial-gradient(ellipse at 90% 92%, rgba(192, 132, 252, 0.16), transparent 55%),

  #algo-combination-optimized-view .co-shell {

  #algo-combination-optimized-view .co-hero {

  #algo-combination-optimized-view .co-hero-left {
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;

    width: 36px; height: 36px; border-radius: 10px;

  #algo-combination-optimized-view .co-title-area h1 {

  #algo-combination-optimized-view .co-sub {
    color: #94a3b8; font-size: 11.5px; margin-top: 2px;

  }

  /* 阶段演化选项卡 */
  #algo-combination-optimized-view .co-stage-tabs {

  }

  #algo-combination-optimized-view .co-stage-tab {
    padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight: 600;

    white-space: nowrap;
  }

  #algo-combination-optimized-view .co-stage-tab:hover {
    color: #e2e8f0; background: rgba(255, 255, 255, 0.05);
  }

  #algo-combination-optimized-view .co-stage-tab.active {
    color: #ffffff;
    background: linear-gradient(135deg, #3b82f6, #6366f1);
    box-shadow: 0 2px 10px rgba(59, 130, 246, 0.4);
  }

  /* 参数配置栏 */
  #algo-combination-optimized-view .co-config-bar {
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  }

  #algo-combination-optimized-view .co-config-group {
    display: inline-flex; align-items: center; gap: 4px;
  }

  #algo-combination-optimized-view .co-config-label {
    font-size: 12px; color: #94a3b8; font-weight: 600;
  }

  #algo-combination-optimized-view input.co-input-num {
    width: 38px; padding: 3px 4px; border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(8, 8, 24, 0.6);
    color: #f8fafc; font-family: monospace; font-size: 12px;
    text-align: center; outline: none; transition: all 0.2s;
  }

  #algo-combination-optimized-view input.co-input-num:focus {
    border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
  }

  #algo-combination-optimized-view .co-btn-primary {
    padding: 4px 10px; border-radius: 6px; border: none;
    background: linear-gradient(135deg, #3b82f6, #6366f1);
    color: #ffffff; font-weight: 600; font-size: 11.5px; cursor: pointer;
    transition: all 0.2s; white-space: nowrap;
  }

  #algo-combination-optimized-view .co-btn-primary:hover {
    transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
  }

  #algo-combination-optimized-view .co-chips {
    display: inline-flex; gap: 4px; align-items: center;
  }

  #algo-combination-optimized-view .co-chip {
    padding: 2px 7px; border-radius: 999px; font-size: 10.5px;
    background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
    color: #cbd5e1; cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }

  #algo-combination-optimized-view .co-chip:hover {
    background: rgba(59, 130, 246, 0.2); border-color: #3b82f6; color: #93c5fd;
  }

  /* 主体双列网格 */
  #algo-combination-optimized-view .co-main {
    min-height: 0; display: grid;
    grid-template-columns: minmax(0, 1.2fr) minmax(380px, 0.8fr);
    gap: 14px; padding: 12px 18px; overflow: hidden; width: 100%; height: 100%;
  }

  #algo-combination-optimized-view .co-left {
    min-width: 0; min-height: 0; height: 100%;
    display: flex; flex-direction: column;
    gap: 12px; overflow: hidden;
  }

  #algo-combination-optimized-view .co-card {
    background: var(--card-bg);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    display: flex; flex-direction: column; overflow: hidden;
  }

  #algo-combination-optimized-view .co-tree-card {
    flex: 1; min-height: 240px; position: relative; overflow: hidden;
  }

  #algo-combination-optimized-view .co-card-header {
    padding: 8px 14px;
    border-bottom: 1px solid var(--border-color);
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(255, 255, 255, 0.02); flex-shrink: 0;
  }

  #algo-combination-optimized-view .co-card-title {
    color: #cbd5e1; font-weight: 700; font-size: 12.5px;
    display: flex; align-items: center; gap: 8px;
  }

  /* 决策树展示容器 */
  #algo-combination-optimized-view #combination-optimized-tree-display {
    flex: 1; width: 100%; height: 100%; min-height: 180px;
    position: relative; overflow: hidden;
    background: radial-gradient(circle at center, rgba(30, 41, 59, 0.2), transparent 70%);
  }

  /* 图例栏 */
  #algo-combination-optimized-view .co-legend-bar {
    display: flex; align-items: center; gap: 12px; padding: 6px 14px;
    background: rgba(0, 0, 0, 0.25); border-top: 1px solid var(--border-color);
    font-size: 11px; color: #94a3b8; flex-wrap: wrap; flex-shrink: 0;
  }

  #algo-combination-optimized-view .co-legend-item {
    display: inline-flex; align-items: center; gap: 4px;
  }

  /* 回溯状态监视器 (Card 2) */
  #algo-combination-optimized-view .co-monitor-card {
    padding: 10px 14px; display: flex; flex-direction: column; gap: 8px;
    flex-shrink: 0; max-height: 210px; overflow-y: auto;
  }

  #algo-combination-optimized-view .co-monitor-section-title {
    font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase;
    letter-spacing: 0.04em; margin-bottom: 2px;
  }

  /* 右侧面板 (CodePanel 承载卡片) */
  #algo-combination-optimized-view .co-right {
    min-width: 0; min-height: 0; height: 100%;
    display: flex; flex-direction: column; overflow: hidden;
    border-radius: 14px; border: 1px solid var(--border-color);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
  }

  /* 时间轴播放控制器 */
  #algo-combination-optimized-view .co-controls {
    padding: 10px 18px;
    background: rgba(11, 17, 32, 0.85);
    backdrop-filter: blur(16px) saturate(180%);
    border-top: 1px solid var(--border-color);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-shrink: 0;
  }

  #algo-combination-optimized-view .co-ctrl-btn {
    padding: 6px 14px; border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.05);
    color: #e2e8f0; cursor: pointer; font-weight: 600; font-size: 12.5px;
    transition: all 0.2s;
  }

  #algo-combination-optimized-view .co-ctrl-btn:hover:not(:disabled) {
    background: rgba(59, 130, 246, 0.25); border-color: #3b82f6; color: #ffffff;
    transform: translateY(-1px);
  }

  #algo-combination-optimized-view .co-ctrl-play {
    background: linear-gradient(135deg, #3b82f6, #6366f1);
    color: #ffffff; border-color: transparent;
    padding: 6px 18px;
  }

  #algo-combination-optimized-view .co-ctrl-play:hover {
    box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
  }

  #algo-combination-optimized-view .co-counter {
    color: #94a3b8; font-size: 12.5px; font-weight: 600;
    min-width: 90px; text-align: center; font-family: monospace;
  }
</style>

<div class="co-shell">
  <!-- 顶部导航 & 阶段演化选项卡 & 参数控制 -->
  <header class="co-hero">
    <div class="co-hero-left">
      <span class="co-icon">✂️</span>
      <div class="co-title-area">
        <h1>组合问题 (剪枝演化) <span class="co-tag">LeetCode 77</span></h1>
        <div class="co-sub">从 1..n 中选 k 个数的所有组合 · 回溯专属双卡片沙盘</div>
      </div>
    </div>

    <!-- 演化选项卡 -->
    <div class="co-stage-tabs">
      <button class="co-stage-tab" id="co-tab-stage1" data-stage="naive">
        <span>🌱 阶段 1：完整回溯决策树</span>
      </button>
      <button class="co-stage-tab active" id="co-tab-stage2" data-stage="pruned">
        <span>✂️ 阶段 2：剪枝优化决策树</span>
      </button>
    </div>

    <!-- 参数控制 -->
    <div class="co-config-bar">
      <div class="co-config-group">
        <span class="co-config-label">n:</span>
        <input id="co-n" class="co-input-num" value="4">
      </div>
      <div class="co-config-group">
        <span class="co-config-label">k:</span>
        <input id="co-k" class="co-input-num" value="2">
      </div>
      <button id="co-start" class="co-btn-primary">生成决策树</button>

      <div class="co-chips">
        <button class="co-chip" data-n="4" data-k="2">4,2</button>
        <button class="co-chip" data-n="5" data-k="3">5,3</button>
        <button class="co-chip" data-n="6" data-k="2">6,2</button>
      </div>
    </div>
  </header>

  <!-- 主体工作区 (左沙盘 + 右代码) -->
  <main class="co-main">
    <!-- 左侧双卡片联动沙盘 -->
    <div class="co-left">
      <!-- Card 1: 决策树沙盘 -->
      <section class="co-card co-tree-card">
        <div class="co-card-header">
          <span class="co-card-title">🌲 决策树沙盘 (N-ary Decision Tree)</span>
          <span class="co-tag" id="co-current-mode-tag">剪枝优化模式</span>
        </div>

        <!-- SVG 树显示区域 -->
        <div id="combination-optimized-tree-display"></div>

        <!-- 图例栏 -->
        <div class="co-legend-bar">
          <div class="co-legend-item"><span style="color:#fb923c;">●</span> 📍当前探索</div>
          <div class="co-legend-item"><span style="color:#10b981;">●</span> ✅解集命中</div>
          <div class="co-legend-item"><span style="color:#f87171;">✁</span> ✂️剪枝截断</div>
          <div class="co-legend-item"><span style="color:#c084fc;">●</span> 🔙已回溯</div>
        </div>
      </section>

      <!-- Card 2: 回溯核心状态追踪器 -->
      <section class="co-card co-monitor-card">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <!-- 路径栈 -->
          <div>
            <div class="co-monitor-section-title">📦 当前路径栈 (Path Stack)</div>
            <div id="co-path-stack-container"></div>
          </div>
          <!-- 剪枝监视器 -->
          <div>
            <div class="co-monitor-section-title">✂️ 剪枝监视器 (Pruning Monitor)</div>
            <div id="co-pruning-monitor-container"></div>
          </div>
        </div>

        <!-- 实时解集箱 -->
        <div style="margin-top: 4px;">
          <div class="co-monitor-section-title">🏆 解集收集箱 (Result Collection)</div>
          <div id="co-result-collection-container"></div>
        </div>
      </section>
    </div>

    <!-- 右侧面板 (由 CodePanel 原生渲染 Tabs、多语言、逐行精讲与题目描述) -->
    <aside class="co-right">
      <div data-code-panel style="flex: 1; min-height: 0; width: 100%; height: 100%;"></div>
    </aside>
  </main>

  <!-- 底部时间轴控制器 -->
  <footer class="co-controls">
    <div style="display: flex; align-items: center; gap: 8px;">
      <button id="step-reset" class="co-ctrl-btn">⏮ 重置</button>
      <button id="step-prev" class="co-ctrl-btn">◀ 上一步</button>
      <button id="step-play" class="co-ctrl-btn co-ctrl-play">▶ 播放</button>
      <button id="step-next" class="co-ctrl-btn">下一步 ▶</button>
    </div>

    <span id="step-counter" class="co-counter">步骤: 0 / 0</span>

    <div style="display: flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 12px;">
      <span>速度</span>
      <input id="step-speed" type="range" min="200" max="2000" step="100" value="600" style="width: 110px; accent-color: #3b82f6;">
      <span id="step-speed-label" style="font-family: monospace;">0.6s</span>
    </div>
  </footer>
</div>
