    <span class="co-badge-complexity">O(C(n,k)) · O(k)</span>
  </div>

  <!-- 阶段演化选择器 -->
  <div class="co-stage-switcher" id="stage-tabs-container">
    <button class="co-stage-tab" id="co-tab-stage1" data-stage="naive">1 完整决策树</button>
    <button class="co-stage-tab active" id="co-tab-stage2" data-stage="pruned">2 剪枝优化 ⭐</button>
  </div>

  <!-- 参数与操作工具组 -->
  <div class="co-header-right">
    <div style="display: flex; align-items: center; gap: 4px;">
      <button class="co-chip" data-n="4" data-k="2">4,2</button>
      <button class="co-chip" data-n="5" data-k="3">5,3</button>
      <button class="co-chip" data-n="6" data-k="2">6,2</button>
    </div>

    <div class="co-input-group">
      <span>n:</span>
      <input type="number" id="input-n" min="1" max="8" value="4" class="co-input-num" />
      <span>×</span>
      <span>k:</span>
      <input type="number" id="input-k" min="1" max="8" value="2" class="co-input-num" />
    </div>

    <button id="btn-generate" class="co-btn-generate">
      <span>▶ 生成</span>
    </button>

    <button id="btn-reset" class="co-btn-reset">
      重置
    </button>
  </div>
</header>

<!-- 2. 主演示区：左侧可视化画布 + 右侧代码与日志 -->
<main class="co-main-layout">

  <!-- ================= 左侧：双看板 + 底部进度条 ================= -->
  <section class="co-left-section">

    <!-- 卡片 1: 决策树沙盘 (N-ary Decision Tree) -->
    <div class="co-card">
      <div class="co-card-header">
        <div class="co-card-title">
          <span>🌲 N 叉决策树沙盘 (N-ary Decision Tree)</span>
        </div>
        <div class="co-legend-bar">
          <div><span class="co-legend-dot" style="background:#3b82f6;"></span> 📍当前探索</div>
          <div><span class="co-legend-dot" style="background:#10b981;"></span> ✅解集命中</div>
          <div><span class="co-legend-dot" style="background:#ef4444; border: 1px dashed #b91c1c;"></span> ✂️剪枝截断</div>
          <div><span class="co-legend-dot" style="background:#94a3b8;"></span> 🔙已回溯</div>
        </div>
      </div>

      <!-- 决策树居中展示盒 -->
      <div id="combination-optimized-tree-display"></div>
    </div>

    <!-- 贯穿式 Scrubber 步数进度条与播放控制器 (100% 对齐 DP 标准条) -->
    <div class="co-playback-bar">
      <input type="range" id="slider-progress" min="0" max="0" value="0" class="co-slider" />
      <div class="co-counter-badge">
        <span id="step-cur" style="color: #2563eb;">0</span> / <span id="step-total">0</span>
      </div>
      <div style="display: flex; align-items: center; gap: 4px; flex-shrink: 0;">
        <button id="btn-step-prev" title="上一步" class="co-ctrl-btn">◀</button>
        <button id="btn-play-pause" title="自动播放/暂停" class="co-play-circle-btn">
          <span id="play-icon">▶</span>
        </button>
        <button id="btn-step-next" title="下一步" class="co-ctrl-btn">▶</button>
      </div>
    </div>

    <!-- 卡片 2: 回溯状态空间与解集追踪 (与 Card 1 对等平分高度) -->
    <div class="co-card">
      <div class="co-card-header">
        <div>
          <div class="co-card-title">📦 回溯状态空间与解集追踪</div>
          <div class="co-card-desc">实时路径栈推进、剪枝不等式判定与全局解集收集</div>
        </div>
        <span id="badge-result-count" class="co-counter-badge" style="color:#059669; background:#ecfdf5; border-color:#a7f3d0;">解集: 0</span>
      </div>

      <!-- 状态空间居中展示盒 -->
      <div class="co-state-space-box">
        <div class="co-state-columns">
          <!-- 路径栈 -->
          <div class="co-subcard">
            <div class="co-subcard-title">📦 当前路径栈 (Path Stack)</div>
            <div id="co-path-stack-container" style="flex: 1; min-height: 0; overflow-y: auto;"></div>
          </div>
          <!-- 剪枝监视器 -->
          <div class="co-subcard">
            <div class="co-subcard-title">✂️ 剪枝监视器 (Pruning Monitor)</div>
            <div id="co-pruning-monitor-container" style="flex: 1; min-height: 0; overflow-y: auto;"></div>
          </div>
        </div>
        <!-- 解集箱 -->
        <div class="co-subcard" style="flex-shrink: 0;">
          <div class="co-subcard-title">🏆 实时解集收集箱 (Result Collection)</div>
          <div id="co-result-collection-container"></div>
        </div>
      </div>
    </div>

  </section>

  <!-- ================= 右侧：代码终端 + 执行日志 (100% 对齐 DP 标准双卡片) ================= -->
  <section class="co-right-section">

    <!-- 卡片 3: 暗色代码终端面板 (flex: 1.25) -->
    <div class="co-dark-terminal">
      <div class="co-terminal-header">
        <!-- 1. 主 Tab 切换器 (源码 / 题目 / 精讲) -->
        <div class="co-tab-group">
          <button id="btn-tab-code" class="co-tab-item active">💻 代码调试</button>
          <button id="btn-tab-problem" class="co-tab-item">📋 题目描述</button>
          <button id="btn-tab-analysis" class="co-tab-item">💡 回溯精讲</button>
        </div>

        <!-- 2. 多语言切换器 -->
        <div class="co-lang-group" id="code-lang-tabs">
          <button class="co-lang-btn active" data-lang="java">Java</button>
          <button class="co-lang-btn" data-lang="cpp">C++</button>
          <button class="co-lang-btn" data-lang="python">Python</button>
          <button class="co-lang-btn" data-lang="javascript">JS</button>

        <!-- 3. 字号缩放器与 macOS 窗口微控制 -->
        <div class="co-font-tools">

            <span id="code-font-indicator" class="co-font-indicator">12</span>
            <button id="btn-code-font-inc" title="放大代码字号">A+</button>
          </div>

          <div class="co-window-dots">
            <span class="co-dot" style="background:#ef4444;"></span>
            <span class="co-dot" style="background:#eab308;"></span>
            <span class="co-dot" style="background:#22c55e;"></span>
          </div>
        </div>
      </div>

      <!-- 容器 1: 源码高亮与单步追踪视图 -->
      <div id="code-view-container" style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;">
        <div class="co-terminal-body">
          <div id="code-lines-wrapper">
            <!-- 动态装载代码行 -->
          </div>
        </div>
      </div>

      <!-- 容器 2: 题目完整描述视图 -->
      <div id="problem-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
        <!-- 动态装载题目内容 -->
      </div>

      <!-- 容器 3: 回溯精讲视图 -->
      <div id="analysis-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
        <!-- 动态装载回溯精讲内容 -->
      </div>
    </div>

    <!-- 卡片 4: 独立执行日志卡片 (Execution Log, 100% 对齐 DP 模板) -->
    <div class="co-log-card">
      <div class="co-log-header">
        <div class="co-log-header-title">
          <span>📜 执行日志</span>
        </div>
        <span id="log-count" class="co-log-count">0 条记录</span>
      </div>

      <div id="log-container" class="co-log-body">
        <!-- 动态填充日志条目 -->
      </div>
    </div>

  </section>

</main>
