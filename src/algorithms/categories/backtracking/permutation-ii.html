<style>
  /* === 全排列 II · 玻璃感 + chip 脉冲 + 去重 shake + 收集 burst === */
  #algo-permutation-ii-view {
    --accent-a: #2dd4bf;
    --accent-b: #f472b6;
    --accent-glow: rgba(45, 212, 191, .4);

      radial-gradient(ellipse at 92% 94%, rgba(244, 114, 182, .22), transparent 55%),

  #algo-permutation-ii-view h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: #f1f5f9; }

  #algo-permutation-ii-view .bt-left { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }

  }
  #algo-permutation-ii-view input {
    width: 100%; padding: 9px 12px; border-radius: 10px;

    background: rgba(8, 8, 24, .6);

    font-size: 13px; outline: none; transition: all .2s;
  }

  #algo-permutation-ii-view .bt-chip-btn:hover {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; border-color: transparent; transform: translateY(-1px);
  }
  /* 统计 */
  #algo-permutation-ii-view .bt-stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }
  #algo-permutation-ii-view .bt-stat {
    position: relative; padding: 12px 14px 12px 18px;
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 14px; overflow: hidden;
  }
  #algo-permutation-ii-view .bt-stat::before {
    content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 4px; border-radius: 4px;
    background: linear-gradient(180deg, var(--accent-a), var(--accent-b));
  }
  #algo-permutation-ii-view .bt-stat-label { color: #94a3b8; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  #algo-permutation-ii-view .bt-stat-val {
    font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 22px; font-weight: 800; margin-top: 4px;
    color: #5eead4;
    font-variant-numeric: tabular-nums;
  }
  /* 可视化主体 - SVG 决策树 */
  #algo-permutation-ii-view .bt-viz-card { flex: 1; min-height: 220px; display: flex; flex-direction: column; }
  #algo-permutation-ii-view #permutation-ii-tree-display {
    flex: 1; min-height: 200px; padding: 12px 8px;
    display: flex; align-items: center; justify-content: center;
    overflow: auto;
  }
  #algo-permutation-ii-view #permutation-ii-tree-display svg {
    max-width: 100%; max-height: 100%;
  }
  #algo-permutation-ii-view .bt-result-banner {
    margin: 0 16px 16px; padding: 14px 18px; border-radius: 12px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: linear-gradient(135deg, rgba(45, 212, 191, .12), rgba(244, 114, 182, .06));
    border: 1px solid rgba(45, 212, 191, .28);
    line-height: 1.55; font-size: 14px; color: #ccfbf1;
  }
  #algo-permutation-ii-view .bt-result-banner .bt-emoji {
    width: 36px; height: 36px; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 20px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; box-shadow: 0 4px 14px var(--accent-glow);
    flex-shrink: 0;
  }
  #algo-permutation-ii-view .bt-message {
    margin: 0 16px 16px; padding: 14px 18px; border-radius: 12px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: linear-gradient(135deg, rgba(45, 212, 191, .12), rgba(244, 114, 182, .06));
    border: 1px solid rgba(45, 212, 191, .28);
    line-height: 1.55; font-size: 14px; color: #ccfbf1;
  }
  #algo-permutation-ii-view .bt-message .bt-emoji {
    width: 36px; height: 36px; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 20px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; box-shadow: 0 4px 14px var(--accent-glow);
    flex-shrink: 0;
  }
  #algo-permutation-ii-view .bt-message.done {
    background: linear-gradient(135deg, rgba(45, 212, 191, .18), rgba(244, 114, 182, .12));
    border-color: rgba(244, 114, 182, .4); color: #fce7f3;
  }
  #algo-permutation-ii-view .bt-log {
    min-height: 80px; max-height: 130px; padding: 10px 14px;
    overflow: auto; background: rgba(8, 8, 24, .55);
    font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px;
    line-height: 1.65; color: #94a3b8;
  }
  /* SVG tree styles (auto-injected by shared module; mirrored here as fallback) */
  #algo-permutation-ii-view .pii-edge { stroke: rgba(255,255,255,0.1); stroke-width: 1.5; transition: all .3s; }
  #algo-permutation-ii-view .pii-edge-active { stroke: #2dd4bf; stroke-width: 2.5; filter: drop-shadow(0 0 4px rgba(45,212,191,.5)); }
  #algo-permutation-ii-view .pii-edge-found { stroke: #34d399; stroke-width: 2; }
  #algo-permutation-ii-view .pii-edge-pruned { stroke: rgba(255,255,255,0.06); stroke-dasharray: 4 3; }
  #algo-permutation-ii-view .pii-edge-dim { stroke: rgba(255,255,255,0.05); }
  #algo-permutation-ii-view .pii-edge-label { fill: #94a3b8; font-family: 'JetBrains Mono', monospace; }
  #algo-permutation-ii-view .pii-node-circle { fill: #1e1e2e; stroke: #45475a; stroke-width: 2; transition: all .3s; }
  #algo-permutation-ii-view .pii-node-current { fill: rgba(45,212,191,0.3); stroke: #2dd4bf; stroke-width: 3; animation: pii-tree-pulse 1.2s infinite; }
  #algo-permutation-ii-view .pii-node-found { fill: rgba(52,211,153,0.3); stroke: #34d399; stroke-width: 2.5; animation: pii-tree-found .5s cubic-bezier(.34,1.56,.64,1); }
  #algo-permutation-ii-view .pii-node-visited { fill: rgba(244,114,182,0.2); stroke: rgba(244,114,182,0.5); stroke-width: 2; }
  #algo-permutation-ii-view .pii-node-pruned { fill: rgba(100,100,120,0.15); stroke: rgba(100,100,120,0.3); stroke-width: 1.5; stroke-dasharray: 4 3; }
  #algo-permutation-ii-view .pii-node-label { fill: #cdd6f4; font-family: 'JetBrains Mono', monospace; font-weight: 700; }
  #algo-permutation-ii-view .pii-node-check { fill: #34d399; font-size: 14px; font-weight: 900; animation: pii-tree-check .4s cubic-bezier(.34,1.56,.64,1); }
  #algo-permutation-ii-view .pii-node-pruned-mark { fill: #f87171; font-size: 12px; font-weight: 900; }
  #algo-permutation-ii-view .pii-log-line { display: flex; gap: 8px; padding: 1px 0; color: #94a3b8; font-size: 12px; line-height: 1.65; }
  #algo-permutation-ii-view .pii-log-line .pii-log-num { color: #64748b; flex-shrink: 0; }
  #algo-permutation-ii-view .pii-log-line.pii-log-active { color: #5eead4; font-weight: 600; }
  #algo-permutation-ii-view .pii-log-line.pii-log-active .pii-log-num { color: #2dd4bf; }
  @keyframes pii-tree-pulse {
    0%, 100% { filter: drop-shadow(0 0 0 rgba(45,212,191,.6)); }
    50% { filter: drop-shadow(0 0 8px rgba(45,212,191,.8)); }
  }
  @keyframes pii-tree-found {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.2); }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes pii-tree-check {
    0% { transform: scale(0); }
    60% { transform: scale(1.4); }
    100% { transform: scale(1); }
  }
  #algo-permutation-ii-view .bt-code {
    min-height: 0; display: flex;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; overflow: hidden;
  }
  #algo-permutation-ii-view .bt-code [data-code-panel] { flex: 1; min-width: 0; }
  #algo-permutation-ii-view .bt-controls {
    padding: 14px 18px;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border-top: 1px solid rgba(255, 255, 255, .06);
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  #algo-permutation-ii-view .bt-controls .bt-ctrl-btn { min-width: 64px; }
  #algo-permutation-ii-view .bt-controls .bt-ctrl-primary {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; border-color: transparent;
  }
  #algo-permutation-ii-view .bt-counter {
    color: #94a3b8; font-size: 13px; font-weight: 600;
    min-width: 110px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #algo-permutation-ii-view .bt-speed-wrap {
    display: flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 12px;
  }
  #algo-permutation-ii-view #step-speed { width: 130px; accent-color: var(--accent-a); }
  @media (max-width: 1100px) {
    #algo-permutation-ii-view .bt-main { grid-template-columns: 1fr; overflow: auto; }
    #algo-permutation-ii-view .bt-code { min-height: 360px; }
  }
</style>

<div class="bt-shell">
  <div class="bt-hero">
    <div class="bt-hero-left">
      <span class="bt-icon">🔀</span>
      <div>
        <h1>全排列 II（回溯 + 去重）</h1>
        <div class="bt-sub">LeetCode 47 · 输入含重复数字，排序 + used 数组 + 同层去重，生成不重复排列</div>
      </div>
    </div>
    <div class="bt-tip"><strong>核心动画：</strong>青色<span style="color:#5eead4">脉冲</span>为当前节点，粉紫色为已访问节点，绿色为找到的排列，灰色虚线为剪枝分支（used 重复或同层去重）。观察决策树的完整搜索过程。</div>
  </div>
  <div class="bt-main">
    <div class="bt-left">
      <section class="bt-card">
        <div class="bt-card-title">输入 <span class="bt-tag">含重复数字数组</span></div>
        <div class="bt-input-row">
          <input id="bt-nums" value="1,1,2" placeholder="数字数组（可含重复）">
          <button id="bt-start">生成排列</button>
        </div>
        <div class="bt-examples">
          <button class="bt-chip-btn bt-example" data-nums="1,1,2">示例1</button>
          <button class="bt-chip-btn bt-example" data-nums="1,2,2">示例2</button>
          <button class="bt-chip-btn bt-example" data-nums="1,1,1">三重去重</button>
        </div>
      </section>

      <div class="bt-stats">
        <div class="bt-stat"><div class="bt-stat-label">深度</div><div class="bt-stat-val" data-metric="depth">0</div></div>
        <div class="bt-stat"><div class="bt-stat-label">已用</div><div class="bt-stat-val" data-metric="used">0</div></div>
        <div class="bt-stat"><div class="bt-stat-label">答案数</div><div class="bt-stat-val" data-metric="count">0</div></div>
        <div class="bt-stat"><div class="bt-stat-label">可选</div><div class="bt-stat-val" data-metric="remain">0</div></div>
      </div>

      <section class="bt-card bt-viz-card">
        <div class="bt-card-title">回溯决策树 <span class="bt-tag">SVG · used + 去重</span></div>
        <div id="permutation-ii-tree-display"></div>
        <div class="bt-message" id="step-message">
          <span class="bt-emoji">🔀</span>
          <div>点击「生成排列」观看回溯 + 去重决策树动画</div>
        </div>
      </section>

      <section class="bt-card">
        <div class="bt-card-title">执行日志 <button id="pii-log-clear" style="padding:4px 10px;font-size:11px;border-radius:999px;">清空</button></div>
        <div class="bt-log" id="pii-log"></div>
      </section>
    </div>
    <aside class="bt-code"><div data-code-panel></div></aside>
  </div>
  <div class="bt-controls">
    <button id="step-reset" class="bt-ctrl-btn">⏮ 重置</button>
    <button id="step-prev" class="bt-ctrl-btn">◀ 上一步</button>
    <button id="step-play" class="bt-ctrl-btn bt-ctrl-primary">▶ 播放</button>
    <button id="step-next" class="bt-ctrl-btn">下一步 ▶</button>
    <span id="step-counter" class="bt-counter">步骤: 0 / 0</span>
    <div class="bt-speed-wrap">
      <span>速度</span>
      <input id="step-speed" type="range" min="200" max="2500" step="100" value="900">
      <span id="step-speed-label" style="min-width:42px;">0.9s</span>
    </div>
  </div>
</div>
