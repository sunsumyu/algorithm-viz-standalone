<style>
  /* === 解数独 · 玻璃感 + 单元格脉冲 + 冲突高亮 === */
  #algo-sudoku-view {
    --accent-a: #60a5fa;
    --accent-b: #34d399;
    --accent-glow: rgba(96, 165, 250, .4);
    --fixed-color: #e2e8f0;
    --filled-color: #6ee7b7;
    --conflict-color: #f87171;
    --current-color: #fbbf24;
    width: 100%; height: 100%;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background:
      radial-gradient(ellipse at 8% 6%, rgba(96, 165, 250, .22), transparent 55%),
      radial-gradient(ellipse at 92% 94%, rgba(52, 211, 153, .22), transparent 55%),
      linear-gradient(135deg, #0a0e1d 0%, #1a1a30 50%, #0e2a20 100%);
    overflow: hidden;
  }
  #algo-sudoku-view .sd-shell { width: 100%; height: 100%; display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
  #algo-sudoku-view .sd-hero {
    padding: 18px 24px 12px;
    display: flex; gap: 18px; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, .06);
    background: rgba(8, 8, 24, .35);
    backdrop-filter: blur(14px) saturate(150%);
  }
  #algo-sudoku-view .sd-hero-left { display: flex; align-items: center; gap: 14px; }
  #algo-sudoku-view .sd-icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: inline-flex; align-items: center; justify-content: center; font-size: 24px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; box-shadow: 0 6px 20px var(--accent-glow);
  }
  #algo-sudoku-view h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: #f1f5f9; }
  #algo-sudoku-view .sd-sub { color: #94a3b8; font-size: 12.5px; margin-top: 4px; }
  #algo-sudoku-view .sd-tip {
    max-width: 540px; padding: 10px 14px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(96, 165, 250, .12), rgba(52, 211, 153, .08));
    border: 1px solid rgba(96, 165, 250, .3);
    color: #cbd5e1; font-size: 12.5px; line-height: 1.65;
  }
  #algo-sudoku-view .sd-tip strong { color: #bfdbfe; }
  #algo-sudoku-view .sd-main {
    min-height: 0; display: grid;
    grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; padding: 16px; overflow: hidden;
  }
  #algo-sudoku-view .sd-left { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
  #algo-sudoku-view .sd-card {
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
    overflow: hidden;
  }
  #algo-sudoku-view .sd-card-title {
    padding: 10px 16px; border-bottom: 1px solid rgba(255, 255, 255, .06);
    display: flex; justify-content: space-between; align-items: center;
    color: #cbd5e1; font-weight: 700; font-size: 13px;
  }
  #algo-sudoku-view .sd-tag {
    font-size: 11px; color: #bfdbfe; background: rgba(96, 165, 250, .14);
    border: 1px solid rgba(96, 165, 250, .3); padding: 2px 8px; border-radius: 999px;
  }
  #algo-sudoku-view .sd-input-row {
    display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: stretch; padding: 14px 16px;
  }
  #algo-sudoku-view textarea {
    width: 100%; height: 78px; padding: 9px 12px; border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, .12);
    background: rgba(8, 8, 24, .6);
    color: #e2e8f0; font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 12px; outline: none; transition: all .2s; resize: vertical;
  }
  #algo-sudoku-view textarea:focus { border-color: var(--accent-a); box-shadow: 0 0 0 3px rgba(96, 165, 250, .15); }
  #algo-sudoku-view button {
    padding: 8px 16px; border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 10px; background: rgba(255, 255, 255, .04);
    color: #e2e8f0; cursor: pointer; font-weight: 600; font-size: 13px;
    transition: all .25s cubic-bezier(.4, 0, .2, 1);
  }
  #algo-sudoku-view button:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    border-color: transparent; color: #06121f; transform: translateY(-1px);
    box-shadow: 0 6px 18px var(--accent-glow);
  }
  #algo-sudoku-view button:disabled { opacity: .4; cursor: not-allowed; }
  #algo-sudoku-view .sd-examples { padding: 0 16px 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  #algo-sudoku-view .sd-chip-btn {
    padding: 5px 12px; border-radius: 999px; font-size: 12px;
    background: rgba(52, 211, 153, .12); border: 1px solid rgba(52, 211, 153, .28);
    color: #6ee7b7; cursor: pointer; transition: all .2s;
  }
  #algo-sudoku-view .sd-chip-btn:hover {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; border-color: transparent; transform: translateY(-1px);
  }
  /* 统计 */
  #algo-sudoku-view .sd-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  #algo-sudoku-view .sd-stat {
    position: relative; padding: 12px 14px 12px 18px;
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 14px; overflow: hidden;
  }
  #algo-sudoku-view .sd-stat::before {
    content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 4px; border-radius: 4px;
  }
  #algo-sudoku-view .sd-stat--att::before { background: linear-gradient(180deg, #60a5fa, #3b82f6); }
  #algo-sudoku-view .sd-stat--att .sd-stat-val { color: #bfdbfe; }
  #algo-sudoku-view .sd-stat--fill::before { background: linear-gradient(180deg, #34d399, #10b981); }
  #algo-sudoku-view .sd-stat--fill .sd-stat-val { color: #6ee7b7; }
  #algo-sudoku-view .sd-stat--cur::before { background: linear-gradient(180deg, #fbbf24, #f59e0b); }
  #algo-sudoku-view .sd-stat--cur .sd-stat-val { color: #fde68a; }
  #algo-sudoku-view .sd-stat--cand::before { background: linear-gradient(180deg, #c084fc, #a855f7); }
  #algo-sudoku-view .sd-stat--cand .sd-stat-val { color: #e9d5ff; }
  #algo-sudoku-view .sd-stat-label { color: #94a3b8; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  #algo-sudoku-view .sd-stat-val {
    font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 22px; font-weight: 800; margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  /* 棋盘 */
  #algo-sudoku-view .sd-board-card { flex: 1; min-height: 360px; display: flex; flex-direction: column; }
  #algo-sudoku-view .sd-board-wrap {
    flex: 1; padding: 24px; display: flex; align-items: center; justify-content: center; overflow: auto;
  }
  #algo-sudoku-view #sudoku-board {
    display: grid; grid-template-columns: repeat(9, 42px);
    gap: 0; padding: 4px;
    background: rgba(8, 8, 24, .55);
    border: 3px solid rgba(96, 165, 250, .4);
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
  }
  #algo-sudoku-view .sd-cell {
    width: 42px; height: 42px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255, 255, 255, .03);
    border-right: 1px solid rgba(255, 255, 255, .06);
    border-bottom: 1px solid rgba(255, 255, 255, .06);
    font-size: 18px; font-weight: 800;
    font-family: 'JetBrains Mono', Consolas, monospace;
    color: var(--filled-color);
    transition: all .25s cubic-bezier(.4, 0, .2, 1);
  }
  #algo-sudoku-view .sd-cell.fixed {
    color: var(--fixed-color);
    background: rgba(255, 255, 255, .06);
  }
  #algo-sudoku-view .sd-cell.current {
    outline: 3px solid var(--current-color);
    outline-offset: -3px;
    z-index: 1;
    background: linear-gradient(135deg, rgba(251, 191, 36, .35), rgba(245, 158, 11, .12));
    color: #fef3c7;
    animation: sd-cell-pulse 1.2s ease-in-out infinite;
  }
  @keyframes sd-cell-pulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(251, 191, 36, .25); }
    50% { box-shadow: 0 0 0 5px rgba(251, 191, 36, .15), 0 0 16px rgba(251, 191, 36, .4); }
  }
  #algo-sudoku-view .sd-cell.conflict {
    background: linear-gradient(135deg, rgba(248, 113, 113, .4), rgba(239, 68, 68, .12));
    color: var(--conflict-color);
    animation: sd-conflict-shake .4s;
  }
  @keyframes sd-conflict-shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-2px); }
    75% { transform: translateX(2px); }
  }
  #algo-sudoku-view .sd-cell.placed {
    animation: sd-place-pop .4s cubic-bezier(.34, 1.56, .64, 1);
  }
  @keyframes sd-place-pop {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  #algo-sudoku-view .sd-cell.leaving {
    animation: sd-fade-out .25s ease-in forwards;
  }
  @keyframes sd-fade-out {
    0% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(.5); }
  }
  #algo-sudoku-view .sd-cell.box-right { border-right: 2px solid rgba(96, 165, 250, .35); }
  #algo-sudoku-view .sd-cell.box-bottom { border-bottom: 2px solid rgba(96, 165, 250, .35); }
  /* 结果 */
  #algo-sudoku-view .sd-result {
    margin: 0 16px 16px; padding: 14px 18px; border-radius: 12px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: linear-gradient(135deg, rgba(96, 165, 250, .12), rgba(52, 211, 153, .06));
    border: 1px solid rgba(96, 165, 250, .28);
    line-height: 1.55; font-size: 14px; color: #bfdbfe;
  }
  #algo-sudoku-view .sd-result .sd-emoji {
    width: 36px; height: 36px; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center; font-size: 20px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; box-shadow: 0 4px 14px var(--accent-glow); flex-shrink: 0;
  }
  #algo-sudoku-view .sd-result.sd-result--done {
    background: linear-gradient(135deg, rgba(52, 211, 153, .18), rgba(16, 185, 129, .08));
    border-color: rgba(52, 211, 153, .4); color: #d1fae5;
  }
  #algo-sudoku-view .sd-result.sd-result--done .sd-emoji {
    background: linear-gradient(135deg, #34d399, #10b981);
    box-shadow: 0 4px 14px rgba(52, 211, 153, .55);
  }
  #algo-sudoku-view .sd-result.sd-result--conflict {
    background: linear-gradient(135deg, rgba(248, 113, 113, .14), rgba(239, 68, 68, .06));
    border-color: rgba(248, 113, 113, .35); color: #fecaca;
  }
  #algo-sudoku-view .sd-log {
    min-height: 80px; max-height: 130px; padding: 10px 14px;
    overflow: auto; background: rgba(8, 8, 24, .55);
    font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px;
    line-height: 1.65; color: #94a3b8;
  }
  #algo-sudoku-view .sd-log div { padding: 1px 0; color: #94a3b8; }
  #algo-sudoku-view .sd-log div.active { color: #bfdbfe; font-weight: 600; }
  #algo-sudoku-view .sd-log .solved, #algo-sudoku-view .sd-log .place { color: #6ee7b7; }
  #algo-sudoku-view .sd-log .reject { color: #fca5a5; }
  #algo-sudoku-view .sd-code {
    min-height: 0; display: flex;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; overflow: hidden;
  }
  #algo-sudoku-view .sd-code [data-code-panel] { flex: 1; min-width: 0; }
  #algo-sudoku-view .sd-controls-bar {
    padding: 14px 18px;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border-top: 1px solid rgba(255, 255, 255, .06);
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  #algo-sudoku-view .sd-controls-bar .sd-ctrl-btn { min-width: 64px; }
  #algo-sudoku-view .sd-controls-bar .sd-ctrl-primary {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; border-color: transparent;
  }
  #algo-sudoku-view .sd-counter { color: #94a3b8; font-size: 13px; font-weight: 600; min-width: 110px; text-align: center; font-variant-numeric: tabular-nums; }
  #algo-sudoku-view .sd-speed-wrap { display: flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 12px; }
  #algo-sudoku-view #sd-speed { width: 130px; accent-color: var(--accent-a); }
  @media (max-width: 1100px) {
    #algo-sudoku-view .sd-main { grid-template-columns: 1fr; overflow: auto; }
    #algo-sudoku-view .sd-code { min-height: 360px; }
  }
</style>

<div class="sd-shell">
  <div class="sd-hero">
    <div class="sd-hero-left">
      <span class="sd-icon">🔢</span>
      <div>
        <h1>解数独（回溯）</h1>
        <div class="sd-sub">LeetCode 37 · 找空格、尝试 1-9、合法递归、失败回溯</div>
      </div>
    </div>
    <div class="sd-tip"><strong>核心动画：</strong>当前空格<span style="color:#fde68a">黄色脉冲</span>；尝试数字<span style="color:#6ee7b7">绿色 pop-in</span>；冲突<span style="color:#fca5a5">红色 shake</span>；解出时整盘点亮。</div>
  </div>
  <div class="sd-main">
    <div class="sd-left">
      <section class="sd-card">
        <div class="sd-card-title">输入 <span class="sd-tag">9 行 9 列，. 表示空格</span></div>
        <div class="sd-input-row">
          <textarea id="sudoku-input">53..7....
6..195...
.98....6.
8...6...3
4..8.3..1
7...2...6
.6....28.
...419..5
....8..79</textarea>
          <button id="sudoku-start">填数独</button>
        </div>
        <div class="sd-examples">
          <button id="sudoku-example-default" class="sd-chip-btn">经典示例</button>
          <button id="sudoku-example-easy" class="sd-chip-btn">简单示例</button>
        </div>
      </section>

      <div class="sd-stats">
        <div class="sd-stat sd-stat--att"><div class="sd-stat-label">尝试次数</div><div class="sd-stat-val" id="sudoku-attempts">0</div></div>
        <div class="sd-stat sd-stat--fill"><div class="sd-stat-label">已填格</div><div class="sd-stat-val" id="sudoku-filled">0/81</div></div>
        <div class="sd-stat sd-stat--cur"><div class="sd-stat-label">当前格</div><div class="sd-stat-val" id="sudoku-current">-</div></div>
        <div class="sd-stat sd-stat--cand"><div class="sd-stat-label">候选值</div><div class="sd-stat-val" id="sudoku-candidate">-</div></div>
      </div>

      <section class="sd-card sd-board-card">
        <div class="sd-card-title">数独棋盘 <span class="sd-tag">回溯填充</span></div>
        <div class="sd-board-wrap"><div id="sudoku-board"></div></div>
        <div class="sd-result" id="sd-result">
          <span class="sd-emoji">🔢</span>
          <div id="step-message">点击「填数独」观看回溯填充 + 冲突检测动画</div>
        </div>
      </section>

      <section class="sd-card">
        <div class="sd-card-title">执行日志</div>
        <div class="sd-log" id="sudoku-log"></div>
      </section>
    </div>
    <aside class="sd-code"><div data-code-panel></div></aside>
  </div>
  <div class="sd-controls-bar">
    <button id="step-reset" class="sd-ctrl-btn">⏮ 重置</button>
    <button id="step-prev" class="sd-ctrl-btn">◀ 上一步</button>
    <button id="step-play" class="sd-ctrl-btn sd-ctrl-primary">▶ 播放</button>
    <button id="step-next" class="sd-ctrl-btn">下一步 ▶</button>
    <span id="step-counter" class="sd-counter">步骤: 0 / 0</span>
    <div class="sd-speed-wrap">
      <span>速度</span>
      <input id="sd-speed" type="range" min="100" max="2500" step="100" value="500">
      <span id="sd-speed-label" style="min-width:42px;">0.5s</span>
    </div>
  </div>
</div>
