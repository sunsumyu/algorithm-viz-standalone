<style>
  .bt-article { padding: 1.6rem; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  .bt-article .article-shell { max-width: 1120px; margin: 0 auto; }

  .bt-article .hero {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 1.25rem;
    margin-bottom: 1.6rem; padding: 1.2rem 1.4rem;
    background: rgba(20, 18, 38, 0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }
  .bt-article .hero-left { display: flex; align-items: flex-start; gap: 16px; }
  .bt-article .icon-badge {
    width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 22px;
    background: linear-gradient(135deg, #fbbf24, #a78bfa);
    color: #1a1208;
    box-shadow: 0 8px 24px rgba(251, 191, 36, 0.45);
  }
  .bt-article .eyebrow {
    color: #fbbf24; font-size: 12px; letter-spacing: 0.09em; text-transform: uppercase;
    margin-bottom: 0.5rem; font-weight: 700;
  }
  .bt-article h1 { margin: 0 0 0.55rem; font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: #f1f5f9; line-height: 1.3; }
  .bt-article .lead { color: #c7cbe0; line-height: 1.85; max-width: 900px; font-size: 14.5px; }

  .bt-article .btn-back {
    border: 1px solid rgba(167, 139, 250, 0.4); background: rgba(20, 18, 38, 0.6);
    backdrop-filter: blur(18px) saturate(160%); color: #fcd34d; border-radius: 11px;
    padding: 10px 14px; cursor: pointer; white-space: nowrap; font-size: 14px; font-weight: 600;
    transition: all 0.25s; display: flex; align-items: center; gap: 8px;
  }
  .bt-article .btn-back:hover {
    background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(167, 139, 250, 0.2));
    border-color: #fbbf24; color: #fff; transform: translateY(-1px);
    box-shadow: 0 8px 22px rgba(251, 191, 36, 0.3);
  }

  .bt-article .grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 16px; margin: 1.4rem 0;
  }

  .bt-article .card {
    background: rgba(20, 18, 38, 0.55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px; padding: 1.4rem 1.6rem;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    transition: transform 0.3s cubic-bezier(.4,0,.2,1), border-color 0.3s, box-shadow 0.3s;
    animation: bws3-pop-in 0.55s cubic-bezier(.2,.7,.3,1) both;
  }
  .bt-article .card:hover {
    transform: translateY(-4px);
    border-color: rgba(251, 191, 36, 0.3);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(167, 139, 250, 0.12);
  }

  .bt-article .card h2 { color: #fcd34d; margin: 0 0 0.8rem; font-size: 16.5px; font-weight: 700; line-height: 1.4; }
  .bt-article .card h3 { color: #fde68a; margin: 0 0 0.6rem; font-size: 14px; font-weight: 700; line-height: 1.4; }

  .bt-article code {
    color: #c4b5fd; background: rgba(8, 8, 24, 0.6); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 6px; padding: 0.05rem 0.4rem; font-family: 'JetBrains Mono', Consolas, monospace; font-size: 0.88em;
  }

  .bt-article pre {
    background: rgba(8, 8, 24, 0.62); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 1rem 1.2rem; overflow: auto;
    color: #fde68a; line-height: 1.6; font-size: 13px;
    font-family: 'JetBrains Mono', Consolas, monospace;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    margin: 0.5rem 0;
  }

  .bt-article p, .bt-article li { color: #c7cbe0; line-height: 1.75; font-size: 14px; margin: 0.3rem 0; }
  .bt-article ul, .bt-article ol { padding-left: 1.3rem; margin: 0.3rem 0; }
  .bt-article li { margin-bottom: 0.5rem; list-style-type: circle; }
  .bt-article strong { color: #fde68a; }

  @keyframes bws3-pop-in {
    0% { opacity: 0; transform: translateY(14px) scale(0.98); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  @media (max-width: 1100px) {
    .bt-article .grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 720px) {
    .bt-article .hero { flex-direction: column; align-items: flex-start; }
    .bt-article .hero-left { flex-direction: column; align-items: flex-start; gap: 10px; }
  }
</style>

<article class="bt-article">
  <div class="article-shell">
    <header class="hero">
      <div class="hero-left">
        <div class="icon-badge">♟️</div>
        <div>
          <div class="eyebrow">Backtracking / Week Summary III</div>
          <h1>回溯周末总结（三）</h1>
          <p class="lead">递增子序列、排列与棋盘问题总结</p>
        </div>
      </div>
      <button class="btn-back" data-back-selector>← 返回算法列表</button>
    </header>

    <section class="grid">
      <div class="card">
        <h2>排列问题</h2>
        <p>排列需要 <code>used</code> 数组记录某个下标是否已经进入当前路径；去重时要区分"同一树层"和"同一树枝"。</p>
      </div>
      <div class="card">
        <h2>递增子序列</h2>
        <p>不能先排序，因为排序会破坏原数组相对顺序。应在每一层使用 <code>Set</code> 记录本层已经尝试过的数。</p>
      </div>
      <div class="card">
        <h2>棋盘问题</h2>
        <p>N 皇后和数独属于二维状态回溯，重点在于快速判断当前位置是否合法，以及递归完成后的状态回滚。</p>
      </div>
    </section>
  </div>
</article>
