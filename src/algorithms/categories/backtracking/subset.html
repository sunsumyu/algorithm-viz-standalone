<style>
  #algo-subset-view {
    --accent-a: #fbbf24;
    --accent-b: #fb7185;
    --accent-glow: rgba(251, 191, 36, .35);
    --path-color: #34d399;
    --prune-color: #f87171;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background:
      radial-gradient(ellipse at 8% 6%, rgba(251, 191, 36, .22), transparent 55%),
      radial-gradient(ellipse at 92% 94%, rgba(251, 113, 133, .22), transparent 55%),
      linear-gradient(135deg, #1a1605 0%, #4a1128 50%, #1a1605 100%);
    width: 100%; height: 100%;
    color: #e2e8f0;
    overflow: hidden;
  }
  #algo-subset-view .sub-shell {
    width: 100%; height: 100%;
    display: grid; grid-template-rows: auto 1fr; overflow: hidden;
  }
  #algo-subset-view .sub-hero {
    padding: 18px 24px 12px;
    display: flex; gap: 18px; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, .06);
    background: rgba(8, 8, 24, .35);
    backdrop-filter: blur(14px) saturate(150%);
  }
  #algo-subset-view .sub-hero-left { display: flex; align-items: center; gap: 14px; }
  #algo-subset-view .sub-icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 24px;
    background: linear-gradient(135deg, #fbbf24, #fb7185);
    color: #06121f; box-shadow: 0 6px 20px rgba(251, 191, 36, .35);
  }
  #algo-subset-view h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: #f1f5f9; }
  #algo-subset-view .sub-sub { color: #94a3b8; font-size: 12.5px; margin-top: 4px; }
  #algo-subset-view .sub-tip {
    max-width: 540px; padding: 10px 14px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(251, 191, 36, .12), rgba(251, 113, 133, .08));
    border: 1px solid rgba(251, 191, 36, .3);
    color: #cbd5e1; font-size: 12.5px; line-height: 1.65;
  }
  #algo-subset-view .sub-tip strong { color: #fcd34d; }
  #algo-subset-view .sub-main {
    min-height: 0; display: grid;
    grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; padding: 16px; overflow: hidden;
  }
  #algo-subset-view .sub-left { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
  #algo-subset-view .sub-card {
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
    overflow: hidden;
  }
  #algo-subset-view .sub-card-title {
    padding: 10px 16px; border-bottom: 1px solid rgba(255, 255, 255, .06);
    display: flex; justify-content: space-between; align-items: center;
    color: #cbd5e1; font-weight: 700; font-size: 13px;
  }
  #algo-subset-view .sub-tag {
    font-size: 11px; color: #fbbf24; background: rgba(251, 191, 36, .14);
    border: 1px solid rgba(251, 191, 36, .3); padding: 2px 8px; border-radius: 999px;
  }
  #algo-subset-view .sub-input-row {
    display: grid; grid-template-columns: 1fr auto;
    gap: 10px; align-items: center; padding: 14px 16px;
  }
  #algo-subset-view input {
    width: 100%; padding: 9px 12px; border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, .12);
    background: rgba(8, 8, 24, .6);
    color: #e2e8f0; font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 13px; outline: none; transition: all .2s;
  }
  #algo-subset-view input:focus { border-color: #fbbf24; box-shadow: 0 0 0 3px rgba(251, 191, 36, .15); }
  #algo-subset-view button {
    padding: 8px 16px; border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 10px; background: rgba(255, 255, 255, .04);
    color: #e2e8f0; cursor: pointer; font-weight: 600; font-size: 13px;
    transition: all .25s cubic-bezier(.4, 0, .2, 1);
  }
  #algo-subset-view button:hover:not(:disabled) {
    background: linear-gradient(135deg, #fbbf24, #fb7185);
    border-color: transparent; color: #06121f; transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(251, 191, 36, .35);
  }
  #algo-subset-view button:disabled { opacity: .4; cursor: not-allowed; }
  /* 统计 */
  #algo-subset-view .sub-stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }
  #algo-subset-view .sub-stat {
    position: relative; padding: 12px 14px 12px 18px;
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 14px; overflow: hidden;
  }
  #algo-subset-view .sub-stat::before {
    content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 4px; border-radius: 4px;
  }
  #algo-subset-view .sub-stat--path::before { background: linear-gradient(180deg, #fbbf24, #f97316); }
  #algo-subset-view .sub-stat--path .sub-stat-val { color: #fbbf24; }
  #algo-subset-view .sub-stat--start::before { background: linear-gradient(180deg, #fb7185, #e11d48); }
  #algo-subset-view .sub-stat--start .sub-stat-val { color: #fda4af; }
  #algo-subset-view .sub-stat--depth::before { background: linear-gradient(180deg, #a78bfa, #818cf8); }
  #algo-subset-view .sub-stat--depth .sub-stat-val { color: #e9d5ff; }
  #algo-subset-view .sub-stat--count::before { background: linear-gradient(180deg, #34d399, #10b981); }
  #algo-subset-view .sub-stat--count .sub-stat-val { color: #6ee7b7; }
  #algo-subset-view .sub-stat-label { color: #94a3b8; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  #algo-subset-view .sub-stat-val {
    font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 22px; font-weight: 800; margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  /* 决策树展示（SVG） */
  #algo-subset-view .sub-tree-card { flex: 1; min-height: 220px; display: flex; flex-direction: column; }
  #algo-subset-view #subset-tree-display {
    flex: 1; min-height: 180px; padding: 12px 8px;
    display: flex; align-items: center; justify-content: center;
    overflow: auto;
  }
  #algo-subset-view #subset-tree-display svg {
    max-width: 100%; max-height: 100%;
  }
  /* 结果横幅 */
  #algo-subset-view .sub-result-banner {
    margin: 0 16px 16px; padding: 14px 18px; border-radius: 12px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: linear-gradient(135deg, rgba(251, 191, 36, .12), rgba(251, 113, 133, .06));
    border: 1px solid rgba(251, 191, 36, .28);
    line-height: 1.55; font-size: 14px; color: #fef3c7;
  }
  #algo-subset-view .sub-result-banner .sub-emoji {
    width: 36px; height: 36px; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 20px;
    background: linear-gradient(135deg, #fbbf24, #fb7185);
    color: #06121f; box-shadow: 0 4px 14px rgba(251, 191, 36, .35);
    flex-shrink: 0;
  }
  /* 日志 */
  #algo-subset-view .sub-log {
    min-height: 80px; max-height: 130px; padding: 10px 14px;
    overflow: auto; background: rgba(8, 8, 24, .55);
    font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px;
    line-height: 1.65; color: #94a3b8;
  }
  #algo-subset-view .sub-code {
    min-height: 0; display: flex;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; overflow: hidden;
  }
  #algo-subset-view .sub-code [data-code-panel] { flex: 1; min-width: 0; }
  #algo-subset-view .sub-controls {
    padding: 14px 18px;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border-top: 1px solid rgba(255, 255, 255, .06);
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  #algo-subset-view .sub-controls .sub-ctrl-btn { min-width: 64px; }
  #algo-subset-view .sub-controls .sub-ctrl-primary {
    background: linear-gradient(135deg, #fbbf24, #fb7185);
    color: #06121f; border-color: transparent;
  }
  #algo-subset-view .sub-counter {
    color: #94a3b8; font-size: 13px; font-weight: 600;
    min-width: 110px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #algo-subset-view .sub-speed-wrap {
    display: flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 12px;
  }
  #algo-subset-view #step-speed { width: 130px; accent-color: #fbbf24; }
  @media (max-width: 1100px) {
    #algo-subset-view .sub-main { grid-template-columns: 1fr; overflow: auto; }
    #algo-subset-view .sub-code { min-height: 360px; }
  }
</style>

<div class="sub-shell">
  <div class="sub-hero">
    <div class="sub-hero-left">
      <span class="sub-icon">📦</span>
      <div>
        <h1>子集（回溯）</h1>
        <div class="sub-sub">LeetCode 78 · 生成 1...n 的所有可能的子集</div>
      </div>
    </div>
    <div class="sub-tip"><strong>核心动画：</strong>黄色<span style="color:#fbbf24">脉冲</span>为当前节点，紫色为已访问节点，绿色为已收集子集。子集问题不剪枝，每个节点都收集为一个子集。</div>
  </div>
  <div class="sub-main">
    <div class="sub-left">
      <section class="sub-card">
        <div class="sub-card-title">输入数组 <span class="sub-tag">数字种子</span></div>
        <div class="sub-input-row">
          <input id="subset-input" type="text" value="1,2,3" placeholder="逗号分隔数字">
          <button id="subset-start">生成子集</button>
        </div>
      </section>

      <div class="sub-stats">
        <div class="sub-stat sub-stat--path"><div class="sub-stat-label">路径长度</div><div class="sub-stat-val" id="sub-path-len">0</div></div>
        <div class="sub-stat sub-stat--start"><div class="sub-stat-label">递归深度</div><div class="sub-stat-val" id="sub-depth">0</div></div>
        <div class="sub-stat sub-stat--depth"><div class="sub-stat-label">已收集</div><div class="sub-stat-val" id="sub-count">0</div></div>
        <div class="sub-stat sub-stat--count"><div class="sub-stat-label">节点总数</div><div class="sub-stat-val" id="sub-total">0</div></div>
      </div>

      <section class="sub-card sub-tree-card">
        <div class="sub-card-title">回溯决策树 <span class="sub-tag">SVG</span></div>
        <div id="subset-tree-display"></div>
        <div class="sub-result-banner" id="subset-results-banner">
          <span class="sub-emoji">📦</span>
          <div id="step-message">点击「生成子集」观看回溯搜索决策树动画</div>
        </div>
      </section>

      <section class="sub-card">
        <div class="sub-card-title">执行日志 <button id="sub-log-clear" style="padding:4px 10px;font-size:11px;border-radius:999px;">清空</button></div>
        <div class="sub-log" id="sub-log"></div>
      </section>
    </div>
    <aside class="sub-code"><div data-code-panel></div></aside>
  </div>
  <div class="sub-controls">
    <button id="step-reset" class="sub-ctrl-btn">⏮ 重置</button>
    <button id="step-prev" class="sub-ctrl-btn">◀ 上一步</button>
    <button id="step-play" class="sub-ctrl-btn sub-ctrl-primary">▶ 播放</button>
    <button id="step-next" class="sub-ctrl-btn">下一步 ▶</button>
    <span id="step-counter" class="sub-counter">步骤: 0 / 0</span>
    <div class="sub-speed-wrap">
      <span>速度</span>
      <input id="step-speed" type="range" min="200" max="2500" step="100" value="700">
      <span id="step-speed-label" style="min-width:42px;">0.7s</span>
    </div>
  </div>
</div>
