<style>
  /* === 组合总和 II · 玻璃感 + SVG 决策树 === */
  #algo-combination-sum-ii-view {
    --accent-a: #c084fc;
    --accent-b: #f472b6;
    --accent-glow: rgba(192, 132, 252, .4);
    width: 100%; height: 100%;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background:
      radial-gradient(ellipse at 8% 6%, rgba(192, 132, 252, .22), transparent 55%),
      radial-gradient(ellipse at 92% 94%, rgba(244, 114, 182, .22), transparent 55%),
      linear-gradient(135deg, #1a0e1d 0%, #1d0e2a 50%, #2a1a30 100%);
    overflow: hidden;
  }
  #algo-combination-sum-ii-view .bt-shell {
    width: 100%; height: 100%;
    display: grid; grid-template-rows: auto 1fr; overflow: hidden;
  }
  #algo-combination-sum-ii-view .bt-hero {
    padding: 18px 24px 12px;
    display: flex; gap: 18px; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, .06);
    background: rgba(8, 8, 24, .35);
    backdrop-filter: blur(14px) saturate(150%);
  }
  #algo-combination-sum-ii-view .bt-hero-left { display: flex; align-items: center; gap: 14px; }
  #algo-combination-sum-ii-view .bt-icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 24px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; box-shadow: 0 6px 20px var(--accent-glow);
  }
  #algo-combination-sum-ii-view h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: #f1f5f9; }
  #algo-combination-sum-ii-view .bt-sub { color: #94a3b8; font-size: 12.5px; margin-top: 4px; }
  #algo-combination-sum-ii-view .bt-tip {
    max-width: 540px; padding: 10px 14px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(192, 132, 252, .12), rgba(244, 114, 182, .08));
    border: 1px solid rgba(192, 132, 252, .3);
    color: #cbd5e1; font-size: 12.5px; line-height: 1.65;
  }
  #algo-combination-sum-ii-view .bt-tip strong { color: #e9d5ff; }
  #algo-combination-sum-ii-view .bt-main {
    min-height: 0; display: grid;
    grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; padding: 16px; overflow: hidden;
  }
  #algo-combination-sum-ii-view .bt-left { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
  #algo-combination-sum-ii-view .bt-card {
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
    overflow: hidden;
  }
  #algo-combination-sum-ii-view .bt-card-title {
    padding: 10px 16px; border-bottom: 1px solid rgba(255, 255, 255, .06);
    display: flex; justify-content: space-between; align-items: center;
    color: #cbd5e1; font-weight: 700; font-size: 13px;
  }
  #algo-combination-sum-ii-view .bt-tag {
    font-size: 11px; color: #e9d5ff; background: rgba(192, 132, 252, .14);
    border: 1px solid rgba(192, 132, 252, .3); padding: 2px 8px; border-radius: 999px;
  }
  #algo-combination-sum-ii-view .bt-input-row {
    display: grid; grid-template-columns: 1fr 1fr auto;
    gap: 10px; align-items: center; padding: 14px 16px;
  }
  #algo-combination-sum-ii-view input {
    width: 100%; padding: 9px 12px; border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, .12);
    background: rgba(8, 8, 24, .6);
    color: #e2e8f0; font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 13px; outline: none; transition: all .2s;
  }
  #algo-combination-sum-ii-view input:focus { border-color: var(--accent-a); box-shadow: 0 0 0 3px rgba(192, 132, 252, .15); }
  #algo-combination-sum-ii-view button {
    padding: 8px 16px; border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 10px; background: rgba(255, 255, 255, .04);
    color: #e2e8f0; cursor: pointer; font-weight: 600; font-size: 13px;
    transition: all .25s cubic-bezier(.4, 0, .2, 1);
  }
  #algo-combination-sum-ii-view button:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    border-color: transparent; color: #06121f; transform: translateY(-1px);
    box-shadow: 0 6px 18px var(--accent-glow);
  }
  #algo-combination-sum-ii-view button:disabled { opacity: .4; cursor: not-allowed; }
  #algo-combination-sum-ii-view .bt-examples { padding: 0 16px 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  #algo-combination-sum-ii-view .bt-chip-btn {
    padding: 5px 12px; border-radius: 999px; font-size: 12px;
    background: rgba(244, 114, 182, .12); border: 1px solid rgba(244, 114, 182, .28);
    color: #f9a8d4; cursor: pointer; transition: all .2s;
  }
  #algo-combination-sum-ii-view .bt-chip-btn:hover {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; border-color: transparent; transform: translateY(-1px);
  }
  /* Stats */
  #algo-combination-sum-ii-view .bt-stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }
  #algo-combination-sum-ii-view .bt-stat {
    position: relative; padding: 12px 14px 12px 18px;
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 14px; overflow: hidden;
  }
  #algo-combination-sum-ii-view .bt-stat::before {
    content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 4px; border-radius: 4px;
  }
  #algo-combination-sum-ii-view .bt-stat--remaining::before { background: linear-gradient(180deg, var(--accent-a), var(--accent-b)); }
  #algo-combination-sum-ii-view .bt-stat--remaining .bt-stat-val { color: #e9d5ff; }
  #algo-combination-sum-ii-view .bt-stat--depth::before { background: linear-gradient(180deg, #c084fc, #a855f7); }
  #algo-combination-sum-ii-view .bt-stat--depth .bt-stat-val { color: #e9d5ff; }
  #algo-combination-sum-ii-view .bt-stat--count::before { background: linear-gradient(180deg, #34d399, #10b981); }
  #algo-combination-sum-ii-view .bt-stat--count .bt-stat-val { color: #6ee7b7; }
  #algo-combination-sum-ii-view .bt-stat--path::before { background: linear-gradient(180deg, #fbbf24, #f59e0b); }
  #algo-combination-sum-ii-view .bt-stat--path .bt-stat-val { color: #fde68a; }
  #algo-combination-sum-ii-view .bt-stat-label { color: #94a3b8; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  #algo-combination-sum-ii-view .bt-stat-val {
    font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 22px; font-weight: 800; margin-top: 4px;
    color: #e9d5ff;
    font-variant-numeric: tabular-nums;
  }

  /* Tree display */
  #algo-combination-sum-ii-view .bt-tree-card {
    flex: 1; min-height: 380px; display: flex; flex-direction: column;
  }
  #algo-combination-sum-ii-view #combination-tree-display {
    flex: 1; min-height: 320px; padding: 16px 12px;
    display: flex; align-items: center; justify-content: center;
    overflow: auto;
  }

  /* Message banner */
  #algo-combination-sum-ii-view .bt-message {
    margin: 0 16px 16px; padding: 14px 18px; border-radius: 12px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: linear-gradient(135deg, rgba(192, 132, 252, .12), rgba(244, 114, 182, .06));
    border: 1px solid rgba(192, 132, 252, .28);
    line-height: 1.55; font-size: 14px; color: #e9d5ff;
  }
  #algo-combination-sum-ii-view .bt-message .bt-emoji {
    width: 36px; height: 36px; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 20px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; box-shadow: 0 4px 14px var(--accent-glow);
    flex-shrink: 0;
  }

  /* Log */
  #algo-combination-sum-ii-view .bt-log {
    min-height: 80px; max-height: 130px; padding: 10px 14px;
    overflow: auto; background: rgba(8, 8, 24, .55);
    font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px;
    line-height: 1.65; color: #94a3b8;
  }

  /* SVG tree styles from shared module (bt prefix) */
  .bt-edge { stroke: rgba(255,255,255,0.1); stroke-width: 1.5; transition: all .3s; }
  .bt-edge-active { stroke: #c084fc; stroke-width: 2.5; filter: drop-shadow(0 0 4px rgba(192,132,252,.5)); }
  .bt-edge-found { stroke: #34d399; stroke-width: 2; }
  .bt-edge-pruned { stroke: rgba(255,255,255,0.06); stroke-dasharray: 4 3; }
  .bt-edge-dim { stroke: rgba(255,255,255,0.05); }
  .bt-edge-label { fill: #94a3b8; font-family: 'JetBrains Mono', monospace; }
  .bt-node-circle { fill: #1e1e2e; stroke: #45475a; stroke-width: 2; transition: all .3s; }
  .bt-node-current { fill: rgba(192,132,252,0.3); stroke: #c084fc; stroke-width: 3; animation: bt-tree-pulse 1.2s infinite; }
  .bt-node-found { fill: rgba(52,211,153,0.3); stroke: #34d399; stroke-width: 2.5; filter: drop-shadow(0 0 6px rgba(52,211,153,0.4)); }
  .bt-node-visited { fill: rgba(244,114,182,0.2); stroke: rgba(244,114,182,0.5); stroke-width: 2; }
  .bt-node-pruned { fill: rgba(100,100,120,0.15); stroke: rgba(100,100,120,0.3); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .bt-node-label { fill: #cdd6f4; font-family: 'JetBrains Mono', monospace; font-weight: 700; }
  .bt-node-check { fill: #34d399; font-size: 14px; font-weight: 900; }
  .bt-node-pruned-mark { fill: #f87171; font-size: 12px; font-weight: 900; }
  .bt-log-line { display: flex; gap: 8px; padding: 1px 0; color: #94a3b8; font-size: 12px; line-height: 1.65; }
  .bt-log-line .bt-log-num { color: #64748b; flex-shrink: 0; }
  .bt-log-line.bt-log-active { color: #e9d5ff; font-weight: 600; }
  .bt-log-line.bt-log-active .bt-log-num { color: #c084fc; }
  @keyframes bt-tree-pulse {
    0%, 100% { filter: drop-shadow(0 0 0 rgba(192,132,252,.6)); }
    50% { filter: drop-shadow(0 0 8px rgba(192,132,252,.8)); }
  }
  @keyframes bt-tree-found {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.2); }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes bt-tree-check {
    0% { transform: scale(0); }
    60% { transform: scale(1.4); }
    100% { transform: scale(1); }
  }

  /* Code panel */
  #algo-combination-sum-ii-view .bt-code {
    min-height: 0; display: flex;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; overflow: hidden;
  }
  #algo-combination-sum-ii-view .bt-code [data-code-panel] { flex: 1; min-width: 0; }

  /* Controls */
  #algo-combination-sum-ii-view .bt-controls {
    padding: 14px 18px;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border-top: 1px solid rgba(255, 255, 255, .06);
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  #algo-combination-sum-ii-view .bt-controls .bt-ctrl-btn { min-width: 64px; }
  #algo-combination-sum-ii-view .bt-controls .bt-ctrl-primary {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; border-color: transparent;
  }
  #algo-combination-sum-ii-view .bt-counter {
    color: #94a3b8; font-size: 13px; font-weight: 600;
    min-width: 110px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #algo-combination-sum-ii-view .bt-speed-wrap {
    display: flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 12px;
  }
  #algo-combination-sum-ii-view #step-speed { width: 130px; accent-color: var(--accent-a); }
  #algo-combination-sum-ii-view #step-speed-label { min-width: 42px; }

  @media (max-width: 1100px) {
    #algo-combination-sum-ii-view .bt-main { grid-template-columns: 1fr; overflow: auto; }
    #algo-combination-sum-ii-view .bt-code { min-height: 360px; }
  }
</style>

<div class="bt-shell">
  <div class="bt-hero">
    <div class="bt-hero-left">
      <span class="bt-icon">&#x1F3AF;</span>
      <div>
        <h1>组合总和 II（回溯 + 去重）</h1>
        <div class="bt-sub">LeetCode 40 · 每个元素只能用一次，同层跳过重复值</div>
      </div>
    </div>
    <div class="bt-tip"><strong>核心动画：</strong>紫色<span style="color:#e9d5ff">脉冲</span>为当前节点，粉色为已访问节点，绿色为找到的组合，灰色虚线为剪枝/去重分支。观察含去重的决策树。</div>
  </div>
  <div class="bt-main">
    <div class="bt-left">
      <section class="bt-card">
        <div class="bt-card-title">输入 <span class="bt-tag">数组 / 目标</span></div>
        <div class="bt-input-row">
          <input id="bt-nums" value="10,1,2,7,6,1,5" placeholder="候选数字（可含重复）">
          <input id="bt-target" value="8" placeholder="目标">
          <button id="bt-start">生成组合</button>
        </div>
        <div class="bt-examples">
          <button class="bt-chip-btn bt-example" data-nums="10,1,2,7,6,1,5" data-target="8">经典示例</button>
          <button class="bt-chip-btn bt-example" data-nums="2,5,2,1,2" data-target="5">示例2</button>
          <button class="bt-chip-btn bt-example" data-nums="1,1,1,1" data-target="2">多重去重</button>
        </div>
      </section>

      <div class="bt-stats">
        <div class="bt-stat bt-stat--remaining"><div class="bt-stat-label">剩余目标</div><div class="bt-stat-val" id="bt-remaining">0</div></div>
        <div class="bt-stat bt-stat--depth"><div class="bt-stat-label">递归深度</div><div class="bt-stat-val" id="bt-depth">0</div></div>
        <div class="bt-stat bt-stat--count"><div class="bt-stat-label">已收集</div><div class="bt-stat-val" id="bt-count">0</div></div>
        <div class="bt-stat bt-stat--path"><div class="bt-stat-label">路径长度</div><div class="bt-stat-val" id="bt-path-len">0</div></div>
      </div>

      <section class="bt-card bt-tree-card">
        <div class="bt-card-title">回溯决策树 <span class="bt-tag">SVG</span></div>
        <div id="combination-tree-display"></div>
        <div class="bt-message" id="step-message">
          <span class="bt-emoji">&#x1F3AF;</span>
          <div>点击「生成组合」观看回溯 + 去重决策树动画</div>
        </div>
      </section>

      <section class="bt-card">
        <div class="bt-card-title">执行日志 <button id="bt-log-clear" style="padding:4px 10px;font-size:11px;border-radius:999px;">清空</button></div>
        <div class="bt-log" id="bt-log"></div>
      </section>
    </div>
    <aside class="bt-code"><div data-code-panel></div></aside>
  </div>
  <div class="bt-controls">
    <button id="step-reset" class="bt-ctrl-btn">&#x23EE; 重置</button>
    <button id="step-prev" class="bt-ctrl-btn">&#x25C0; 上一步</button>
    <button id="step-play" class="bt-ctrl-btn bt-ctrl-primary">&#x25B6; 播放</button>
    <button id="step-next" class="bt-ctrl-btn">下一步 &#x25B6;</button>
    <span id="step-counter" class="bt-counter">步骤: 0 / 0</span>
    <div class="bt-speed-wrap">
      <span>速度</span>
      <input id="step-speed" type="range" min="200" max="2500" step="100" value="600">
      <span id="step-speed-label">0.6s</span>
    </div>
  </div>
</div>
