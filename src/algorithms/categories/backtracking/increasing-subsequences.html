<style>
  /* === 递增子序列 · 玻璃感 + SVG 决策树 === */
  #algo-increasing-subsequences-view {
    --accent-a: #22d3ee;
    --accent-b: #a78bfa;
    --accent-glow: rgba(34, 211, 238, .35);
    --path-color: #34d399;
    --prune-color: #f87171;
    width: 100%; height: 100%;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background:
      radial-gradient(ellipse at 8% 6%, rgba(34, 211, 238, .22), transparent 55%),
      radial-gradient(ellipse at 92% 94%, rgba(167, 139, 250, .22), transparent 55%),
      linear-gradient(135deg, #051a1f 0%, #14102a 50%, #1d1a30 100%);
    overflow: hidden;
  }
  #algo-increasing-subsequences-view .is-shell {
    width: 100%; height: 100%;
    display: grid; grid-template-rows: auto 1fr; overflow: hidden;
  }
  #algo-increasing-subsequences-view .is-hero {
    padding: 18px 24px 12px;
    display: flex; gap: 18px; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, .06);
    background: rgba(8, 8, 24, .35);
    backdrop-filter: blur(14px) saturate(150%);
  }
  #algo-increasing-subsequences-view .is-hero-left { display: flex; align-items: center; gap: 14px; }
  #algo-increasing-subsequences-view .is-icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 24px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; box-shadow: 0 6px 20px var(--accent-glow);
  }
  #algo-increasing-subsequences-view h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: #f1f5f9; }
  #algo-increasing-subsequences-view .is-sub { color: #94a3b8; font-size: 12.5px; margin-top: 4px; }
  #algo-increasing-subsequences-view .is-tip {
    max-width: 560px; padding: 10px 14px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(34, 211, 238, .12), rgba(167, 139, 250, .08));
    border: 1px solid rgba(34, 211, 238, .3);
    color: #cbd5e1; font-size: 12.5px; line-height: 1.65;
  }
  #algo-increasing-subsequences-view .is-tip strong { color: #67e8f9; }
  #algo-increasing-subsequences-view .is-main {
    min-height: 0; display: grid;
    grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; padding: 16px; overflow: hidden;
  }
  #algo-increasing-subsequences-view .is-left { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
  #algo-increasing-subsequences-view .is-card {
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
    overflow: hidden;
  }
  #algo-increasing-subsequences-view .is-card-title {
    padding: 10px 16px; border-bottom: 1px solid rgba(255, 255, 255, .06);
    display: flex; justify-content: space-between; align-items: center;
    color: #cbd5e1; font-weight: 700; font-size: 13px;
  }
  #algo-increasing-subsequences-view .is-tag {
    font-size: 11px; color: #67e8f9; background: rgba(34, 211, 238, .14);
    border: 1px solid rgba(34, 211, 238, .3); padding: 2px 8px; border-radius: 999px;
  }
  #algo-increasing-subsequences-view .is-input-row {
    display: flex; gap: 10px; align-items: center; padding: 14px 16px; flex-wrap: wrap;
  }
  #algo-increasing-subsequences-view input {
    width: 100%; padding: 9px 12px; border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, .12);
    background: rgba(8, 8, 24, .6);
    color: #e2e8f0; font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 13px; outline: none; transition: all .2s;
  }
  #algo-increasing-subsequences-view input:focus { border-color: var(--accent-a); box-shadow: 0 0 0 3px rgba(34, 211, 238, .15); }
  #algo-increasing-subsequences-view .is-nums-input { flex: 1; min-width: 200px; }
  #algo-increasing-subsequences-view button {
    padding: 8px 16px; border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 10px; background: rgba(255, 255, 255, .04);
    color: #e2e8f0; cursor: pointer; font-weight: 600; font-size: 13px;
    transition: all .25s cubic-bezier(.4, 0, .2, 1);
  }
  #algo-increasing-subsequences-view button:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    border-color: transparent; color: #06121f; transform: translateY(-1px);
    box-shadow: 0 6px 18px var(--accent-glow);
  }
  #algo-increasing-subsequences-view button:disabled { opacity: .4; cursor: not-allowed; }
  #algo-increasing-subsequences-view .is-examples { padding: 0 16px 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  #algo-increasing-subsequences-view .is-chip {
    padding: 5px 12px; border-radius: 999px; font-size: 12px;
    background: rgba(167, 139, 250, .12); border: 1px solid rgba(167, 139, 250, .28);
    color: #ddd6fe; cursor: pointer; transition: all .2s;
  }
  #algo-increasing-subsequences-view .is-chip:hover {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; border-color: transparent; transform: translateY(-1px);
  }
  /* Stats */
  #algo-increasing-subsequences-view .is-stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  }
  #algo-increasing-subsequences-view .is-stat {
    position: relative; padding: 12px 14px 12px 18px;
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 14px; overflow: hidden;
  }
  #algo-increasing-subsequences-view .is-stat::before {
    content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 4px; border-radius: 4px;
  }
  #algo-increasing-subsequences-view .is-stat--depth::before { background: linear-gradient(180deg, #a78bfa, #8b5cf6); }
  #algo-increasing-subsequences-view .is-stat--depth .is-stat-val { color: #ddd6fe; }
  #algo-increasing-subsequences-view .is-stat--count::before { background: linear-gradient(180deg, #34d399, #10b981); }
  #algo-increasing-subsequences-view .is-stat--count .is-stat-val { color: #6ee7b7; }
  #algo-increasing-subsequences-view .is-stat--path::before { background: linear-gradient(180deg, #22d3ee, #06b6d4); }
  #algo-increasing-subsequences-view .is-stat--path .is-stat-val { color: #67e8f9; }
  #algo-increasing-subsequences-view .is-stat-label { color: #94a3b8; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  #algo-increasing-subsequences-view .is-stat-val {
    font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 22px; font-weight: 800; margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }

  /* Tree display (SVG-based) */
  #algo-increasing-subsequences-view .is-tree-card {
    flex: 1; min-height: 220px; display: flex; flex-direction: column;
  }
  #algo-increasing-subsequences-view #increasing-subsequences-tree-display {
    flex: 1; min-height: 180px; padding: 12px 8px;
    display: flex; align-items: center; justify-content: center;
    overflow: auto;
  }
  #algo-increasing-subsequences-view #increasing-subsequences-tree-display svg {
    max-width: 100%; max-height: 100%;
  }

  /* Result banner */
  #algo-increasing-subsequences-view .is-result-banner {
    margin: 0 16px 16px; padding: 14px 18px; border-radius: 12px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: linear-gradient(135deg, rgba(34, 211, 238, .12), rgba(167, 139, 250, .06));
    border: 1px solid rgba(34, 211, 238, .28);
    line-height: 1.55; font-size: 14px; color: #cffafe;
  }
  #algo-increasing-subsequences-view .is-result-banner .is-emoji {
    width: 36px; height: 36px; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 20px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; box-shadow: 0 4px 14px var(--accent-glow);
    flex-shrink: 0;
  }

  /* Log */
  #algo-increasing-subsequences-view .is-log {
    min-height: 80px; max-height: 130px; padding: 10px 14px;
    overflow: auto; background: rgba(8, 8, 24, .55);
    font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px;
    line-height: 1.65; color: #94a3b8;
  }

  /* SVG tree styles from shared module (inlined for safety) */
  .is-edge { stroke: rgba(255,255,255,0.1); stroke-width: 1.5; transition: all .3s; }
  .is-edge-active { stroke: #22d3ee; stroke-width: 2.5; filter: drop-shadow(0 0 4px rgba(34,211,238,.5)); }
  .is-edge-found { stroke: #34d399; stroke-width: 2; }
  .is-edge-pruned { stroke: rgba(255,255,255,0.06); stroke-dasharray: 4 3; }
  .is-edge-dim { stroke: rgba(255,255,255,0.05); }
  .is-edge-label { fill: #94a3b8; font-family: 'JetBrains Mono', monospace; }
  .is-node-circle { fill: #1e1e2e; stroke: #45475a; stroke-width: 2; transition: all .3s; }
  .is-node-current { fill: rgba(34,211,238,0.3); stroke: #22d3ee; stroke-width: 3; animation: is-tree-pulse 1.2s infinite; }
  .is-node-found { fill: rgba(52,211,153,0.3); stroke: #34d399; stroke-width: 2.5; filter: drop-shadow(0 0 6px rgba(52,211,153,0.4)); }
  .is-node-visited { fill: rgba(167,139,250,0.2); stroke: rgba(167,139,250,0.5); stroke-width: 2; }
  .is-node-pruned { fill: rgba(100,100,120,0.15); stroke: rgba(100,100,120,0.3); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .is-node-label { fill: #cdd6f4; font-family: 'JetBrains Mono', monospace; font-weight: 700; }
  .is-node-check { fill: #34d399; font-size: 14px; font-weight: 900; }
  .is-node-pruned-mark { fill: #f87171; font-size: 12px; font-weight: 900; }
  .is-log-line { display: flex; gap: 8px; padding: 1px 0; color: #94a3b8; font-size: 12px; line-height: 1.65; }
  .is-log-line .is-log-num { color: #64748b; flex-shrink: 0; }
  .is-log-line.is-log-active { color: #67e8f9; font-weight: 600; }
  .is-log-line.is-log-active .is-log-num { color: #22d3ee; }
  @keyframes is-tree-pulse {
    0%, 100% { filter: drop-shadow(0 0 0 rgba(34,211,238,.6)); }
    50% { filter: drop-shadow(0 0 8px rgba(34,211,238,.8)); }
  }
  @keyframes is-tree-found {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.2); }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes is-tree-check {
    0% { transform: scale(0); }
    60% { transform: scale(1.4); }
    100% { transform: scale(1); }
  }

  /* Code panel */
  #algo-increasing-subsequences-view .is-code {
    min-height: 0; display: flex;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; overflow: hidden;
  }
  #algo-increasing-subsequences-view .is-code [data-code-panel] { flex: 1; min-width: 0; }

  /* Controls */
  #algo-increasing-subsequences-view .is-controls {
    padding: 14px 18px;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border-top: 1px solid rgba(255, 255, 255, .06);
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  #algo-increasing-subsequences-view .is-controls .is-ctrl-btn { min-width: 64px; }
  #algo-increasing-subsequences-view .is-controls .is-ctrl-primary {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #06121f; border-color: transparent;
  }
  #algo-increasing-subsequences-view .is-counter {
    color: #94a3b8; font-size: 13px; font-weight: 600;
    min-width: 110px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #algo-increasing-subsequences-view .is-speed-wrap {
    display: flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 12px;
  }
  #algo-increasing-subsequences-view #step-speed { width: 130px; accent-color: var(--accent-a); }
  #algo-increasing-subsequences-view #step-speed-label { min-width: 42px; }

  @media (max-width: 1100px) {
    #algo-increasing-subsequences-view .is-main { grid-template-columns: 1fr; overflow: auto; }
    #algo-increasing-subsequences-view .is-code { min-height: 360px; }
  }
</style>

<div class="is-shell">
  <div class="is-hero">
    <div class="is-hero-left">
      <span class="is-icon">&#x1F4C8;</span>
      <div>
        <h1>递增子序列（回溯）</h1>
        <div class="is-sub">LeetCode 491 · 保持原序，同层 Set 去重，收集长度 >= 2 的非递减子序列</div>
      </div>
    </div>
    <div class="is-tip"><strong>核心动画：</strong>青色<span style="color:#22d3ee">脉冲</span>为当前节点，紫色为已访问，绿色为已收集子序列，灰色虚线为剪枝分支（同层重复 / 破坏递增）。</div>
  </div>
  <div class="is-main">
    <div class="is-left">
      <section class="is-card">
        <div class="is-card-title">输入 <span class="is-tag">数组</span></div>
        <div class="is-input-row">
          <input id="is-nums" class="is-nums-input" value="4,6,7,7" placeholder="数字数组（保持原序）">
          <button id="is-start">生成子序列</button>
        </div>
        <div class="is-examples">
          <button class="is-chip" data-nums="4,6,7,7">经典示例</button>
          <button class="is-chip" data-nums="4,4,3,2,1">含重复</button>
          <button class="is-chip" data-nums="1,2,3,4">递增数组</button>
          <button class="is-chip" data-nums="1,2,1,2,1">交错重复</button>
        </div>
      </section>

      <div class="is-stats">
        <div class="is-stat is-stat--depth"><div class="is-stat-label">递归深度</div><div class="is-stat-val" id="is-depth">0</div></div>
        <div class="is-stat is-stat--count"><div class="is-stat-label">已收集</div><div class="is-stat-val" id="is-count">0</div></div>
        <div class="is-stat is-stat--path"><div class="is-stat-label">路径长度</div><div class="is-stat-val" id="is-path-len">0</div></div>
      </div>

      <section class="is-card is-tree-card">
        <div class="is-card-title">回溯决策树 <span class="is-tag">SVG</span></div>
        <div id="increasing-subsequences-tree-display"></div>
        <div class="is-result-banner" id="is-result-banner">
          <span class="is-emoji">&#x1F4C8;</span>
          <div id="step-message">点击「生成子序列」观看回溯搜索决策树动画</div>
        </div>
      </section>

      <section class="is-card">
        <div class="is-card-title">执行日志 <button id="is-log-clear" style="padding:4px 10px;font-size:11px;border-radius:999px;">清空</button></div>
        <div class="is-log" id="is-log"></div>
      </section>
    </div>
    <aside class="is-code"><div data-code-panel></div></aside>
  </div>
  <div class="is-controls">
    <button id="step-reset" class="is-ctrl-btn">&#x23EE; 重置</button>
    <button id="step-prev" class="is-ctrl-btn">&#x25C0; 上一步</button>
    <button id="step-play" class="is-ctrl-btn is-ctrl-primary">&#x25B6; 播放</button>
    <button id="step-next" class="is-ctrl-btn">下一步 &#x25B6;</button>
    <span id="step-counter" class="is-counter">步骤: 0 / 0</span>
    <div class="is-speed-wrap">
      <span>速度</span>
      <input id="step-speed" type="range" min="200" max="2500" step="100" value="600">
      <span id="step-speed-label">0.6s</span>
    </div>
  </div>
</div>
