      <span class="pm-badge-complexity">O(n·n!) · O(n)</span>
    </div>

    <div class="pm-header-right">

        <button class="pm-chip" data-nums="1,2,3,4">1,2,3,4 (4! = 24)</button>

        <span>nums:</span>

      </div>

      <button id="btn-generate" class="pm-btn-generate">
        <span>▶ 生成</span>
      </button>

      <button id="btn-reset" class="pm-btn-reset">
        重置
      </button>
    </div>
  </header>

      <div class="pm-card">
        <div class="pm-card-header">
          <div class="pm-card-title">
            <span>🌲 N 叉排列决策树沙盘 (Permutation Tree)</span>

            <div><span class="pm-legend-dot" style="background:#94a3b8;"></span> 🔙已回溯</div>
          </div>
        </div>

        <!-- 决策树居中展示盒 -->
        <div id="permutation-tree-display"></div>
      </div>

      <div class="pm-playback-bar">
        <input type="range" id="slider-progress" min="0" max="0" value="0" class="pm-slider" />

          <div>

            <div class="pm-subcard">
              <div class="pm-subcard-title">🏷️ used[] 元素占用标记 (Branch Used)</div>
              <div id="pm-used-monitor-container" style="flex: 1; min-height: 0; overflow-y: auto;"></div>
            </div>
          </div>
          <!-- 解集箱 -->
          <div class="pm-subcard" style="flex-shrink: 0;">
            <div class="pm-subcard-title">🏆 实时全排列收集箱 (Result Collection)</div>
            <div id="pm-result-collection-container"></div>
          </div>
        </div>
      </div>

    </section>

    <!-- ================= 右侧：代码终端 + 执行日志 ================= -->
    <section class="pm-right-section">

      <!-- 卡片 3: 暗色代码终端面板 -->
      <div class="pm-dark-terminal">
        <div class="pm-terminal-header">
          <!-- 1. 主 Tab 切换器 (源码 / 题目 / 精讲) -->
          <div class="pm-tab-group">
            <button id="btn-tab-code" class="pm-tab-item active">💻 代码调试</button>
            <button id="btn-tab-problem" class="pm-tab-item">📋 题目描述</button>
            <button id="btn-tab-analysis" class="pm-tab-item">💡 回溯精讲</button>
          </div>

          <!-- 2. 多语言切换器 -->
          <div class="pm-lang-group" id="code-lang-tabs">
            <button class="pm-lang-btn active" data-lang="java">Java</button>
            <button class="pm-lang-btn" data-lang="cpp">C++</button>
            <button class="pm-lang-btn" data-lang="python">Python</button>
            <button class="pm-lang-btn" data-lang="javascript">JS</button>
          </div>

          <!-- 3. 字号缩放器与 macOS 窗口微控制 -->
          <div class="pm-font-tools">
            <div class="pm-font-scaler">
              <button id="btn-code-font-dec" title="缩小代码字号">A-</button>
              <span id="code-font-indicator" class="pm-font-indicator">12</span>
              <button id="btn-code-font-inc" title="放大代码字号">A+</button>
            </div>

            <div class="pm-window-dots">
              <span class="pm-dot" style="background:#ef4444;"></span>
              <span class="pm-dot" style="background:#eab308;"></span>
              <span class="pm-dot" style="background:#22c55e;"></span>
            </div>
          </div>
        </div>

        <!-- 容器 1: 源码高亮与单步追踪视图 -->
        <div id="code-view-container" style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;">
          <div class="pm-terminal-body">
            <div id="code-lines-wrapper">
              <!-- 动态装载代码行 -->
            </div>
          </div>
        </div>

        <!-- 容器 2: 题目完整描述视图 -->
        <div id="problem-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载题目内容 -->
        </div>

        <!-- 容器 3: 回溯精讲视图 -->
        <div id="analysis-view-container" style="display: none; flex: 1; min-height: 0; padding: 14px; overflow-y: auto; background: #0f172a; color: #cbd5e1;">
          <!-- 动态装载回溯精讲内容 -->
        </div>
      </div>

      <!-- 卡片 4: 独立执行日志卡片 -->
      <div class="pm-log-card">
        <div class="pm-log-header">
          <div class="pm-log-header-title">
            <span>📜 执行日志</span>
          </div>
          <span id="log-count" class="pm-log-count">0 条记录</span>
        </div>

        <div id="log-container" class="pm-log-body">
          <!-- 动态填充日志条目 -->
        </div>
      </div>

    </section>

  </main>

  <!-- 4. 力扣原题描述轻量模态弹窗 (Modal) -->
  <div id="modal-problem" class="pm-modal-backdrop hidden">
    <div class="pm-modal-content">
      <div class="pm-modal-header">
        <div class="pm-modal-title">
          <span>📋 力扣原题描述</span>
        </div>
        <button id="btn-close-problem-modal" class="pm-modal-close" title="关闭 (Esc)">✕</button>
      </div>
      <div id="modal-problem-body" class="pm-modal-body">
        <!-- 动态装载题目内容 -->
      </div>
    </div>
  </div>
</div>
