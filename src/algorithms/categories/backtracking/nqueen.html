<style>
  /* === N 皇后（回溯）· 玻璃感 + 皇后落子 + 冲突高亮 === */
  #algo-nqueen-view {
    --accent-a: #a78bfa;
    --accent-b: #f472b6;
    --accent-glow: rgba(167, 139, 250, .4);
    width: 100%; height: 100%;
    color: #cdd6f4;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background:
      radial-gradient(ellipse at 8% 6%, rgba(167, 139, 250, .22), transparent 55%),
      radial-gradient(ellipse at 92% 94%, rgba(236, 72, 153, .22), transparent 55%),
      linear-gradient(135deg, #1e1e2e 0%, #181825 50%, #1a0e1d 100%);
    overflow: hidden;
  }
  #algo-nqueen-view .nq-shell { width: 100%; height: 100%; display: grid; grid-template-rows: auto 1fr; overflow: hidden; }

  /* Hero */
  #algo-nqueen-view .nq-hero {
    padding: 16px 24px 12px;
    display: flex; gap: 18px; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, .06);
    background: rgba(8, 8, 24, .35);
    backdrop-filter: blur(14px) saturate(150%);
  }
  #algo-nqueen-view .nq-hero-left { display: flex; align-items: center; gap: 14px; }
  #algo-nqueen-view .nq-icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: inline-flex; align-items: center; justify-content: center; font-size: 24px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #1e1e2e; box-shadow: 0 6px 20px var(--accent-glow);
  }
  #algo-nqueen-view h1 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -.02em; color: #f1f5f9; }
  #algo-nqueen-view .nq-sub { color: #9399b2; font-size: 12.5px; margin-top: 4px; }
  #algo-nqueen-view .nq-tip {
    max-width: 560px; padding: 10px 14px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(167, 139, 250, .12), rgba(236, 72, 153, .08));
    border: 1px solid rgba(167, 139, 250, .3);
    color: #cdd6f4; font-size: 12.5px; line-height: 1.65;
  }
  #algo-nqueen-view .nq-tip strong { color: #d8b4fe; }

  /* Main grid */
  #algo-nqueen-view .nq-main {
    min-height: 0; display: grid;
    grid-template-columns: minmax(0, 1fr) 380px;
    grid-template-rows: 1fr auto;
    gap: 16px; padding: 16px; overflow: hidden;
  }
  #algo-nqueen-view .nq-left { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 14px; overflow: auto; padding-right: 4px; }

  /* Cards */
  #algo-nqueen-view .nq-card {
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
    overflow: hidden;
  }
  #algo-nqueen-view .nq-card-title {
    padding: 10px 16px; border-bottom: 1px solid rgba(255, 255, 255, .06);
    display: flex; justify-content: space-between; align-items: center;
    color: #cbd5e1; font-weight: 700; font-size: 13px;
  }
  #algo-nqueen-view .nq-tag {
    font-size: 11px; color: #d8b4fe; background: rgba(167, 139, 250, .14);
    border: 1px solid rgba(167, 139, 250, .3); padding: 2px 8px; border-radius: 999px;
  }

  /* Input */
  #algo-nqueen-view .nq-input-row {
    display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 14px 16px;
  }
  #algo-nqueen-view input[type="number"] {
    width: 100%; padding: 9px 12px; border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, .12);
    background: rgba(10, 10, 18, .7);
    color: #cdd6f4; font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 13px; outline: none; transition: all .2s;
  }
  #algo-nqueen-view input[type="number"]:focus { border-color: var(--accent-a); box-shadow: 0 0 0 3px rgba(167, 139, 250, .15); }
  #algo-nqueen-view .nq-go-btn {
    padding: 9px 18px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #1e1e2e; cursor: pointer; font-weight: 800; font-size: 13px;
    box-shadow: 0 4px 16px var(--accent-glow);
    transition: all .2s cubic-bezier(.34, 1.56, .64, 1);
  }
  #algo-nqueen-view .nq-go-btn:hover { transform: scale(1.04); box-shadow: 0 6px 22px rgba(167, 139, 250, .55); }
  #algo-nqueen-view .nq-go-btn:active { transform: scale(.97); }

  /* Stats */
  #algo-nqueen-view .nq-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  #algo-nqueen-view .nq-stat {
    position: relative; padding: 12px 14px 12px 18px;
    background: rgba(20, 18, 38, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 14px; overflow: hidden;
  }
  #algo-nqueen-view .nq-stat::before {
    content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 4px; border-radius: 4px;
  }
  #algo-nqueen-view .nq-stat--placed::before { background: linear-gradient(180deg, #a78bfa, #8b5cf6); }
  #algo-nqueen-view .nq-stat--placed .nq-stat-val { color: #d8b4fe; }
  #algo-nqueen-view .nq-stat--att::before { background: linear-gradient(180deg, #f472b6, #ec4899); }
  #algo-nqueen-view .nq-stat--att .nq-stat-val { color: #f9a8d4; }
  #algo-nqueen-view .nq-stat--sol::before { background: linear-gradient(180deg, #34d399, #10b981); }
  #algo-nqueen-view .nq-stat--sol .nq-stat-val { color: #6ee7b7; }
  #algo-nqueen-view .nq-stat-label { color: #9399b2; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; }
  #algo-nqueen-view .nq-stat-val {
    font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 22px; font-weight: 800; margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }

  /* Board */
  #algo-nqueen-view .nq-board-card { flex: 1; min-height: 280px; display: flex; flex-direction: column; }
  #algo-nqueen-view .nq-board-wrap {
    flex: 1; padding: 22px; display: flex; align-items: center; justify-content: center; overflow: auto;
  }
  #algo-nqueen-view #nqueen-board {
    display: grid; gap: 4px; background: #313244; padding: 5px; border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .4);
  }
  #algo-nqueen-view .nq-cell {
    width: 48px; height: 48px; min-width: 34px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px; font-size: 1.5rem;
    transition: all .28s cubic-bezier(.34, 1.56, .64, 1); will-change: transform, opacity;
  }
  #algo-nqueen-view .nq-cell.light { background: #31627d; }
  #algo-nqueen-view .nq-cell.dark { background: #3c5c6e; }
  #algo-nqueen-view .nq-cell.current {
    border: 3px solid #f0abfc; background: rgba(167, 139, 250, .22);
    animation: nq-pulse 1.8s ease-in-out infinite;
  }
  @keyframes nq-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, .6); }
    50% { box-shadow: 0 0 0 12px rgba(236, 72, 153, 0); }
  }
  #algo-nqueen-view .nq-cell.conflict {
    background: rgba(244, 63, 94, .35); box-shadow: 0 0 8px rgba(244, 63, 94, .3);
  }
  #algo-nqueen-view .nq-cell.queen {
    color: #f472b6; text-shadow: 0 0 20px rgba(236, 72, 153, .6);
    animation: nq-drop .42s cubic-bezier(.34, 1.56, .64, 1);
  }
  @keyframes nq-drop {
    0% { opacity: 0; transform: scale(.3) translateY(-30px); }
    50% { opacity: 1; transform: scale(1.15) translateY(6px); }
    100% { transform: scale(1) translate(0, 0); }
  }
  #algo-nqueen-view .nq-cell.queen-leaving {
    color: #f472b6; text-shadow: 0 0 20px rgba(236, 72, 153, .6);
    animation: nq-fade-out .28s ease-in forwards;
  }
  @keyframes nq-fade-out {
    0% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(.4) translateY(14px); }
  }

  /* Message */
  #algo-nqueen-view .nq-result {
    margin: 0 16px 16px; padding: 13px 16px; border-radius: 12px;
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(135deg, rgba(167, 139, 250, .12), rgba(236, 72, 153, .06));
    border-left: 3px solid var(--accent-a);
    line-height: 1.55; font-size: 13.5px; color: #e9d5ff;
  }
  #algo-nqueen-view .nq-result .nq-emoji {
    width: 34px; height: 34px; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center; font-size: 19px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #1e1e2e; box-shadow: 0 4px 14px var(--accent-glow); flex-shrink: 0;
  }

  /* Log */
  #algo-nqueen-view .nq-log {
    min-height: 90px; max-height: 150px; padding: 10px 14px;
    overflow: auto; background: rgba(8, 8, 24, .55);
    font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px;
    line-height: 1.65; color: #9399b2;
  }
  #algo-nqueen-view .nq-log div { padding: 2px 0; color: #9399b2; border-radius: 4px; }
  #algo-nqueen-view .nq-log div.active { color: #d8b4fe; font-weight: 700; }
  #algo-nqueen-view .nq-log .solution { color: #6ee7b7; font-weight: 700; }
  #algo-nqueen-view .nq-log .conflict { color: #fca5a5; font-weight: 700; }
  #algo-nqueen-view .nq-log::-webkit-scrollbar { width: 6px; }
  #algo-nqueen-view .nq-log::-webkit-scrollbar-thumb { background: rgba(74, 74, 107, .7); border-radius: 3px; }

  /* Code panel column */
  #algo-nqueen-view .nq-code {
    grid-row: 1 / 2; grid-column: 2 / 3; min-height: 0; display: flex;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px; overflow: hidden;
  }
  #algo-nqueen-view .nq-code [data-code-panel] { flex: 1; min-width: 0; }

  /* Controls bar */
  #algo-nqueen-view .nq-controls-bar {
    grid-column: 1 / -1; grid-row: 2 / 3;
    padding: 12px 18px;
    background: rgba(8, 8, 24, .55);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;
  }
  #algo-nqueen-view .nq-ctrl-btn {
    min-width: 64px; padding: 8px 16px; border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 10px; background: rgba(45, 45, 68, .8);
    color: #cdd6f4; cursor: pointer; font-weight: 700; font-size: 13px;
    transition: all .2s cubic-bezier(.34, 1.56, .64, 1);
  }
  #algo-nqueen-view .nq-ctrl-btn:hover:not(:disabled) { background: rgba(58, 58, 82, .9); transform: translateY(-1px); }
  #algo-nqueen-view .nq-ctrl-btn:disabled { opacity: .4; cursor: not-allowed; }
  #algo-nqueen-view .nq-ctrl-primary {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #1e1e2e; border-color: transparent;
  }
  #algo-nqueen-view .nq-ctrl-primary:hover:not(:disabled) { transform: scale(1.05); }
  #algo-nqueen-view .nq-counter { color: #9399b2; font-size: 13px; font-weight: 600; min-width: 110px; text-align: center; font-variant-numeric: tabular-nums; }
  #algo-nqueen-view .nq-speed-wrap { display: flex; align-items: center; gap: 8px; color: #9399b2; font-size: 12px; }
  #algo-nqueen-view #step-speed { width: 130px; accent-color: var(--accent-a); }

  @media (max-width: 1100px) {
    #algo-nqueen-view .nq-main { grid-template-columns: 1fr; grid-template-rows: none; overflow: auto; }
    #algo-nqueen-view .nq-code { grid-row: auto; grid-column: auto; min-height: 360px; }
    #algo-nqueen-view .nq-controls-bar { grid-row: auto; }
  }
</style>

<div class="nq-shell">
  <div class="nq-hero">
    <div class="nq-hero-left">
      <span class="nq-icon">👑</span>
      <div>
        <h1>N 皇后（回溯）</h1>
        <div class="nq-sub">LeetCode 51 · 逐行放置皇后，检查列与两条对角线冲突，递归后撤销</div>
      </div>
    </div>
    <div class="nq-tip"><strong>核心动画：</strong>当前格<span style="color:#f0abfc">紫色脉冲</span>；皇后落子<span style="color:#f9a8d4">从高处落下</span>；冲突格<span style="color:#fca5a5">红光警示</span>；找到解时统计滚动更新。</div>
  </div>

  <div class="nq-main">
    <div class="nq-left">
      <section class="nq-card">
        <div class="nq-card-title">输入 <span class="nq-tag">棋盘规模 N（1–8）</span></div>
        <div class="nq-input-row">
          <input id="nqueen-input" type="number" min="1" max="8" value="4" placeholder="N">
          <button id="nqueen-start" class="nq-go-btn">生成新棋盘</button>
        </div>
      </section>

      <div class="nq-stats">
        <div class="nq-stat nq-stat--placed"><div class="nq-stat-label">已放置</div><div class="nq-stat-val" id="placed-count">0</div></div>
        <div class="nq-stat nq-stat--att"><div class="nq-stat-label">尝试次数</div><div class="nq-stat-val" id="attempt-count">0</div></div>
        <div class="nq-stat nq-stat--sol"><div class="nq-stat-label">找到解</div><div class="nq-stat-val" id="solution-count">0</div></div>
      </div>

      <section class="nq-card nq-board-card">
        <div class="nq-card-title">棋盘 <span class="nq-tag">回溯放置</span></div>
        <div class="nq-board-wrap"><div id="nqueen-board"></div></div>
        <div class="nq-result">
          <span class="nq-emoji">👑</span>
          <div id="step-message">输入 N 后点击「生成新棋盘」观看回溯放置 + 冲突检测动画</div>
        </div>
      </section>

      <section class="nq-card">
        <div class="nq-card-title">执行日志</div>
        <div class="nq-log" id="nqueen-log"></div>
      </section>
    </div>

    <aside class="nq-code"><div data-code-panel></div></aside>

    <div class="nq-controls-bar">
      <button id="step-reset" class="nq-ctrl-btn">⏮ 重置</button>
      <button id="step-prev" class="nq-ctrl-btn">◀ 上一步</button>
      <button id="step-play" class="nq-ctrl-btn nq-ctrl-primary">▶ 播放</button>
      <button id="step-next" class="nq-ctrl-btn">下一步 ▶</button>
      <span id="step-counter" class="nq-counter">步骤: 0 / 0</span>
      <div class="nq-speed-wrap">
        <span>速度</span>
        <input id="step-speed" type="range" min="200" max="2000" step="100" value="600">
        <span id="step-speed-label" style="min-width:42px;">0.6s</span>
      </div>
    </div>
  </div>
</div>
