id: climb-stairs
name: "爬楼梯"
nameEn: "Climbing Stairs"
defaultStage: "stage-1"
category: "dynamic-programming"
icon: "🪜"
difficulty: 1
levelOrder: 2
learningGoal: "理解组合状态转移与物理意义映射：每次跨 1 步或 2 步的路径方案数"
description: "爬楼梯问题（LeetCode 70）：每次只能爬 1 阶或 2 阶，到达第 n 阶的方法数为到达第 n-1 阶与第 n-2 阶方法数之和。"
defaultParams:
  n: 5

directions:
  forward:
    label: "自顶向下 (目标分解)"
    branches:
      - name: "step1"
        delta: [-1, 0]
        label: "跨 1 阶"
        codeVar: "one_step"
        arrow: "↙️"
      - name: "step2"
        delta: [-2, 0]
        label: "跨 2 阶"
        codeVar: "two_step"
        arrow: "↘️"
    combineFormula: "one_step + two_step"

stages:
  stage-1:
    shortName: "递归"
    type: "recursion"
    timeBadge: "O(2ⁿ)"
    badgeBg: "bg-slate-100 text-slate-700"
    name:
      forward: "阶段 1: 朴素递归 (状态树指数展开)"
    desc:
      forward: "从第 n 阶向下递归分解为跨 1 步 (n-1) 与跨 2 步 (n-2) 的方案之和。"
    variants:
      standard:
        variantLabel: "标准递归版"
        title:
          forward: "ClimbStairs_Recursive.java"
        code:
          forward:
            title: "ClimbStairs_Recursive.java"
            source: |
              class Solution {
                  public int climbStairs(int n) { // @step:entry
                      if (n <= 1) return 1; // @step:boundary
                      int one = climbStairs(n - 1); // @step:branch_left // 跨 1 步分支
                      int two = climbStairs(n - 2); // @step:branch_right // 跨 2 步分支
                      return one + two;             // @step:combine // 汇总方案数
                  }
              }

  stage-2:
    shortName: "记忆化"
    type: "memoization"
    timeBadge: "O(n)"
    badgeBg: "bg-purple-100 text-purple-700"
    name:
      forward: "阶段 2: 记忆化搜索 (消除重叠子问题)"
    desc:
      forward: "记录各台阶计算结果，防止同一高度被重复递归计算。"
    variants:
      array_memo:
        variantLabel: "一维备忘录版"
        title:
          forward: "ClimbStairs_Memo.java"
        code:
          forward:
            title: "ClimbStairs_Memo.java"
            source: |
              class Solution {
                  public int climbStairs(int n) {
                      int[] memo = new int[n + 1];
                      return dfs(n, memo);
                  }
                  private int dfs(int n, int[] memo) { // @step:entry
                      if (n <= 1) return 1; // @step:boundary
                      if (memo[n] != 0) return memo[n]; // @step:cache_hit // 剪枝命中
                      int one = dfs(n - 1, memo);  // @step:branch_left
                      int two = dfs(n - 2, memo);  // @step:branch_right
                      return memo[n] = one + two;  // @step:combine
                  }
              }

  stage-3:
    shortName: "递推DP"
    type: "tabulation-2d"
    timeBadge: "O(n)"
    badgeBg: "bg-emerald-100 text-emerald-700"
    name:
      forward: "阶段 3: 自底向上递推填表 (DP 数组)"
    desc:
      forward: "dp[i] 表示到达第 i 阶的方案总数，dp[i] = dp[i-1] + dp[i-2]。"
    variants:
      standard:
        variantLabel: "数组填表版"
        title:
          forward: "ClimbStairs_DP.java"
        code:
          forward:
            title: "ClimbStairs_DP.java"
            source: |
              class Solution {
                  public int climbStairs(int n) {
                      if (n <= 1) return 1;
                      int[] dp = new int[n + 1]; // @step:init
                      dp[0] = 1; // @step:init_val
                      dp[1] = 1; // @step:init_val
                      for (int i = 2; i <= n; i++) { // @step:loop_i
                          dp[i] = dp[i - 1] + dp[i - 2]; // @step:transfer
                      }
                      return dp[n]; // @step:return
                  }
              }

  stage-4:
    shortName: "空间优化"
    type: "space-optimized-1d"
    timeBadge: "O(1) ★"
    badgeBg: "bg-amber-100 text-amber-700"
    name:
      forward: "阶段 4: 空间压缩双变量滚动 (O(1) 状态机)"
    desc:
      forward: "仅需维护到达前一阶与前两阶的方案数，空间复杂度压缩至 O(1)。"
    variants:
      two_vars:
        variantLabel: "双变量滚动版"
        title:
          forward: "ClimbStairs_SpaceOptimized.java"
        code:
          forward:
            title: "ClimbStairs_SpaceOptimized.java"
            source: |
              class Solution {
                  public int climbStairs(int n) {
                      if (n <= 1) return 1;
                      int p = 1, q = 1; // @step:init
                      for (int i = 2; i <= n; i++) {
                          int r = p + q; // @step:accumulate
                          p = q;         // @step:fetch_down
                          q = r;         // @step:fetch_right
                      }
                      return q; // @step:return
                  }
              }
