id: palindromic-substrings
name: 回文子串
category: dynamic-programming
difficulty: medium
defaultStage: stage-1
defaultDirection: forward

defaultParams:
  s: "aaa"

problem:
  title: "LeetCode 647. 回文子串"
  difficulty: "Medium"
  description: |
    给你一个字符串 <code>s</code> ，请你统计并返回这个字符串中 <strong>回文子串</strong> 的数目。

    <strong>回文字符串</strong> 是正着读和倒过来读一样的字符串。

    <strong>子字符串</strong> 是字符串中的由连续字符组成的一个序列。
  examples:
    - input: 's = "abc"'
      output: "3"
      explanation: "三个回文子串: \"a\", \"b\", \"c\""
    - input: 's = "aaa"'
      output: "6"
      explanation: "六个回文子串: \"a\", \"a\", \"a\", \"aa\", \"aa\", \"aaa\""
  constraints:
    - "1 <= s.length <= 1000"
    - "s 由小写英文字母组成"

directions:
  forward:
    label: "顺推 (正序)"
    name: 逆序区间填表 (i从底向上, j从左到右)
    description: 由短区间向长区间扩展，dp[i][j] 依赖左下方 dp[i+1][j-1]
    branches:
      - name: 继承内层子区间 (左下方)
        delta: [1, -1]
        arrow: ↙
        description: 当 s[i] == s[j] 且 j - i > 1 时，回文性取决于 dp[i+1][j-1]
      - name: 基础回文判定
        delta: [0, 0]
        arrow: •
        description: 长度 <= 2 且端点相同直接判定为回文
  reverse:
    label: "逆推 (倒序)"
    name: 中心扩散视角
    description: 依次以每个单字符或双字符间隙为中心向两侧扩散判断

stages:
  stage-1:
    shortName: "递归"
    name: "阶段 1: 区间递归判断"
    desc: 穷举所有子串区间 [i, j]，递归判断 s[i..j] 是否为回文串并累加计数。
    timeComplexity: "O(n^3)"
    spaceComplexity: "O(n)"
    variants:
      standard:
        name: 标准递归区间判定
        desc: 双重循环遍历区间，递归验证首尾与内层
        code: |
          public int countSubstrings(String s) { // @step:entry
              int n = s.length();
              int count = 0;
              for (int i = 0; i < n; i++) { // @step:loop_ij
                  for (int j = i; j < n; j++) {
                      if (isPalindrome(s, i, j)) { // @step:check
                          count++; // @step:count_inc
                      }
                  }
              }
              return count; // @step:return
          }

          private boolean isPalindrome(String s, int i, int j) { // @step:dfs_entry
              if (i >= j) return true; // @step:boundary
              if (s.charAt(i) != s.charAt(j)) return false; // @step:diff
              return isPalindrome(s, i + 1, j - 1); // @step:recurse
          }

  stage-2:
    shortName: "记忆化"
    name: "阶段 2: 记忆化搜索"
    desc: 引入 Boolean[][] memo 缓存已验证区间的回文状态，消除子区间重复判断。
    timeComplexity: "O(n^2)"
    spaceComplexity: "O(n^2)"
    variants:
      standard:
        name: 二维备忘录区间优化
        desc: 记忆化二维区间 [i, j] 的回文判定结果
        code: |
          public int countSubstrings(String s) { // @step:entry
              int n = s.length();
              Boolean[][] memo = new Boolean[n][n]; // @step:memo_init
              int count = 0;

              for (int i = 0; i < n; i++) { // @step:loop_ij
                  for (int j = i; j < n; j++) {
                      if (isPalindrome(s, i, j, memo)) { // @step:check
                          count++; // @step:count_inc
                      }
                  }
              }
              return count; // @step:return
          }

          private boolean isPalindrome(String s, int i, int j, Boolean[][] memo) { // @step:dfs_entry
              if (i >= j) return true; // @step:boundary
              if (memo[i][j] != null) return memo[i][j]; // @step:cache_hit
              if (s.charAt(i) != s.charAt(j)) return memo[i][j] = false; // @step:diff
              return memo[i][j] = isPalindrome(s, i + 1, j - 1, memo); // @step:recurse
          }

  stage-3:
    shortName: "二维DP"
    name: "阶段 3: 区间二维DP"
    desc: 构建 n×n 的上三角 DP 矩阵，从底向上 (i 从 n-1 到 0)、从左到右 (j 从 i 到 n-1) 顺序填表。
    timeComplexity: "O(n^2)"
    spaceComplexity: "O(n^2)"
    variants:
      standard:
        name: 上三角区间动态规划
        desc: 严格自底向上推导，解决 dp[i+1][j-1] 逆向拓扑依赖
        code: |
          public int countSubstrings(String s) { // @step:entry
              int n = s.length();
              boolean[][] dp = new boolean[n][n]; // @step:init
              int count = 0;

              for (int i = n - 1; i >= 0; i--) { // @step:loop_i
                  for (int j = i; j < n; j++) { // @step:loop_j
                      if (s.charAt(i) == s.charAt(j)) { // @step:cond
                          if (j - i <= 1) { // @step:transfer_short
                              dp[i][j] = true;
                              count++;
                          } else if (dp[i + 1][j - 1]) { // @step:transfer_sub
                              dp[i][j] = true;
                              count++;
                          }
                      }
                  }
              }
              return count; // @step:return
          }

  stage-4:
    shortName: "中心扩散"
    name: "阶段 4: 中心扩散法"
    desc: 遍历 2n-1 个回文中心（单字符与双字符中心），双指针向两侧扩散，将空间复杂度从 O(n^2) 降至 O(1)。
    timeComplexity: "O(n^2)"
    spaceComplexity: "O(1)"
    variants:
      center_spread:
        name: 双向中心扩散优化
        desc: 极简双指针原地向外探索回文边界
        code: |
          public int countSubstrings(String s) { // @step:entry
              int n = s.length();
              int count = 0;
              for (int center = 0; center < 2 * n - 1; center++) { // @step:loop_center
                  int l = center / 2;
                  int r = l + (center % 2); // 奇数中心 l==r, 偶数中心 r==l+1

                  while (l >= 0 && r < n && s.charAt(l) == s.charAt(r)) { // @step:spread
                      count++; // @step:match_inc
                      l--;
                      r++;
                  }
              }
              return count; // @step:return
          }

analysis:
  coreInsight: |
    回文子串问题的本质是区间动态规划：
    1. 状态定义：<code>dp[i][j]</code> 为布尔值，表示子串 <code>s[i..j]</code> 是否为回文子串。
    2. 状态转移：
       - 当 <code>s[i] != s[j]</code> 时：<code>dp[i][j] = false</code>。
       - 当 <code>s[i] == s[j]</code> 时：
         - 若 <code>j - i <= 1</code>（单字符如 "a" 或双字符如 "aa"）：必为回文，<code>dp[i][j] = true</code>。
         - 若 <code>j - i > 1</code>（如 "aba"、"abcca"）：回文性完全取决于内层子串 <code>dp[i+1][j-1]</code>。
    3. 拓扑遍历顺序：
       因为 <code>dp[i][j]</code> 依赖于其左下方的 <code>dp[i+1][j-1]</code>，必须保证 <code>i+1</code> 行先于 <code>i</code> 行计算完毕，因此外层循环 <code>i</code> 必须倒序（从 <code>n-1</code> 递减至 <code>0</code>），内层循环 <code>j</code> 正序（从 <code>i</code> 递增至 <code>n-1</code>）。
  dimensionComparison:
    - dimension: "阶段 1 递归区间判定"
      timeComplexity: "O(n^3)"
      spaceComplexity: "O(n)"
      pros: "逻辑简单直观"
      cons: "重复验证内层回文，整体耗时高"
    - dimension: "阶段 2 记忆化搜索"
      timeComplexity: "O(n^2)"
      spaceComplexity: "O(n^2)"
      pros: "剪除重复区间判断"
      cons: "递归栈调用开销"
    - dimension: "阶段 3 二维 DP 填表"
      timeComplexity: "O(n^2)"
      spaceComplexity: "O(n^2)"
      pros: "上三角拓扑清晰，填表直观"
      cons: "占用 O(n^2) 矩阵空间"
    - dimension: "阶段 4 中心扩散法"
      timeComplexity: "O(n^2)"
      spaceComplexity: "O(1)"
      pros: "空间压缩至 O(1)，无额外存储开销"
      cons: "需统一奇数中心与偶数中心"

faqs:
  - q: "为什么遍历 i 必须倒序，而不能正序？"
    a: "因为状态转移方程 dp[i][j] = dp[i+1][j-1] 中，i+1 在 i 的下方。如果正序遍历，计算第 i 行时第 i+1 行尚未计算，无法取得正确的内层回文状态。"
  - q: "为什么一共有 2n-1 个回文中心？"
    a: "长度为 n 的字符串有 n 个单字符中心（奇数长度回文）和 n-1 个双字符之间的空隙中心（偶数长度回文），总计 n + (n - 1) = 2n - 1 个中心。"
