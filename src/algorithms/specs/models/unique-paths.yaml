              class Solution {
                  private int[] memo;
                  public int uniquePaths(int m, int n) {
                      memo = new int[n]; // @step:init
                      for (int j = 0; j < n; j++) memo[j] = 1; // @step:init_row // 外层for初始化最底行
                      for (int i = m - 2; i >= 0; i--) { // @step:loop_i
                          for (int j = n - 2; j >= 0; j--) { // @step:loop_j
                              int down = memo[j]; // @step:fetch_down
                              int right = memo[j + 1]; // @step:fetch_right
                              memo[j] = right + down; // @step:accumulate
                          }
                      }
                      return memo[0]; // @step:return
                  }
              }
