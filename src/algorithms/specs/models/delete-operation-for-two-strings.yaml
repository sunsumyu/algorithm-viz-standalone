# ==============================================================================
# 🏆 [GOLDEN BASELINE MODEL] 黄金基准模型规范
# 本规范为「两个字符串的删除操作 (Delete Operation for Two Strings)」四阶段全演化标准实现。
# 包含：双字符决策分支、空串 Base Case 初始化、二维 DP 矩阵与一维滚动空间压缩。
# ==============================================================================

id: delete-operation-for-two-strings
name: "两个字符串的删除操作"
nameEn: "Delete Operation for Two Strings"
defaultStage: "stage-1"
category: "dynamic-programming"
icon: "🗑️"
difficulty: 2
levelOrder: 9
learningGoal: "掌握双字符串状态定义、字符匹配无损继承与字符不匹配双向删除最小化转移"
description: "给定两个单词 word1 和 word2，返回使得两单词相同所需的最少删除字符步数。状态转移 dp[i][j] = word1[i-1]==word2[j-1] ? dp[i-1][j-1] : min(dp[i-1][j], dp[i][j-1]) + 1。"
defaultParams:
  word1: "sea"
  word2: "eat"
  s: "sea"
  t: "eat"

problem:
  leetcodeId: 583
  title: "两个字符串的删除操作"
  difficulty: "中等"
  tags: ["字符串", "动态规划", "双串DP"]
  description: "给定两个单词 <code>word1</code> 和 <code>word2</code> ，返回使得 <code>word1</code> 和 <code>word2</code> <strong>相同所需的最小步数</strong> 。<br/><br/>每步可以删除任意一个字符串中的一个字符。<br/><br/><strong>两路思维</strong>：<br/>• <strong>直接 DP 转移</strong>：<code>dp[i][j]</code> 为使 <code>word1[0..i-1]</code> 与 <code>word2[0..j-1]</code> 相同所需最少删除次数。<br/>• <strong>LCS 间接求法</strong>：两串相同保留部分即为最长公共子序列 (LCS)，答案为 <code>word1.length + word2.length - 2 * LCS(word1, word2)</code>。"
  examples:
    - input: 'word1 = "sea", word2 = "eat"'
      output: "2"
      explanation: "第一步将 \"sea\" 变为 \"ea\" (删去 's')，第二步将 \"eat\" 变为 \"ea\" (删去 't')。"
    - input: 'word1 = "leetcode", word2 = "etco"'
      output: "4"
      explanation: "最少需要删除 4 个字符以使两单词变为 \"etco\"。"
  constraints:
    - "1 <= word1.length, word2.length <= 500"
    - "word1 和 word2 只包含小写英文字母"
  leetcodeUrl: "https://leetcode.cn/problems/delete-operation-for-two-strings/"

