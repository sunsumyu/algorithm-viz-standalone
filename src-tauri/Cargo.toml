[package]
name = "algorithm-viz"
version = "1.0.0"
description = "Algorithm animation visualization desktop app"
authors = ["Algorithm Viz"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "algorithm_viz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["devtools"] }
tauri-plugin-log = "2"
