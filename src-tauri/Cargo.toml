[package]
name = "algorithm-viz"
version = "1.0.0"
description = "Algorithm animation visualization desktop app"
authors = ["Algorithm Viz"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "algorithm_viz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["devtools"] }
tauri-plugin-log = "2"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
base64 = "0.22"
hkdf = "0.12"
aes-gcm = "0.10"
zeroize = { version = "1.8", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

